<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>تحديد الموقع - OpenStreetMap</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/vendor/leaflet/leaflet.css">
<style>
html,body,#map{height:100%;width:100%;margin:0;padding:0;background:#e8edf0}
.leaflet-control-attribution{font-size:10px}
.map-hint{position:absolute;z-index:1000;top:calc(12px + 8.5em);left:12px;right:12px;max-width:440px;margin:auto;padding:9px 12px;border-radius:10px;background:#ffffffed;color:#263445;font:14px sans-serif;text-align:center;box-shadow:0 2px 10px #0002;pointer-events:none}
.map-error{position:absolute;z-index:1001;bottom:12px;left:12px;right:12px;padding:10px;border-radius:10px;background:#fff0f0;color:#9b1c1c;font:13px sans-serif;text-align:center;display:none}.map-hint{border:1px solid #d4e3ef}.leaflet-control-zoom a{width:42px!important;height:42px!important;line-height:42px!important;font-size:20px!important}.leaflet-control-attribution{background:#fffffff0;padding:3px 6px!important;border-radius:6px}
</style>
</head>
<body>
<div id="map"></div>
<div class="map-hint" id="hint">المس الخريطة لتحديد الموقع أو اسحب العلامة لتعديلها</div>
<div class="map-error" id="mapError">تعذر تحميل الخريطة. تحقق من اتصال الإنترنت ثم أعد فتح محدد الموقع.</div>
<script src="file:///android_asset/assets-local/vendor/leaflet/leaflet.js"></script>
<script>
(function(){
'use strict';
var errorBox=document.getElementById('mapError');
if(!window.L){errorBox.style.display='block';errorBox.textContent='تعذر تحميل مكوّن الخريطة. تحقق من اتصال الإنترنت.';return;}
var map=L.map('map',{zoomControl:true,attributionControl:true,preferCanvas:true});
map.setView([15.5,47.5],6); // Start near Yemen's operating area without inventing a selected point.
var marker=null;
var tileSources=[
 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
];
var tileIndex=0,fallbackPending=false;
var tiles=L.tileLayer(tileSources[tileIndex],{maxZoom:19,attribution:'&copy; CARTO, Esri, OpenStreetMap contributors'});
tiles.on('tileerror',function(){
 if(fallbackPending)return;
 if(tileIndex>=tileSources.length-1){errorBox.style.display='block';errorBox.textContent='تعذر الوصول إلى مزودي الخرائط. الإحداثيات لا تزال قابلة للإدخال يدويًا.';return;}
 fallbackPending=true;errorBox.style.display='block';errorBox.textContent='جارٍ تجربة مصدر خرائط بديل…';
 window.setTimeout(function(){tiles.setUrl(tileSources[++tileIndex]);window.setTimeout(function(){fallbackPending=false;},7000);},600);
});
tiles.on('tileload',function(){errorBox.style.display='none';});
tiles.addTo(map);
function report(lat,lon){
 var point=[lat,lon];
 if(marker){marker.setLatLng(point);}
 else{
  marker=L.marker(point,{draggable:true}).addTo(map);
  marker.on('dragend',function(){var p=marker.getLatLng();report(p.lat,p.lng);});
 }
 if(window.MapSelectionBridge)window.MapSelectionBridge.onLocationSelected(lat,lon);
 document.getElementById('hint').textContent='الموقع المحدد: '+lat.toFixed(6)+', '+lon.toFixed(6);
}
map.on('click',function(event){report(event.latlng.lat,event.latlng.lng);});
window.setInitialSelection=function(lat,lon){
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 map.setView([lat,lon],16);report(lat,lon);
};
window.setCurrentLocation=window.setInitialSelection;
if(window.MapSelectionBridge)window.MapSelectionBridge.onMapReady();
})();
</script>
</body>
</html>
