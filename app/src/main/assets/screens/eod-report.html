<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – تقرير نهاية اليوم</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحد (بنفسجي – ذهبي) – مستوحى من تقارير العملاء
           ============================================================ */
        :root {
            /* === الوضع الفاتح (Light - افتراضي) === */
            --bg-color: #f5f3ff;
            --surface-color: #ede9fe;
            --surface-elevated: rgba(255, 255, 255, 0.88);
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-glass: rgba(0, 0, 0, 0.03);
            --bg-glass-light: rgba(0, 0, 0, 0.06);

            --primary-color: #7c4dff;
            --primary-dim: rgba(124, 77, 255, 0.12);
            --primary-hover: #5e35b1;

            --accent-color: #c99f1e;
            --accent-dim: rgba(201, 159, 30, 0.14);
            --gold-primary: #c99f1e;

            --violet-primary: #a882ff;
            --violet-dark: #7c4dff;

            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;

            --text-color: #1a1025;
            --text-muted: #6b5b7a;
            --text-secondary: #3d2a5c;

            --border-color: #d4c8e8;
            --border-glow: rgba(168, 130, 255, 0.25);
            --border-style: solid;
            --border-width: 1px;

            --shadow-glow: 0 0 30px rgba(168, 130, 255, 0.15);
            --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.1);

            --glass-bg: rgba(245, 243, 255, 0.92);
            --header-bg: rgba(245, 243, 255, 0.9);
            --card-hover-bg: rgba(124, 77, 255, 0.05);

            --fab-shadow: rgba(124, 77, 255, 0.3);
            --toast-bg: #fdfcff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: rgba(124, 77, 255, 0.3);

            --skeleton-bg: #e0d8f0;
            --skeleton-shine: #f5f3ff;

            --modal-border-color: #d4c8e8;
            --modal-border-style: solid;

            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #d4c8e8;
            --input-border-style: solid;

            --data-text-color: #1a1025;
            --data-text-muted: #6b5b7a;

            --radius-card: 20px;
            --radius-small: 14px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            /* === الوضع المظلم (Dark) === */
            --bg-color: #0b0719;
            --surface-color: #14102b;
            --surface-elevated: rgba(26, 20, 56, 0.75);
            --bg-card: rgba(26, 20, 56, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --bg-glass-light: rgba(255, 255, 255, 0.08);

            --primary-color: #a882ff;
            --primary-dim: rgba(168, 130, 255, 0.15);
            --primary-hover: #7c4dff;

            --accent-color: #f5c842;
            --accent-dim: rgba(245, 200, 66, 0.15);
            --gold-primary: #f5c842;

            --violet-primary: #a882ff;
            --violet-dark: #7c4dff;

            --text-color: #ede7ff;
            --text-muted: #7a6da0;
            --text-secondary: #b4a7e6;

            --border-color: rgba(168, 130, 255, 0.15);
            --border-glow: rgba(168, 130, 255, 0.25);

            --shadow-glow: 0 0 30px rgba(168, 130, 255, 0.15);
            --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.6);

            --glass-bg: rgba(11, 7, 25, 0.94);
            --header-bg: rgba(11, 7, 25, 0.85);
            --card-hover-bg: rgba(255, 255, 255, 0.04);

            --fab-shadow: rgba(168, 130, 255, 0.3);
            --toast-bg: #14102b;

            --scrollbar-track: transparent;
            --scrollbar-thumb: rgba(168, 130, 255, 0.3);

            --skeleton-bg: #1e1836;
            --skeleton-shine: #2a234a;

            --modal-border-color: rgba(168, 130, 255, 0.15);
            --modal-border-style: solid;

            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(168, 130, 255, 0.25);
            --input-border-style: solid;

            --data-text-color: #ede7ff;
            --data-text-muted: #b4a7e6;
        }

        /* ============================================================
           الأساسيات
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            transition: background 0.4s ease, color 0.4s ease;
            touch-action: pan-y;
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(168, 130, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(245, 200, 66, 0.04) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
        }

        [data-theme="dark"] body,
        html[data-theme="dark"] body {
            background-color: #0b0719;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

        /* ===== Report Source Banner ===== */
        .report-source-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--bg-glass);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-muted);
            position: relative;
            z-index: 5;
        }
        .report-source-banner[data-state="available"] { color: var(--success); }
        .report-source-banner[data-state="unavailable"] { color: var(--warning); }
        .report-source-banner i { font-size: 0.8rem; }

        /* ===== Pull-to-Refresh ===== */
        .pull-indicator {
            position: fixed;
            top: -60px;
            left: 0; right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: top 0.2s ease;
            z-index: 50;
            background: var(--surface-elevated);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            pointer-events: none;
        }
        .pull-indicator.active { top: 0; }
        .pull-indicator i { margin-left: 8px; transition: transform 0.3s; }
        .pull-indicator.loading i { animation: spin 1s linear infinite; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px; height: 56px;
            border: 5px solid rgba(168, 130, 255, 0.15);
            border-radius: 50%;
            border-top: 5px solid var(--primary-color);
            animation: spin 0.9s linear infinite;
        }

        /* ===== Skeleton ===== */
        .skeleton-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
        .skeleton-card {
            background: var(--surface-elevated);
            border-radius: var(--radius-card);
            padding: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent 0%, var(--skeleton-shine) 50%, transparent 100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-row { height: 12px; background: var(--skeleton-bg); border-radius: 6px; margin-bottom: 8px; }
        .skeleton-row.short { width: 40%; }
        .skeleton-row.medium { width: 60%; }
        .skeleton-row.long { width: 80%; }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 18px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            transition: background 0.4s ease;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--primary-color);
            font-size: 1.1em;
        }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            touch-action: manipulation;
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 130, 255, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-color);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }

        .ai-badge {
            background: linear-gradient(135deg, #a882ff, #7c4dff);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-right: 6px;
            vertical-align: middle;
            box-shadow: 0 0 20px rgba(168, 130, 255, 0.3);
        }

        /* ============================================================
           البحث والفلاتر
           ============================================================ */
        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: var(--radius-small);
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-color);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
        }
        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 25px var(--border-glow);
            background: var(--bg-glass-light);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 7px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover:not(.active) {
            border-color: var(--violet-primary);
            color: var(--violet-primary);
            background: var(--bg-glass-light);
        }
        .filter-chip.active {
            background: linear-gradient(135deg, var(--primary-color), var(--violet-dark));
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.25);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            opacity: 0.75;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }
        .stat-card:active { transform: scale(0.97); }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 10px;
            background: var(--bg-glass-light);
        }
        .stat-icon.blue { background: rgba(168, 130, 255, 0.15); color: var(--violet-primary); }
        .stat-icon.green { background: rgba(16, 185, 129, 0.14); color: var(--success); }
        .stat-icon.orange { background: rgba(245, 200, 66, 0.16); color: var(--gold-primary); }
        .stat-icon.red { background: rgba(239, 68, 68, 0.14); color: var(--error); }
        .stat-icon.purple { background: rgba(168, 130, 255, 0.15); color: var(--violet-primary); }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin: 4px 0 4px;
            color: var(--data-text-color);
            direction: ltr;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            margin-top: 8px;
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 700;
        }
        .stat-trend.up { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .stat-trend.down { background: rgba(239, 68, 68, 0.15); color: var(--error); }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           حاويات البطاقات
           ============================================================ */
        .cards-container {
            padding: 0 16px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        /* === Bank Card === */
        .bank-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            transition: var(--transition);
            cursor: pointer;
            touch-action: pan-y;
            overflow: hidden;
        }
        .bank-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            opacity: 0.6;
        }
        .bank-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
            background: var(--card-hover-bg);
        }
        .bank-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-dim), 0 4px 20px rgba(168, 130, 255, 0.1);
        }
        .bank-card:active { transform: scale(0.98); transition-duration: 0.05s; }

        .bank-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .bank-card .card-header .card-avatar {
            width: 48px; height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.3);
        }
        .bank-card .card-header .card-status {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid;
        }
        .card-status.active { background: rgba(16, 185, 129, 0.12); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .card-status.inactive { background: rgba(148, 163, 184, 0.12); color: var(--text-muted); border-color: rgba(148, 163, 184, 0.3); }

        .bank-card .card-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--data-text-color);
            margin-bottom: 3px;
        }
        .bank-card .card-code {
            font-size: 0.75rem;
            color: var(--gold-primary);
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 700;
            margin-bottom: 8px;
            direction: ltr;
            display: inline-block;
            background: rgba(245, 200, 66, 0.08);
            padding: 2px 10px;
            border-radius: 6px;
        }
        .bank-card .card-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin: 10px 0;
        }
        .bank-card .card-details .detail-item {
            font-size: 0.8rem;
            color: var(--data-text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bank-card .card-details .detail-item i { font-size: 0.8rem; color: var(--text-muted); }
        .bank-card .card-actions { display: flex; gap: 8px; }
        .bank-card .card-actions .card-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .bank-card .card-actions .card-btn:active { transform: scale(0.95); }
        .bank-card .card-actions .card-btn:hover {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .bank-card .card-actions .card-btn.danger:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border-color: var(--error);
        }

        /* === Account Card === */
        .account-card {
            background: var(--bg-glass);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .account-card:hover {
            border-color: var(--primary-color);
            background: var(--card-hover-bg);
        }
        .account-card .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .account-card .account-name {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--data-text-color);
        }
        .account-card .account-number {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }
        .account-card .account-balance {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-color);
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }
        .account-card .account-details {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            color: var(--text-muted);
        }
        .account-card .account-details .badge-type {
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid;
        }
        .badge-type.current { background: rgba(16, 185, 129, 0.12); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
        .badge-type.savings { background: rgba(59, 130, 246, 0.12); color: #3b82f6; border-color: rgba(59, 130, 246, 0.3); }
        .badge-type.deposit { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; border-color: rgba(139, 92, 246, 0.3); }
        .badge-type.loan { background: rgba(239, 68, 68, 0.12); color: var(--error); border-color: rgba(239, 68, 68, 0.3); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.9;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
            display: block;
            color: var(--primary-color);
        }

        /* ============================================================
           الزر العائم (FAB) - مُخفى نهائياً مع الإبقاء على العنصر
           ============================================================ */
        .fab { display: none !important; }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(145deg, var(--primary-color), var(--violet-dark));
            color: #fff;
            width: 44px; height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 25px rgba(168, 130, 255, 0.3);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.15);
            touch-action: manipulation;
            font-size: 1rem;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 120px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 14px 12px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-btn {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            padding: 14px 8px;
            border-radius: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 80px;
            text-align: center;
            font-size: 0.8rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.6rem; }
        .sidebar-btn span { font-size: 0.7rem; margin-top: 2px; }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 8px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            font-weight: 700;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--primary-color); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 25px rgba(168, 130, 255, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 10px;
            box-shadow: 0 0 15px var(--primary-color);
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--surface-color);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 22px;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color);
            border-bottom: none;
            box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--primary-color);
        }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }
        .modal-body { padding: 4px 0 8px; }
        .modal-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 0 0;
            border-top: 1px solid var(--border-color);
            margin-top: 12px;
        }

        /* ===== فلتر التقرير ===== */
        .report-filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .report-filter-row .form-group { margin-bottom: 0; }
        .report-filter-row .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .report-filter-row .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-color);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
        }
        .report-filter-row .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }
        .report-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .report-results {
            margin-top: 20px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--bg-glass);
        }
        .report-results table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }
        .report-results table th {
            background: var(--primary-dim);
            color: var(--primary-color);
            padding: 10px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 800;
            border-bottom: 1px solid var(--border-color);
        }
        .report-results table td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            color: var(--data-text-color);
        }
        .report-results table tr:hover { background: var(--card-hover-bg); }
        .report-results .empty-state { padding: 30px; text-align: center; color: var(--text-muted); }

        /* ===== حقول النموذج ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { color: var(--text-muted); font-size: 0.78rem; font-weight: 700; }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-color);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
        }
        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-dim);
            background: var(--bg-glass-light);
        }
        .form-input::placeholder { color: var(--text-muted); }
        textarea.form-input { resize: vertical; min-height: 90px; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--violet-dark));
            color: #fff;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            touch-action: manipulation;
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.25);
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(168, 130, 255, 0.35);
        }

        /* ===== تفاصيل ===== */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .detail-item {
            padding: 12px;
            border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
        }
        .detail-item span {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .detail-item strong {
            display: block;
            overflow-wrap: anywhere;
            color: var(--data-text-color);
            font-size: 0.85rem;
        }
        .raw-json {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(11, 7, 25, 0.9);
            color: #dbeafe;
            padding: 14px;
            border-radius: 12px;
            font: 0.72rem/1.5 monospace;
            max-height: 300px;
            overflow: auto;
            border: 1px solid var(--border-color);
        }

        /* ============================================================
           بطاقات البيانات العامة
           ============================================================ */
        .page-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px 0 90px;
        }
        .data-panel {
            margin: 0 16px;
            padding: 18px 16px;
            border-radius: var(--radius-card);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glow);
        }
        .section-title {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .section-title h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 i { color: var(--primary-color); }
        .section-title .count-badge {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-radius: 30px;
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 800;
            border: 1px solid var(--border-color);
        }
        .data-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .data-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
            transform: translateY(-2px);
        }
        .data-card-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }
        .data-card-title {
            font-weight: 800;
            color: var(--data-text-color);
            font-size: 0.95rem;
        }
        .data-card-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            margin-top: 4px;
            line-height: 1.7;
        }
        .data-card-value {
            color: var(--accent-color);
            font-weight: 900;
            white-space: nowrap;
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }
        .data-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .data-field {
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--bg-glass-light);
            min-width: 0;
            border: 1px solid var(--border-color);
        }
        .data-field span {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .data-field strong {
            display: block;
            margin-top: 3px;
            overflow-wrap: anywhere;
            color: var(--data-text-color);
            font-size: 0.8rem;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        /* ============================================================
           الأزرار
           ============================================================ */
        .btn {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 9px 14px;
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: var(--bg-glass-light);
            transform: translateY(-1px);
        }
        .btn:active { transform: scale(0.95); }
        .btn.primary {
            background: linear-gradient(135deg, var(--primary-color), var(--violet-dark));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.25);
        }
        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 35px rgba(168, 130, 255, 0.35);
            color: #fff;
        }
        .btn.danger { color: var(--error); border-color: rgba(239, 68, 68, 0.3); }
        .btn.danger:hover { background: rgba(239, 68, 68, 0.12); color: var(--error); border-color: var(--error); }
        .btn.warning { color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }
        .btn.warning:hover { background: rgba(245, 158, 11, 0.12); color: var(--warning); border-color: var(--warning); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* ============================================================
           أدوات مساعدة
           ============================================================ */
        .settings-wrap { padding: 0 16px; }
        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 18px;
        }
        .settings-line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px dashed var(--border-color);
            align-items: center;
        }
        .settings-line:last-child { border-bottom: 0; }
        .settings-line label { font-size: 0.82rem; color: var(--text-muted); }
        .settings-line input { max-width: 230px; }
        .ai-output {
            min-height: 100px;
            white-space: pre-wrap;
            line-height: 1.9;
            color: var(--data-text-color);
            padding: 12px;
            border-radius: 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .utility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 0 16px;
        }
        .utility-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 18px;
            transition: var(--transition);
        }
        .utility-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }
        .utility-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--primary-color); font-weight: 800; }
        .utility-card p { color: var(--text-muted); font-size: 0.76rem; line-height: 1.8; margin-bottom: 12px; }
        .hidden { display: none !important; }

        /* ============================================================
           Toast
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 600;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            min-width: 200px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-color);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }
        .toast.warning { border-color: var(--warning); }
        .toast-icon {
            width: 30px; height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        .toast.success .toast-icon { background: rgba(16, 185, 129, 0.12); color: var(--success); }
        .toast.error .toast-icon { background: rgba(239, 68, 68, 0.12); color: var(--error); }
        .toast.warning .toast-icon { background: rgba(245, 158, 11, 0.12); color: var(--warning); }
        .toast.info { border-color: var(--primary-color); }
        .toast.info .toast-icon { background: var(--primary-dim); color: var(--primary-color); }

        /* ============================================================
           الرسوم المتحركة
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease forwards; }

        /* ============================================================
           الاستجابة للجوال
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
            .stat-card { padding: 14px 12px; }
            .stat-value { font-size: 1.25rem; }
            .stat-icon { width: 40px; height: 40px; font-size: 1rem; }
            .bank-card .card-details { grid-template-columns: 1fr; }
            .report-filter-row { grid-template-columns: 1fr; }
            .cards-container { padding: 0 12px 16px; }
            .bottom-nav .nav-item i { font-size: 17px; }
            .bottom-nav .nav-item span { font-size: 0.65rem; }
            .sidebar { width: 100px; }
            .sidebar-btn { min-height: 70px; font-size: 0.75rem; }
            .sidebar-btn i { font-size: 1.4rem; }
            .filter-chip { font-size: 0.7rem; padding: 5px 12px; }
            .top-title h2 { font-size: 1.1rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .modal { padding: 18px 16px; }
            .report-results { max-height: 240px; }
            .report-results table th,
            .report-results table td { padding: 6px 8px; font-size: 0.7rem; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .data-card-head { flex-direction: column; }
            .data-card-value { align-self: flex-start; }
        }

        @media (max-width: 480px) {
            .stats-grid { gap: 8px; padding: 10px 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.05rem; }
            .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
            .bank-card .card-details { grid-template-columns: 1fr; }
            .card-actions { flex-wrap: wrap; }
            .card-btn { font-size: 0.7rem; padding: 8px; }
            .bottom-nav .nav-item { padding: 4px 4px; }
            .bottom-nav .nav-item i { font-size: 15px; }
            .bottom-nav .nav-item span { font-size: 0.6rem; }
            .modal { padding: 16px 14px; }

            }
        }
    </style>

            <textarea class="form-input" id="aiPrompt" rows="4" placeholder="اكتب سؤالك..."></textarea>

    <div class="toast" id="toast"></div>

    <script>
    (() => {
        'use strict';
        const CFG = {
            "title":"تقرير نهاية اليوم",
            "icon":"fa-calendar-day",
            "module":"reports",
            "listMethod":"getEodReport",
            "listArgs":[],
            "fields":[],
            "valueFields":[],
            "titleFields":["key"],
            "subtitleFields":["value"],
            "createMethod":null,
            "updateMethod":null,
            "deleteMethod":null,
            "note":"",
            "mode":"list",
            "objectMode":true,
            "updateAction":null,
            "reportKind":"eod",
            "aiMethod":null,
            /* التبويبات العلوية (فلاتر سريعة) المتوافقة مع تقرير نهاية اليوم */
            "reports":["الكل","المبيعات","المدفوعات","المصروفات","الفروقات"],
            /* عناصر القائمة السفلية (تقارير فرعية) المرتبطة بمهام نهاية اليوم */
            "bottomNav":["ملخص اليوم","المبيعات","المدفوعات","المصروفات","الفروقات"],
            "bottomIcons":["fa-list-check","fa-cash-register","fa-money-bill-transfer","fa-receipt","fa-scale-unbalanced"]
        };
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: 'all', filterKey: 'all', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => new Date().toISOString().slice(0,10);

        function toast(message, bad=false) {
            const node=$('toast');
            node.textContent=message;
            node.className='toast show ' + (bad ? 'error' : 'success');
            clearTimeout(node._timer);
            node._timer=setTimeout(()=>node.classList.remove('show'),3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) { if (raw == null) throw new Error('لم يرجع الجسر نتيجة'); const value=typeof raw==='string'?JSON.parse(raw):raw; if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية'); return value; }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method,args=[]) { if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد '+method+' غير متاح في Android Bridge')); try { return Promise.resolve(parse(bridge[method](...args))); } catch (error) { return Promise.reject(error); } }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({limit: 200, search: $('searchInput').value || ''})];
            if (CFG.reportKind === 'balanceSheet') return [today(), 0];
            if (CFG.reportKind === 'eod') return [];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw=dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val])=>({key,value:val}));
            if (raw && typeof raw === 'object') return [raw];
            return [];
        }
        function field(row, names) { for (const name of (names||[])) { if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name]; } return ''; }
        function titleOf(row) { return field(row, CFG.titleFields) || field(row,['name','title','label','id','key']) || 'سجل بلا اسم'; }
        function subtitleOf(row) { return (CFG.subtitleFields||[]).map(k => { const v=row&&row[k]; return v===undefined||v===null||v===''?null:k+': '+v; }).filter(Boolean).join(' · '); }
        function idOf(row) { return field(row,['id','_id','vehicle_id','pump_id','tank_id','payment_id','shift_id','sale_id','request_id','asset_id','employee_id']); }
        function numeric(v) { const n=Number(v); return Number.isFinite(n)?n:0; }
        function setDateDefaults() { $('reportFrom').value = $('reportFrom').value || today(); $('reportTo').value = $('reportTo').value || today(); }

        function renderFilters() {
            const topLabels = CFG.reports || ['الكل','ملخص','تفصيلي','تحليل','حركات'];
            const bottomLabels = CFG.bottomNav || topLabels;
            const icons = CFG.bottomIcons || [];

            $('filterChips').innerHTML = topLabels.map((label,i)=>`<button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">${esc(label)}</button>`).join('');
            document.querySelectorAll('#filterChips [data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
                document.querySelectorAll('#filterChips .filter-chip').forEach(x=>x.classList.remove('active'));
                btn.classList.add('active');
                state.filter=btn.dataset.filter;
                state.filterKey=btn.dataset.filter==='0'?'all':String(topLabels[Number(btn.dataset.filter)]||'').toLowerCase();
                applyFilter();
            }));

            $('bottomNav').innerHTML = bottomLabels.slice(0,5).map((label,i)=>{
                const iconClass = icons[i] || (i===0?'fa-list':i===1?'fa-file-alt':i===2?'fa-table':i===3?'fa-chart-bar':'fa-exchange-alt');
                return `<button type="button" class="nav-item ${i===0?'active':''}" data-bottom-filter="${i}"><i class="fas ${iconClass}"></i><span>${esc(label)}</span></button>`;
            }).join('');
            document.querySelectorAll('#bottomNav [data-bottom-filter]').forEach(btn=>btn.addEventListener('click',()=>{
                document.querySelectorAll('#bottomNav .nav-item').forEach(x=>x.classList.remove('active'));
                btn.classList.add('active');
                state.filter=btn.dataset.bottomFilter;
                state.filterKey=Number(btn.dataset.bottomFilter)===0?'all':String(bottomLabels[Number(btn.dataset.bottomFilter)]||'').toLowerCase();
                applyFilter();
            }));
        }

        function applyFilter() {
            const q=($('searchInput').value||'').trim().toLowerCase();
            const key=state.filterKey||'all';
            const matchesSection=row=>{ if(key==='all'||key==='ملخص اليوم')return true; const name=String(row&&row.key||'').toLowerCase(); const groups={ 'المبيعات':['sales','cash_sales','credit_sales','bank_sales','card_sales','deferred_sales','cash_sales_actual','total_liters','transaction_count'], 'المدفوعات':['payment','payments','total_payments'], 'المصروفات':['expense','expenses','total_expenses'], 'الفروقات':['difference','variance','discrepancy'] }; const terms=groups[key]||[key]; return terms.some(term=>name.includes(term)); };
            state.filtered=state.rows.filter(row=>{ const text=JSON.stringify(row||{}).toLowerCase(); return matchesSection(row)&&(!q || text.includes(q)); });
            renderCards();
        }

        function renderStats() {
            const rows=state.filtered;
            $('statCount').textContent=rows.length.toLocaleString('ar');
            $('itemCount').textContent=rows.length.toLocaleString('ar');
            const active=rows.filter(row=>['active','open','pending','completed','مفتوحة','نشط','قيد التنفيذ'].includes(String(field(row,['status','state','is_active'])))).length;
            $('statActive').textContent=active.toLocaleString('ar');
            let total=0;
            (CFG.valueFields||[]).forEach(k=>total += rows.reduce((sum,row)=>sum+numeric(row&&row[k]),0));
            $('statTotal').textContent=total?total.toLocaleString('ar',{maximumFractionDigits:2}):'—';
            $('statUpdated').textContent=state.loadedAt?state.loadedAt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'—';
        }

        function renderCards() {
            renderStats();
            const box=$('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML=`<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`;
                return;
            }
            box.innerHTML=state.filtered.map((row,index)=>{
                const id=esc(idOf(row)||index);
                const fields=(CFG.subtitleFields||[]).filter(k=>row && row[k]!==undefined && row[k]!==null && row[k]!=='').slice(0,8);
                const value=(CFG.valueFields||[]).map(k=>numeric(row&&row[k])).filter(v=>v!==0).reduce((a,b)=>a+b,0);
                const buttons=`<div class="action-row"><button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>${CFG.updateMethod?`<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>`:''}${CFG.resolveMethod?`<button class="btn" type="button" data-resolve="${id}"><i class="fas fa-check"></i> اعتماد/حل</button>`:''}${CFG.deleteMethod?`<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>`:''}</div>`;
                return `<article class="data-card"><div class="data-card-head"><div><div class="data-card-title">${esc(titleOf(row))}</div><div class="data-card-subtitle">${esc(subtitleOf(row))}</div></div>${value?`<div class="data-card-value">${value.toLocaleString('ar',{maximumFractionDigits:2})}</div>`:''}</div><div class="data-fields">${fields.map(k=>`<div class="data-field"><span>${esc(k)}</span><strong>${esc(row[k])}</strong></div>`).join('')}</div>${buttons}</article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRow(findRow(b.dataset.delete))));
            box.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>resolveRow(findRow(b.dataset.resolve))));
        }

        function findRow(id) { return state.rows.find((row,index)=>String(idOf(row)||index)===String(id)); }

        function openDetails(id) {
            const row=findRow(id);
            if(!row)return;
            $('detailsBody').innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-item"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}</div><details style="margin-top:14px"><summary style="cursor:pointer;color:var(--primary-color);font-weight:700;">JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row,null,2))}</pre></details>`;
            openModal(null,'detailsModal');
        }

        function inputHtml(def,row) {
            const value=row&&row[def.key]!==undefined?row[def.key]:'';
            const req=def.required?'required':'';
            const placeholder=def.placeholder?`placeholder="${esc(def.placeholder)}"`:'';
            if(def.type==='textarea')return `<div class="form-group full"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`;
            if(def.type==='select')return `<div class="form-group"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><select class="form-input" data-key="${esc(def.key)}" ${req}><option value="">اختر...</option><option value="active">نشط</option><option value="inactive">غير نشط</option><option value="open">مفتوح</option><option value="pending">معلق</option><option value="cash">نقدي</option><option value="credit">آجل</option><option value="morning">صباحية</option><option value="evening">مسائية</option><option value="night">ليلية</option><option value="in">إيراد</option><option value="out">مصروف</option><option value="high">عالية</option><option value="medium">متوسطة</option><option value="low">منخفضة</option><option value="completed">مكتمل</option></select></div>`;
            return `<div class="form-group ${def.type==='datetime-local'?'full':''}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`;
        }

        function openForm(row=null) {
            if(!CFG.createMethod && !CFG.updateMethod){
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة في العقد الحالي',true);
                return;
            }
            state.editing=row;
            $('formTitle').textContent=row?'تعديل السجل':'إضافة سجل جديد';
            $('recordForm').innerHTML=(CFG.fields||[]).map(def=>inputHtml(def,row)).join('');
            if(row)(CFG.fields||[]).forEach(def=>{const el=document.querySelector(`[data-key="${CSS.escape(def.key)}"]`); if(el&&def.type==='select')el.value=row[def.key]??'';});
            $('formModal').classList.add('show');
        }

        function collectForm() {
            const payload={};
            document.querySelectorAll('#recordForm [data-key]').forEach(el=>{ let value=el.value; const type=el.type; if(type==='number') value=value===''?0:Number(value); payload[el.dataset.key]=value; });
            if(CFG.module==='vehicles' && CFG.title==='إدارة السائقين') payload.party_type='driver';
            return payload;
        }

        async function saveForm() {
            const form=$('recordForm');
            if(!form.reportValidity())return;
            const payload=collectForm();
            setLoading(true);
            try {
                let result;
                if(state.editing && CFG.updateMethod) {
                    const id=idOf(state.editing);
                    if(!id)throw new Error('معرف السجل غير صالح');
                    if(CFG.updateAction==='tankQuantity') result=await invoke(CFG.updateMethod,[Number(id),Number(payload.current_quantity||0)]);
                    else if(CFG.updateAction==='maintenanceStatus') result=await invoke(CFG.updateMethod,[JSON.stringify({request_id:Number(id),status:payload.status||'completed'})]);
                    else if(CFG.updateAction==='endShift') result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]);
                    else result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]);
                } else if(CFG.createMethod) {
                    if(CFG.createMethod==='saveBalanceSheet') result=await invoke(CFG.createMethod,[today(),0]);
                    else result=await invoke(CFG.createMethod,[JSON.stringify(payload)]);
                } else throw new Error('لا توجد عملية حفظ مدعومة');
                parse(result);
                toast('تم تنفيذ العملية والتحقق من نجاحها');
                closeModal(null,'formModal');
                await reloadData();
            } catch(error) {
                toast(error.message||'فشلت العملية',true);
            } finally {
                setLoading(false);
            }
        }

        async function deleteRow(row) {
            const id=row&&idOf(row);
            if(!id||!CFG.deleteMethod)return;
            if(!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟'))return;
            setLoading(true);
            try {
                const result=await invoke(CFG.deleteMethod,[Number(id)]);
                parse(result);
                toast('تم الحذف فعلياً');
                await reloadData();
            } catch(error) {
                toast(error.message||'فشل الحذف',true);
            } finally {
                setLoading(false);
            }
        }

        async function resolveRow(row) {
            const id=row&&idOf(row);
            if(!id||!CFG.resolveMethod)return;
            const note=prompt('أدخل ملاحظة الاعتماد/الحل إن لزم:','');
            if(note===null)return;
            setLoading(true);
            try {
                const result=await invoke(CFG.resolveMethod,[Number(id),String(note)]);
                parse(result);
                toast('تم تنفيذ العملية فعلياً');
                await reloadData();
            } catch(error) {
                toast(error.message||'فشل تنفيذ العملية',true);
            } finally {
                setLoading(false);
            }
        }

        async function reloadData() {
            if(CFG.mode==='unsupported'||CFG.mode==='ai'){ renderCards(); return; }
            if(CFG.mode==='backup'){ loadBackupHistory(); return; }
            if(!CFG.listMethod){ renderCards(); return; }
            if(!bridge){ $('offlineBanner').classList.add('show'); renderCards(); return; }
            setLoading(true);
            try {
                const result=await invoke(CFG.listMethod,argsForLoad());
                state.rows=rowsFrom(result);
                state.loadedAt=new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch(error) {
                state.rows=[];
                state.loadedAt=new Date();
                renderCards();
                toast(error.message||'فشل تحميل البيانات',true);
            } finally {
                setLoading(false);
            }
        }

        function openModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.add('show'); }
        function closeModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.remove('show'); }

        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML='<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات المحملة من SQLite.</p></div>';
            openModal(null,'reportModal');
        }

        async function generateReport() {
            setLoading(true);
            try {
                let result;
                if(CFG.reportKind==='balanceSheet') result=await invoke('getBalanceSheet',[($('reportTo').value||today()),0]);
                else if(CFG.reportKind==='eod') result=await invoke('getEodReport',[]);
                else if(String(CFG.reportKind||'').startsWith('operational:')) {
                    const suffix=String(CFG.reportKind).split(':')[1];
                    result=await invoke('generate'+suffix+'Report',[JSON.stringify({from_date:$('reportFrom').value||'',to_date:$('reportTo').value||'',search:$('searchInput').value||'',include_archived:true,limit:1000})]);
                } else result={data:state.filtered};
                $('reportResults').innerHTML=renderReport(rowsFrom(result));
                toast('تم توليد التقرير من المصدر الفعلي');
            } catch(e) {
                toast(e.message||'فشل التقرير',true);
            } finally {
                setLoading(false);
            }
        }

        function renderReport(rows) {
            if(!rows.length)return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="data-fields">${rows.slice(0,100).map(row=>`<div class="data-field"><span>${esc(titleOf(row))}</span><strong>${esc(subtitleOf(row)||JSON.stringify(row))}</strong></div>`).join('')}</div>`;
        }

        function exportData() {
            const rows=state.filtered;
            if(!rows.length){toast('لا توجد بيانات حقيقية لتصديرها',true);return;}
            const keys=[...new Set(rows.flatMap(row=>Object.keys(row||{})))];
            const csv='\ufeff'+[keys, ...rows.map(row=>keys.map(k=>String(row[k]??'').replace(/"/g,'""')))].map(row=>row.map(v=>`"${v}"`).join(',')).join('\n');
            const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url;
            a.download='eod-report.csv';
            a.click();
            setTimeout(()=>URL.revokeObjectURL(url),1000);
            toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً');
        }

        async function askAI() {
            if(CFG.aiMethod!=='sendToAI'){toast('المساعد غير متاح لهذا المسار',true);return;}
            const prompt=($('aiPrompt').value||'').trim();
            if(!prompt){toast('اكتب السؤال أولاً',true);return;}
            if(!bridge||typeof bridge.sendToAI!=='function'){toast('عقد المساعد غير متاح في Android Bridge',true);return;}
            $('aiOutput').textContent='جاري انتظار رد Android...';
            window.onAIResponse=(payload)=>{
                const result=typeof payload==='string'?JSON.parse(payload):payload;
                if(result&&result.success){ $('aiOutput').textContent=result.response||'عاد الرد دون نص'; toast('وصل رد المساعد فعلياً'); }
                else { $('aiOutput').textContent=result&&result.error||'فشل رد المساعد'; toast($('aiOutput').textContent,true); }
                setLoading(false);
            };
            setLoading(true);
            try { const started=parse(bridge.sendToAI(prompt)); if(started.status!=='processing') window.onAIResponse(started); }
            catch(e) { setLoading(false); $('aiOutput').textContent=e.message; toast(e.message,true); }
        }

        function goHome() { window.location.href='../main.html'; }

        function applyTheme() {
            const saved=localStorage.getItem('theme')||'light';
            if(saved==='dark')document.documentElement.dataset.theme='dark';
            $('themeIcon').className=saved==='dark'?'fas fa-sun':'fas fa-moon';
        }
        function toggleTheme() {
            const dark=document.documentElement.dataset.theme==='dark';
            if(dark)delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme='dark';
            localStorage.setItem('theme',dark?'light':'dark');
            $('themeIcon').className=dark?'fas fa-moon':'fas fa-sun';
        }

        function initSpecial() {
            if(CFG.mode==='unsupported'){ $('fab').classList.add('hidden'); }
            if(CFG.mode==='ai'){
                $('fab').classList.add('hidden');
                $('cardsContainer').innerHTML='<div class="settings-wrap"><div class="settings-card"><h3>أرسل طلباً إلى المساعد</h3><p class="data-card-subtitle">لا تُحفظ الرسالة في localStorage ولا تُعرض نتيجة نجاح قبل عودة الجسر.</p><div class="action-row"><button class="btn primary" onclick="openModal(null,\'aiModal\')">فتح المساعد</button></div></div></div>';
            }
            if(CFG.mode==='backup'){
                $('fab').classList.add('hidden');
                $('cardsContainer').innerHTML='<div class="utility-grid"><div class="utility-card"><h3>نسخة قاعدة البيانات</h3><p>تنفيذ النسخ عبر Android ثم استقبال callback الفعلي.</p><button class="btn primary" onclick="startAsync(\'backupDatabase\',\'onBackupResult\')">إنشاء نسخة</button></div><div class="utility-card"><h3>تصدير كل البيانات</h3><p>يستخدم exportAllData ويعرض نتيجة callback.</p><button class="btn primary" onclick="startAsync(\'exportAllData\',\'onExportAllResult\')">بدء التصدير</button></div><div class="utility-card"><h3>معلومات قاعدة البيانات</h3><p id="dbInfo">اضغط لقراءة المعلومات الفعلية.</p><button class="btn" onclick="loadDbInfo()">قراءة</button></div></div>';
            }
        }

        function startAsync(method,callbackName){
            if(!bridge||typeof bridge[method]!=='function'){toast('العقد '+method+' غير متاح',true);return;}
            window[callbackName]=(value)=>{
                const parsed=typeof value==='string'?JSON.parse(value):value;
                if(parsed.success)toast(parsed.message||'اكتملت العملية فعلياً');
                else toast(parsed.error||'فشلت العملية',true);
            };
            try{const result=parse(bridge[method]()); if(result.status==='processing')toast('بدأت العملية؛ انتظار نتيجة Android...');}
            catch(e){toast(e.message,true);}
        }
        async function loadDbInfo(){
            try{const result=await invoke('getDatabaseInfo',[]); $('dbInfo').textContent=JSON.stringify(dataOf(result));}
            catch(e){$('dbInfo').textContent=e.message;toast(e.message,true);}
        }
        async function loadBackupHistory(){
            if(CFG.mode!=='backup'||!bridge||typeof bridge.getBackupHistoryRecords!=='function')return;
            try{
                const result=await invoke('getBackupHistoryRecords',[JSON.stringify({limit:100})]);
                const rows=rowsFrom(result);
                $('backupHistory').innerHTML=rows.length?rows.map(row=>`<div class="data-card"><strong>${esc(row.file_name||row.backup_type||row.id)}</strong><div class="data-card-subtitle">${esc([row.status,row.started_at,row.completed_at,row.file_size_mb,row.storage_location].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="empty-state">لا توجد سجلات نسخ في SQLite.</div>';
            }catch(e){$('backupHistory').textContent=e.message;toast(e.message,true);}
        }

        $('searchInput').addEventListener('input',applyFilter);
        $('themeToggle').addEventListener('click',toggleTheme);
        $('fab').addEventListener('click',()=>openForm());
        $('saveBtn').addEventListener('click',saveForm);
        $('sidebarToggle').addEventListener('click',()=>{const side=$('sidebar');side.classList.toggle('open');});
        document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay').forEach(x=>x.classList.remove('show'));});
        window.addEventListener('online',()=>toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
        window.addEventListener('offline',()=>$('offlineBanner').classList.add('show'));

        Object.assign(window, {goHome, openReport, generateReport, exportData, reloadData, openForm, saveForm, openModal, closeModal, startAsync, loadDbInfo, askAI});

        applyTheme();
        renderFilters();
        initSpecial();
        if(CFG.mode!=='unsupported'&&CFG.mode!=='backup'&&CFG.mode!=='ai')reloadData();
        else renderCards();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
