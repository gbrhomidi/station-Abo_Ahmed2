<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – إعدادات الطابعات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
/* ============================================================
   نظام الألوان — وضع فاتح افتراضي + وضع مظلم مخفف
   إطار فضي رفيع (1px) على جميع البطاقات والحقول
   ============================================================ */
:root {
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;

    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

    --emerald-primary: #059669;
    --emerald-dark: #047857;
    --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

    --success-token: #059669;
    --danger-token: #dc2626;
    --warning-token: #d97706;
    --info-token: #2563eb;
    --purple-token: #7c3aed;

    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg-token: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;

    color-scheme: light;

    /* ═══ Aliases متوافقة مع أسماء المتغيرات الأصلية ═══ */
    --bg-color: var(--bg-primary);
    --surface-color: var(--bg-glass);
    --surface-elevated: var(--bg-secondary);
    --primary-color: var(--gold-primary);
    --primary-dim: rgba(200, 154, 18, 0.12);
    --primary-hover: var(--gold-dark);
    --accent-color: var(--gold-primary);
    --accent-dim: rgba(200, 154, 18, 0.12);
    --text-color: var(--text-primary);
    --success: var(--success-token);
    --error: var(--danger-token);
    --warning: var(--warning-token);
    --border-style: solid;
    --border-width: 1px;
    --glass-bg: var(--bg-card);
    --card-hover-bg: var(--bg-glass-light);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--gold-primary);
    --modal-border-color: var(--silver-border-color);
    --modal-border-style: solid;
    --input-bg: var(--bg-glass);
    --input-border: var(--silver-border-color);
    --input-border-style: solid;
    --data-text-color: var(--text-primary);
    --data-text-muted: var(--text-secondary);
    --skeleton-bg: rgba(0, 0, 0, 0.05);
    --skeleton-shine: rgba(0, 0, 0, 0.08);
    --fab-shadow: rgba(200, 154, 18, 0.3);
}

[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);

    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

    --emerald-primary: #10b981;
    --emerald-dark: #059669;
    --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

    --success-token: #10b981;
    --danger-token: #ef4444;
    --warning-token: #f59e0b;
    --info-token: #3b82f6;
    --purple-token: #9b59b6;

    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg-token: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;

    color-scheme: dark;

    --skeleton-bg: rgba(255, 255, 255, 0.05);
    --skeleton-shine: rgba(255, 255, 255, 0.08);
    --fab-shadow: rgba(245, 200, 66, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 0 0 90px 0;
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: pan-y;
    -webkit-font-smoothing: antialiased;
}
[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

/* ============================================================
   Pull-to-Refresh
   ============================================================ */
.pull-indicator {
    position: fixed;
    top: -60px;
    left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    transition: top 0.2s ease;
    z-index: 50;
    background: var(--bg-secondary);
    border-bottom: var(--silver-border);
    box-shadow: var(--silver-shadow);
    pointer-events: none;
    font-weight: 700;
}
.pull-indicator.active { top: 0; }
.pull-indicator i { margin-left: 8px; transition: transform 0.3s; color: var(--gold-primary); }
.pull-indicator.loading i { animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* ============================================================
   Loading
   ============================================================ */
.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
[data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
.loading-indicator.show, .loading-indicator[style*="display: flex"] { display: flex !important; }
.spinner {
    width: 56px;
    height: 56px;
    border: 4px solid rgba(200, 154, 18, 0.15);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}

/* ============================================================
   Skeleton
   ============================================================ */
.skeleton-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 24px 16px;
}
.skeleton-card {
    background: var(--bg-card) !important;
    border: var(--silver-border-strong) !important;
    border-radius: var(--radius-card) !important;
    padding: 16px;
    box-shadow: var(--silver-shadow);
    position: relative;
    overflow: hidden;
}
.skeleton-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--skeleton-shine) 50%, transparent 100%);
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
.skeleton-row {
    height: 12px;
    background: var(--skeleton-bg);
    border-radius: 6px;
    margin-bottom: 8px;
}
.skeleton-row.short { width: 40%; }
.skeleton-row.medium { width: 60%; }
.skeleton-row.long { width: 80%; }

/* ============================================================
   Offline Banner
   ============================================================ */
.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning-token), var(--gold-primary));
    color: #ffffff;
    text-align: center;
    padding: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
    border-bottom: var(--silver-border-strong);
    box-shadow: var(--silver-shadow);
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   Top Bar — الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: var(--header-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: var(--silver-border);
    padding: 14px 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    transition: var(--transition);
}
.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
.top-title h2 {
    font-size: 1.45rem;
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.top-title h2 i {
    -webkit-text-fill-color: initial;
    color: var(--gold-primary);
}
.header-actions { display: flex; gap: 10px; align-items: center; }

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1rem;
    position: relative;
    box-shadow: var(--silver-shadow);
}
.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    transform: translateY(-2px);
    box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn.has-badge::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: var(--danger-token);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--danger-token);
    animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
}

.ai-badge {
    background: linear-gradient(135deg, var(--purple-token), #6366f1);
    color: #ffffff;
    font-size: 0.6rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    vertical-align: middle;
}

/* ============================================================
   البحث والفلاتر
   ============================================================ */
.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 12px 44px 12px 16px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
    text-align: center;
}
.search-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
.search-input::placeholder { color: var(--text-muted); }
.search-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.9rem;
    pointer-events: none;
}

.filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
    justify-content: center;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.filter-chip i { font-size: 0.75rem; }
.filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.filter-chip.active {
    background: var(--gold-primary);
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
}

/* ============================================================
   Page container
   ============================================================ */
.page-container { max-width: 1280px; margin: 0 auto; padding: 16px 0 90px; }

/* ============================================================
   بطاقات الإحصائيات — توسيط كامل
   ============================================================ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 24px;
}
.stat-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 18px 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
    touch-action: manipulation;
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}
.stat-card:active { transform: scale(0.97); }
.stat-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
}
.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    margin-bottom: 10px;
    border: var(--silver-border);
}
.stat-icon.blue { color: var(--info-token); background: rgba(37, 99, 235, 0.1); }
.stat-icon.green { color: var(--emerald-primary); background: rgba(5, 150, 105, 0.1); }
.stat-icon.orange { color: var(--warning-token); background: rgba(217, 119, 6, 0.1); }
.stat-icon.red { color: var(--danger-token); background: rgba(220, 38, 38, 0.1); }
.stat-icon.purple { color: var(--purple-token); background: rgba(124, 58, 237, 0.1); }
.stat-value {
    font-size: 1.75rem;
    font-weight: 900;
    font-family: 'Inter', 'Arial', sans-serif;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--text-primary);
    margin: 4px 0 2px;
    direction: ltr;
    text-align: center;
}
.stat-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 700;
    text-align: center;
}
.stat-trend {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 6px;
    border: var(--silver-border);
}
.stat-trend.up { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.stat-trend.down { background: rgba(220, 38, 38, 0.1); color: var(--danger-token); }

@media (min-width: 768px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 992px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
    .stat-card { padding: 12px 10px; }
    .stat-value { font-size: 1.15rem; }
    .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
}

/* ============================================================
   Data Panel
   ============================================================ */
.data-panel {
    margin: 0 24px;
    padding: 16px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: var(--silver-border-strong);
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.section-title {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    border-bottom: var(--silver-border);
    padding-bottom: 12px;
}
.section-title h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
}
.section-title h3 i { color: var(--gold-primary); }
.section-title .count-badge {
    background: var(--gold-primary);
    color: #ffffff;
    border-radius: 30px;
    padding: 3px 12px;
    font-size: 0.75rem;
    font-weight: 900;
    border: var(--silver-border);
}
.count-badge {
    background: var(--gold-primary);
    color: #ffffff;
    border-radius: 30px;
    padding: 3px 12px;
    font-size: 0.75rem;
    font-weight: 900;
    border: var(--silver-border);
}

/* ============================================================
   Data Cards — توسيط كامل
   ============================================================ */
.cards-container {
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    touch-action: pan-y;
}
.data-card {
    background: var(--bg-glass);
    border: var(--silver-border-strong);
    border-radius: var(--radius-small);
    padding: 14px 16px;
    margin-bottom: 0;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    text-align: center;
    box-shadow: var(--silver-shadow);
}
.data-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: var(--gold-primary);
    opacity: 0.7;
    transition: var(--transition);
}
.data-card:hover {
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 8px 28px rgba(200, 154, 18, 0.12);
    transform: translateY(-2px);
    background: var(--bg-glass-light);
}
.data-card:hover::before { opacity: 1; width: 6px; }
.data-card-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    flex-wrap: wrap;
}
.data-card-title {
    font-weight: 800;
    color: var(--text-primary);
    font-size: 0.95rem;
    text-align: right;
    flex: 1;
}
.data-card-subtitle {
    color: var(--text-muted);
    font-size: 0.76rem;
    margin-top: 4px;
    line-height: 1.7;
    text-align: right;
    font-weight: 600;
    word-break: break-word;
}
.data-card-value {
    color: var(--gold-primary);
    font-weight: 900;
    white-space: nowrap;
    direction: ltr;
    font-family: 'Inter', 'Arial', sans-serif;
    font-size: 1.05rem;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(200, 154, 18, 0.1);
    border: var(--silver-border);
}
.data-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-top: 12px;
}
.data-field {
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--bg-glass);
    min-width: 0;
    border: var(--silver-border);
    text-align: center;
    box-shadow: var(--silver-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.data-field span {
    display: block;
    font-size: 0.68rem;
    color: var(--text-muted);
    font-weight: 700;
    text-align: center;
}
.data-field strong {
    display: block;
    margin-top: 2px;
    overflow-wrap: anywhere;
    color: var(--text-primary);
    font-size: 0.8rem;
    text-align: center;
    direction: ltr;
    font-weight: 800;
}

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
}

/* ============================================================
   Buttons
   ============================================================ */
.btn {
    border: var(--silver-border);
    border-radius: 10px;
    padding: 9px 13px;
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    box-shadow: var(--silver-shadow);
    touch-action: manipulation;
}
.btn:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    background: var(--bg-glass-light);
    transform: translateY(-2px);
}
.btn:active { transform: scale(0.95); }
.btn.primary {
    background: var(--gold-primary);
    color: #ffffff;
    border-color: var(--gold-dark);
}
.btn.primary:hover {
    background: var(--gold-dark);
    color: #ffffff;
    box-shadow: var(--silver-shadow), 0 6px 20px rgba(200, 154, 18, 0.3);
}
.btn.danger { color: var(--danger-token); }
.btn.danger:hover {
    background: rgba(220, 38, 38, 0.08);
    border-color: var(--danger-token);
}
.btn.warning { color: var(--warning-token); }
.btn.warning:hover {
    background: rgba(217, 119, 6, 0.08);
    border-color: var(--warning-token);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ============================================================
   Empty State
   ============================================================ */
.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    line-height: 1.9;
}
.empty-state i {
    font-size: 3.5rem;
    display: block;
    color: var(--gold-primary);
    margin-bottom: 14px;
    opacity: 0.5;
}
.empty-state p { font-size: 0.9rem; }

/* ============================================================
   FAB
   ============================================================ */
.fab {
    position: fixed;
    bottom: 90px;
    left: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    border: var(--silver-border-strong);
    color: #ffffff;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: var(--silver-shadow), 0 6px 24px rgba(200, 154, 18, 0.35);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}
.fab:active { transform: scale(0.9); }
.fab:hover {
    transform: scale(1.1) rotate(90deg);
    box-shadow: var(--silver-shadow), 0 10px 36px rgba(200, 154, 18, 0.45);
}

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary);
    color: #ffffff;
    width: 40px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer;
    z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: var(--transition);
    border: var(--silver-border);
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
.sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
.sidebar {
    position: fixed;
    top: 50%;
    right: -140px;
    transform: translateY(-50%);
    width: 110px;
    background: var(--sidebar-bg-token);
    z-index: 999;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    padding: 12px 10px;
    border-radius: 18px 0 0 18px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: var(--silver-border);
    opacity: 0;
}
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 8px; }
.sidebar-btn {
    background: var(--bg-glass);
    border: var(--silver-border);
    padding: 12px 6px;
    border-radius: 12px;
    color: var(--text-secondary);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 72px;
    text-align: center;
    font-size: 0.85rem;
    font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.sidebar-btn:active { transform: scale(0.92); }
.sidebar-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    transform: scale(1.05);
}
.sidebar-btn i { font-size: 1.5rem; color: var(--gold-primary); }
.sidebar-btn span { font-size: 0.68rem; margin-top: 2px; }

.sidebar-btn[onclick*="goHome"] {
    background: rgba(220, 38, 38, 0.08) !important;
    border-color: var(--danger-token) !important;
    color: var(--danger-token) !important;
}
.sidebar-btn[onclick*="goHome"]:hover {
    background: var(--danger-token) !important;
    color: #ffffff !important;
}
.sidebar-btn[onclick*="goHome"] i { color: var(--danger-token) !important; }
.sidebar-btn[onclick*="goHome"]:hover i { color: #ffffff !important; }

/* ============================================================
   Bottom Navigation
   ============================================================ */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: var(--silver-border-strong);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300;
    overflow-x: auto;
    scrollbar-width: none;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 6px 10px;
    position: relative;
    touch-action: manipulation;
    flex: 1;
    min-width: 90px;
}
.bottom-nav .nav-item:active { transform: scale(0.9); }
.bottom-nav .nav-item i {
    font-size: 20px;
    transition: var(--transition);
}
.bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
.bottom-nav .nav-item.active { color: var(--gold-primary); }
.bottom-nav .nav-item.active i {
    transform: translateY(-3px);
    text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
}
.bottom-nav .nav-item.active::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: var(--gold-primary);
    border-radius: 10px;
}

/* ============================================================
   Modals
   ============================================================ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 950;
    display: none;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    overflow-y: auto;
}
[data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.82); }
.modal-overlay.show { display: flex; opacity: 1; }
.modal {
    background: var(--bg-secondary);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    width: 100%;
    max-width: 620px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px 22px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: var(--silver-border-strong);
    border-bottom: none;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    margin: 0 auto;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: var(--silver-border);
    padding-bottom: 14px;
}
.modal-title {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--gold-primary);
    text-align: center;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.modal-close {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 1.05rem;
    box-shadow: var(--silver-shadow);
}
.modal-close:hover {
    background: var(--danger-token);
    color: #ffffff;
    border-color: var(--danger-token);
}
.modal-close:active { transform: scale(0.9); }
.modal-body { padding: 8px 0; }
.modal-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 0 0;
    border-top: var(--silver-border);
    margin-top: 12px;
}

/* ============================================================
   Form Grid & Fields — توسيط كامل
   ============================================================ */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
}
.form-group.full { grid-column: 1/-1; }
.form-label {
    color: var(--text-secondary);
    font-size: 0.8rem;
    font-weight: 700;
    text-align: center;
    display: block;
    margin-bottom: 6px;
}
.form-input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: var(--transition);
    text-align: center;
    box-shadow: var(--silver-shadow);
}
.form-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
textarea.form-input { text-align: right; line-height: 1.7; resize: vertical; }
select.form-input { text-align: center; }
select.form-input option { background: var(--bg-secondary); color: var(--text-primary); }

/* ============================================================
   Details Grid
   ============================================================ */
.detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
}
.detail-item {
    padding: 10px;
    border-radius: 10px;
    background: var(--bg-glass);
    border: var(--silver-border);
    text-align: center;
    box-shadow: var(--silver-shadow);
}
.detail-item span {
    display: block;
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    text-align: center;
}
.detail-item strong {
    display: block;
    margin-top: 3px;
    overflow-wrap: anywhere;
    color: var(--text-primary);
    text-align: center;
    font-size: 0.82rem;
    direction: ltr;
}
.raw-json {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--bg-glass);
    color: var(--text-primary);
    padding: 12px;
    border-radius: 10px;
    border: var(--silver-border);
    font: 0.72rem/1.5 monospace;
    max-height: 300px;
    overflow: auto;
    box-shadow: var(--silver-shadow);
    margin-top: 14px;
}

/* ============================================================
   Report results
   ============================================================ */
.report-results {
    margin-top: 14px;
}
.report-results .data-fields {
    grid-template-columns: 1fr;
}
.report-results .data-field {
    text-align: right;
    padding: 10px 12px;
}
.report-results .data-field span { text-align: right; }
.report-results .data-field strong { text-align: right; }

/* ============================================================
   Settings / Utility Cards
   ============================================================ */
.settings-wrap { padding: 0 16px; }
.settings-card {
    background: var(--bg-card);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: var(--silver-shadow), var(--shadow-card);
    text-align: center;
}
.settings-card h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--gold-primary);
    text-align: center;
    margin-bottom: 8px;
}
.settings-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: var(--silver-border);
    align-items: center;
}
.settings-line:last-child { border-bottom: 0; }
.settings-line label {
    font-size: 0.82rem;
    color: var(--text-secondary);
    font-weight: 700;
}
.settings-line input { max-width: 230px; }

.ai-output {
    min-height: 100px;
    white-space: pre-wrap;
    line-height: 1.9;
    color: var(--text-primary);
    padding: 12px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    background: var(--bg-glass);
    margin-top: 10px;
    box-shadow: var(--silver-shadow);
    text-align: center;
    font-size: 0.85rem;
}

.utility-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    padding: 0 24px;
}
.utility-card {
    background: var(--bg-card);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px;
    text-align: center;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.utility-card h3 {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 8px;
    text-align: center;
}
.utility-card p {
    color: var(--text-muted);
    font-size: 0.75rem;
    line-height: 1.8;
    margin-bottom: 12px;
    text-align: center;
}

.hidden { display: none !important; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 14px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
    min-width: 220px;
    font-size: 0.85rem;
    color: #ffffff;
    font-weight: 700;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--emerald-primary); }
.toast.error { border-color: var(--danger-token); }
.toast.warning { border-color: var(--warning-token); }
.toast.info { border-color: var(--gold-primary); }
.toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    background: rgba(200, 154, 18, 0.12);
    color: var(--gold-primary);
    border: var(--silver-border);
}
.toast.success .toast-icon { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
.toast.error .toast-icon { background: rgba(220, 38, 38, 0.12); color: var(--danger-token); }
.toast.warning .toast-icon { background: rgba(217, 119, 6, 0.12); color: var(--warning-token); }

/* ============================================================
   Animations
   ============================================================ */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-up { animation: fadeUp 0.5s ease forwards; }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 1.2rem; }
    .stat-icon { width: 42px; height: 42px; font-size: 1.1rem; }
    .data-card-head { flex-direction: column; align-items: center; text-align: center; }
    .data-card-value { align-self: center; }
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: auto; }
    .cards-container { padding: 0; }
    .data-panel { margin: 0 12px; }
    .utility-grid { padding: 0 12px; }
    .bottom-nav .nav-item i { font-size: 16px; }
    .bottom-nav .nav-item span { font-size: 0.62rem; }
    .sidebar { width: 100px; padding: 10px 8px; }
    .sidebar-btn { min-height: 62px; font-size: 0.78rem; }
    .sidebar-btn i { font-size: 1.3rem; }
    .fab { width: 52px; height: 52px; font-size: 1.3rem; bottom: 84px; left: 16px; }
    .filter-chip { font-size: 0.7rem; padding: 6px 12px; }
    .top-title h2 { font-size: 1.1rem; }
    .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
    .modal { padding: 20px 16px; max-width: 100%; }
    .top-bar { padding: 12px 14px 10px; }
}

@media (max-width: 480px) {
    .stats-grid { gap: 8px; padding: 10px; }
    .stat-card { padding: 10px; }
    .stat-value { font-size: 1rem; }
    .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
    .bottom-nav .nav-item { padding: 4px 4px; min-width: 70px; }
    .bottom-nav .nav-item i { font-size: 15px; }
    .bottom-nav .nav-item span { font-size: 0.58rem; }
    .modal { padding: 18px 14px; }
    .data-card { padding: 12px; }
    .data-field { padding: 7px 8px; }
}

/* ============================================================
   Print
   ============================================================ */
@media print {
    .top-bar, .bottom-nav, .sidebar-toggle, .sidebar, .fab,
    .offline-banner, .action-row, .icon-btn { display: none !important; }
    body { background: #fff; color: #111; padding: 0; }
    .data-panel, .data-card, .stat-card {
        box-shadow: none;
        color: #111;
        border: 1px solid #aaa;
    }
}

    </div></aside>
    <nav class="bottom-nav" id="bottomNav" aria-label="التقارير والعمليات"></nav>
    <div class="modal-overlay" id="formModal" onclick="closeModal(event,'formModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">إضافة سجل</h3><button type="button" class="modal-close" onclick="closeModal(null,'formModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><form id="recordForm" class="form-grid"></form></div>
        <div class="modal-footer"><button type="button" class="btn primary" id="saveBtn"><i class="fas fa-save"></i> حفظ فعلي</button><button type="button" class="btn" onclick="closeModal(null,'formModal')">إلغاء</button></div>
    </div></div>
    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event,'detailsModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تفاصيل السجل</h3><button type="button" class="modal-close" onclick="closeModal(null,'detailsModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body" id="detailsBody"></div>
    </div></div>
    <div class="modal-overlay" id="reportModal" onclick="closeModal(event,'reportModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تقرير إعدادات الطابعات</h3><button type="button" class="modal-close" onclick="closeModal(null,'reportModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label">من تاريخ</label><input class="form-input" type="date" id="reportFrom"></div><div class="form-group"><label class="form-label">إلى تاريخ</label><input class="form-input" type="date" id="reportTo"></div></div><div class="action-row"><button type="button" class="btn primary" onclick="generateReport()"><i class="fas fa-cog"></i> توليد من المصدر</button><button type="button" class="btn" onclick="exportData()"><i class="fas fa-file-export"></i> Excel/CSV</button><button type="button" class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة/PDF</button></div><div id="reportResults" style="margin-top:14px"></div></div>
    </div></div>
    <div class="modal-overlay" id="aiModal" onclick="closeModal(event,'aiModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><h3 class="modal-title">المساعد الذكي</h3><button type="button" class="modal-close" onclick="closeModal(null,'aiModal')"><i class="fas fa-times"></i></button></div><div class="modal-body"><textarea class="form-input" id="aiPrompt" rows="4" placeholder="اكتب سؤالك..."></textarea><div class="action-row"><button class="btn primary" type="button" onclick="askAI()">إرسال</button></div><div class="ai-output" id="aiOutput"></div></div></div></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
        'use strict';
        const CFG = {"title":"إعدادات الطابعات","icon":"fa-print","module":"printing","listMethod":"getPrinterProfileRecords","listArgs":["{}"],"fields":[{"label":"كود ملف الطابعة","key":"profile_code","type":"text","required":true,"placeholder":""},{"label":"profile name","key":"profile_name","type":"text","required":true,"placeholder":""},{"label":"printer name","key":"printer_name","type":"text","required":false,"placeholder":""},{"label":"printer type","key":"printer_type","type":"select","required":false,"placeholder":""},{"label":"connection type","key":"connection_type","type":"select","required":false,"placeholder":""},{"label":"ip address","key":"ip_address","type":"text","required":false,"placeholder":""},{"label":"port","key":"port","type":"number","required":false,"placeholder":""},{"label":"mac address","key":"mac_address","type":"text","required":false,"placeholder":""},{"label":"paper width","key":"paper_width","type":"number","required":false,"placeholder":""},{"label":"paper height","key":"paper_height","type":"number","required":false,"placeholder":""},{"label":"dpi","key":"dpi","type":"number","required":false,"placeholder":""},{"label":"driver settings","key":"driver_settings","type":"textarea","required":false,"placeholder":""},{"label":"افتراضي؟","key":"is_default","type":"select","required":false,"placeholder":""},{"label":"نشط؟","key":"is_active","type":"select","required":false,"placeholder":""}],"valueFields":[],"titleFields":["profile_code","profile_name","printer_name"],"subtitleFields":["profile_code","profile_name","printer_name","printer_type","connection_type","ip_address","port","mac_address"],"createMethod":"savePrinterProfileRecord","updateMethod":"updatePrinterProfileRecord","deleteMethod":"deletePrinterProfileRecord","note":"تُنفذ هذه الشاشة عمليات القراءة والإضافة والتعديل والحذف عبر جدول printer_profiles وعقود Typed Bridge الفعلية.","mode":"list","objectMode":false,"updateAction":null,"reportKind":"operational:PrinterProfile","aiMethod":null,"reports":["جميع الطابعات","الطابعات النشطة","الطابعات غير النشطة","الطابعة الافتراضية","حسب نوع الاتصال"],"resolveMethod":null,"operationKey":"printer_profiles"};
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: 'all', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => businessDayDate();
        function toast(message, bad=false) { const node=$('toast'); node.textContent=message; node.className='toast show'; node.style.background=bad?'var(--danger-token)':'var(--gold-primary)'; clearTimeout(node._timer); node._timer=setTimeout(()=>node.classList.remove('show'),3500); }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) { if (raw == null) throw new Error('لم يرجع الجسر نتيجة'); const value=typeof raw==='string'?JSON.parse(raw):raw; if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية'); return value; }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method,args=[]) { if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد '+method+' غير متاح في Android Bridge')); try { return Promise.resolve(parse(bridge[method](...args))); } catch (error) { return Promise.reject(error); } }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({limit: 200, search: $('searchInput').value || ''})];
            if (CFG.reportKind === 'balanceSheet') return [today(), 0];
            if (CFG.reportKind === 'eod') return [];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw=dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val])=>({key,value:val}));
            if (raw && typeof raw === 'object') return [raw];
            return [];
        }
        function field(row, names) { for (const name of (names||[])) { if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name]; } return ''; }
        function titleOf(row) { return field(row, CFG.titleFields) || field(row,['name','title','label','id','key']) || 'سجل بلا اسم'; }
        function subtitleOf(row) { return (CFG.subtitleFields||[]).map(k => { const v=row&&row[k]; return v===undefined||v===null||v===''?null:k+': '+v; }).filter(Boolean).join(' · '); }
        function idOf(row) { return field(row,['id','_id','vehicle_id','pump_id','tank_id','payment_id','shift_id','sale_id','request_id','asset_id','employee_id']); }
        function numeric(v) { const n=Number(v); return Number.isFinite(n)?n:0; }
        function setDateDefaults() { $('reportFrom').value = $('reportFrom').value || today(); $('reportTo').value = $('reportTo').value || today(); }
        function renderFilters() {
            const labels=CFG.reports||['الكل','ملخص','تفصيلي','تحليل','حركات'];
            $('filterChips').innerHTML=labels.map((label,i)=>`<button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">${esc(label)}</button>`).join('');
            document.querySelectorAll('#filterChips [data-filter]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('#filterChips .filter-chip').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.filter=btn.dataset.filter; applyFilter(); }));
            $('bottomNav').innerHTML=labels.slice(0,5).map((label,i)=>`<button type="button" class="nav-item ${i===0?'active':''}" data-bottom-filter="${i}"><i class="fas ${i===0?'fa-list':i===1?'fa-file-alt':i===2?'fa-table':i===3?'fa-chart-bar':'fa-exchange-alt'}"></i><span>${esc(label)}</span></button>`).join('');
            document.querySelectorAll('#bottomNav [data-bottom-filter]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('#bottomNav .nav-item').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.filter=btn.dataset.bottomFilter; applyFilter(); }));
        }
        function applyFilter() {
            const q=($('searchInput').value||'').trim().toLowerCase();
            state.filtered=state.rows.filter(row=>{ const text=JSON.stringify(row||{}).toLowerCase(); return !q || text.includes(q); });
            renderCards();
        }
        function renderStats() {
            const rows=state.filtered; $('statCount').textContent=rows.length.toLocaleString('ar'); $('itemCount').textContent=rows.length.toLocaleString('ar');
            const active=rows.filter(row=>['active','open','pending','completed','مفتوحة','نشط','قيد التنفيذ'].includes(String(field(row,['status','state','is_active'])))).length;
            $('statActive').textContent=active.toLocaleString('ar');
            let total=0; (CFG.valueFields||[]).forEach(k=>total += rows.reduce((sum,row)=>sum+numeric(row&&row[k]),0)); $('statTotal').textContent=total?total.toLocaleString('ar',{maximumFractionDigits:2}):'—';
            $('statUpdated').textContent=state.loadedAt?state.loadedAt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'—';
        }
        function renderCards() {
            renderStats(); const box=$('cardsContainer');
            if (!state.filtered.length) { box.innerHTML=`<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`; return; }
            box.innerHTML=state.filtered.map((row,index)=>{
                const id=esc(idOf(row)||index); const fields=(CFG.subtitleFields||[]).filter(k=>row && row[k]!==undefined && row[k]!==null && row[k]!=='').slice(0,8);
                const value=(CFG.valueFields||[]).map(k=>numeric(row&&row[k])).filter(v=>v!==0).reduce((a,b)=>a+b,0);
                const buttons=`<div class="action-row"><button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>${CFG.updateMethod?`<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>`:''}${CFG.resolveMethod?`<button class="btn" type="button" data-resolve="${id}"><i class="fas fa-check"></i> اعتماد/حل</button>`:''}${CFG.deleteMethod?`<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>`:''}</div>`;
                return `<article class="data-card"><div class="data-card-head"><div><div class="data-card-title">${esc(titleOf(row))}</div><div class="data-card-subtitle">${esc(subtitleOf(row))}</div></div>${value?`<div class="data-card-value">${value.toLocaleString('ar',{maximumFractionDigits:2})}</div>`:''}</div><div class="data-fields">${fields.map(k=>`<div class="data-field"><span>${esc(k)}</span><strong>${esc(row[k])}</strong></div>`).join('')}</div>${buttons}</article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRow(findRow(b.dataset.delete))));
            box.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>resolveRow(findRow(b.dataset.resolve))));
        }
        function findRow(id) { return state.rows.find((row,index)=>String(idOf(row)||index)===String(id)); }
        function openDetails(id) { const row=findRow(id); if(!row)return; $('detailsBody').innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-item"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}</div><details style="margin-top:14px"><summary>JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row,null,2))}</pre></details>`; openModal(null,'detailsModal'); }
        function inputHtml(def,row) { const value=row&&row[def.key]!==undefined?row[def.key]:''; const req=def.required?'required':''; const placeholder=def.placeholder?`placeholder="${esc(def.placeholder)}"`:''; if(def.type==='textarea')return `<div class="form-group full"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`; if(def.type==='select')return `<div class="form-group"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><select class="form-input" data-key="${esc(def.key)}" ${req}><option value="">اختر...</option><option value="active">نشط</option><option value="inactive">غير نشط</option><option value="open">مفتوح</option><option value="pending">معلق</option><option value="cash">نقدي</option><option value="credit">آجل</option><option value="morning">صباحية</option><option value="evening">مسائية</option><option value="night">ليلية</option><option value="in">إيراد</option><option value="out">مصروف</option><option value="high">عالية</option><option value="medium">متوسطة</option><option value="low">منخفضة</option><option value="completed">مكتمل</option></select></div>`; return `<div class="form-group ${def.type==='datetime-local'?'full':''}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`; }
        function openForm(row=null) { if(!CFG.createMethod && !CFG.updateMethod){toast('لا توجد عملية كتابة مدعومة لهذه الشاشة في العقد الحالي',true);return;} state.editing=row; $('formTitle').textContent=row?'تعديل السجل':'إضافة سجل جديد'; $('recordForm').innerHTML=(CFG.fields||[]).map(def=>inputHtml(def,row)).join(''); if(row) (CFG.fields||[]).forEach(def=>{const el=document.querySelector(`[data-key="${CSS.escape(def.key)}"]`); if(el&&def.type==='select')el.value=row[def.key]??'';}); $('formModal').classList.add('show'); }
        function collectForm() { const payload={}; document.querySelectorAll('#recordForm [data-key]').forEach(el=>{ let value=el.value; const type=el.type; if(type==='number') value=value===''?0:Number(value); payload[el.dataset.key]=value; }); if(CFG.module==='vehicles' && CFG.title==='إدارة السائقين') payload.party_type='driver'; return payload; }
        async function saveForm() { const form=$('recordForm'); if(!form.reportValidity())return; const payload=collectForm(); setLoading(true); try { let result; if(state.editing && CFG.updateMethod) { const id=idOf(state.editing); if(!id)throw new Error('معرف السجل غير صالح'); if(CFG.updateAction==='tankQuantity') result=await invoke(CFG.updateMethod,[Number(id),Number(payload.current_quantity||0)]); else if(CFG.updateAction==='maintenanceStatus') result=await invoke(CFG.updateMethod,[JSON.stringify({request_id:Number(id),status:payload.status||'completed'})]); else if(CFG.updateAction==='endShift') result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); else result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); } else if(CFG.createMethod) { if(CFG.createMethod==='saveBalanceSheet') result=await invoke(CFG.createMethod,[today(),0]); else result=await invoke(CFG.createMethod,[JSON.stringify(payload)]); } else throw new Error('لا توجد عملية حفظ مدعومة'); parse(result); toast('تم تنفيذ العملية والتحقق من نجاحها'); closeModal(null,'formModal'); await reloadData(); } catch(error) { toast(error.message||'فشلت العملية',true); } finally { setLoading(false); } }
        async function deleteRow(row) { const id=row&&idOf(row); if(!id||!CFG.deleteMethod)return; if(!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟'))return; setLoading(true); try { const result=await invoke(CFG.deleteMethod,[Number(id)]); parse(result); toast('تم الحذف فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل الحذف',true); } finally { setLoading(false); } }
        async function resolveRow(row) { const id=row&&idOf(row); if(!id||!CFG.resolveMethod)return; const note=prompt('أدخل ملاحظة الاعتماد/الحل إن لزم:',''); if(note===null)return; setLoading(true); try { const result=await invoke(CFG.resolveMethod,[Number(id),String(note)]); parse(result); toast('تم تنفيذ العملية فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل تنفيذ العملية',true); } finally { setLoading(false); } }
        async function reloadData() { if(CFG.mode==='unsupported'||CFG.mode==='ai'){ renderCards(); return; } if(CFG.mode==='backup'){ loadBackupHistory(); return; } if(!CFG.listMethod){ renderCards(); return; } if(!bridge){ $('offlineBanner').classList.add('show'); renderCards(); return; } setLoading(true); try { const result=await invoke(CFG.listMethod,argsForLoad()); state.rows=rowsFrom(result); state.loadedAt=new Date(); $('offlineBanner').classList.remove('show'); applyFilter(); } catch(error) { state.rows=[]; state.loadedAt=new Date(); renderCards(); toast(error.message||'فشل تحميل البيانات',true); } finally { setLoading(false); } }
        function openModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.add('show'); } function closeModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.remove('show'); }
        function openReport() { setDateDefaults(); $('reportResults').innerHTML='<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات المحملة من SQLite.</p></div>'; openModal(null,'reportModal'); }
        async function generateReport() { setLoading(true); try { let result; if(CFG.reportKind==='balanceSheet') result=await invoke('getBalanceSheet',[($('reportTo').value||today()),0]); else if(CFG.reportKind==='eod') result=await invoke('getEodReport',[]); else if(String(CFG.reportKind||'').startsWith('operational:')) { const suffix=String(CFG.reportKind).split(':')[1]; result=await invoke('generate'+suffix+'Report',[JSON.stringify({from_date:$('reportFrom').value||'',to_date:$('reportTo').value||'',search:$('searchInput').value||'',include_archived:true,limit:1000})]); } else result={data:state.filtered}; $('reportResults').innerHTML=renderReport(rowsFrom(result)); toast('تم توليد التقرير من المصدر الفعلي'); } catch(e) { toast(e.message||'فشل التقرير',true); } finally { setLoading(false); } }
        function renderReport(rows) { if(!rows.length)return '<div class="empty-state">لا توجد بيانات للتقرير.</div>'; return `<div class="data-fields">${rows.slice(0,100).map(row=>`<div class="data-field"><span>${esc(titleOf(row))}</span><strong>${esc(subtitleOf(row)||JSON.stringify(row))}</strong></div>`).join('')}</div>`; }
        function exportData() { const rows=state.filtered; if(!rows.length){toast('لا توجد بيانات حقيقية لتصديرها',true);return;} const keys=[...new Set(rows.flatMap(row=>Object.keys(row||{})))]; const csv='\ufeff'+[keys, ...rows.map(row=>keys.map(k=>String(row[k]??'').replace(/"/g,'""')))].map(row=>row.map(v=>`"${v}"`).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='{filename}.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً'); }
        async function askAI() { if(CFG.aiMethod!=='sendToAI'){toast('المساعد غير متاح لهذا المسار',true);return;} const prompt=($('aiPrompt').value||'').trim(); if(!prompt){toast('اكتب السؤال أولاً',true);return;} if(!bridge||typeof bridge.sendToAI!=='function'){toast('عقد المساعد غير متاح في Android Bridge',true);return;} $('aiOutput').textContent='جاري انتظار رد Android...'; window.onAIResponse=(payload)=>{ const result=typeof payload==='string'?JSON.parse(payload):payload; if(result&&result.success){ $('aiOutput').textContent=result.response||'عاد الرد دون نص'; toast('وصل رد المساعد فعلياً'); } else { $('aiOutput').textContent=result&&result.error||'فشل رد المساعد'; toast($('aiOutput').textContent,true); } setLoading(false); }; setLoading(true); try { const started=parse(bridge.sendToAI(prompt)); if(started.status!=='processing') window.onAIResponse(started); } catch(e) { setLoading(false); $('aiOutput').textContent=e.message; toast(e.message,true); } }
        function goHome() { window.location.href='../main.html'; }
        function applyTheme() { const saved=localStorage.getItem('theme')||'light'; if(saved==='dark')document.documentElement.dataset.theme='dark'; $('themeIcon').className=saved==='dark'?'fas fa-sun':'fas fa-moon'; }
        function toggleTheme() { const dark=document.documentElement.dataset.theme==='dark'; if(dark)delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme='dark'; localStorage.setItem('theme',dark?'light':'dark'); $('themeIcon').className=dark?'fas fa-moon':'fas fa-sun'; }
        function initSpecial() {
            if(CFG.mode==='unsupported'){ $('fab').classList.add('hidden'); }
            if(CFG.mode==='ai'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="settings-wrap"><div class="settings-card"><h3>أرسل طلباً إلى المساعد</h3><p class="data-card-subtitle">لا تُحفظ الرسالة في localStorage ولا تُعرض نتيجة نجاح قبل عودة الجسر.</p><div class="action-row"><button class="btn primary" onclick="openModal(null,\'aiModal\')">فتح المساعد</button></div></div></div>'; }
            if(CFG.mode==='backup'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="utility-grid"><div class="utility-card"><h3>نسخة قاعدة البيانات</h3><p>تنفيذ النسخ عبر Android ثم استقبال callback الفعلي.</p><button class="btn primary" onclick="startAsync(\'backupDatabase\',\'onBackupResult\')">إنشاء نسخة</button></div><div class="utility-card"><h3>تصدير كل البيانات</h3><p>يستخدم exportAllData ويعرض نتيجة callback.</p><button class="btn primary" onclick="startAsync(\'exportAllData\',\'onExportAllResult\')">بدء التصدير</button></div><div class="utility-card"><h3>معلومات قاعدة البيانات</h3><p id="dbInfo">اضغط لقراءة المعلومات الفعلية.</p><button class="btn" onclick="loadDbInfo()">قراءة</button></div></div>'; }
        }
        function startAsync(method,callbackName){ if(!bridge||typeof bridge[method]!=='function'){toast('العقد '+method+' غير متاح',true);return;} window[callbackName]=(value)=>{const parsed=typeof value==='string'?JSON.parse(value):value; if(parsed.success)toast(parsed.message||'اكتملت العملية فعلياً'); else toast(parsed.error||'فشلت العملية',true);}; try{const result=parse(bridge[method]()); if(result.status==='processing')toast('بدأت العملية؛ انتظار نتيجة Android...');}catch(e){toast(e.message,true);} }
        async function loadDbInfo(){try{const result=await invoke('getDatabaseInfo',[]); $('dbInfo').textContent=JSON.stringify(dataOf(result));}catch(e){$('dbInfo').textContent=e.message;toast(e.message,true);}}
        async function loadBackupHistory(){if(CFG.mode!=='backup'||!bridge||typeof bridge.getBackupHistoryRecords!=='function')return;try{const result=await invoke('getBackupHistoryRecords',[JSON.stringify({limit:100})]);const rows=rowsFrom(result);$('backupHistory').innerHTML=rows.length?rows.map(row=>`<div class="data-card"><strong>${esc(row.file_name||row.backup_type||row.id)}</strong><div class="data-card-subtitle">${esc([row.status,row.started_at,row.completed_at,row.file_size_mb,row.storage_location].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="empty-state">لا توجد سجلات نسخ في SQLite.</div>';}catch(e){$('backupHistory').textContent=e.message;toast(e.message,true);}}
        $('searchInput').addEventListener('input',applyFilter); $('themeToggle').addEventListener('click',toggleTheme); $('fab').addEventListener('click',()=>openForm()); $('saveBtn').addEventListener('click',saveForm); $('sidebarToggle').addEventListener('click',()=>{const side=$('sidebar');side.classList.toggle('open');}); document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay').forEach(x=>x.classList.remove('show'));});
        window.addEventListener('online',()=>toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق')); window.addEventListener('offline',()=>$('offlineBanner').classList.add('show'));
        Object.assign(window, {goHome, openReport, exportData, reloadData, openForm, saveForm, openModal, closeModal, startAsync, loadDbInfo, askAI});
        applyTheme(); renderFilters(); initSpecial(); if(CFG.mode!=='unsupported'&&CFG.mode!=='backup'&&CFG.mode!=='ai')reloadData(); else renderCards();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
