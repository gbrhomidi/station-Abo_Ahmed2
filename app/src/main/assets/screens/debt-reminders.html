<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تذكيرات الديون</title>
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <script src="file:///android_asset/assets-local/js/jspdf.umd.min.js"></script>
    <style>
        /* ============================================================
           المتغيرات الأساسية – دعم Light/Dark
           ============================================================ */
        :root {
            --bg-color: #f5efe6;
            --surface-color: #faf3e8;
            --surface-elevated: #fdf8f0;
            --primary-color: #007ACC;
            --primary-dim: rgba(0,122,204,0.12);
            --accent-color: #d4a017;
            --accent-dim: rgba(212,160,23,0.12);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-color: #1a2a3a;
            --text-muted: #6a7f94;
            --border-color: #003366;
            --border-style: dashed;
            --border-width: 2px;
            --shadow-glow: 0 0 20px rgba(0,122,204,0.08);
            --glass-bg: rgba(255,248,240,0.85);
            --header-bg: linear-gradient(135deg, #e8e0d5 0%, #d5cdc0 100%);
            --card-hover-bg: rgba(0,122,204,0.04);
            --fab-shadow: rgba(0,122,204,0.3);
            --toast-bg: #fdf8f0;
            --scrollbar-track: #f5efe6;
            --scrollbar-thumb: rgba(0,51,102,0.2);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;
            --modal-border-color: #003366;
            --modal-border-style: dashed;
            --input-bg: #fdf8f0;
            --input-border: #003366;
            --input-border-style: dashed;
            --data-text-color: #1a2a3a;
            --data-text-muted: #4a5a6a;
            --debt-overdue: #ef4444;
            --debt-due-soon: #f59e0b;
            --debt-paid: #10b981;
            --debt-partial: #2196F3;
            --priority-low: #6a7f94;
            --priority-normal: #2196F3;
            --priority-high: #FF9800;
            --priority-urgent: #ef4444;
            --channel-sms: #2196F3;
            --channel-email: #4CAF50;
            --channel-push: #FF9800;
            --channel-whatsapp: #25D366;
            --channel-telegram: #0088cc;
            --channel-inapp: #9C27B0;
        }

        [data-theme="dark"] {
            --bg-color: #0a0e1a;
            --surface-color: #111827;
            --surface-elevated: #1a2236;
            --primary-color: #00d4ff;
            --primary-dim: rgba(0,212,255,0.15);
            --accent-color: #f59e0b;
            --accent-dim: rgba(245,158,11,0.15);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #e8d48b;
            --border-style: dashed;
            --border-width: 2px;
            --shadow-glow: 0 0 20px rgba(0,212,255,0.1);
            --glass-bg: rgba(22,34,64,0.85);
            --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-hover-bg: rgba(0,212,255,0.05);
            --fab-shadow: rgba(0,212,255,0.3);
            --toast-bg: #1a2236;
            --scrollbar-track: transparent;
            --scrollbar-thumb: rgba(255,255,255,0.1);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;
            --modal-border-color: #e8d48b;
            --modal-border-style: dashed;
            --input-bg: #1e293b;
            --input-border: #e8d48b;
            --input-border-style: dashed;
            --data-text-color: #f1f5f9;
            --data-text-muted: #94a3b8;
            --debt-overdue: #ef4444;
            --debt-due-soon: #f59e0b;
            --debt-paid: #10b981;
            --debt-partial: #2196F3;
            --priority-low: #94a3b8;
            --priority-normal: #2196F3;
            --priority-high: #FF9800;
            --priority-urgent: #ef4444;
            --channel-sms: #2196F3;
            --channel-email: #4CAF50;
            --channel-push: #FF9800;
            --channel-whatsapp: #25D366;
            --channel-telegram: #0088cc;
            --channel-inapp: #9C27B0;
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            transition: background 0.4s ease, color 0.4s ease;
            touch-action: pan-y;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(0,212,255,0.2);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي (Header)
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            background: var(--header-bg);
            border-bottom: var(--border-width) var(--border-style) var(--border-color);
            z-index: 100;
            backdrop-filter: blur(20px);
            transition: background 0.4s ease;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary-color), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-elevated);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            position: relative;
        }
        .icon-btn:hover {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--error);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--error);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ============================================================
           البحث والفلاتر
           ============================================================ */
        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 14px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-elevated);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip.active {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .filter-chip:hover:not(.active) {
            border-color: var(--text-muted);
            color: var(--text-color);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--surface-elevated);
            border: var(--border-width) var(--border-style) var(--border-color);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            touch-action: manipulation;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover::before { opacity: 1; }
        .stat-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .stat-icon.blue { background: var(--primary-dim); color: var(--primary-color); }
        .stat-icon.green { background: rgba(16,185,129,0.15); color: var(--success); }
        .stat-icon.orange { background: var(--accent-dim); color: var(--accent-color); }
        .stat-icon.red { background: rgba(239,68,68,0.15); color: var(--error); }
        .stat-icon.purple { background: rgba(155,89,182,0.15); color: #9b59b6; }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--data-text-color);
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           بطاقات الديون
           ============================================================ */
        .cards-container {
            padding: 0 16px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .debt-card {
            background: var(--surface-elevated);
            border: var(--border-width) var(--border-style) var(--border-color);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            touch-action: pan-y;
        }
        .debt-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: var(--card-hover-bg);
        }
        .debt-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-dim), 0 4px 20px rgba(0,212,255,0.1);
        }
        .debt-card:active { transform: scale(0.98); }
        .debt-card.overdue {
            border-color: var(--debt-overdue);
        }
        .debt-card.due-soon {
            border-color: var(--debt-due-soon);
        }

        .debt-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .debt-card .card-customer {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--data-text-color);
            flex: 1;
            text-align: center;
        }
        .debt-card .card-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .debt-card .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 600;
            border: var(--border-width) var(--border-style) var(--border-color);
        }
        .badge-status-overdue { background: rgba(239,68,68,0.15); color: var(--debt-overdue); }
        .badge-status-due-soon { background: rgba(245,158,11,0.15); color: var(--debt-due-soon); }
        .badge-status-paid { background: rgba(16,185,129,0.15); color: var(--debt-paid); }
        .badge-status-partial { background: rgba(33,150,243,0.15); color: var(--debt-partial); }
        .badge-status-pending { background: rgba(255,152,0,0.15); color: var(--warning); }
        .badge-reminder-sent { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-reminder-pending { background: rgba(255,152,0,0.15); color: var(--warning); }
        .badge-reminder-failed { background: rgba(239,68,68,0.15); color: var(--error); }

        .debt-card .card-amount {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-color);
            text-align: center;
            margin: 4px 0;
        }
        .debt-card .card-details {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 4px 0;
        }
        .debt-card .card-details .due-date {
            color: var(--data-text-color);
        }
        .debt-card .card-details .overdue-days {
            color: var(--debt-overdue);
            font-weight: 700;
        }
        .debt-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .debt-card .card-actions .card-btn {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .debt-card .card-actions .card-btn:active { transform: scale(0.95); }
        .debt-card .card-actions .card-btn:hover {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .debt-card .card-actions .card-btn.primary:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .debt-card .card-actions .card-btn.success:hover {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        .debt-card .card-actions .card-btn.danger:hover {
            background: rgba(239,68,68,0.15);
            color: var(--error);
            border-color: var(--error);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

        /* ============================================================
           القائمة الجانبية (Sidebar)
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(145deg, #4B0082, #5a1a9a);
            color: white;
            width: 35px; height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 10px rgba(0,0,0,0.4);
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -90px;
            transform: translateY(-50%);
            width: 70px;
            background: var(--surface-elevated);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 8px;
            border-radius: 15px 0 0 15px;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border: var(--border-width) var(--border-style) var(--border-color);
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: rgba(75, 0, 130, 0.8);
            border: var(--border-width) var(--border-style) var(--border-color);
            padding: 8px 4px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 55px;
            text-align: center;
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            touch-action: manipulation;
        }
        .sidebar-btn:active { transform: scale(0.95); }
        .sidebar-btn:hover {
            transform: scale(1.05);
            background: rgba(75,0,130,0.35);
            box-shadow: 0 0 15px rgba(0,212,255,0.2);
        }
        .sidebar-btn i { font-size: 1.1rem; }
        .sidebar-btn span { font-size: 0.65rem; }

        /* ============================================================
           القائمة السفلية (Bottom Navigation)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--border-width) var(--border-style) var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 8px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 18px; transition: all 0.3s; }
        .bottom-nav .nav-item span { font-weight: 600; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--primary-color); }
        .bottom-nav .nav-item.active i { transform: translateY(-3px); text-shadow: 0 0 20px var(--primary-dim); }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 10px;
        }

        /* ============================================================
           مودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 800;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--surface-elevated);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
            border: var(--border-width) var(--border-style) var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;

        /* ===== حقول النموذج ===== */

            opacity: 0.6;

        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* ============================================================
           Toast إشعارات
           ============================================================ */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--border-width) var(--border-style) var(--border-color);

            padding: 14px 20px;

        .toast.show {

    <script>
        // ============================================================
        // 1. Android Bridge – من MainActivity.kt
        // ============================================================
        function apiCall(action, params) {
            return new Promise((resolve, reject) => {
                if (typeof window.AndroidInterface !== 'undefined' && window.AndroidInterface) {
                    try {
                        const jsonParams = JSON.stringify(params || {});
                        const result = window.AndroidInterface.execute(action, jsonParams);
                        try {
                            const parsed = JSON.parse(result);
                            resolve(parsed);
                        } catch (e) {
                            resolve({ success: true, data: result });
                        }
                    } catch (e) {
                        reject({ success: false, error: e.message });
                    }
                } else {
                    reject({ success: false, error: 'AndroidInterface غير متاح' });
                }
            });
        }

        // ============================================================
        // 2. التخزين المحلي (Offline Mode)
        // ============================================================
        const LocalDB = {
            prefix: 'fuel_station_',
            set: function(key, value) {
                try { localStorage.setItem(this.prefix + key, JSON.stringify(value)); return true; } catch (e) { return false; }
            },
            get: function(key, defaultValue) {
                try {
                    const item = localStorage.getItem(this.prefix + key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) { return defaultValue; }
            },
            remove: function(key) { localStorage.removeItem(this.prefix + key); },
            getDebts: function() { return this.get('debt_reminders_debts', []); },
            setDebts: function(data) { this.set('debt_reminders_debts', data); },
            getStats: function() { return this.get('debt_reminders_stats', {}); },
            setStats: function(stats) { this.set('debt_reminders_stats', stats); },
            getPendingOps: function() { return this.get('pending_ops', []); },
            addPendingOp: function(op) {
                const ops = this.getPendingOps();
                ops.push({ ...op, timestamp: new Date().toISOString(), id: Date.now() + Math.random() });
                this.set('pending_ops', ops);
            },
            clearPendingOps: function() { this.remove('pending_ops'); }
        };

        // ============================================================
        // 3. حالة الاتصال
        // ============================================================
        let isOnline = navigator.onLine;

        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const banner = document.getElementById('offlineBanner');
            if (!isOnline) {
                banner.classList.add('show');
                showToast('⚠️ أنت في وضع عدم الاتصال - سيتم حفظ التغييرات محلياً', 'warning');
            } else {
                banner.classList.remove('show');
                showToast('✅ تم استعادة الاتصال - جاري مزامنة البيانات', 'success');
                syncPendingOperations();
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ============================================================
        // 4. مزامنة العمليات المعلقة
        // ============================================================
        async function syncPendingOperations() {
            if (!isOnline) return;
            const pendingOps = LocalDB.getPendingOps();
            if (pendingOps.length === 0) return;
            showLoading(true);
            let successCount = 0,
                failCount = 0;
            for (const op of pendingOps) {
                try {
                    const result = await apiCall(op.action, op.data);
                    if (result.success) successCount++;
                    else failCount++;
                } catch (e) { failCount++; }
            }
            if (successCount > 0) {
                LocalDB.clearPendingOps();
                showToast('✅ تمت مزامنة ' + successCount + ' عملية بنجاح', 'success');
                await loadDebts();
            }
            if (failCount > 0) {
                showToast('❌ فشلت ' + failCount + ' عملية - سيتم إعادة المحاولة', 'error');
            }
            showLoading(false);
        }

        // ============================================================
        // 5. Haptic Feedback
        // ============================================================
        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(20);
                    else if (type === 'error') navigator.vibrate([30, 50, 30]);
                    else if (type === 'light') navigator.vibrate(10);
                }
            } catch (e) { /* تجاهل */ }
        }

        // ============================================================
        // 6. دوال مساعدة
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;
            if (type === 'success') { iconEl.className = 'fas fa-check';
                hapticFeedback('success'); } else if (type === 'error') { iconEl.className = 'fas fa-times';
                hapticFeedback('error'); } else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle';
                hapticFeedback('light'); }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatCurrency(num) {
            if (num === null || num === undefined) return '0.00';
            return parseFloat(num).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '---';
            try {
                const d = new Date(dateStr);
                return d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
            } catch (e) { return dateStr; }
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '---';
            try {
                const d = new Date(dateStr);
                return d.toLocaleString('ar-EG', { dateStyle: 'medium' });
            } catch (e) { return dateStr; }
        }

        function getDebtStatus(remaining, dueDate) {
            const now = new Date();
            const due = new Date(dueDate);
            const diffDays = Math.ceil((due - now) / (1000 * 60 * 60 * 24));

            if (remaining <= 0) return { status: 'paid', label: 'مدفوع', class: 'paid', icon: 'fa-check-circle' };
            if (diffDays < 0) return { status: 'overdue', label: 'متأخر', class: 'overdue', icon: 'fa-exclamation-circle' };
            if (diffDays <= 3) return { status: 'due_soon', label: 'مستحق قريباً', class: 'due-soon', icon: 'fa-clock' };
            return { status: 'pending', label: 'مستحق', class: 'pending', icon: 'fa-hourglass-half' };
        }

        function getChannelLabel(channel) {
            const map = {
                'sms': '💬 SMS',
                'email': '📧 Email',
                'push': '🔔 Push',
                'whatsapp': '💚 WhatsApp',
                'telegram': '✈️ Telegram',
                'in_app': '📱 In-App'
            };
            return map[channel] || channel || 'غير محدد';
        }

        function getPriorityLabel(priority) {
            const map = {
                'low': 'منخفضة',
                'normal': 'عادية',
                'high': 'عالية',
                'urgent': 'عاجلة'
            };
            return map[priority] || priority || 'عادية';
        }

        // ============================================================
        // 7. نظام تبديل الوضع
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            const icon = document.getElementById('themeIcon');
            if (saved === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // ============================================================
        // 8. متغيرات الحالة
        // ============================================================
        let currentFilter = 'all';
        let allDebts = [];
        let allNotifications = [];
        let allSmsLogs = [];
        let allParties = [];
        let isInitialLoad = true;
        let currentDebtId = null;
        let confirmCallback = null;

        // ============================================================
        // 9. تحميل البيانات
        // ============================================================
        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card" style="background:var(--surface-elevated);border-radius:18px;padding:16px;border:var(--border-width) var(--border-style) var(--border-color);position:relative;overflow:hidden;">
                        <div style="display:flex;align-items:center;margin-bottom:12px;">
                            <div style="width:48px;height:48px;border-radius:14px;background:var(--skeleton-bg);flex-shrink:0;margin-left:12px;"></div>
                            <div style="flex:1;">
                                <div class="skeleton-row long" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                                <div class="skeleton-row medium" style="height:12px;background:var(--skeleton-bg);border-radius:6px;width:60%;"></div>
                            </div>
                        </div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div style="display:flex;gap:10px;margin-top:12px;">
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:6px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:6px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:6px;"></div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = `<div class="skeleton-grid" style="display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;">${skeleton}</div>`;
        }

        async function loadDebts() {
            if (isInitialLoad) renderSkeleton();

            showLoading(true);
            try {
                // جلب الديون المتأخرة والمستحقة
                const [overdueRes, debtsRes, partiesRes, notesRes, smsLogsRes] = await Promise.all([
                    apiCall('getOverduePayments', {}),
                    apiCall('getCustomerDebts', {}),
                    apiCall('getParties', { type: 'customer' }),
                    apiCall('getNotifications', {}),
                    apiCall('getSmsLogs', {})
                ]);

                let allDebtsData = [];

                // دمج الديون المتأخرة مع باقي الديون
                if (overdueRes.success && overdueRes.data) {
                    const overdue = Array.isArray(overdueRes.data) ? overdueRes.data : [];
                    allDebtsData = [...overdue];
                }

                if (debtsRes.success && debtsRes.data) {
                    const debts = Array.isArray(debtsRes.data) ? debtsRes.data : [];
                    // إضافة الديون غير المتأخرة التي لم تظهر في overdue
                    const overdueIds = new Set(allDebtsData.map(d => d.id));
                    debts.forEach(d => {
                        if (!overdueIds.has(d.id)) {
                            allDebtsData.push(d);
                        }
                    });
                }

                allDebts = allDebtsData;

                if (partiesRes.success && partiesRes.data) {
                    allParties = Array.isArray(partiesRes.data) ? partiesRes.data : [];
                }

                if (notesRes.success && notesRes.data) {
                    allNotifications = Array.isArray(notesRes.data) ? notesRes.data : [];
                }

                if (smsLogsRes.success && smsLogsRes.data) {
                    allSmsLogs = Array.isArray(smsLogsRes.data) ? smsLogsRes.data : [];
                }

                // تخزين محلي
                LocalDB.setDebts(allDebts);

                if (allDebts.length === 0) {
                    showToast('⚠️ لا توجد ديون مستحقة', 'warning');
                }

            } catch (e) {
                allDebts = LocalDB.getDebts();
                if (allDebts.length === 0) {
                    showToast('⚠️ لا يمكن الاتصال بالخادم - استخدام البيانات المحلية', 'warning');
                }
            }

            renderCards();
            updateStats();
            isInitialLoad = false;
            showLoading(false);
        }

        // ============================================================
        // 10. عرض البطاقات
        // ============================================================
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allDebts];

            // تطبيق الفلتر
            if (currentFilter === 'overdue') {
                filtered = filtered.filter(d => {
                    const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                    return status.status === 'overdue';
                });
            } else if (currentFilter === 'due_soon') {
                filtered = filtered.filter(d => {
                    const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                    return status.status === 'due_soon';
                });
            } else if (currentFilter === 'paid') {
                filtered = filtered.filter(d => (d.remaining_amount || d.remainingAmount || 0) <= 0);
            } else if (currentFilter === 'partial') {
                filtered = filtered.filter(d => {
                    const total = d.net_amount || d.netAmount || 0;
                    const remaining = d.remaining_amount || d.remainingAmount || 0;
                    return remaining > 0 && remaining < total;
                });
            } else if (currentFilter === 'reminded') {
                const remindedIds = new Set();
                allNotifications.forEach(n => {
                    if (n.reference_type === 'sale' || n.reference_type === 'debt') {
                        remindedIds.add(n.reference_id);
                    }
                });
                allSmsLogs.forEach(l => {
                    if (l.reminder_id) remindedIds.add(l.reminder_id);
                });
                filtered = filtered.filter(d => remindedIds.has(d.id) || remindedIds.has(d.sale_id));
            }

            // تطبيق البحث
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(d => {
                    const name = (d.customer_name || d.commercial_name || '').toLowerCase();
                    const invoice = (d.invoice_number || '').toLowerCase();
                    const code = (d.sale_code || '').toLowerCase();
                    return name.includes(searchQuery) || invoice.includes(searchQuery) || code.includes(searchQuery);
                });
            }

            document.getElementById('debtCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-hand-holding-usd"></i>
                        <p>لا توجد ديون مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((d, idx) => {
                const id = d.id;
                const customerName = d.customer_name || d.commercial_name || 'عميل غير معروف';
                const invoiceNumber = d.invoice_number || d.sale_code || '---';
                const remaining = d.remaining_amount || d.remainingAmount || 0;
                const total = d.net_amount || d.netAmount || 0;
                const dueDate = d.due_date || d.dueDate || null;
                const status = getDebtStatus(remaining, dueDate);
                const createdAt = d.created_at || d.createdAt || '---';

                // التحقق من وجود تذكير سابق
                const hasReminder = allNotifications.some(n =>
                    (n.reference_type === 'sale' && n.reference_id == id) ||
                    (n.reference_type === 'debt' && n.reference_id == id)
                ) || allSmsLogs.some(l => l.reminder_id == id || l.transaction_id == id);

                return `
                    <div class="debt-card animate-fade-up ${status.status === 'overdue' ? 'overdue' : status.status === 'due_soon' ? 'due-soon' : ''}" style="animation-delay:${idx*0.04}s" data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <div class="card-customer"><i class="fas fa-user"></i> ${escapeHtml(customerName)}</div>
                            <div class="card-badges">
                                <span class="badge badge-status-${status.class}">${status.label}</span>
                                ${hasReminder ? '<span class="badge badge-reminder-sent">📨 تم التذكير</span>' : '<span class="badge badge-reminder-pending">⏳ لم يُذكّر</span>'}
                            </div>
                        </div>
                        <div class="card-amount">${formatCurrency(remaining)} <span style="font-size:0.7rem;color:var(--text-muted);">من ${formatCurrency(total)}</span></div>
                        <div class="card-details">
                            <span>📄 ${escapeHtml(invoiceNumber)}</span>
                            ${dueDate ? `<span class="due-date">📅 ${formatDateShort(dueDate)}</span>` : ''}
                            ${status.status === 'overdue' ? `<span class="overdue-days">⏰ متأخر</span>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); viewDebt(${id})">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                            <button class="card-btn primary" onclick="event.stopPropagation(); openReminderModal(${id})">
                                <i class="fas fa-bell"></i> تذكير
                            </button>
                            <button class="card-btn" onclick="event.stopPropagation(); viewReminderHistory(${id})">
                                <i class="fas fa-history"></i> سجل
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.debt-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            currentDebtId = id;
            hapticFeedback('light');
        }

        // ============================================================
        // 11. تحديث الإحصائيات
        // ============================================================
        function updateStats() {
            const total = allDebts.length;
            const overdue = allDebts.filter(d => {
                const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                return status.status === 'overdue';
            }).length;
            const totalAmount = allDebts.reduce((sum, d) => sum + (d.remaining_amount || d.remainingAmount || 0), 0);
            const customers = new Set(allDebts.map(d => d.customer_party_id || d.customerPartyId || d.customer_id)).size;

            document.getElementById('statTotalDebts').textContent = total;
            document.getElementById('statOverdue').textContent = overdue;
            document.getElementById('statTotalAmount').textContent = formatCurrency(totalAmount);
            document.getElementById('statCustomers').textContent = customers;

            LocalDB.setStats({ total, overdue, totalAmount, customers });
        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'success');
        }

        function handleSearch(query) { renderCards(); }

        function setFilter(filter, btn) {

        // ============================================================
        // 13. التنبيهات
        // ============================================================
        function generateAlerts() {
            const alerts = [];
            const overdue = allDebts.filter(d => {
                const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                return status.status === 'overdue';
            });
            if (overdue.length > 0) {
                alerts.push({
                    type: 'danger',
                    icon: 'fa-exclamation-circle',

                    desc: overdue.length + ' دين متأخر يحتاج متابعة',
                    time: 'الآن'
                });
            }
            const dueSoon = allDebts.filter(d => {
                const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                return status.status === 'due_soon';
            });
            if (dueSoon.length > 0) {
                alerts.push({
                    type: 'warning',
                    icon: 'fa-clock',
                    title: '🟡 ديون مستحقة قريباً',
                    desc: dueSoon.length + ' دين يستحق خلال 3 أيام',
                    time: 'الآن'
                });

            LocalDB.set('debt_alerts', alerts);
            renderAlerts(alerts);
        }

            const container = document.getElementById('alertsContainer');
            if (!container) return;
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '';
                return;

            container.innerHTML = alerts.slice(0, 3).map((a, i) => `
                <div class="alert-item ${a.type}" style="animation-delay:${i*0.1}s;padding:10px 16px;background:var(--surface-elevated);border-radius:12px;margin-bottom:8px;border:2px dashed ${a.type === 'danger' ? 'var(--error)' : 'var(--warning)'};display:flex;align-items:center;gap:10px;">

                    <div class="alert-content" style="flex:1;"><div class="alert-title" style="font-size:0.85rem;font-weight:700;color:var(--data-text-color);">${a.title}</div><div class="alert-desc" style="font-size:0.75rem;color:var(--text-muted);">${a.desc}</div></div>
                    <div class="alert-time" style="font-size:0.7rem;color:var(--text-muted);">${a.time}</div>
                </div>
            `).join('');
        }

            const alerts = LocalDB.get('debt_alerts', []);

                showToast('🔔 لا توجد تنبيهات جديدة', 'info');

            showToast('🔔 لديك ' + alerts.length + ' تنبيه', 'success');
            hapticFeedback('light');
        }

        // 14. عرض تفاصيل الدين

            );

                            <span style="color:var(--data-text-color);">${escapeHtml(customerName)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">

                        </div>
                        ${dueDate ? `

                            <span style="font-weight:600;color:var(--text-muted);">تاريخ الاستحقاق:</span>

        async function sendReminder() {
            const debtId = parseInt(document.getElementById('reminderDebtId').value);
            const customerId = parseInt(document.getElementById('reminderCustomerId').value);
            const channel = document.getElementById('reminderChannel').value;
            const title = document.getElementById('reminderTitle').value.trim();
            const message = document.getElementById('reminderMessage').value.trim();
            const priority = document.getElementById('reminderPriority').value;

            if (!message) {
                showToast('❌ الرجاء إدخال نص التذكير', 'error');
                document.getElementById('reminderMessage').focus();
                return;
            }

            const debt = allDebts.find(d => d.id == debtId);
            if (!debt) {
                showToast('❌ الدين غير موجود', 'error');
                return;
            }

            const customerName = debt.customer_name || debt.commercial_name || 'العميل';

            showLoading(true);

            try {
                // إنشاء إشعار (تذكير) في النظام
                const notificationData = {
                    user_id: 0, // سيتم تعيينه من قبل النظام
                    role_id: 0,
                    customer_party_id: customerId,
                    notification_type: 'reminder',
                    title: title || 'تذكير دين',
                    title_ar: title || 'تذكير دين',
                    message: message,
                    message_ar: message,
                    priority: priority || 'normal',
                    channel: channel,
                    status: 'pending',
                    reference_type: 'debt',
                    reference_id: debtId,
                    action_text: 'عرض التفاصيل'
                };

                let result = await apiCall('addNotification', notificationData);

                if (result.success) {
                    // إذا كانت القناة SMS، أضف رسالة SMS أيضاً
                    if (channel === 'sms' && customerId > 0) {
                        // محاولة العثور على رقم هاتف العميل
                        const party = allParties.find(p => p.id == customerId);
                        const phone = party ? (party.phone || party.phone2) : null;
                        if (phone) {
                            const smsData = {
                                phone_number: phone,
                                message_body: message,
                                message_type: 'outgoing',
                                status: 'pending',
                                party_id: customerId
                            };
                            await apiCall('addSmsMessage', smsData);
                        }
                    }

                    showToast('✅ تم إرسال التذكير بنجاح', 'success');
                    closeModal();
                    await loadDebts();
                    generateAlerts();
                } else {
                    throw new Error(result.message || 'فشل في إرسال التذكير');
                }
            } catch (e) {
                if (!isOnline) {
                    LocalDB.addPendingOp({ action: 'addNotification', data: { customer_party_id: customerId, message: message } });
                    showToast('✅ تم الحفظ محلياً - سيتم المزامنة لاحقاً', 'success');
                    closeModal();
                } else {
                    showToast('❌ ' + (e.message || 'خطأ في الإرسال'), 'error');
                }
            } finally {
                showLoading(false);
            }
        }

                <th>المتبقي</th>
                <th>تاريخ الاستحقاق</th>
                <th>الحالة</th>
            </tr></thead><tbody>`;
            debts.forEach(d => {
                const remaining = d.remaining_amount || d.remainingAmount || 0;
                const total = d.net_amount || d.netAmount || 0;
                const dueDate = d.due_date || d.dueDate || null;
                const status = getDebtStatus(remaining, dueDate);
                const name = d.customer_name || d.commercial_name || '---';

        function exportDebtsReport() {
            if (allDebts.length === 0) {
                showToast('⚠️ لا توجد بيانات للتصدير', 'warning');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const margin = 10;
                let y = margin;

                doc.setFontSize(18);
                doc.setTextColor(0, 122, 204);
                doc.text('تقرير الديون المستحقة', pageWidth / 2, y, { align: 'center' });
                y += 8;

                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`تاريخ التقرير: ${new Date().toLocaleString('ar-EG')}`, pageWidth / 2, y, { align: 'center' });
                y += 10;

                // ملخص
                const total = allDebts.length;
                const overdue = allDebts.filter(d => {
                    const status = getDebtStatus(d.remaining_amount || d.remainingAmount || 0, d.due_date || d.dueDate);
                    return status.status === 'overdue';
                }).length;
                const totalAmount = allDebts.reduce((sum, d) => sum + (d.remaining_amount || d.remainingAmount || 0), 0);

                doc.setFontSize(11);
                doc.setTextColor(50);
                doc.setFont('helvetica', 'bold');
                doc.text('ملخص:', margin, y);
                y += 6;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.text(`إجمالي الديون: ${total}`, margin + 5, y);
                y += 5;
                doc.text(`المتأخرة: ${overdue}`, margin + 5, y);
                y += 5;
                doc.text(`إجمالي المبالغ المستحقة: ${formatCurrency(totalAmount)} ريال`, margin + 5, y);
                y += 8;

                // قائمة الديون
                doc.setFont('helvetica', 'bold');
                doc.text('قائمة الديون:', margin, y);
                y += 6;
                doc.setFont('helvetica', 'normal');

                allDebts.forEach((d, idx) => {
                    if (y > 250) {
                        doc.addPage();
                        y = margin;
                    }
                    const name = d.customer_name || d.commercial_name || '---';
                    const remaining = d.remaining_amount || d.remainingAmount || 0;
                    const status = getDebtStatus(remaining, d.due_date || d.dueDate);
                    doc.text(`${idx + 1}. ${name} - ${formatCurrency(remaining)} ريال (${status.label})`, margin + 3, y);
                    y += 5;
                });

                const fileName = `debts_report_${new Date().toISOString().substring(0, 10)}.pdf`;
                doc.save(fileName);
                showToast('✅ تم تصدير التقرير بنجاح', 'success');
                hapticFeedback('success');
            } catch (e) {
                showToast('❌ فشل التصدير: ' + e.message, 'error');
                console.error('Export error:', e);
            }
        }

                suggestion = `🔴 هناك ${overdue} دين متأخر بقيمة ${formatCurrency(totalAmount)} ريال. يُنصح بالتواصل مع العملاء المتأخرين فوراً.`;
            } else {
                suggestion = `🟡 يوجد ${total} دين مستحق بقيمة ${formatCurrency(totalAmount)} ريال. يُنصح بمتابعة العملاء قبل حلول موعد الاستحقاق.`;
            }

            Swal.fire({
                title: '🤖 المستشار الذكي - الديون',
                html: `
                    <div style="text-align:center;">
                        <p>💰 إجمالي الديون: ${total}</p>
                        <p>🔴 المتأخرة: ${overdue}</p>
                        <p>💵 إجمالي المبالغ: ${formatCurrency(totalAmount)} ريال</p>
                        <p>👥 عملاء مدينون: ${customers}</p>
                        <hr style="border:var(--border-width) var(--border-style) var(--border-color);margin:12px 0;">
                        <p style="font-weight:bold;">💡 التوصية: ${suggestion}</p>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'حسناً',
                background: '#1a2236',
                color: '#f1f5f9'
            });
            hapticFeedback('light');
        }

        // ============================================================
        // 22. إعداد القائمة الجانبية
        // ============================================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
                toggle.classList.toggle('hidden');
                hapticFeedback('light');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                    toggle.classList.remove('hidden');
                }
            });
        }

        // ============================================================
        // 23. التهيئة النهائية
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            setupSidebar();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            updateOnlineStatus();
            loadDebts();

            // تعيين الفلتر النشط
            document.querySelector('.filter-chip.active')?.classList.remove('active');
            document.querySelector('.filter-chip[data-filter="all"]')?.classList.add('active');

            // إضافة مستمع لإغلاق المودالات
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.addEventListener('click', closeModal);
            });

            // إضافة مستمع ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            setTimeout(() => {
                generateAlerts();
            }, 1000);

            if (isOnline) {
                syncPendingOperations();
            }
        });
    </script>
</body>
</html>
