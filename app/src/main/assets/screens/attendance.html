<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحضور والانصراف</title><link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css"><style>
:root{--p:#b8860b;--ink:#172033;--muted:#64748b;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--danger:#b42318;--ok:#13795b}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Cairo,Arial,sans-serif;direction:rtl}.app{max-width:1280px;margin:auto;padding-bottom:42px}.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:1.18rem;margin:0}.head p{font-size:.72rem;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.select,.input{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;color:var(--ink)}.btn{cursor:pointer}.btn:hover{border-color:var(--p);color:var(--p)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}.stat span{display:block;font-size:.7rem;color:var(--muted)}.stat strong{display:block;font-size:1.3rem;margin-top:4px}.panel{margin:0 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panel-title h2{font-size:1rem;margin:0}.card{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;background:#fff}.card-head{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800}.sub{font-size:.76rem;color:var(--muted);line-height:1.8}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:10px}.field{background:#f8fafc;border-radius:9px;padding:8px;min-width:0}.field small{display:block;color:var(--muted);font-size:.67rem}.field b{display:block;overflow-wrap:anywhere;font-size:.8rem;margin-top:2px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}.empty{text-align:center;padding:35px;color:var(--muted);line-height:2}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:var(--surface);width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:16px}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.dialog-body{padding:16px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted)}.form .full{grid-column:1/-1}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.loading{position:fixed;inset:0;background:#0005;z-index:30;display:grid;place-items:center;color:white;font-size:1.3rem}.toast{position:fixed;bottom:22px;left:22px;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:40;font-size:.78rem}.toast.show{display:block}.notice{margin:16px;padding:12px 14px;border-radius:12px;background:#fff8df;color:#725d00;font-size:.78rem;line-height:1.8}[hidden]{display:none!important}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}
.dark{--surface:#111827;--soft:#0b1220;--ink:#e5e7eb;--muted:#94a3b8;--line:#334155}</style></head><body data-module="module-010"><div id="loading" class="loading" hidden>جاري تنفيذ العملية...</div><div id="offline" class="notice" hidden>تعذر الوصول إلى Android Bridge؛ لم يتم عرض بيانات بديلة.</div><div class="app"><header class="topbar"><div class="head"><div><h1><i class="fas fa-user-clock"></i> الحضور والانصراف</h1><p>بيانات الموارد البشرية من SQLite ضمن المحطة الحالية</p></div><div class="actions"><button class="btn" id="home">رجوع</button><button class="btn" id="reload">تحديث</button><button class="btn" id="export">تصدير الصفحة</button><button class="btn primary" id="add">إضافة</button></div></div><div class="filters"><input class="input" id="search" type="search" placeholder="بحث في SQLite..."><select class="select" id="sort"><option value="id">الأحدث</option><option value="status">الحالة</option><option value="created_at">تاريخ الإنشاء</option><option value="hire_date">التعيين</option><option value="period_start">الفترة</option></select><select class="select" id="dir"><option value="asc">تصاعدي</option><option value="desc">تنازلي</option></select><select class="select" id="status" data-filter><option value="">كل الحالات</option><option value="present">حاضر</option><option value="late">متأخر</option><option value="early_leave">خروج مبكر</option><option value="on_leave">إجازة</option></select><input class="input" id="from" type="date" data-filter><input class="input" id="to" type="date" data-filter></div></header><section class="stats"><div class="stat"><span>السجلات في الصفحة</span><strong id="pageRows">—</strong></div><div class="stat"><span>إجمالي النتائج</span><strong id="totalRows">—</strong></div><div class="stat"><span>المصدر</span><strong>SQLite</strong></div><div class="stat"><span>نطاق البيانات</span><strong>المحطة الحالية</strong></div></section><main class="panel"><div class="panel-title"><h2>النتائج المرقمة من قاعدة البيانات</h2><span id="count">0</span></div><div id="list"></div><div class="pager"><button class="btn" id="prev">السابق</button><span id="page">—</span><button class="btn" id="next">التالي</button></div></main></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialog-head"><strong id="title">عملية</strong><button class="btn" onclick="closeModal()">إغلاق</button></div><div class="dialog-body" id="body"></div><div class="dialog-foot" id="foot"><button class="btn primary" id="save">حفظ فعلي</button><button class="btn" id="cancel">إلغاء</button></div></div></div><div id="toast" class="toast"></div><script>const CFG={list:'getAttendancePage',create:'checkInEmployee',kind:'attendance',file:'attendance',formTitle:'تسجيل حضور',form:'<label>الموظف<select class="select" data-k="employee_id" required></select></label><label>التاريخ<input class="input" data-k="attendance_date" type="date" required></label><label>وقت الدخول<input class="input" data-k="check_in" type="datetime-local" required></label><label class="full">ملاحظات<textarea class="input" data-k="notes"></textarea></label>'};
const bridge=window.AndroidInterface;const $=id=>document.getElementById(id);const esc=v=>String(v==null?'—':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const state={rows:[],page:0,size:25,total:0,pages:0,busy:false};
function parse(raw){if(raw==null)throw Error('لم يُرجع Android Bridge نتيجة');const v=typeof raw==='string'?JSON.parse(raw):raw;if(v&&v.success===false)throw Error(v.error||v.message||'فشلت العملية');return v}
function invoke(name,args=[]){if(!bridge||typeof bridge[name]!=='function')throw Error('العقد '+name+' غير متاح في Android Bridge');return parse(bridge[name](...args))}
function payload(v){return v&&v.data!==undefined?v.data:v}function rows(v){const p=payload(v);if(Array.isArray(p))return p;if(p&&Array.isArray(p.rows))return p.rows;if(p&&Array.isArray(p.data))return p.data;return []}function meta(v){const p=payload(v)||{};return p.meta||p.metadata||p}
function field(r,ks){for(const k of ks)if(r&&r[k]!==undefined&&r[k]!==null&&r[k]!=='')return r[k];return ''}function toast(m,b=false){const n=$('toast');n.textContent=m;n.style.background=b?'#b42318':'#172033';n.classList.add('show');clearTimeout(n.t);n.t=setTimeout(()=>n.classList.remove('show'),3000)}function busy(v){state.busy=v;$('loading').hidden=!v}
function params(){const p={limit:state.size,offset:state.page*state.size,search:$('search').value||'',sort_by:$('sort').value||'id',sort_dir:$('dir').value||'asc'};for(const id of ['status','employment','department','type','from','to'])if($(id))p[{employment:'employment_type',from:'from_date',to:'to_date'}[id]||id]=$(id).value||'';return p}
function render(){const box=$('list');box.innerHTML=state.rows.length?state.rows.map(r=>{const id=field(r,['id']);return `<article class="card"><div class="card-head"><div><div class="title">${esc(field(r,['employee_code','payroll_code','id']))} — ${esc(field(r,['full_name','full_name_ar','employee_name']))}</div><div class="sub">${esc(field(r,['department','job_title','attendance_date','period_start','date']))}</div></div><strong>${esc(field(r,['status','payment_status'])||'—')}</strong></div><div class="fields">${Object.entries(r).filter(([k,v])=>v!==null&&v!==''&&!['uuid','station_id'].includes(k)).slice(0,9).map(([k,v])=>`<div class="field"><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div><div class="actions" style="margin-top:10px">${CFG.kind==='attendance'&&field(r,['check_in'])&&!field(r,['check_out'])?`<button class="btn primary" onclick="checkout(${Number(id)})">تسجيل الانصراف</button>`:''}<button class="btn" onclick="details(${JSON.stringify(String(id))})">تفاصيل</button></div></article>`}).join(''):'<div class="empty">لا توجد بيانات مطابقة في SQLite ضمن المحطة الحالية.</div>';$('count').textContent=state.total.toLocaleString('ar');$('page').textContent=state.pages?`صفحة ${state.page+1} من ${state.pages}`:'لا صفحات';$('prev').disabled=state.page<=0;$('next').disabled=state.page+1>=state.pages;$('pageRows').textContent=state.rows.length.toLocaleString('ar');$('totalRows').textContent=state.total.toLocaleString('ar')}
function reload(){if(state.busy)return;busy(true);try{const v=invoke(CFG.list,[JSON.stringify(params())]);state.rows=rows(v);const m=meta(v);state.total=Number(m.total_count??m.total??state.rows.length);state.pages=Number(m.total_pages??(state.total?Math.ceil(state.total/state.size):0));$('offline').hidden=true;render()}catch(e){state.rows=[];state.total=0;state.pages=0;render();$('offline').hidden=false;toast(e.message,true)}finally{busy(false)}}
function details(id){const r=state.rows.find(x=>String(field(x,['id']))===String(id));if(!r)return;$('title').textContent='تفاصيل السجل';$('body').innerHTML='<pre style="direction:ltr;text-align:left;white-space:pre-wrap">'+esc(JSON.stringify(r,null,2))+'</pre>';$('foot').hidden=true;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function openForm(){if(!CFG.create)return;busy(true);$('title').textContent=CFG.formTitle;$('body').innerHTML=CFG.form;$('foot').hidden=false;$('modal').classList.add('show');loadRelations();busy(false)}
function collect(){const p={};document.querySelectorAll('#body [data-k]').forEach(e=>{p[e.dataset.k]=e.type==='number'?(e.value===''?0:Number(e.value)):e.value});return p}
function save(){busy(true);try{parse(invoke(CFG.create,[JSON.stringify(collect())]));closeModal();toast('تم حفظ العملية فعلياً في SQLite');reload()}catch(e){toast(e.message,true)}finally{busy(false)}}
function loadRelations(){try{if(document.querySelector('[data-k="employee_id"]')){const a=rows(invoke('getEmployees'));$('[data-k="employee_id"]').innerHTML='<option value="">اختر الموظف</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.employee_code||x.id)} — ${esc(x.full_name||x.full_name_ar)}</option>`).join('')}if(document.querySelector('[data-k="cash_box_id"]')){const a=rows(invoke('getCashBoxRecords'));$('[data-k="cash_box_id"]').innerHTML='<option value="">اختر الصندوق</option>'+a.map(x=>`<option value="${esc(x.id)}">${esc(x.box_name||x.id)}</option>`).join('')}}catch(e){toast('تعذر تحميل علاقات SQLite: '+e.message,true)}}
function checkout(id){const v=new Date();const t=v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0')+' '+String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0')+':'+String(v.getSeconds()).padStart(2,'0');busy(true);try{parse(invoke('checkOutEmployee',[Number(id),JSON.stringify({check_out:t})]));toast('تم تسجيل الانصراف وحساب ساعات العمل');reload()}catch(e){toast(e.message,true)}finally{busy(false)}}
function exportPage(){if(!state.rows.length){toast('لا توجد بيانات حقيقية للتصدير',true);return}const keys=[...new Set(state.rows.flatMap(x=>Object.keys(x)))];const csv='\ufeff'+[keys,...state.rows.map(x=>keys.map(k=>String(x[k]??'').replace(/"/g,'""')))].map(r=>r.map(v=>'"'+v+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=CFG.file+'.csv';a.click()}
function setup(){document.querySelectorAll('[data-filter]').forEach(e=>e.addEventListener('change',()=>{state.page=0;reload()}));$('search').addEventListener('input',()=>{clearTimeout(state.t);state.t=setTimeout(()=>{state.page=0;reload()},300)});$('dir').addEventListener('change',()=>{state.page=0;reload()});$('prev').onclick=()=>{if(state.page>0){state.page--;reload()}};$('next').onclick=()=>{if(state.page+1<state.pages){state.page++;reload()}};$('reload').onclick=reload;$('export').onclick=exportPage;$('home').onclick=()=>location.href='../main.html';$('add').onclick=openForm;$('save').onclick=save;$('cancel').onclick=closeModal;reload()}
setup();</script></body></html>
