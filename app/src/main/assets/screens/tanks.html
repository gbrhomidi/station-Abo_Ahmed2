<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – إدارة الخزانات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحّد — من pumps.html
           ============================================================ */
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-glass: rgba(0, 0, 0, 0.025);
            --bg-glass-light: rgba(0, 0, 0, 0.05);
            --text-primary: #1a2233;
            --text-secondary: #44546a;
            --text-muted: #8391a5;
            --border-color: #d8dde4;

            --silver-border-color: #c4cad2;
            --silver-border-color-strong: #a8b0bb;
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

            --gold-primary: #c89a12;
            --gold-dark: #a67c00;
            --gold-light: #f5c842;
            --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

            --emerald-primary: #059669;
            --emerald-dark: #047857;
            --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --purple: #7c3aed;

            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

            --radius-card: 20px;
            --radius-small: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(255, 255, 255, 0.94);
            --nav-bg: rgba(255, 255, 255, 0.96);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;

            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-primary: #1e232b;
            --bg-secondary: #262c36;
            --bg-card: rgba(40, 47, 58, 0.88);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-light: rgba(255, 255, 255, 0.075);
            --text-primary: #d8dee6;
            --text-secondary: #9aa5b4;
            --text-muted: #6a7686;
            --border-color: rgba(200, 205, 212, 0.2);

            --silver-border-color: rgba(192, 197, 204, 0.35);
            --silver-border-color-strong: rgba(192, 197, 204, 0.55);
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --emerald-primary: #10b981;
            --emerald-dark: #059669;
            --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #9b59b6;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

            --header-bg: rgba(30, 35, 43, 0.94);
            --nav-bg: rgba(30, 35, 43, 0.96);
            --sidebar-bg: rgba(38, 44, 54, 0.98);
            --toast-bg: #262c36;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;

            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0 0 90px 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .loading-indicator {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(200, 154, 18, 0.15);
            border-top: 4px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 22px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: var(--silver-border);
            z-index: 100;
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-title {
            flex: 1;
            min-width: 150px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--gold-primary);
            font-size: 1.1rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            box-shadow: var(--silver-shadow);
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }

        .search-wrap { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: right;
        }
        .search-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
        .filter-chip.active {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
            box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border: var(--silver-border);
            background: var(--bg-glass-light);
            color: var(--gold-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           بطاقات البيانات
           ============================================================ */
        .cards-container {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .data-panel {
            margin: 0 16px;
            padding: 16px;
            border-radius: var(--radius-card);
            background: var(--bg-card);
            border: var(--silver-border-strong);
            box-shadow: var(--silver-shadow), var(--shadow-card);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }
        .data-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }

        .section-title {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 i { color: var(--gold-primary); }
        .section-title .count-badge {
            background: var(--gold-primary);
            color: #ffffff;
            border-radius: 30px;
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 900;
            border: var(--silver-border);
        }

        .data-card {
            background: var(--bg-glass);
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            padding: 14px;
            margin-bottom: 10px;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .data-card:hover {
            border-color: var(--gold-primary);
            background: var(--bg-glass-light);
            box-shadow: var(--silver-shadow), 0 8px 24px rgba(200, 154, 18, 0.1);
        }
        .data-card-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }
        .data-card-title {
            font-weight: 800;
            color: var(--text-primary);
            text-align: center;
            flex: 1;
        }
        .data-card-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            margin-top: 4px;
            line-height: 1.7;
            text-align: center;
        }
        .data-card-value {
            color: var(--gold-primary);
            font-weight: 900;
            white-space: nowrap;
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        .data-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .data-field {
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            min-width: 0;
            text-align: center;
        }
        .data-field span {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }
        .data-field strong {
            display: block;
            margin-top: 2px;
            overflow-wrap: anywhere;
            color: var(--text-primary);
            font-size: 0.8rem;
            text-align: center;
            font-weight: 800;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .btn {
            border: var(--silver-border);
            border-radius: 10px;
            padding: 9px 13px;
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-1px);
            background: var(--bg-glass-light);
        }
        .btn.primary {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
        }
        .btn.primary:hover { background: var(--gold-dark); color: #ffffff; }
        .btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
        }
        .btn.warning:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(217, 119, 6, 0.1);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.4;
            display: block;
            color: var(--gold-primary);
        }
        .empty-state p { font-size: 0.9rem; }

        /* ============================================================
           الزر العائم
           ============================================================ */
        .fab {
            position: fixed;
            bottom: 90px;
            left: 24px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--gold-primary);
            border: var(--silver-border);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(200, 154, 18, 0.3), var(--silver-shadow);
            transition: var(--transition);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active { transform: scale(0.9); }
        .fab:hover {
            background: var(--gold-dark);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 30px rgba(200, 154, 18, 0.4);
        }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--gold-primary);
            color: white;
            width: 40px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
            transition: var(--transition);
            border: var(--silver-border);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { background: var(--gold-dark); width: 44px; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 110px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 12px 10px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            border: var(--silver-border);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: var(--silver-border);
            padding: 12px 6px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 72px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.68rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--silver-border-strong);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;

            "note":"",
            "mode":"list",
            "objectMode":false,
            "updateAction":"tankQuantity",
            "reportKind":"operational:Tank",
            "aiMethod":null,
            "reports":["الكل","نشط","صيانة","فارغ","معطل"],
            "reportStatusMap":["", "active", "maintenance", "empty", "retired"],
            "resolveMethod":null,
            "operationKey":"tanks"
        };
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: '0', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => businessDayDate();

        function toast(message, bad=false) {
            const node=$('toast');
            node.textContent=message;
            node.className='toast show';
            node.style.background=bad?'var(--danger)':'var(--toast-bg)';
            node.style.color=bad?'#fff':'var(--text-primary)';
            clearTimeout(node._timer);
            node._timer=setTimeout(()=>node.classList.remove('show'),3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) {
            if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
            const value=typeof raw==='string'?JSON.parse(raw):raw;
            if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
            return value;
        }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method,args=[]) {
            if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد '+method+' غير متاح في Android Bridge'));
            try { return Promise.resolve(parse(bridge[method](...args))); }
            catch (error) { return Promise.reject(error); }
        }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({limit: 500, search: $('searchInput').value || ''})];
            if (CFG.reportKind === 'balanceSheet') return [today(), 0];
            if (CFG.reportKind === 'eod') return [];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw=dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val])=>({key,value:val}));
            if (raw && typeof raw === 'object' && raw.id !== undefined) return [raw];
            return [];
        }
        function field(row, names) {
            for (const name of (names||[])) {
                if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
            }
            return '';
        }
        function titleOf(row) {
            return field(row, CFG.titleFields) || field(row,['name','title','label','id','key']) || 'سجل بلا اسم';
        }
        function subtitleOf(row) {
            return (CFG.subtitleFields||[])
                .map(k => { const v=row&&row[k]; return v===undefined||v===null||v===''?null:k+': '+v; })
                .filter(Boolean).join(' · ');
        }
        function idOf(row) {
            return field(row,['id','_id','tank_id','pump_id','vehicle_id','payment_id','shift_id','sale_id','request_id','asset_id','employee_id']);
        }
        function numeric(v) { const n=Number(v); return Number.isFinite(n)?n:0; }
        function setDateDefaults() {
            $('reportFrom').value = $('reportFrom').value || today();
            $('reportTo').value = $('reportTo').value || today();
        }

        // ============================================================
        // الفلاتر والتبويبات - مرتبطة بحالات الخزان الفعلية
        // ============================================================
        function renderFilters() {
            const labels = CFG.reports || ['الكل'];
            const icons = [
                'fa-list',
                'fa-check-circle',
                'fa-wrench',
                'fa-battery-empty',
                'fa-ban'
            ];
            const chips = $('filterChips');
            chips.innerHTML = labels.map((label,i)=>`<button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}"><i class="fas ${icons[i]||'fa-circle'}"></i> ${esc(label)}</button>`).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
                chips.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                applyFilter();
            }));
            const nav = $('bottomNav');
            nav.innerHTML = labels.map((label,i)=>`<button type="button" class="nav-item ${i===0?'active':''}" data-bottom-filter="${i}"><i class="fas ${icons[i]||'fa-circle'}"></i><span>${esc(label)}</span></button>`).join('');
            nav.querySelectorAll('[data-bottom-filter]').forEach(btn=>btn.addEventListener('click',()=>{
                nav.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.bottomFilter;
                // مزامنة التصفية العلوية مع السفلية
                chips.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
                const top = chips.querySelector(`[data-filter="${state.filter}"]`);
                if (top) top.classList.add('active');
                applyFilter();
            }));
        }

        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const statusMap = CFG.reportStatusMap || [];
            const idx = parseInt(state.filter, 10);
            const statusKey = statusMap[isNaN(idx) ? 0 : idx] || '';
            state.filtered = state.rows.filter(row => {
                if (q) {
                    const text = JSON.stringify(row || {}).toLowerCase();
                    if (!text.includes(q)) return false;
                }
                if (statusKey) {
                    const rowStatus = String(field(row, ['status','state']) || '').toLowerCase();
                    if (rowStatus !== statusKey) return false;
                }
                return true;
            });
            renderCards();
        }

        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = rows.length.toLocaleString('ar');
            $('itemCount').textContent = rows.length.toLocaleString('ar');
            const active = rows.filter(row => {
                const s = String(field(row,['status','state']) || '').toLowerCase();
                return s === 'active';
            }).length;
            $('statActive').textContent = active.toLocaleString('ar');
            let total = 0;
            (CFG.valueFields||[]).forEach(k => total += rows.reduce((sum,row)=>sum+numeric(row&&row[k]),0));
            $('statTotal').textContent = total ? total.toLocaleString('ar',{maximumFractionDigits:2}) : '—';
            $('statUpdated').textContent = state.loadedAt ? state.loadedAt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}) : '—';
        }

        function statusBadge(status) {
            const s = String(status||'').toLowerCase();
            const map = {
                'active': { label: 'نشط', cls: 'active' },
                'maintenance': { label: 'صيانة', cls: 'inactive' },
                'empty': { label: 'فارغ', cls: 'inactive' },
                'retired': { label: 'معطل', cls: 'inactive' }
            };
            const info = map[s] || { label: status || '—', cls: 'inactive' };
            return `<span class="card-status ${info.cls}">${esc(info.label)}</span>`;
        }

        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`;
                return;
            }
            box.innerHTML = state.filtered.map((row,index)=>{
                const id = esc(idOf(row)||index);
                const fields = (CFG.subtitleFields||[]).filter(k=>row && row[k]!==undefined && row[k]!==null && row[k]!=='').slice(0,6);
                const status = field(row,['status','state']);
                const buttons = `
                    <div class="action-row">
                        <button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>
                        ${CFG.updateMethod?`<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>`:''}
                        ${CFG.deleteMethod?`<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>`:''}
                    </div>`;
                return `<article class="data-card">
                    <div class="data-card-head">
                        <div style="flex:1">
                            <div class="data-card-title">${esc(titleOf(row))}</div>
                            <div class="data-card-subtitle">${esc(subtitleOf(row))}</div>
                        </div>
                        ${status?statusBadge(status):''}
                    </div>
                    <div class="data-fields">${fields.map(k=>`<div class="data-field"><span>${esc(k)}</span><strong>${esc(row[k])}</strong></div>`).join('')}</div>
                    ${buttons}
                </article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRow(findRow(b.dataset.delete))));
        }

        function findRow(id) { return state.rows.find((row,index)=>String(idOf(row)||index)===String(id)); }

        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            $('detailsBody').innerHTML = `
                <div class="detail-grid">
                    ${Object.entries(row).map(([k,v])=>`<div class="detail-item"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}
                </div>
                <details style="margin-top:14px"><summary>JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row,null,2))}</pre></details>`;
            openModal(null,'detailsModal');
        }

        // ============================================================
        // بناء النموذج - عمودان ما عدا الحقول الطويلة
        // ============================================================
        const FULL_WIDTH_KEYS = ['tank_name', 'remarks', 'extra_data', 'notes'];
        const HIDDEN_KEYS = ['tank_code', 'tank_name_ar'];

        function inputHtml(def, row) {
            const value = row && row[def.key] !== undefined ? row[def.key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const isFull = def.type === 'textarea' || FULL_WIDTH_KEYS.includes(def.key);
            const isHidden = HIDDEN_KEYS.includes(def.key);
            const groupClass = `form-group${isFull?' full':''}${isHidden?' hidden-field':''}`;

            if (def.type === 'textarea') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`;
            }

            if (def.type === 'select') {
                // الحالة: خياري نشط/غير نشط فقط
                if (def.key === 'status') {
                    const v = String(value||'').toLowerCase();
                    const isActive = v === 'active';
                    return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                        <select class="form-input" data-key="${esc(def.key)}" ${req}>
                            <option value="">اختر...</option>
                            <option value="active" ${isActive?'selected':''}>نشط</option>
                            <option value="inactive" ${!isActive&&v?'selected':''}>غير نشط</option>
                        </select></div>`;
                }
                // أي نوع select آخر: نترك القيم الافتراضية
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" ${req}>
                        <option value="">اختر...</option>
                        <option value="active">نشط</option>
                        <option value="inactive">غير نشط</option>
                        <option value="maintenance">صيانة</option>
                        <option value="empty">فارغ</option>
                        <option value="retired">معطل</option>
                    </select></div>`;
            }

            // المحطة ونوع الوقود: يتم استبدالهما بـ select عند فتح النموذج
            if (def.key === 'station_id' || def.key === 'fuel_type_id') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" data-needs-options="true" ${req}>
                        <option value="">جاري التحميل...</option>
                    </select></div>`;
            }

            return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                <input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`;
        }

        async function populateFormSelects(row) {
            // المحطات
            try {
                const stations = await fetchStations();
                const el = document.querySelector('#recordForm [data-key="station_id"]');
                if (el) {
                    el.innerHTML = '<option value="">اختر المحطة...</option>' +
                        stations.map(s=>`<option value="${esc(s.id)}">${esc(s.station_name_ar || s.station_name || s.station_code || ('محطة '+s.id))}</option>`).join('');
                    const v = row && row.station_id ? String(row.station_id) : (stations[0] ? String(stations[0].id) : '');
                    if (v) el.value = v;
                }
            } catch (e) { console.warn('stations load failed', e); }

            // أنواع الوقود
            try {
                const fuels = await fetchFuelTypes();
                const el = document.querySelector('#recordForm [data-key="fuel_type_id"]');
                if (el) {
                    el.innerHTML = '<option value="">اختر نوع الوقود...</option>' +
                        fuels.map(f=>`<option value="${esc(f.id||f.fuel_type_id)}">${esc(f.fuel_name_ar || f.fuel_name || f.fuel_code || ('وقود '+(f.id||f.fuel_type_id)))}</option>`).join('');
                    const v = row && row.fuel_type_id ? String(row.fuel_type_id) : (fuels[0] ? String(fuels[0].id||fuels[0].fuel_type_id) : '');
                    if (v) el.value = v;
                }
            } catch (e) { console.warn('fuelTypes load failed', e); }

            // الحالة: مطابقة القيم القديمة (maintenance/empty/retired) مع (غير نشط)
            const statusEl = document.querySelector('#recordForm [data-key="status"]');
            if (statusEl && row && row.status) {
                const s = String(row.status).toLowerCase();
                statusEl.value = s === 'active' ? 'active' : 'inactive';
            }
        }

        // توليد كود تلقائي
        function generateTankCode() {
            const d = new Date();
            const pad = n => String(n).padStart(2,'0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            return `TANK-${stamp}`;
        }

        function bindFormFieldBehaviors() {
            // نقل التركيز للحقل الحالي
            document.querySelectorAll('#recordForm .form-input').forEach(el => {
                el.addEventListener('focus', () => {
                    // تأخير بسيط للتأكد من انتقال المؤشر
                    setTimeout(() => {
                        try { el.setSelectionRange(el.value.length, el.value.length); } catch(_) {}
                    }, 50);
                });
            });

            // نسخ tank_name إلى tank_name_ar
            const nameEl = document.querySelector('#recordForm [data-key="tank_name"]');
            const nameArEl = document.querySelector('#recordForm [data-key="tank_name_ar"]');
            if (nameEl && nameArEl) {
                nameEl.addEventListener('input', () => { nameArEl.value = nameEl.value; });
                nameArEl.addEventListener('input', () => { /* لا يُعدّل المستخدم الحقل المخفي */ });
            }
        }

        // ============================================================
        // جلب البيانات المرجعية من قاعدة البيانات
        // ============================================================
        async function fetchStations() {
            try {
                const result = await invoke('getStations', []);
                return rowsFrom(result);
            } catch (e) {
                console.warn('fetchStations failed', e);
                return [];
            }
        }
        async function fetchFuelTypes() {
            try {
                const result = await invoke('getFuelTypes', []);
                return rowsFrom(result);
            } catch (e) {
                console.warn('fetchFuelTypes failed', e);
                return [];
            }
        }

        // ============================================================
        // فتح/إغلاق النموذج
        // ============================================================
        async function openForm(row=null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل الخزان' : 'إضافة خزان جديد';
            $('recordForm').innerHTML = (CFG.fields || []).map(def => inputHtml(def, row)).join('');

            // إعداد الخزانات المخفية
            const codeEl = document.querySelector('#recordForm [data-key="tank_code"]');
            if (codeEl) {
                if (!row) codeEl.value = generateTankCode();
            }
            const nameEl = document.querySelector('#recordForm [data-key="tank_name"]');
            const nameArEl = document.querySelector('#recordForm [data-key="tank_name_ar"]');
            if (row && nameArEl && !nameArEl.value) nameArEl.value = row.tank_name || '';

            // تعبئة القوائم المنسدلة
            await populateFormSelects(row);

            // ربط السلوكيات
            bindFormFieldBehaviors();

            // التركيز على أول حقل مرئي
            const firstVisible = document.querySelector('#recordForm .form-group:not(.hidden-field) .form-input');
            if (firstVisible) setTimeout(()=>firstVisible.focus(), 150);

            $('formModal').classList.add('show');
        }

        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                let value = el.value;
                const type = el.type;
                if (type === 'number') value = value === '' ? 0 : Number(value);
                payload[el.dataset.key] = value;
            });
            // نسخ إلزامي من tank_name إلى tank_name_ar
            if (payload.tank_name) payload.tank_name_ar = payload.tank_name;
            // الحالة: مطابقة للقيم المخزنة في SQLite
            if (payload.status === 'inactive') payload.status = 'maintenance';
            return payload;
        }

        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    if (CFG.updateAction === 'tankQuantity') {
                        // تحديث الكمية الحالية فقط + باقي الحقول
                        result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                    } else {
                        result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                    }
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم تنفيذ العملية والتحقق من نجاحها');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشلت العملية', true);
            } finally {
                setLoading(false);
            }
        }

        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم الحذف فعلياً');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // تحميل البيانات
        // ============================================================
        async function reloadData() {
            if (CFG.mode === 'unsupported' || CFG.mode === 'ai') { renderCards(); return; }
            if (!CFG.listMethod) { renderCards(); return; }
            if (!bridge) { $('offlineBanner').classList.add('show'); renderCards(); return; }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }

        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }

        // ============================================================
        // التقارير
        // ============================================================
        async function populateReportFilters() {
            try {
                const stations = await fetchStations();
                const sel = $('reportStationFilter');
                if (sel) sel.innerHTML = '<option value="">كل المحطات</option>' +
                    stations.map(s=>`<option value="${esc(s.id)}">${esc(s.station_name_ar || s.station_name || s.station_code || ('محطة '+s.id))}</option>`).join('');
            } catch(_) {}
            try {
                const fuels = await fetchFuelTypes();
                const sel = $('reportFuelFilter');
                if (sel) sel.innerHTML = '<option value="">كل الأنواع</option>' +
                    fuels.map(f=>`<option value="${esc(f.id||f.fuel_type_id)}">${esc(f.fuel_name_ar || f.fuel_name || f.fuel_code)}</option>`).join('');
            } catch(_) {}
        }

        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات المحملة من SQLite.</p></div>';
            populateReportFilters().then(()=>openModal(null,'reportModal'));
        }

        async function generateReport() {
            setLoading(true);
            try {
                let result;
                if (CFG.reportKind === 'balanceSheet') {
                    result = await invoke('getBalanceSheet', [($('reportTo').value||today()), 0]);
                } else if (CFG.reportKind === 'eod') {
                    result = await invoke('getEodReport', []);
                } else if (String(CFG.reportKind||'').startsWith('operational:')) {
                    const suffix = String(CFG.reportKind).split(':')[1];
                    const payload = {
                        from_date: $('reportFrom').value || '',
                        to_date: $('reportTo').value || '',
                        search: $('searchInput').value || '',
                        station_id: $('reportStationFilter') ? $('reportStationFilter').value : '',
                        fuel_type_id: $('reportFuelFilter') ? $('reportFuelFilter').value : '',
                        status: $('reportStatusFilter') ? $('reportStatusFilter').value : '',
                        report_type: $('reportKindFilter') ? $('reportKindFilter').value : 'detailed',
                        include_archived: true,
                        limit: 1000
                    };
                    result = await invoke('generate' + suffix + 'Report', [JSON.stringify(payload)]);
                } else {
                    result = { data: state.filtered };
                }
                $('reportResults').innerHTML = renderReport(rowsFrom(result));
                toast('تم توليد التقرير من المصدر الفعلي');
            } catch (e) {
                toast(e.message || 'فشل التقرير', true);
            } finally {
                setLoading(false);
            }
        }

        function renderReport(rows) {
            if (!rows.length) return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="data-fields">${rows.slice(0,200).map(row=>`
                <div class="data-field">
                    <span>${esc(titleOf(row))}</span>
                    <strong>${esc(subtitleOf(row)||JSON.stringify(row))}</strong>
                </div>`).join('')}</div>`;
        }

        function exportData() {
            const rows = state.filtered;
            if (!rows.length) { toast('لا توجد بيانات حقيقية لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const csv = '\ufeff' + [keys, ...rows.map(row => keys.map(k => String(row[k] ?? '').replace(/"/g,'""')))]
                .map(row => row.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = n => String(n).padStart(2,'0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            a.href = url;
            a.download = `tanks_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(()=>{URL.revokeObjectURL(url); a.remove();}, 500);
            toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً');
        }

        // ============================================================
        // التنقل والوضع
        // ============================================================
        function goHome() { window.location.href = '../main.html'; }

        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // ============================================================
        // القائمة الجانبية - فتح/إغلاق + إخفاء اللسان
        // ============================================================
        function openSidebar() {
            const side = $('sidebar');
            const toggle = $('sidebarToggle');
            side.classList.add('open');
            toggle.classList.add('hidden');
        }
        function closeSidebar() {
            const side = $('sidebar');
            const toggle = $('sidebarToggle');
            side.classList.remove('open');
            toggle.classList.remove('hidden');
        }

        function initSidebar() {
            $('sidebarToggle').addEventListener('click', (e)=>{
                e.stopPropagation();
                if ($('sidebar').classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            document.querySelectorAll('.sidebar-btn').forEach(btn=>{
                btn.addEventListener('click', ()=>{
                    const action = btn.dataset.sidebarAction;
                    closeSidebar();
                    setTimeout(()=>{
                        if (action === 'reload') reloadData();
                        else if (action === 'report') openReport();
                        else if (action === 'export') exportData();
                        else if (action === 'print') window.print();
                        else if (action === 'home') goHome();
                    }, 120);
                });
            });
            // إغلاق عند النقر خارج القائمة
            document.addEventListener('click', (e)=>{
                const side = $('sidebar');
                const toggle = $('sidebarToggle');
                if (!side.classList.contains('open')) return;
                if (side.contains(e.target) || toggle.contains(e.target)) return;
                closeSidebar();
            });
            document.addEventListener('keydown', (e)=>{
                if (e.key === 'Escape') {
                    closeSidebar();
                    document.querySelectorAll('.modal-overlay').forEach(x=>x.classList.remove('show'));
                }
            });
        }

        // ============================================================
        // ربط الأحداث
        // ============================================================
        function bindGlobalEvents() {
            $('searchInput').addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('fab').addEventListener('click', ()=>openForm());
            $('saveBtn').addEventListener('click', saveForm);
            window.addEventListener('online', ()=>toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
            window.addEventListener('offline', ()=>$('offlineBanner').classList.add('show'));
        }

        // تصدير الدوال إلى window لاستخدامها في onclick
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm, saveForm,
            openModal, closeModal
        });

        // ============================================================
        // التهيئة
        // ============================================================
        applyTheme();
        renderFilters();
        initSidebar();
        bindGlobalEvents();
        reloadData();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
