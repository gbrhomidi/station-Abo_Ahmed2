<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>دفعات الموظفين</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/fonts/cairo.css">
    <style>
        /* ============================================================
           المتغيرات الأساسية (دعم الوضع الداكن والنهاري)
           ============================================================ */
        :root {
            --bg: #f4f7fb;
            --surface: #fff;
            --surface-2: #f8fafc;
            --surface-3: #eef4f9;
            --primary: #087ea4;
            --primary-2: #2563eb;
            --primary-soft: rgba(37,99,235,.10);
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --text: #172033;
            --muted: #64748b;
            --border: #d7dee8;
            --border-strong: #c4cfdd;
            --accent: #c58a18;
            --shadow: 0 12px 35px rgba(15,23,42,.08);
            --shadow-lg: 0 25px 70px rgba(15,23,42,.16);
            --radius: 20px;
            --radius-sm: 13px;
            --font-sans: "Cairo","Noto Sans Arabic",Arial,sans-serif;
            --glass-bg: rgba(255,255,255,0.85);
            --card-hover-bg: rgba(37,99,235,0.04);
            --fab-shadow: rgba(37,99,235,0.3);
            --toast-bg: #fff;
            --scrollbar-track: #f4f7fb;
            --scrollbar-thumb: rgba(15,23,42,0.2);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f4f7fb;
            --input-bg: #fff;
            --input-border: #d7dee8;
            --data-text-color: #172033;
            --data-text-muted: #64748b;
        }

        [data-theme="dark"] {
            --bg: #06111f;
            --surface: #0c1b2d;
            --surface-2: #102238;
            --surface-3: #132941;
            --primary: #55c7f5;
            --primary-2: #6ea8ff;
            --primary-soft: rgba(85,199,245,.12);
            --success: #42e39a;
            --warning: #ffd166;
            --danger: #ff7184;
            --text: #eef7ff;
            --muted: #aabbd0;
            --border: #49a9ee;
            --border-strong: #76c8ff;
            --accent: #f1cf7a;
            --shadow: 0 14px 40px rgba(0,0,0,.38);
            --shadow-lg: 0 25px 75px rgba(0,0,0,.55);
            --glass-bg: rgba(22,34,64,0.85);
            --card-hover-bg: rgba(85,199,245,0.05);
            --fab-shadow: rgba(85,199,245,0.3);
            --toast-bg: #1a2236;
            --scrollbar-track: transparent;
            --scrollbar-thumb: rgba(255,255,255,0.1);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;
            --input-bg: #1e293b;
            --input-border: #49a9ee;
            --data-text-color: #eef7ff;
            --data-text-muted: #aabbd0;
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 92px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--danger);
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 900;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ===== الشريط العلوي ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 14px;
        }
        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 20px;
        }
        .title h1 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 950;
            color: var(--data-text-color);
        }
        .title p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .7rem;
        }
        .actions {
            display: flex;
            gap: 7px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface-2);
            color: var(--text);
            display: grid;
            place-items: center;
            font-size: 19px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .icon-btn:active { transform: scale(.94); }
        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== البحث ===== */
        .search {
            margin-top: 12px;
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-2);
            color: var(--text);
            padding: 0 45px 0 14px;
            text-align: center;
            outline: none;
            font-family: var(--font-sans);
        }
        .search i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
        }

        /* ===== التبويبات العلوية ===== */
        .tabs {
            display: flex;
            gap: 7px;
            overflow: auto;
            padding: 11px 1px 2px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 14px;
            white-space: nowrap;
            font-size: .76rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        .tab.active {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
        }
        .tab:active { transform: scale(0.95); }

        /* ===== الحاوية الرئيسية ===== */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 14px;
        }

        /* ===== بطاقات الإحصائيات ===== */
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .kpi {
            background: linear-gradient(145deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            text-align: center;
            animation: up .45s both;
        }
        .kpi b {
            display: block;
            font-size: 1.35rem;
            color: var(--data-text-color);
        }
        .kpi span {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 800;
        }

        /* ===== لوحة البيانات ===== */
        .panel {
            margin-top: 12px;
            background: linear-gradient(145deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
        }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .panel-head h2 {
            font-size: .95rem;
            margin: 0;
            color: var(--data-text-color);
        }
        .count {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 900;
        }

        /* ===== بطاقات الدفعات ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 14px;
            box-shadow: 0 7px 20px rgba(15,23,42,.05);
            animation: up .42s both;
            text-align: center;
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
        }
        .card-employee {
            font-size: .7rem;
            color: var(--muted);
            font-weight: 900;
        }
        .status {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: .68rem;
            font-weight: 900;
        }
        .status.paid { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
        .status.pending { color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }
        .status.rejected { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
        .status.under_review { color: var(--primary); background: var(--primary-soft); }
        .card h3 {
            font-size: 1rem;
            margin: 12px 0 4px;
            color: var(--data-text-color);
        }
        .card-sub {
            font-size: .72rem;
            color: var(--muted);
            line-height: 1.8;
        }
        .card-amount {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--accent);
            margin: 8px 0;
        }
        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            margin-top: 12px;
        }
        .meta-item {
            padding: 9px;
            border-radius: 11px;
            background: var(--primary-soft);
            font-size: .68rem;
        }
        .meta-item span {
            display: block;
            color: var(--muted);
            margin-bottom: 2px;
        }
        .meta-item b {
            display: block;
            overflow-wrap: anywhere;
            color: var(--data-text-color);
        }
        .card-actions {
            display: flex;
            gap: 7px;
            margin-top: 11px;
        }

        /* ===== الأزرار ===== */
        .btn {
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--surface-2);
            color: var(--text);
            padding: 9px 11px;
            font-weight: 850;
            font-size: .72rem;
            flex: 1;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--primary-2), var(--primary));
            color: #fff;
            border: none;
        }
        .btn.primary:hover { opacity: 0.9; color: #fff; }
        .btn.danger { color: var(--danger); }
        .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn.warning { color: var(--warning); }
        .btn.warning:hover { border-color: var(--warning); color: var(--warning); }

        /* ===== الحالة الفارغة ===== */
        .empty {
            text-align: center;
            padding: 45px 15px;
            color: var(--muted);
            grid-column: 1/-1;
        }
        .empty i {
            font-size: 38px;
            color: var(--primary);
            display: block;
            margin-bottom: 10px;
        }

        /* ===== القائمة السفلية (Bottom Navigation) ===== */
        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--surface) 95%, transparent);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            gap: 8px;
        }
        .bottom button {
            flex: 1;
            border: 1px solid transparent;
            border-radius: 15px;
            background: transparent;
            color: var(--muted);
            padding: 7px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 2.1rem;
            font-weight: 950;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        .bottom button span {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .bottom button.active {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .bottom button:active { transform: scale(0.95); }

        /* ===== المودالات ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: rgba(2,8,23,.62);
            backdrop-filter: blur(7px);
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal {
            width: min(760px, 100%);
            max-height: 94vh;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 25px 25px 0 0;
            box-shadow: var(--shadow-lg);
            animation: modalIn .28s ease;
        }
        .modal.wide { width: min(960px, 100%); }
        .modal-head {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-head h2 {
            font-size: 1rem;
            margin: 0;
            color: var(--data-text-color);
        }
        .modal-body { padding: 16px; }
        .modal-foot {
            position: sticky;
            bottom: 0;
            background: var(--surface);
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        /* ===== نموذج الإضافة ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .field { min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .field label {
            display: block;
            text-align: center;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .input {
            width: 100%;
            min-height: 46px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            padding: 10px 12px;
            text-align: center;
            outline: none;
            font-family: var(--font-sans);
        }
        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
        }
        .input:disabled {
            background: var(--surface-3);
            color: var(--muted);
            opacity: .72;
        }
        .textarea {
            min-height: 92px;
            resize: vertical;
        }
        .select-wrap { position: relative; }
        .select-wrap:after {
            content: '⌄';
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--muted);
        }

        .error-box {
            display: none;
            margin-bottom: 12px;
            border: 1px solid var(--danger);
            background: color-mix(in srgb, var(--danger) 10%, transparent);
            color: var(--danger);
            border-radius: 13px;
            padding: 10px;
            text-align: center;
            font-size: .74rem;
            font-weight: 800;
        }
        .error-box.show { display: block; }

        /* ===== التوست ===== */
        .toast {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-15px);
            z-index: 1300;
            max-width: 90%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 16px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            text-align: center;
            font-size: .75rem;
            font-weight: 850;
            color: var(--text);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }

        /* ===== السحب للتحديث ===== */
        .pull {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translate(-50%, -70px);
            z-index: 1200;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0 0 14px 14px;
            padding: 8px 15px;
            color: var(--primary);
            font-size: .72rem;
            font-weight: 900;
            transition: .2s;
        }
        .pull.show { transform: translate(-50%, 0); }

        /* ===== التقارير ===== */
        .report-panel.hidden { display: none; }
        .report-result {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .report-result table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .report-result table th {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 10px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        .report-result table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            color: var(--data-text-color);
        }
        .report-result table tr:hover { background: var(--card-hover-bg); }

        /* ===== الرسوم المتحركة ===== */
        @keyframes up {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes modalIn {
            from { transform: translateY(20px); opacity: .5; }
            to { transform: none; opacity: 1; }
        }

        /* ===== التوافق مع الشاشات الصغيرة ===== */
        @media (max-width: 760px) {
            .kpis { grid-template-columns: repeat(2, 1fr); }
            .cards { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 460px) {
            /* .form-grid kept at 2 columns for all screen sizes per requirement */
            .field.full { grid-column: 1 / -1; }
            .title p { display: none; }
            .container { padding: 10px; }
            .panel { padding: 10px; }
            .modal-body { padding: 12px; }
            .bottom button span { font-size: 1.2rem; }
        }

        /* ===== الوضع المظلم ===== */
        [data-theme="dark"] .panel,
        [data-theme="dark"] .card,
        [data-theme="dark"] .kpi {
            border-color: #63c7ff !important;
            box-shadow: 0 0 0 1px rgba(99,199,255,.16), 0 0 18px rgba(99,199,255,.07);
        }

        /* ===== الطباعة ===== */
        @media print {
            .topbar, .bottom, .offline-banner, .card-actions, .icon-btn { display: none !important; }
            body { background: #fff; color: #111; padding: 0; }
            .panel, .card, .kpi { box-shadow: none; border: 1px solid #aaa; }
        }
    </style>
</head>
<body>

    <!-- ===== الإشعارات العلوية ===== -->
    <div class="offline-banner" id="offlineBanner"><i class="fas fa-triangle-exclamation"></i> Android Bridge غير متاح؛ لن تُحفظ أو تُعرض بيانات.</div>
    <div class="pull" id="pull">اسحب للتحديث…</div>
    <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>

    <!-- ===== الشريط العلوي ===== -->
    <header class="topbar">
        <div class="topbar-row">
            <div class="title">
                <div class="title-icon"><i class="fas fa-wallet"></i></div>
                <div>
                    <h1>دفعات الموظفين</h1>
                    <p id="contextText">إدارة الرواتب والسلف والخصومات</p>
                </div>
            </div>
            <div class="actions">
                <button class="icon-btn" id="themeBtn" title="الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button class="icon-btn" id="homeBtn" title="رجوع"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
        <div class="search">
            <i class="fas fa-search"></i>
            <input class="search-input" id="searchInput" type="search" placeholder="بحث في الدفعات..." autocomplete="off">
        </div>

    <!-- ===== المحتوى الرئيسي ===== -->
    <main class="container">
        <!-- الإحصائيات -->

            <div class="kpi"><b id="kTotal">0</b><span>إجمالي الدفعات</span></div>
            <div class="kpi"><b id="kPaid">0</b><span>مدفوعة</span></div>
            <div class="kpi"><b id="kPending">0</b><span>معلقة</span></div>
            <div class="kpi"><b id="kTotalAmount">0</b><span>إجمالي المبلغ</span></div>
        </section>

        <!-- قائمة الدفعات -->

            <div class="panel-head">

    <!-- ===== القائمة السفلية ===== -->

        <button id="reportBtn"><i class="fas fa-chart-bar"></i><span>تقارير</span></button>
    </nav>

    <!-- ===== مودال إضافة/تعديل دفعة ===== -->
    <div class="overlay" id="formOverlay">
        <div class="modal">
            <div class="modal-head">
                <h2 id="formTitle">إضافة دفعة جديدة</h2>
                <button class="icon-btn" id="closeForm"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="error-box" id="formError"></div>
                <form id="recordForm" class="form-grid" novalidate>
                    <!-- الموظف - عرض كامل: اسم الموظف للعرض فقط + select مخفي لرقم الموظف -->
                    <div class="field full">
                        <label>الموظف <span style="color:var(--danger);">*</span></label>
                        <input class="input" id="employee_name_display" type="text" readonly placeholder="اختر الموظف" style="cursor:pointer;background:var(--surface-2);" onclick="openEmployeePicker()">
                        <select class="input" id="employee_id" name="employee_id" required style="display:none;">
                            <option value="">اختر الموظف</option>
                        </select>
                    </div>

                    <!-- نوع الدفعة + المبلغ -->
                    <div class="field">
                        <label>نوع الدفعة <span style="color:var(--danger);">*</span></label>
                        <div class="select-wrap">
                            <select class="input" id="payment_type" name="payment_type" required>
                                <option value="salary">راتب</option>
                                <option value="advance">سلفة</option>
                                <option value="bonus">مكافأة</option>
                                <option value="deduction">خصم</option>
                                <option value="allowance">بدل</option>
                            </select>
                        </div>
                    </div>
                    <div class="field">
                        <label>المبلغ <span style="color:var(--danger);">*</span></label>
                        <input class="input" id="amount" name="amount" type="number" step="0.01" min="0" inputmode="decimal" required placeholder="0.00">
                    </div>

                    <!-- تاريخ الدفعة + الحالة -->
                    <div class="field">
                        <label>تاريخ الدفعة</label>
                        <input class="input" id="payment_date" name="payment_date" type="date" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label>الحالة</label>
                        <div class="select-wrap">
                            <select class="input" id="status" name="status">
                                <option value="pending">معلقة</option>
                                <option value="paid">مدفوعة</option>
                                <option value="under_review">قيد المراجعة</option>
                                <option value="rejected">مرفوضة</option>
                            </select>
                        </div>
                    </div>

                    <!-- فترة الدفع من + فترة الدفع إلى -->
                    <div class="field">
                        <label>فترة الدفع من</label>
                        <input class="input" id="period_from" name="period_from" type="date" inputmode="numeric">
                    </div>
                    <div class="field">
                        <label>فترة الدفع إلى</label>
                        <input class="input" id="period_to" name="period_to" type="date" inputmode="numeric">
                    </div>

                    <!-- المشغل - عرض كامل -->
                    <div class="field full">
                        <label>المشغل</label>
                        <input class="input" id="operator" name="operator" type="text" inputmode="text" placeholder="اسم المشغل">
                    </div>

                    <!-- الوصف - عرض كامل -->
                    <div class="field full">
                        <label>الوصف</label>
                        <textarea class="input textarea" id="description" name="description" inputmode="text" placeholder="وصف الدفعة..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-foot">
                <button class="btn primary" id="saveBtn"><i class="fas fa-save"></i> حفظ</button>
                <button class="btn" id="cancelForm">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ===== مودال التفاصيل ===== -->
    <div class="overlay" id="detailsOverlay">
        <div class="modal">
            <div class="modal-head">
                <h2>تفاصيل الدفعة</h2>
                <button class="icon-btn" id="closeDetails"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="detailsBody"></div>
        </div>

    <!-- ===== مودال التقارير ===== -->
    <div class="overlay" id="reportOverlay">
        <div class="modal wide">
            <div class="modal-head">
                <h2><i class="fas fa-chart-pie"></i> التقارير المتقدمة</h2>
                <button class="icon-btn" id="closeReport"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <!-- تبويبات التقارير -->
                <div class="tabs" id="reportTabs" style="margin-bottom:16px;">
                    <button class="tab active" data-report="summary">📊 ملخص الدفعات</button>
                    <button class="tab" data-report="salary">💰 كشف الرواتب</button>
                    <button class="tab" data-report="advance">🏦 تقرير السلف</button>
                    <button class="tab" data-report="deduction">📉 تحليل الخصومات</button>
                </div>

                <!-- محتوى التقارير -->
                <div id="reportPanels">
                    <!-- ملخص الدفعات -->
                    <div id="report-summary" class="report-panel">
                        <div class="form-grid">
                            <div class="field"><label>من تاريخ</label><input class="input" id="reportFrom" type="date"></div>
                            <div class="field"><label>إلى تاريخ</label><input class="input" id="reportTo" type="date"></div>
                        </div>
                        <div class="card-actions">
                            <button class="btn primary" id="runSummaryReport"><i class="fas fa-cog"></i> توليد الملخص</button>
                            <button class="btn" id="exportSummaryReport"><i class="fas fa-file-export"></i> تصدير CSV</button>
                        </div>
                        <div class="report-result" id="summaryResult"></div>
                    </div>

                    <!-- كشف الرواتب -->
                    <div id="report-salary" class="report-panel hidden">
                        <div class="form-grid">
                            <div class="field"><label>الشهر</label><input class="input" id="salaryMonth" type="month"></div>
                            <div class="field"><label>الموظف</label>
                                <div class="select-wrap">
                                    <select class="input" id="salaryEmployee"><option value="">جميع الموظفين</option></select>
                                </div>
                            </div>
                        </div>
                        <button class="btn primary" id="runSalaryReport"><i class="fas fa-cog"></i> توليد كشف الرواتب</button>
                        <div class="report-result" id="salaryResult"></div>
                    </div>

                    <!-- تقرير السلف -->
                    <div id="report-advance" class="report-panel hidden">
                        <div class="form-grid">
                            <div class="field"><label>الموظف</label>
                                <div class="select-wrap">
                                    <select class="input" id="advanceEmployee"><option value="">جميع الموظفين</option></select>
                                </div>
                            </div>
                            <div class="field"><label>الحالة</label>
                                <div class="select-wrap">
                                    <select class="input" id="advanceStatus">
                                        <option value="all">الكل</option>
                                        <option value="pending">معلقة</option>
                                        <option value="paid">مدفوعة</option>
                                        <option value="rejected">مرفوضة</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button class="btn primary" id="runAdvanceReport"><i class="fas fa-cog"></i> توليد تقرير السلف</button>
                        <div class="report-result" id="advanceResult"></div>
                    </div>

                    <!-- تحليل الخصومات -->
                    <div id="report-deduction" class="report-panel hidden">
                        <div class="form-grid">
                            <div class="field"><label>من تاريخ</label><input class="input" id="deductionFrom" type="date"></div>
                            <div class="field"><label>إلى تاريخ</label><input class="input" id="deductionTo" type="date"></div>
                        </div>
                        <button class="btn primary" id="runDeductionReport"><i class="fas fa-cog"></i> تحليل الخصومات</button>
                        <div class="report-result" id="deductionResult"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== التوست ===== -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- ===== جافا سكريبت ===== -->
    <!-- ============================================================ -->
    <script>
    (() => {
        'use strict';

        const bridge = window.AndroidInterface || null;
        const state = {
            rows: [],
            filtered: [],
            tab: 'payments',
            editing: null,
            employees: [],
            loadedAt: null
        };

        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? '—').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const today = () => new Date().toISOString().slice(0, 10);
        const now = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

        // ===== دوال الجسر =====
        function parse(v) {
            if (v == null) throw new Error('لم يرجع الجسر نتيجة');
            const x = typeof v === 'string' ? JSON.parse(v) : v;
            if (x && x.success === false) throw new Error(x.error || x.message || 'فشلت العملية');
            return x;
        }

        function dataOf(v) { return v && Object.prototype.hasOwnProperty.call(v, 'data') ? v.data : v; }

        function rowsOf(v) {
            const x = dataOf(v);
            if (Array.isArray(x)) return x;
            if (x && Array.isArray(x.rows)) return x.rows;
            if (x && Array.isArray(x.data)) return x.data;
            if (x && typeof x === 'object') return [x];
            return [];
        }

        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') {
                return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            }
            try {
                return Promise.resolve(parse(bridge[method](...args)));
            } catch (e) {
                return Promise.reject(e);
            }
        }

        // ===== التوست =====
        let toastTimer;

        function toast(msg, type = 'success') {
            const n = $('toast');
            n.textContent = msg;
            n.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => n.className = 'toast', 3600);
        }

        // ===== التحميل =====
        function setLoading(v) {
            $('loadingIndicator').classList.toggle('show', !!v);
        }

        // ===== المودالات =====
        function openOverlay(id) { $(id).classList.add('show'); }
        function closeOverlay(id) { $(id).classList.remove('show'); }

        // ===== التبويبات العلوية (بدون "تقارير") =====
        const tabs = [
            ['payments', 'الــدفعات', 'fa-wallet'],
            ['salaries', 'الــرواتب', 'fa-money-bill-wave'],
            ['advances', 'السلــف', 'fa-hand-holding-usd'],
            ['deductions', 'الخصومــات', 'fa-minus-circle']
        ];

        function renderTabs() {
            $('tabs').innerHTML = tabs.map(([k, l, icon]) =>
                `<button class="tab ${state.tab === k ? 'active' : ''}" data-tab="${k}"><i class="fas ${icon}"></i> ${l}</button>`
            ).join('');
            document.querySelectorAll('#tabs [data-tab]').forEach(b => {
                b.onclick = () => {
                    state.tab = b.dataset.tab;
                    renderTabs();
                    applyFilter();
                };
            });
        }

        // ===== التصفية حسب التبويب =====
        function matchesTab(row) {
            const type = row.payment_type || row.type || '';
            switch (state.tab) {
                case 'salaries': return type === 'salary';
                case 'advances': return type === 'advance';
                case 'deductions': return type === 'deduction';
                case 'payments':
                default: return true;
            }
        }

        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            state.filtered = state.rows.filter(row => {
                const text = JSON.stringify(row || {}).toLowerCase();
                return matchesTab(row) && (!q || text.includes(q));
            });
            renderCards();
        }

        // ===== عرض البطاقات =====
        function renderCards() {
            const rows = state.filtered;
            $('count').textContent = rows.length.toLocaleString('ar');

            // الإحصائيات
            const total = rows.length;
            const paid = rows.filter(r => (r.status || '').toLowerCase() === 'paid').length;
            const pending = rows.filter(r => (r.status || '').toLowerCase() === 'pending').length;
            const totalAmount = rows.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);

            $('kTotal').textContent = total.toLocaleString('ar');
            $('kPaid').textContent = paid.toLocaleString('ar');
            $('kPending').textContent = pending.toLocaleString('ar');
            $('kTotalAmount').textContent = totalAmount.toLocaleString('ar', { maximumFractionDigits: 2 });

            const box = $('cards');
            if (!rows.length) {
                box.innerHTML = `<div class="empty"><i class="fas fa-inbox"></i><div>لا توجد دفعات مطابقة.</div></div>`;
                return;
            }

            box.innerHTML = rows.map((row, i) => {
                const id = row.id ?? i;
                const status = (row.status || 'pending').toLowerCase();
                const statusMap = {
                    'paid': 'مدفوعة',
                    'pending': 'معلقة',
                    'rejected': 'مرفوضة',
                    'under_review': 'قيد المراجعة'
                };
                const statusLabel = statusMap[status] || status;
                const typeMap = {
                    'salary': 'راتب',
                    'advance': 'سلفة',
                    'bonus': 'مكافأة',
                    'deduction': 'خصم',
                    'allowance': 'بدل'
                };
                const typeLabel = typeMap[row.payment_type] || row.payment_type || '—';
                const employeeName = row.employee_name || 'موظف #' + row.employee_id;
                const amount = parseFloat(row.amount) || 0;

                return `<article class="card" style="animation-delay:${Math.min(i * 35, 350)}ms">
                    <div class="card-top">
                        <span class="card-employee"><i class="fas fa-user"></i> ${esc(employeeName)}</span>
                        <span class="status ${status}">${statusLabel}</span>
                    </div>
                    <h3>${esc(typeLabel)}</h3>
                    <div class="card-amount">${amount.toLocaleString('ar', { maximumFractionDigits: 2 })} ₪</div>
                    <div class="card-sub">${esc(row.description || 'بدون وصف')}</div>
                    <div class="meta">
                        <div class="meta-item"><span>التاريخ</span><b>${esc(String(row.payment_date || row.date || '—').slice(0,10))}</b></div>
                        <div class="meta-item"><span>فترة الدفع</span><b>${esc(String(row.period_from || '—').slice(0,10))} → ${esc(String(row.period_to || '—').slice(0,10))}</b></div>
                        <div class="meta-item"><span>المشغل</span><b>${esc(row.operator || '—')}</b></div>
                        <div class="meta-item"><span>المعرف</span><b>#${esc(id)}</b></div>
                    </div>
                    <div class="card-actions">
                        <button class="btn" data-view="${esc(id)}"><i class="fas fa-eye"></i> عرض</button>
                        <button class="btn warning" data-edit="${esc(id)}"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn danger" data-delete="${esc(id)}"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                </article>`;
            }).join('');

            box.querySelectorAll('[data-view]').forEach(b => b.onclick = () => openDetails(findRow(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(findRow(b.dataset.edit)));
            box.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteRow(findRow(b.dataset.delete)));
        }

        function findRow(id) {
            return state.rows.find((row, i) => String(row.id ?? i) === String(id));
        }

        // ===== جلب الموظفين =====
        async function loadEmployees() {
            try {
                const result = await invoke('getEmployees', []);
                state.employees = rowsOf(result);
                populateEmployeeSelects();
            } catch (e) {
                toast('فشل تحميل الموظفين: ' + e.message, 'warning');
                state.employees = [];
            }
        }

        function populateEmployeeSelects() {
            const selects = ['employee_id', 'salaryEmployee', 'advanceEmployee'];
            selects.forEach(id => {
                const sel = $(id);
                if (!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = '<option value="">اختر الموظف</option>' +
                    state.employees.map(emp =>
                        `<option value="${esc(emp.id)}">${esc(emp.name || emp.employee_name || 'موظف #' + emp.id)}</option>`
                    ).join('');
                if (currentVal) sel.value = currentVal;
            });
            // Update display field when select changes
            updateEmployeeDisplay();
        }

        function updateEmployeeDisplay() {
            const sel = $('employee_id');
            const display = $('employee_name_display');
            if (!sel || !display) return;
            const selectedOption = sel.options[sel.selectedIndex];
            display.value = selectedOption && selectedOption.value ? selectedOption.text : '';
        }

        function openEmployeePicker() {
            // Show the hidden select as a dropdown picker
            const sel = $('employee_id');
            if (!sel) return;
            // Create a temporary overlay picker
            const pickerOverlay = document.createElement('div');
            pickerOverlay.id = 'employeePickerOverlay';
            pickerOverlay.style.cssText = 'position:fixed;inset:0;z-index:900;background:rgba(2,8,23,.62);backdrop-filter:blur(7px);display:flex;align-items:flex-end;justify-content:center;';

            const pickerModal = document.createElement('div');
            pickerModal.style.cssText = 'width:min(760px,100%);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:25px 25px 0 0;box-shadow:var(--shadow-lg);padding:16px;animation:modalIn .28s ease;';

            let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px;"><h2 style="margin:0;font-size:1rem;color:var(--data-text-color);">اختر الموظف</h2><button id="closePicker" style="width:42px;height:42px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);color:var(--text);display:grid;place-items:center;font-size:19px;cursor:pointer;"><i class="fas fa-times"></i></button></div>';
            html += '<div style="display:flex;flex-direction:column;gap:8px;">';
            state.employees.forEach(emp => {
                const name = esc(emp.name || emp.employee_name || 'موظف #' + emp.id);
                html += `<button class="btn" style="justify-content:flex-start;text-align:right;padding:14px 16px;font-size:.85rem;" data-emp-id="${esc(emp.id)}" data-emp-name="${name}"><i class="fas fa-user" style="margin-left:10px;color:var(--primary);"></i> ${name}</button>`;
            });
            html += '</div>';

            pickerModal.innerHTML = html;
            pickerOverlay.appendChild(pickerModal);
            document.body.appendChild(pickerOverlay);

            // Close handler
            pickerOverlay.querySelector('#closePicker').onclick = () => {
                document.body.removeChild(pickerOverlay);
            };
            pickerOverlay.onclick = (e) => {
                if (e.target === pickerOverlay) document.body.removeChild(pickerOverlay);
            };

            // Selection handler
            pickerModal.querySelectorAll('[data-emp-id]').forEach(btn => {
                btn.onclick = () => {
                    $('employee_id').value = btn.dataset.empId;
                    $('employee_name_display').value = btn.dataset.empName;
                    document.body.removeChild(pickerOverlay);
                };
            });
        }

        // ===== جلب البيانات من SQLite =====
        async function loadData() {
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                state.rows = [];
                applyFilter();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke('getEmployeePaymentRecords', [JSON.stringify({ limit: 500, search: $('searchInput').value || '' })]);
                state.rows = rowsOf(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                await loadEmployees();
                applyFilter();
            } catch (e) {
                $('offlineBanner').classList.add('show');
                state.rows = [];
                applyFilter();
                toast(e.message || 'فشل تحميل البيانات', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ===== نموذج الإضافة (مع ترتيب الحقول المطلوب) =====
        function openForm(row = null) {
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل الدفعة' : 'إضافة دفعة جديدة';
            $('formError').className = 'error-box';
            $('formError').textContent = '';

            // تعبئة الحقول
            const fields = ['employee_id', 'payment_type', 'amount', 'payment_date', 'period_from', 'period_to', 'status', 'operator', 'description'];
            fields.forEach(f => {
                const el = $(f);
                if (!el) return;
                if (row && row[f] !== undefined && row[f] !== null) {
                    el.value = row[f];
                } else {
                    // القيم الافتراضية
                    if (f === 'payment_date') el.value = today();
                    else if (f === 'status') el.value = 'pending';
                    else if (f === 'payment_type') el.value = 'salary';
                    else el.value = '';
                }
            });

            populateEmployeeSelects();
            if (row && row.employee_id) {
                $('employee_id').value = row.employee_id;
            }
            // Update employee display name
            updateEmployeeDisplay();

            openOverlay('formOverlay');
            setTimeout(() => $('employee_name_display').focus(), 200);
        }

        function collectForm() {
            return {
                employee_id: parseInt($('employee_id').value) || 0,
                payment_type: $('payment_type').value,
                amount: parseFloat($('amount').value) || 0,
                payment_date: $('payment_date').value || today(),
                period_from: $('period_from').value || '',
                period_to: $('period_to').value || '',
                status: $('status').value || 'pending',
                operator: $('operator').value || '',
                description: $('description').value || ''
            };
        }

        function validateForm(data) {
            const errors = [];
            if (!data.employee_id || data.employee_id <= 0) errors.push('الموظف مطلوب.');
            if (!data.payment_type) errors.push('نوع الدفعة مطلوب.');
            if (data.amount <= 0) errors.push('المبلغ يجب أن يكون أكبر من صفر.');
            if (data.period_from && data.period_to && data.period_from > data.period_to) {
                errors.push('تاريخ البداية يجب ألا يتجاوز تاريخ النهاية.');
            }
            return errors;
        }

        async function saveForm() {
            const data = collectForm();
            const errors = validateForm(data);
            if (errors.length) {
                $('formError').innerHTML = errors.map(e => `• ${esc(e)}`).join('<br>');
                $('formError').className = 'error-box show';
                toast('يرجى تصحيح الأخطاء', 'error');
                return;
            }

            setLoading(true);
            try {
                let result;
                if (state.editing) {
                    result = await invoke('updateEmployeePaymentRecord', [Number(state.editing.id), JSON.stringify(data)]);
                } else {
                    result = await invoke('saveEmployeePaymentRecord', [JSON.stringify(data)]);
                }
                parse(result);
                toast(state.editing ? 'تم تحديث الدفعة' : 'تم إضافة الدفعة');
                closeOverlay('formOverlay');
                await loadData();
            } catch (e) {
                $('formError').textContent = e.message || 'تعذر الحفظ';
                $('formError').className = 'error-box show';
                toast(e.message || 'تعذر الحفظ', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ===== الحذف =====
        async function deleteRow(row) {
            if (!row) return;
            if (!confirm('هل تريد حذف هذه الدفعة نهائياً؟')) return;
            setLoading(true);
            try {
                await invoke('deleteEmployeePaymentRecord', [Number(row.id)]);
                toast('تم الحذف');
                await loadData();
            } catch (e) {
                toast(e.message || 'فشل الحذف', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ===== التفاصيل =====
        function openDetails(row) {
            if (!row) return;
            const typeMap = { 'salary': 'راتب', 'advance': 'سلفة', 'bonus': 'مكافأة', 'deduction': 'خصم', 'allowance': 'بدل' };
            const statusMap = { 'paid': 'مدفوعة', 'pending': 'معلقة', 'rejected': 'مرفوضة', 'under_review': 'قيد المراجعة' };
            const employeeName = state.employees.find(e => e.id == row.employee_id)?.name || 'موظف #' + row.employee_id;

            $('detailsBody').innerHTML = `
                <div class="meta">
                    <div class="meta-item"><span>الموظف</span><b>${esc(employeeName)}</b></div>
                    <div class="meta-item"><span>نوع الدفعة</span><b>${esc(typeMap[row.payment_type] || row.payment_type)}</b></div>
                    <div class="meta-item"><span>المبلغ</span><b>${(parseFloat(row.amount)||0).toLocaleString('ar',{maximumFractionDigits:2})} ₪</b></div>
                    <div class="meta-item"><span>التاريخ</span><b>${esc(String(row.payment_date||'').slice(0,10))}</b></div>
                    <div class="meta-item"><span>فترة الدفع</span><b>${esc(String(row.period_from||'').slice(0,10))} → ${esc(String(row.period_to||'').slice(0,10))}</b></div>
                    <div class="meta-item"><span>الحالة</span><b>${esc(statusMap[row.status]||row.status)}</b></div>
                    <div class="meta-item"><span>المشغل</span><b>${esc(row.operator||'—')}</b></div>
                    <div class="meta-item"><span>الوصف</span><b>${esc(row.description||'—')}</b></div>
                </div>
                <details style="margin-top:14px">
                    <summary style="cursor:pointer;color:var(--muted);font-size:.8rem;">JSON الخام</summary>
                    <pre style="direction:ltr;text-align:left;background:#0b1220;color:#dbeafe;padding:12px;border-radius:10px;font:.72rem/1.5 monospace;max-height:200px;overflow:auto;">${esc(JSON.stringify(row,null,2))}</pre>
                </details>
            `;
            openOverlay('detailsOverlay');
        }

        // ===== التقارير =====
        function initReportTabs() {
            document.querySelectorAll('#reportTabs .tab').forEach(tab => {
                tab.onclick = function() {
                    document.querySelectorAll('#reportTabs .tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const panelId = 'report-' + this.dataset.report;
                    document.querySelectorAll('.report-panel').forEach(p => p.classList.add('hidden'));
                    const panel = document.getElementById(panelId);
                    if (panel) panel.classList.remove('hidden');
                };
            });
        }

        function renderReportTable(rows, columns) {
            if (!rows || !rows.length) {
                return '<div class="empty"><i class="fas fa-file-alt"></i><div>لا توجد بيانات للتقرير.</div></div>';
            }
            let html = `<table><thead><tr>`;
            columns.forEach(col => html += `<th>${esc(col)}</th>`);
            html += `</tr></thead><tbody>`;
            rows.slice(0, 200).forEach(row => {
                html += `<tr>`;
                columns.forEach(col => {
                    const val = row[col] !== undefined ? row[col] : '—';
                    html += `<td>${esc(typeof val === 'object' ? JSON.stringify(val) : val)}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        // --- ملخص الدفعات ---
        async function runSummaryReport() {
            const from = $('reportFrom').value || '';
            const to = $('reportTo').value || '';
            let filtered = state.rows;
            if (from) filtered = filtered.filter(r => r.payment_date && String(r.payment_date) >= from);
            if (to) filtered = filtered.filter(r => r.payment_date && String(r.payment_date) <= to);

            const total = filtered.length;
            const paid = filtered.filter(r => (r.status || '').toLowerCase() === 'paid').length;
            const pending = filtered.filter(r => (r.status || '').toLowerCase() === 'pending').length;
            const rejected = filtered.filter(r => (r.status || '').toLowerCase() === 'rejected').length;
            const totalAmount = filtered.reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            const salaryTotal = filtered.filter(r => r.payment_type === 'salary').reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
            const advanceTotal = filtered.filter(r => r.payment_type === 'advance').reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);

            $('summaryResult').innerHTML = `
                <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:12px;">
                    <div class="kpi"><b>${total}</b><span>إجمالي الدفعات</span></div>
                    <div class="kpi"><b>${paid}</b><span>مدفوعة</span></div>
                    <div class="kpi"><b>${pending}</b><span>معلقة</span></div>
                    <div class="kpi"><b>${totalAmount.toFixed(2)}</b><span>إجمالي المبلغ</span></div>
                    <div class="kpi"><b>${salaryTotal.toFixed(2)}</b><span>إجمالي الرواتب</span></div>
                    <div class="kpi"><b>${advanceTotal.toFixed(2)}</b><span>إجمالي السلف</span></div>
                    <div class="kpi"><b>${rejected}</b><span>مرفوضة</span></div>
                </div>
                ${renderReportTable(filtered, ['employee_name','payment_type','amount','payment_date','status','description'])}
            `;
            toast('تم توليد الملخص', 'success');
        }

        // --- كشف الرواتب ---
        async function runSalaryReport() {
            const month = $('salaryMonth').value || '';
            const empId = $('salaryEmployee').value || '';
            let filtered = state.rows.filter(r => r.payment_type === 'salary');
            if (month) {
                const m = month.slice(0, 7);
                filtered = filtered.filter(r => {
                    const d = String(r.payment_date || '');
                    return d.startsWith(m);
                });
            }
            if (empId) filtered = filtered.filter(r => String(r.employee_id) === String(empId));

            const total = filtered.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
            $('salaryResult').innerHTML = `
                <div style="padding:12px;text-align:center;font-weight:800;color:var(--primary);">
                    إجمالي الرواتب: ${total.toFixed(2)} ₪ (${filtered.length} دفعة)
                </div>
                ${renderReportTable(filtered, ['employee_name','amount','payment_date','status','description'])}
            `;
            toast('تم توليد كشف الرواتب', 'success');
        }

        // --- تقرير السلف ---
        async function runAdvanceReport() {
            const empId = $('advanceEmployee').value || '';
            const statusFilter = $('advanceStatus').value || 'all';
            let filtered = state.rows.filter(r => r.payment_type === 'advance');
            if (empId) filtered = filtered.filter(r => String(r.employee_id) === String(empId));
            if (statusFilter !== 'all') {
                filtered = filtered.filter(r => (r.status || '').toLowerCase() === statusFilter);
            }
            const total = filtered.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
            $('advanceResult').innerHTML = `
                <div style="padding:12px;text-align:center;font-weight:800;color:var(--primary);">
                    إجمالي السلف: ${total.toFixed(2)} ₪ (${filtered.length} دفعة)
                </div>
                ${renderReportTable(filtered, ['employee_name','amount','payment_date','status','description'])}
            `;
            toast('تم توليد تقرير السلف', 'success');
        }

        // --- تحليل الخصومات ---
        async function runDeductionReport() {
            const from = $('deductionFrom').value || '';
            const to = $('deductionTo').value || '';
            let filtered = state.rows.filter(r => r.payment_type === 'deduction');
            if (from) filtered = filtered.filter(r => r.payment_date && String(r.payment_date) >= from);
            if (to) filtered = filtered.filter(r => r.payment_date && String(r.payment_date) <= to);
            const total = filtered.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
            $('deductionResult').innerHTML = `
                <div style="padding:12px;text-align:center;font-weight:800;color:var(--primary);">
                    إجمالي الخصومات: ${total.toFixed(2)} ₪ (${filtered.length} دفعة)
                </div>
                ${renderReportTable(filtered, ['employee_name','amount','payment_date','status','description'])}
            `;
            toast('تم تحليل الخصومات', 'success');
        }

        // ===== تصدير CSV =====
        function exportData(rows) {
            const data = rows || state.filtered;
            if (!data.length) { toast('لا توجد بيانات للتصدير', 'warning'); return; }
            const keys = [...new Set(data.flatMap(r => Object.keys(r || {})))];
            const csv = '\ufeff' + [keys, ...data.map(r => keys.map(k => String(r[k] ?? '').replace(/"/g, '""')))].map(a => a.map(v => '"' + v + '"').join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'employee-payments.csv';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            toast('تم تصدير CSV', 'success');
        }

        // ===== الأحداث =====
        $('searchInput').addEventListener('input', applyFilter);

        $('themeBtn').addEventListener('click', () => {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('employeePaymentsTheme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        });

        if (localStorage.getItem('employeePaymentsTheme') === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = 'fas fa-sun';
        }

        $('homeBtn').onclick = () => { window.location.href = '../main.html'; };

        // القائمة السفلية: دفعة جديدة + تقارير
        $('newBtn').onclick = () => openForm();
        $('reportBtn').onclick = () => {
            openOverlay('reportOverlay');
            initReportTabs();
            populateEmployeeSelects();
            // تعبئة التواريخ الافتراضية
            if (!$('reportFrom').value) $('reportFrom').value = today();
            if (!$('reportTo').value) $('reportTo').value = today();
            if (!$('deductionFrom').value) $('deductionFrom').value = today();
            if (!$('deductionTo').value) $('deductionTo').value = today();
            if (!$('salaryMonth').value) $('salaryMonth').value = today().slice(0, 7);
        };

        // أزرار التقارير
        $('runSummaryReport').onclick = runSummaryReport;
        $('exportSummaryReport').onclick = () => exportData(state.filtered);
        $('runSalaryReport').onclick = runSalaryReport;
        $('runAdvanceReport').onclick = runAdvanceReport;
        $('runDeductionReport').onclick = runDeductionReport;

        // مودالات
        $('saveBtn').onclick = saveForm;
        $('closeForm').onclick = () => closeOverlay('formOverlay');
        $('cancelForm').onclick = () => closeOverlay('formOverlay');
        $('closeDetails').onclick = () => closeOverlay('detailsOverlay');
        $('closeReport').onclick = () => closeOverlay('reportOverlay');

        // ===== سحب للتحديث =====
        let touchY = 0;
        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) touchY = e.touches[0].clientY;
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (touchY && e.touches[0].clientY - touchY > 35) $('pull').classList.add('show');
        }, { passive: true });
        document.addEventListener('touchend', async () => {
            if ($('pull').classList.contains('show')) {
                $('pull').textContent = 'جاري التحديث…';
                await loadData();
                setTimeout(() => $('pull').classList.remove('show'), 300);
                $('pull').textContent = 'اسحب للتحديث…';
            }
            touchY = 0;
        });

        // ===== بدء التشغيل =====
        renderTabs();
        loadData();

        // دوال عامة
        window.reloadData = loadData;
        window.exportData = exportData;
        window.openForm = openForm;

    })();
    </script>
</body>
</html>
