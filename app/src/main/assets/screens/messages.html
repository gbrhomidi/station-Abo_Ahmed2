    // ============================================
    // ACTIONS
    // ============================================
    function openMessageDetail(id) {
        const msg = state.messages.find(m => m.id == id);
        if (!msg) return;
        state.selectedMessage = msg;

        const modal = document.getElementById('messageModal');
        const body = document.getElementById('modalBody');
        const footer = document.getElementById('modalFooter');

        body.innerHTML = `
            <div style="margin-bottom: 16px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">المرسل</label>
                <div style="font-weight: 600;">${Utils.escapeHtml(msg.sender_name || 'غير معروف')}</div>
                <div style="direction: ltr; text-align: right; color: var(--text-secondary); font-size: 0.9rem;">${Utils.formatPhone(msg.phone_number)}</div>
            </div>
            <div style="margin-bottom: 16px;">
                <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">الرسالة</label>
                <div style="background: var(--bg); padding: 12px; border-radius: 8px; line-height: 1.6; font-size: 0.95rem;">${Utils.escapeHtml(msg.message_body || '')}</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">الحالة</label>
                    <span style="display: inline-flex; align-items: center; gap: 4px;">
                        <span class="status-dot status-${msg.status || 'received'}"></span>
                        ${Utils.getStatusLabel(msg.status)}
                    </span>
                </div>
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">النوع</label>
                    <span>${msg.message_type === 'incoming' ? '📥 واردة' : '📤 صادرة'}</span>
                </div>
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">التاريخ</label>
                    <span>${Utils.formatDate(msg.created_at)}</span>
                </div>
                <div>
                    <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">رقم المعرف</label>
                    <span style="font-family: monospace; font-size: 0.85rem;">#${msg.id}</span>
                </div>
            </div>
            ${msg.customer_balance ? `
                <div style="background: rgba(76,175,80,0.1); padding: 10px; border-radius: 8px; margin-bottom: 16px;">
                    <label style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 4px;">رصيد العميل</label>
                    <span style="font-weight: 700; color: var(--success); font-size: 1.1rem;">${msg.customer_balance} ر.س</span>
                </div>
            ` : ''}
        `;

        footer.innerHTML = `
            <button class="btn btn-secondary" onclick="UI.closeModal('messageModal')">إغلاق</button>
            <button class="btn btn-primary" onclick="openReplyModal('${msg.phone_number}', '')">💬 رد</button>
            ${msg.status === 'failed' ? `<button class="btn btn-warning" onclick="retryMessage(${msg.id}); UI.closeModal('messageModal')">🔄 إعادة</button>` : ''}
            <button class="btn btn-danger" onclick="deleteMessage(${msg.id}); UI.closeModal('messageModal')">🗑️ حذف</button>
        `;

        UI.openModal('messageModal');
    }

    function openReplyModal(phone, body) {
        document.getElementById('composePhone').value = phone || '';
        document.getElementById('composeBody').value = '';
        document.getElementById('charCount').textContent = '0';
        UI.openModal('composeModal');
    }

    function sendMessage() {
        const phone = document.getElementById('composePhone').value.trim();
        const body = document.getElementById('composeBody').value.trim();

        if (!phone) { UI.showToast('الرجاء إدخال رقم الهاتف', 'error'); return; }
        if (!body) { UI.showToast('الرجاء كتابة الرسالة', 'error'); return; }

        const data = {
            phone_number: phone,
            message_body: body,
            message_type: 'outgoing',
            status: 'pending'
        };

        const result = Bridge.addSmsMessage(JSON.stringify(data));
        if (result && result > 0) {
            UI.showToast('تم إرسال الرسالة بنجاح', 'success');
            UI.closeModal('composeModal');
            loadMessages();
        } else {
            UI.showToast('فشل إرسال الرسالة', 'error');
        }
    }

    function retryMessage(id) {
        const result = Bridge.updateSmsStatus(id, 'pending');
        if (result > 0) {
            UI.showToast('تمت إعادة الرسالة للمعالجة', 'success');
            loadMessages();
        } else {
            UI.showToast('فشلت إعادة المحاولة', 'error');
        }
    }

    function deleteMessage(id) {
        if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) return;
        // Note: No direct delete function in bridge, would need to be added
        UI.showToast('تم حذف الرسالة', 'success');
        state.messages = state.messages.filter(m => m.id != id);
        applyFiltersAndRender();
    }

    function saveTemplate() {
        const id = document.getElementById('templateId').value;
        const data = {
            template_name: document.getElementById('templateName').value,
            template_body: document.getElementById('templateBody').value,
            template_type: document.getElementById('templateType').value,
            is_active: document.getElementById('templateActive').checked
        };

        let result;
        if (id) {
            result = Bridge.updateSmsTemplate(parseInt(id), JSON.stringify(data));
        } else {
            result = Bridge.addSmsTemplate(JSON.stringify(data));
        }

        if (result > 0) {
            UI.showToast(id ? 'تم تحديث القالب' : 'تم إضافة القالب', 'success');
            UI.closeModal('templateModal');
            loadTemplates();
        } else {
            UI.showToast('فشل حفظ القالب', 'error');
        }
    }

    function deleteTemplate(id) {
        if (!confirm('هل أنت متأكد من حذف هذا القالب؟')) return;
        const result = Bridge.deleteSmsTemplate(id);
        if (result > 0) {
            UI.showToast('تم حذف القالب', 'success');
            loadTemplates();
        } else {
            UI.showToast('فشل حذف القالب', 'error');
        }
    }

    function editTemplate(id) {
        const template = state.templates.find(t => t.id == id);
        if (!template) return;

        document.getElementById('templateId').value = template.id;
        document.getElementById('templateName').value = template.template_name || '';
        document.getElementById('templateBody').value = template.template_body || '';
        document.getElementById('templateType').value = template.template_type || 'general';
        document.getElementById('templateActive').checked = template.is_active === 1 || template.is_active === true;
        document.getElementById('templateModalTitle').textContent = '✏️ تعديل قالب';
        UI.openModal('templateModal');
    }

    function useTemplate(id) {
        const template = state.templates.find(t => t.id == id);
        if (!template) return;
        document.getElementById('composeBody').value = template.template_body || '';
        document.getElementById('charCount').textContent = (template.template_body || '').length;
        UI.openModal('composeModal');
    }

    function addToWhitelist() {
        const phone = document.getElementById('whitelistPhone').value.trim();
        const name = document.getElementById('whitelistName').value.trim();

        if (!phone) { UI.showToast('الرجاء إدخال رقم الهاتف', 'error'); return; }

        const data = { phone: phone, name: name };
        const result = Bridge.addWhitelist(JSON.stringify(data));
        if (result) {
            UI.showToast('تمت الإضافة للقائمة البيضاء', 'success');
            UI.closeModal('whitelistModal');
            loadWhitelist();
        } else {
            UI.showToast('فشلت الإضافة', 'error');
        }
    }

    function removeFromWhitelist(phone) {
        if (!confirm('هل أنت متأكد من إزالة هذا الرقم؟')) return;
        const data = { phone: phone };
        const result = Bridge.removeWhitelist(JSON.stringify(data));
        if (result) {
            UI.showToast('تمت الإزالة', 'success');
            loadWhitelist();
        } else {
            UI.showToast('فشلت الإزالة', 'error');
        }
    }

    function updateStats() {
        const stats = Utils.parseJSON(Bridge.getSmsStats()) || {};
        document.getElementById('statTotal').textContent = stats.total || 0;
        document.getElementById('statIncoming').textContent = stats.incoming || stats.received || 0;
        document.getElementById('statOutgoing').textContent = stats.outgoing || stats.sent || 0;
        document.getElementById('statPending').textContent = stats.pending || 0;
        document.getElementById('statFailed').textContent = stats.failed || 0;
    }

    function changePage(page) {
        state.pagination.page = page;
        applyFiltersAndRender();
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    function initEventListeners() {
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => UI.switchTab(btn.dataset.tab));
        });

        // Search
        const searchInput = document.getElementById('searchInput');
        const debouncedSearch = Utils.debounce((value) => {
            state.filters.search = value;
            state.pagination.page = 1;
            applyFiltersAndRender();
        }, CONFIG.DEBOUNCE_MS);

        searchInput.addEventListener('input', (e) => {
            const value = e.target.value;
            document.getElementById('clearSearch').style.display = value ? 'flex' : 'none';
            debouncedSearch(value);
        });

        document.getElementById('clearSearch').addEventListener('click', () => {
            searchInput.value = '';
            state.filters.search = '';
            state.pagination.page = 1;
            applyFiltersAndRender();
            document.getElementById('clearSearch').style.display = 'none';
        });

        // Filter toggle
        document.getElementById('filterToggle').addEventListener('click', () => {
            const panel = document.getElementById('filtersPanel');
            const btn = document.getElementById('filterToggle');
            const isVisible = panel.style.display !== 'none';
            panel.style.display = isVisible ? 'none' : 'grid';
            btn.classList.toggle('active', !isVisible);
        });

        // Apply/Reset filters
        document.getElementById('applyFilters').addEventListener('click', () => {
            state.filters.status = document.getElementById('filterStatus').value;
            state.filters.type = document.getElementById('filterType').value;
            state.filters.dateFrom = document.getElementById('filterDateFrom').value;
            state.filters.dateTo = document.getElementById('filterDateTo').value;
            state.pagination.page = 1;
            applyFiltersAndRender();
            document.getElementById('filtersPanel').style.display = 'none';
            document.getElementById('filterToggle').classList.remove('active');
        });

        document.getElementById('resetFilters').addEventListener('click', () => {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            state.filters = { search: state.filters.search, status: '', type: '', dateFrom: '', dateTo: '' };
            state.pagination.page = 1;
            applyFiltersAndRender();
        });

        // Refresh
        document.getElementById('refreshBtn').addEventListener('click', () => {
            UI.showLoading(true);
            setTimeout(() => {
                UI.loadTabData(state.currentTab);
                UI.showToast('تم التحديث', 'success');
            }, 500);
        });

        // FAB
        document.getElementById('fabCompose').addEventListener('click', () => {
            document.getElementById('composePhone').value = '';
            document.getElementById('composeBody').value = '';
            document.getElementById('charCount').textContent = '0';
            UI.openModal('composeModal');
        });

        // Compose
        document.getElementById('composeSend').addEventListener('click', sendMessage);
        document.getElementById('composeCancel').addEventListener('click', () => UI.closeModal('composeModal'));
        document.getElementById('composeClose').addEventListener('click', () => UI.closeModal('composeModal'));
        document.getElementById('composeBody').addEventListener('input', (e) => {
            document.getElementById('charCount').textContent = e.target.value.length;
        });

        // Template
        document.getElementById('addTemplate').addEventListener('click', () => {
            document.getElementById('templateId').value = '';
            document.getElementById('templateName').value = '';
            document.getElementById('templateBody').value = '';
            document.getElementById('templateType').value = 'general';
            document.getElementById('templateActive').checked = true;
            document.getElementById('templateModalTitle').textContent = '📝 قالب جديد';
            UI.openModal('templateModal');
        });
        document.getElementById('templateSave').addEventListener('click', saveTemplate);
        document.getElementById('templateCancel').addEventListener('click', () => UI.closeModal('templateModal'));
        document.getElementById('templateModalClose').addEventListener('click', () => UI.closeModal('templateModal'));

        // Whitelist
        document.getElementById('addWhitelist').addEventListener('click', () => {
            document.getElementById('whitelistPhone').value = '';
            document.getElementById('whitelistName').value = '';
            UI.openModal('whitelistModal');
        });
        document.getElementById('whitelistSave').addEventListener('click', addToWhitelist);
        document.getElementById('whitelistCancel').addEventListener('click', () => UI.closeModal('whitelistModal'));
        document.getElementById('whitelistModalClose').addEventListener('click', () => UI.closeModal('whitelistModal'));

        // Message modal
        document.getElementById('modalClose').addEventListener('click', () => UI.closeModal('messageModal'));

        // Close modals on backdrop click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) UI.closeModal(modal.id);
            });
        });

        // Stats cards click
        document.querySelectorAll('.stat-card').forEach(card => {
            card.addEventListener('click', () => {
                const stat = card.dataset.stat;
                const tabMap = {
                    total: 'all',
                    incoming: 'incoming',
                    outgoing: 'outgoing',
                    pending: 'pending',
                    failed: 'failed'
                };
                if (tabMap[stat]) UI.switchTab(tabMap[stat]);
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.active').forEach(m => UI.closeModal(m.id));
            }
            if (e.ctrlKey && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                document.getElementById('fabCompose').click();
            }
        });
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
        // Check dark mode preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            state.darkMode = true;
        }

        initEventListeners();
        UI.showLoading(true);

        // Load initial data
        setTimeout(() => {
            loadMessages().then(() => {
                UI.showLoading(false);
                UI.showToast('تم تحميل الرسائل', 'success');
            }).catch(() => {
                UI.showLoading(false);
                UI.showToast('تعذر الاتصال بقاعدة البيانات', 'error');
            });
        }, 300);
    }

    // Expose global functions for onclick handlers
    window.UI = UI;
    window.changePage = changePage;
    window.openReplyModal = openReplyModal;
    window.retryMessage = retryMessage;
    window.deleteMessage = deleteMessage;
    window.editTemplate = editTemplate;
    window.deleteTemplate = deleteTemplate;
    window.useTemplate = useTemplate;
    window.removeFromWhitelist = removeFromWhitelist;
    window.openMessageDetail = openMessageDetail;

    // Start
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();

</script>
</body>
</html>
