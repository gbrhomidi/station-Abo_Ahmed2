<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>أنواع الوقود</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/fonts/cairo.css">
    <style>
        /* ============================================================
           المتغيرات الأساسية (دعم الوضع الداكن والنهاري)
           ============================================================ */
        :root {
            --bg: #f4f7fb;
            --surface: #fff;
            --surface-2: #f8fafc;
            --surface-3: #eef4f9;
            --primary: #087ea4;
            --primary-2: #2563eb;
            --primary-soft: rgba(37,99,235,.10);
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
            --text: #172033;
            --muted: #64748b;
            --border: #d7dee8;
            --border-strong: #c4cfdd;
            --accent: #c58a18;
            --shadow: 0 12px 35px rgba(15,23,42,.08);
            --shadow-lg: 0 25px 70px rgba(15,23,42,.16);
            --radius: 20px;
            --radius-sm: 13px;
            --font-sans: "Cairo","Noto Sans Arabic",Arial,sans-serif;
            --card-hover-bg: rgba(37,99,235,0.04);
        }

        [data-theme="dark"] {
            --bg: #06111f;
            --surface: #0c1b2d;
            --surface-2: #102238;
            --surface-3: #132941;
            --primary: #55c7f5;
            --primary-2: #6ea8ff;
            --primary-soft: rgba(85,199,245,.12);
            --success: #42e39a;
            --warning: #ffd166;
            --danger: #ff7184;
            --text: #eef7ff;
            --muted: #aabbd0;
            --border: #49a9ee;
            --border-strong: #76c8ff;
            --accent: #f1cf7a;
            --shadow: 0 14px 40px rgba(0,0,0,.38);
            --shadow-lg: 0 25px 75px rgba(0,0,0,.55);
            --card-hover-bg: rgba(85,199,245,0.05);
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            direction: rtl;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 92px;
            transition: background 0.4s ease, color 0.4s ease;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid var(--primary-soft);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--danger);
            color: #fff;
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            font-weight: 900;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ===== الشريط العلوي ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 14px;
        }
        .topbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary-soft);
            color: var(--primary);
            display: grid;
            place-items: center;
            font-size: 20px;
        }
        .title h1 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 950;
            color: var(--text);
        }
        .title p {
            margin: 2px 0 0;
            color: var(--muted);
            font-size: .7rem;
        }
        .actions {
            display: flex;
            gap: 7px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface-2);
            color: var(--text);
            display: grid;
            place-items: center;
            font-size: 19px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .icon-btn:active { transform: scale(.94); }
        .icon-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== البحث ===== */
        .search {
            margin-top: 12px;
            position: relative;
        }
        .search-input {
            width: 100%;
            height: 48px;
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface-2);
            color: var(--text);
            padding: 0 45px 0 14px;
            text-align: center;
            outline: none;
            font-family: var(--font-sans);
        }
        .search i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
        }

        /* ===== التبويبات العلوية (مخصصة لأنواع الوقود) ===== */
        .tabs {
            display: flex;
            gap: 7px;
            overflow: auto;
            padding: 11px 1px 2px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
            border-radius: 999px;
            padding: 8px 14px;
            white-space: nowrap;
            font-size: .76rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        .tab.active {
            background: var(--primary-soft);
            border-color: var(--primary);
            color: var(--primary);
        }
        .tab:active { transform: scale(0.95); }

        /* ===== الحاوية الرئيسية ===== */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 14px;
        }

        /* ===== بطاقات الإحصائيات ===== */
        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .kpi {
            background: linear-gradient(145deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            text-align: center;
            animation: up .45s both;
        }
        .kpi b {
            display: block;
            font-size: 1.35rem;
            color: var(--text);
        }
        .kpi span {
            color: var(--muted);
            font-size: .72rem;
            font-weight: 800;
        }

        /* ===== لوحة البيانات ===== */
        .panel {
            margin-top: 12px;
            background: linear-gradient(145deg, var(--surface), var(--surface-2));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
        }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .panel-head h2 {
            font-size: .95rem;
            margin: 0;
            color: var(--text);
        }
        .count {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: .72rem;
            font-weight: 900;
        }

        /* ===== بطاقات أنواع الوقود ===== */
        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 14px;
            box-shadow: 0 7px 20px rgba(15,23,42,.05);
            animation: up .42s both;
            text-align: center;
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            align-items: center;
        }
        .card-code {
            font-size: .7rem;
            color: var(--muted);
            font-weight: 900;
        }
        .status {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: .68rem;
            font-weight: 900;
        }
        .status.active { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
        .status.inactive { color: var(--muted); background: var(--surface-3); }
        .card h3 {
            font-size: 1rem;
            margin: 12px 0 4px;
            color: var(--text);
        }
        .card-sub {
            font-size: .72rem;
            color: var(--muted);
            line-height: 1.8;
        }
        .card-price {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent);
            margin: 8px 0;
        }
        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            margin-top: 12px;
        }
        .meta-item {
            padding: 9px;
            border-radius: 11px;
            background: var(--primary-soft);
            font-size: .68rem;
        }
        .meta-item span {
            display: block;
            color: var(--muted);
            margin-bottom: 2px;
        }
        .meta-item b {
            display: block;
            overflow-wrap: anywhere;
            color: var(--text);
        }
        .card-actions {
            display: flex;
            gap: 7px;
            margin-top: 11px;
        }

        /* ===== الأزرار ===== */
        .btn {
            border: 1px solid var(--border);
            border-radius: 11px;
            background: var(--surface-2);
            color: var(--text);
            padding: 9px 11px;
            font-weight: 850;
            font-size: .72rem;
            flex: 1;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--primary-2), var(--primary));
            color: #fff;
            border: none;
        }
        .btn.primary:hover { opacity: 0.9; color: #fff; }
        .btn.danger { color: var(--danger); }
        .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
        .btn.warning { color: var(--warning); }
        .btn.warning:hover { border-color: var(--warning); color: var(--warning); }

        /* ===== الحالة الفارغة ===== */
        .empty {
            text-align: center;
            padding: 45px 15px;
            color: var(--muted);
            grid-column: 1/-1;
        }
        .empty i {
            font-size: 38px;
            color: var(--primary);
            display: block;
            margin-bottom: 10px;
        }

        /* ===== القائمة السفلية ===== */
        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--surface) 95%, transparent);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            gap: 8px;
        }
        .bottom button {
            flex: 1;
            border: 1px solid transparent;
            border-radius: 15px;
            background: transparent;
            color: var(--muted);
            padding: 7px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 1.05rem;
            font-weight: 950;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-sans);
        }
        .bottom button span {
            font-size: 1.4rem;
            font-weight: 700;
        }
        .bottom button.active {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .bottom button:active { transform: scale(0.95); }

        /* ===== المودالات ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 800;
            background: rgba(2,8,23,.62);
            backdrop-filter: blur(7px);
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .modal {
            width: min(760px, 100%);
            max-height: 94vh;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 25px 25px 0 0;
            box-shadow: var(--shadow-lg);
            animation: modalIn .28s ease;
        }
        .modal.wide { width: min(960px, 100%); }
        .modal-head {
            position: sticky;
            top: 0;
            z-index: 2;
            background: var(--surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .modal-head h2 {
            font-size: 1rem;
            margin: 0;
            color: var(--text);
        }
        .modal-body { padding: 16px; }
        .modal-foot {
            position: sticky;
            bottom: 0;
            background: var(--surface);
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        /* ===== نموذج الإضافة (مع ترتيب الحقول المطلوب) ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .form-grid .field { min-width: 0; }
        .form-grid .field.full { grid-column: 1 / -1; }
        .field { min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .field label {
            display: block;
            text-align: center;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 900;
            margin-bottom: 6px;
        }
        .input {
            width: 100%;
            min-height: 46px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            color: var(--text);
            padding: 10px 12px;
            text-align: center;
            outline: none;
            font-family: var(--font-sans);
        }
        .input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 14%, transparent);
        }
        .input:disabled {
            background: var(--surface-3);
            color: var(--muted);
            opacity: .72;
        }
        .textarea {
            min-height: 92px;
            resize: vertical;
        }
        .select-wrap { position: relative; }
        .select-wrap:after {
            content: '⌄';
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--muted);
        }

        .error-box {
            display: none;
            margin-bottom: 12px;
            border: 1px solid var(--danger);
            background: color-mix(in srgb, var(--danger) 10%, transparent);
            color: var(--danger);
            border-radius: 13px;
            padding: 10px;
            text-align: center;
            font-size: .74rem;
            font-weight: 800;
        }
        .error-box.show { display: block; }

        /* ===== التوست ===== */
        .toast {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(-15px);
            z-index: 1300;
            max-width: 90%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 16px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            pointer-events: none;
            transition: .25s;
            text-align: center;
            font-size: .75rem;
            font-weight: 850;
            color: var(--text);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%);
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }

        /* ===== السحب للتحديث ===== */
        .pull {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translate(-50%, -70px);
            z-index: 1200;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0 0 14px 14px;
            padding: 8px 15px;
            color: var(--primary);
            font-size: .72rem;
            font-weight: 900;
            transition: .2s;
        }
        .pull.show { transform: translate(-50%, 0); }

        /* ===== التقارير ===== */
        .report-panel.hidden { display: none; }
        .report-result {
            margin-top: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .report-result table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .report-result table th {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 10px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        .report-result table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            color: var(--text);
        }
        .report-result table tr:hover { background: var(--card-hover-bg); }

        /* ===== الرسوم المتحركة ===== */
        @keyframes up {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes modalIn {
            from { transform: translateY(20px); opacity: .5; }
            to { transform: none; opacity: 1; }
        }

        /* ===== التوافق مع الشاشات الصغيرة ===== */
        @media (max-width: 760px) {
            .kpis { grid-template-columns: repeat(2, 1fr); }
            .cards { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 460px) {
            .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .form-grid .field.full { grid-column: 1 / -1; }
            .title p { display: none; }
            .container { padding: 10px; }
            .panel { padding: 10px; }
            .modal-body { padding: 12px; }
            .bottom button span { font-size: 1.2rem; }
        }

        /* ===== الوضع المظلم ===== */
        [data-theme="dark"] .panel,
        [data-theme="dark"] .card,
        [data-theme="dark"] .kpi {
            border-color: #63c7ff !important;
            box-shadow: 0 0 0 1px rgba(99,199,255,.16), 0 0 18px rgba(99,199,255,.07);
        }

        /* ===== الطباعة ===== */
        @media print {
            .topbar, .bottom, .offline-banner, .card-actions, .icon-btn { display: none !important; }
            body { background: #fff; color: #111; padding: 0; }
            .panel, .card, .kpi { box-shadow: none; border: 1px solid #aaa; }
        }
    </style>
</head>
<body>

    <!-- ===== الإشعارات العلوية ===== -->
    <div class="offline-banner" id="offlineBanner"><i class="fas fa-triangle-exclamation"></i> Android Bridge غير متاح؛ لن تُحفظ أو تُعرض بيانات.</div>
    <div class="pull" id="pull">اسحب للتحديث…</div>
    <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>

    <!-- ===== الشريط العلوي ===== -->
    <header class="topbar">
        <div class="topbar-row">
            <div class="title">
                <div class="title-icon"><i class="fas fa-oil-can"></i></div>
                <div>
                    <h1>أنواع الوقود</h1>
                    <p id="contextText">إدارة أنواع الوقود والمواصفات والأسعار</p>
                </div>
            </div>
            <div class="actions">
                <button class="icon-btn" id="themeBtn" title="الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button class="icon-btn" id="homeBtn" title="رجوع"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
        <div class="search">
            <i class="fas fa-search"></i>
            <input class="search-input" id="searchInput" type="search" placeholder="بحث في أنواع الوقود..." autocomplete="off">
        </div>
        <div class="tabs" id="tabs"></div>
    </header>

    <!-- ===== المحتوى الرئيسي ===== -->
    <main class="container">
        <section class="kpis">
            <div class="kpi"><b id="kTotal">0</b><span>إجمالي الأنواع</span></div>
            <div class="kpi"><b id="kActive">0</b><span>نشطة</span></div>
            <div class="kpi"><b id="kInactive">0</b><span>غير نشطة</span></div>
            <div class="kpi"><b id="kAvgPrice">0</b><span>متوسط سعر البيع</span></div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2><i class="fas fa-list"></i> قائمة أنواع الوقود</h2>
                <span class="count" id="count">0</span>
            </div>
            <div class="cards" id="cards"></div>
        </section>
    </main>

    <!-- ===== القائمة السفلية ===== -->
    <nav class="bottom" id="bottomNav">
        <button id="newBtn"><i class="fas fa-plus-circle"></i><span>نوع جديد</span></button>

    <!-- ============================================================ -->
    <!-- ===== جافا سكريبت ===== -->
    <!-- ============================================================ -->
    <script>
    (() => {
        'use strict';

        const bridge = window.AndroidInterface || null;
        const state = {
            rows: [],
            filtered: [],
            tab: 'all',
            editing: null,
            loadedAt: null
        };

        const $ = id => document.getElementById(id);
        const esc = v => String(v ?? '—').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const today = () => new Date().toISOString().slice(0, 10);
        const now = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

        // ===== دوال الجسر =====
        function parse(v) {
            if (v == null) throw new Error('لم يرجع الجسر نتيجة');
            const x = typeof v === 'string' ? JSON.parse(v) : v;
            if (x && x.success === false) throw new Error(x.error || x.message || 'فشلت العملية');
            return x;
        }

        function dataOf(v) { return v && Object.prototype.hasOwnProperty.call(v, 'data') ? v.data : v; }

        function rowsOf(v) {
            const x = dataOf(v);
            if (Array.isArray(x)) return x;
            if (x && Array.isArray(x.rows)) return x.rows;
            if (x && Array.isArray(x.data)) return x.data;
            if (x && typeof x === 'object') return [x];
            return [];
        }

        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') {
                return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            }
            try {
                return Promise.resolve(parse(bridge[method](...args)));
            } catch (e) {
                return Promise.reject(e);
            }
        }

        // ===== التوست =====
        let toastTimer;

        function toast(msg, type = 'success') {
            const n = $('toast');
            n.textContent = msg;
            n.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => n.className = 'toast', 3600);
        }

        // ===== التحميل =====
        function setLoading(v) {
            $('loadingIndicator').classList.toggle('show', !!v);
        }

        // ===== المودالات =====
        function openOverlay(id) { $(id).classList.add('show'); }
        function closeOverlay(id) { $(id).classList.remove('show'); }

        // ===== التبويبات العلوية (مخصصة لأنواع الوقود) =====
        const tabs = [
            ['all', 'جميع الأنواع', 'fa-list'],
            ['active', 'نشط', 'fa-check-circle'],
            ['inactive', 'غير نشط', 'fa-times-circle'],
            ['petroleum', 'بترولي', 'fa-gas-pump'],
            ['alternative', 'بديل', 'fa-leaf']
        ];

        function renderTabs() {
            $('tabs').innerHTML = tabs.map(([k, l, icon]) =>
                `<button class="tab ${state.tab === k ? 'active' : ''}" data-tab="${k}"><i class="fas ${icon}"></i> ${l}</button>`
            ).join('');
            document.querySelectorAll('#tabs [data-tab]').forEach(b => {
                b.onclick = () => {
                    state.tab = b.dataset.tab;
                    renderTabs();
                    loadData(state.tab);
                };
            });
        }

        // ===== التصفية =====
        function matchesTab(row) {
            // Data is now filtered server-side via loadData(tab),
            // so we just return true for all rows returned by the server
            return true;
        }

        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            state.filtered = state.rows.filter(row => {
                const text = JSON.stringify(row || {}).toLowerCase();
                return matchesTab(row) && (!q || text.includes(q));
            });
            renderCards();
        }

        // ===== عرض البطاقات =====
        function renderCards() {
            const rows = state.filtered;
            $('count').textContent = rows.length.toLocaleString('ar');

            const total = state.rows.length;
            const active = state.rows.filter(r => Number(r.is_active) === 1).length;
            const inactive = state.rows.filter(r => Number(r.is_active) === 0).length;
            const prices = state.rows.filter(r => Number(r.default_sale_price) > 0);
            const avgPrice = prices.length ? prices.reduce((s, r) => s + Number(r.default_sale_price), 0) / prices.length : 0;

            $('kTotal').textContent = total.toLocaleString('ar');
            $('kActive').textContent = active.toLocaleString('ar');
            $('kInactive').textContent = inactive.toLocaleString('ar');
            $('kAvgPrice').textContent = avgPrice.toLocaleString('ar', { maximumFractionDigits: 2 });

            const box = $('cards');
            if (!rows.length) {
                box.innerHTML = `<div class="empty"><i class="fas fa-oil-can"></i><div>لا توجد أنواع وقود مطابقة.</div></div>`;
                return;
            }

            box.innerHTML = rows.map((row, i) => {
                const id = row.id ?? i;
                const isActive = Number(row.is_active) === 1;
                const statusMap = {
                    '1': 'نشط',
                    '0': 'غير نشط'
                };
                const statusLabel = statusMap[row.is_active] || '—';
                const salePrice = parseFloat(row.default_sale_price) || 0;
                const purchasePrice = parseFloat(row.default_purchase_price) || 0;

                return `<article class="card" style="animation-delay:${Math.min(i * 35, 350)}ms">
                    <div class="card-top">
                        <span class="card-code"><i class="fas fa-barcode"></i> ${esc(row.fuel_code || '—')}</span>
                        <span class="status ${isActive ? 'active' : 'inactive'}">${statusLabel}</span>
                    </div>
                    <h3>${esc(row.fuel_name_ar || row.fuel_name || 'بدون اسم')}</h3>
                    <div class="card-sub">${esc(row.description || 'بدون وصف')}</div>
                    <div class="card-price">
                        ${salePrice ? salePrice.toLocaleString('ar', { maximumFractionDigits: 2 }) + ' ₪' : '—'}
                        ${purchasePrice ? ' | شراء: ' + purchasePrice.toLocaleString('ar', { maximumFractionDigits: 2 }) + ' ₪' : ''}
                    </div>
                    <div class="meta">
                        <div class="meta-item"><span>الكثافة القياسية</span><b>${esc(row.density_standard || '—')}</b></div>
                        <div class="meta-item"><span>درجة الحرارة القياسية</span><b>${esc(row.temperature_standard || '—')}</b></div>
                        <div class="meta-item"><span>نقطة الوميض</span><b>${esc(row.flash_point || '—')}</b></div>
                        <div class="meta-item"><span>الضريبة</span><b>${row.tax_rate ? row.tax_rate + '%' : '—'}</b></div>
                    </div>
                    <div class="card-actions">
                        <button class="btn" data-view="${esc(id)}"><i class="fas fa-eye"></i> عرض</button>
                        <button class="btn warning" data-edit="${esc(id)}"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="btn danger" data-delete="${esc(id)}"><i class="fas fa-trash"></i> حذف</button>
                    </div>
                </article>`;
            }).join('');

            box.querySelectorAll('[data-view]').forEach(b => b.onclick = () => openDetails(findRow(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openForm(findRow(b.dataset.edit)));
            box.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => deleteRow(findRow(b.dataset.delete)));
        }

        function findRow(id) {
            return state.rows.find((row, i) => String(row.id ?? i) === String(id));
        }

        // ===== توليد كود الوقود التلقائي =====
        function generateFuelCode() {
            let max = 0;
            state.rows.forEach(r => {
                const m = String(r.fuel_code || '').match(/(\d+)$/);
                if (m) max = Math.max(max, Number(m[1]));
            });
            return 'FUEL-' + String(max + 1).padStart(3, '0');
        }

        // ===== جلب البيانات =====
        async function loadData(filter = 'all') {
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                state.rows = [];
                applyFilter();
                return;
            }
            setLoading(true);
            try {
                const params = { limit: 200, search: $('searchInput').value || '' };
                // Apply tab filter as query params for the bridge
                switch (filter) {
                    case 'active':
                        params.is_active = 1;
                        break;
                    case 'inactive':
                        params.is_active = 0;
                        break;
                    case 'petroleum':
                        params.fuel_category = 'petroleum';
                        break;
                    case 'alternative':
                        params.fuel_category = 'alternative';
                        break;
                    case 'all':
                    default:
                        break;
                }
                const result = await invoke('getFuelTypeRecords', [JSON.stringify(params)]);
                state.rows = rowsOf(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
                populateFuelTypeSelects();
            } catch (e) {
                $('offlineBanner').classList.add('show');
                state.rows = [];
                applyFilter();
                toast(e.message || 'فشل تحميل البيانات', 'error');
            } finally {
                setLoading(false);
            }
        }

        function populateFuelTypeSelects() {
            const selects = ['priceFuelType', 'specFuelType'];
            selects.forEach(id => {
                const sel = $(id);
                if (!sel) return;
                const currentVal = sel.value;
                sel.innerHTML = '<option value="all">جميع الأنواع</option>' +
                    state.rows.map(r =>
                        `<option value="${esc(r.id)}">${esc(r.fuel_name_ar || r.fuel_name)}</option>`
                    ).join('');
                if (currentVal) sel.value = currentVal;
            });
        }

        // ===== نموذج الإضافة =====
        function openForm(row = null) {
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل نوع الوقود' : 'إضافة نوع وقود جديد';
            $('formError').className = 'error-box';
            $('formError').textContent = '';

            // تعبئة الحقول
            const fields = ['fuel_code', 'fuel_name', 'fuel_name_ar', 'description', 'density_standard',
                'temperature_standard', 'flash_point', 'color_code', 'default_sale_price',
                'default_purchase_price', 'tax_rate', 'vat_rate', 'is_active', 'icon_path',
                'remarks', 'extra_data'
            ];
            fields.forEach(f => {
                const el = $(f);
                if (!el) return;
                if (row && row[f] !== undefined && row[f] !== null) {
                    el.value = row[f];
                } else {
                    if (f === 'fuel_code') el.value = generateFuelCode();
                    else if (f === 'is_active') el.value = '1';
                    else el.value = '';
                }
            });

            // إخفاء حقل الكود واسم الوقود بالعربية
            document.getElementById('fuelCodeField').classList.add('hidden');
            document.getElementById('fuelNameArField').classList.add('hidden');

            openOverlay('formOverlay');
            setTimeout(() => $('fuel_name').focus(), 200);
        }

        // ===== النسخ التلقائي من fuel_name إلى fuel_name_ar =====
        $('fuel_name').addEventListener('input', function() {
            const arField = $('fuel_name_ar');
            if (arField && !state.editing) {
                arField.value = this.value;
            }
        });

        function collectForm() {
            return {
                fuel_code: $('fuel_code').value,
                fuel_name: $('fuel_name').value.trim(),
                fuel_name_ar: $('fuel_name_ar').value.trim() || $('fuel_name').value.trim(),
                description: $('description').value.trim(),
                density_standard: parseFloat($('density_standard').value) || 0,
                temperature_standard: parseFloat($('temperature_standard').value) || 0,
                flash_point: $('flash_point').value.trim(),
                color_code: $('color_code').value.trim(),
                default_sale_price: parseFloat($('default_sale_price').value) || 0,
                default_purchase_price: parseFloat($('default_purchase_price').value) || 0,
                tax_rate: parseFloat($('tax_rate').value) || 0,
                vat_rate: parseFloat($('vat_rate').value) || 0,
                is_active: Number($('is_active').value),
                icon_path: $('icon_path').value.trim(),
                remarks: $('remarks').value.trim(),
                extra_data: $('extra_data').value.trim()
            };
        }

        function validateForm(data) {
            const errors = [];
            if (!data.fuel_name.trim()) errors.push('اسم الوقود مطلوب.');
            if (data.default_sale_price < 0) errors.push('سعر البيع لا يمكن أن يكون سالباً.');
            if (data.default_purchase_price < 0) errors.push('سعر الشراء لا يمكن أن يكون سالباً.');
            if (data.tax_rate < 0 || data.tax_rate > 100) errors.push('نسبة الضريبة يجب أن تكون بين 0 و 100.');
            if (data.vat_rate < 0 || data.vat_rate > 100) errors.push('نسبة ضريبة القيمة المضافة يجب أن تكون بين 0 و 100.');
            return errors;
        }

        async function saveForm() {
            const data = collectForm();
            const errors = validateForm(data);
            if (errors.length) {
                $('formError').innerHTML = errors.map(e => `• ${esc(e)}`).join('<br>');
                $('formError').className = 'error-box show';
                toast('يرجى تصحيح الأخطاء', 'error');
                return;
            }

            setLoading(true);
            try {
                let result;
                if (state.editing) {
                    result = await invoke('updateFuelTypeRecord', [Number(state.editing.id), JSON.stringify(data)]);
                } else {
                    result = await invoke('saveFuelTypeRecord', [JSON.stringify(data)]);
                }
                parse(result);
                toast(state.editing ? 'تم تحديث نوع الوقود' : 'تم إضافة نوع الوقود');
                closeOverlay('formOverlay');
                await loadData(state.tab);
            } catch (e) {
                $('formError').textContent = e.message || 'تعذر الحفظ';
                $('formError').className = 'error-box show';
                toast(e.message || 'تعذر الحفظ', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ===== الحذف =====
        async function deleteRow(row) {
            if (!row) return;
            if (!confirm('هل تريد حذف هذا النوع من الوقود نهائياً؟')) return;
            setLoading(true);
            try {
                await invoke('deleteFuelTypeRecord', [Number(row.id)]);
                toast('تم الحذف');
                await loadData(state.tab);
            } catch (e) {
                toast(e.message || 'فشل الحذف', 'error');
            } finally {
                setLoading(false);
            }
        }

        // ===== التفاصيل =====
        function openDetails(row) {
            if (!row) return;
            const statusMap = { '1': 'نشط', '0': 'غير نشط' };

            $('detailsBody').innerHTML = `
                <div class="meta">
                    <div class="meta-item"><span>كود الوقود</span><b>${esc(row.fuel_code || '—')}</b></div>
                    <div class="meta-item"><span>اسم الوقود</span><b>${esc(row.fuel_name_ar || row.fuel_name)}</b></div>
                    <div class="meta-item"><span>الوصف</span><b>${esc(row.description || '—')}</b></div>
                    <div class="meta-item"><span>الحالة</span><b>${esc(statusMap[row.is_active] || '—')}</b></div>
                    <div class="meta-item"><span>الكثافة القياسية</span><b>${esc(row.density_standard || '—')}</b></div>
                    <div class="meta-item"><span>درجة الحرارة القياسية</span><b>${esc(row.temperature_standard || '—')}</b></div>
                    <div class="meta-item"><span>نقطة الوميض</span><b>${esc(row.flash_point || '—')}</b></div>
                    <div class="meta-item"><span>رمز اللون</span><b><span style="display:inline-block;width:20px;height:20px;border-radius:4px;background:${esc(row.color_code || '#ccc')};"></span> ${esc(row.color_code || '—')}</b></div>
                    <div class="meta-item"><span>سعر البيع الافتراضي</span><b>${(parseFloat(row.default_sale_price)||0).toLocaleString('ar',{maximumFractionDigits:2})} ₪</b></div>
                    <div class="meta-item"><span>سعر الشراء الافتراضي</span><b>${(parseFloat(row.default_purchase_price)||0).toLocaleString('ar',{maximumFractionDigits:2})} ₪</b></div>
                    <div class="meta-item"><span>نسبة الضريبة</span><b>${row.tax_rate ? row.tax_rate + '%' : '—'}</b></div>
                    <div class="meta-item"><span>ضريبة القيمة المضافة</span><b>${row.vat_rate ? row.vat_rate + '%' : '—'}</b></div>
                    <div class="meta-item"><span>مسار الأيقونة</span><b>${esc(row.icon_path || '—')}</b></div>
                    <div class="meta-item"><span>ملاحظات</span><b>${esc(row.remarks || '—')}</b></div>
                </div>
                <details style="margin-top:14px">
                    <summary style="cursor:pointer;color:var(--muted);font-size:.8rem;">JSON الخام</summary>
                    <pre style="direction:ltr;text-align:left;background:#0b1220;color:#dbeafe;padding:12px;border-radius:10px;font:.72rem/1.5 monospace;max-height:200px;overflow:auto;">${esc(JSON.stringify(row,null,2))}</pre>
                </details>
            `;
            openOverlay('detailsOverlay');
        }

        // ===== التقارير =====
        function initReportTabs() {
            document.querySelectorAll('#reportTabs .tab').forEach(tab => {
                tab.onclick = function() {
                    document.querySelectorAll('#reportTabs .tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const panelId = 'report-' + this.dataset.report;
                    document.querySelectorAll('.report-panel').forEach(p => p.classList.add('hidden'));
                    const panel = document.getElementById(panelId);
                    if (panel) panel.classList.remove('hidden');
                };
            });
        }

        function renderReportTable(rows, columns) {
            if (!rows || !rows.length) {
                return '<div class="empty"><i class="fas fa-file-alt"></i><div>لا توجد بيانات للتقرير.</div></div>';
            }
            let html = `<table><thead><tr>`;
            columns.forEach(col => html += `<th>${esc(col)}</th>`);
            html += `</tr></thead><tbody>`;
            rows.slice(0, 200).forEach(row => {
                html += `<tr>`;
                columns.forEach(col => {
                    const val = row[col] !== undefined ? row[col] : '—';
                    html += `<td>${esc(typeof val === 'object' ? JSON.stringify(val) : val)}</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            return html;
        }

        // --- ملخص الأنواع ---
        async function runSummaryReport() {
            const from = $('reportFrom').value || '';
            const to = $('reportTo').value || '';
            let filtered = state.rows;
            // ملاحظة: لا يوجد تاريخ محدد في جدول fuel_types، نستخدم البيانات المتاحة

            const total = filtered.length;
            const active = filtered.filter(r => Number(r.is_active) === 1).length;
            const inactive = filtered.filter(r => Number(r.is_active) === 0).length;
            const totalSalePrice = filtered.reduce((s, r) => s + (parseFloat(r.default_sale_price) || 0), 0);
            const avgSalePrice = total ? totalSalePrice / total : 0;
            const totalPurchasePrice = filtered.reduce((s, r) => s + (parseFloat(r.default_purchase_price) || 0), 0);
            const avgPurchasePrice = total ? totalPurchasePrice / total : 0;

            $('summaryResult').innerHTML = `
                <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-top:12px;">
                    <div class="kpi"><b>${total}</b><span>إجمالي الأنواع</span></div>
                    <div class="kpi"><b>${active}</b><span>نشطة</span></div>
                    <div class="kpi"><b>${inactive}</b><span>غير نشطة</span></div>
                    <div class="kpi"><b>${avgSalePrice.toFixed(2)}</b><span>متوسط سعر البيع</span></div>
                    <div class="kpi"><b>${avgPurchasePrice.toFixed(2)}</b><span>متوسط سعر الشراء</span></div>
                </div>
                ${renderReportTable(filtered, ['fuel_code','fuel_name_ar','default_sale_price','default_purchase_price','tax_rate','vat_rate','is_active'])}
            `;
            toast('تم توليد الملخص', 'success');
        }

        // --- قائمة الأسعار ---
        async function runPriceReport() {
            const fuelId = $('priceFuelType').value || 'all';
            const statusFilter = $('priceStatus').value || 'all';
            let filtered = state.rows;
            if (fuelId !== 'all') filtered = filtered.filter(r => String(r.id) === String(fuelId));
            if (statusFilter === 'active') filtered = filtered.filter(r => Number(r.is_active) === 1);
            else if (statusFilter === 'inactive') filtered = filtered.filter(r => Number(r.is_active) === 0);

            $('priceResult').innerHTML = renderReportTable(filtered, ['fuel_code', 'fuel_name_ar', 'default_sale_price',
                'default_purchase_price', 'tax_rate', 'vat_rate'
            ]);
            toast('تم توليد قائمة الأسعار', 'success');
        }

        // --- تحليل الضرائب ---
        async function runTaxReport() {
            const taxType = $('taxType').value || 'all';
            const minValue = parseFloat($('taxMin').value) || 0;
            let filtered = state.rows;
            if (taxType === 'tax_rate') filtered = filtered.filter(r => (parseFloat(r.tax_rate) || 0) >= minValue);
            else if (taxType === 'vat_rate') filtered = filtered.filter(r => (parseFloat(r.vat_rate) || 0) >= minValue);
            else filtered = filtered.filter(r => (parseFloat(r.tax_rate) || 0) >= minValue || (parseFloat(r.vat_rate) || 0) >=
                minValue);

            $('taxResult').innerHTML = renderReportTable(filtered, ['fuel_code', 'fuel_name_ar', 'tax_rate', 'vat_rate']);
            toast('تم تحليل الضرائب', 'success');
        }

        // --- المواصفات الفنية ---
        async function runSpecReport() {
            const fuelId = $('specFuelType').value || 'all';
            const specType = $('specType').value || 'all';
            let filtered = state.rows;
            if (fuelId !== 'all') filtered = filtered.filter(r => String(r.id) === String(fuelId));

            const columns = ['fuel_code', 'fuel_name_ar'];
            if (specType === 'all' || specType === 'density') columns.push('density_standard');
            if (specType === 'all' || specType === 'temperature') columns.push('temperature_standard');
            if (specType === 'all' || specType === 'flash') columns.push('flash_point');

            $('specResult').innerHTML = renderReportTable(filtered, columns);
            toast('تم عرض المواصفات', 'success');
        }

        // ===== تصدير CSV =====
        function exportData(rows) {
            const data = rows || state.filtered;
            if (!data.length) { toast('لا توجد بيانات للتصدير', 'warning'); return; }
            const keys = [...new Set(data.flatMap(r => Object.keys(r || {})))];
            const csv = '\ufeff' + [keys, ...data.map(r => keys.map(k => String(r[k] ?? '').replace(/"/g, '""')))].map(a => a
                .map(v => '"' + v + '"').join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fuel-types.csv';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            toast('تم تصدير CSV', 'success');
        }

        // ===== الأحداث =====
        $('searchInput').addEventListener('input', () => { loadData(state.tab); });

        $('themeBtn').addEventListener('click', () => {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('fuelTypesTheme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        });

        if (localStorage.getItem('fuelTypesTheme') === 'dark') {
            document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = 'fas fa-sun';
        }

        $('homeBtn').onclick = () => { window.location.href = '../main.html'; };

        $('newBtn').onclick = () => openForm();
        $('reportBtn').onclick = () => {
            openOverlay('reportOverlay');
            initReportTabs();
            populateFuelTypeSelects();
        };

        $('runSummaryReport').onclick = runSummaryReport;
        $('exportSummaryReport').onclick = () => exportData(state.filtered);
        $('runPriceReport').onclick = runPriceReport;
        $('runTaxReport').onclick = runTaxReport;
        $('runSpecReport').onclick = runSpecReport;

        $('saveBtn').onclick = saveForm;
        $('closeForm').onclick = () => closeOverlay('formOverlay');
        $('cancelForm').onclick = () => closeOverlay('formOverlay');
        $('closeDetails').onclick = () => closeOverlay('detailsOverlay');
        $('closeReport').onclick = () => closeOverlay('reportOverlay');

        // ===== سحب للتحديث =====
        let touchY = 0;
        document.addEventListener('touchstart', e => {
            if (window.scrollY === 0) touchY = e.touches[0].clientY;
        }, { passive: true });
        document.addEventListener('touchmove', e => {
            if (touchY && e.touches[0].clientY - touchY > 35) $('pull').classList.add('show');
        }, { passive: true });
        document.addEventListener('touchend', async () => {
            if ($('pull').classList.contains('show')) {
                $('pull').textContent = 'جاري التحديث…';
                await loadData(state.tab);
                setTimeout(() => $('pull').classList.remove('show'), 300);
                $('pull').textContent = 'اسحب للتحديث…';
            }
            touchY = 0;
        });

        // ===== بدء التشغيل =====
        renderTabs();
        loadData('all');

        window.reloadData = () => loadData(state.tab);
        window.exportData = exportData;
        window.openForm = openForm;

    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
