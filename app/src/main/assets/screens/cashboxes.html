    <script>
    (() => {
        'use strict';

        /* ============================================================
           إعدادات الشاشة — مطابقة لجدول cash_boxes في DatabaseHelper.kt
           جدول cash_boxes:
           - box_code, box_name, box_name_ar, station_id, box_type
           - opening_balance, current_balance, maximum_balance
           - currency_id, responsible_user_id, status, remarks, extra_data
           القيود:
           - box_type: main|auxiliary|mobile|safe
           - status: active|closed|suspended
           ============================================================ */
        const CFG = {
            "title": "إدارة الصناديق",
            "icon": "fa-cash-register",
            "module": "finance",
            "listMethod": "getCashBoxRecords",
            "listArgs": ["{}"],
            "fields": [
                { "label": "كود الصندوق", "key": "box_code", "type": "text", "required": true, "placeholder": "" },
                { "label": "اسم الصندوق", "key": "box_name", "type": "text", "required": true, "placeholder": "" },
                { "label": "box name ar", "key": "box_name_ar", "type": "text", "required": false, "placeholder": "" },
                { "label": "المحطة", "key": "station_id", "type": "number", "required": true, "placeholder": "" },
                { "label": "box type", "key": "box_type", "type": "select", "required": false, "placeholder": "" },
                { "label": "opening balance", "key": "opening_balance", "type": "number", "required": false, "placeholder": "" },
                { "label": "current balance", "key": "current_balance", "type": "number", "required": false, "placeholder": "" },
                { "label": "maximum balance", "key": "maximum_balance", "type": "number", "required": false, "placeholder": "" },
                { "label": "العملة", "key": "currency_id", "type": "number", "required": false, "placeholder": "" },
                { "label": "responsible user id", "key": "responsible_user_id", "type": "number", "required": false, "placeholder": "" },
                { "label": "الحالة", "key": "status", "type": "select", "required": false, "placeholder": "" },
                { "label": "ملاحظات", "key": "remarks", "type": "textarea", "required": false, "placeholder": "" },
                { "label": "extra data", "key": "extra_data", "type": "textarea", "required": false, "placeholder": "" }
            ],
            "valueFields": ["opening_balance", "current_balance", "maximum_balance"],
            "titleFields": ["box_name"],
            "subtitleFields": ["box_code", "box_name", "box_name_ar", "station_id", "box_type", "opening_balance", "current_balance", "maximum_balance"],
            "createMethod": "saveCashBoxRecord",
            "updateMethod": "updateCashBoxRecord",
            "deleteMethod": "deleteCashBoxRecord",
            "mode": "list",
            "operationKey": "cash_boxes"
        };

        /* ============================================================
           ترجمة كاملة لعناوين حقول جدول cash_boxes
           ============================================================ */
        const FIELD_LABELS_AR = {
            "id": "المعرف",
            "uuid": "المعرف الفريد",
            "box_code": "كود الصندوق",
            "box_name": "اسم الصندوق (إنجليزي)",
            "box_name_ar": "اسم الصندوق",
            "station_id": "المحطة",
            "box_type": "نوع الصندوق",
            "opening_balance": "الرصيد الافتتاحي",
            "current_balance": "الرصيد الحالي",
            "maximum_balance": "الحد الأقصى للرصيد",
            "currency_id": "العملة",
            "responsible_user_id": "المسؤول عن الصندوق",
            "status": "الحالة",
            "remarks": "ملاحظات",
            "extra_data": "بيانات إضافية",
            "created_at": "تاريخ الإنشاء",
            "updated_at": "تاريخ التحديث",
            "created_by": "أنشأه",
            "updated_by": "عدّله",
            "is_deleted": "محذوف",
            "device_id": "معرف الجهاز",
            "sync_status": "حالة المزامنة"
        };

        /* حقول تأخذ عرض السطر الكامل */
        const WIDE_FIELDS = new Set(["remarks", "extra_data"]);

        /* خيارات القوائم المنسدلة */
        const SELECT_OPTIONS = {
            "box_type": [
                { value: "main", label: "رئيسي" },
                { value: "auxiliary", label: "فرعي" },
                { value: "mobile", label: "متنقل" },
                { value: "safe", label: "خزنة" }
            ],
            "status": [
                { value: "active", label: "نشط" },
                { value: "closed", label: "مغلق" },
                { value: "suspended", label: "موقوف" }
            ]
        };

        /* الحقول المرجعية — تُجلب قيمها من الجداول المرتبطة */
        const REFERENCE_FIELDS = {
            "station_id":          { table: "stations", value: "id", label: "station_name_ar", fallback: "station_name" },
            "currency_id":         { table: "currencies", value: "id", label: "currency_name_ar", fallback: "currency_name" },
            "responsible_user_id": { table: "users", value: "id", label: "full_name_ar", fallback: "full_name" }
        };

        /* بيانات وصفية لأنواع الصناديق */
        const BOX_TYPE_META = {
            "main":      { ar: "رئيسي",  icon: "fa-vault" },
            "auxiliary": { ar: "فرعي",   icon: "fa-cash-register" },
            "mobile":    { ar: "متنقل",  icon: "fa-wallet" },
            "safe":      { ar: "خزنة",   icon: "fa-lock" }
        };

        /* بيانات وصفية للحالات */
        const STATUS_META = {
            "active":    { ar: "نشط",   cls: "completed", icon: "fa-circle-check" },
            "closed":    { ar: "مغلق",  cls: "cancelled", icon: "fa-lock" },
            "suspended": { ar: "موقوف", cls: "pending",   icon: "fa-pause-circle" }
        };

        /* ============================================================
           التبويبات العلوية — فلاتر حقيقية حسب نوع الصندوق
           ============================================================ */
        const FILTER_TABS = [
            { id: "all",       label: "الكل",   icon: "fa-list" },
            { id: "main",      label: "رئيسي",  icon: "fa-vault" },
            { id: "auxiliary", label: "فرعي",   icon: "fa-cash-register" },
            { id: "mobile",    label: "متنقل",  icon: "fa-wallet" },
            { id: "safe",      label: "خزنة",   icon: "fa-lock" }
        ];

        /* ============================================================
           القائمة السفلية — أدوات تشغيلية (لا تكرر التبويبات العلوية)
           ============================================================ */
        const BOTTOM_TOOLS = [
            { id: "add",     label: "صندوق جديد",   icon: "fa-circle-plus" },
            { id: "active",  label: "النشطة",        icon: "fa-circle-check" },
            { id: "usage",   label: "مستوى الاستخدام", icon: "fa-gauge-high" },
            { id: "stats",   label: "توزيع الأنواع",  icon: "fa-chart-pie" },
            { id: "report",  label: "تقرير",         icon: "fa-file-lines" }
        ];

        const bridge = window.AndroidInterface;
        const state = {
            rows: [],
            filtered: [],
            editing: null,
            filter: 'all',
            statusFilter: null,
            usageFilter: null,
            loadedAt: null,
            referenceCache: {},
            viewMode: 'cards',
            _reportRows: []
        };

        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => new Date().toISOString().slice(0,10);

        /* ============================================================
           تنسيق الأرقام — إنجليزية فقط
           ============================================================ */
        function toEnglishDigits(str) {
            return String(str)
                .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
                .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));
        }
        const fmtNum = (v, decimals = 0) => {
            const n = Number(v || 0);
            if (!Number.isFinite(n)) return '0';
            return toEnglishDigits(n.toLocaleString('en-US', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            }));
        };
        const fmtInt = (v) => {
            const n = Number(v || 0);
            if (!Number.isFinite(n)) return '0';
            return toEnglishDigits(Math.round(n).toLocaleString('en-US'));
        };
        const fmtTime = (d) => {
            if (!(d instanceof Date)) return '—';
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        };

        /* ============================================================
           تحويل الرقم إلى كلمات عربية
           ============================================================ */
        function numberToArabicWords(num) {
            const n = Math.floor(Math.abs(Number(num) || 0));
            if (n === 0) return 'صفر';
            const ones = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة',
                          'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر',
                          'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
            const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
            const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
            function toWords(x) {
                if (x === 0) return '';
                if (x < 20) return ones[x];
                if (x < 100) {
                    const t = Math.floor(x / 10), o = x % 10;
                    return o === 0 ? tens[t] : `${ones[o]} و${tens[t]}`;
                }
                if (x < 1000) {
                    const h = Math.floor(x / 100), r = x % 100;
                    return r === 0 ? hundreds[h] : `${hundreds[h]} و${toWords(r)}`;
                }
                if (x < 1000000) {
                    const t = Math.floor(x / 1000), r = x % 1000;
                    const tWord = t === 1 ? 'ألف' : t === 2 ? 'ألفان' : t < 11 ? `${ones[t]} آلاف` : `${toWords(t)} ألف`;
                    return r === 0 ? tWord : `${tWord} و${toWords(r)}`;
                }
                if (x < 1000000000) {
                    const m = Math.floor(x / 1000000), r = x % 1000000;
                    const mWord = m === 1 ? 'مليون' : m === 2 ? 'مليونان' : m < 11 ? `${ones[m]} ملايين` : `${toWords(m)} مليون`;
                    return r === 0 ? mWord : `${mWord} و${toWords(r)}`;
                }
                return String(x);
            }
            return toWords(n);
        }

        /* ============================================================
           Toast
           ============================================================ */
        function toast(message, bad = false) {
            const node = $('toast');
            if (!node) return;
            const cls = bad ? 'error' : 'success';
            node.className = `toast show ${cls}`;
            node.innerHTML = `<span class="toast-icon"><i class="fas ${bad ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i></span><span>${esc(message)}</span>`;
            clearTimeout(node._timer);
            node._timer = setTimeout(() => node.classList.remove('show'), 3500);
        }

        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }

        /* ============================================================
           الجسر — Parse / Invoke
           ============================================================ */
        function parse(raw) {
            if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
            const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
            return value;
        }
        function dataOf(value) {
            return value && Object.prototype.hasOwnProperty.call(value, 'data') ? value.data : value;
        }
        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') {
                return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            }
            try { return Promise.resolve(parse(bridge[method](...args))); }
            catch (error) { return Promise.reject(error); }
        }
        function argsForLoad() {
            return [JSON.stringify({ limit: 500, search: $('searchInput').value || '' })];
        }
        function rowsFrom(value) {
            const raw = dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (raw && typeof raw === 'object') return [raw];
            return [];
        }
        function field(row, names) {
            for (const name of (names || [])) {
                if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
            }
            return '';
        }
        function titleOf(row) {
            if (row && row.box_name_ar) return row.box_name_ar;
            if (row && row.box_name) return row.box_name;
            if (row && row.box_code) return `صندوق #${row.box_code}`;
            return 'صندوق بلا اسم';
        }
        function subtitleOf(row) {
            return (CFG.subtitleFields || []).map(k => {
                const v = row && row[k];
                return v === undefined || v === null || v === '' ? null : `${FIELD_LABELS_AR[k] || k}: ${v}`;
            }).filter(Boolean).join(' · ');
        }
        function idOf(row) { return field(row, ['id', '_id', 'cash_box_id']); }
        function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

        function boxTypeKey(row) {
            if (!row) return '';
            return String(row.box_type || '').trim().toLowerCase();
        }
        function boxTypeClass(row) {
            const t = boxTypeKey(row);
            return ['main','auxiliary','mobile','safe'].includes(t) ? t : 'main';
        }
        function boxTypeLabel(row) {
            const t = boxTypeKey(row);
            return BOX_TYPE_META[t]?.ar || t || '—';
        }
        function statusKey(row) {
            if (!row) return '';
            return String(row.status || 'active').trim().toLowerCase();
        }
        function statusMeta(row) {
            const s = statusKey(row);
            return STATUS_META[s] || { ar: s || 'نشط', cls: 'completed', icon: 'fa-circle-check' };
        }

        /* حساب مستوى الاستخدام — current_balance / maximum_balance */
        function usagePercent(row) {
            const cur = numeric(row?.current_balance);
            const max = numeric(row?.maximum_balance);
            if (max <= 0 || cur <= 0) return 0;
            return Math.min(100, Math.round((cur / max) * 100));
        }
        function usageLevel(row) {
            const p = usagePercent(row);
            if (p >= 90) return 'critical';
            if (p >= 70) return 'high';
            if (p >= 40) return 'medium';
            return 'low';
        }
        function usageMeta(level) {
            const map = {
                critical: { ar: 'حرج',   cls: 'failed',   color: 'var(--brick-600)' },
                high:     { ar: 'مرتفع', cls: 'pending',  color: 'var(--clay-600)' },
                medium:   { ar: 'متوسط', cls: 'pending',  color: 'var(--bronze-600)' },
                low:      { ar: 'منخفض', cls: 'completed', color: 'var(--moss-600)' }
            };
            return map[level] || map.low;
        }

        /* ============================================================
           الثيم
           ============================================================ */
        function setDateDefaults() {
            if ($('reportFrom')) $('reportFrom').value = $('reportFrom').value || today();
            if ($('reportTo')) $('reportTo').value = $('reportTo').value || today();
        }
        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            const icon = $('themeIcon');
            if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            if (isDark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            const icon = $('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        /* ============================================================
           التبويبات العلوية
           ============================================================ */
        function renderFilters() {
            const chips = $('filterChips');
            chips.innerHTML = FILTER_TABS.map(t => `
                <button type="button" class="filter-chip ${t.id === 'all' ? 'active' : ''}" data-filter="${t.id}">
                    <i class="fas ${t.icon}"></i><span>${esc(t.label)}</span>
                </button>
            `).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    chips.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                    btn.classList.add('active');
                    state.filter = btn.dataset.filter;
                    applyFilter();
                });
            });
        }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        function renderBottomNav() {
            const nav = $('bottomNav');
            nav.innerHTML = BOTTOM_TOOLS.map(t => `
                <button type="button" class="nav-item" data-tool="${t.id}">
                    <i class="fas ${t.icon}"></i><span>${esc(t.label)}</span>
                </button>
            `).join('');
            nav.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', () => {
                    nav.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
                    btn.classList.add('active');
                    handleTool(btn.dataset.tool);
                });
            });
        }

        function handleTool(tool) {
            switch (tool) {
                case 'add':
                    openForm(null);
                    break;
                case 'active':
                    state.filter = 'all';
                    state.statusFilter = 'active';
                    state.usageFilter = null;
                    resetTopChips();
                    applyFilter();
                    toast('تم عرض الصناديق النشطة فقط');
                    break;
                case 'usage':
                    state.filter = 'all';
                    state.statusFilter = null;
                    state.usageFilter = 'critical';
                    resetTopChips();
                    applyFilter();
                    toast('تم عرض الصناديق ذات الاستخدام الحرج (≥90%)');
                    break;
                case 'stats':
                    showQuickStats();
                    break;
                case 'report':
                    openReport();
                    break;
            }
        }

        function resetTopChips() {
            const chip = $('filterChips').querySelector(`[data-filter="all"]`);
            if (chip) {
                $('filterChips').querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                chip.classList.add('active');
            }
        }

        /* ============================================================
           تبديل عرض البطاقات / الجدول
           ============================================================ */
        function initViewToggle() {
            const saved = localStorage.getItem('cashboxes_view_mode') || 'cards';
            state.viewMode = saved;
            setViewMode(saved);
            $('viewToggle').querySelectorAll('[data-view-btn]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.viewBtn;
                    state.viewMode = mode;
                    localStorage.setItem('cashboxes_view_mode', mode);
                    setViewMode(mode);
                    toast(mode === 'table' ? 'تم تفعيل عرض الجدول' : 'تم تفعيل عرض البطاقات');
                });
            });
        }
        function setViewMode(mode) {
            $('viewToggle').querySelectorAll('[data-view-btn]').forEach(b => {
                b.classList.toggle('active', b.dataset.viewBtn === mode);
            });
            $('dataPanel').dataset.view = mode;
        }

        /* ============================================================
           الفلترة الفعلية
           ============================================================ */
        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const typeFilter = state.filter;
            const statusFilter = state.statusFilter;
            const usageFilter = state.usageFilter;

            state.filtered = state.rows.filter(row => {
                if (typeFilter && typeFilter !== 'all') {
                    if (boxTypeKey(row) !== typeFilter) return false;
                }
                if (statusFilter) {
                    if (statusKey(row) !== statusFilter) return false;
                }
                if (usageFilter) {
                    if (usageLevel(row) !== usageFilter) return false;
                }
                if (q) {
                    const text = JSON.stringify(row || {}).toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return true;
            });
            renderCards();
            renderTable();
        }

        /* ============================================================
           الإحصائيات
           ============================================================ */
        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = fmtInt(rows.length);
            const active = rows.filter(r => statusKey(r) === 'active').length;
            $('statActive').textContent = fmtInt(active);
            let totalBalance = 0;
            rows.forEach(r => { totalBalance += numeric(r.current_balance); });
            $('statTotal').textContent = totalBalance ? fmtNum(totalBalance, 2) : '0';
            $('statUpdated').textContent = state.loadedAt ? fmtTime(state.loadedAt) : '—';
            $('itemCount').textContent = fmtInt(rows.length);
        }

        /* ============================================================
           عرض البطاقات
           ============================================================ */
        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>لا توجد نتائج مطابقة للفلتر أو البحث.</p>
                    </div>`;
                return;
            }
            box.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const typeKey = boxTypeClass(row);
                const typeMeta = BOX_TYPE_META[boxTypeKey(row)] || { icon: 'fa-cash-register' };
                const status = statusMeta(row);
                const balance = numeric(row.current_balance);
                const usage = usagePercent(row);
                const usageLevelKey = usageLevel(row);
                const usageMeta = usageMetaForRow(usageLevelKey);
                const currency = row.currency_id ? ` #${esc(row.currency_id)}` : '';
                const stationDisplay = row.station_id ? `محطة #${esc(row.station_id)}` : '';

                const extraFields = [];
                if (row.opening_balance !== undefined && row.opening_balance !== null && row.opening_balance !== '') {
                    extraFields.push({ label: 'افتتاحي', value: fmtNum(row.opening_balance, 2) });
                }
                if (row.maximum_balance !== undefined && row.maximum_balance !== null && row.maximum_balance !== '' && numeric(row.maximum_balance) > 0) {
                    extraFields.push({ label: 'الحد الأقصى', value: fmtNum(row.maximum_balance, 2) });
                }
                if (usage > 0) {
                    extraFields.push({ label: 'الاستخدام', value: `${fmtInt(usage)}%` });
                }
                if (row.responsible_user_id) {
                    extraFields.push({ label: 'المسؤول', value: `#${esc(row.responsible_user_id)}` });
                }

                const extraHtml = extraFields.slice(0, 4).map(f => `
                    <div class="card-extra-field">
                        <span class="label">${esc(f.label)}</span>
                        <span class="value">${esc(f.value)}</span>
                    </div>
                `).join('');

                const actions = `
                    <button type="button" class="btn" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>
                    ${CFG.updateMethod ? `<button type="button" class="btn warning" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                    ${CFG.deleteMethod ? `<button type="button" class="btn danger" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>` : ''}
                `;

                return `
                    <article class="data-card" data-type="${typeKey}">
                        <div class="card-body">
                            <div class="card-method-icon ${typeKey}">
                                <i class="fas ${typeMeta.icon}"></i>
                            </div>
                            <div class="card-main">
                                <div class="card-title">${esc(titleOf(row))}</div>
                                <div class="card-subtitle">
                                    ${[row.box_code ? `#${esc(row.box_code)}` : null, stationDisplay].filter(Boolean).join(' · ') || '—'}
                                </div>
                            </div>
                            ${balance ? `<div class="card-amount">${fmtNum(balance, 2)}${currency}</div>` : ''}
                        </div>
                        <div class="card-badges">
                            <span class="method-badge ${typeKey}">
                                <i class="fas ${typeMeta.icon}"></i> ${esc(boxTypeLabel(row))}
                            </span>
                            <span class="payment-status ${status.cls}">
                                <i class="fas ${status.icon}"></i> ${esc(status.ar)}
                            </span>
                            ${usage > 0 ? `<span class="payment-status ${usageMeta.cls}"><i class="fas fa-gauge-high"></i> ${fmtInt(usage)}%</span>` : ''}
                        </div>
                        ${extraHtml ? `<div class="card-extra-fields">${extraHtml}</div>` : ''}
                        <div class="card-actions">${actions}</div>
                    </article>
                `;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.delete))));
        }

        function usageMetaForRow(level) {
            const map = {
                critical: { cls: 'failed' },
                high:     { cls: 'pending' },
                medium:   { cls: 'pending' },
                low:      { cls: 'completed' }
            };
            return map[level] || map.low;
        }

        /* ============================================================
           عرض الجدول
           ============================================================ */
        function renderTable() {
            const tbody = $('cashboxesTableBody');
            if (!tbody) return;
            if (!state.filtered.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="table-empty">
                                <i class="fas fa-inbox" style="font-size:2.5rem;display:block;margin-bottom:12px;color:var(--sage-400);"></i>
                                <div>لا توجد نتائج مطابقة للفلتر أو البحث.</div>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
            tbody.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const status = statusMeta(row);
                const typeKey = boxTypeClass(row);
                const typeMeta = BOX_TYPE_META[boxTypeKey(row)] || { icon: 'fa-cash-register' };
                const balance = numeric(row.current_balance);
                const code = row.box_code || `#${id}`;
                const name = row.box_name_ar || row.box_name || '—';
                return `
                    <tr>
                        <td>${fmtInt(index + 1)}</td>
                        <td class="col-code">${esc(code)}</td>
                        <td>${esc(name)}</td>
                        <td><span class="method-badge ${typeKey}"><i class="fas ${typeMeta.icon}"></i> ${esc(boxTypeLabel(row))}</span></td>
                        <td class="col-amount">${fmtNum(balance, 2)}</td>
                        <td><span class="payment-status ${status.cls}"><i class="fas ${status.icon}"></i> ${esc(status.ar)}</span></td>
                        <td class="col-actions">
                            <button class="btn" type="button" data-table-view="${id}" title="عرض"><i class="fas fa-eye"></i></button>
                            ${CFG.updateMethod ? `<button class="btn warning" type="button" data-table-edit="${id}" title="تعديل"><i class="fas fa-edit"></i></button>` : ''}
                            ${CFG.deleteMethod ? `<button class="btn danger" type="button" data-table-delete="${id}" title="حذف"><i class="fas fa-trash"></i></button>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
            tbody.querySelectorAll('[data-table-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.tableView)));
            tbody.querySelectorAll('[data-table-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.tableEdit))));
            tbody.querySelectorAll('[data-table-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.tableDelete))));
        }

        function findRow(id) {
            return state.rows.find((row, index) => String(idOf(row) || index) === String(id));
        }

        /* ============================================================
           تفاصيل السجل
           ============================================================ */
        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            const typeMeta = BOX_TYPE_META[boxTypeKey(row)] || { icon: 'fa-cash-register' };
            const status = statusMeta(row);
            const usage = usagePercent(row);
            const detailGrid = Object.entries(row).map(([k, v]) => {
                const label = FIELD_LABELS_AR[k] || k;
                let value = v == null ? '—' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
                value = toEnglishDigits(value);
                return `<div class="detail-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
            }).join('');
            $('detailsBody').innerHTML = `
                <div style="text-align:center;margin-bottom:14px;">
                    <div style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;">
                        <span class="method-badge ${boxTypeClass(row)}"><i class="fas ${typeMeta.icon}"></i> ${esc(boxTypeLabel(row))}</span>
                        <span class="payment-status ${status.cls}"><i class="fas ${status.icon}"></i> ${esc(status.ar)}</span>
                        ${usage > 0 ? `<span class="payment-status ${usageMetaForRow(usageLevel(row)).cls}"><i class="fas fa-gauge-high"></i> ${fmtInt(usage)}%</span>` : ''}
                    </div>
                    <div style="font-size:1.3rem;font-weight:800;direction:ltr;color:var(--charcoal-900);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-shadow:var(--glow-value);">
                        ${fmtNum(row.current_balance, 2)}
                    </div>
                    <div style="color:var(--text-muted);font-size:0.78rem;margin-top:4px;">${esc(row.box_code || '')}</div>
                </div>
                <div class="detail-grid">${detailGrid}</div>
                <details style="margin-top:14px;">
                    <summary style="cursor:pointer;font-size:0.82rem;font-weight:600;color:var(--text-secondary);">عرض JSON الكامل</summary>
                    <pre class="raw-json">${esc(JSON.stringify(row, null, 2))}</pre>
                </details>
            `;
            openModal(null, 'detailsModal');
        }

        /* ============================================================
           توليد كود تلقائي
           ============================================================ */
        function generateAutoCode() {
            const timestamp = Date.now().toString(36).toUpperCase();
            const random = Math.random().toString(36).slice(2, 6).toUpperCase();
            return `BOX-${timestamp}-${random}`;
        }

        /* ============================================================
           بناء حقول النموذج
           ============================================================ */
        function inputHtml(def, row) {
            const key = def.key;
            const label = FIELD_LABELS_AR[key] || def.label || key;
            const value = row && row[key] !== undefined && row[key] !== null ? row[key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const wideAttr = WIDE_FIELDS.has(key) || def.type === 'textarea' ? 'data-wide="true"' : '';

            // الحقول المرجعية → قائمة منسدلة ديناميكية
            if (REFERENCE_FIELDS[key]) {
                return `
                    <div class="form-group" ${wideAttr}>
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <select class="form-input" data-key="${esc(key)}" data-reference="true" ${req}>
                            <option value="">${value ? `القيمة الحالية: ${esc(value)}` : 'اختر...'}</option>
                        </select>
                    </div>
                `;
            }

            // القوائم المنسدلة الثابتة
            if (def.type === 'select') {
                const options = SELECT_OPTIONS[key] || [];
                const optionsHtml = options.map(opt => {
                    const isSelected = String(value) === opt.value ? ' selected' : '';
                    return `<option value="${esc(opt.value)}"${isSelected}>${esc(opt.label)}</option>`;
                }).join('');
                return `
                    <div class="form-group" ${wideAttr}>
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <select class="form-input" data-key="${esc(key)}" ${req}>
                            <option value="">اختر...</option>
                            ${optionsHtml}
                        </select>
                    </div>
                `;
            }

            // النصوص الطويلة
            if (def.type === 'textarea') {
                return `
                    <div class="form-group full">
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <textarea class="form-input" data-key="${esc(key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea>
                    </div>
                `;
            }

            return `
                <div class="form-group" ${wideAttr}>
                    <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                    <input class="form-input" data-key="${esc(key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}>
                </div>
            `;
        }

        /* ============================================================
           فتح نموذج الإضافة/التعديل
           ============================================================ */
        function openForm(row = null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').innerHTML = row
                ? '<i class="fas fa-edit"></i> تعديل الصندوق'
                : '<i class="fas fa-plus-circle"></i> إضافة صندوق جديد';

            // إخفاء الحقول المُولّدة تلقائياً عند الإضافة
            const fieldsToRender = (CFG.fields || []).filter(def => {
                if (!row && def.key === 'box_code') return false;
                return true;
            });

            $('recordForm').innerHTML = fieldsToRender.map(def => inputHtml(def, row)).join('');

            if (row) {
                (CFG.fields || []).forEach(def => {
                    const el = document.querySelector(`#recordForm [data-key="${CSS.escape(def.key)}"]`);
                    if (el && def.type === 'select' && !el.dataset.reference) el.value = row[def.key] ?? '';
                });
            }

            loadReferenceOptions(row);

            if (!row) {
                $('recordForm').dataset.generatedCode = generateAutoCode();
            }

            openModal(null, 'formModal');

            // تركيز أول حقل قابل للكتابة تلقائياً
            setTimeout(() => {
                const firstInput = $('recordForm').querySelector('input:not([type="hidden"]):not([disabled]), select:not([disabled]), textarea:not([disabled])');
                if (firstInput) {
                    try { firstInput.focus({ preventScroll: false }); } catch (e) {}
                }
            }, 350);
        }

        /* ============================================================
           تحميل القيم المرجعية
           ============================================================ */
        async function loadReferenceOptions(row) {
            const selectors = $('recordForm').querySelectorAll('select[data-reference="true"]');
            if (!selectors.length) return;
            for (const select of selectors) {
                const key = select.dataset.key;
                const ref = REFERENCE_FIELDS[key];
                if (!ref) continue;
                try {
                    const options = await fetchReferenceOptions(ref);
                    const currentValue = row && row[key] !== undefined ? String(row[key]) : '';
                    select.innerHTML = '<option value="">اختر...</option>' +
                        options.map(opt => {
                            const isSelected = String(opt.value) === currentValue ? ' selected' : '';
                            return `<option value="${esc(opt.value)}"${isSelected}>${esc(opt.label)}</option>`;
                        }).join('');
                } catch (err) {
                    select.innerHTML = '<option value="">غير متاح حالياً</option>';
                }
            }
        }

        async function fetchReferenceOptions(ref) {
            const cacheKey = `${ref.table}:${ref.filter || ''}`;
            if (state.referenceCache[cacheKey]) return state.referenceCache[cacheKey];

            const candidateMethods = [
                `get${capitalize(ref.table)}`,
                `get${capitalize(ref.table)}Records`,
                `get${capitalize(singularize(ref.table))}`
            ];
            for (const methodName of candidateMethods) {
                if (bridge && typeof bridge[methodName] === 'function') {
                    try {
                        const raw = bridge[methodName]('{}');
                        const parsed = parse(raw);
                        const list = rowsFrom(parsed);
                        const options = list.map(item => {
                            const primary = item[ref.label];
                            const fallback = ref.fallback ? item[ref.fallback] : null;
                            return {
                                value: item[ref.value],
                                label: primary || fallback || item.name_ar || item.name || `${ref.table} #${item[ref.value]}`
                            };
                        }).filter(o => o.value != null);
                        state.referenceCache[cacheKey] = options;
                        return options;
                    } catch (err) { /* Try next */ }
                }
            }

            // احتياطي للجداول المعروفة
            if (ref.table === 'stations' && bridge && typeof bridge.getStations === 'function') {
                try {
                    const raw = bridge.getStations();
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.station_name_ar || item.station_name || item.station_code || `محطة #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) {}
            }
            if (ref.table === 'currencies' && bridge && typeof bridge.getCurrencies === 'function') {
                try {
                    const raw = bridge.getCurrencies();
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.currency_name_ar || item.currency_name || item.currency_code || `عملة #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) {}
            }
            if (ref.table === 'users' && bridge && typeof bridge.getUsers === 'function') {
                try {
                    const raw = bridge.getUsers();
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.full_name_ar || item.full_name || item.username || `مستخدم #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) {}
            }
            return [];
        }
        function capitalize(s) { return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }
        function singularize(s) { return String(s || '').replace(/ies$/, 'y').replace(/s$/, ''); }

        /* ============================================================
           تجميع بيانات النموذج
           ============================================================ */
        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                let value = el.value;
                const type = el.type;
                if (type === 'number') value = value === '' ? 0 : Number(value);
                payload[el.dataset.key] = value;
            });
            const generatedCode = $('recordForm').dataset.generatedCode;
            if (generatedCode && !state.editing) {
                payload.box_code = generatedCode;
            }
            (CFG.fields || []).forEach(def => {
                if (!def.required && payload[def.key] === '') {
                    if (def.type !== 'number') delete payload[def.key];
                }
            });
            return payload;
        }

        /* ============================================================
           حفظ النموذج
           ============================================================ */
        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم حفظ الصندوق بنجاح');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحفظ', true);
            } finally {
                setLoading(false);
            }
        }

        /* ============================================================
           حذف الصندوق
           ============================================================ */
        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد حذف هذا الصندوق؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم حذف الصندوق');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }

        async function resolveRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.resolveMethod) return;
            const note = prompt('أدخل ملاحظة الاعتماد/الحل إن لزم:', '');
            if (note === null) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.resolveMethod, [Number(id), String(note)]);
                parse(result);
                toast('تم تنفيذ العملية فعلياً');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل تنفيذ العملية', true);
            } finally {
                setLoading(false);
            }
        }

        /* ============================================================
           إعادة تحميل البيانات
           ============================================================ */
        async function reloadData() {
            if (!CFG.listMethod) { renderCards(); renderTable(); return; }
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                renderCards();
                renderTable();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                renderTable();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }

        /* ============================================================
           المودالات
           ============================================================ */
        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }

        /* ============================================================
           فتح مودال التقارير
           ============================================================ */
        function openReport() {
            setDateDefaults();
            populateReportCurrencies();
            $('reportResults').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>اختر الفلاتر ثم اضغط "توليد من المصدر".</p>
                </div>`;
            openModal(null, 'reportModal');
        }

        async function populateReportCurrencies() {
            const sel = $('reportCurrency');
            if (!sel || sel.options.length > 1) return;
            try {
                const options = await fetchReferenceOptions(REFERENCE_FIELDS.currency_id);
                options.forEach(o => {
                    const opt = document.createElement('option');
                    opt.value = o.value;
                    opt.textContent = o.label;
                    sel.appendChild(opt);
                });
            } catch (e) {}
        }

        /* ============================================================
           توليد التقرير — مع فلاتر موسّعة
           ============================================================ */
        async function generateReport() {
            setLoading(true);
            try {
                const from = $('reportFrom').value || today();
                const to = $('reportTo').value || today();
                const boxType = $('reportBoxType').value;
                const status = $('reportStatus').value;
                const minBalance = $('reportMinBalance').value ? Number($('reportMinBalance').value) : null;
                const maxBalance = $('reportMaxBalance').value ? Number($('reportMaxBalance').value) : null;
                const currencyId = $('reportCurrency').value ? Number($('reportCurrency').value) : null;
                const groupBy = $('reportGroupBy').value;
                const usageFilter = $('reportUsageLevel').value;

                let rows = state.rows.slice();

                // فلترة بالتاريخ
                rows = rows.filter(r => {
                    const d = String(r.created_at || '').slice(0, 10);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to && d > to) return false;
                    return true;
                });
                if (boxType) rows = rows.filter(r => boxTypeKey(r) === boxType);
                if (status) rows = rows.filter(r => statusKey(r) === status);
                if (minBalance !== null) rows = rows.filter(r => numeric(r.current_balance) >= minBalance);
                if (maxBalance !== null) rows = rows.filter(r => numeric(r.current_balance) <= maxBalance);
                if (currencyId !== null) rows = rows.filter(r => Number(r.currency_id) === currencyId);
                if (usageFilter) rows = rows.filter(r => usageLevel(r) === usageFilter);

                let totalBalance = 0, totalMax = 0, totalOpening = 0;
                let activeCount = 0, closedCount = 0;
                rows.forEach(r => {
                    totalBalance += numeric(r.current_balance);
                    totalMax += numeric(r.maximum_balance);
                    totalOpening += numeric(r.opening_balance);
                    const s = statusKey(r);
                    if (s === 'active') activeCount++;
                    if (s === 'closed') closedCount++;
                });

                const usageRatio = totalMax > 0 ? (totalBalance / totalMax) * 100 : 0;

                const summaryHtml = `
                    <div class="report-summary">
                        <div class="report-summary-card">
                            <div class="label">عدد الصناديق</div>
                            <div class="value">${fmtInt(rows.length)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">إجمالي الأرصدة</div>
                            <div class="value" style="color:var(--sage-700);">${fmtNum(totalBalance, 2)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">الإجمالي الافتتاحي</div>
                            <div class="value">${fmtNum(totalOpening, 2)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">الحد الأقصى الإجمالي</div>
                            <div class="value">${fmtNum(totalMax, 2)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">نسبة الاستخدام</div>
                            <div class="value" style="color:${usageRatio > 80 ? 'var(--brick-600)' : 'var(--moss-600)'};">${fmtInt(usageRatio)}%</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">نشط / مغلق</div>
                            <div class="value">${fmtInt(activeCount)} / ${fmtInt(closedCount)}</div>
                        </div>
                    </div>
                `;

                let groupedHtml = '';
                if (groupBy !== 'none' && rows.length) {
                    const groups = {};
                    rows.forEach(r => {
                        let key = 'أخرى';
                        if (groupBy === 'type') key = boxTypeLabel(r);
                        else if (groupBy === 'status') key = statusMeta(r).ar;
                        else if (groupBy === 'station') key = r.station_id ? `محطة #${r.station_id}` : 'بدون محطة';
                        if (!groups[key]) groups[key] = { count: 0, balance: 0, max: 0 };
                        groups[key].count++;
                        groups[key].balance += numeric(r.current_balance);
                        groups[key].max += numeric(r.maximum_balance);
                    });
                    const groupRows = Object.entries(groups).sort((a, b) => b[1].balance - a[1].balance);
                    groupedHtml = `
                        <div class="report-results" style="margin-top:12px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>المجموعة</th>
                                        <th>العدد</th>
                                        <th>إجمالي الرصيد</th>
                                        <th>الحد الأقصى</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${groupRows.map(([k, v]) => `
                                        <tr>
                                            <td>${esc(k)}</td>
                                            <td>${fmtInt(v.count)}</td>
                                            <td style="direction:ltr;font-family:'Inter',sans-serif;font-weight:700;">${fmtNum(v.balance, 2)}</td>
                                            <td style="direction:ltr;font-family:'Inter',sans-serif;">${fmtNum(v.max, 2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                const tableHtml = rows.length
                    ? `
                        <div class="report-results">
                            <table>
                                <thead>
                                    <tr>
                                        <th>الكود</th>
                                        <th>الاسم</th>
                                        <th>النوع</th>
                                        <th>الرصيد</th>
                                        <th>الحد الأقصى</th>
                                        <th>الاستخدام</th>
                                        <th>الحالة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows.slice(0, 200).map(r => `
                                        <tr>
                                            <td class="col-code">${esc(r.box_code || `#${r.id || ''}`)}</td>
                                            <td>${esc(r.box_name_ar || r.box_name || '—')}</td>
                                            <td>${esc(boxTypeLabel(r))}</td>
                                            <td style="direction:ltr;font-family:'Inter',sans-serif;font-weight:700;text-shadow:var(--glow-value);">${fmtNum(r.current_balance, 2)}</td>
                                            <td style="direction:ltr;font-family:'Inter',sans-serif;">${fmtNum(r.maximum_balance, 2)}</td>
                                            <td>${fmtInt(usagePercent(r))}%</td>
                                            <td><span class="payment-status ${statusMeta(r).cls}">${esc(statusMeta(r).ar)}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `
                    : `<div class="empty-state"><i class="fas fa-search"></i><p>لا توجد نتائج مطابقة للفلاتر.</p></div>`;

                $('reportResults').innerHTML = summaryHtml + groupedHtml + tableHtml;
                state._reportRows = rows;
                toast('تم توليد التقرير بنجاح');
            } catch (error) {
                toast(error.message || 'فشل توليد التقرير', true);
            } finally { setLoading(false); }
        }

        function renderReport(rows) {
            if (!rows.length) return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="report-results"><table><thead><tr><th>الاسم</th><th>الكود</th><th>الرصيد</th><th>الحالة</th></tr></thead><tbody>${rows.slice(0, 100).map(row => `
                <tr>
                    <td>${esc(titleOf(row))}</td>
                    <td class="col-code">${esc(row.box_code || '—')}</td>
                    <td style="direction:ltr;font-weight:700;">${fmtNum(row.current_balance, 2)}</td>
                    <td><span class="payment-status ${statusMeta(row).cls}">${esc(statusMeta(row).ar)}</span></td>
                </tr>
            `).join('')}</tbody></table></div>`;
        }

        /* ============================================================
           طباعة التقرير
           ============================================================ */
        function printReport() {
            try {
                if (bridge && typeof bridge.printCurrentPage === 'function') bridge.printCurrentPage();
                else window.print();
            } catch (e) { window.print(); }
        }

        /* ============================================================
           توزيع أنواع الصناديق — الإحصائيات السريعة
           ============================================================ */
        function showQuickStats() {
            const rows = state.filtered.length ? state.filtered : state.rows;
            const byType = {};
            let total = 0;
            rows.forEach(r => {
                const t = boxTypeKey(r) || 'other';
                const a = numeric(r.current_balance);
                byType[t] = (byType[t] || 0) + a;
                total += a;
            });
            const entries = Object.entries(byType).sort((a, b) => b[1] - a[1]);

            // توزيع حسب الحالة
            const statusCounts = {};
            rows.forEach(r => {
                const s = statusKey(r) || 'active';
                statusCounts[s] = (statusCounts[s] || 0) + 1;
            });

            $('quickStatsBody').innerHTML = entries.length
                ? `
                    <div class="report-summary" style="grid-template-columns:1fr;">
                        <div class="report-summary-card">
                            <div class="label">الإجمالي العام</div>
                            <div class="value">${fmtNum(total, 2)}</div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
                        ${entries.map(([t, amount]) => {
                            const meta = BOX_TYPE_META[t] || { ar: t || 'أخرى', icon: 'fa-cash-register' };
                            const pct = total > 0 ? ((amount / total) * 100).toFixed(1) : '0';
                            return `
                                <div style="background:var(--ivory-100);border:1px solid var(--border-color);border-radius:var(--radius-small);padding:12px;">
                                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
                                        <span class="method-badge ${t}"><i class="fas ${meta.icon}"></i> ${esc(meta.ar)}</span>
                                        <span style="font-weight:800;direction:ltr;font-family:'Inter',sans-serif;color:var(--charcoal-900);font-variant-numeric:tabular-nums;text-shadow:var(--glow-value);">${fmtNum(amount, 2)}</span>
                                    </div>
                                    <div style="height:6px;background:var(--ivory-200);border-radius:3px;overflow:hidden;">
                                        <div style="height:100%;width:${pct}%;background:var(--sage-600);border-radius:3px;transition:width 0.5s ease;"></div>
                                    </div>
                                    <div style="text-align:left;font-size:0.7rem;color:var(--text-muted);margin-top:4px;font-variant-numeric:tabular-nums;">${toEnglishDigits(pct)}%</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div style="margin-top:18px;">
                        <div style="font-size:0.85rem;font-weight:800;color:var(--charcoal-900);margin-bottom:8px;text-align:center;">
                            <i class="fas fa-circle-info" style="color:var(--sage-700);"></i> توزيع الحالات
                        </div>
                        <div class="report-summary">
                            ${Object.entries(statusCounts).map(([s, count]) => {
                                const meta = STATUS_META[s] || { ar: s || 'غير معروف', icon: 'fa-circle' };
                                return `
                                    <div class="report-summary-card">
                                        <div class="label">${esc(meta.ar)}</div>
                                        <div class="value">${fmtInt(count)}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `
                : `<div class="empty-state"><i class="fas fa-chart-pie"></i><p>لا توجد بيانات لعرضها.</p></div>`;
            openModal(null, 'quickStatsModal');
        }

        /* ============================================================
           تصدير CSV
           ============================================================ */
        function exportData() {
            const rows = (state._reportRows && state._reportRows.length) ? state._reportRows : state.filtered;
            if (!rows.length) { toast('لا توجد بيانات لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const header = keys.map(k => FIELD_LABELS_AR[k] || k);
            const csvRows = [header];
            rows.forEach(row => {
                csvRows.push(keys.map(k => {
                    const v = row[k];
                    return v == null ? '' : String(v).replace(/"/g, '""');
                }));
            });
            const csv = '\ufeff' + csvRows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cashboxes_report_${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            toast('تم إنشاء ملف CSV بنجاح');
        }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        function toggleSidebar(open) {
            const sidebar = $('sidebar');
            const toggle = $('sidebarToggle');
            const overlay = $('sidebarOverlay');
            const isOpen = typeof open === 'boolean' ? open : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            overlay.classList.toggle('show', isOpen);
            toggle.classList.toggle('hidden', isOpen);
        }

        function goHome() { window.location.href = '../main.html'; }

        function initSidebar() {
            const toggle = $('sidebarToggle');
            const sidebar = $('sidebar');
            const overlay = $('sidebarOverlay');
            toggle.addEventListener('click', () => toggleSidebar());
            overlay.addEventListener('click', () => toggleSidebar(false));
            sidebar.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    toggleSidebar(false);
                    setTimeout(() => {
                        switch (action) {
                            case 'refresh': reloadData(); break;
                            case 'report': openReport(); break;
                            case 'export': exportData(); break;
                            case 'print': printReport(); break;
                            case 'home': goHome(); break;
                        }
                    }, 180);
                });
            });
        }

        /* ============================================================
           معالجة زر الرجوع / Escape على الهاتف
           ============================================================ */
        function initKeyboardHandlers() {
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    const anyModalOpen = Array.from(document.querySelectorAll('.modal-overlay')).some(x => x.classList.contains('show'));
                    const sidebarOpen = $('sidebar').classList.contains('open');
                    if (anyModalOpen) {
                        document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                    } else if (sidebarOpen) {
                        toggleSidebar(false);
                    } else {
                        goHome();
                    }
                }
            });

            history.pushState({ page: 'cashboxes' }, '', location.href);
            window.addEventListener('popstate', () => {
                const anyModalOpen = Array.from(document.querySelectorAll('.modal-overlay')).some(x => x.classList.contains('show'));
                const sidebarOpen = $('sidebar').classList.contains('open');
                if (anyModalOpen || sidebarOpen) {
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                    toggleSidebar(false);
                    history.pushState({ page: 'cashboxes' }, '', location.href);
                } else {
                    goHome();
                }
            });
        }

        /* ============================================================
           تهيئة الواجهة
           ============================================================ */
        function initUI() {
            const search = $('searchInput');
            search.addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('saveBtn').addEventListener('click', saveForm);

            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', () => {
                    const stat = card.dataset.stat;
                    if (stat === 'total' || stat === 'active') showQuickStats();
                    else if (stat === 'count' || stat === 'updated') reloadData();
                });
            });
        }

        /* ============================================================
           Boot — نقطة التشغيل الآمنة
           ============================================================ */
        function boot() {
            try {
                applyTheme();
                renderFilters();
                renderBottomNav();
                initViewToggle();
                initSidebar();
                initKeyboardHandlers();
                initUI();

                if (bridge) {
                    reloadData();
                } else {
                    $('offlineBanner').classList.add('show');
                    renderCards();
                    renderTable();
                }
            } catch (err) {
                console.error('boot error', err);
                toast('خطأ في تهيئة الواجهة: ' + (err.message || err), true);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }

        /* ============================================================
           تصدير الدوال العامة
           ============================================================ */
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm,
            saveForm, openModal, closeModal, generateReport,
            printReport, showQuickStats, resolveRow
        });
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
