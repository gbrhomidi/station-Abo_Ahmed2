<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – إدارة الصناديق</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
/* ============================================================
   نظام Ivory Sage — مطابق لشاشة إدارة المدفوعات
   عاجي دافئ + أخضر مريمي + برونزي
   ============================================================ */
:root {
    --ivory-50:  #FDFCF8;
    --ivory-100: #F8F6EF;
    --ivory-200: #F1EEE3;
    --ivory-300: #E8E4D6;
    --ivory-400: #DDD7C4;

    --sage-900: #1F2D24;
    --sage-800: #2E4034;
    --sage-700: #3D5A4C;
    --sage-600: #4E7060;
    --sage-500: #6B8E7F;
    --sage-400: #93AFA3;
    --sage-300: #B8CBC1;
    --sage-200: #D5E0DA;
    --sage-100: #E8EFEB;
    --sage-50:  #F2F7F4;

    --bronze-800: #6B5230;
    --bronze-700: #8C6D3F;
    --bronze-600: #A67C45;
    --bronze-500: #B8935A;
    --bronze-400: #C9A976;
    --bronze-300: #DBC29A;
    --bronze-200: #EAD9BD;
    --bronze-100: #F5EBD9;
    --bronze-50:  #FAF4E8;

    --charcoal-900: #26241F;
    --charcoal-800: #3A362E;
    --charcoal-700: #4F4A40;
    --charcoal-600: #686156;
    --charcoal-500: #827A6E;
    --charcoal-400: #9E968A;
    --charcoal-300: #BEB7AC;
    --charcoal-200: #D9D3C9;
    --charcoal-100: #EDE9E1;
    --charcoal-50:  #F6F4EF;

    --moss-700: #3A6B4A;
    --moss-600: #4A7C59;
    --moss-500: #6B9979;
    --moss-100: #E5F0E8;
    --moss-50:  #F2F8F3;

    --brick-700: #8B3D3D;
    --brick-600: #A54E4E;
    --brick-500: #C06A6A;
    --brick-100: #F3E0E0;
    --brick-50:  #FAF0F0;

    --clay-700: #8C6034;
    --clay-600: #A87444;
    --clay-500: #C08F5E;
    --clay-100: #F2E4D2;
    --clay-50:  #FBF4E9;

    --sky-700: #3A6072;
    --sky-600: #4A7488;
    --sky-500: #6B8DA0;
    --sky-100: #E0EBF0;

    --primary: var(--sage-700);
    --primary-dark: var(--sage-800);
    --primary-deep: var(--sage-900);
    --primary-light: var(--sage-500);
    --primary-soft: var(--sage-100);
    --primary-ultra: var(--sage-50);
    --primary-border: var(--sage-300);

    --accent: var(--bronze-600);
    --accent-dark: var(--bronze-700);
    --accent-soft: var(--bronze-100);
    --accent-border: var(--bronze-300);

    --success: var(--moss-600);
    --success-dark: var(--moss-700);
    --success-soft: var(--moss-100);
    --success-ultra: var(--moss-50);

    --danger: var(--brick-600);
    --danger-dark: var(--brick-700);
    --danger-soft: var(--brick-100);
    --danger-ultra: var(--brick-50);

    --warning: var(--clay-600);
    --warning-dark: var(--clay-700);
    --warning-soft: var(--clay-100);
    --warning-ultra: var(--clay-50);

    --info: var(--sky-600);
    --info-dark: var(--sky-700);
    --info-soft: var(--sky-100);

    --bg-primary: var(--ivory-100);
    --bg-secondary: var(--ivory-50);
    --bg-card: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-paper: var(--ivory-50);

    --text-primary: var(--charcoal-900);
    --text-secondary: var(--charcoal-600);
    --text-muted: var(--charcoal-500);
    --text-subtle: var(--charcoal-400);
    --text-inverse: #FFFFFF;
    --text-accent: var(--bronze-700);

    --border-color: var(--ivory-300);
    --border-strong: var(--charcoal-200);
    --border-primary: var(--sage-300);
    --border-accent: var(--bronze-300);

    --shadow-xs: 0 1px 2px rgba(58, 54, 46, 0.03);
    --shadow-sm: 0 2px 4px rgba(58, 54, 46, 0.05), 0 1px 2px rgba(58, 54, 46, 0.03);
    --shadow-md: 0 4px 12px rgba(58, 54, 46, 0.06), 0 2px 4px rgba(58, 54, 46, 0.03);
    --shadow-lg: 0 10px 28px rgba(58, 54, 46, 0.08), 0 4px 8px rgba(58, 54, 46, 0.04);
    --shadow-xl: 0 20px 44px rgba(58, 54, 46, 0.1);
    --shadow-sage: 0 6px 18px rgba(74, 106, 87, 0.15);
    --shadow-bronze: 0 4px 12px rgba(166, 124, 69, 0.15);

    --glow-title: 0 0 14px rgba(107, 142, 127, 0.12), 0 1px 0 rgba(255, 255, 255, 0.6);
    --glow-value: 0 0 12px rgba(107, 142, 127, 0.1), 0 1px 0 rgba(255, 255, 255, 0.5);
    --glow-data:  0 0 10px rgba(74, 106, 87, 0.06);
    --glow-badge: 0 0 8px rgba(74, 106, 87, 0.08);

    --radius-card: 14px;
    --radius-small: 10px;
    --radius-tiny: 8px;
    --radius-xs: 6px;
    --radius-pill: 999px;

    --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);

    color-scheme: light;
}

[data-theme="dark"] {
    --bg-primary: #1C1A15;
    --bg-secondary: #24211C;
    --bg-card: #2B2822;
    --bg-elevated: #2B2822;
    --bg-paper: #24211C;

    --text-primary: #EDE9E1;
    --text-secondary: #BEB7AC;
    --text-muted: #9E968A;
    --text-subtle: #827A6E;
    --text-accent: var(--bronze-400);

    --border-color: rgba(190, 183, 172, 0.16);
    --border-strong: rgba(190, 183, 172, 0.28);
    --border-primary: rgba(147, 175, 163, 0.32);
    --border-accent: rgba(201, 169, 118, 0.32);

    --primary-soft: rgba(107, 142, 127, 0.14);
    --primary-ultra: rgba(107, 142, 127, 0.06);
    --accent-soft: rgba(184, 147, 90, 0.14);
    --success-soft: rgba(74, 124, 89, 0.14);
    --danger-soft: rgba(165, 78, 78, 0.16);
    --warning-soft: rgba(168, 116, 68, 0.16);

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.42);
    --shadow-xl: 0 20px 44px rgba(0, 0, 0, 0.5);
    --shadow-sage: 0 6px 18px rgba(74, 106, 87, 0.28);
    --shadow-bronze: 0 4px 12px rgba(166, 124, 69, 0.25);

    --glow-title: 0 0 20px rgba(184, 147, 90, 0.45), 0 0 40px rgba(184, 147, 90, 0.2);
    --glow-value: 0 0 18px rgba(184, 147, 90, 0.4), 0 0 36px rgba(184, 147, 90, 0.15);
    --glow-data:  0 0 12px rgba(201, 169, 118, 0.3);
    --glow-badge: 0 0 10px rgba(184, 147, 90, 0.28);

    color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
    font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    margin: 0;
    padding: 0 0 96px;
    background-image:
        radial-gradient(circle at 15% 10%, rgba(107, 142, 127, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(184, 147, 90, 0.04) 0%, transparent 40%);
    background-attachment: fixed;
    transition: background 0.3s ease, color 0.3s ease;
    touch-action: pan-y;
    -webkit-font-smoothing: antialiased;
    text-align: center;
    line-height: 1.5;
}

[data-theme="dark"] body {
    background-image:
        radial-gradient(circle at 15% 10%, rgba(107, 142, 127, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(184, 147, 90, 0.06) 0%, transparent 40%);
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--sage-300); border-radius: 3px; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background: var(--sage-600); }

.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(38, 36, 31, 0.4);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
[data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.65); }
.loading-indicator.show,
.loading-indicator[style*="display: flex"] { display: flex !important; }
.spinner {
    width: 46px;
    height: 46px;
    border: 3px solid rgba(74, 106, 87, 0.15);
    border-top-color: var(--sage-600);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--clay-600);
    color: #FFFFFF;
    text-align: center;
    padding: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: rgba(253, 252, 248, 0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: var(--transition);
}
[data-theme="dark"] .top-bar { background: rgba(36, 33, 28, 0.92); }

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.top-title h2 {
    font-size: 1.28rem;
    font-weight: 800;
    margin: 0;
    color: var(--charcoal-900);
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: var(--glow-title);
}
[data-theme="dark"] .top-title h2 { color: var(--ivory-100); }
.top-title h2 i {
    color: var(--sage-700);
    font-size: 1.1rem;
    background: var(--sage-100);
    padding: 8px;
    border-radius: var(--radius-tiny);
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
[data-theme="dark"] .top-title h2 i {
    background: var(--sage-800);
    color: var(--sage-300);
}
.header-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    color: var(--charcoal-600);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1rem;
    position: relative;
}
[data-theme="dark"] .icon-btn {
    background: var(--bg-card);
    border-color: var(--border-color);
    color: var(--text-secondary);
}
.icon-btn:hover, .icon-btn:active {
    background: var(--sage-100);
    border-color: var(--sage-400);
    color: var(--sage-700);
    transform: translateY(-1px);
}
[data-theme="dark"] .icon-btn:hover { background: var(--sage-800); color: var(--sage-300); }
.icon-btn:active { transform: scale(0.95); }

.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 12px 44px 12px 18px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    text-align: center;
    font-weight: 600;
    text-shadow: var(--glow-data);
}
.search-input:focus {
    border-color: var(--sage-600);
    box-shadow: 0 0 0 3px var(--sage-100);
}
[data-theme="dark"] .search-input:focus { box-shadow: 0 0 0 3px rgba(107, 142, 127, 0.2); }
.search-input::placeholder { color: var(--text-subtle); text-shadow: none; font-weight: 500; }
.search-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--charcoal-400);
    font-size: 0.9rem;
    pointer-events: none;
}

.filter-chips-wrap {
    background: var(--ivory-200);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    padding: 4px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    box-shadow: inset 0 1px 2px rgba(58, 54, 46, 0.04);
    position: relative;
}
[data-theme="dark"] .filter-chips-wrap {
    background: rgba(232, 228, 214, 0.06);
    border-color: var(--border-color);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
}
.filter-chips-wrap::-webkit-scrollbar { display: none; }

.filter-chips {
    display: flex;
    gap: 2px;
    justify-content: flex-start;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}
.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
    padding: 9px 15px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--charcoal-500);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    flex-shrink: 0;
    border-radius: var(--radius-pill);
    letter-spacing: 0.1px;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .filter-chip { color: var(--text-muted); }
.filter-chip i { font-size: 0.74rem; opacity: 0.85; }
.filter-chip:active { transform: scale(0.97); }
.filter-chip:hover { color: var(--sage-700); background: rgba(255, 255, 255, 0.6); }
[data-theme="dark"] .filter-chip:hover {
    color: var(--sage-400);
    background: rgba(232, 228, 214, 0.06);
}
.filter-chip.active {
    background: var(--bg-card);
    color: var(--sage-800);
    font-weight: 800;
    border: 1.5px solid var(--sage-500);
    box-shadow:
        0 0 0 2px rgba(107, 142, 127, 0.18),
        0 2px 6px rgba(58, 54, 46, 0.1),
        var(--glow-badge);
    text-shadow: 0 0 8px rgba(61, 90, 76, 0.15);
}
[data-theme="dark"] .filter-chip.active {
    background: var(--bg-card);
    color: var(--bronze-400);
    border-color: var(--bronze-500);
    box-shadow:
        0 0 0 2px rgba(184, 147, 90, 0.25),
        0 2px 6px rgba(0, 0, 0, 0.3),
        var(--glow-badge);
    text-shadow: var(--glow-badge);
}

/* ============================================================
   بطاقات الإحصائيات
   ============================================================ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 18px 16px 6px;
}

.stat-card {
    position: relative;
    padding: 18px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
}
[data-theme="dark"] .stat-card { border-color: var(--border-color); }
.stat-card::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px dashed var(--sage-300);
    border-radius: calc(var(--radius-card) - 5px);
    opacity: 0.55;
    pointer-events: none;
    transition: var(--transition);
}
[data-theme="dark"] .stat-card::before { border-color: rgba(147, 175, 163, 0.35); }
.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--sage-400);
}
.stat-card:active { transform: scale(0.98); }

.stat-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-tiny);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    background: var(--sage-100);
    color: var(--sage-700);
    margin-bottom: 9px;
    border: 1px solid var(--sage-200);
    position: relative;
    z-index: 1;
}
[data-theme="dark"] .stat-icon {
    background: var(--sage-800);
    color: var(--sage-300);
    border-color: var(--sage-600);
}
.stat-icon.blue { color: var(--sky-700); background: var(--sky-100); border-color: rgba(74, 116, 136, 0.2); }
.stat-icon.green { color: var(--moss-700); background: var(--moss-100); border-color: rgba(74, 124, 89, 0.2); }
.stat-icon.orange { color: var(--bronze-700); background: var(--bronze-100); border-color: var(--bronze-300); }
.stat-icon.purple { color: var(--sage-800); background: var(--sage-100); border-color: var(--sage-300); }
.stat-icon.red { color: var(--brick-700); background: var(--brick-100); border-color: rgba(165, 78, 78, 0.25); }

.stat-value {
    font-size: 1.4rem;
    font-weight: 800;
    font-family: 'Inter', 'Cairo', sans-serif;
    letter-spacing: -0.4px;
    line-height: 1.15;
    color: var(--charcoal-900);
    margin: 2px 0 4px;
    direction: ltr;
    text-align: center;
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .stat-value { color: var(--ivory-100); }

.stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.2px;
    position: relative;
    z-index: 1;
}

/* ============================================================
   لوحة البيانات
   ============================================================ */
.page-container { max-width: 1280px; margin: 0 auto; padding: 0 0 96px; }

.data-panel {
    margin: 16px;
    padding: 18px 16px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-xs);
}

.section-title {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
}
.section-title h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--charcoal-900);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    letter-spacing: -0.2px;
    text-shadow: var(--glow-title);
}
[data-theme="dark"] .section-title h3 { color: var(--ivory-100); }
.section-title h3 i { color: var(--sage-700); }

.count-badge {
    background: var(--sage-100);
    color: var(--sage-800);
    border: 1px solid var(--sage-300);
    border-radius: var(--radius-pill);
    padding: 3px 12px;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.2px;
    font-variant-numeric: tabular-nums;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .count-badge {
    background: var(--sage-800);
    color: var(--sage-200);
    border-color: var(--sage-600);
    text-shadow: var(--glow-badge);
}

.view-toggle {
    display: inline-flex;
    background: var(--ivory-200);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-small);
    padding: 3px;
    gap: 2px;
}
[data-theme="dark"] .view-toggle {
    background: rgba(232, 228, 214, 0.08);
    border-color: var(--border-color);
}
.view-toggle button {
    padding: 6px 12px;
    border-radius: var(--radius-xs);
    border: none;
    background: transparent;
    color: var(--charcoal-500);
    font-size: 0.74rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    white-space: nowrap;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .view-toggle button { color: var(--text-muted); }
.view-toggle button i { font-size: 0.76rem; }
.view-toggle button:active { transform: scale(0.96); }
.view-toggle button.active {
    background: var(--bg-card);
    color: var(--sage-800);
    font-weight: 800;
    box-shadow: var(--shadow-xs);
}
[data-theme="dark"] .view-toggle button.active {
    background: var(--bg-card);
    color: var(--bronze-400);
}

.cards-container {
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    touch-action: pan-y;
}

/* ============================================================
   بطاقة الصندوق
   ============================================================ */
.data-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-card);
    padding: 0;
    margin-bottom: 0;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    text-align: right;
    box-shadow: var(--shadow-xs);
    display: flex;
    flex-direction: column;
}
.data-card:hover {
    border-color: var(--sage-400);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}
[data-theme="dark"] .data-card:hover { border-color: var(--sage-600); }

.card-body {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 14px 14px 10px;
}

.card-method-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-small);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    flex-shrink: 0;
    background: var(--sage-100);
    color: var(--sage-700);
    border: 1px solid var(--sage-200);
}
[data-theme="dark"] .card-method-icon {
    background: var(--sage-800);
    color: var(--sage-300);
    border-color: var(--sage-600);
}
.card-method-icon.main { background: var(--sage-100); color: var(--sage-700); border-color: var(--sage-200); }
.card-method-icon.auxiliary { background: var(--sky-100); color: var(--sky-700); border-color: rgba(74, 116, 136, 0.25); }
.card-method-icon.mobile { background: var(--bronze-100); color: var(--bronze-700); border-color: var(--bronze-300); }
.card-method-icon.safe { background: var(--moss-100); color: var(--moss-700); border-color: rgba(74, 124, 89, 0.25); }

.card-main {
    flex: 1;
    min-width: 0;
    text-align: center;
}
.card-title {
    font-weight: 800;
    color: var(--charcoal-900);
    font-size: 0.92rem;
    text-align: center;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
    text-shadow: var(--glow-title);
}
[data-theme="dark"] .card-title { color: var(--ivory-100); }
.card-subtitle {
    color: var(--text-muted);
    font-size: 0.72rem;
    text-align: center;
    font-weight: 500;
    line-height: 1.5;
    word-break: break-word;
    text-shadow: var(--glow-data);
}
.card-amount {
    color: var(--charcoal-900);
    font-weight: 800;
    white-space: nowrap;
    direction: ltr;
    font-family: 'Inter', 'Cairo', sans-serif;
    font-size: 0.98rem;
    padding: 6px 12px;
    border-radius: var(--radius-tiny);
    background: var(--ivory-200);
    border: 1px solid var(--border-color);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .card-amount {
    background: rgba(232, 228, 214, 0.08);
    color: var(--bronze-400);
    border-color: var(--border-color);
}

.card-badges {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 0 14px 12px;
    align-items: center;
}
.card-date {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    direction: ltr;
    text-shadow: var(--glow-data);
}

.card-extra-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
    padding: 0 14px 12px;
}
.card-extra-field {
    padding: 8px 10px;
    border-radius: var(--radius-xs);
    background: var(--ivory-100);
    border: 1px solid var(--border-color);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
[data-theme="dark"] .card-extra-field { background: rgba(232, 228, 214, 0.05); }
.card-extra-field .label {
    font-size: 0.62rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 2px;
    letter-spacing: 0.2px;
}
.card-extra-field .value {
    color: var(--charcoal-800);
    font-size: 0.78rem;
    font-weight: 700;
    direction: ltr;
    font-variant-numeric: tabular-nums;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .card-extra-field .value { color: var(--ivory-200); }

.card-actions {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--border-color);
}
.card-actions .btn {
    flex: 1;
    border: none;
    border-radius: 0;
    background: transparent;
    padding: 11px 8px;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--charcoal-600);
    transition: var(--transition);
}
[data-theme="dark"] .card-actions .btn { color: var(--text-secondary); }
.card-actions .btn + .btn { border-right: 1px solid var(--border-color); }
.card-actions .btn:hover { background: var(--sage-50); color: var(--sage-700); transform: none; }
[data-theme="dark"] .card-actions .btn:hover { background: rgba(107, 142, 127, 0.1); color: var(--sage-300); }
.card-actions .btn.danger:hover { background: var(--brick-50); color: var(--brick-700); }
[data-theme="dark"] .card-actions .btn.danger:hover { background: rgba(165, 78, 78, 0.12); color: var(--brick-500); }
.card-actions .btn.warning:hover { background: var(--clay-50); color: var(--clay-700); }

/* ============================================================
   الشارات
   ============================================================ */
.payment-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.65rem;
    font-weight: 700;
    border: 1px solid transparent;
    letter-spacing: 0.2px;
    text-shadow: var(--glow-badge);
}
.payment-status.completed {
    background: var(--moss-100);
    color: var(--moss-700);
    border-color: rgba(74, 124, 89, 0.28);
}
[data-theme="dark"] .payment-status.completed {
    background: rgba(74, 124, 89, 0.14);
    color: #A0CEAE;
    border-color: rgba(74, 124, 89, 0.45);
    text-shadow: 0 0 10px rgba(74, 124, 89, 0.5);
}
.payment-status.pending {
    background: var(--clay-100);
    color: var(--clay-700);
    border-color: rgba(168, 116, 68, 0.28);
}
[data-theme="dark"] .payment-status.pending {
    background: rgba(168, 116, 68, 0.18);
    color: #E5B888;
    border-color: rgba(168, 116, 68, 0.45);
    text-shadow: 0 0 10px rgba(168, 116, 68, 0.4);
}
.payment-status.failed {
    background: var(--brick-100);
    color: var(--brick-700);
    border-color: rgba(165, 78, 78, 0.28);
}
[data-theme="dark"] .payment-status.failed {
    background: rgba(165, 78, 78, 0.18);
    color: #E5A0A0;
    border-color: rgba(165, 78, 78, 0.45);
    text-shadow: 0 0 10px rgba(165, 78, 78, 0.4);
}
.payment-status.cancelled {
    background: var(--ivory-200);
    color: var(--charcoal-500);
    border-color: var(--border-strong);
}
[data-theme="dark"] .payment-status.cancelled {
    background: rgba(232, 228, 214, 0.08);
    color: var(--text-muted);
}

.method-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    font-size: 0.65rem;
    font-weight: 700;
    border: 1px solid;
    background: transparent;
    letter-spacing: 0.2px;
    text-shadow: var(--glow-badge);
}
.method-badge.main { color: var(--sage-700); border-color: var(--sage-300); }
.method-badge.auxiliary { color: var(--sky-700); border-color: rgba(74, 116, 136, 0.3); }
.method-badge.mobile { color: var(--bronze-700); border-color: var(--bronze-300); }
.method-badge.safe { color: var(--moss-700); border-color: rgba(74, 124, 89, 0.3); }
[data-theme="dark"] .method-badge.main { color: var(--sage-200); border-color: var(--sage-600); text-shadow: 0 0 10px rgba(147, 175, 163, 0.5); }
[data-theme="dark"] .method-badge.auxiliary { color: #A0C5D6; border-color: rgba(74, 116, 136, 0.5); text-shadow: 0 0 10px rgba(74, 116, 136, 0.5); }
[data-theme="dark"] .method-badge.mobile { color: var(--bronze-300); border-color: var(--bronze-500); text-shadow: var(--glow-badge); }
[data-theme="dark"] .method-badge.safe { color: #A0CEAE; border-color: rgba(74, 124, 89, 0.5); text-shadow: 0 0 10px rgba(74, 124, 89, 0.5); }

/* ============================================================
   الجدول
   ============================================================ */
.cashboxes-table-wrap {
    display: none;
    overflow-x: auto;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    box-shadow: var(--shadow-xs);
    -webkit-overflow-scrolling: touch;
}
.data-panel[data-view="table"] .cashboxes-table-wrap { display: block; }
.data-panel[data-view="table"] .cards-container { display: none; }
.data-panel[data-view="cards"] .cashboxes-table-wrap { display: none; }
.data-panel[data-view="cards"] .cards-container { display: flex; }

.cashboxes-table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    font-size: 0.78rem;
    font-family: inherit;
}
.cashboxes-table thead th {
    background: var(--ivory-100);
    color: var(--charcoal-600);
    padding: 12px 12px;
    font-weight: 700;
    font-size: 0.68rem;
    letter-spacing: 0.6px;
    white-space: nowrap;
    text-align: center;
    border-bottom: 1px solid var(--border-strong);
    position: sticky;
    top: 0;
    z-index: 5;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .cashboxes-table thead th {
    background: rgba(232, 228, 214, 0.05);
    color: var(--text-secondary);
    border-bottom-color: var(--border-strong);
}
.cashboxes-table tbody td {
    padding: 12px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    vertical-align: middle;
    color: var(--text-secondary);
    font-weight: 500;
    white-space: nowrap;
}
.cashboxes-table tbody tr { transition: var(--transition-fast); }
.cashboxes-table tbody tr:hover { background: var(--sage-50); }
[data-theme="dark"] .cashboxes-table tbody tr:hover { background: rgba(107, 142, 127, 0.06); }
.cashboxes-table tbody tr:last-child td { border-bottom: none; }
.cashboxes-table .col-code {
    font-family: 'Inter', monospace;
    font-weight: 700;
    color: var(--sage-800);
    direction: ltr;
    font-size: 0.72rem;
    letter-spacing: 0.3px;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .cashboxes-table .col-code { color: var(--sage-300); }
.cashboxes-table .col-amount {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    color: var(--charcoal-900);
    direction: ltr;
    font-variant-numeric: tabular-nums;
    font-size: 0.84rem;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .cashboxes-table .col-amount { color: var(--ivory-100); }
.cashboxes-table .col-actions { white-space: nowrap; }
.cashboxes-table .col-actions .btn {
    padding: 5px 9px;
    font-size: 0.68rem;
    margin: 0 1px;
    border-radius: var(--radius-xs);
}
.cashboxes-table .col-actions .btn i { font-size: 0.7rem; }

.table-empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-muted);
}

/* ============================================================
   الأزرار
   ============================================================ */
.btn {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-tiny);
    padding: 8px 14px;
    background: var(--bg-card);
    color: var(--charcoal-700);
    font-family: inherit;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    touch-action: manipulation;
    letter-spacing: 0.1px;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .btn {
    background: var(--bg-card);
    color: var(--text-secondary);
    border-color: var(--border-strong);
}
.btn:hover, .btn:active {
    background: var(--sage-100);
    color: var(--sage-800);
    border-color: var(--sage-400);
    transform: translateY(-1px);
}
[data-theme="dark"] .btn:hover {
    background: var(--sage-800);
    color: var(--sage-200);
    border-color: var(--sage-600);
}
.btn:active { transform: scale(0.98); }

.btn.primary {
    background: var(--sage-700);
    color: #FFFFFF;
    border-color: var(--sage-800);
}
.btn.primary:hover {
    background: var(--sage-800);
    color: #FFFFFF;
    border-color: var(--sage-900);
    box-shadow: var(--shadow-sage);
}
[data-theme="dark"] .btn.primary {
    background: var(--bronze-600);
    color: var(--ivory-50);
    border-color: var(--bronze-700);
}
[data-theme="dark"] .btn.primary:hover { background: var(--bronze-500); }

.btn.danger { color: var(--brick-700); border-color: rgba(165, 78, 78, 0.35); background: var(--bg-card); }
.btn.danger:hover { background: var(--brick-600); color: #FFFFFF; border-color: var(--brick-600); }
.btn.warning { color: var(--clay-700); border-color: rgba(168, 116, 68, 0.35); }
.btn.warning:hover { background: var(--clay-600); color: #FFFFFF; border-color: var(--clay-600); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    line-height: 1.8;
}
.empty-state i {
    font-size: 3rem;
    display: block;
    color: var(--sage-300);
    margin-bottom: 14px;
}
[data-theme="dark"] .empty-state i { color: var(--sage-600); }
.empty-state p { font-size: 0.88rem; font-weight: 500; }

/* ============================================================
   القائمة الجانبية
   ============================================================ */
.sidebar-toggle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--sage-700);
    color: #FFFFFF;
    width: 32px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-small) 0 0 var(--radius-small);
    cursor: pointer;
    z-index: 1001;
    box-shadow: -4px 0 14px rgba(74, 106, 87, 0.25);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    touch-action: manipulation;
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.94); }
.sidebar-toggle.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-50%) translateX(20px);
}
[data-theme="dark"] .sidebar-toggle { background: var(--bronze-600); color: var(--ivory-50); }

.sidebar {
    position: fixed;
    top: 50%;
    right: -140px;
    transform: translateY(-50%);
    width: 118px;
    background: var(--bg-secondary);
    z-index: 999;
    transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
    padding: 10px 8px;
    border-radius: var(--radius-card) 0 0 var(--radius-card);
    overflow-y: auto;
    box-shadow: -12px 0 40px rgba(58, 54, 46, 0.12);
    border: 1px solid var(--border-strong);
    border-right: none;
    opacity: 0;
}
[data-theme="dark"] .sidebar { background: var(--bg-secondary); }
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 6px; }

.sidebar-btn {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    padding: 10px 5px;
    border-radius: var(--radius-small);
    color: var(--charcoal-700);
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 56px;
    text-align: center;
    font-size: 0.72rem;
    font-family: inherit;
    touch-action: manipulation;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .sidebar-btn {
    background: var(--bg-card);
    border-color: var(--border-color);
    color: var(--text-secondary);
}
.sidebar-btn:active { transform: scale(0.96); }
.sidebar-btn:hover {
    background: var(--sage-50);
    border-color: var(--sage-400);
    color: var(--sage-800);
    transform: translateX(-2px);
}
[data-theme="dark"] .sidebar-btn:hover {
    background: rgba(107, 142, 127, 0.08);
    color: var(--sage-300);
}
.sidebar-btn i {
    font-size: 1.15rem;
    color: var(--sage-700);
    transition: var(--transition);
    text-shadow: var(--glow-badge);
}
[data-theme="dark"] .sidebar-btn i { color: var(--bronze-400); }
.sidebar-btn:hover i { transform: scale(1.1); color: var(--sage-800); }
[data-theme="dark"] .sidebar-btn:hover i { color: var(--bronze-300); }
.sidebar-btn span { font-size: 0.6rem; margin-top: 1px; font-weight: 700; }

.sidebar-btn[data-back="true"] {
    background: var(--brick-50) !important;
    border-color: rgba(165, 78, 78, 0.35) !important;
    color: var(--brick-700) !important;
}
[data-theme="dark"] .sidebar-btn[data-back="true"] {
    background: rgba(165, 78, 78, 0.12) !important;
    color: #D68B8B !important;
}
.sidebar-btn[data-back="true"]:hover {
    background: var(--brick-600) !important;
    color: #FFFFFF !important;
    border-color: var(--brick-600) !important;
}
.sidebar-btn[data-back="true"] i { color: var(--brick-600) !important; }
.sidebar-btn[data-back="true"]:hover i { color: #FFFFFF !important; }

.sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(38, 36, 31, 0.3);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 998;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
}
.sidebar-overlay.show { opacity: 1; pointer-events: auto; }

/* ============================================================
   القائمة السفلية
   ============================================================ */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: rgba(253, 252, 248, 0.96);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300;
    overflow-x: auto;
    scrollbar-width: none;
}
[data-theme="dark"] .bottom-nav {
    background: rgba(36, 33, 28, 0.96);
    border-top-color: var(--border-color);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: 1.5px solid transparent;
    color: var(--charcoal-500);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 7px 10px;
    position: relative;
    touch-action: manipulation;
    flex: 1;
    min-width: 74px;
    border-radius: var(--radius-small);
    margin: 0 2px;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .bottom-nav .nav-item { color: var(--text-muted); }
.bottom-nav .nav-item:active { transform: scale(0.94); }
.bottom-nav .nav-item i { font-size: 22px; transition: var(--transition); }
.bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; font-size: 0.78rem; }
.bottom-nav .nav-item.active {
    color: var(--sage-800);
    background: var(--sage-50);
    border-color: var(--sage-400);
    box-shadow:
        0 0 0 2px rgba(107, 142, 127, 0.15),
        0 2px 6px rgba(58, 54, 46, 0.08),
        var(--glow-badge);
    text-shadow: 0 0 8px rgba(61, 90, 76, 0.2);
}
[data-theme="dark"] .bottom-nav .nav-item.active {
    color: var(--bronze-400);
    background: rgba(184, 147, 90, 0.1);
    border-color: var(--bronze-500);
    box-shadow:
        0 0 0 2px rgba(184, 147, 90, 0.25),
        0 2px 6px rgba(0, 0, 0, 0.3),
        var(--glow-badge);
    text-shadow: var(--glow-badge);
}
.bottom-nav .nav-item.active i { transform: translateY(-2px); }
.bottom-nav .nav-item.active::after {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 3px;
    background: var(--sage-700);
    border-radius: 0 0 3px 3px;
}
[data-theme="dark"] .bottom-nav .nav-item.active::after { background: var(--bronze-500); }

/* ============================================================
   المودالات
   ============================================================ */
.modal-overlay, .report-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(38, 36, 31, 0.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 950;
    display: none;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    overflow-y: auto;
}
[data-theme="dark"] .modal-overlay,
[data-theme="dark"] .report-modal-overlay { background: rgba(0, 0, 0, 0.7); }
.modal-overlay.show, .report-modal-overlay.show { display: flex; opacity: 1; }

.modal {
    background: var(--bg-secondary);
    border-radius: var(--radius-card) var(--radius-card) 0 0;
    width: 100%;
    max-width: 620px;
    max-height: 94vh;
    overflow-y: auto;
    padding: 22px 18px;
    transform: translateY(100%);
    transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid var(--border-strong);
    border-bottom: none;
    box-shadow: 0 -14px 50px rgba(58, 54, 46, 0.18);
    margin: 0 auto;
    position: relative;
}
[data-theme="dark"] .modal { background: var(--bg-secondary); border-color: var(--border-color); }
.modal::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    background: var(--sage-400);
    border-radius: 0 0 4px 4px;
    opacity: 0.6;
}
.modal-overlay.show .modal,
.report-modal-overlay.show .modal { transform: translateY(0); }

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    gap: 10px;
    margin-top: 8px;
}
.modal-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--charcoal-900);
    text-align: center;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    letter-spacing: -0.2px;
    text-shadow: var(--glow-title);
}
[data-theme="dark"] .modal-title { color: var(--ivory-100); }
.modal-title i { color: var(--sage-700); }
[data-theme="dark"] .modal-title i { color: var(--bronze-400); }

.modal-close {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--charcoal-500);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 0.95rem;
    flex-shrink: 0;
}
[data-theme="dark"] .modal-close {
    background: var(--bg-card);
    border-color: var(--border-color);
    color: var(--text-muted);
}
.modal-close:hover {
    background: var(--brick-600);
    color: #FFFFFF;
    border-color: var(--brick-600);
}
.modal-close:active { transform: scale(0.94); }

.modal-body { padding: 4px 0; }
.modal-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 14px 0 0;
    border-top: 1px solid var(--border-color);
    margin-top: 14px;
}

/* ============================================================
   النماذج
   ============================================================ */
.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
}
.form-group.full { grid-column: 1 / -1; }
.form-label {
    display: block;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--charcoal-700);
    margin-bottom: 5px;
    text-align: center;
    letter-spacing: 0.2px;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .form-label { color: var(--text-secondary); }

.form-input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    transition: var(--transition);
    outline: none;
    text-align: center;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .form-input {
    background: var(--bg-card);
    border-color: var(--border-strong);
    color: var(--text-primary);
}
.form-input:focus {
    border-color: var(--sage-600);
    box-shadow: 0 0 0 3px var(--sage-100);
    background: var(--bg-card);
}
[data-theme="dark"] .form-input:focus {
    border-color: var(--bronze-500);
    box-shadow: 0 0 0 3px rgba(184, 147, 90, 0.18);
}
.form-input.error { border-color: var(--brick-600); box-shadow: 0 0 0 3px var(--brick-100); }
textarea.form-input {
    text-align: center;
    line-height: 1.7;
    resize: vertical;
    min-height: 90px;
}

select.form-input {
    text-align: center;
    cursor: pointer;
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    appearance: none !important;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233D5A4C' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
    background-repeat: no-repeat !important;
    background-position: left 12px center !important;
    background-size: 15px !important;
    background-color: var(--bg-card) !important;
    padding-left: 36px;
    text-overflow: ellipsis;
}
[data-theme="dark"] select.form-input {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23C9A976' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") !important;
    background-repeat: no-repeat !important;
    background-position: left 12px center !important;
    background-size: 15px !important;
    background-color: var(--bg-card) !important;
}
select.form-input option { background: var(--bg-card); color: var(--text-primary); }

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
.form-grid .form-group.full,
.form-grid .form-group[data-wide="true"],
.form-grid .form-group:has(textarea) { grid-column: 1 / -1; }
.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.submit-btn {
    width: 100%;
    padding: 13px 20px;
    border-radius: var(--radius-small);
    border: 1px solid var(--sage-800);
    background: var(--sage-700);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    letter-spacing: 0.2px;
    text-shadow: var(--glow-data);
}
.submit-btn:active { transform: scale(0.98); }
.submit-btn:hover { background: var(--sage-800); box-shadow: var(--shadow-sage); }
[data-theme="dark"] .submit-btn {
    background: var(--bronze-600);
    color: var(--ivory-50);
    border-color: var(--bronze-700);
}

/* ============================================================
   تفاصيل السجل
   ============================================================ */
.detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
}
.detail-item {
    padding: 10px;
    border-radius: var(--radius-small);
    background: var(--ivory-100);
    border: 1px solid var(--border-color);
    text-align: center;
}
[data-theme="dark"] .detail-item {
    background: rgba(232, 228, 214, 0.05);
    border-color: var(--border-color);
}
.detail-item span {
    display: block;
    color: var(--text-muted);
    font-size: 0.68rem;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.2px;
}
.detail-item strong {
    display: block;
    margin-top: 3px;
    overflow-wrap: anywhere;
    color: var(--charcoal-800);
    text-align: center;
    font-size: 0.82rem;
    direction: ltr;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .detail-item strong { color: var(--ivory-200); }
.raw-json {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--ivory-100);
    color: var(--text-primary);
    padding: 12px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-color);
    font: 0.72rem/1.5 monospace;
    max-height: 300px;
    overflow: auto;
}
[data-theme="dark"] .raw-json { background: rgba(232, 228, 214, 0.05); }

/* ============================================================
   التقارير
   ============================================================ */
.report-filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
}
.report-filter-row .form-group { margin-bottom: 0; }
.report-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.report-actions .btn { flex: 1; min-width: 120px; padding: 12px 16px; font-size: 0.84rem; }

.report-results {
    margin-top: 18px;
    max-height: 360px;
    overflow-y: auto;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-small);
    background: var(--bg-card);
    padding: 4px;
}
.report-results table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
}
.report-results table th {
    background: var(--ivory-100);
    color: var(--charcoal-700);
    padding: 11px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--border-strong);
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .report-results table th {
    background: rgba(232, 228, 214, 0.06);
    color: var(--text-secondary);
}
.report-results table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border-color);
    text-align: center;
    color: var(--text-secondary);
    vertical-align: middle;
    font-weight: 500;
}
.report-results table tr:hover td { background: var(--sage-50); }
[data-theme="dark"] .report-results table tr:hover td { background: rgba(107, 142, 127, 0.06); }

.report-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
}
.report-summary-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-small);
    padding: 14px 10px;
    text-align: center;
}
.report-summary-card .label {
    font-size: 0.68rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
}
.report-summary-card .value {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--charcoal-900);
    direction: ltr;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .report-summary-card .value { color: var(--ivory-100); }

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-small);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    box-shadow: var(--shadow-lg);
    min-width: 220px;
    font-size: 0.85rem;
    color: var(--text-primary);
    font-weight: 600;
    max-width: calc(100vw - 32px);
    text-shadow: var(--glow-data);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--moss-500); }
.toast.error { border-color: var(--brick-500); }
.toast.warning { border-color: var(--clay-500); }
.toast.info { border-color: var(--sage-500); }
.toast-icon {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-xs);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    background: var(--sage-100);
    color: var(--sage-700);
    flex-shrink: 0;
}
[data-theme="dark"] .toast-icon { background: var(--sage-800); color: var(--sage-300); }
.toast.success .toast-icon { background: var(--moss-100); color: var(--moss-700); }
.toast.error .toast-icon { background: var(--brick-100); color: var(--brick-700); }
.toast.warning .toast-icon { background: var(--clay-100); color: var(--clay-700); }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-up { animation: fadeUp 0.45s ease forwards; }

@media (min-width: 768px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
    .cards-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .modal { border-radius: var(--radius-card); max-width: 720px; margin-bottom: 5vh; }
    .cashboxes-table { font-size: 0.8rem; }
    .cashboxes-table thead th { font-size: 0.7rem; padding: 14px 12px; }

}

@media (max-width: 480px) {
    .stats-grid { gap: 10px; padding: 14px 12px 4px; }

    .card-method-icon { width: 40px; height: 40px; font-size: 0.95rem; }

}

@media print {

}
