<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة محطات الوقود – سجل المبيعات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <style>
        /* ============================================================
           نظام الألوان الموحّد — مستوحى من debt-reminders.html
           وضع فاتح افتراضي + وضع مظلم مخفف
           إطار فضي رفيع (1px) على جميع البطاقات والحقول
           ============================================================ */
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-glass: rgba(0, 0, 0, 0.025);
            --bg-glass-light: rgba(0, 0, 0, 0.05);
            --text-primary: #1a2233;
            --text-secondary: #44546a;
            --text-muted: #8391a5;
            --border-color: #d8dde4;

            --silver-border-color: #c4cad2;
            --silver-border-color-strong: #a8b0bb;
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

            --gold-primary: #c89a12;
            --gold-dark: #a67c00;
            --gold-light: #f5c842;
            --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

            --emerald-primary: #059669;
            --emerald-dark: #047857;
            --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --purple: #7c3aed;

            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

            --radius-card: 20px;
            --radius-small: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(255, 255, 255, 0.94);
            --nav-bg: rgba(255, 255, 255, 0.96);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;

            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-primary: #1e232b;
            --bg-secondary: #262c36;
            --bg-card: rgba(40, 47, 58, 0.88);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-light: rgba(255, 255, 255, 0.075);
            --text-primary: #d8dee6;
            --text-secondary: #9aa5b4;
            --text-muted: #6a7686;
            --border-color: rgba(200, 205, 212, 0.2);

            --silver-border-color: rgba(192, 197, 204, 0.35);
            --silver-border-color-strong: rgba(192, 197, 204, 0.55);
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --emerald-primary: #10b981;
            --emerald-dark: #059669;
            --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #9b59b6;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

            --header-bg: rgba(30, 35, 43, 0.94);
            --nav-bg: rgba(30, 35, 43, 0.96);
            --sidebar-bg: rgba(38, 44, 54, 0.98);
            --toast-bg: #262c36;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;

            color-scheme: dark;
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0 0 90px 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .pull-indicator {
            position: fixed;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: top 0.2s ease;
            z-index: 50;
            background: var(--bg-secondary);
            border-bottom: var(--silver-border);
            pointer-events: none;
        }
        .pull-indicator.active { top: 0; }
        .pull-indicator i { margin-left: 8px; transition: transform 0.3s; }
        .pull-indicator.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-indicator {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(200, 154, 18, 0.15);
            border-top: 4px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 22px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: var(--silver-border);
            z-index: 100;
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .top-title {
            flex: 1;
            min-width: 120px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            box-shadow: var(--silver-shadow);
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--danger);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }

        /* ============================================================
           البحث
           ============================================================ */
        .search-wrap { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .search-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
        }
        .search-input::placeholder { color: var(--text-muted); text-align: center; }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* ============================================================
           التبويبات العلوية
           ============================================================ */
        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
            justify-content: center;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
        .filter-chip.active {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
            box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            padding: 20px 24px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border: var(--silver-border);
            background: var(--bg-glass-light);
            color: var(--gold-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .stat-value {
            font-size: 1.75rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-top: 6px;
            padding: 3px 12px;
            border-radius: 30px;
            border: var(--silver-border);
        }
        .stat-trend.up { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-trend.down { background: rgba(220, 38, 38, 0.1); color: var(--danger); }

        @media (max-width: 992px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.15rem; }
            .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
        }

        /* ============================================================
           التنبيهات
           ============================================================ */
        .alerts-container { padding: 0 24px 10px; }
        .alert-item {
            padding: 12px 16px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-small);
            margin-bottom: 8px;
            border: var(--silver-border-strong);
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: center;
            box-shadow: var(--silver-shadow);
            transition: var(--transition);
        }
        .alert-item:hover { transform: translateY(-2px); }
        .alert-item.warning { border-color: rgba(217, 119, 6, 0.45); }
        .alert-item.danger { border-color: rgba(220, 38, 38, 0.45); }
        .alert-item.info { border-color: rgba(200, 154, 18, 0.4); }
        .alert-icon {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            border: var(--silver-border);
        }
        .alert-icon.warning { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .alert-icon.danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .alert-icon.info { background: rgba(200, 154, 18, 0.12); color: var(--gold-primary); }
        .alert-content { flex: 1; text-align: center; }
        .alert-title { font-size: 0.82rem; font-weight: 800; color: var(--text-primary); }
        .alert-desc { font-size: 0.72rem; color: var(--text-muted); }
        .alert-time { font-size: 0.68rem; color: var(--text-muted); flex-shrink: 0; font-weight: 600; }

        /* ============================================================
           عنوان القسم
           ============================================================ */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 12px;
            text-align: center;
        }
        .section-header h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header h3 i { color: var(--gold-primary); }
        .section-header .count-badge {
            background: var(--gold-primary);
            color: #ffffff;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 900;
            border: var(--silver-border);
        }

        /* ============================================================
           بطاقات المبيعات
           ============================================================ */
        .cards-container {
            padding: 0 24px 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .sale-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 16px 18px;
            position: relative;
            transition: var(--transition);
            cursor: pointer;
            touch-action: pan-y;
            text-align: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .sale-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px;
            height: 100%;
            background: var(--gold-primary);
            opacity: 0.7;
            transition: var(--transition);
        }
        .sale-card:hover {
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 8px 28px rgba(200, 154, 18, 0.12);
            transform: translateY(-2px);
        }
        .sale-card:hover::before { opacity: 1; width: 6px; }
        .sale-card:active { transform: scale(0.98); transition-duration: 0.05s; }
        .sale-card.selected {
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 0 0 2px rgba(200, 154, 18, 0.2), 0 8px 28px rgba(200, 154, 18, 0.15);
        }

        .sale-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
            text-align: center;
        }
        .sale-card .card-header .sale-code {
            font-size: 0.72rem;
            font-weight: 800;
            font-family: 'Inter', 'Arial', monospace;
            direction: ltr;
            color: var(--danger);
            background: rgba(220, 38, 38, 0.08);
            padding: 3px 10px;
            border-radius: 8px;
            border: var(--silver-border);
        }
        .sale-card .card-header .status-badge {
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            border: var(--silver-border);
        }
        .status-badge.paid { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
        .status-badge.pending { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .status-badge.partial { background: rgba(37, 99, 235, 0.12); color: var(--info); }
        .status-badge.cancelled { background: rgba(220, 38, 38, 0.12); color: var(--danger); }

        .sale-card .card-body {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0;
            text-align: center;
        }
        .sale-card .card-body .field-group {
            text-align: center;
            padding: 6px 4px;
            border: var(--silver-border);
            border-radius: 10px;
            background: var(--bg-glass);
        }
        .sale-card .card-body .field-group .field-label {
            font-size: 0.64rem;
            color: var(--text-muted);
            display: block;
            font-weight: 600;
        }
        .sale-card .card-body .field-group .field-value {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-top: 3px;
            display: block;
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
        }
        .sale-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            text-align: center;
            padding-top: 8px;
            border-top: var(--silver-border);
        }
        .sale-card .card-footer .customer-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .sale-card .card-footer .customer-info i { color: var(--gold-primary); margin-left: 4px; }
        .sale-card .card-footer .sale-date {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'Inter', 'Arial', sans-serif;
            direction: ltr;
            font-weight: 600;
        }

        .sale-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sale-card .card-actions .card-btn {
            flex: 1;
            min-width: 80px;
            padding: 9px 10px;
            border-radius: 10px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sale-card .card-actions .card-btn:active { transform: scale(0.95); }
        .sale-card .card-actions .card-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            background: var(--bg-glass-light);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.4;
            display: block;
            color: var(--gold-primary);
        }
        .empty-state p { font-size: 0.9rem; }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--gold-primary);
            color: #ffffff;
            width: 40px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
            transition: var(--transition);
            border: var(--silver-border);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { background: var(--gold-dark); width: 44px; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 110px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 12px 10px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            border: var(--silver-border);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: var(--silver-border);
            padding: 12px 6px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 72px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.68rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--silver-border-strong);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            text-align: center;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; font-size: 0.72rem; }
        .bottom-nav .nav-item.active { color: var(--gold-primary); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 10px;
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
            text-align: center;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: var(--silver-border);
            padding-bottom: 14px;
            text-align: center;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-title i { color: var(--gold-primary); }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
            font-size: 1rem;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: center;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
            margin-bottom: 14px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            text-align: center;
            box-shadow: var(--silver-shadow);
            font-weight: 600;
        }
        .form-input:focus, .form-select:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
        }
        .form-input::placeholder { color: var(--text-muted); text-align: center; }

        /* === سطر واحد لحقلي التاريخ (من/إلى) دائمًا === */
        .report-date-row {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 10px !important;
            width: 100% !important;
            margin-bottom: 14px;
        }
        .report-date-row .form-group {
            margin-bottom: 0 !important;
            grid-column: auto !important;
            min-width: 0 !important;
        }
        @media (max-width: 380px) {
            .report-date-row { gap: 6px !important; }
            .report-date-row .form-input { font-size: 0.75rem; padding: 9px 6px; }
        }

        /* === فلترة التقرير === */
        .report-filter-row {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 10px !important;
            width: 100% !important;
            margin-bottom: 14px;
        }
        .report-filter-row .form-group {
            margin-bottom: 0 !important;
            min-width: 0 !important;
        }
        @media (max-width: 380px) {
            .report-filter-row { grid-template-columns: 1fr !important; gap: 8px !important; }
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--gold-primary);
            color: white;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            touch-action: manipulation;
            text-align: center;
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ==== نتيجة التقرير: عرض كامل بدون حشوة جانبية ==== */
        .report-result {
            margin-top: 16px;
            max-height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            text-align: center;
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            background: var(--bg-card);
            padding: 0;
            width: 100%;
        }
        .report-result .empty-state { padding: 40px 16px; }

        .report-result table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 4px;
            font-size: 0.78rem;
            text-align: center;
            table-layout: fixed;
        }
        .report-result table th {
            background: var(--bg-glass-light);
            color: var(--gold-primary);
            padding: 10px 6px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 800;
            border: var(--silver-border);
            font-size: 0.68rem;
            border-radius: 8px 8px 0 0;
            word-wrap: break-word;
        }
        .report-result table td {
            padding: 9px 6px;
            border: var(--silver-border);
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-glass);
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .report-result table tr:hover td {
            background: var(--bg-glass-light);
            color: var(--text-primary);
        }

        .report-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin: 8px;
        }
        .report-box {
            padding: 10px 6px;
            text-align: center;
            border-radius: var(--radius-small);
            border: var(--silver-border-strong);
            background: var(--bg-glass);
            box-shadow: var(--silver-shadow);
        }
        .report-box strong {
            display: block;
            font-size: 0.88rem;
            font-weight: 900;
            color: var(--gold-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        .report-box span {
            display: block;
            margin-top: 3px;
            color: var(--text-muted);
            font-size: 0.62rem;
            font-weight: 700;
        }
        @media (max-width: 480px) {
            .report-summary { grid-template-columns: repeat(2, 1fr); }
            .report-result table { font-size: 0.68rem; }
            .report-result table th { font-size: 0.62rem; padding: 8px 4px; }
            .report-result table td { font-size: 0.66rem; padding: 7px 4px; }
        }

        /* ==== شريط أدوات التقرير ==== */
        .report-actions-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .report-actions-row .submit-btn { margin-top: 0; }

        /* ============================================================
           مودال التفاصيل
           ============================================================ */
        .details-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 850;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            overflow-y: auto;
            text-align: center;
        }
        [data-theme="dark"] .details-overlay { background: rgba(0, 0, 0, 0.85); }
        .details-overlay.show { display: block; opacity: 1; }
        .details-content {
            background: var(--bg-secondary);
            min-height: 100vh;
            padding: 24px 20px 100px;
            border: var(--silver-border-strong);
            border-top: none;
            text-align: center;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            padding: 10px 0;
            z-index: 10;
            border-bottom: var(--silver-border);
            text-align: center;
        }
        .details-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
        }
        .details-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .details-close:active { transform: scale(0.9); }
        .details-close:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .details-profile { text-align: center; margin-bottom: 24px; }
        .details-avatar {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            margin: 0 auto 12px;
            border: var(--silver-border);
        }
        .details-name {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-primary);
            text-align: center;
        }
        .details-section {
            background: var(--bg-glass);
            border-radius: var(--radius-small);
            padding: 16px;
            margin-bottom: 16px;
            border: var(--silver-border-strong);
            text-align: center;
            box-shadow: var(--silver-shadow);
        }
        .details-section-title {
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .details-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: var(--silver-border);
            text-align: center;
            gap: 10px;
        }
        .details-row:last-child { border-bottom: none; }
        .details-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
        }
        .details-value {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-primary);
            text-align: left;
        }
        .details-value.code-red {
            color: var(--danger);
            font-family: 'Inter', 'Arial', monospace;
            direction: ltr;
        }
        .details-items-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            font-size: 0.75rem;
            text-align: center;
        }
        .details-items-table th {
            padding: 10px 8px;
            text-align: center;
            background: var(--bg-glass-light);
            color: var(--gold-primary);
            font-weight: 800;
            border: var(--silver-border);
            font-size: 0.7rem;
            border-radius: 10px 10px 0 0;
        }
        .details-items-table td {
            padding: 10px 8px;
            text-align: center;
            border: var(--silver-border);
            color: var(--text-secondary);
            background: var(--bg-glass);
            border-radius: 10px;
            font-weight: 600;
        }

        /* ============================================================
           مودال AI Advisor
           ============================================================ */
        .ai-modal .modal { max-height: 80vh; }
        .ai-content-inner {
            background: var(--bg-glass);
            border-radius: var(--radius-small);
            padding: 16px;
            margin-bottom: 14px;
            border: var(--silver-border-strong);
            text-align: center;
            box-shadow: var(--silver-shadow);
        }
        .ai-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .ai-stat-box {
            background: var(--bg-glass);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: var(--silver-border);
        }
        .ai-stat-box .label {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        .ai-stat-box .value {
            font-weight: 900;
            color: var(--gold-primary);
            font-size: 0.95rem;
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            text-align: center;
            margin-top: 4px;
        }

        /* ============================================================
           التوست
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--silver-border-strong);
            border-radius: 14px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
            min-width: 220px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-primary);
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--emerald-primary); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--gold-primary); }
        .toast-icon {
            width: 28px; height: 28px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
            border: var(--silver-border);
        }
        .toast.success .toast-icon { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
        .toast.error .toast-icon { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .toast.warning .toast-icon { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .toast.info .toast-icon { background: rgba(200, 154, 18, 0.12); color: var(--gold-primary); }

        /* ============================================================
           الرسوم المتحركة
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease forwards; }

        /* ============================================================
           استجابة الشاشات الصغيرة
           ============================================================ */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .sale-card .card-body { grid-template-columns: repeat(3, 1fr); }
            .filter-chips { gap: 6px; }
            .filter-chip { font-size: 0.72rem; padding: 6px 12px; }
            .bottom-nav .nav-item i { font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 0.68rem; }
            .sidebar { width: 100px; padding: 10px 8px; }
            .sidebar-btn { min-height: 66px; font-size: 0.8rem; }
            .sidebar-btn i { font-size: 1.3rem; }
            .top-title h2 { font-size: 1.1rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .modal { padding: 16px; }
            .details-content { padding: 16px 14px 80px; }
            .alerts-container { padding: 0 12px 10px; }
            .section-header { padding: 0 12px 10px; }
            .cards-container { padding: 0 12px 20px; }
            .top-bar { padding: 12px 14px 10px; }
        }
        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .sale-card .card-body { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px 10px; }
            .stat-card { padding: 10px; }
            .stat-value { font-size: 1rem; }
            .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
            .bottom-nav .nav-item i { font-size: 16px; }
            .bottom-nav .nav-item span { font-size: 0.62rem; }
            .modal { padding: 16px; }
            .sale-card .card-body .field-group .field-value { font-size: 0.78rem; }
            .sale-card .card-actions .card-btn { font-size: 0.7rem; padding: 8px 4px; min-width: 60px; }
        }

        /* ============================================================
           الطباعة
           ============================================================ */
