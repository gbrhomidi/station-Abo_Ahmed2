        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 1. دوال الجسر الموحدة
        // ============================================================
        function apiCall(action, params) {
            const p = params || {};
            if (!window.AndroidInterface) {
                return Promise.reject({ success: false, message: 'جسر Android غير متاح' });
            }
            try {
                let raw;
                switch (action) {
                    case 'getSalesTransactions':
                        raw = AndroidInterface.getSalesTransactionRecords(JSON.stringify(p));
                        break;
                    case 'generateSalesTransactionReport':
                        raw = AndroidInterface.generateSalesTransactionReport(JSON.stringify(p));
                        break;
                    case 'getParties':
                        raw = AndroidInterface.getParties(p.type || 'customer');
                        break;
                    case 'getFuelTypes':
                        raw = AndroidInterface.getFuelTypes();
                        break;
                    case 'getPumps':
                        raw = AndroidInterface.getPumps();
                        break;
                    case 'getInvoiceDetails':
                        raw = AndroidInterface.retrieveInvoice(String(p.invoice_number || ''));
                        break;
                    default:
                        return Promise.reject({ success: false, message: 'العملية غير مدعومة: ' + action });
                }
                return Promise.resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
            } catch (e) {
                return Promise.reject({ success: false, message: e.message || 'فشل استدعاء الجسر' });
            }
        }

        // ============================================================
        // 2. دوال مساعدة
        // ============================================================
        let isOnline = navigator.onLine;

        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const banner = document.getElementById('offlineBanner');
            if (!isOnline) { banner.classList.add('show');
                showToast('⚠️ لا يوجد اتصال — البيانات من SQLite المحلي', 'warning'); } else banner.classList.remove('show');
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(15);
                    else if (type === 'error') navigator.vibrate([20, 30, 20]);
                    else if (type === 'light') navigator.vibrate(8);
                }
            } catch (e) { /* تجاهل */ }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;
            if (type === 'success') { iconEl.className = 'fas fa-check';
                hapticFeedback('success'); } else if (type === 'error') { iconEl.className = 'fas fa-times';
                hapticFeedback('error'); } else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle';
                hapticFeedback('light'); } else { iconEl.className = 'fas fa-info-circle';
                hapticFeedback('light'); }
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            else if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
            return parseFloat(num).toLocaleString('en');
        }

        function formatCurrency(num) {
            if (num === null || num === undefined) return '0.00';
            return parseFloat(num).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusLabel(st) {
            const map = { 'paid': 'مدفوع', 'pending': 'معلق', 'partial': 'جزئي', 'cancelled': 'ملغي' };
            return map[st] || st;
        }

        function getStatusClass(st) {
            const map = { 'paid': 'paid', 'pending': 'pending', 'partial': 'partial', 'cancelled': 'cancelled' };
            return map[st] || 'pending';
        }

        function getPaymentMethodLabel(method) {
            const map = { 'cash': 'نقدي', 'credit_card': 'بطاقة ائتمان', 'bank_transfer': 'تحويل بنكي', 'credit': 'آجل',
                'cheque': 'شيك' };
            return map[method] || method;
        }

        // ============================================================
        // 3. الوضع (Theme)
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.getElementById('themeIcon');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('themeIcon');
            icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // ============================================================
        // 4. Pull-to-Refresh
        // ============================================================
        function isInteractiveTouchTarget(target) {
            return Boolean(target && target.closest && target.closest(
                'input, textarea, select, button, a, [contenteditable="true"], .modal-overlay, [role="dialog"]'
            ));
        }

        let pullStartY = 0,
            pullOffset = 0,
            isPulling = false;
        document.addEventListener('touchstart', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            if (scrollTop <= 0) { pullStartY = e.touches[0].clientY;
                isPulling = true; }
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            if (!isPulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - pullStartY;
            if (diff > 20) {
                pullOffset = Math.min(diff, 80);
                const indicator = document.getElementById('pullIndicator');
                indicator.style.top = (pullOffset - 60) + 'px';
                if (pullOffset > 60) {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'حرر للتحديث';
                } else {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'اسحب للتحديث';
                }
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener('touchend', function() {
            if (isPulling && pullOffset > 60) {
                const indicator = document.getElementById('pullIndicator');
                indicator.querySelector('i').className = 'fas fa-spinner fa-spin';
                indicator.querySelector('span').textContent = 'جاري التحديث...';
                setTimeout(() => {
                    loadSales();
                    setTimeout(() => { indicator.style.top = '-60px';
                        isPulling = false;
                        pullOffset = 0; }, 500);
                }, 300);
            } else {
                document.getElementById('pullIndicator').style.top = '-60px';
                isPulling = false;
                pullOffset = 0;
            }
        }, { passive: true });

        // ============================================================
        // 5. تحميل البيانات
        // ============================================================
        let allSales = [];
        let allCustomers = [];
        let allFuelTypes = [];
        let allPumps = [];
        let currentFilter = 'all';
        let isInitialLoad = true;

        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card" style="background:var(--bg-card);border-radius:var(--radius-card);padding:16px;border:var(--silver-border-strong);position:relative;overflow:hidden;box-shadow:var(--silver-shadow);">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="width:80px;height:20px;background:var(--skeleton-bg);border-radius:6px;"></div>
                            <div style="width:50px;height:20px;background:var(--skeleton-bg);border-radius:6px;"></div>
                        </div>
                        <div style="display:flex;gap:10px;margin-bottom:12px;">
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                        </div>
                        <div style="height:12px;background:var(--skeleton-bg);border-radius:4px;margin-bottom:6px;"></div>
                        <div style="height:12px;background:var(--skeleton-bg);border-radius:4px;width:60%;"></div>
                    </div>
                `;
            }
            container.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">${skeleton}</div>`;
        }

        async function loadSales(params = {}) {
            if (isInitialLoad) renderSkeleton();
            showLoading(true);
            try {
                const salesParams = {
                    limit: 500,
                    offset: 0,
                    ...params
                };
                const [salesRes, customersRes, fuelRes, pumpsRes] = await Promise.all([
                    apiCall('getSalesTransactions', salesParams),
                    apiCall('getParties', { type: 'customer' }),
                    apiCall('getFuelTypes', {}),
                    apiCall('getPumps', {})
                ]);
                if (!salesRes.success) throw new Error(salesRes.message || 'فشل جلب سجل المبيعات');
                const salesData = salesRes.data;
                allSales = Array.isArray(salesData)
                    ? salesData
                    : (salesData && Array.isArray(salesData.rows) ? salesData.rows : []);
                allCustomers = customersRes.success && Array.isArray(customersRes.data) ? customersRes.data : [];
                allFuelTypes = fuelRes.success && Array.isArray(fuelRes.data) ? fuelRes.data : [];
                allPumps = pumpsRes.success && Array.isArray(pumpsRes.data) ? pumpsRes.data : [];
            } catch (e) {
                allSales = [];
                allCustomers = [];
                allFuelTypes = [];
                allPumps = [];
                showToast(e.message || 'فشل تحميل سجل المبيعات من SQLite', 'error');
            }
            populateDropdowns();
            renderSalesCards();
            updateStats();
            generateAlerts();
            isInitialLoad = false;
            showLoading(false);
        }

        function populateDropdowns() {
            // لا حاجة لتعبئة قوائم مخصصة في هذه الشاشة (لأنها عرض فقط)
        }

        // ============================================================
        // 6. عرض بطاقات المبيعات (بدون أزرار تعديل/حذف)
        // ============================================================
        function renderSalesCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allSales];

            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(s => {
                    const code = (s.sale_code || '').toLowerCase();
                    const invoice = (s.invoice_number || '').toLowerCase();
                    const customer = (s.customer_name || '').toLowerCase();
                    const phone = (s.customer_phone || '').toLowerCase();
                    return code.includes(searchQuery) || invoice.includes(searchQuery) ||
                        customer.includes(searchQuery) || phone.includes(searchQuery);
                });
            }

            filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            document.getElementById('saleCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <p>لا توجد مبيعات مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((s, idx) => {
                const id = s.id || s.sale_id;
                const code = s.sale_code || '---';
                const customerName = s.customer_name || '—';
                const liters = s.sale_kind === 'fuel' ? parseFloat(s.quantity || 0) : 0;
                const productQty = s.sale_kind === 'product' ? parseFloat(s.quantity || 0) : 0;
                const netAmount = parseFloat(s.amount ?? s.net_amount ?? 0);
                const paymentStatus = s.payment_status || 'paid';
                const statusLabel = getStatusLabel(paymentStatus);
                const statusClass = getStatusClass(paymentStatus);
                const createdAt = s.created_at ? new Date(s.created_at).toLocaleDateString('en-GB') : '---';
                const methodLabel = getPaymentMethodLabel(s.payment_method || 'cash');

                return `
                    <div class="sale-card animate-fade-up" style="animation-delay:${idx*0.04}s" data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <span class="sale-code"><i class="fas fa-hashtag"></i> ${escapeHtml(code)}</span>
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="card-body">
                            <div class="field-group">
                                <span class="field-label">العميل</span>
                                <span class="field-value">${escapeHtml(customerName)}</span>
                            </div>
                            <div class="field-group">
                                <span class="field-label">المبلغ</span>
                                <span class="field-value" style="color:var(--gold-primary);">${formatCurrency(netAmount)}</span>
                            </div>
                            <div class="field-group">
                                <span class="field-label">${liters > 0 ? 'اللترات' : 'الكمية'}</span>
                                <span class="field-value">${liters > 0 ? formatNumber(liters) + ' L' : (productQty > 0 ? formatNumber(productQty) : '---')}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="customer-info"><i class="fas fa-credit-card"></i> ${methodLabel}</span>
                            <span class="sale-date"><i class="fas fa-calendar-alt"></i> ${createdAt}</span>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); viewSale(${id})">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.sale-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hapticFeedback('light');
        }

        // ============================================================
        // 7. الإحصائيات
        // ============================================================
        function updateStats() {
            const totalAmount = allSales.reduce((sum, s) => sum + parseFloat(s.amount ?? s.net_amount ?? 0), 0);
            const totalLiters = allSales.reduce((sum, s) => sum + (s.sale_kind === 'fuel' ? parseFloat(s.quantity || 0) : 0), 0);
            const avg = allSales.length > 0 ? totalAmount / allSales.length : 0;

            document.getElementById('statTotal').textContent = formatCurrency(totalAmount);
            document.getElementById('statLiters').textContent = formatNumber(totalLiters);
            document.getElementById('statAvg').textContent = formatCurrency(avg);
            document.getElementById('statCount').textContent = allSales.length;

            ['trendTotal', 'trendLiters', 'trendAvg', 'trendCount'].forEach(id => { const el = document.getElementById(id);
                if (el) el.textContent = '—'; });
        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'info');
        }

        // ============================================================
        // 8. البحث والفلاتر (مع ربط فعلي بقاعدة البيانات)
        // ============================================================
        function handleSearch(query) { renderSalesCards(); }

        function dateOnly(d){
            return `${d.getFullYear()}-${
                String(d.getMonth()+1).padStart(2,'0')
            }-${
                String(d.getDate()).padStart(2,'0')
            }`;
        }

        async function reloadForFilter(){

            const params = {};

            const today = new Date();

            if(currentFilter === 'today'){

                params.from_date = dateOnly(today);
                params.to_date = dateOnly(today);

            }else if(currentFilter === 'week'){

                const d = new Date(today);
                d.setDate(d.getDate() - 6);

                params.from_date = dateOnly(d);
                params.to_date = dateOnly(today);

            }else if(currentFilter === 'month'){

                const d = new Date(today);
                d.setMonth(d.getMonth() - 1);

                params.from_date = dateOnly(d);
                params.to_date = dateOnly(today);

            }else if(currentFilter === 'fuel'){

                params.sale_type = 'fuel';

            }else if(currentFilter === 'products'){

                params.sale_type = 'product';

            }else if(currentFilter === 'credit'){

                params.payment_method = 'credit';

            }else if(currentFilter === 'cash'){

                params.payment_method = 'cash';
            }

            await loadSales(params);
        }

        function setFilter(filter, btn){

            currentFilter = filter;

            document
                .querySelectorAll('.filter-chip')
                .forEach(c => c.classList.remove('active'));

            if(btn){
                btn.classList.add('active');
            }

            reloadForFilter().catch(e =>
                showToast(
                    e.message ||
                    'فشل تطبيق الفلتر من SQLite',
                    'error'
                )
            );

            hapticFeedback('light');
        }

        // ============================================================
        // 9. القائمة السفلية (تحليل وتقارير)
        // ============================================================
        function switchTab(tab, btn) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (tab === 'analytics') {
                openAIAdvisor();
                hapticFeedback('light');
            } else if (tab === 'reports') {
                openReportModal();
                hapticFeedback('light');
            }
        }

        // ============================================================
        // 10. مودال التقارير
        // ============================================================
        function openReportModal() {
            document.getElementById('reportModal').classList.add('show');
            document.body.style.overflow = 'hidden';
            // تعيين التواريخ الافتراضية
            const today = new Date().toISOString().split('T')[0];
            const monthAgo = new Date();
            monthAgo.setMonth(monthAgo.getMonth() - 1);
            const monthAgoStr = monthAgo.toISOString().split('T')[0];
            document.getElementById('reportFrom').value = monthAgoStr;
            document.getElementById('reportTo').value = today;
            document.getElementById('reportResult').innerHTML =
                `<div class="empty-state"><i class="fas fa-file-alt"></i><p>حدد الفترة ثم اضغط توليد التقرير</p></div>`;
        }

        function closeModal(e, id) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        async function generateReport() {
            const from = document.getElementById('reportFrom').value;
            const to = document.getElementById('reportTo').value;

            if (!from || !to) { showToast('❌ الرجاء تحديد الفترة', 'error'); return; }
            if (from > to) { showToast('❌ تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية', 'error'); return; }

            showLoading(true);
            try {
                const reportRes =
                    await apiCall(
                        'generateSalesTransactionReport',
                        {
                            from_date: from,
                            to_date: to,
                            limit: 1000,
                            offset: 0
                        }
                    );

                if(!reportRes.success){
                    throw new Error(
                        reportRes.message ||
                        'فشل جلب التقرير من SQLite'
                    );
                }

                const reportData =
                    reportRes.data || reportRes;

                const filtered =
                    Array.isArray(reportData.rows)
                        ? reportData.rows
                        : (
                            Array.isArray(reportData)
                                ? reportData
                                : []
                        );

                if (filtered.length === 0) {
                    document.getElementById('reportResult').innerHTML =
                        `<div class="empty-state"><i class="fas fa-file-alt"></i><p>لا توجد مبيعات في الفترة المحددة</p></div>`;
                    showToast('لا توجد بيانات للتقرير', 'warning');
                    showLoading(false);
                    return;
                }

                const total = filtered.reduce((sum, s) => sum + parseFloat(s.net_amount || 0), 0);
                const liters = filtered.reduce((sum, s) => sum + parseFloat(s.liters || 0), 0);
                const avg = total / filtered.length;
                const paid = filtered.filter(s => s.payment_status === 'paid').length;
                const pending = filtered.filter(s => s.payment_status === 'pending' || s.payment_status === 'partial')
                .length;

                let html = `
                    <div class="report-summary">
                        <div class="report-box"><strong>${filtered.length}</strong><span>عدد المعاملات</span></div>
                        <div class="report-box"><strong>${formatCurrency(total)}</strong><span>إجمالي المبيعات</span></div>
                        <div class="report-box"><strong>${formatNumber(liters)}</strong><span>إجمالي اللترات</span></div>
                        <div class="report-box"><strong>${formatCurrency(avg)}</strong><span>متوسط الفاتورة</span></div>
                        <div class="report-box"><strong>${paid}</strong><span>مدفوع</span></div>
                        <div class="report-box"><strong>${pending}</strong><span>معلق/جزئي</span></div>
                    </div>
                    <table>
                        <thead><tr><th>الكود</th><th>العميل</th><th>المبلغ</th><th>اللترات</th><th>طريقة الدفع</th><th>الحالة</th><th>التاريخ</th></tr></thead>
                        <tbody>
                            ${filtered.slice(0, 100).map(s => `
                                <tr>
                                    <td>${escapeHtml(s.sale_code || '---')}</td>
                                    <td>${escapeHtml(s.customer_name || 'عميل عام')}</td>
                                    <td>${formatCurrency(s.net_amount || 0)}</td>
                                    <td>${formatNumber(s.liters || 0)}</td>
                                    <td>${getPaymentMethodLabel(s.payment_method || 'cash')}</td>
                                    <td>${getStatusLabel(s.payment_status || 'paid')}</td>
                                    <td>${s.created_at ? new Date(s.created_at).toLocaleDateString('en-GB') : '---'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${filtered.length > 100 ? `<p style="color:var(--text-muted);font-size:0.7rem;padding:8px;">يعرض أول 100 سجل</p>` : ''}
                `;
                document.getElementById('reportResult').innerHTML = html;
                showToast('✅ تم توليد التقرير بنجاح', 'success');
            } catch (e) {
                showToast('❌ ' + (e.message || 'فشل توليد التقرير'), 'error');
            } finally {
                showLoading(false);
            }
        }

        function exportReport() {
            const from = document.getElementById('reportFrom')?.value || '';
            const to = document.getElementById('reportTo')?.value || '';
            if (!from || !to) { showToast('❌ الرجاء تحديد الفترة قبل التصدير', 'error'); return; }
            if (from > to) { showToast('❌ تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية', 'error'); return; }
            if (!window.AndroidInterface || typeof window.AndroidInterface.exportOperationalCsv !== 'function') {
                showToast('عقد تصدير CSV غير متاح في Android Bridge', 'error');
                return;
            }
            try {
                const result = window.AndroidInterface.exportOperationalCsv(
                    'sales_transactions',
                    JSON.stringify({ from_date: from, to_date: to })
                );
                const parsed = typeof result === 'string' ? JSON.parse(result) : result;
                if (parsed && parsed.success === false) throw new Error(parsed.error || 'فشل بدء التصدير');
                showToast('⏳ جارٍ إنشاء ملف CSV فعلياً عبر Android', 'success');
            } catch (e) {
                showToast(e.message || 'فشل بدء تصدير CSV', 'error');
            }
        }

        window.onOperationalExportResult = function(result) {
            try {
                const value = typeof result === 'string' ? JSON.parse(result) : result;
                if (value && value.success) showToast('✅ تم إنشاء ملف CSV: ' + (value.path || ''), 'success');
                else showToast((value && value.error) || 'فشل إنشاء ملف CSV', 'error');
            } catch (e) {
                showToast('تعذر قراءة نتيجة تصدير CSV', 'error');
            }
        };

        // ============================================================
        // 11. التنبيهات
        // ============================================================
        let currentAlerts = [];

        function generateAlerts() {
            const alerts = [];
            const pending = allSales.filter(s => s.payment_status === 'pending' || s.payment_status === 'partial');
            if (pending.length > 0) {
                alerts.push({
                    type: 'warning',
                    icon: 'fa-clock',
                    title: '⏳ مبيعات غير مدفوعة',
                    desc: pending.length + ' عملية بيع معلقة/جزئية',
                    time: 'الآن'
                });
            }
            const highValue = allSales.filter(s => parseFloat(s.net_amount || 0) > 10000);
            if (highValue.length > 0) {
                alerts.push({
                    type: 'info',
                    icon: 'fa-crown',
                    title: '👑 مبيعات مرتفعة القيمة',
                    desc: highValue.length + ' عملية بيع > 10,000',
                    time: 'الآن'
                });
            }
            currentAlerts = alerts;
            renderAlerts(alerts);
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            if (!container) return;
            if (!alerts || alerts.length === 0) { container.innerHTML = ''; return; }
            container.innerHTML = alerts.slice(0, 2).map((a, i) => `
                <div class="alert-item ${a.type}" style="animation-delay:${i*0.1}s;">
                    <div class="alert-icon ${a.type}"><i class="fas ${a.icon}"></i></div>
                    <div class="alert-content">
                        <div class="alert-title">${a.title}</div>
                        <div class="alert-desc">${a.desc}</div>
                    </div>
                    <div class="alert-time">${a.time}</div>
                </div>
            `).join('');
        }

        function showNotifications() {
            if (currentAlerts.length === 0) { showToast('🔔 لا توجد إشعارات جديدة', 'info'); return; }
            showToast('🔔 لديك ' + currentAlerts.length + ' إشعارات', 'success');
            hapticFeedback('light');
        }

        // ============================================================
        // 12. AI Advisor
        // ============================================================
        function openAIAdvisor() {
            const modal = document.getElementById('aiModal');
            const content = document.getElementById('aiContent');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';

            const totalAmount = allSales.reduce((sum, s) => sum + parseFloat(s.net_amount || 0), 0);
            const totalLiters = allSales.reduce((sum, s) => sum + parseFloat(s.liters || 0), 0);
            const count = allSales.length;
            const avg = count > 0 ? totalAmount / count : 0;

            let topCustomer = '---',
                topAmount = 0;
            const custMap = {};
            allSales.forEach(s => {
                const name = s.customer_name || 'عميل عام';
                custMap[name] = (custMap[name] || 0) + parseFloat(s.net_amount || 0);
            });
            for (const [name, amt] of Object.entries(custMap)) {
                if (amt > topAmount) { topAmount = amt;
                    topCustomer = name; }
            }

            const html = `
                <div class="ai-content-inner">
                    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;">
                        <i class="fas fa-star" style="color:var(--gold-primary);"></i>
                        <span style="font-weight:800;font-size:0.95rem;color:var(--text-primary);">📊 نظرة عامة</span>
                    </div>
                    <div class="ai-stats-grid">
                        <div class="ai-stat-box">
                            <div class="label">إجمالي المبيعات</div>
                            <div class="value">${formatCurrency(totalAmount)}</div>
                        </div>
                        <div class="ai-stat-box">
                            <div class="label">متوسط الفاتورة</div>
                            <div class="value">${formatCurrency(avg)}</div>
                        </div>
                        <div class="ai-stat-box">
                            <div class="label">إجمالي اللترات</div>
                            <div class="value">${formatNumber(totalLiters)} L</div>
                        </div>
                        <div class="ai-stat-box">
                            <div class="label">عدد المعاملات</div>
                            <div class="value">${count}</div>
                        </div>
                    </div>
                </div>
                <div style="background:var(--bg-glass);border-radius:12px;padding:14px;border:var(--silver-border-strong);text-align:center;box-shadow:var(--silver-shadow);">
                    <div style="font-weight:800;font-size:0.85rem;color:var(--gold-primary);">🏆 أفضل عميل</div>
                    <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;">
                        <span style="font-size:0.95rem;font-weight:800;color:var(--text-primary);">${escapeHtml(topCustomer)}</span>
                        <span style="font-weight:900;color:var(--gold-primary);font-size:1rem;direction:ltr;font-family:'Inter','Arial',sans-serif;">${formatCurrency(topAmount)}</span>
                    </div>
                </div>
                ${count === 0 ? '<div style="text-align:center;color:var(--text-muted);padding:20px;">لا توجد بيانات كافية للتحليل</div>' : ''}
            `;
            content.innerHTML = html;
            hapticFeedback('light');
        }

        function closeAIModal(e) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            document.getElementById('aiModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        // ============================================================
        // 13. عرض تفاصيل البيع
        // ============================================================
        function viewSale(id) {
            const sale = allSales.find(s => Number(s.id || s.sale_id) === Number(id));
            if (!sale) { showToast('❌ البيع غير موجود', 'error'); return; }

            const content = document.getElementById('detailsContent');
            const customerName = sale.customer_name || '—';
            const statusLabel = getStatusLabel(sale.payment_status || 'paid');
            const statusClass = getStatusClass(sale.payment_status || 'paid');
            const methodLabel = getPaymentMethodLabel(sale.payment_method || 'cash');

            const items = [{
                type: sale.fuel_type_id ? 'وقود' : 'منتج',
                name: sale.fuel_name || 'منتج',
                qty: sale.liters || sale.quantity || 0,
                price: sale.price_per_liter || sale.unit_price || 0,
                total: parseFloat(sale.net_amount || 0)
            }];

            content.innerHTML = `
                <div class="details-header">
                    <h3 class="details-title">📋 تفاصيل البيع</h3>
                    <button class="details-close" onclick="closeDetails()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <div class="details-profile">
                    <div class="details-avatar">${(customerName).substring(0,2)}</div>
                    <div class="details-name">${escapeHtml(customerName)}</div>
                    <span class="status-badge ${statusClass}" style="font-size:0.75rem;padding:4px 14px;">${statusLabel}</span>
                </div>

                <div class="details-section">
                    <div class="details-section-title"><i class="fas fa-receipt"></i> معلومات الفاتورة</div>
                    <div class="details-row"><span class="details-label">كود البيع</span><span class="details-value code-red">${escapeHtml(sale.sale_code || '---')}</span></div>
                    <div class="details-row"><span class="details-label">رقم الفاتورة</span><span class="details-value">${escapeHtml(sale.invoice_number || '---')}</span></div>
                    <div class="details-row"><span class="details-label">التاريخ</span><span class="details-value">${sale.created_at ? new Date(sale.created_at).toLocaleString('en-GB') : '---'}</span></div>
                    <div class="details-row"><span class="details-label">نوع البيع</span><span class="details-value">${escapeHtml(sale.sale_type || '---')}</span></div>
                    <div class="details-row"><span class="details-label">طريقة الدفع</span><span class="details-value">${methodLabel}</span></div>
                </div>

                <div class="details-section">
                    <div class="details-section-title"><i class="fas fa-list"></i> عناصر الفاتورة</div>
                    <table class="details-items-table">
                        <thead><tr><th>النوع</th><th>الاسم</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                        <tbody>
                            ${items.map(item => `
                                <tr><td>${item.type}</td><td>${escapeHtml(item.name)}</td><td>${formatNumber(item.qty)}</td><td>${formatCurrency(item.price)}</td><td>${formatCurrency(item.total)}</td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>

                <div class="details-section">
                    <div class="details-section-title"><i class="fas fa-calculator"></i> الإجماليات</div>
                    <div class="details-row"><span class="details-label">المجموع الفرعي</span><span class="details-value">${formatCurrency(sale.subtotal || 0)}</span></div>
                    <div class="details-row"><span class="details-label">الخصم</span><span class="details-value" style="color:var(--warning);">${formatCurrency(sale.discount_amount || 0)}</span></div>
                    <div class="details-row"><span class="details-label">الضريبة</span><span class="details-value">${formatCurrency(sale.tax_amount || 0)}</span></div>
                    <div class="details-row"><span class="details-label" style="font-weight:800;font-size:0.9rem;">الصافي</span><span class="details-value" style="font-weight:900;font-size:0.95rem;color:var(--gold-primary);">${formatCurrency(sale.net_amount || 0)}</span></div>
                    <div class="details-row"><span class="details-label">المدفوع</span><span class="details-value" style="color:var(--emerald-primary);">${formatCurrency(sale.paid_amount || 0)}</span></div>
                    <div class="details-row"><span class="details-label">المتبقي</span><span class="details-value" style="color:${parseFloat(sale.remaining_amount || 0) > 0 ? 'var(--danger)' : 'var(--text-muted)'};">${formatCurrency(sale.remaining_amount || 0)}</span></div>
                    ${sale.due_date ? `<div class="details-row"><span class="details-label">تاريخ الاستحقاق</span><span class="details-value">${new Date(sale.due_date).toLocaleDateString('en-GB')}</span></div>` : ''}
                </div>

                ${sale.remarks || sale.notes ? `
                <div class="details-section">
                    <div class="details-section-title"><i class="fas fa-sticky-note"></i> ملاحظات</div>
                    <p style="font-size:0.8rem;color:var(--text-secondary);line-height:1.8;text-align:center;">${escapeHtml(sale.remarks || sale.notes)}</p>
                </div>
                ` : ''}

                <div style="height:30px;"></div>
            `;

            document.getElementById('detailsOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            hapticFeedback('light');
        }

        function closeDetails() {
            document.getElementById('detailsOverlay').classList.remove('show');
            document.body.style.overflow = '';
        }

        // ============================================================
        // 14. القائمة الجانبية
        // ============================================================
        function handleSidebarAction(action) {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('open');
            document.getElementById('sidebarToggle').classList.remove('hidden');

            switch (action) {
                case 'export':
                    exportReport();
                    break;
                case 'pdf':
                    showToast('⚠️ PDF غير متاح في هذه الشاشة؛ استخدم الطباعة', 'warning');
                    break;
                case 'print':
                    printSalesReport();
                    break;
                case 'refresh':
                    loadSales();
                    showToast('🔄 تم التحديث', 'success');
                    break;
                case 'home':
                    window.location.href = '../main.html';
                    break;
                default:
                    showToast('❌ إجراء غير معروف', 'error');
            }
        }

        function printSalesReport() {
            if (!window.AndroidInterface || typeof window.AndroidInterface.printCurrentPage !== 'function') {
                showToast('عقد الطباعة غير متاح في Android Bridge', 'error');
                return;
            }
            try {
                window.AndroidInterface.printCurrentPage();
            } catch (e) {
                showToast(e.message || 'فشل بدء الطباعة', 'error');
            }
        }

        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
                toggle.classList.toggle('hidden');
                hapticFeedback('light');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                    toggle.classList.remove('hidden');
                }
            });
        }

        // ============================================================
        // 15. التهيئة النهائية
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            setupSidebar();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            updateOnlineStatus();
            loadSales();

            document.getElementById('aiModal').addEventListener('click', function(e) {
                if (e.target === this) closeAIModal();
            });
            document.getElementById('detailsOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeDetails();
            });
            document.getElementById('reportModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal(e, 'reportModal');
            });

            // تعيين القائمة السفلية النشطة
            document.querySelectorAll('.bottom-nav .nav-item').forEach((item, index) => {
                item.classList.toggle('active', index === 0);
            });

            setTimeout(() => {
                if (allSales.length > 0) {
                    showToast('📊 سجل المبيعات جاهز - ' + allSales.length + ' عملية', 'info');
                }
            }, 1500);
        });
    </script>

    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
