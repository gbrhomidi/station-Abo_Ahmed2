    <!-- ============================================================ -->
    <!-- JavaScript -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // 1. دوال الجسر الموحدة
        // ============================================================
        function apiCall(action, params) {
            const p = params || {};
            if (!window.AndroidInterface) {
                return Promise.reject({ success: false, message: 'جسر Android غير متاح' });
            }
            try {
                let raw;
                switch (action) {
                    case 'getSalesTransactions':
                        raw = AndroidInterface.getSalesTransactionRecords(JSON.stringify(p));
                        break;
                    case 'generateSalesTransactionReport':
                        raw = AndroidInterface.generateSalesTransactionReport(JSON.stringify(p));
                        break;
                    case 'getParties':
                        raw = AndroidInterface.getParties(p.type || 'customer');
                        break;
                    case 'getFuelTypes':
                        raw = AndroidInterface.getFuelTypes();
                        break;
                    case 'getPumps':
                        raw = AndroidInterface.getPumps();
                        break;
                    case 'getInvoiceDetails':
                        raw = AndroidInterface.retrieveInvoice(String(p.invoice_number || ''));
                        break;
                    default:
                        return Promise.reject({ success: false, message: 'العملية غير مدعومة: ' + action });
                }
                return Promise.resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
            } catch (e) {
                return Promise.reject({ success: false, message: e.message || 'فشل استدعاء الجسر' });
            }
        }

        // ============================================================
        // 1.1 طبقة التكيّف مع عقد الجسر الفعلي
        //     الجسر يعيد: { rows:[...], count, total_count, ..., success:true }
        //     بدون غلاف "data" لـ JSONObject.
        // ============================================================
        function unwrapBridgeResponse(res) {
            if (!res) return { success: false, rows: [], meta: {} };

            // الشكل الفعلي من MainActivity.dataResponse(JSONObject)
            if (Array.isArray(res.rows)) {
                return {
                    success: res.success !== false,
                    rows: res.rows,
                    meta: {
                        count: res.count ?? res.rows.length,
                        total_count: res.total_count ?? res.rows.length,
                        page: res.page ?? 1,
                        page_size: res.page_size ?? res.rows.length,
                        total_pages: res.total_pages ?? 1,
                        has_next: !!res.has_next,
                        has_previous: !!res.has_previous,
                        source: res.source ?? ''
                    }
                };
            }

            // احتياط: غلاف { success, data:{rows} }
            if (res.data && Array.isArray(res.data.rows)) {
                return {
                    success: res.success !== false,
                    rows: res.data.rows,
                    meta: {
                        count: res.data.count ?? res.data.rows.length,
                        total_count: res.data.total_count ?? res.data.rows.length,
                        page: res.data.page ?? 1,
                        page_size: res.data.page_size ?? res.data.rows.length,
                        total_pages: res.data.total_pages ?? 1,
                        has_next: !!res.data.has_next,
                        has_previous: !!res.data.has_previous,
                        source: res.data.source ?? ''
                    }
                };
            }

            // مصفوفة مباشرة
            if (Array.isArray(res)) {
                return {
                    success: true,
                    rows: res,
                    meta: { count: res.length, total_count: res.length }
                };
            }

            return { success: false, rows: [], meta: {} };
        }

        // ============================================================
        // 1.2 مُطبّع السجل الواحد
        //     يملأ الحقول المشتقة التي تتوقعها الواجهة من الأعمدة الفعلية
        //     التي يعيدها DatabaseHelper.getSalesLedgerPage.
        // ============================================================
        function normalizeSaleRow(raw) {
            if (!raw || typeof raw !== 'object') return null;

            const saleKind = raw.sale_kind || (raw.fuel_sale_id ? 'fuel' : 'product');
            const quantity = parseFloat(raw.quantity ?? 0) || 0;
            const amount   = parseFloat(raw.amount ?? 0) || 0;
            const saleDateRaw = raw.sale_date ?? raw.created_at ?? '';
            const saleStatus = raw.sale_status ?? raw.status ?? 'completed';
            const paymentMethod = raw.payment_method ?? 'cash';

            const isCreditSale = (paymentMethod === 'credit');
            const paymentStatus = raw.payment_status
                ?? (isCreditSale ? 'pending' : 'paid');

            return {
                // المعرّفات
                id:             raw.id ?? raw.sale_id,
                sale_id:        raw.sale_id ?? raw.id,
                sale_code:      raw.sale_code || '',
                invoice_number: raw.invoice_number || '',
                fuel_sale_id:   raw.fuel_sale_id ?? null,
                sale_item_id:   raw.sale_item_id ?? null,

                // التصنيف
                sale_kind:      saleKind,
                item_id:        raw.item_id ?? null,
                item_name:      raw.item_name || '',
                item_name_ar:   raw.item_name_ar || '',

                // العميل
                customer_name:  raw.customer_name || '—',
                customer_phone: raw.customer_phone || '',
                customer_party_id: raw.customer_party_id ?? null,

                // الأرقام الموحدة
                quantity:       quantity,
                liters:         saleKind === 'fuel' ? quantity : 0,
                amount:         amount,
                net_amount:     amount,
                gross_amount:   amount,

                // الدفع
                payment_method: paymentMethod,
                payment_status: paymentStatus,
                is_credit:      raw.is_credit ?? (isCreditSale ? 1 : 0),

                // التواريخ
                sale_date:      saleDateRaw,
                created_at:     saleDateRaw,

                // الحالة
                status:         saleStatus,
                sale_status:    saleStatus,

                // نطاق
                station_id:     raw.station_id ?? 0,
                shift_id:       raw.shift_id ?? 0,

                // مرتجع/تالف
                returned_quantity: parseFloat(raw.returned_quantity ?? 0) || 0,
                damaged_quantity:  parseFloat(raw.damaged_quantity ?? 0) || 0
            };
        }

        // ============================================================
        // 2. دوال مساعدة
        // ============================================================
        let isOnline = navigator.onLine;

        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const banner = document.getElementById('offlineBanner');
            if (!isOnline) {
                banner.classList.add('show');
                showToast('⚠️ لا يوجد اتصال — البيانات من SQLite المحلي', 'warning');
            } else {
                banner.classList.remove('show');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(15);
                    else if (type === 'error') navigator.vibrate([20, 30, 20]);
                    else if (type === 'light') navigator.vibrate(8);
                }
            } catch (e) { /* تجاهل */ }
        }

        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;

            if (type === 'success') { iconEl.className = 'fas fa-check'; hapticFeedback('success'); }
            else if (type === 'error') { iconEl.className = 'fas fa-times'; hapticFeedback('error'); }
            else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle'; hapticFeedback('light'); }
            else { iconEl.className = 'fas fa-info-circle'; hapticFeedback('light'); }

            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            else if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
            return parseFloat(num).toLocaleString('en');
        }

        function formatCurrency(num) {
            if (num === null || num === undefined) return '0.00';
            return parseFloat(num).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getStatusLabel(st) {
            const map = { 'paid': 'مدفوع', 'pending': 'معلق', 'partial': 'جزئي', 'cancelled': 'ملغي' };
            return map[st] || st;
        }

        function getStatusClass(st) {
            const map = { 'paid': 'paid', 'pending': 'pending', 'partial': 'partial', 'cancelled': 'cancelled' };
            return map[st] || 'pending';
        }

        function getPaymentMethodLabel(method) {
            const map = {
                'cash': 'نقدي',
                'credit_card': 'بطاقة ائتمان',
                'bank_transfer': 'تحويل بنكي',
                'credit': 'آجل',
                'cheque': 'شيك',
                'mobile_money': 'محفظة إلكترونية',
                'loyalty_points': 'نقاط ولاء'
            };
            return map[method] || method || '—';
        }

        // ============================================================
        // 3. الوضع (Theme)
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const icon = document.getElementById('themeIcon');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('themeIcon');
            icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }

        // ============================================================
        // 4. Pull-to-Refresh
        // ============================================================
        function isInteractiveTouchTarget(target) {
            return Boolean(target && target.closest && target.closest(
                'input, textarea, select, button, a, [contenteditable="true"], .modal-overlay, [role="dialog"]'
            ));
        }

        let pullStartY = 0, pullOffset = 0, isPulling = false;
        document.addEventListener('touchstart', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            if (scrollTop <= 0) {
                pullStartY = e.touches[0].clientY;
                isPulling = true;
            }
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            if (!isPulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - pullStartY;
            if (diff > 20) {
                pullOffset = Math.min(diff, 80);
                const indicator = document.getElementById('pullIndicator');
                indicator.style.top = (pullOffset - 60) + 'px';
                if (pullOffset > 60) {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'حرر للتحديث';
                } else {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'اسحب للتحديث';
                }
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener('touchend', function() {
            if (isPulling && pullOffset > 60) {
                const indicator = document.getElementById('pullIndicator');
                indicator.querySelector('i').className = 'fas fa-spinner fa-spin';
                indicator.querySelector('span').textContent = 'جاري التحديث...';
                setTimeout(() => {
                    loadSales();
                    setTimeout(() => {
                        indicator.style.top = '-60px';
                        isPulling = false;
                        pullOffset = 0;
                    }, 500);
                }, 300);
            } else {
                document.getElementById('pullIndicator').style.top = '-60px';
                isPulling = false;
                pullOffset = 0;
            }
        }, { passive: true });

        // ============================================================
        // 5. تحميل البيانات
        // ============================================================
        let allSales = [];
        let allCustomers = [];
        let allFuelTypes = [];
        let allPumps = [];
        let allProducts = [];      // للفلترة حسب المنتج في التقرير
        let currentFilter = 'all';
        let isInitialLoad = true;
        let lastPageMeta = { count: 0, total_count: 0, page: 1, total_pages: 1 };

        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card" style="background:var(--bg-card);border-radius:var(--radius-card);padding:16px;border:var(--silver-border-strong);position:relative;overflow:hidden;box-shadow:var(--silver-shadow);">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="width:80px;height:20px;background:var(--skeleton-bg);border-radius:6px;"></div>
                            <div style="width:50px;height:20px;background:var(--skeleton-bg);border-radius:6px;"></div>
                        </div>
                        <div style="display:flex;gap:10px;margin-bottom:12px;">
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                            <div style="flex:1;height:45px;background:var(--skeleton-bg);border-radius:8px;"></div>
                        </div>
                        <div style="height:12px;background:var(--skeleton-bg);border-radius:4px;margin-bottom:6px;"></div>
                        <div style="height:12px;background:var(--skeleton-bg);border-radius:4px;width:60%;"></div>
                    </div>
                `;
            }
            container.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px;">${skeleton}</div>`;
        }

        async function loadSales(params = {}) {
            if (isInitialLoad) renderSkeleton();
            showLoading(true);
            try {
                const salesParams = { limit: 500, offset: 0, ...params };

                const [salesRes, customersRes, fuelRes, pumpsRes] = await Promise.all([
                    apiCall('getSalesTransactions', salesParams),
                    apiCall('getParties', { type: 'customer' }),
                    apiCall('getFuelTypes', {}),
                    apiCall('getPumps', {})
                ]);

                const unwrapped = unwrapBridgeResponse(salesRes);
                if (!unwrapped.success) {
                    throw new Error(salesRes?.message || salesRes?.error || 'فشل جلب سجل المبيعات');
                }

                allSales = unwrapped.rows.map(normalizeSaleRow).filter(Boolean);
                lastPageMeta = unwrapped.meta;

                // استقبال بقية الجسور بأي شكل من الأشكال المدعومة
                allCustomers = Array.isArray(customersRes) ? customersRes
                            : (customersRes?.data && Array.isArray(customersRes.data) ? customersRes.data : []);
                allFuelTypes = Array.isArray(fuelRes) ? fuelRes
                            : (fuelRes?.data && Array.isArray(fuelRes.data) ? fuelRes.data : []);
                allPumps = Array.isArray(pumpsRes) ? pumpsRes
                            : (pumpsRes?.data && Array.isArray(pumpsRes.data) ? pumpsRes.data : []);

                // استخراج المنتجات الفريدة من سجلات المبيعات للاستخدام في الفلترة
                const productsMap = new Map();
                allSales.forEach(s => {
                    if (s.sale_kind === 'product' && s.item_id && s.item_name) {
                        if (!productsMap.has(s.item_id)) {
                            productsMap.set(s.item_id, {
                                item_id: s.item_id,
                                item_name: s.item_name,
                                item_name_ar: s.item_name_ar
                            });
                        }
                    }
                });
                allProducts = Array.from(productsMap.values());

            } catch (e) {
                allSales = [];
                allCustomers = [];
                allFuelTypes = [];
                allPumps = [];
                allProducts = [];
                showToast(e.message || 'فشل تحميل سجل المبيعات من SQLite', 'error');
            }
            populateDropdowns();
            renderSalesCards();
            updateStats();
            generateAlerts();
            isInitialLoad = false;
            showLoading(false);
        }

        function populateDropdowns() {
            // لا حاجة لتعبئة قوائم في هذه الشاشة (عرض فقط)
        }

        // ============================================================
        // 6. عرض بطاقات المبيعات
        // ============================================================
        function renderSalesCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allSales];

            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(s => {
                    const code     = (s.sale_code || '').toLowerCase();
                    const invoice  = (s.invoice_number || '').toLowerCase();
                    const customer = (s.customer_name || '').toLowerCase();
                    const phone    = (s.customer_phone || '').toLowerCase();
                    return code.includes(searchQuery)
                        || invoice.includes(searchQuery)
                        || customer.includes(searchQuery)
                        || phone.includes(searchQuery);
                });
            }

            filtered.sort((a, b) => {
                const da = a.created_at ? new Date(a.created_at).getTime() : 0;
                const db = b.created_at ? new Date(b.created_at).getTime() : 0;
                return db - da;
            });

            document.getElementById('saleCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <p>لا توجد مبيعات مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((s, idx) => {
                const id           = s.id || s.sale_id;
                const code         = s.sale_code || '---';
                const customerName = s.customer_name || '—';
                const liters       = s.liters;
                const productQty   = s.sale_kind === 'product' ? s.quantity : 0;
                const netAmount    = s.net_amount;
                const paymentStatus = s.payment_status;
                const statusLabel  = getStatusLabel(paymentStatus);
                const statusClass  = getStatusClass(paymentStatus);
                const createdAt    = s.created_at
                    ? new Date(s.created_at).toLocaleDateString('en-GB')
                    : '---';
                const methodLabel  = getPaymentMethodLabel(s.payment_method || 'cash');

                return `
                    <div class="sale-card animate-fade-up" style="animation-delay:${idx*0.04}s"
                         data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <span class="sale-code"><i class="fas fa-hashtag"></i> ${escapeHtml(code)}</span>
                            <span class="status-badge ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="card-body">
                            <div class="field-group">
                                <span class="field-label">العميل</span>
                                <span class="field-value">${escapeHtml(customerName)}</span>
                            </div>
                            <div class="field-group">
                                <span class="field-label">المبلغ</span>
                                <span class="field-value" style="color:var(--gold-primary);">${formatCurrency(netAmount)}</span>
                            </div>
                            <div class="field-group">
                                <span class="field-label">${liters > 0 ? 'اللترات' : 'الكمية'}</span>
                                <span class="field-value">${liters > 0
                                    ? formatNumber(liters) + ' L'
                                    : (productQty > 0 ? formatNumber(productQty) : '---')}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span class="customer-info"><i class="fas fa-credit-card"></i> ${methodLabel}</span>
                            <span class="sale-date"><i class="fas fa-calendar-alt"></i> ${createdAt}</span>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); viewSale(${id})">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.sale-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hapticFeedback('light');
        }

        // ============================================================
        // 7. الإحصائيات
        // ============================================================
        function updateStats() {
            const totalAmount = allSales.reduce(
                (sum, s) => sum + (parseFloat(s.net_amount ?? s.amount ?? 0) || 0), 0
            );
            const totalLiters = allSales.reduce(
                (sum, s) => sum + (s.sale_kind === 'fuel' ? (parseFloat(s.liters) || 0) : 0), 0
            );
            const avg = allSales.length > 0 ? totalAmount / allSales.length : 0;

            document.getElementById('statTotal').textContent = formatCurrency(totalAmount);
            document.getElementById('statLiters').textContent = formatNumber(totalLiters);
            document.getElementById('statAvg').textContent   = formatCurrency(avg);
            document.getElementById('statCount').textContent = allSales.length;

            ['trendTotal','trendLiters','trendAvg','trendCount'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = '—';
            });
        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'info');
        }

        // ============================================================
        // 8. البحث والفلاتر
        // ============================================================
        function handleSearch(query) { renderSalesCards(); }

        function dateOnly(d){
            return `${d.getFullYear()}-${
                String(d.getMonth()+1).padStart(2,'0')
            }-${
                String(d.getDate()).padStart(2,'0')
            }`;
        }

        async function reloadForFilter(){
            const params = {};
            const today = new Date();

            if (currentFilter === 'today') {
                params.from_date = dateOnly(today);
                params.to_date   = dateOnly(today);
            } else if (currentFilter === 'week') {
                const d = new Date(today);
                d.setDate(d.getDate() - 6);
                params.from_date = dateOnly(d);
                params.to_date   = dateOnly(today);
            } else if (currentFilter === 'month') {
                const d = new Date(today);
                d.setMonth(d.getMonth() - 1);
                params.from_date = dateOnly(d);
                params.to_date   = dateOnly(today);
            } else if (currentFilter === 'fuel') {
                params.sale_type = 'fuel';
            } else if (currentFilter === 'products') {
                params.sale_type = 'product';
            } else if (currentFilter === 'credit') {
                params.payment_method = 'credit';
            } else if (currentFilter === 'cash') {
                params.payment_method = 'cash';
            }

            await loadSales(params);
        }

        function setFilter(filter, btn){
            currentFilter = filter;

            document.querySelectorAll('.filter-chip')
                .forEach(c => c.classList.remove('active'));

            if (btn) btn.classList.add('active');

            reloadForFilter().catch(e =>
                showToast(e.message || 'فشل تطبيق الفلتر من SQLite', 'error')
            );

            hapticFeedback('light');
        }

        // ============================================================
        // 9. القائمة السفلية (تحليل وتقارير)
        // ============================================================
        function switchTab(tab, btn) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (tab === 'analytics') {
                openAIAdvisor();
                hapticFeedback('light');
            } else if (tab === 'reports') {
                openReportModal();
                hapticFeedback('light');
            }

        // ============================================================
        // 10. مودال التقارير
        // ============================================================
        function openReportModal() {
            document.getElementById('reportModal').classList.add('show');
            document.body.style.overflow = 'hidden';

            const today = new Date().toISOString().split('T')[0];
            const monthAgo = new Date();
            monthAgo.setMonth(monthAgo.getMonth() - 1);
            const monthAgoStr = monthAgo.toISOString().split('T')[0];

            document.getElementById('reportFrom').value = monthAgoStr;

            // إعادة تعيين فلتر التقرير
            document.getElementById('reportFilterType').value = '';

            filterValue.innerHTML = '<option value="">— اختر نوع الفلترة أولاً —</option>';
            filterValue.disabled = true;

            document.getElementById('reportResult').innerHTML =
                `<div class="empty-state"><i class="fas fa-file-alt"></i><p>حدد الفترة ثم اضغط توليد التقرير</p></div>`;
        }

        function closeModal(e, id) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            const modal = document.getElementById(id);
            if (modal) modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        // ============================================================
        // 10.1 فلترة التقرير
        // ============================================================
        function onReportFilterTypeChange() {
            const type = document.getElementById('reportFilterType').value;
            const filterValue = document.getElementById('reportFilterValue');

            if (!type) {
                filterValue.innerHTML = '<option value="">— اختر نوع الفلترة أولاً —</option>';
                filterValue.disabled = true;
                return;
            }

            filterValue.disabled = false;
            filterValue.innerHTML = '<option value="">— جارٍ التحميل... —</option>';

            const options = [];

            if (type === 'customer') {
                const seen = new Set();
                allSales.forEach(s => {
                    const name = s.customer_name;
                    const pid  = s.customer_party_id;
                    if (name && name !== '—' && pid && !seen.has(pid)) {
                        seen.add(pid);
                        options.push({ value: String(pid), label: name });
                    }
                });
                // إذا كانت القائمة فارغة من المبيعات، نستعمل قائمة العملاء الكاملة
                if (options.length === 0 && Array.isArray(allCustomers)) {
                    allCustomers.forEach(c => {
                        const pid = c.party_id ?? c.id;
                        const name = c.commercial_name_ar || c.commercial_name || c.legal_name || '';
                        if (pid && name) options.push({ value: String(pid), label: name });
                    });
                }
            } else if (type === 'product') {
                const seen = new Set();
                allSales.forEach(s => {
                    if (s.sale_kind === 'product' && s.item_id) {
                        const key = String(s.item_id);
                        if (!seen.has(key)) {
                            seen.add(key);
                            const label = s.item_name_ar || s.item_name || ('منتج #' + s.item_id);
                            options.push({ value: key, label });
                        }
                    }
                });
            } else if (type === 'fuel') {
                // نستعمل أنواع الوقود من الجسر إن وُجدت، وإلا من المبيعات
                if (Array.isArray(allFuelTypes) && allFuelTypes.length > 0) {
                    allFuelTypes.forEach(f => {
                        const id = f.fuel_type_id ?? f.id;
                        const label = f.fuel_name_ar || f.fuel_name || ('وقود #' + id);
                        if (id) options.push({ value: String(id), label });
                    });
                } else {
                    const seen = new Set();
                    allSales.forEach(s => {
                        if (s.sale_kind === 'fuel' && s.item_id) {
                            const key = String(s.item_id);
                            if (!seen.has(key)) {
                                seen.add(key);
                                options.push({
                                    value: key,
                                    label: s.item_name_ar || s.item_name || ('وقود #' + s.item_id)
                                });
                            }
                        }
                    });
                }
            } else if (type === 'payment') {
                const methods = [
                    { value: 'cash',          label: 'نقدي' },
                    { value: 'credit',        label: 'آجل' },
                    { value: 'bank_transfer', label: 'تحويل بنكي' },
                    { value: 'credit_card',   label: 'بطاقة ائتمان' },
                    { value: 'cheque',        label: 'شيك' },
                    { value: 'mobile_money',  label: 'محفظة إلكترونية' },
                    { value: 'loyalty_points',label: 'نقاط ولاء' }
                ];
                methods.forEach(m => options.push(m));
            }

            if (options.length === 0) {
                filterValue.innerHTML = '<option value="">— لا توجد قيم متاحة —</option>';
                filterValue.disabled = true;
                return;
            }

            filterValue.innerHTML = '<option value="">— اختر قيمة —</option>' +
                options.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('');
        }

        // ============================================================
        // 10.2 توليد التقرير
        // ============================================================
        let lastReportData = null;   // للاستخدام في تصدير CSV

        function passesReportFilter(sale) {
            const type  = document.getElementById('reportFilterType').value;
            const value = document.getElementById('reportFilterValue').value;
            if (!type || !value) return true;

            if (type === 'customer') {
                return String(sale.customer_party_id || '') === String(value);
            } else if (type === 'product') {
                return sale.sale_kind === 'product'
                    && String(sale.item_id || '') === String(value);
            } else if (type === 'fuel') {
                return sale.sale_kind === 'fuel'
                    && String(sale.item_id || '') === String(value);
            } else if (type === 'payment') {
                return String(sale.payment_method || '') === String(value);
            }
            return true;
        }

        async function generateReport() {
            const from = document.getElementById('reportFrom').value;
            const to   = document.getElementById('reportTo').value;

            if (!from || !to) { showToast('❌ الرجاء تحديد الفترة', 'error'); return; }
            if (from > to)    { showToast('❌ تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية', 'error'); return; }

            const generateBtn = document.getElementById('btnGenerateReport');
            generateBtn.disabled = true;

            showLoading(true);
            try {
                const reportRes = await apiCall('generateSalesTransactionReport', {
                    from_date: from,
                    to_date: to,
                    limit: 5000,
                    offset: 0
                });

                const unwrapped = unwrapBridgeResponse(reportRes);
                if (!unwrapped.success) {
                    throw new Error(reportRes?.message || reportRes?.error || 'فشل جلب التقرير من SQLite');
                }

                let filtered = unwrapped.rows.map(normalizeSaleRow).filter(Boolean);
                filtered = filtered.filter(passesReportFilter);

                if (filtered.length === 0) {
                    document.getElementById('reportResult').innerHTML =
                        `<div class="empty-state"><i class="fas fa-file-alt"></i><p>لا توجد مبيعات في الفترة المحددة${hasActiveReportFilter() ? ' بعد تطبيق الفلترة' : ''}</p></div>`;
                    showToast('لا توجد بيانات للتقرير', 'warning');
                    lastReportData = null;
                    return;
                }

                // تخزين للاستخدام في تصدير CSV
                lastReportData = {
                    rows: filtered,
                    from: from,
                    to: to,
                    filterType: document.getElementById('reportFilterType').value || '',
                    filterValue: document.getElementById('reportFilterValue').value || ''
                };

                const total  = filtered.reduce((sum, s) => sum + s.net_amount, 0);
                const liters = filtered.reduce((sum, s) => sum + s.liters, 0);
                const avg    = total / filtered.length;
                const paid    = filtered.filter(s => s.payment_status === 'paid').length;
                const pending = filtered.filter(s =>
                    s.payment_status === 'pending' || s.payment_status === 'partial'
                ).length;

                const filterLabel = buildFilterLabel();

                let html = `
                    ${filterLabel ? `<div style="margin:8px;padding:8px 12px;border-radius:10px;background:var(--bg-glass);border:var(--silver-border);font-size:0.75rem;font-weight:700;color:var(--text-secondary);">
                        <i class="fas fa-filter" style="color:var(--gold-primary);"></i> ${filterLabel}
                    </div>` : ''}
                    <div class="report-summary">
                        <div class="report-box"><strong>${filtered.length}</strong><span>عدد المعاملات</span></div>
                        <div class="report-box"><strong>${formatCurrency(total)}</strong><span>إجمالي المبيعات</span></div>
                        <div class="report-box"><strong>${formatNumber(liters)}</strong><span>إجمالي اللترات</span></div>
                        <div class="report-box"><strong>${formatCurrency(avg)}</strong><span>متوسط الفاتورة</span></div>
                        <div class="report-box"><strong>${paid}</strong><span>مدفوع</span></div>
                        <div class="report-box"><strong>${pending}</strong><span>معلق/جزئي</span></div>
                    </div>
                    <table>
                        <thead><tr>
                            <th style="width:14%;">الكود</th>
                            <th style="width:16%;">العميل</th>
                            <th style="width:12%;">المبلغ</th>
                            <th style="width:10%;">اللترات</th>
                            <th style="width:14%;">طريقة الدفع</th>
                            <th style="width:12%;">الحالة</th>
                            <th style="width:12%;">التاريخ</th>
                        </tr></thead>
                        <tbody>
                            ${filtered.map(s => `
                                <tr>
                                    <td>${escapeHtml(s.sale_code || '---')}</td>
                                    <td>${escapeHtml(s.customer_name || 'عميل عام')}</td>
                                    <td>${formatCurrency(s.net_amount)}</td>
                                    <td>${formatNumber(s.liters)}</td>
                                    <td>${getPaymentMethodLabel(s.payment_method || 'cash')}</td>
                                    <td>${getStatusLabel(s.payment_status || 'paid')}</td>
                                    <td>${s.created_at
                                        ? new Date(s.created_at).toLocaleDateString('en-GB')
                                        : '---'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('reportResult').innerHTML = html;
                showToast('✅ تم توليد التقرير بنجاح', 'success');
            } catch (e) {
                showToast('❌ ' + (e.message || 'فشل توليد التقرير'), 'error');
                lastReportData = null;
            } finally {
                generateBtn.disabled = false;
                showLoading(false);
            }
        }

        function hasActiveReportFilter() {
            const type  = document.getElementById('reportFilterType').value;
            const value = document.getElementById('reportFilterValue').value;
            return !!(type && value);
        }

        function buildFilterLabel() {
            const type  = document.getElementById('reportFilterType').value;
            const value = document.getElementById('reportFilterValue').value;
            if (!type || !value) return '';

            const select = document.getElementById('reportFilterValue');
            const label = select.options[select.selectedIndex]?.text || value;

            const typeLabels = {
                'customer': 'حسب العميل',
                'product':  'حسب المنتج',
                'fuel':     'حسب الوقود',
                'payment':  'حسب طريقة الدفع'
            };

            return (typeLabels[type] || type) + ': ' + label;
        }

        // ============================================================
        // 10.3 تصدير CSV — فعلي وحقيقي
        // ============================================================
        function csvEscape(value) {
            if (value === null || value === undefined) return '';
            const str = String(value);
            // تصحيح إلزامي: تضاعف علامات التنصيص الداخلية، ويحيط الحقل بعلامتي تنصيص
            return '"' + str.replace(/"/g, '""') + '"';
        }

        function buildReportCsv(rows, from, to, filterLabel) {
            const BOM = '\uFEFF';  // لضمان فتح Excel بترميز UTF-8 دون مشاكل
            const headers = [
                'كود البيع',
                'رقم الفاتورة',
                'التاريخ',
                'العميل',
                'النوع',
                'اسم الصنف',
                'الكمية',
                'اللترات',
                'المبلغ الصافي',
                'طريقة الدفع',
                'حالة الدفع',
                'المرتجع',
                'التالف'
            ];
            const lines = [];
            lines.push(headers.map(csvEscape).join(','));

            rows.forEach(s => {
                const typeLabel = s.sale_kind === 'fuel' ? 'وقود' : 'منتج';
                const dateStr = s.created_at
                    ? new Date(s.created_at).toLocaleString('en-GB')
                    : '';
                lines.push([
                    s.sale_code || '',
                    s.invoice_number || '',
                    dateStr,
                    s.customer_name || 'عميل عام',
                    typeLabel,
                    s.item_name_ar || s.item_name || '',
                    s.quantity ?? 0,
                    s.liters ?? 0,
                    s.net_amount ?? 0,
                    getPaymentMethodLabel(s.payment_method || 'cash'),
                    getStatusLabel(s.payment_status || 'paid'),
                    s.returned_quantity ?? 0,
                    s.damaged_quantity ?? 0
                ].map(csvEscape).join(','));
            });

            // سطر تعليق سفلي بالمعلومات الوصفية
            lines.push('');
            lines.push(csvEscape('الفترة:') + ',' + csvEscape(from + ' → ' + to));
            if (filterLabel) lines.push(csvEscape('الفلترة:') + ',' + csvEscape(filterLabel));
            lines.push(csvEscape('عدد السجلات:') + ',' + csvEscape(String(rows.length)));
            lines.push(csvEscape('تاريخ الإنشاء:') + ',' + csvEscape(new Date().toLocaleString('en-GB')));

            return BOM + lines.join('\r\n');
        }

        function downloadCsvViaBlob(csvContent, fileName) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', fileName);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        function exportReportCsv() {
            // 1. لا يُسمح بالتصدير قبل توليد تقرير فعلي
            if (!lastReportData || !Array.isArray(lastReportData.rows) || lastReportData.rows.length === 0) {
                showToast('❌ لا توجد بيانات للتصدير؛ قم بتوليد التقرير أولاً', 'error');
                return;
            }

            const { rows, from, to } = lastReportData;
            const filterLabel = buildFilterLabel();
            const csvContent = buildReportCsv(rows, from, to, filterLabel);
            const stamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `sales-report_${from}_${to}_${stamp}.csv`;

            // 2. محاولة تصدير عبر AndroidInterface (يضمن ظهور الملف في مجلد التطبيق + إمكانية المشاركة)
            if (window.AndroidInterface && typeof AndroidInterface.exportOperationalCsv === 'function') {
                try {
                    const result = AndroidInterface.exportOperationalCsv(
                        'sales_transactions',
                        JSON.stringify({
                            from_date: from,
                            to_date: to,
                            filter_type: lastReportData.filterType || '',
                            filter_value: lastReportData.filterValue || ''
                        })
                    );
                    const parsed = typeof result === 'string' ? JSON.parse(result) : result;

                    if (parsed && parsed.success === true && parsed.status === 'processing') {
                        showToast('⏳ جارٍ إنشاء ملف CSV فعلياً...', 'info');
                        return;
                    }
                    if (parsed && parsed.success === false) {
                        // إذا فشل الجسر، نرجع إلى التنزيل عبر المتصفح
                        console.warn('Android CSV export failed:', parsed.error);
                    }
                } catch (e) {
                    console.warn('AndroidInterface.exportOperationalCsv threw:', e);
                }
            }

            // 3. تنزيل المتصفح (يعمل داخل WebView عبر Blob)
            try {
                downloadCsvViaBlob(csvContent, fileName);
                showToast('✅ تم تنزيل ملف CSV بنجاح', 'success');
            } catch (e) {
                console.error('Blob download failed:', e);
                showToast('❌ فشل تصدير CSV: ' + e.message, 'error');
            }
        }

        // مستقبِل نتيجة التصدير من Android
        window.onOperationalExportResult = function(result) {
            try {
                const value = typeof result === 'string' ? JSON.parse(result) : result;
                if (value && value.success) {
                    showToast('✅ تم إنشاء ملف CSV: ' + (value.path || ''), 'success');
                } else {
                    // فشل جسر — نرجع للتنزيل عبر المتصفح
                    if (lastReportData) {
                        const { rows, from, to } = lastReportData;
                        const filterLabel = buildFilterLabel();
                        const csvContent = buildReportCsv(rows, from, to, filterLabel);
                        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
                        downloadCsvViaBlob(csvContent, `sales-report_${from}_${to}_${stamp}.csv`);
                        showToast('تم تنزيل CSV عبر المتصفح بدلاً من الجسر', 'success');
                    } else {
                        showToast((value && value.error) || 'فشل إنشاء ملف CSV', 'error');

\n<script id="sales-log-final-fix">\n(function(){\n  'use strict';\n\n  // ------------------------------------------------------------\n  // Helpers aligned with DatabaseHelper.getSalesLedgerPage()\n  // ------------------------------------------------------------\n  function finalReportParams(from, to){\n    const type=(document.getElementById('reportFilterType')?.value||'').trim();\n    const value=(document.getElementById('reportFilterValue')?.value||'').trim();\n    const p={from_date:from,to_date:to,limit:500,offset:0};\n    if(type==='customer' && value) p.customer_id=Number(value);\n    else if(type==='product' && value){ p.product_id=Number(value); p.sale_type='product'; }\n    else if(type==='fuel' && value){ p.product_id=Number(value); p.sale_type='fuel'; }\n    else if(type==='payment' && value) p.payment_method=value;\n    return p;\n  }\n\n  function reportFilterActive(){\n    const t=document.getElementById('reportFilterType')?.value||'';\n    const v=document.getElementById('reportFilterValue')?.value||'';\n    return !!(t&&v);\n  }\n\n  // ------------------------------------------------------------\n  // Load ALL report pages because DatabaseHelper caps each page at 500.\n  // ------------------------------------------------------------\n  async function loadCompleteReportRows(from,to){\n    const base=finalReportParams(from,to);\n    const pageSize=500;\n    const rows=[];\n    let offset=0;\n    let expectedTotal=null;\n    const maxPages=1000;\n\n    for(let page=0; page<maxPages; page++){\n      const params=Object.assign({},base,{limit:pageSize,offset});\n      const res=await apiCall('generateSalesTransactionReport',params);\n      const unwrapped=unwrapBridgeResponse(res);\n      if(!unwrapped || !unwrapped.success){\n        throw new Error(res?.message || res?.error || 'فشل جلب بيانات التقرير من SQLite');\n      }\n      const pageRows=Array.isArray(unwrapped.rows) ? unwrapped.rows : [];\n      if(expectedTotal===null && unwrapped.meta) {\n        expectedTotal=Number(unwrapped.meta.total ?? unwrapped.meta.total_count ?? unwrapped.meta.count);\n        if(!Number.isFinite(expectedTotal)) expectedTotal=null;\n      }\n      rows.push(...pageRows.map(normalizeSaleRow).filter(Boolean));\n      offset += pageRows.length;\n      if(pageRows.length===0) break;\n      if(expectedTotal!==null && rows.length>=expectedTotal) break;\n      if(pageRows.length<pageSize) break;\n    }\n    return rows;\n  }\n\n  // ------------------------------------------------------------\n  // Filter lists: customer list comes from getParties; products/fuel\n  // come from SQLite-backed sales/fuel data already loaded by the screen.\n  // ------------------------------------------------------------\n  window.onReportFilterTypeChange = async function(){\n    const type=document.getElementById('reportFilterType');\n    const value=document.getElementById('reportFilterValue');\n    if(!type || !value) return;\n    const selected=type.value;\n    value.disabled=true;\n    value.innerHTML='<option value="">— جارٍ تحميل القيم... —</option>';\n    if(!selected){ value.innerHTML='<option value="">— اختر نوع الفلترة أولاً —</option>'; return; }\n\n    try{\n      const options=[]; const seen=new Set();\n      if(selected==='customer'){\n        let customers=Array.isArray(allCustomers)?allCustomers:[];\n        if(customers.length===0){\n          const r=await apiCall('getParties',{type:'customer'});\n          customers=Array.isArray(r)?r:(Array.isArray(r?.data)?r.data:[]);\n        }\n        customers.forEach(c=>{\n          const id=c.party_id ?? c.id;\n          const name=c.commercial_name_ar || c.commercial_name || c.legal_name || c.name || '';\n          if(id && name && !seen.has(String(id))){ seen.add(String(id)); options.push({value:String(id),label:String(name)}); }\n        });\n      }else if(selected==='product'){\n        (Array.isArray(allProducts)?allProducts:[]).forEach(x=>{\n          const id=x.item_id ?? x.product_id ?? x.id;\n          const name=x.item_name_ar || x.item_name || x.product_name_ar || x.product_name || '';\n          if(id && name && !seen.has(String(id))){ seen.add(String(id)); options.push({value:String(id),label:String(name)}); }\n        });\n      }else if(selected==='fuel'){\n        (Array.isArray(allFuelTypes)?allFuelTypes:[]).forEach(x=>{\n          const id=x.fuel_type_id ?? x.id;\n          const name=x.fuel_name_ar || x.fuel_name || x.name || '';\n          if(id && name && !seen.has(String(id))){ seen.add(String(id)); options.push({value:String(id),label:String(name)}); }\n        });\n      }else if(selected==='payment'){\n        [\n          ['cash','نقدي'],['credit','آجل'],['bank_transfer','تحويل بنكي'],\n          ['credit_card','بطاقة ائتمان'],['cheque','شيك'],\n          ['mobile_money','محفظة إلكترونية'],['loyalty_points','نقاط ولاء']\n        ].forEach(([v,l])=>options.push({value:v,label:l}));\n      }\n      value.innerHTML='<option value="">— اختر قيمة —</option>'+options.map(o=>'<option value="'+escapeHtml(o.value)+'">'+escapeHtml(o.label)+'</option>').join('');\n      value.disabled=options.length===0;\n      if(!options.length) value.innerHTML='<option value="">— لا توجد قيم متاحة —</option>';\n    }catch(e){\n      value.innerHTML='<option value="">— تعذر تحميل القيم —</option>';\n      value.disabled=true;\n      showToast('❌ تعذر تحميل قيم الفلترة: '+(e.message||''),'error');\n    }\n  };\n\n  // ------------------------------------------------------------\n  // Complete report generation. Filtering is passed to SQLite, not only\n  // applied visually in JavaScript.\n  // ------------------------------------------------------------\n  window.generateReport = async function(){\n    const from=document.getElementById('reportFrom')?.value||'';\n    const to=document.getElementById('reportTo')?.value||'';\n    if(!from||!to){ showToast('❌ الرجاء تحديد الفترة','error'); return; }\n    if(from>to){ showToast('❌ تاريخ البداية لا يمكن أن يكون بعد تاريخ النهاية','error'); return; }\n\n    const btn=document.getElementById('btnGenerateReport');\n    if(btn) btn.disabled=true;\n    showLoading(true);\n    try{\n      const rows=await loadCompleteReportRows(from,to);\n      if(!rows.length){\n        lastReportData=null;\n        document.getElementById('reportResult').innerHTML='<div class="empty-state"><i class="fas fa-file-alt"></i><p>لا توجد مبيعات في الفترة المحددة'+(reportFilterActive()?' بعد تطبيق الفلترة':'')+'</p></div>';\n        showToast('لا توجد بيانات للتقرير','warning');\n        return;\n      }\n\n      const filterType=document.getElementById('reportFilterType')?.value||'';\n      const filterValue=document.getElementById('reportFilterValue')?.value||'';\n      lastReportData={rows,from,to,filterType,filterValue};\n\n      const total=rows.reduce((sum,s)=>sum+(Number(s.net_amount ?? s.amount ?? 0)||0),0);\n      const liters=rows.reduce((sum,s)=>sum+(s.sale_kind==='fuel'?(Number(s.liters ?? s.quantity ?? 0)||0):0),0);\n      const avg=rows.length?total/rows.length:0;\n      const paid=rows.filter(s=>String(s.payment_status||'').toLowerCase()==='paid').length;\n      const pending=rows.filter(s=>['pending','partial'].includes(String(s.payment_status||'').toLowerCase())).length;\n      const filterLabel=typeof buildFilterLabel==='function'?buildFilterLabel():'';\n\n      document.getElementById('reportResult').innerHTML=`\n        ${filterLabel?`<div style="margin:8px 0;padding:8px 12px;border-radius:10px;background:var(--bg-glass);border:var(--silver-border);font-size:.75rem;font-weight:700;color:var(--text-secondary);"><i class="fas fa-filter" style="color:var(--gold-primary);"></i> ${escapeHtml(filterLabel)}</div>`:''}\n        <div class="report-summary">\n          <div class="report-box"><strong>${rows.length}</strong><span>عدد المعاملات</span></div>\n          <div class="report-box"><strong>${formatCurrency(total)}</strong><span>إجمالي المبيعات</span></div>\n          <div class="report-box"><strong>${formatNumber(liters)}</strong><span>إجمالي اللترات</span></div>\n          <div class="report-box"><strong>${formatCurrency(avg)}</strong><span>متوسط الفاتورة</span></div>\n          <div class="report-box"><strong>${paid}</strong><span>مدفوع</span></div>\n          <div class="report-box"><strong>${pending}</strong><span>معلق/جزئي</span></div>\n        </div>\n        <table>\n          <thead><tr><th>الكود</th><th>العميل</th><th>المبلغ</th><th>اللترات</th><th>طريقة الدفع</th><th>الحالة</th><th>التاريخ</th></tr></thead>\n          <tbody>${rows.map(s=>`<tr>\n            <td>${escapeHtml(s.sale_code||'---')}</td>\n            <td>${escapeHtml(s.customer_name||'عميل عام')}</td>\n            <td>${formatCurrency(s.net_amount ?? s.amount ?? 0)}</td>\n            <td>${formatNumber(s.liters ?? (s.sale_kind==='fuel'?s.quantity:0) ?? 0)}</td>\n            <td>${getPaymentMethodLabel(s.payment_method||'cash')}</td>\n            <td>${getStatusLabel(s.payment_status||((s.payment_method||'cash')==='credit'?'pending':'paid'))}</td>\n            <td>${s.created_at?new Date(s.created_at).toLocaleDateString('en-GB'):'---'}</td>\n          </tr>`).join('')}</tbody>\n        </table>`;\n      showToast('✅ تم توليد التقرير من SQLite بنجاح','success');\n    }catch(e){\n      lastReportData=null;\n      showToast('❌ '+(e.message||'فشل توليد التقرير'),'error');\n    }finally{\n      if(btn) btn.disabled=false;\n      showLoading(false);\n    }\n  };\n\n  // ------------------------------------------------------------\n  // Real Android CSV export: send the exact filters understood by\n  // DatabaseHelper.exportOperationalCsv(). The Kotlin files remain untouched.\n  // ------------------------------------------------------------\n  window.exportReportCsv = function(){\n    if(!lastReportData || !Array.isArray(lastReportData.rows) || !lastReportData.rows.length){\n      showToast('❌ لا توجد بيانات للتصدير؛ قم بتوليد التقرير أولاً','error'); return;\n    }\n    const {from,to,filterType,filterValue}=lastReportData;\n    const params={from_date:from,to_date:to};\n    if(filterType==='customer'&&filterValue) params.customer_id=Number(filterValue);\n    else if(filterType==='product'&&filterValue){ params.product_id=Number(filterValue); params.item_kind='product'; }\n    else if(filterType==='fuel'&&filterValue){ params.fuel_type_id=Number(filterValue); params.item_kind='fuel'; }\n    else if(filterType==='payment'&&filterValue) params.payment_method=filterValue;\n\n    const stamp=new Date().toISOString().replace(/[:.]/g,'-');\n    const fileName=`sales-report_${from}_${to}_${stamp}.csv`;\n\n    if(window.AndroidInterface && typeof AndroidInterface.exportOperationalCsv==='function'){\n      try{\n        const immediate=AndroidInterface.exportOperationalCsv('sales_transactions',JSON.stringify(params));\n        const parsed=typeof immediate==='string'?JSON.parse(immediate):immediate;\n        if(parsed && parsed.success){\n          showToast('⏳ جارٍ إنشاء ملف CSV الحقيقي من قاعدة البيانات...','info');\n          return;\n        }\n      }catch(e){\n        console.error('Android CSV export error',e);\n      }\n    }\n\n    // Fallback only when the Android bridge is unavailable.\n    try{\n      const label=typeof buildFilterLabel==='function'?buildFilterLabel():'';\n      downloadCsvViaBlob(buildReportCsv(lastReportData.rows,from,to,label),fileName);\n      showToast('✅ تم تصدير CSV','success');\n    }catch(e){ showToast('❌ فشل تصدير CSV: '+(e.message||''),'error'); }\n  };\n\n  // Handle asynchronous result emitted by MainActivity.exportOperationalCsv.\n  window.onOperationalExportResult=function(result){\n    try{\n      const r=typeof result==='string'?JSON.parse(result):result;\n      if(r?.success){\n        showToast('✅ تم إنشاء ملف CSV فعلياً'+(r.path?'':'') ,'success');\n      }else{\n        showToast('❌ فشل إنشاء CSV: '+(r?.error||'خطأ غير معروف'),'error');\n      }\n    }catch(e){ showToast('❌ تعذر قراءة نتيجة تصدير CSV','error'); }\n  };\n\n  // Sidebar: keep every action functional and deterministic.\n  window.handleSidebarAction=function(action){\n    const sidebar=document.getElementById('sidebar');\n    if(sidebar) sidebar.classList.remove('open');\n    const toggle=document.getElementById('sidebarToggle');\n    if(toggle) toggle.classList.remove('hidden');\n    switch(action){\n      case 'export': return handleSidebarExportCsv();\n      case 'pdf':\n        if(typeof printSalesReport==='function') return Swal.fire({icon:'info',title:'إنشاء PDF',text:'سيتم فتح الطباعة. اختر «حفظ كـ PDF» من نافذة الطباعة.',confirmButtonText:'متابعة',cancelButtonText:'إلغاء',showCancelButton:true}).then(r=>{if(r.isConfirmed) printSalesReport();});\n        return;\n      case 'print': return typeof printSalesReport==='function'?printSalesReport():showToast('❌ وظيفة الطباعة غير متاحة','error');\n      case 'refresh': return loadSales().then(()=>showToast('🔄 تم تحديث سجل المبيعات','success')).catch(e=>showToast('❌ فشل التحديث: '+(e.message||''),'error'));\n      case 'home': window.location.href='file:///android_asset/main.html'; return;\n      default: showToast('❌ إجراء غير معروف','error');\n    }\n  };\n\n  // Rebuild the sidebar export so it also uses the real Android exporter.\n  window.handleSidebarExportCsv=function(){\n    if(lastReportData?.rows?.length) return exportReportCsv();\n    if(!Array.isArray(allSales)||!allSales.length){ showToast('❌ لا توجد بيانات للتصدير','error'); return; }\n    if(window.AndroidInterface && typeof AndroidInterface.exportOperationalCsv==='function'){\n      try{\n        const immediate=AndroidInterface.exportOperationalCsv('sales_transactions',JSON.stringify({}));\n        const parsed=typeof immediate==='string'?JSON.parse(immediate):immediate;\n        if(parsed?.success){ showToast('⏳ جارٍ إنشاء ملف CSV الحقيقي...','info'); return; }\n      }catch(e){ console.error(e); }\n    }\n    try{\n      const stamp=new Date().toISOString().replace(/[:.]/g,'-');\n      downloadCsvViaBlob(buildReportCsv(allSales,'—','—','كل السجلات الحالية'),`sales-log_${stamp}.csv`);\n      showToast('✅ تم تصدير السجلات الحالية','success');\n    }catch(e){ showToast('❌ فشل تصدير CSV: '+(e.message||''),'error'); }\n  };\n\n  // Force the two date fields to remain side-by-side after every modal open.\n  const forceDateLayout=()=>{\n    const row=document.querySelector('#reportModal .report-date-row');\n    if(row){ row.style.setProperty('display','grid','important'); row.style.setProperty('grid-template-columns','minmax(0,1fr) minmax(0,1fr)','important'); }\n  };\n  document.addEventListener('DOMContentLoaded',forceDateLayout);\n  const oldOpen=window.openReportModal;\n  window.openReportModal=function(){ const r=oldOpen?oldOpen.apply(this,arguments):null; forceDateLayout(); return r; };\n})();\n</script>\n
