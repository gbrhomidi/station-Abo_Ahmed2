<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استثناءات التقارير وتتبع المصدر</title><link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css"><script src="file:///android_asset/assets-local/js/report-drilldown.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:12px 12px 80px;background:var(--bg-primary,#f7f8fa);color:var(--text-primary,#172033);font-family:Cairo,Arial,sans-serif;overflow-x:hidden}.wrap{max-width:1050px;margin:auto}.top,.card{background:var(--bg-card,#fff);border:1px solid var(--border-color,#ddd);border-radius:16px}.top{position:sticky;top:0;z-index:4;padding:11px;margin-bottom:10px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn{border:1px solid var(--border-color,#ddd);background:transparent;color:inherit;border-radius:10px;padding:8px 11px;font-weight:800}.primary{background:#087ea4;color:#fff;border-color:#087ea4}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px}.filters input{width:100%;padding:9px;border:1px solid var(--border-color,#ddd);border-radius:9px;background:transparent;color:inherit}.card{padding:11px;margin-bottom:10px}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:10px;border-radius:12px;background:rgba(8,126,164,.06)}.metric small{display:block;color:var(--text-muted,#687386)}.exception{border:1px solid var(--border-color,#ddd);border-radius:12px;padding:10px;margin:8px 0}.exception-head{display:flex;justify-content:space-between;gap:8px}.bad{color:#b91c1c;font-weight:900}.muted{color:var(--text-muted,#687386);font-size:.75rem}.empty{text-align:center;padding:25px;color:var(--text-muted,#687386)}@media(max-width:600px){.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.exception-head{display:block}}</style></head><body><div class="wrap"><div class="top"><div class="head"><strong>⚠️ استثناءات التقارير</strong><div><button class="btn" onclick="history.back()">رجوع</button><button class="btn" onclick="location.href='../main.html'">🏠</button></div></div><div id="scope" class="muted">كل استثناء مرتبط بعقد مصدر موحد ويمكن تتبعه إلى سجل SQLite الأصلي.</div></div><div class="filters"><input id="from" type="date"><input id="to" type="date"><button class="btn primary" onclick="load()">تحديث</button></div><div class="summary"><div class="metric"><small>عدد الاستثناءات</small><b id="count">0</b></div><div class="metric"><small>الحالة</small><b id="status">—</b></div></div><div class="card" id="list"><div class="empty">جاري التحميل...</div></div></div><script>
(function(){const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function init(){const d=new Date();$('from').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;$('to').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0')}`}function load(){const b=window.AndroidInterface;if(!b||typeof b.getReportExceptions!=='function'){ $('list').innerHTML='<div class="empty">مسار استثناءات التقارير غير متاح في Android Bridge.</div>';return}try{const raw=b.getReportExceptions(JSON.stringify({from_date:$('from').value,to_date:$('to').value}));const r=typeof raw==='string'?JSON.parse(raw):raw;if(r.success===false)throw Error(r.message||r.error||'فشل تحميل الاستثناءات');const rows=(r.data&&r.data.rows)||r.rows||[];$('count').textContent=rows.length;$('status').textContent=rows.length?'تحتاج مراجعة':'سليم';$('list').innerHTML=rows.length?rows.map((x,i)=>`<article class="exception"><div class="exception-head"><strong>${i+1}. ${esc(x.exception_type)}</strong><span class="bad">${esc(x.variance??'')}</span></div><div class="muted">${esc(x.reference_code||'')} · ${esc(x.source_table||'')} · ID ${esc(x.source_id||'')}</div><div style="margin-top:8px"><button class="btn" onclick='trace(${JSON.stringify(x).replace(/'/g,"&#39;")})'>تتبع المصدر الأصلي</button></div></article>`).join(''):'<div class="empty">لا توجد استثناءات ضمن الفترة المحددة.</div>'}catch(e){$('list').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>'}}window.trace=function(x){openReportSourceDrilldown('exception',{level:'origin',exception_type:x.exception_type,source_table:x.source_table,source_id:Number(x.source_id||0),reference_code:x.reference_code}, {from_date:$('from').value,to_date:$('to').value})};init();load()})();</script></body></html>
