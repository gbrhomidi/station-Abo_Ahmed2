<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استثناءات التقارير المالية</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:12px 12px 84px;background:var(--bg-primary,#f6f8f7);color:var(--text-primary,#17211f);font-family:Cairo,Tajawal,Arial,sans-serif}.wrap{max-width:1050px;margin:auto}.top,.card,.metric,.issue{background:var(--bg-card,#fff);border:1px solid var(--border-color,#dce5e0);border-radius:15px}.top{position:sticky;top:0;z-index:4;padding:12px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:1.08rem;margin:0}.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{font:inherit;font-weight:800;padding:8px 11px;border:1px solid var(--border-color,#dce5e0);border-radius:10px;background:var(--bg-secondary,#f6f8f7);color:inherit;cursor:pointer}.btn.primary{background:#087e8b;color:#fff;border-color:#087e8b}.note{margin-top:9px;font-size:.86rem;line-height:1.7;color:var(--text-muted,#65736d)}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}.metric{padding:12px}.metric small{display:block;color:var(--text-muted,#65736d)}.metric b{font-size:1.2rem}.card{padding:12px}.list{display:grid;gap:8px}.issue{padding:11px}.issue h2{font-size:.95rem;margin:0}.muted{color:var(--text-muted,#65736d);font-size:.8rem;line-height:1.7;overflow-wrap:anywhere}.issue p{margin:7px 0;line-height:1.7}.empty{padding:18px;text-align:center;border:1px dashed var(--border-color,#dce5e0);border-radius:12px;line-height:1.7}.good{color:#15803d}.bad{color:#b91c1c;font-weight:900}details{margin-top:8px}summary{cursor:pointer;font-weight:800}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;background:rgba(100,116,139,.08);padding:9px;border-radius:9px;max-height:320px;overflow:auto;font-size:.75rem}
@media(max-width:620px){.top{position:static}.metrics{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="head"><h1>⚠️ استثناءات المصالحة المالية</h1><div class="buttons"><button class="btn" onclick="location.href='../main.html'">🏠 الرئيسية</button><button class="btn" onclick="location.href='financial-integrity.html'">تدقيق النزاهة</button><button class="btn primary" id="refresh">تحديث</button></div></div><div class="note">تم ربط الشاشة بواجهات المصالحة والتدقيق الفعلية الموجودة في Android Bridge. النتائج للقراءة فقط، ولا تقوم بإصلاح السجلات تلقائياً.</div></header>
<section class="metrics"><div class="metric"><small>الملاحظات المعروضة</small><b id="count">—</b></div><div class="metric"><small>العناصر المانعة للإقفال</small><b id="blocking">—</b></div><div class="metric"><small>جاهزية اعتماد القوائم</small><b id="status">جاري الفحص…</b></div></section>
<section class="card"><div id="list" class="list"><div class="empty">جاري تحميل نتائج المصالحة المالية…</div></div></section>
</div>
<script>
(function(){
'use strict';const $=id=>document.getElementById(id);const b=()=>window.AndroidInterface;
function esc(v){return String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(raw){const x=typeof raw==='string'?JSON.parse(raw):raw;if(!x||typeof x!=='object')throw new Error('استجابة غير صالحة من الجسر');if(x.success===false)throw new Error(x.message||x.error||'فشل تحميل تقرير المصالحة');return x;}
function arr(v){return Array.isArray(v)?v:[];}
function preview(v){let s='';try{s=JSON.stringify(v,null,2);}catch(e){s=String(v);}if(s.length>10000)s=s.slice(0,10000)+'\n… تم اختصار التفاصيل.';return esc(s);}
function unique(rows){const seen=new Set();return rows.filter(x=>{const key=String(x.code||x.exception_type||'')+'|'+String(x.message||'');if(seen.has(key))return false;seen.add(key);return true;});}
function render(rows){if(!rows.length){$('list').innerHTML='<div class="empty good">لا توجد استثناءات مُرجعة من الفحص الحالي. هذه النتيجة لا تستبدل اعتماد القوائم المالية أو مراجعة الأدلة.</div>';return;}
  $('list').innerHTML=rows.slice(0,150).map((x,i)=>{const rec=arr(x.records||x.rows||x.details);return '<article class="issue"><h2>'+esc(x.message||x.description||x.code||('ملاحظة '+(i+1)))+'</h2><div class="muted">الرمز: '+esc(x.code||x.exception_type||'financial_issue')+' · العدد: '+esc(x.count!==undefined?x.count:rec.length)+'</div>'+(rec.length?'<details><summary>السجلات المرتبطة ('+rec.length+')</summary><pre>'+preview(rec.slice(0,25))+'</pre></details>':'<details><summary>التفاصيل</summary><pre>'+preview(x)+'</pre></details>')+'</article>';}).join('')+(rows.length>150?'<div class="empty">تم عرض أول 150 ملاحظة فقط من أصل '+rows.length+'.</div>':'');
}
async function load(){const bridge=b();if(!bridge||typeof bridge.runHistoricalFinancialReconciliation!=='function'){$('list').innerHTML='<div class="empty bad">واجهة runHistoricalFinancialReconciliation غير متاحة؛ لم يتم استدعاء أي API بديل أو وهمي.</div>';return;}
 $('list').innerHTML='<div class="empty">جاري تشغيل المصالحة التاريخية للقراءة فقط…</div>';
 try{const h=parse(bridge.runHistoricalFinancialReconciliation());let a=h.financial_integrity_audit||null;if(!a&&typeof bridge.runFinancialIntegrityAudit==='function')a=parse(bridge.runFinancialIntegrityAudit());const rows=unique([...(a?arr(a.issues):[]),...arr(h.issues)]);
 $('count').textContent=String(rows.length);$('blocking').textContent=String(h.blocking_issue_count===undefined?rows.length:h.blocking_issue_count);const ready=h.ready_for_financial_statement_approval===true&&rows.length===0;$('status').textContent=ready?'جاهزة مبدئياً':'تحتاج إلى معالجة';$('status').className=ready?'good':'bad';render(rows);
 }catch(e){$('status').textContent='فشل';$('status').className='bad';$('list').innerHTML='<div class="empty bad">'+esc(e.message||e)+'</div>';}}
$('refresh').addEventListener('click',load);load();
})();
</script>
</body></html>
