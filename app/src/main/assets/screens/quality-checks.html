<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – فحوصات الجودة</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحّد — من pumps.html
           ============================================================ */
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-glass: rgba(0, 0, 0, 0.025);
            --bg-glass-light: rgba(0, 0, 0, 0.05);
            --text-primary: #1a2233;
            --text-secondary: #44546a;
            --text-muted: #8391a5;
            --border-color: #d8dde4;

            --silver-border-color: #c4cad2;
            --silver-border-color-strong: #a8b0bb;
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

            --gold-primary: #c89a12;
            --gold-dark: #a67c00;
            --gold-light: #f5c842;
            --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

            --emerald-primary: #059669;
            --emerald-dark: #047857;
            --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --purple: #7c3aed;

            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

            --radius-card: 20px;
            --radius-small: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(255, 255, 255, 0.94);
            --nav-bg: rgba(255, 255, 255, 0.96);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;

            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-primary: #1e232b;
            --bg-secondary: #262c36;
            --bg-card: rgba(40, 47, 58, 0.88);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-light: rgba(255, 255, 255, 0.075);
            --text-primary: #d8dee6;
            --text-secondary: #9aa5b4;
            --text-muted: #6a7686;
            --border-color: rgba(200, 205, 212, 0.2);

            --silver-border-color: rgba(192, 197, 204, 0.35);
            --silver-border-color-strong: rgba(192, 197, 204, 0.55);
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --emerald-primary: #10b981;
            --emerald-dark: #059669;
            --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #9b59b6;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

            --header-bg: rgba(30, 35, 43, 0.94);
            --nav-bg: rgba(30, 35, 43, 0.96);
            --sidebar-bg: rgba(38, 44, 54, 0.98);
            --toast-bg: #262c36;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;

            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0 0 90px 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .loading-indicator {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px; height: 56px;
            border: 4px solid rgba(200, 154, 18, 0.15);
            border-top: 4px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 22px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: var(--silver-border);
            z-index: 100;
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-title { flex: 1; min-width: 150px; }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--gold-primary);
            font-size: 1.1rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            box-shadow: var(--silver-shadow);
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }

        .search-wrap { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: right;
        }
        .search-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
        .filter-chip.active {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
            box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
        }
        .filter-chip .chip-count {
            background: rgba(255,255,255,0.25);
            color: inherit;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 800;
        }
        .filter-chip:not(.active) .chip-count {
            background: var(--bg-glass-light);
            color: var(--text-muted);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border: var(--silver-border);
            background: var(--bg-glass-light);
            color: var(--gold-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           لوحة البيانات
           ============================================================ */
        .data-panel {
            margin: 0 16px;
            padding: 16px;
            border-radius: var(--radius-card);
            background: var(--bg-card);
            border: var(--silver-border-strong);
            box-shadow: var(--silver-shadow), var(--shadow-card);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }
        .data-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .section-title {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 i { color: var(--gold-primary); }
        .section-title .count-badge {
            background: var(--gold-primary);
            color: #ffffff;
            border-radius: 30px;
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 900;
            border: var(--silver-border);
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .data-card {
            background: var(--bg-glass);
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            padding: 14px;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .data-card:hover {
            border-color: var(--gold-primary);
            background: var(--bg-glass-light);
            box-shadow: var(--silver-shadow), 0 8px 24px rgba(200, 154, 18, 0.1);
        }
        .data-card-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .data-card-title {
            font-weight: 800;
            color: var(--text-primary);
            text-align: center;
            flex: 1;
            font-size: 0.98rem;
        }
        .data-card-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            margin-top: 4px;
            line-height: 1.7;
            text-align: center;
        }
        .data-card-value {
            color: var(--gold-primary);
            font-weight: 900;
            white-space: nowrap;
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        .data-card-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            border: var(--silver-border);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .data-card-badge.ok { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
        .data-card-badge.warn { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .data-card-badge.danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .data-card-badge.neutral { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

        .data-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .data-field {
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            min-width: 0;
            text-align: center;
        }
        .data-field span {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }
        .data-field strong {
            display: block;
            margin-top: 2px;
            overflow-wrap: anywhere;
            color: var(--text-primary);
            font-size: 0.8rem;
            text-align: center;
            font-weight: 800;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .btn {
            border: var(--silver-border);
            border-radius: 10px;
            padding: 9px 13px;
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-1px);
            background: var(--bg-glass-light);
        }
        .btn.primary {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
        }
        .btn.primary:hover { background: var(--gold-dark); color: #ffffff; }
        .btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
        }
        .btn.warning:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(217, 119, 6, 0.1);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.4;
            display: block;
            color: var(--gold-primary);
        }
        .empty-state p { font-size: 0.9rem; }

        /* ============================================================
           الزر العائم
           ============================================================ */
        .fab {
            position: fixed;
            bottom: 90px;
            left: 24px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--gold-primary);
            border: var(--silver-border);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(200, 154, 18, 0.3), var(--silver-shadow);
            transition: var(--transition);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active { transform: scale(0.9); }
        .fab:hover {
            background: var(--gold-dark);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 30px rgba(200, 154, 18, 0.4);
        }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--gold-primary);
            color: white;
            width: 40px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
            transition: var(--transition);
            border: var(--silver-border);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { background: var(--gold-dark); width: 44px; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 110px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 12px 10px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            border: var(--silver-border);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: var(--silver-border);
            padding: 12px 6px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 72px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.68rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--silver-border-strong);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            min-width: 80px;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--gold-primary); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 10px;
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: var(--silver-border);
            padding-bottom: 14px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* ===== حقول النموذج ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 2px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group.hidden-field { display: none !important; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
            font-weight: 600;
        }
        .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
            background: var(--bg-glass-light);
        }
        .form-input::placeholder { color: var(--text-muted); text-align: center; }
        select.form-input option { background: var(--bg-secondary); color: var(--text-primary); text-align: center; }
        textarea.form-input { text-align: center; resize: vertical; min-height: 60px; }
        .form-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
        }

        .modal-body { padding: 4px 0; }
        .modal-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 0 0;
            border-top: var(--silver-border);
            margin-top: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--gold-primary);
            color: white;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }

        /* ============================================================
           مودال التقارير
           ============================================================ */
        .report-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 900;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .report-modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .report-modal-overlay.show { display: flex; opacity: 1; }
        .report-modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .report-modal-overlay.show .report-modal { transform: translateY(0); }

        .report-filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .report-filter-row .form-group { margin-bottom: 0; }
        .report-filter-row .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-align: center;
        }
        .report-filter-row .form-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .report-filter-row .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
        }
        .report-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .report-actions .btn {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            font-weight: 800;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            background: var(--bg-glass);
            color: var(--text-secondary);
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .report-actions .btn:active { transform: scale(0.97); }
        .report-actions .btn-primary {
            background: var(--gold-primary);
            color: white;
            border-color: var(--gold-dark);
        }
        .report-actions .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }
        .report-results {
            margin-top: 20px;
            max-height: 380px;
            overflow-y: auto;
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            background: var(--bg-card);
            padding: 8px;
        }
        .report-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .report-summary-item {
            padding: 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            text-align: center;
        }
        .report-summary-item span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .report-summary-item strong {
            display: block;
            margin-top: 2px;
            color: var(--gold-primary);
            font-size: 0.95rem;
            font-weight: 900;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        /* ============================================================
           Toast
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--silver-border-strong);
            border-radius: 14px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
            min-width: 220px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-primary);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--emerald-primary); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--gold-primary); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease forwards; }

        .page-container { max-width: 1280px; margin: 0 auto; padding: 16px 0 90px; }
        .hidden { display: none !important; }

        /* ============================================================
           حقول التفاصيل
           ============================================================ */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .detail-item {
            padding: 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            text-align: center;
        }
        .detail-item span {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
        }
        .detail-item strong {
            display: block;
            margin-top: 3px;
            overflow-wrap: anywhere;
            text-align: center;
            color: var(--text-primary);
            font-weight: 800;
        }
        .raw-json {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-glass-light);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 10px;
            border: var(--silver-border);
            font: 0.72rem/1.5 monospace;
            max-height: 300px;
            overflow: auto;
        }

        /* ============================================================
           Responsive
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.15rem; }
            .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
            .bottom-nav .nav-item i { font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 0.68rem; }
            .sidebar { width: 100px; padding: 10px 8px; }
            .sidebar-btn { min-height: 66px; font-size: 0.8rem; }
            .sidebar-btn i { font-size: 1.3rem; }
            .fab { width: 48px; height: 48px; font-size: 1.2rem; bottom: 80px; left: 16px; }
            .filter-chip { font-size: 0.72rem; padding: 6px 12px; }
            .top-title h2 { font-size: 1.1rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .report-modal { padding: 16px; }
            .report-results { max-height: 260px; }
        }
        @media (max-width: 480px) {
            .stats-grid { gap: 8px; padding: 10px; }
            .stat-card { padding: 10px; }
            .stat-value { font-size: 1rem; }
            .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
            .card-actions { flex-wrap: wrap; }
            .bottom-nav .nav-item { padding: 4px 4px; min-width: 70px; }
            .bottom-nav .nav-item i { font-size: 16px; }
            .bottom-nav .nav-item span { font-size: 0.62rem; }
            .modal { padding: 16px; }
            .top-bar { padding: 12px 14px 10px; }
        }

        @media print {
            .top-bar, .bottom-nav, .sidebar-toggle, .sidebar, .fab, .offline-banner,
            .action-row, .icon-btn, .report-actions { display: none !important; }
            body { background: #fff; color: #111; padding: 0; }
            .data-panel, .data-card, .stat-card {
                box-shadow: none;
                color: #111;
                border: 1px solid #aaa;
            }
        }
    </style>

<body>
    <div class="offline-banner" id="offlineBanner"><i class="fas fa-triangle-exclamation"></i> Android Bridge غير متاح؛ لن تُحفظ أو تُعرض بيانات تجارية بديلة</div>
    <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>
    <header class="top-bar">

            <div class="top-title"><h2><i class="fas fa-vial"></i> فحوصات الجودة</h2></div>

                <button type="button" class="icon-btn" id="themeToggle" title="تبديل الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button type="button" class="icon-btn" onclick="goHome()" title="الرئيسية"><i class="fas fa-home"></i></button>
            </div>
        </div>
        <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="searchInput" type="search" placeholder="ابحث في فحوصات الجودة..." autocomplete="off"></div>
        <div class="filter-chips" id="filterChips" aria-label="الفلاتر"></div>
    </header>
    <main class="page-container">
        <section class="stats-grid" id="statsGrid">
            <article class="stat-card"><div class="stat-icon blue"><i class="fas fa-vial"></i></div><div class="stat-value" id="statCount">—</div><div class="stat-label">عدد الفحوصات المعروضة</div></article>
            <article class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="statActive">—</div><div class="stat-label">فحوصات ناجحة</div></article>
            <article class="stat-card"><div class="stat-icon orange"><i class="fas fa-flask"></i></div><div class="stat-value" id="statTotal">—</div><div class="stat-label">متوسط كثافة الوقود</div></article>
            <article class="stat-card"><div class="stat-icon purple"><i class="fas fa-clock"></i></div><div class="stat-value" id="statUpdated">—</div><div class="stat-label">آخر تحديث</div></article>
        </section>
        <section class="data-panel">
            <div class="section-title"><h3><i class="fas fa-vial"></i> فحوصات الجودة</h3><span class="count-badge" id="itemCount">0</span></div>
            <div class="cards-container" id="cardsContainer"></div>
        </section>
    </main>
    <button type="button" class="fab" id="fab" title="إضافة فحص"><i class="fas fa-plus"></i></button>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>
    <aside class="sidebar" id="sidebar"><div class="sidebar-content">
        <button type="button" class="sidebar-btn" data-sidebar-action="reload"><i class="fas fa-sync-alt"></i><span>تحديث</span></button>

        <button type="button" class="sidebar-btn" data-sidebar-action="print"><i class="fas fa-print"></i><span>طباعة</span></button>
        <button type="button" class="sidebar-btn" data-sidebar-action="home"><i class="fas fa-home"></i><span>رجوع</span></button>
    </div></aside>
    <nav class="bottom-nav" id="bottomNav" aria-label="إجراءات الفحوصات"></nav>
    <div class="modal-overlay" id="formModal" onclick="closeModal(event,'formModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">إضافة فحص جديد</h3><button type="button" class="modal-close" onclick="closeModal(null,'formModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><form id="recordForm" class="form-grid"></form></div>
        <div class="modal-footer"><button type="button" class="btn primary" id="saveBtn"><i class="fas fa-save"></i> حفظ</button><button type="button" class="btn" onclick="closeModal(null,'formModal')">إلغاء</button></div>
    </div></div>
    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event,'detailsModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تفاصيل الفحص</h3><button type="button" class="modal-close" onclick="closeModal(null,'detailsModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body" id="detailsBody"></div>
    </div></div>
    <div class="modal-overlay" id="reportModal" onclick="closeModal(event,'reportModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تقرير فحوصات الجودة</h3><button type="button" class="modal-close" onclick="closeModal(null,'reportModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">

            <div class="report-filter-row">
