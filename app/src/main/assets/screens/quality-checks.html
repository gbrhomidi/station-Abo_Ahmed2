                <button type="button" class="btn btn-primary" onclick="generateReport()"><i class="fas fa-cog"></i> توليد التقرير</button>
                <button type="button" class="btn" onclick="exportData()"><i class="fas fa-file-export"></i> Excel/CSV</button>
                <button type="button" class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة/PDF</button>
            </div>
            <div id="reportResults" style="margin-top:14px"></div>
        </div>
    </div></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
        'use strict';
        const CFG = {
            "title": "فحوصات الجودة",
            "icon": "fa-vial",
            "module": "tanks",
            "listMethod": "getFuelQualityRecords",
            "listArgs": ["{}"],
            "fields": [
                { "label": "التعبئة المرجعية", "key": "refill_id", "type": "number", "required": true, "placeholder": "" },
                { "label": "تاريخ الفحص", "key": "test_date", "type": "date", "required": false, "placeholder": "" },
                { "label": "الكثافة", "key": "density", "type": "number", "required": false, "placeholder": "" },
                { "label": "درجة الحرارة", "key": "temperature", "type": "number", "required": false, "placeholder": "" },
                { "label": "محتوى الماء", "key": "water_content", "type": "number", "required": false, "placeholder": "" },
                { "label": "محتوى الكبريت", "key": "sulfur_content", "type": "number", "required": false, "placeholder": "" },
                { "label": "اللزوجة", "key": "viscosity", "type": "number", "required": false, "placeholder": "" },
                { "label": "نقطة الوميض", "key": "flash_point", "type": "number", "required": false, "placeholder": "" },
                { "label": "رقم السيتان", "key": "cetane_number", "type": "number", "required": false, "placeholder": "" },
                { "label": "النتيجة", "key": "result", "type": "select", "required": false, "placeholder": "" },
                { "label": "رابط الشهادة", "key": "certificate_url", "type": "text", "required": false, "placeholder": "" },
                { "label": "بواسطة", "key": "tested_by", "type": "text", "required": false, "placeholder": "" },
                { "label": "ملاحظات", "key": "notes", "type": "textarea", "required": false, "placeholder": "" }
            ],
            "valueFields": [],
            "titleFields": ["refill_id", "test_date"],
            "subtitleFields": ["refill_id", "test_date", "density", "temperature", "water_content", "sulfur_content"],
            "createMethod": "saveFuelQualityRecord",
            "updateMethod": "updateFuelQualityRecord",
            "deleteMethod": "deleteFuelQualityRecord",
            "note": "",
            "mode": "list",
            "objectMode": false,
            "updateAction": null,
            "reportKind": "operational:FuelQuality",
            "aiMethod": null,
            "reports": ["الكل", "ناجح", "فاشل", "تحذير", "بدون نتيجة"],
            "filterKeys": ["all", "pass", "fail", "warning", "empty"],
            "resolveMethod": null,
            "operationKey": "fuel_quality_tests"
        };
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: '0', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => businessDayDate();
        const numFmt = (v) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('ar',{maximumFractionDigits:4}) : '—'; };

        // ============================================================
        // أدوات مساعدة
        // ============================================================
        function toast(message, bad=false) {
            const node = $('toast');
            node.textContent = message;
            node.className = 'toast show';
            node.style.background = bad ? 'var(--danger)' : 'var(--toast-bg)';
            node.style.color = bad ? '#fff' : 'var(--text-primary)';
            clearTimeout(node._timer);
            node._timer = setTimeout(() => node.classList.remove('show'), 3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) {
            if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
            const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
            return value;
        }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            try { return Promise.resolve(parse(bridge[method](...args))); }
            catch (error) { return Promise.reject(error); }
        }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({ limit: 500, search: $('searchInput').value || '' })];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw = dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val]) => ({key, value:val}));
            if (raw && typeof raw === 'object' && raw.id !== undefined) return [raw];
            return [];
        }
        function field(row, names) {
            for (const name of (names || [])) {
                if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
            }
            return '';
        }
        function titleOf(row) {
            const rid = field(row, ['refill_id']);
            const date = field(row, ['test_date']);
            const id = field(row, ['id']);
            return `فحص #${id || '—'} · التعبئة ${rid || '—'} · ${date || '—'}`;
        }
        function subtitleOf(row) {
            const result = field(row, ['result']);
            const density = field(row, ['density']);
            return `النتيجة: ${trResult(result)} · الكثافة: ${numFmt(density)}`;
        }
        function idOf(row) { return field(row,['id','_id','fuel_quality_test_id','refill_id']); }
        function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function setDateDefaults() {
            $('reportFrom').value = $('reportFrom').value || today();
            $('reportTo').value = $('reportTo').value || today();
        }

        // ============================================================
        // ترجمة
        // ============================================================
        const AR = {
            id: 'المعرّف',
            refill_id: 'التعبئة المرجعية',
            test_date: 'تاريخ الفحص',
            density: 'الكثافة',
            temperature: 'درجة الحرارة',
            water_content: 'محتوى الماء',
            sulfur_content: 'محتوى الكبريت',
            viscosity: 'اللزوجة',
            flash_point: 'نقطة الوميض',
            cetane_number: 'رقم السيتان',
            result: 'النتيجة',
            certificate_url: 'رابط الشهادة',
            tested_by: 'بواسطة',
            notes: 'ملاحظات',
            created_at: 'تاريخ الإنشاء'
        };
        function tr(key) { return AR[key] || key; }
        function trResult(v) {
            const s = String(v||'').toLowerCase();
            if (s === 'pass') return 'ناجح';
            if (s === 'fail') return 'فاشل';
            if (s === 'warning') return 'تحذير';
            return v || '—';
        }

        // ============================================================
        // التصفية بالتبويبات العلوية
        // ============================================================
        function renderFilters() {
            const labels = CFG.reports || ['الكل'];
            const icons = ['fa-list', 'fa-check-circle', 'fa-times-circle', 'fa-exclamation-triangle', 'fa-clock'];
            const chips = $('filterChips');
            chips.innerHTML = labels.map((label,i) => `
                <button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">
                    <i class="fas ${icons[i]||'fa-circle'}"></i>
                    <span>${esc(label)}</span>
                    <span class="chip-count" data-chip-count="${i}">0</span>
                </button>`).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
                chips.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                applyFilter();
            }));

            // القائمة السفلية: إجراءات مختلفة (بدون تكرار التبويبات)
            const nav = $('bottomNav');
            nav.innerHTML = `
                <button type="button" class="nav-item" data-bottom-action="reload">
                    <i class="fas fa-sync-alt"></i><span>تحديث</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="export">
                    <i class="fas fa-file-export"></i><span>تصدير</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="report">
                    <i class="fas fa-chart-bar"></i><span>تقارير</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="print">
                    <i class="fas fa-print"></i><span>طباعة</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="home">
                    <i class="fas fa-home"></i><span>الرئيسية</span>
                </button>`;
            nav.querySelectorAll('[data-bottom-action]').forEach(btn => btn.addEventListener('click', () => {
                const action = btn.dataset.bottomAction;
                if (action === 'reload') reloadData();
                else if (action === 'export') exportData();
                else if (action === 'report') openReport();
                else if (action === 'print') window.print();
                else if (action === 'home') goHome();
            }));
        }

        function filterMatch(row, key) {
            if (!key || key === 'all') return true;
            const result = String(field(row, ['result']) || '').toLowerCase();
            switch (key) {
                case 'pass': return result === 'pass';
                case 'fail': return result === 'fail';
                case 'warning': return result === 'warning';
                case 'empty': return !result;
                default: return true;
            }
        }

        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const keys = CFG.filterKeys || ['all'];
            const idx = parseInt(state.filter, 10);
            const filterKey = keys[isNaN(idx) ? 0 : idx] || 'all';

            state.filtered = state.rows.filter(row => {
                if (q) {
                    const rowText = JSON.stringify(row || {}).toLowerCase();
                    const arabicResult = trResult(field(row, ['result'])).toLowerCase();
                    if (!rowText.includes(q) && !arabicResult.includes(q)) return false;
                }
                return filterMatch(row, filterKey);
            });
            updateChipCounts();
            renderCards();
        }

        function updateChipCounts() {
            const keys = CFG.filterKeys || ['all'];
            const counts = keys.map(k => state.rows.filter(r => filterMatch(r, k)).length);
            counts.forEach((c, i) => {
                const el = document.querySelector(`[data-chip-count="${i}"]`);
                if (el) el.textContent = c.toLocaleString('ar');
            });
        }

        // ============================================================
        // الإحصائيات
        // ============================================================
        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = rows.length.toLocaleString('ar');
            $('itemCount').textContent = rows.length.toLocaleString('ar');
            const pass = rows.filter(r => String(field(r, ['result']) || '').toLowerCase() === 'pass').length;
            $('statActive').textContent = pass.toLocaleString('ar');

            const densities = rows
                .map(r => Number(field(r, ['density'])))
                .filter(n => Number.isFinite(n) && n > 0);
            const avgDensity = densities.length ? densities.reduce((a,b) => a+b, 0) / densities.length : 0;
            $('statTotal').textContent = avgDensity ? avgDensity.toLocaleString('ar', { maximumFractionDigits: 4 }) : '—';

            $('statUpdated').textContent = state.loadedAt
                ? state.loadedAt.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
                : '—';
        }

        // ============================================================
        // شارات النتيجة
        // ============================================================
        function resultBadge(row) {
            const s = String(field(row, ['result']) || '').toLowerCase();
            if (s === 'pass') return `<span class="data-card-badge ok"><i class="fas fa-check"></i> ناجح</span>`;
            if (s === 'fail') return `<span class="data-card-badge danger"><i class="fas fa-times"></i> فاشل</span>`;
            if (s === 'warning') return `<span class="data-card-badge warn"><i class="fas fa-exclamation-triangle"></i> تحذير</span>`;
            return `<span class="data-card-badge neutral"><i class="fas fa-hourglass-half"></i> بدون نتيجة</span>`;
        }

        // ============================================================
        // البطاقات
        // ============================================================
        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`;
                return;
            }
            box.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const displayFields = ['test_date','density','temperature','water_content','sulfur_content','viscosity','flash_point','cetane_number']
                    .filter(k => row && row[k] !== undefined && row[k] !== null && row[k] !== '');
                const buttons = `
                    <div class="action-row">
                        <button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>
                        ${CFG.updateMethod ? `<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                        ${CFG.deleteMethod ? `<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>` : ''}
                    </div>`;
                return `<article class="data-card">
                    <div class="data-card-head">
                        <div style="flex:1">
                            <div class="data-card-title">${esc(titleOf(row))}</div>
                            <div class="data-card-subtitle">${esc(subtitleOf(row))}</div>
                        </div>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
                            ${resultBadge(row)}
                        </div>
                    </div>
                    <div class="data-fields">
                        ${displayFields.map(k => {
                            let v = row[k];
                            if (['density','temperature','water_content','sulfur_content','viscosity','flash_point'].includes(k)) v = numFmt(v);
                            return `<div class="data-field"><span>${esc(tr(k))}</span><strong>${esc(v)}</strong></div>`;
                        }).join('')}
                    </div>
                    ${buttons}
                </article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.delete))));
        }

        function findRow(id) { return state.rows.find((row, index) => String(idOf(row) || index) === String(id)); }

        // ============================================================
        // التفاصيل
        // ============================================================
        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            $('detailsBody').innerHTML = `
                <div class="detail-grid">
                    ${Object.entries(row).map(([k, v]) => {
                        let val = (typeof v === 'object') ? JSON.stringify(v) : v;
                        if (k === 'result') val = trResult(val);
                        return `<div class="detail-item"><span>${esc(tr(k))}</span><strong>${esc(val)}</strong></div>`;
                    }).join('')}
                </div>
                <details style="margin-top:14px"><summary style="text-align:center;cursor:pointer;color:var(--text-muted)">JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row, null, 2))}</pre></details>`;
            openModal(null, 'detailsModal');
        }

        // ============================================================
        // النموذج
        // ============================================================
        const FULL_WIDTH_KEYS = ['notes', 'extra_data'];
        const HIDDEN_KEYS = [];

        function inputHtml(def, row) {
            const value = row && row[def.key] !== undefined ? row[def.key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const isFull = def.type === 'textarea' || FULL_WIDTH_KEYS.includes(def.key);
            const isHidden = HIDDEN_KEYS.includes(def.key);
            const groupClass = `form-group${isFull ? ' full' : ''}${isHidden ? ' hidden-field' : ''}`;

            if (def.type === 'textarea') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`;
            }

            // ===== التعبئة المرجعية: dropdown من جدول التعبئات =====
            if (def.key === 'refill_id') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" data-needs-options="true" ${req}>
                        <option value="">جاري التحميل...</option>
                    </select>
                    <span class="form-hint" data-hint="refill_id"></span></div>`;
            }

            // ===== بواسطة: dropdown من المستخدمين =====
            if (def.key === 'tested_by') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}</label>
                    <select class="form-input" data-key="${esc(def.key)}" data-needs-options="true">
                        <option value="">جاري التحميل...</option>
                    </select>
                    <span class="form-hint" data-hint="tested_by"></span></div>`;
            }

            // ===== النتيجة: ناجح/فاشل/تحذير =====
            if (def.key === 'result') {
                const v = String(value || '').toLowerCase();
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}</label>
                    <select class="form-input" data-key="${esc(def.key)}">
                        <option value="">اختر...</option>
                        <option value="pass" ${v==='pass'?'selected':''}>ناجح</option>
                        <option value="fail" ${v==='fail'?'selected':''}>فاشل</option>
                        <option value="warning" ${v==='warning'?'selected':''}>تحذير</option>
                    </select></div>`;
            }

            if (def.type === 'select') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" ${req}>
                        <option value="">اختر...</option>
                    </select></div>`;
            }

            return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                <input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`;
        }

        // ============================================================
        // جلب قوائم القيم من قاعدة البيانات
        // ============================================================
        async function fetchRefills() {
            try {
                const result = await invoke('getTankRefillRecords', [JSON.stringify({ limit: 500 })]);
                return rowsFrom(result);
            } catch (e) { console.warn('fetchRefills failed', e); return []; }
        }
        async function fetchUsers() {
            try {
                const result = await invoke('getUsers', []);
                return rowsFrom(result);
            } catch (e) { console.warn('fetchUsers failed', e); return []; }
        }

        async function populateFormSelects(row) {
            // التعبئات
            try {
                const refills = await fetchRefills();
                const el = document.querySelector('#recordForm [data-key="refill_id"]');
                if (el) {
                    el.innerHTML = '<option value="">اختر التعبئة...</option>' +
                        refills.map(r => {
                            const rid = r.id || r.refill_id;
                            const label = `${r.refill_code || ''} - ${r.fuel_type_id || ''} - ${r.arrival_date || r.created_at || ''}`.trim();
                            return `<option value="${esc(rid)}">${esc(label || ('تعبئة ' + rid))}</option>`;
                        }).join('');
                    if (row && row.refill_id) el.value = String(row.refill_id);
                    else if (refills[0]) el.value = String(refills[0].id || refills[0].refill_id);
                    const hint = document.querySelector('#recordForm [data-hint="refill_id"]');
                    if (hint) hint.textContent = refills.length ? `${refills.length} تعبئة متاحة` : 'لا توجد سجلات تعبئة';
                }
            } catch (e) { console.warn(e); }

            // المستخدمون
            try {
                const users = await fetchUsers();
                const el = document.querySelector('#recordForm [data-key="tested_by"]');
                if (el) {
                    el.innerHTML = '<option value="">اختر المستخدم...</option>' +
                        users.map(u => {
                            const uid = u.id || u.user_id;
                            const label = u.full_name_ar || u.full_name || u.username || ('مستخدم ' + uid);
                            return `<option value="${esc(uid)}">${esc(label)}</option>`;
                        }).join('');
                    if (row && row.tested_by) el.value = String(row.tested_by);
                    const hint = document.querySelector('#recordForm [data-hint="tested_by"]');
                    if (hint) hint.textContent = users.length ? `${users.length} مستخدم متاح` : 'لا يوجد مستخدمون';
                }
            } catch (e) { console.warn(e); }
        }

        // ============================================================
        // ربط سلوكيات الحقول: تركيز + حساب تلقائي
        // ============================================================
        function bindFormFieldBehaviors() {
            document.querySelectorAll('#recordForm .form-input').forEach(el => {
                el.addEventListener('focus', () => {
                    if (el.tagName === 'INPUT' && (el.type === 'number' || el.type === 'text')) {
                        setTimeout(() => { try { el.select(); } catch(_) {} }, 30);
                    }
                });
            });

            // اقتراح النتيجة تلقائياً بناءً على القيم المدخلة
            const densityEl = document.querySelector('#recordForm [data-key="density"]');
            const waterEl = document.querySelector('#recordForm [data-key="water_content"]');
            const sulfurEl = document.querySelector('#recordForm [data-key="sulfur_content"]');
            const resultEl = document.querySelector('#recordForm [data-key="result"]');

            function suggestResult() {
                if (!resultEl || resultEl.value) return; // لا نُعدل اختياراً يدوياً
                const d = Number(densityEl && densityEl.value);
                const w = Number(waterEl && waterEl.value);
                const s = Number(sulfurEl && sulfurEl.value);
                let severity = 0;
                if (Number.isFinite(d) && d > 0) {
                    if (d < 0.78 || d > 0.86) severity = 1;
                    if (d < 0.75 || d > 0.90) severity = 2;
                }
                if (Number.isFinite(w) && w > 0) {
                    if (w > 0.05) severity = Math.max(severity, 1);
                    if (w > 0.20) severity = Math.max(severity, 2);
                }
                if (Number.isFinite(s) && s > 0) {
                    if (s > 0.50) severity = Math.max(severity, 1);
                    if (s > 1.00) severity = Math.max(severity, 2);
                }
                if (severity === 0) return;
                resultEl.value = severity >= 2 ? 'fail' : 'warning';
            }
            [densityEl, waterEl, sulfurEl].forEach(el => { if (el) el.addEventListener('input', suggestResult); });
        }

        // ============================================================
        // فتح النموذج
        // ============================================================
        async function openForm(row = null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل الفحص' : 'إضافة فحص جديد';
            $('recordForm').innerHTML = (CFG.fields || []).map(def => inputHtml(def, row)).join('');

            await populateFormSelects(row);
            bindFormFieldBehaviors();

            // التركيز على أول حقل مرئي
            const firstVisible = document.querySelector('#recordForm .form-group:not(.hidden-field) .form-input');
            if (firstVisible) setTimeout(() => firstVisible.focus(), 180);

            $('formModal').classList.add('show');
        }

        // ============================================================
        // جمع بيانات النموذج
        // ============================================================
        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                let value = el.value;
                if (el.type === 'number') {
                    value = value === '' ? 0 : Number(value);
                }
                payload[el.dataset.key] = value;
            });
            return payload;
        }

        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم تنفيذ العملية والتحقق من نجاحها');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشلت العملية', true);
            } finally {
                setLoading(false);
            }
        }

        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم الحذف فعلياً');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // تحميل البيانات
        // ============================================================
        async function reloadData() {
            if (CFG.mode === 'unsupported' || CFG.mode === 'ai') { renderCards(); return; }
            if (!CFG.listMethod) { renderCards(); return; }
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                renderCards();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // المودالات
        // ============================================================
        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }

        // ============================================================
        // التقارير
        // ============================================================
        async function populateReportFilters() {
            try {
                const refills = await fetchRefills();
                const sel = $('reportRefillFilter');
                if (sel) sel.innerHTML = '<option value="">كل التعبئات</option>' +
                    refills.map(r => {
                        const rid = r.id || r.refill_id;
                        return `<option value="${esc(rid)}">${esc(r.refill_code || ('تعبئة ' + rid))}</option>`;
                    }).join('');
            } catch(_) {}
        }

        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات من SQLite.</p></div>';
            populateReportFilters().then(() => openModal(null, 'reportModal'));
        }

        function buildReportSummary(rows) {
            const total = rows.length;
            const pass = rows.filter(r => String(field(r, ['result']) || '').toLowerCase() === 'pass').length;
            const fail = rows.filter(r => String(field(r, ['result']) || '').toLowerCase() === 'fail').length;
            const warn = rows.filter(r => String(field(r, ['result']) || '').toLowerCase() === 'warning').length;
            const densities = rows.map(r => Number(field(r, ['density']))).filter(n => Number.isFinite(n) && n > 0);
            const avgDensity = densities.length ? (densities.reduce((a,b)=>a+b,0) / densities.length) : 0;
            const passRate = total ? ((pass / total) * 100) : 0;
            return `
                <div class="report-summary">
                    <div class="report-summary-item"><span>إجمالي الفحوصات</span><strong>${total.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>ناجحة</span><strong>${pass.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>فاشلة</span><strong>${fail.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>تحذيرية</span><strong>${warn.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>نسبة النجاح</span><strong>${passRate.toFixed(1)}%</strong></div>
                    <div class="report-summary-item"><span>متوسط الكثافة</span><strong>${avgDensity ? avgDensity.toFixed(4) : '—'}</strong></div>
                </div>`;
        }

        async function generateReport() {
            setLoading(true);
            try {
                let result;
                if (String(CFG.reportKind || '').startsWith('operational:')) {
                    const suffix = String(CFG.reportKind).split(':')[1];
                    const payload = {
                        from_date: $('reportFrom').value || '',
                        to_date: $('reportTo').value || '',
                        search: $('searchInput').value || '',
                        refill_id: $('reportRefillFilter') ? $('reportRefillFilter').value : '',
                        result: $('reportResultFilter') ? $('reportResultFilter').value : '',
                        density_min: $('reportDensityMin') ? $('reportDensityMin').value : '',
                        density_max: $('reportDensityMax') ? $('reportDensityMax').value : '',
                        temperature_min: $('reportTempMin') ? $('reportTempMin').value : '',
                        temperature_max: $('reportTempMax') ? $('reportTempMax').value : '',
                        report_type: $('reportKindFilter') ? $('reportKindFilter').value : 'detailed',
                        include_archived: true,
                        limit: 2000
                    };
                    result = await invoke('generate' + suffix + 'Report', [JSON.stringify(payload)]);
                } else {
                    result = { data: state.filtered };
                }

                let rows = rowsFrom(result);
                // تصفية إضافية محلية
                rows = rows.filter(row => {
                    const refillId = $('reportRefillFilter') ? $('reportRefillFilter').value : '';
                    const resultFilter = $('reportResultFilter') ? $('reportResultFilter').value : '';
                    const densityMin = $('reportDensityMin') ? Number($('reportDensityMin').value) : NaN;
                    const densityMax = $('reportDensityMax') ? Number($('reportDensityMax').value) : NaN;
                    const tempMin = $('reportTempMin') ? Number($('reportTempMin').value) : NaN;
                    const tempMax = $('reportTempMax') ? Number($('reportTempMax').value) : NaN;
                    const qualityFilter = $('reportQualityFilter') ? $('reportQualityFilter').value : '';

                    if (refillId && String(field(row, ['refill_id']) || '') !== refillId) return false;
                    if (resultFilter && String(field(row, ['result']) || '').toLowerCase() !== resultFilter) return false;

                    const d = Number(field(row, ['density']));
                    if (Number.isFinite(densityMin) && Number.isFinite(d) && d < densityMin) return false;
                    if (Number.isFinite(densityMax) && Number.isFinite(d) && d > densityMax) return false;

                    const t = Number(field(row, ['temperature']));
                    if (Number.isFinite(tempMin) && Number.isFinite(t) && t < tempMin) return false;
                    if (Number.isFinite(tempMax) && Number.isFinite(t) && t > tempMax) return false;

                    if (qualityFilter) {
                        const r = String(field(row, ['result']) || '').toLowerCase();
                        if (qualityFilter === 'pure' && r !== 'pass') return false;
                        if (qualityFilter === 'warning' && r !== 'warning') return false;
                        if (qualityFilter === 'critical' && r !== 'fail') return false;
                    }
                    return true;
                });

                $('reportResults').innerHTML = buildReportSummary(rows) + renderReport(rows);
                toast(`تم توليد التقرير (${rows.length} سجل)`);
            } catch (e) {
                toast(e.message || 'فشل التقرير', true);
            } finally {
                setLoading(false);
            }
        }

        function renderReport(rows) {
            if (!rows.length) return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="data-fields">${rows.slice(0, 200).map(row => `
                <div class="data-field">
                    <span>${esc(titleOf(row))}</span>
                    <strong>${esc(subtitleOf(row) || JSON.stringify(row))}</strong>
                    <small style="display:block;color:var(--text-muted);font-size:.7rem;margin-top:3px">
                        ${esc(trResult(field(row,['result'])))}
                    </small>
                </div>`).join('')}</div>`;
        }

        // ============================================================
        // تصدير CSV
        // ============================================================
        function exportData() {
            const rows = state.filtered;
            if (!rows.length) { toast('لا توجد بيانات حقيقية لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const headers = keys.map(k => tr(k));
            const csv = '\ufeff' + [headers, ...rows.map(row => keys.map(k => {
                const v = row[k];
                if (k === 'result') return trResult(v);
                return String(v == null ? '' : v).replace(/"/g, '""');
            }))].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            a.href = url;
            a.download = `quality_checks_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً');
        }

        // ============================================================
        // التنقل والوضع
        // ============================================================
        function goHome() { window.location.href = '../main.html'; }

        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // ============================================================
        // القائمة الجانبية: إخفاء اللسان + إغلاق ذكي
        // ============================================================
        function openSidebar() {
            $('sidebar').classList.add('open');
            $('sidebarToggle').classList.add('hidden');
        }
        function closeSidebar() {
            $('sidebar').classList.remove('open');
            $('sidebarToggle').classList.remove('hidden');
        }

        function initSidebar() {
            $('sidebarToggle').addEventListener('click', (e) => {
                e.stopPropagation();
                if ($('sidebar').classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.sidebarAction;
                    closeSidebar();
                    setTimeout(() => {
                        if (action === 'reload') reloadData();
                        else if (action === 'report') openReport();
                        else if (action === 'export') exportData();
                        else if (action === 'print') window.print();
                        else if (action === 'home') goHome();
                    }, 120);
                });
            });
            // إغلاق النقر الخارجي
            document.addEventListener('click', (e) => {
                const side = $('sidebar');
                const toggle = $('sidebarToggle');
                if (!side.classList.contains('open')) return;
                if (side.contains(e.target) || toggle.contains(e.target)) return;
                closeSidebar();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeSidebar();
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                }
            });
        }

        // ============================================================
        // ربط الأحداث العامة
        // ============================================================
        function bindGlobalEvents() {
            $('searchInput').addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('fab').addEventListener('click', () => openForm());
            $('saveBtn').addEventListener('click', saveForm);
            window.addEventListener('online', () => toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
            window.addEventListener('offline', () => $('offlineBanner').classList.add('show'));
        }

        // ============================================================
        // تصدير الدوال
        // ============================================================
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm, saveForm,
            openModal, closeModal, generateReport
        });

        // ============================================================
        // التهيئة
        // ============================================================
        applyTheme();
        renderFilters();
        initSidebar();
        bindGlobalEvents();
        reloadData();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
