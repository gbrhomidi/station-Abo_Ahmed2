<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – إدارة المدفوعات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
/* ============================================================
   نظام Ivory Sage — عاجي دافئ + أخضر مريمي + برونزي
   + الخط المضيء + إصلاح الأسهم + تمييز العناصر النشطة
   + الحقول الديناميكية + الأرقام الإنجليزية
   ============================================================ */
:root {
    --ivory-50:  #FDFCF8;
    --ivory-100: #F8F6EF;
    --ivory-200: #F1EEE3;
    --ivory-300: #E8E4D6;
    --ivory-400: #DDD7C4;

    --sage-900: #1F2D24;
    --sage-800: #2E4034;
    --sage-700: #3D5A4C;
    --sage-600: #4E7060;
    --sage-500: #6B8E7F;
    --sage-400: #93AFA3;
    --sage-300: #B8CBC1;
    --sage-200: #D5E0DA;
    --sage-100: #E8EFEB;
    --sage-50:  #F2F7F4;

    --bronze-800: #6B5230;
    --bronze-700: #8C6D3F;
    --bronze-600: #A67C45;
    --bronze-500: #B8935A;
    --bronze-400: #C9A976;
    --bronze-300: #DBC29A;
    --bronze-200: #EAD9BD;
    --bronze-100: #F5EBD9;
    --bronze-50:  #FAF4E8;

    --charcoal-900: #26241F;
    --charcoal-800: #3A362E;
    --charcoal-700: #4F4A40;
    --charcoal-600: #686156;
    --charcoal-500: #827A6E;
    --charcoal-400: #9E968A;
    --charcoal-300: #BEB7AC;
    --charcoal-200: #D9D3C9;
    --charcoal-100: #EDE9E1;
    --charcoal-50:  #F6F4EF;

    --moss-700: #3A6B4A;
    --moss-600: #4A7C59;
    --moss-500: #6B9979;
    --moss-100: #E5F0E8;
    --moss-50:  #F2F8F3;

    --brick-700: #8B3D3D;
    --brick-600: #A54E4E;
    --brick-500: #C06A6A;
    --brick-100: #F3E0E0;
    --brick-50:  #FAF0F0;

    --clay-700: #8C6034;
    --clay-600: #A87444;
    --clay-500: #C08F5E;
    --clay-100: #F2E4D2;
    --clay-50:  #FBF4E9;

    --sky-700: #3A6072;
    --sky-600: #4A7488;
    --sky-500: #6B8DA0;
    --sky-100: #E0EBF0;

    --primary: var(--sage-700);
    --primary-dark: var(--sage-800);
    --primary-deep: var(--sage-900);
    --primary-light: var(--sage-500);
    --primary-soft: var(--sage-100);
    --primary-ultra: var(--sage-50);
    --primary-border: var(--sage-300);

    --accent: var(--bronze-600);
    --accent-dark: var(--bronze-700);
    --accent-soft: var(--bronze-100);
    --accent-border: var(--bronze-300);

    --success: var(--moss-600);
    --success-dark: var(--moss-700);
    --success-soft: var(--moss-100);
    --success-ultra: var(--moss-50);

    --danger: var(--brick-600);
    --danger-dark: var(--brick-700);
    --danger-soft: var(--brick-100);
    --danger-ultra: var(--brick-50);

    --warning: var(--clay-600);
    --warning-dark: var(--clay-700);
    --warning-soft: var(--clay-100);
    --warning-ultra: var(--clay-50);

    --info: var(--sky-600);
    --info-dark: var(--sky-700);
    --info-soft: var(--sky-100);

    --bg-primary: var(--ivory-100);
    --bg-secondary: var(--ivory-50);
    --bg-card: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-glass: rgba(74, 106, 87, 0.03);
    --bg-glass-light: rgba(74, 106, 87, 0.06);
    --bg-paper: var(--ivory-50);

    --text-primary: var(--charcoal-900);
    --text-secondary: var(--charcoal-600);
    --text-muted: var(--charcoal-500);
    --text-subtle: var(--charcoal-400);
    --text-inverse: #FFFFFF;
    --text-accent: var(--bronze-700);

    --border-color: var(--ivory-300);
    --border-strong: var(--charcoal-200);
    --border-primary: var(--sage-300);
    --border-accent: var(--bronze-300);
    --silver-border: 1px solid var(--border-color);
    --silver-border-strong: 1px solid var(--border-strong);
    --border-warm: 1px solid var(--bronze-200);

    --shadow-xs: 0 1px 2px rgba(58, 54, 46, 0.03);
    --shadow-sm: 0 2px 4px rgba(58, 54, 46, 0.05), 0 1px 2px rgba(58, 54, 46, 0.03);
    --shadow-md: 0 4px 12px rgba(58, 54, 46, 0.06), 0 2px 4px rgba(58, 54, 46, 0.03);
    --shadow-lg: 0 10px 28px rgba(58, 54, 46, 0.08), 0 4px 8px rgba(58, 54, 46, 0.04);
    --shadow-xl: 0 20px 44px rgba(58, 54, 46, 0.1);
    --shadow-sage: 0 6px 18px rgba(74, 106, 87, 0.15);
    --shadow-bronze: 0 4px 12px rgba(166, 124, 69, 0.15);

    --glow-title: 0 0 14px rgba(107, 142, 127, 0.12), 0 1px 0 rgba(255, 255, 255, 0.6);
    --glow-value: 0 0 12px rgba(107, 142, 127, 0.1), 0 1px 0 rgba(255, 255, 255, 0.5);
    --glow-data:  0 0 10px rgba(74, 106, 87, 0.06);
    --glow-badge: 0 0 8px rgba(74, 106, 87, 0.08);

    --radius-card: 14px;
    --radius-small: 10px;
    --radius-tiny: 8px;
    --radius-xs: 6px;
    --radius-pill: 999px;

    --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);

    color-scheme: light;
}

[data-theme="dark"] {
    --bg-primary: #1C1A15;
    --bg-secondary: #24211C;
    --bg-card: #2B2822;
    --bg-elevated: #2B2822;
    --bg-glass: rgba(232, 228, 214, 0.04);
    --bg-glass-light: rgba(232, 228, 214, 0.08);
    --bg-paper: #24211C;

    --text-primary: #EDE9E1;
    --text-secondary: #BEB7AC;
    --text-muted: #9E968A;
    --text-subtle: #827A6E;
    --text-accent: var(--bronze-400);

    --border-color: rgba(190, 183, 172, 0.16);
    --border-strong: rgba(190, 183, 172, 0.28);
    --border-primary: rgba(147, 175, 163, 0.32);
    --border-accent: rgba(201, 169, 118, 0.32);
    --silver-border: 1px solid var(--border-color);
    --silver-border-strong: 1px solid var(--border-strong);

    --primary-soft: rgba(107, 142, 127, 0.14);
    --primary-ultra: rgba(107, 142, 127, 0.06);
    --accent-soft: rgba(184, 147, 90, 0.14);
    --success-soft: rgba(74, 124, 89, 0.14);
    --danger-soft: rgba(165, 78, 78, 0.16);
    --warning-soft: rgba(168, 116, 68, 0.16);

    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.42);
    --shadow-xl: 0 20px 44px rgba(0, 0, 0, 0.5);
    --shadow-sage: 0 6px 18px rgba(74, 106, 87, 0.28);
    --shadow-bronze: 0 4px 12px rgba(166, 124, 69, 0.25);

    --glow-title: 0 0 20px rgba(184, 147, 90, 0.45), 0 0 40px rgba(184, 147, 90, 0.2);
    --glow-value: 0 0 18px rgba(184, 147, 90, 0.4), 0 0 36px rgba(184, 147, 90, 0.15);
    --glow-data:  0 0 12px rgba(201, 169, 118, 0.3);
    --glow-badge: 0 0 10px rgba(184, 147, 90, 0.28);

    color-scheme: dark;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; }

body {
    font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    margin: 0;
    padding: 0 0 96px;
    background-image:
        radial-gradient(circle at 15% 10%, rgba(107, 142, 127, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(184, 147, 90, 0.04) 0%, transparent 40%);
    background-attachment: fixed;
    transition: background 0.3s ease, color 0.3s ease;
    touch-action: pan-y;
    -webkit-font-smoothing: antialiased;
    text-align: center;
    line-height: 1.5;
}

[data-theme="dark"] body {
    background-image:
        radial-gradient(circle at 15% 10%, rgba(107, 142, 127, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(184, 147, 90, 0.06) 0%, transparent 40%);
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
    background: var(--sage-300);
    border-radius: 3px;
}
[data-theme="dark"] ::-webkit-scrollbar-thumb {
    background: var(--sage-600);
}

/* Pull-to-refresh */
.pull-indicator {
    position: fixed;
    top: -60px; left: 0; right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    transition: top 0.2s ease;
    z-index: 50;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    pointer-events: none;
    font-weight: 600;
}
.pull-indicator.active { top: 0; }
.pull-indicator i { margin-left: 8px; color: var(--sage-600); }
.pull-indicator.loading i { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(38, 36, 31, 0.4);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
[data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.65); }
.loading-indicator.show,
.loading-indicator[style*="display: flex"] { display: flex !important; }
.spinner {
    width: 46px;
    height: 46px;
    border: 3px solid rgba(74, 106, 87, 0.15);
    border-top-color: var(--sage-600);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}

.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: var(--clay-600);
    color: #FFFFFF;
    text-align: center;
    padding: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
}
.offline-banner.show { transform: translateY(0); }

.top-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: rgba(253, 252, 248, 0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border-color);
    padding: 14px 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: var(--transition);
}
[data-theme="dark"] .top-bar {
    background: rgba(36, 33, 28, 0.92);
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.top-title h2 {
    font-size: 1.28rem;
    font-weight: 800;
    margin: 0;
    color: var(--charcoal-900);
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-shadow: var(--glow-title);
}
[data-theme="dark"] .top-title h2 { color: var(--ivory-100); }
.top-title h2 i {
    color: var(--sage-700);
    font-size: 1.1rem;
    background: var(--sage-100);
    padding: 8px;
    border-radius: var(--radius-tiny);
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
[data-theme="dark"] .top-title h2 i {
    background: var(--sage-800);
    color: var(--sage-300);
}
.header-actions { display: flex; gap: 8px; align-items: center; }

.icon-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-color);
    background: var(--bg-secondary);
    color: var(--charcoal-600);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1rem;
    position: relative;
}
[data-theme="dark"] .icon-btn {
    background: var(--bg-card);
    border-color: var(--border-color);
    color: var(--text-secondary);
}
.icon-btn:hover, .icon-btn:active {
    background: var(--sage-100);
    border-color: var(--sage-400);
    color: var(--sage-700);
    transform: translateY(-1px);
}
[data-theme="dark"] .icon-btn:hover {
    background: var(--sage-800);
    color: var(--sage-300);
}
.icon-btn:active { transform: scale(0.95); }

.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 12px 44px 12px 18px;
    border-radius: var(--radius-small);
    border: 1px solid var(--border-strong);
    background: var(--bg-card);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    text-align: center;
    font-weight: 600;
    text-shadow: var(--glow-data);
}
.search-input:focus {
    border-color: var(--sage-600);
    box-shadow: 0 0 0 3px var(--sage-100);
}
[data-theme="dark"] .search-input:focus {
    box-shadow: 0 0 0 3px rgba(107, 142, 127, 0.2);
}
.search-input::placeholder { color: var(--text-subtle); text-shadow: none; font-weight: 500; }
.search-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--charcoal-400);
    font-size: 0.9rem;
    pointer-events: none;
}

.filter-chips-wrap {
    background: var(--ivory-200);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-pill);
    padding: 4px;
    display: flex;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    box-shadow: inset 0 1px 2px rgba(58, 54, 46, 0.04);
    position: relative;
}
[data-theme="dark"] .filter-chips-wrap {
    background: rgba(232, 228, 214, 0.06);
    border-color: var(--border-color);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
}
.filter-chips-wrap::-webkit-scrollbar { display: none; }

.filter-chips {
    display: flex;
    gap: 2px;
    justify-content: flex-start;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}
.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
    padding: 9px 15px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--charcoal-500);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    flex-shrink: 0;
    border-radius: var(--radius-pill);
    letter-spacing: 0.1px;
    text-shadow: var(--glow-data);
}
[data-theme="dark"] .filter-chip { color: var(--text-muted); }
.filter-chip i { font-size: 0.74rem; opacity: 0.85; }
.filter-chip:active { transform: scale(0.97); }
.filter-chip:hover {
    color: var(--sage-700);
    background: rgba(255, 255, 255, 0.6);
}
[data-theme="dark"] .filter-chip:hover {
    color: var(--sage-400);
    background: rgba(232, 228, 214, 0.06);
}
.filter-chip.active {
    background: var(--bg-card);
    color: var(--sage-800);
    font-weight: 800;
    border: 1.5px solid var(--sage-500);
    box-shadow:
        0 0 0 2px rgba(107, 142, 127, 0.18),
        0 2px 6px rgba(58, 54, 46, 0.1),
        var(--glow-badge);
    text-shadow: 0 0 8px rgba(61, 90, 76, 0.15);
}
[data-theme="dark"] .filter-chip.active {
    background: var(--bg-card);
    color: var(--bronze-400);
    border-color: var(--bronze-500);
    box-shadow:
        0 0 0 2px rgba(184, 147, 90, 0.25),
        0 2px 6px rgba(0, 0, 0, 0.3),
        var(--glow-badge);
    text-shadow: var(--glow-badge);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 18px 16px 6px;
}

.stat-card {
    position: relative;
    padding: 18px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
}
[data-theme="dark"] .stat-card {
    border-color: var(--border-color);
}
.stat-card::before {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px dashed var(--sage-300);
    border-radius: calc(var(--radius-card) - 5px);
    opacity: 0.55;
    pointer-events: none;
    transition: var(--transition);
}
[data-theme="dark"] .stat-card::before {
    border-color: rgba(147, 175, 163, 0.35);
}
.stat-card::after {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: calc(var(--radius-card) - 5px);
    pointer-events: none;
    background:
        linear-gradient(to right, var(--sage-500) 0, var(--sage-500) 8px, transparent 8px) top left / 100% 1.5px no-repeat,
        linear-gradient(to left, var(--sage-500) 0, var(--sage-500) 8px, transparent 8px) top right / 100% 1.5px no-repeat,
        linear-gradient(to right, var(--sage-500) 0, var(--sage-500) 8px, transparent 8px) bottom left / 100% 1.5px no-repeat,
        linear-gradient(to left, var(--sage-500) 0, var(--sage-500) 8px, transparent 8px) bottom right / 100% 1.5px no-repeat;
    opacity: 0;
    transition: var(--transition);
}
.stat-card:hover::after { opacity: 0.9; }
.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--sage-400);
}
.stat-card:hover::before {
    opacity: 0.9;
    border-color: var(--sage-500);
}
.stat-card:active { transform: scale(0.98); }

.stat-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-tiny);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    background: var(--sage-100);
    color: var(--sage-700);
    margin-bottom: 9px;
    border: 1px solid var(--sage-200);
    position: relative;
    z-index: 1;
}
[data-theme="dark"] .stat-icon {
    background: var(--sage-800);
    color: var(--sage-300);
    border-color: var(--sage-600);
}
.stat-icon.blue { color: var(--sky-700); background: var(--sky-100); border-color: rgba(74, 116, 136, 0.2); }
.stat-icon.green { color: var(--moss-700); background: var(--moss-100); border-color: rgba(74, 124, 89, 0.2); }
.stat-icon.orange { color: var(--bronze-700); background: var(--bronze-100); border-color: var(--bronze-300); }
.stat-icon.purple { color: var(--sage-800); background: var(--sage-100); border-color: var(--sage-300); }

.stat-value {
    font-size: 1.4rem;
    font-weight: 800;
    font-family: 'Inter', 'Cairo', sans-serif;
    letter-spacing: -0.4px;
    line-height: 1.15;
    color: var(--charcoal-900);
    margin: 2px 0 4px;
    direction: ltr;
    text-align: center;
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
    text-shadow: var(--glow-value);
}
[data-theme="dark"] .stat-value { color: var(--ivory-100); }

.stat-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.2px;
    position: relative;
    z-index: 1;
}

.page-container { max-width: 1280px; margin: 0 auto; padding: 0 0 96px; }
.notice-card { display: none !important; }

.data-panel {
    margin: 16px;
    padding: 18px 16px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-xs);
}

.section-title {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-color);
    flex-wrap: wrap;
}
.section-title h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--charcoal-900);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;

            return STATUS_META[s] || { ar: s || '—', cls: 'pending', icon: 'fa-circle' };
        }

        function setDateDefaults() {
            $('reportFrom').value = $('reportFrom').value || today();
            $('reportTo').value = $('reportTo').value || today();
        }
        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            const icon = $('themeIcon');
            if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            if (isDark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            const icon = $('themeIcon');
            if (icon) icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        }

        function renderFilters() {
            const chips = $('filterChips');
            chips.innerHTML = FILTER_TABS.map(t => `
                <button type="button" class="filter-chip ${t.id === 'all' ? 'active' : ''}" data-filter="${t.id}">
                    <i class="fas ${t.icon}"></i><span>${esc(t.label)}</span>
                </button>
            `).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    chips.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                    btn.classList.add('active');
                    state.filter = btn.dataset.filter;
                    applyFilter();
                });
            });
        }
        function renderBottomNav() {
            const nav = $('bottomNav');
            nav.innerHTML = BOTTOM_TOOLS.map(t => `
                <button type="button" class="nav-item" data-tool="${t.id}">
                    <i class="fas ${t.icon}"></i><span>${esc(t.label)}</span>
                </button>
            `).join('');
            nav.querySelectorAll('[data-tool]').forEach(btn => {
                btn.addEventListener('click', () => {
                    nav.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
                    btn.classList.add('active');
                    handleTool(btn.dataset.tool);
                });
            });
        }
        function handleTool(tool) {
            switch (tool) {
                case 'daily': {
                    const todayStr = today();
                    $('reportFrom').value = todayStr;
                    $('reportTo').value = todayStr;
                    $('reportMethod').value = '';
                    $('reportStatus').value = '';
                    openModal(null, 'reportModal');
                    setTimeout(() => generateReport(), 200);
                    break;
                }
                case 'overdue': {
                    state.filter = 'cheque';
                    renderFilters();
                    const chip = $('filterChips').querySelector(`[data-filter="cheque"]`);
                    if (chip) {
                        $('filterChips').querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                        chip.classList.add('active');
                    }
                    applyFilter();
                    toast('تم تصفية دفعات الشيكات');
                    break;
                }
                case 'methods': showQuickStats(); break;
                case 'export': exportData(); break;
                case 'add': openForm(null); break;
            }
        }
        function initViewToggle() {
            const saved = localStorage.getItem('payments_view_mode') || 'cards';
            state.viewMode = saved;
            setViewMode(saved);
            $('viewToggle').querySelectorAll('[data-view-btn]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const mode = btn.dataset.viewBtn;
                    state.viewMode = mode;
                    localStorage.setItem('payments_view_mode', mode);
                    setViewMode(mode);
                    toast(mode === 'table' ? 'تم تفعيل عرض الجدول' : 'تم تفعيل عرض البطاقات');
                });
            });
        }
        function setViewMode(mode) {
            $('viewToggle').querySelectorAll('[data-view-btn]').forEach(b => {
                b.classList.toggle('active', b.dataset.viewBtn === mode);
            });
            $('dataPanel').dataset.view = mode;
        }
        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const methodFilter = state.filter;
            state.filtered = state.rows.filter(row => {
                if (methodFilter && methodFilter !== 'all') {
                    const m = methodKey(row);
                    if (m !== methodFilter) return false;
                }
                if (q) {
                    const text = JSON.stringify(row || {}).toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return true;
            });
            renderCards();
            renderTable();
        }
        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = fmtInt(rows.length);
            const completed = rows.filter(r => statusKey(r) === 'completed').length;
            $('statActive').textContent = fmtInt(completed);
            let totalAmount = 0;
            rows.forEach(r => { totalAmount += numeric(r.amount); });
            $('statTotal').textContent = totalAmount ? fmtNum(totalAmount, 2) : '0';
            $('statUpdated').textContent = state.loadedAt ? fmtTime(state.loadedAt) : '—';
            $('itemCount').textContent = fmtInt(rows.length);
        }

        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>لا توجد نتائج مطابقة للفلتر أو البحث.</p>
                    </div>`;

            }
            box.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);

                const status = statusMeta(row);
                const amount = numeric(row.amount);
                const currency = row.currency_id ? ` #${esc(row.currency_id)}` : '';
                const customerDisplay = row.customer_party_id ? `عميل #${esc(row.customer_party_id)}` : '';
                const saleDisplay = row.sale_id ? `فاتورة #${esc(row.sale_id)}` : '';
                const dateDisplay = row.created_at ? toEnglishDigits(String(row.created_at).slice(0, 16).replace('T', ' ')) : '—';

                const extraFields = [];

                                    ${[customerDisplay, saleDisplay, row.operator ? `المسؤول: ${esc(row.operator)}` : null].filter(Boolean).join(' · ') || '—'}
                                </div>
                            </div>
                            ${amount ? `<div class="card-amount">${fmtNum(amount, 2)}${currency}</div>` : ''}
                        </div>
                        <div class="card-badges">
                            <span class="method-badge ${method}">
                                <i class="fas ${methodMeta.icon}"></i> ${esc(methodLabel(row))}
                            </span>
                            <span class="payment-status ${status.cls}">
                                <i class="fas ${status.icon}"></i> ${esc(status.ar)}
                            </span>
                            <span class="card-date">${esc(dateDisplay)}</span>

            box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.edit))));

        function renderTable() {
            const tbody = $('paymentsTableBody');
            if (!tbody) return;
            if (!state.filtered.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9">
                            <div class="table-empty">
                                <i class="fas fa-inbox" style="font-size:2.5rem;display:block;margin-bottom:12px;color:var(--sage-400);"></i>
                                <div>لا توجد نتائج مطابقة للفلتر أو البحث.</div>
                            </div>
                        </td>
                    </tr>
                `;

            }
            tbody.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const status = statusMeta(row);
                const method = methodClass(row);
                const amount = numeric(row.amount);
                const code = row.payment_code || `#${id}`;

                const sale = row.sale_id ? `#${esc(row.sale_id)}` : '—';

                        <td class="col-amount">${fmtNum(amount, 2)}</td>
                        <td><span class="payment-status ${status.cls}"><i class="fas ${status.icon}"></i> ${esc(status.ar)}</span></td>

            tbody.querySelectorAll('[data-table-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.tableEdit))));
            tbody.querySelectorAll('[data-table-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.tableDelete))));

        function findRow(id) {
            return state.rows.find((row, index) => String(idOf(row) || index) === String(id));
        }
        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            const customerDisplay = row.customer_party_id ? `عميل #${esc(row.customer_party_id)}` : '—';
            const methodMeta = METHOD_META[methodKey(row)];
            const status = statusMeta(row);
            const detailGrid = Object.entries(row).map(([k, v]) => {
                const label = FIELD_LABELS_AR[k] || k;
                let value = v == null ? '—' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
                value = toEnglishDigits(value);
                return `<div class="detail-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
            }).join('');
            $('detailsBody').innerHTML = `
                <div style="text-align:center;margin-bottom:14px;">
                    <div style="display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;">
                        <span class="method-badge ${methodClass(row)}"><i class="fas ${methodMeta?.icon || 'fa-circle'}"></i> ${esc(methodLabel(row))}</span>
                        <span class="payment-status ${status.cls}"><i class="fas ${status.icon}"></i> ${esc(status.ar)}</span>
                    </div>
                    <div style="font-size:1.3rem;font-weight:800;direction:ltr;color:var(--charcoal-900);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-shadow:var(--glow-value);">
                        ${fmtNum(row.amount, 2)}
                    </div>
                    <div style="color:var(--text-muted);font-size:0.78rem;margin-top:4px;">${customerDisplay}</div>
                </div>
                <div class="detail-grid">${detailGrid}</div>
                <details style="margin-top:14px;">
                    <summary style="cursor:pointer;font-size:0.82rem;font-weight:600;color:var(--text-secondary);">عرض JSON الكامل</summary>
                    <pre class="raw-json">${esc(JSON.stringify(row, null, 2))}</pre>
                </details>
            `;
            openModal(null, 'detailsModal');
        }
        function generateAutoCode() {
            const timestamp = Date.now().toString(36).toUpperCase();
            const random = Math.random().toString(36).slice(2, 6).toUpperCase();
            return `PAY-${timestamp}-${random}`;
        }

        /* ============================================================
           ★ بناء حقول النموذج مع:
           - خيارات محددة لكل حقل (SELECT_OPTIONS)
           - بيانات نوع الدفع للفلترة الديناميكية
           ============================================================ */
        function inputHtml(def, row) {
            const key = def.key;
            const label = FIELD_LABELS_AR[key] || def.label || key;
            const value = row && row[key] !== undefined && row[key] !== null ? row[key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const wideAttr = WIDE_FIELDS.has(key) || def.type === 'textarea' ? 'data-wide="true"' : '';
            const paymentTypeAttr = FIELD_PAYMENT_TYPE[key] ? `data-payment-type="${FIELD_PAYMENT_TYPE[key]}"` : '';

            if (REFERENCE_FIELDS[key]) {
                return `
                    <div class="form-group" ${wideAttr} ${paymentTypeAttr}>
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <select class="form-input" data-key="${esc(key)}" data-reference="true" ${req}>
                            <option value="">${value ? `القيمة الحالية: ${esc(value)}` : 'اختر...'}</option>
                        </select>
                    </div>
                `;
            }

            if (def.type === 'select') {
                const options = SELECT_OPTIONS[key] || [];
                const optionsHtml = options.map(opt => {
                    const isSelected = String(value) === opt.value ? ' selected' : '';
                    return `<option value="${esc(opt.value)}"${isSelected}>${esc(opt.label)}</option>`;
                }).join('');
                return `
                    <div class="form-group" ${wideAttr} ${paymentTypeAttr}>
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <select class="form-input" data-key="${esc(key)}" ${req}>
                            <option value="">اختر...</option>
                            ${optionsHtml}
                        </select>
                    </div>
                `;
            }

            if (def.type === 'textarea') {
                return `
                    <div class="form-group full" ${paymentTypeAttr}>
                        <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                        <textarea class="form-input" data-key="${esc(key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea>
                    </div>
                `;
            }

            return `
                <div class="form-group" ${wideAttr} ${paymentTypeAttr}>
                    <label class="form-label">${esc(label)}${def.required ? ' *' : ''}</label>
                    <input class="form-input" data-key="${esc(key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}>
                </div>
            `;
        }

        /* ============================================================
           ★ إظهار/إخفاء الحقول حسب نوع الدفع المحدد
           ============================================================ */
        function updateConditionalFields(paymentType) {
            const form = $('recordForm');
            if (!form) return;
            const type = String(paymentType || '').toLowerCase();
            form.querySelectorAll('[data-payment-type]').forEach(el => {
                const requiredType = (el.dataset.paymentType || '').toLowerCase();
                const isVisible = requiredType === type;
                el.style.display = isVisible ? '' : 'none';
                el.querySelectorAll('input, select, textarea').forEach(input => {
                    if (isVisible) {
                        input.disabled = false;
                    } else {
                        input.disabled = true;
                    }
                });
            });
        }

        function openForm(row = null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').innerHTML = row
                ? '<i class="fas fa-edit"></i> تعديل الدفعة'
                : '<i class="fas fa-plus-circle"></i> إضافة دفعة جديدة';

            const fieldsToRender = (CFG.fields || []).filter(def => {
                if (!row && def.key === 'payment_code') return false;
                return true;
            });

            $('recordForm').innerHTML = fieldsToRender.map(def => inputHtml(def, row)).join('');

            if (row) {
                (CFG.fields || []).forEach(def => {
                    const el = document.querySelector(`#recordForm [data-key="${CSS.escape(def.key)}"]`);
                    if (el && def.type === 'select') el.value = row[def.key] ?? '';
                });
            }

            loadReferenceOptions(row);

            if (!row) {
                $('recordForm').dataset.generatedCode = generateAutoCode();
            }

            // ★ ربط المستمع لتغيير نوع الدفع
            const paymentTypeSelect = $('recordForm').querySelector('[data-key="payment_type"]');
            if (paymentTypeSelect) {
                paymentTypeSelect.addEventListener('change', () => {
                    updateConditionalFields(paymentTypeSelect.value);
                });
                updateConditionalFields(paymentTypeSelect.value);
            }

            openModal(null, 'formModal');

            setTimeout(() => {
                const firstInput = $('recordForm').querySelector('input:not([type="hidden"]), select, textarea');
                if (firstInput) {
                    try { firstInput.focus({ preventScroll: false }); } catch (e) {}
                }
            }, 350);
        }

        async function loadReferenceOptions(row) {
            const selectors = $('recordForm').querySelectorAll('select[data-reference="true"]');
            if (!selectors.length) return;
            for (const select of selectors) {
                const key = select.dataset.key;
                const ref = REFERENCE_FIELDS[key];
                if (!ref) continue;
                try {
                    const options = await fetchReferenceOptions(ref);
                    const currentValue = row && row[key] !== undefined ? String(row[key]) : '';
                    select.innerHTML = '<option value="">اختر...</option>' +
                        options.map(opt => {
                            const isSelected = String(opt.value) === currentValue ? ' selected' : '';
                            return `<option value="${esc(opt.value)}"${isSelected}>${esc(opt.label)}</option>`;
                        }).join('');
                } catch (err) {
                    select.innerHTML = '<option value="">غير متاح حالياً</option>';
                }
            }
        }

        async function fetchReferenceOptions(ref) {
            const cacheKey = `${ref.table}:${ref.filter || ''}`;
            if (state.referenceCache[cacheKey]) return state.referenceCache[cacheKey];
            const candidateMethods = [
                `get${capitalize(ref.table)}`,
                `get${capitalize(ref.table)}Records`,
                `get${capitalize(singularize(ref.table))}`
            ];
            for (const methodName of candidateMethods) {
                if (bridge && typeof bridge[methodName] === 'function') {
                    try {
                        const raw = bridge[methodName]('{}');
                        const parsed = parse(raw);
                        const list = rowsFrom(parsed);
                        const options = list.map(item => ({
                            value: item[ref.value],
                            label: item[ref.label] || item.name_ar || item.name || `${ref.table} #${item[ref.value]}`
                        })).filter(o => o.value != null);
                        state.referenceCache[cacheKey] = options;
                        return options;
                    } catch (err) { /* Try next */ }
                }
            }
            if (ref.table === 'parties' && bridge && typeof bridge.getParties === 'function') {
                try {
                    const type = ref.filter || '';
                    const raw = bridge.getParties(type);
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.commercial_name || item.commercial_name_ar || item.legal_name || `طرف #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) { /* ignore */ }
            }
            if (ref.table === 'currencies' && bridge && typeof bridge.getCurrencies === 'function') {
                try {
                    const raw = bridge.getCurrencies();
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.currency_name_ar || item.currency_name || item.currency_code || `عملة #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) { /* ignore */ }
            }
            if (ref.table === 'banks' && bridge && typeof bridge.getBanks === 'function') {
                try {
                    const raw = bridge.getBanks();
                    const parsed = parse(raw);
                    const list = rowsFrom(parsed);
                    const options = list.map(item => ({
                        value: item.id,
                        label: item.bank_name_ar || item.bank_name || `بنك #${item.id}`
                    })).filter(o => o.value != null);
                    state.referenceCache[cacheKey] = options;
                    return options;
                } catch (err) { /* ignore */ }
            }
            return [];
        }
        function capitalize(s) { return String(s || '').charAt(0).toUpperCase() + String(s || '').slice(1); }
        function singularize(s) { return String(s || '').replace(/ies$/, 'y').replace(/s$/, ''); }

        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                if (el.disabled) return;
                let value = el.value;
                const type = el.type;
                if (type === 'number') value = value === '' ? 0 : Number(value);
                payload[el.dataset.key] = value;
            });
            const generatedCode = $('recordForm').dataset.generatedCode;
            if (generatedCode && !state.editing) {
                payload.payment_code = generatedCode;
            }
            (CFG.fields || []).forEach(def => {
                if (!def.required && payload[def.key] === '') {
                    if (def.type !== 'number') delete payload[def.key];
                }
            });
            return payload;
        }

        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم حفظ الدفعة بنجاح');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحفظ', true);
            } finally {
                setLoading(false);
            }
        }
        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد حذف هذه الدفعة؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم حذف الدفعة');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }
        async function reloadData() {
            if (!CFG.listMethod) { renderCards(); renderTable(); return; }
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                renderCards();
                renderTable();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                renderTable();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }
        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }
        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>اختر الفلاتر ثم اضغط "توليد التقرير".</p>
                </div>`;
            openModal(null, 'reportModal');
        }
        async function generateReport() {
            setLoading(true);
            try {
                const from = $('reportFrom').value || today();
                const to = $('reportTo').value || today();
                const method = $('reportMethod').value;
                const status = $('reportStatus').value;
                const minAmount = $('reportMinAmount').value ? Number($('reportMinAmount').value) : null;
                const maxAmount = $('reportMaxAmount').value ? Number($('reportMaxAmount').value) : null;
                let rows;
                try {
                    const result = await invoke('getPaymentRecords', [JSON.stringify({ limit: 2000 })]);
                    rows = rowsFrom(result);
                } catch (e) { rows = state.rows.slice(); }
                rows = rows.filter(r => {
                    const d = String(r.created_at || '').slice(0, 10);
                    if (!d) return true;
                    if (from && d < from) return false;
                    if (to && d > to) return false;
                    return true;
                });
                if (method) rows = rows.filter(r => methodKey(r) === method);
                if (status) rows = rows.filter(r => statusKey(r) === status);
                if (minAmount !== null) rows = rows.filter(r => numeric(r.amount) >= minAmount);
                if (maxAmount !== null) rows = rows.filter(r => numeric(r.amount) <= maxAmount);
                let totalAmount = 0, completedAmount = 0, pendingAmount = 0;
                rows.forEach(r => {
                    const a = numeric(r.amount);
                    totalAmount += a;
                    const s = statusKey(r);
                    if (s === 'completed') completedAmount += a;
                    if (s === 'pending') pendingAmount += a;
                });
                const summaryHtml = `
                    <div class="report-summary">
                        <div class="report-summary-card">
                            <div class="label">عدد الدفعات</div>
                            <div class="value">${fmtInt(rows.length)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">إجمالي المبالغ</div>
                            <div class="value">${fmtNum(totalAmount, 2)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">مدفوع</div>
                            <div class="value" style="color:var(--moss-700);">${fmtNum(completedAmount, 2)}</div>
                        </div>
                        <div class="report-summary-card">
                            <div class="label">معلق</div>
                            <div class="value" style="color:var(--clay-700);">${fmtNum(pendingAmount, 2)}</div>
                        </div>
                    </div>
                `;
                const tableHtml = rows.length
                    ? `
                        <div class="report-results">
                            <table>
                                <thead>
                                    <tr>
                                        <th>التاريخ</th>
                                        <th>العميل</th>
                                        <th>الطريقة</th>
                                        <th>المبلغ</th>
                                        <th>الحالة</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows.slice(0, 200).map(r => `
                                        <tr>
                                            <td>${esc(toEnglishDigits(String(r.created_at || '').slice(0, 10)))}</td>
                                            <td>${r.customer_party_id ? 'عميل #' + esc(r.customer_party_id) : '—'}</td>
                                            <td>${esc(methodLabel(r))}</td>
                                            <td style="direction:ltr;font-family:'Inter',sans-serif;font-weight:700;text-shadow:var(--glow-value);">${fmtNum(r.amount, 2)}</td>
                                            <td><span class="payment-status ${statusMeta(r).cls}">${esc(statusMeta(r).ar)}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `
                    : `<div class="empty-state"><i class="fas fa-search"></i><p>لا توجد نتائج مطابقة للفلاتر.</p></div>`;
                $('reportResults').innerHTML = summaryHtml + tableHtml;
                state._reportRows = rows;
                toast('تم توليد التقرير بنجاح');
            } catch (error) {
                toast(error.message || 'فشل توليد التقرير', true);
            } finally { setLoading(false); }
        }
        function printReport() {
            try {
                if (bridge && typeof bridge.printCurrentPage === 'function') bridge.printCurrentPage();
                else window.print();
            } catch (e) { window.print(); }
        }
        function showQuickStats() {
            const rows = state.filtered.length ? state.filtered : state.rows;
            const byMethod = {};
            let total = 0;
            rows.forEach(r => {
                const m = methodKey(r) || 'other';
                const a = numeric(r.amount);
                byMethod[m] = (byMethod[m] || 0) + a;
                total += a;
            });
            const entries = Object.entries(byMethod).sort((a, b) => b[1] - a[1]);
            $('quickStatsBody').innerHTML = entries.length
                ? `
                    <div class="report-summary" style="grid-template-columns:1fr;">
                        <div class="report-summary-card">
                            <div class="label">الإجمالي العام</div>
                            <div class="value">${fmtNum(total, 2)}</div>
                        </div>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
                        ${entries.map(([m, amount]) => {
                            const meta = METHOD_META[m] || { ar: m || 'أخرى', icon: 'fa-circle' };
                            const pct = total > 0 ? ((amount / total) * 100).toFixed(1) : '0';
                            return `
                                <div style="background:var(--ivory-100);border:1px solid var(--border-color);border-radius:var(--radius-small);padding:12px;">
                                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;">
                                        <span class="method-badge ${m}"><i class="fas ${meta.icon}"></i> ${esc(meta.ar)}</span>
                                        <span style="font-weight:800;direction:ltr;font-family:'Inter',sans-serif;color:var(--charcoal-900);font-variant-numeric:tabular-nums;text-shadow:var(--glow-value);">${fmtNum(amount, 2)}</span>
                                    </div>
                                    <div style="height:6px;background:var(--ivory-200);border-radius:3px;overflow:hidden;">
                                        <div style="height:100%;width:${pct}%;background:var(--sage-600);border-radius:3px;transition:width 0.5s ease;"></div>
                                    </div>
                                    <div style="text-align:left;font-size:0.7rem;color:var(--text-muted);margin-top:4px;font-variant-numeric:tabular-nums;">${toEnglishDigits(pct)}%</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `
                : `<div class="empty-state"><i class="fas fa-chart-pie"></i><p>لا توجد بيانات لعرضها.</p></div>`;
            openModal(null, 'quickStatsModal');
        }
        function exportData() {
            const rows = (state._reportRows && state._reportRows.length) ? state._reportRows : state.filtered;
            if (!rows.length) { toast('لا توجد بيانات لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const header = keys.map(k => FIELD_LABELS_AR[k] || k);
            const csvRows = [header];
            rows.forEach(row => {
                csvRows.push(keys.map(k => {
                    const v = row[k];
                    return v == null ? '' : String(v).replace(/"/g, '""');
                }));
            });
            const csv = '\ufeff' + csvRows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `payments_report_${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
            toast('تم إنشاء ملف CSV بنجاح');
        }
        function toggleSidebar(open) {
            const sidebar = $('sidebar');
            const toggle = $('sidebarToggle');
            const overlay = $('sidebarOverlay');
            const isOpen = typeof open === 'boolean' ? open : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            overlay.classList.toggle('show', isOpen);
            toggle.classList.toggle('hidden', isOpen);
        }
        function goHome() { window.location.href = '../main.html'; }
        function initSidebar() {
            const toggle = $('sidebarToggle');
            const sidebar = $('sidebar');
            const overlay = $('sidebarOverlay');
            toggle.addEventListener('click', () => toggleSidebar());
            overlay.addEventListener('click', () => toggleSidebar(false));
            sidebar.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.action;
                    toggleSidebar(false);
                    setTimeout(() => {
                        switch (action) {
                            case 'refresh': reloadData(); break;
                            case 'report': openReport(); break;
                            case 'export': exportData(); break;
                            case 'print': printReport(); break;
                            case 'home': goHome(); break;
                        }
                    }, 180);
                });
            });
        }
        function initKeyboardHandlers() {
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                    toggleSidebar(false);
                }
            });
            history.pushState({ page: 'payments' }, '', location.href);
            window.addEventListener('popstate', () => {
                const anyModalOpen = Array.from(document.querySelectorAll('.modal-overlay')).some(x => x.classList.contains('show'));
                const sidebarOpen = $('sidebar').classList.contains('open');
                if (anyModalOpen || sidebarOpen) {
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                    toggleSidebar(false);
                    history.pushState({ page: 'payments' }, '', location.href);
                } else { goHome(); }
            });
        }
        function initUI() {
            const search = $('searchInput');
            search.addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('saveBtn').addEventListener('click', saveForm);
            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', () => {
                    const stat = card.dataset.stat;
                    if (stat === 'total' || stat === 'completed') showQuickStats();
                    else if (stat === 'count' || stat === 'updated') reloadData();
                });
            });
        }
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm,
            saveForm, openModal, closeModal, generateReport,
            printReport, showQuickStats
        });
        applyTheme();
        renderFilters();
        renderBottomNav();
        initViewToggle();
        initSidebar();
        initKeyboardHandlers();
        initUI();
        if (bridge) { reloadData(); }
        else {
            $('offlineBanner').classList.add('show');
            renderCards();
            renderTable();
        }
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
