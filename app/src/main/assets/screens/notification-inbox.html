<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صندوق الإشعارات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <script src="file:///android_asset/assets-local/js/jspdf.umd.min.js"></script>
    <style>
/* ============================================================
   نظام الألوان — وضع فاتح افتراضي + وضع مظلم مخفف
   إطار فضي رفيع (1px) على جميع البطاقات والحقول
   ============================================================ */
:root {
    /* ═══ الوضع الفاتح (افتراضي) ═══ */
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;

    /* إطار فضي رفيع موحّد */
    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

    --emerald-primary: #059669;
    --emerald-dark: #047857;
    --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

    --success: #059669;
    --danger: #dc2626;
    --warning: #d97706;
    --info: #2563eb;
    --purple: #7c3aed;

    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;

    color-scheme: light;

    /* ═══ Aliases متوافقة مع الأنماط القديمة ═══ */
    --bg-color: var(--bg-primary);
    --surface-color: var(--bg-glass);
    --surface-elevated: var(--bg-secondary);
    --primary-color: var(--gold-primary);
    --primary-dim: rgba(200, 154, 18, 0.12);
    --accent-color: var(--gold-primary);
    --accent-dim: rgba(200, 154, 18, 0.12);
    --text-color: var(--text-primary);
    --border-style: solid;
    --border-width: 1px;
    --glass-bg: var(--bg-card);
    --card-hover-bg: var(--bg-glass-light);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--gold-primary);
    --modal-border-color: var(--silver-border-color);
    --modal-border-style: solid;
    --input-bg: var(--bg-glass);
    --input-border: var(--silver-border-color);
    --input-border-style: solid;
    --data-text-color: var(--text-primary);
    --data-text-muted: var(--text-secondary);
    --skeleton-bg: rgba(0, 0, 0, 0.05);
    --skeleton-shine: rgba(0, 0, 0, 0.08);
    --fab-shadow: rgba(200, 154, 18, 0.3);

    /* قنوات الإشعارات */
    --channel-sms: #2563eb;
    --channel-email: #059669;
    --channel-push: #d97706;
    --channel-inapp: #7c3aed;
    /* الأولويات */
    --priority-low: #8391a5;
    --priority-normal: #2563eb;
    --priority-high: #d97706;
    --priority-urgent: #dc2626;
}

/* ═══ الوضع المظلم المخفّف ═══ */
[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);

    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

    --emerald-primary: #10b981;
    --emerald-dark: #059669;
    --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --purple: #9b59b6;

    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;

    color-scheme: dark;

    --skeleton-bg: rgba(255, 255, 255, 0.05);
    --skeleton-shine: rgba(255, 255, 255, 0.08);
    --fab-shadow: rgba(245, 200, 66, 0.3);

    --channel-sms: #3b82f6;
    --channel-email: #10b981;
    --channel-push: #f59e0b;
    --channel-inapp: #9b59b6;
    --priority-low: #94a3b8;
    --priority-normal: #3b82f6;
    --priority-high: #f59e0b;
    --priority-urgent: #ef4444;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 0 0 90px 0;
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: pan-y;
}
[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

/* ============================================================
   Loading
   ============================================================ */
.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
[data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
.loading-indicator.show, .loading-indicator[style*="display: flex"] { display: flex !important; }
.spinner {
    width: 56px;
    height: 56px;
    border: 4px solid rgba(200, 154, 18, 0.15);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   Offline Banner
   ============================================================ */
.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning), var(--gold-primary));
    color: #ffffff;
    text-align: center;
    padding: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
    border-bottom: var(--silver-border-strong);
    box-shadow: var(--silver-shadow);
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: var(--header-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: var(--silver-border);
    padding: 14px 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    transition: var(--transition);
}
.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
.top-title h2 {
    font-size: 1.45rem;
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.top-title h2 i {
    -webkit-text-fill-color: initial;
    color: var(--gold-primary);
}
.header-actions { display: flex; gap: 10px; align-items: center; }

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1rem;
    position: relative;
    box-shadow: var(--silver-shadow);
}
.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    transform: translateY(-2px);
    box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn.has-badge::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--danger);
    animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
}

/* البحث */
.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 12px 44px 12px 16px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
}
.search-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
.search-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.9rem;
    pointer-events: none;
}

/* شرائح الفلتر */
.filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.filter-chip.active {
    background: var(--gold-primary);
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
}

/* ============================================================
   بطاقات الإحصائيات
   ============================================================ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 24px;
}
.stat-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 18px 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}
.stat-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
}
.stat-card:active { transform: scale(0.97); }
.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    margin-bottom: 10px;
    border: var(--silver-border);
}
.stat-icon.blue { color: var(--info); background: rgba(37, 99, 235, 0.1); }
.stat-icon.green { color: var(--emerald-primary); background: rgba(5, 150, 105, 0.1); }
.stat-icon.orange { color: var(--warning); background: rgba(217, 119, 6, 0.1); }
.stat-icon.red { color: var(--danger); background: rgba(220, 38, 38, 0.1); }
.stat-icon.purple { color: var(--purple); background: rgba(124, 58, 237, 0.1); }
.stat-value {
    font-size: 1.75rem;
    font-weight: 900;
    font-family: 'Inter', 'Arial', sans-serif;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--text-primary);
    margin: 4px 0 2px;
    direction: ltr;
}
.stat-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 700;
}
@media (max-width: 992px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
    .stat-card { padding: 12px 10px; }
    .stat-value { font-size: 1.15rem; }
    .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
}

/* ============================================================
   عنوان القسم
   ============================================================ */
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 12px !important;
}
.section-title h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
}
.count-badge {
    background: var(--gold-primary) !important;
    color: #ffffff !important;
    padding: 3px 12px !important;
    border-radius: 30px !important;
    font-size: 0.75rem !important;
    font-weight: 900 !important;
    border: var(--silver-border);
}

/* ============================================================
   بطاقات الإشعارات
   ============================================================ */
.cards-container {
    padding: 0 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    touch-action: pan-y;
}

.notification-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px 18px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
    touch-action: pan-y;
}
.notification-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: var(--gold-primary);
    opacity: 0.7;
    transition: var(--transition);
}
.notification-card:hover {
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 8px 28px rgba(200, 154, 18, 0.12);
    transform: translateY(-2px);
}
.notification-card:hover::before { opacity: 1; width: 6px; }
.notification-card.selected {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 2px rgba(200, 154, 18, 0.25), var(--silver-shadow), var(--shadow-card);
}
.notification-card.selected::before { background: var(--gold-dark); opacity: 1; }
.notification-card:active { transform: scale(0.98); }
.notification-card.unread {
    border-color: var(--gold-primary);
    background: rgba(200, 154, 18, 0.06);
}
.notification-card.unread::before {
    background: var(--gold-primary);
    opacity: 1;
    box-shadow: 0 0 10px rgba(200, 154, 18, 0.4);
}

.notification-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 10px;
    flex-wrap: wrap;
}
.notification-card .card-title {
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--text-primary);
    flex: 1;
    text-align: right;
    display: flex;
    align-items: center;
    gap: 8px;
}
.notification-card .card-badges {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

/* الشارات */
.notification-card .badge {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.62rem;
    font-weight: 700;
    border: var(--silver-border);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}

.badge-unread { background: rgba(200, 154, 18, 0.12); color: var(--gold-primary); }
.badge-read { background: rgba(107, 114, 128, 0.1); color: var(--text-muted); }
.badge-priority-low { background: rgba(131, 145, 165, 0.12); color: var(--priority-low); }
.badge-priority-normal { background: rgba(37, 99, 235, 0.12); color: var(--priority-normal); }
.badge-priority-high { background: rgba(217, 119, 6, 0.12); color: var(--priority-high); }
.badge-priority-urgent { background: rgba(220, 38, 38, 0.12); color: var(--priority-urgent); }
.badge-channel-sms { background: rgba(37, 99, 235, 0.12); color: var(--channel-sms); }
.badge-channel-email { background: rgba(5, 150, 105, 0.12); color: var(--channel-email); }
.badge-channel-push { background: rgba(217, 119, 6, 0.12); color: var(--channel-push); }
.badge-channel-inapp { background: rgba(124, 58, 237, 0.12); color: var(--channel-inapp); }
.badge-status-pending { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
.badge-status-queued { background: rgba(37, 99, 235, 0.12); color: var(--info); }
.badge-status-sent { background: rgba(5, 150, 105, 0.12); color: var(--success); }
.badge-status-failed { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
.badge-status-cancelled { background: rgba(107, 114, 128, 0.1); color: var(--text-muted); }
.badge-status-read { background: rgba(5, 150, 105, 0.12); color: var(--success); }

.notification-card .card-body {
    margin: 8px 0 10px;
}
.notification-card .card-body .message-preview {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-align: center;
    padding: 8px 10px;
    background: var(--bg-glass);
    border: var(--silver-border);
    border-radius: 10px;
}
.notification-card .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 600;
}
.notification-card .card-footer i { color: var(--gold-primary); }

.notification-card .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}
.notification-card .card-actions .card-btn {
    flex: 1;
    min-width: 80px;
    padding: 9px 8px;
    border-radius: 10px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: var(--transition);
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.notification-card .card-actions .card-btn:active { transform: scale(0.95); }
.notification-card .card-actions .card-btn:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    background: var(--bg-glass-light);
    transform: translateY(-2px);
}
.notification-card .card-actions .card-btn.primary {

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {

    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary);
    color: #ffffff;
    width: 40px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer;
    z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: var(--transition);
    border: var(--silver-border);
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
.sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
.sidebar {
    position: fixed;
    top: 50%;
    right: -140px;
    transform: translateY(-50%);
    width: 110px;
    background: var(--sidebar-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 999;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    padding: 12px 10px;
    border-radius: 18px 0 0 18px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    border: var(--silver-border);
    opacity: 0;
}
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 8px; }
.sidebar-btn {
    background: var(--bg-glass);
    border: var(--silver-border);
    padding: 12px 6px;
    border-radius: 12px;
    color: var(--text-secondary);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 72px;
    text-align: center;
    font-size: 0.85rem;
    font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.sidebar-btn:active { transform: scale(0.92); }
.sidebar-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);

}
.sidebar-btn i { font-size: 1.5rem; color: var(--gold-primary); }

/* زر الرجوع داخل السايدبار */
.sidebar-btn[onclick*="goToDashboard"] {

    border-color: var(--danger) !important;
    color: var(--danger) !important;
}
.sidebar-btn[onclick*="goToDashboard"]:hover {
    background: var(--danger) !important;
    color: #ffffff !important;
}

/* ============================================================
   Bottom Navigation
   ============================================================ */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: var(--silver-border-strong);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300;
    overflow-x: auto;
    scrollbar-width: none;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 6px 10px;
    position: relative;
    touch-action: manipulation;
    flex: 1;
    min-width: 90px;
}
.bottom-nav .nav-item:active { transform: scale(0.9); }
.bottom-nav .nav-item i {
    font-size: 20px;
    transition: var(--transition);
}
.bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
.bottom-nav .nav-item.active { color: var(--gold-primary); }
.bottom-nav .nav-item.active i {
    transform: translateY(-3px);
    text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
}
.bottom-nav .nav-item.active::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: var(--gold-primary);
    border-radius: 10px;
}

/* ============================================================
   Modals
   ============================================================ */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 950;
    display: none;
    opacity: 0;
    transition: opacity 0.3s;
    overflow-y: auto;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
[data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.82); }
.modal-overlay.show { display: flex; opacity: 1; }
.modal {
    background: var(--bg-secondary);
    border-radius: var(--radius-card);
    width: 100%;
    max-width: 620px;
    margin: 0;
    padding: 26px 28px;
    border: var(--silver-border-strong);
    box-shadow: var(--silver-shadow), var(--shadow-card);
    max-height: 92vh;
    overflow-y: auto;
    transform: scale(0.95);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: var(--silver-border);
    padding-bottom: 14px;
}
.modal-title {
    font-size: 1.15rem;
    font-weight: 900;
    color: var(--gold-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    flex: 1;
}
.modal-close {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 1.05rem;
    box-shadow: var(--silver-shadow);
}
.modal-close:hover {
    background: var(--danger);
    color: #ffffff;
    border-color: var(--danger);
}
.modal-close:active { transform: scale(0.9); }
.modal-body {
    max-height: 65vh;
    overflow-y: auto;
}
.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: var(--silver-border);
}
.modal-actions .submit-btn,
.modal-actions .btn-secondary { flex: 1; }

/* مودال الجدول */
.modal-table .modal { max-width: 760px; }
.modal-body table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 6px;
    font-size: 0.8rem;
}
.modal-body table th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    font-weight: 800;
    border: var(--silver-border);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-radius: 10px 10px 0 0;
}
.modal-body table td {
    padding: 12px;
    border: var(--silver-border);
    text-align: center;
    color: var(--text-secondary);
    background: var(--bg-glass);
    vertical-align: middle;
    transition: var(--transition);
}
.modal-body table tr:hover td {
    background: var(--bg-glass-light);
    color: var(--text-primary);
}

/* ============================================================
   أزرار
   ============================================================ */
.submit-btn {
    padding: 13px 20px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    background: var(--gold-primary);
    color: #ffffff;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--silver-shadow);
    flex: 2;
}
.submit-btn:hover {
    background: var(--gold-dark);
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: var(--silver-shadow), 0 6px 20px rgba(200, 154, 18, 0.3);
}
.submit-btn:active { transform: scale(0.97); }
.submit-btn.danger {
    background: var(--danger);
    border-color: #b91c1c;
}
.submit-btn.danger:hover { background: #b91c1c; }

.btn-secondary {
    padding: 13px 20px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--silver-shadow);
    flex: 1;
}
.btn-secondary:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    background: var(--bg-glass-light);
    transform: translateY(-2px);
}
.btn-secondary:active { transform: scale(0.97); }

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 14px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
    min-width: 220px;
    font-size: 0.85rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--emerald-primary); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    background: rgba(200, 154, 18, 0.12);
    color: var(--gold-primary);
    border: var(--silver-border);
}
.toast.success .toast-icon { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
.toast.error .toast-icon { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
.toast.warning .toast-icon { background: rgba(217, 119, 6, 0.12); color: var(--warning); }

/* ============================================================
   Skeleton
   ============================================================ */
.skeleton-card {
    background: var(--bg-card) !important;
    border: var(--silver-border-strong) !important;
    border-radius: var(--radius-card) !important;
    box-shadow: var(--silver-shadow);
}
.skeleton-row {
    background: var(--skeleton-bg) !important;
    position: relative;
    overflow: hidden;
}
.skeleton-row::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
    animation: skeleton-shine 1.5s infinite;
}
@keyframes skeleton-shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}

/* ============================================================
   الرسوم المتحركة
   ============================================================ */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-up { animation: fadeUp 0.5s ease forwards; }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 768px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }
    .stat-card { padding: 12px; }
    .stat-value { font-size: 1.2rem; }
    .cards-container { padding: 0 12px 16px; }
    .bottom-nav .nav-item i { font-size: 16px; }
    .bottom-nav .nav-item span { font-size: 0.7rem; }
    .sidebar { width: 100px; padding: 10px 8px; }
    .sidebar-btn { min-height: 62px; font-size: 0.78rem; }
    .sidebar-btn i { font-size: 1.3rem; }

    .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
    .modal { padding: 20px 16px; max-width: 100%; margin: 10px; }
    .modal-actions { flex-direction: column; }
    .modal-actions .submit-btn,
    .modal-actions .btn-secondary { width: 100%; }
    .top-bar { padding: 12px 14px 10px; }
    .section-title { padding: 0 16px 12px !important; }
}

@media (max-width: 480px) {
    .stats-grid { gap: 8px; padding: 10px; }
    .stat-card { padding: 10px; }
    .stat-value { font-size: 1rem; }
    .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
    .bottom-nav .nav-item { padding: 4px 4px; min-width: 70px; }
    .bottom-nav .nav-item i { font-size: 15px; }
    .bottom-nav .nav-item span { font-size: 0.62rem; }
    .modal { padding: 16px 12px; }
    .notification-card { padding: 14px; }

}

        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="tableModalTitle">📊 البيانات</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="tableModalBody">
                <!-- يتم تعبئتها بواسطة JavaScript -->
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()" style="width:100%;">
                    <i class="fas fa-times"></i> إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    Toast إشعارات
    ============================================================ -->
    <div class="toast" id="toast">
        <div class="toast-icon"><i class="fas fa-check"></i></div>
        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <!-- ============================================================
    JavaScript المتكامل
    ============================================================ -->
    <script>
        // ============================================================
        // 1. Android Bridge – من MainActivity.kt
        // ============================================================
        function apiCall(action, params = {}) {
            return new Promise((resolve, reject) => {
                try {
                    const bridge = window.AndroidInterface;
                    if (!bridge) throw new Error('AndroidInterface غير متاح');
                    let raw;
                    switch (action) {
                        case 'getNotifications': raw = bridge.getNotifications(); break;
                        case 'getCurrentUser': raw = bridge.getCurrentUser(); break;
                        case 'markNotificationRead': raw = bridge.markNotificationRead(Number(params?.id || 0)); break;
                        default: throw new Error('إجراء غير مدعوم: ' + action);
                    }
                    resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
                } catch (error) {
                    reject({ success: false, error: error?.message || 'تعذر تنفيذ العملية' });
                }
            });
        }

        // ============================================================
        // 2. حالة WebView
        // ============================================================
        let isOnline = true;

        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            const bridgeAvailable = typeof window.AndroidInterface !== 'undefined' && !!window.AndroidInterface;
            isOnline = bridgeAvailable;
            if (!bridgeAvailable) {
                banner.classList.add('show');
                showToast('⚠️ قاعدة بيانات التطبيق غير متاحة داخل WebView', 'warning');
            } else {
                banner.classList.remove('show');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ============================================================
        // 3. Haptic Feedback
        // ============================================================
        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(20);
                    else if (type === 'error') navigator.vibrate([30, 50, 30]);
                    else if (type === 'light') navigator.vibrate(10);
                }
            } catch (e) { /* تجاهل */ }
        }

        // ============================================================
        // 6. دوال مساعدة
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;
            if (type === 'success') { iconEl.className = 'fas fa-check'; hapticFeedback('success'); }
            else if (type === 'error') { iconEl.className = 'fas fa-times'; hapticFeedback('error'); }
            else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle'; hapticFeedback('light'); }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getChannelLabel(channel) {
            const map = {
                'sms': '💬 SMS',
                'email': '📧 Email',
                'push': '🔔 Push',
                'in_app': '📱 In-App'
            };
            return map[channel] || channel || 'غير محدد';
        }

        function getChannelClass(channel) {
            const map = {
                'sms': 'sms',
                'email': 'email',
                'push': 'push',
                'in_app': 'inapp'
            };
            return map[channel] || 'default';
        }

        function getPriorityLabel(priority) {
            const map = {
                'low': 'منخفضة',
                'normal': 'عادية',
                'high': 'عالية',
                'urgent': 'عاجلة'
            };
            return map[priority] || priority || 'عادية';
        }

        function getPriorityClass(priority) {
            const map = {
                'low': 'low',
                'normal': 'normal',
                'high': 'high',
                'urgent': 'urgent'
            };
            return map[priority] || 'normal';
        }

        function getStatusLabel(status) {
            const map = {
                'pending': 'معلقة',
                'queued': 'في الانتظار',
                'sent': 'مرسلة',
                'failed': 'فاشلة',
                'read': 'مقروءة',
                'cancelled': 'ملغية'
            };
            return map[status] || status || 'غير محدد';
        }

        function getStatusClass(status) {
            const map = {
                'pending': 'pending',
                'queued': 'queued',
                'sent': 'sent',
                'failed': 'failed',
                'read': 'read',
                'cancelled': 'cancelled'
            };
            return map[status] || 'pending';
        }

        function isExpired(expiresAt) {
            if (!expiresAt) return false;
            const expiry = new Date(expiresAt);
            return expiry < new Date();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '---';
            try {
                const d = new Date(dateStr);
                return d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
            } catch (e) { return dateStr; }
        }

        // ============================================================
        // 7. نظام تبديل الوضع
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            const icon = document.getElementById('themeIcon');
            if (saved === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // ============================================================
        // 8. متغيرات الحالة
        // ============================================================
        let currentFilter = 'all';
        let allNotifications = [];
        let isInitialLoad = true;
        let currentUserId = 0;
        let currentUserRole = '';

        // ============================================================
        // 9. تحميل البيانات
        // ============================================================
        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card" style="background:var(--bg-card);border-radius:var(--radius-card);padding:16px;border:var(--silver-border-strong);position:relative;overflow:hidden;box-shadow:var(--silver-shadow);">
                        <div style="display:flex;align-items:center;margin-bottom:12px;">
                            <div style="width:48px;height:48px;border-radius:14px;background:var(--skeleton-bg);flex-shrink:0;margin-left:12px;"></div>
                            <div style="flex:1;">
                                <div class="skeleton-row long" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                                <div class="skeleton-row medium" style="height:12px;background:var(--skeleton-bg);border-radius:6px;width:60%;"></div>
                            </div>
                        </div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div style="display:flex;gap:10px;margin-top:12px;">
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:10px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:10px;"></div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = `<div class="skeleton-grid" style="display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;">${skeleton}</div>`;
        }

        async function getCurrentUser() {
            try {
                const result = await apiCall('getCurrentUser', {});
                if (result.success && result.data) {
                    currentUserId = result.data.user_id || 0;
                    currentUserRole = result.data.role || '';
                    return result.data;
                }
                return null;
            } catch (e) {
                console.warn('getCurrentUser failed:', e);
                return null;
            }
        }

        async function loadNotifications() {
            if (isInitialLoad) renderSkeleton();

            showLoading(true);
            try {
                // جلب المستخدم الحالي للحصول على user_id
                await getCurrentUser();

                // جلب الإشعارات عبر Android Bridge – الدالة getNotifications من MainActivity.kt
                const result = await apiCall('getNotifications', {});
                if (result.success && result.data) {
                    allNotifications = result.data;
                } else {
                    throw new Error(result?.error || result?.message || 'تعذر تحميل الإشعارات');
                }

                if (allNotifications.length === 0) {
                    showToast('⚠️ لا توجد إشعارات', 'warning');
                }

            } catch (e) {
                allNotifications = [];
                showToast('❌ ' + (e?.message || 'تعذر تحميل الإشعارات من قاعدة بيانات التطبيق'), 'error');
            }

            renderCards();
            updateStats();
            isInitialLoad = false;
            showLoading(false);
        }

        // ============================================================
        // 10. عرض البطاقات
        // ============================================================
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allNotifications];

            // تطبيق الفلتر
            if (currentFilter === 'unread') {
                filtered = filtered.filter(n => n.is_read == 0 || n.is_read === false);
            } else if (currentFilter === 'read') {
                filtered = filtered.filter(n => n.is_read == 1 || n.is_read === true);
            } else if (currentFilter === 'urgent') {
                filtered = filtered.filter(n => (n.priority || '').toLowerCase() === 'urgent');
            } else if (currentFilter === 'high') {
                filtered = filtered.filter(n => (n.priority || '').toLowerCase() === 'high');
            } else if (['sms', 'email', 'push', 'in_app'].includes(currentFilter)) {
                filtered = filtered.filter(n => (n.channel || '').toLowerCase() === currentFilter);
            }

            // تطبيق البحث
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(n => {
                    const title = (n.title || '').toLowerCase();
                    const titleAr = (n.title_ar || '').toLowerCase();
                    const message = (n.message || '').toLowerCase();
                    const messageAr = (n.message_ar || '').toLowerCase();
                    const type = (n.notification_type || '').toLowerCase();
                    return title.includes(searchQuery) || titleAr.includes(searchQuery) ||
                        message.includes(searchQuery) || messageAr.includes(searchQuery) ||
                        type.includes(searchQuery);
                });
            }

            document.getElementById('notificationCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>لا توجد إشعارات مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((n, idx) => {
                const id = n.id;
                const title = n.title || n.title_ar || 'إشعار';
                const message = n.message || n.message_ar || 'لا يوجد محتوى';
                const isRead = n.is_read == 1 || n.is_read === true;
                const priority = n.priority || 'normal';
                const channel = n.channel || 'in_app';
                const status = n.status || 'pending';
                const createdAt = n.created_at || '---';
                const expiresAt = n.expires_at || null;
                const actionUrl = n.action_url || null;
                const actionText = n.action_text || 'فتح';
                const notificationType = n.notification_type || 'info';

                const priorityLabel = getPriorityLabel(priority);
                const priorityClass = getPriorityClass(priority);
                const channelLabel = getChannelLabel(channel);
                const channelClass = getChannelClass(channel);
                const statusLabel = getStatusLabel(status);
                const statusClass = getStatusClass(status);
                const expired = isExpired(expiresAt);

                const unreadClass = !isRead ? 'unread' : '';

                let icon = 'fa-bell';
                if (notificationType === 'info') icon = 'fa-info-circle';
                else if (notificationType === 'warning') icon = 'fa-exclamation-triangle';
                else if (notificationType === 'success') icon = 'fa-check-circle';
                else if (notificationType === 'error') icon = 'fa-times-circle';

                return `
                    <div class="notification-card animate-fade-up ${unreadClass}" style="animation-delay:${idx*0.04}s" data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <div class="card-title"><i class="fas ${icon}" style="color:${priority === 'urgent' ? 'var(--danger)' : 'var(--gold-primary)'};margin-left:6px;"></i> ${escapeHtml(title)}</div>
                            <div class="card-badges">
                                ${!isRead ? `<span class="badge badge-unread">جديد</span>` : `<span class="badge badge-read">مقروء</span>`}
                                <span class="badge badge-priority-${priorityClass}">${priorityLabel}</span>
                                <span class="badge badge-channel-${channelClass}">${channelLabel}</span>
                                ${expired ? `<span class="badge badge-status-cancelled">منتهي</span>` : ''}
                                <span class="badge badge-status-${statusClass}">${statusLabel}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="message-preview">${escapeHtml(message)}</div>
                        </div>
                        <div class="card-footer">
                            <span><i class="far fa-clock"></i> ${formatDate(createdAt)}</span>
                            ${expiresAt ? `<span>⏳ ينتهي: ${formatDate(expiresAt)}</span>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); viewNotification(${id})">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                            ${!isRead ? `
                            <button class="card-btn primary" onclick="event.stopPropagation(); markAsRead(${id})">
                                <i class="fas fa-check"></i> تعليم كمقروء
                            </button>
                            ` : ''}
                            ${actionUrl ? `
                            <button class="card-btn" onclick="event.stopPropagation(); executeAction('${actionUrl}')">
                                <i class="fas fa-external-link-alt"></i> ${escapeHtml(actionText)}
                            </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.notification-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hapticFeedback('light');
        }

        // ============================================================
        // 11. تحديث الإحصائيات
        // ============================================================
        function updateStats() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            const read = total - unread;
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statUnread').textContent = unread;
            document.getElementById('statRead').textContent = read;
            document.getElementById('statUrgent').textContent = urgent;
        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'success');
        }

        // ============================================================
        // 12. البحث والفلاتر
        // ============================================================
        function handleSearch(query) { renderCards(); }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
            hapticFeedback('light');
        }

        // ============================================================
        // 13. التنبيهات (إشعارات)
        // ============================================================
        function generateAlerts() {
            const alerts = [];
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false);
            if (unread.length > 0) {
                alerts.push({
                    type: 'warning',
                    icon: 'fa-circle',
                    title: '📬 إشعارات غير مقروءة',
                    desc: unread.length + ' إشعار غير مقروء',
                    time: 'الآن'
                });
            }
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent' && (n.is_read == 0 || n.is_read === false));
            if (urgent.length > 0) {
                alerts.push({
                    type: 'danger',
                    icon: 'fa-exclamation-triangle',
                    title: '🚨 إشعارات عاجلة غير مقروءة',
                    desc: urgent.length + ' إشعار عاجل',
                    time: 'الآن'
                });
            }
            renderAlerts(alerts);
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            if (!container) return;
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = alerts.slice(0, 3).map((a, i) => `
                <div class="alert-item ${a.type}" style="animation-delay:${i*0.1}s;padding:10px 16px;background:var(--bg-card);border-radius:12px;margin-bottom:8px;border:var(--silver-border-strong);display:flex;align-items:center;gap:10px;box-shadow:var(--silver-shadow);">
                    <div class="alert-icon" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;${a.type === 'danger' ? 'background:rgba(220,38,38,0.12);color:var(--danger);border:var(--silver-border);' : 'background:rgba(217,119,6,0.12);color:var(--warning);border:var(--silver-border);'}"><i class="fas ${a.icon}"></i></div>
                    <div class="alert-content" style="flex:1;"><div class="alert-title" style="font-size:0.85rem;font-weight:700;color:var(--text-primary);">${a.title}</div><div class="alert-desc" style="font-size:0.75rem;color:var(--text-muted);">${a.desc}</div></div>
                    <div class="alert-time" style="font-size:0.7rem;color:var(--text-muted);">${a.time}</div>
                </div>
            `).join('');
        }

        function showNotifications() {
            const unreadCount = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            if (unreadCount === 0) {
                showToast('🔔 لا توجد إشعارات غير مقروءة', 'info');
                return;
            }
            showToast('🔔 لديك ' + unreadCount + ' إشعار غير مقروء', 'warning');
            hapticFeedback('light');
        }

        // ============================================================
        // 14. عرض تفاصيل الإشعار
        // ============================================================
        function viewNotification(id) {
            const notification = allNotifications.find(n => n.id == id);
            if (!notification) {
                showToast('❌ الإشعار غير موجود', 'error');
                return;
            }

            // إذا كان غير مقروء، نعلمه كمقروء
            if (notification.is_read == 0 || notification.is_read === false) {
                markAsRead(id, true); // silent mode
            }

            document.getElementById('detailsTitle').textContent = '📄 تفاصيل الإشعار';
            const body = document.getElementById('detailsBody');

            const isRead = notification.is_read == 1 || notification.is_read === true;
            const priority = notification.priority || 'normal';
            const priorityLabel = getPriorityLabel(priority);
            const priorityClass = getPriorityClass(priority);
            const channel = notification.channel || 'in_app';
            const channelLabel = getChannelLabel(channel);
            const status = notification.status || 'pending';
            const statusLabel = getStatusLabel(status);
            const statusClass = getStatusClass(status);
            const expired = isExpired(notification.expires_at);
            const type = notification.notification_type || 'info';

            let icon = 'fa-bell';
            if (type === 'info') icon = 'fa-info-circle';
            else if (type === 'warning') icon = 'fa-exclamation-triangle';
            else if (type === 'success') icon = 'fa-check-circle';
            else if (type === 'error') icon = 'fa-times-circle';

            let html = `
                <div style="text-align:center;padding:8px 0;">
                    <div style="font-size:2rem;margin-bottom:8px;color:${priority === 'urgent' ? 'var(--danger)' : 'var(--gold-primary)'};">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div style="display:grid;gap:10px;text-align:right;">
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--silver-border);gap:10px;">
                            <span style="font-weight:700;color:var(--text-muted);">العنوان:</span>
                            <span style="color:var(--text-primary);font-weight:700;">${escapeHtml(notification.title || '---')}</span>
                        </div>
                        ${notification.title_ar ? `
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--silver-border);gap:10px;">
                            <span style="font-weight:700;color:var(--text-muted);">العنوان (عربي):</span>
                            <span style="color:var(--text-primary);">${escapeHtml(notification.title_ar)}</span>
                        </div>
                        ` : ''}
                        <div style="padding:8px 0;border-bottom:var(--silver-border);">
                            <span style="font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;">الرسالة:</span>
                            <div style="background:var(--bg-glass);padding:12px;border-radius:10px;margin-top:4px;color:var(--text-primary);border:var(--silver-border);line-height:1.7;font-size:.82rem;">
                                ${escapeHtml(notification.message || '---')}
                            </div>
                        </div>
                        ${notification.message_ar ? `
                        <div style="padding:8px 0;border-bottom:var(--silver-border);">
                            <span style="font-weight:700;color:var(--text-muted);display:block;margin-bottom:6px;">الرسالة (عربي):</span>
                            <div style="background:var(--bg-glass);padding:12px;border-radius:10px;margin-top:4px;color:var(--text-primary);border:var(--silver-border);line-height:1.7;font-size:.82rem;">
                                ${escapeHtml(notification.message_ar)}
                            </div>
                        </div>
                        ` : ''}
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--silver-border);gap:10px;">
                            <span style="font-weight:700;color:var(--text-muted);">النوع:</span>
                            <span style="color:var(--text-primary);">${escapeHtml(type)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--silver-border);align-items:center;gap:10px;">
                            <span style="font-weight:700;color:var(--text-muted);">الأولوية:</span>
                            <span class="badge badge-priority-${priorityClass}" style="font-size:0.8rem;padding:4px 12px;">${priorityLabel}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:var(--silver-border);align-items:center;gap:10px;">

        // ============================================================
        // 15. تعليم الإشعار كمقروء
        // ============================================================
        async function markAsRead(id, silent = false) {
            const notification = allNotifications.find(n => n.id == id);
            if (!notification) {
                if (!silent) showToast('❌ الإشعار غير موجود', 'error');
                return;
            }

            if (notification.is_read == 1 || notification.is_read === true) {
                if (!silent) showToast('📖 الإشعار مقروء بالفعل', 'info');
                return;
            }

            showLoading(true);
            try {
                const result = await apiCall('markNotificationRead', { id: id });
                if (result.success) {
                    if (!silent) showToast('✅ تم تعليم الإشعار كمقروء', 'success');
                    // تحديث محلي
                    const idx = allNotifications.findIndex(n => n.id == id);
                    if (idx >= 0) {
                        allNotifications[idx].is_read = 1;
                        allNotifications[idx].read_at = new Date().toISOString();
                    }
                    renderCards();
                    updateStats();
                    generateAlerts();
                    // إذا كانت التفاصيل مفتوحة، نحدثها
                    const detailsModal = document.getElementById('detailsModal');
                    if (detailsModal.classList.contains('show')) {
                        viewNotification(id);
                    }
                } else {
                    throw new Error(result.message || 'فشل في التحديث');
                }
            } catch (e) {
                if (!silent) showToast('❌ ' + (e?.message || 'خطأ في التحديث'), 'error');
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // 16. تحديد الكل كمقروء
        // ============================================================
        async function markAllAsRead() {
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false);
            if (unread.length === 0) {
                showToast('📖 جميع الإشعارات مقروءة بالفعل', 'info');
                return;
            }

            const confirmed = await Swal.fire({
                title: '⚠️ تأكيد',
                text: `هل أنت متأكد من تعليم ${unread.length} إشعار غير مقروء كمقروء؟`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، تعليم الكل كمقروء',
                cancelButtonText: 'إلغاء'
            });
            if (!confirmed.isConfirmed) return;

            showLoading(true);
            let successCount = 0;
            let failCount = 0;

            for (const n of unread) {
                try {
                    const result = await apiCall('markNotificationRead', { id: n.id });
                    if (result.success) {
                        successCount++;
                        const idx = allNotifications.findIndex(item => item.id == n.id);
                        if (idx >= 0) {
                            allNotifications[idx].is_read = 1;
                            allNotifications[idx].read_at = new Date().toISOString();
                        }
                    } else {
                        failCount++;
                    }
                } catch (e) {
                    failCount++;
                }
            }

            if (successCount === 0 && failCount === unread.length) {
                showToast('❌ تعذر تعليم الإشعارات كمقروءة في قاعدة بيانات التطبيق', 'error');
                showLoading(false);
                return;
            }
            renderCards();
            updateStats();
            generateAlerts();
            showLoading(false);

            if (successCount > 0) {
                showToast(`✅ تم تعليم ${successCount} إشعار كمقروء${failCount > 0 ? `، فشل ${failCount}` : ''}`, 'success');
            } else {
                showToast('❌ فشل تعليم الإشعارات', 'error');
            }
        }

        // ============================================================
        // 17. تنفيذ الإجراء المرتبط بالإشعار
        // ============================================================
        function executeAction(actionUrl) {
            if (!actionUrl) {
                showToast('⚠️ لا يوجد إجراء مرتبط', 'warning');
                return;
            }
            try {
                const value = String(actionUrl).trim();
                const parsed = new URL(value, window.location.href);
                const protocol = parsed.protocol.toLowerCase();
                if (protocol === 'http:' || protocol === 'https:') {
                    window.open(parsed.href, '_blank', 'noopener,noreferrer');
                    showToast('✅ تم فتح الرابط', 'success');
                    return;
                }
                if (['tel:', 'mailto:', 'fb:'].includes(protocol)) {
                    window.location.href = value;
                    return;
                }
                if (value.startsWith('../') || value.startsWith('./') || value.startsWith('#')) {
                    window.location.href = value;
                    return;
                }
                showToast('⚠️ إجراء غير معروف أو غير مسموح', 'warning');
            } catch (error) {
                showToast('⚠️ الرابط المرتبط غير صالح', 'warning');
            }
        }

            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.bottom-nav .nav-item[data-modal="${type}"]`)?.classList.add('active');

        function generateTableFromNotifications(notifications) {
            if (!notifications || notifications.length === 0) {
                return `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد إشعارات</p></div>`;
            }
            let table = `<table><thead><tr>
                <th>العنوان</th>
                <th>الأولوية</th>
                <th>القناة</th>
                <th>الحالة</th>
                <th>التاريخ</th>
            </tr></thead><tbody>`;
            notifications.forEach(n => {
                const isRead = n.is_read == 1 || n.is_read === true;
                const priority = getPriorityLabel(n.priority);
                const channel = getChannelLabel(n.channel);
                const status = getStatusLabel(n.status);
                table += `<tr>
                    <td>${escapeHtml((n.title || n.title_ar || '---').substring(0, 30))}${(n.title || '').length > 30 ? '...' : ''}</td>
                    <td><span class="badge badge-priority-${getPriorityClass(n.priority)}" style="font-size:0.7rem;padding:3px 10px;">${priority}</span></td>
                    <td><span class="badge badge-channel-${getChannelClass(n.channel)}" style="font-size:0.7rem;padding:3px 10px;">${channel}</span></td>
                    <td><span class="badge badge-status-${getStatusClass(n.status)}" style="font-size:0.7rem;padding:3px 10px;">${status}</span> ${isRead ? '📖' : '📬'}</td>
                    <td>${formatDate(n.created_at)}</td>
                </tr>`;
            });
            table += `</tbody></table>`;
            return table;
        }

        function generateTableFromObject(obj, headers) {
            const entries = Object.entries(obj);
            if (entries.length === 0) {
                return `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد بيانات</p></div>`;
            }
            let table = `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            entries.forEach(([key, value]) => {
                const label = getChannelLabel(key);
                table += `<tr><td>${label}</td><td>${value}</td></tr>`;
            });
            table += `</tbody></table>`;
            return table;
        }

        // 19. إغلاق المودالات

        function closeModal(e) {

        // ============================================================

        // ============================================================
        // 21. تصدير الإشعارات
        // ============================================================
        function exportNotifications() {
            if (allNotifications.length === 0) {
                showToast('⚠️ لا توجد إشعارات للتصدير', 'warning');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const margin = 10;
                let y = margin;

                doc.setFontSize(18);
                doc.setTextColor(200, 154, 18);
                doc.text('صندوق الإشعارات', pageWidth / 2, y, { align: 'center' });
                y += 8;

                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`تاريخ التصدير: ${new Date().toLocaleString('ar-EG')}`, pageWidth / 2, y, { align: 'center' });
                y += 10;

                allNotifications.forEach((n, idx) => {
                    if (y > 250) {
                        doc.addPage();
                        y = margin;
                    }

                    const isRead = n.is_read == 1 || n.is_read === true;
                    const priority = getPriorityLabel(n.priority);
                    const channel = getChannelLabel(n.channel);
                    const status = getStatusLabel(n.status);

                    doc.setFontSize(11);
                    doc.setTextColor(50);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`${idx + 1}. ${n.title || n.title_ar || 'إشعار'}`, margin, y);
                    y += 5;

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(9);
                    doc.text(`الأولوية: ${priority} | القناة: ${channel} | الحالة: ${status} | ${isRead ? 'مقروء ✅' : 'غير مقروء 📬'}`, margin + 5, y);
                    y += 4;

                    const msg = (n.message || n.message_ar || '').substring(0, 80);
                    doc.text(`الرسالة: ${msg}${(n.message || '').length > 80 ? '...' : ''}`, margin + 5, y);
                    y += 5;

                    doc.text(`التاريخ: ${formatDate(n.created_at)}`, margin + 5, y);
                    y += 4;

                    if (n.expires_at) {
                        doc.text(`ينتهي في: ${formatDate(n.expires_at)}`, margin + 5, y);
                        y += 4;
                    }

                    doc.line(margin, y, pageWidth - margin, y);
                    y += 4;
                });

                const fileName = `notifications_inbox_${businessDayDate()}.pdf`;
                doc.save(fileName);
                showToast('✅ تم تصدير الإشعارات بنجاح', 'success');
                hapticFeedback('success');
            } catch (e) {
                showToast('❌ فشل التصدير: ' + e.message, 'error');
                console.error('Export error:', e);
            }
        }

        // ============================================================
        // 22. المستشار الذكي (AI Advisor)
        // ============================================================
        function openAIAdvisor() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent' && (n.is_read == 0 || n.is_read === false)).length;
            const failed = allNotifications.filter(n => (n.status || '').toLowerCase() === 'failed').length;
            const expired = allNotifications.filter(n => isExpired(n.expires_at)).length;

            let suggestion = '';
            if (total === 0) {
                suggestion = '📭 لا توجد إشعارات في صندوق الوارد.';
            } else if (urgent > 0) {
                suggestion = `🚨 لديك ${urgent} إشعار عاجل غير مقروء. يُنصح بمراجعتهم فوراً.`;
            } else if (unread > 0) {
                suggestion = `📬 لديك ${unread} إشعار غير مقروء. يُنصح بمراجعتهم.`;
            } else {
                suggestion = '✅ جميع الإشعارات مقروءة.';
            }

            if (failed > 0) {
                suggestion += ` ❌ ${failed} إشعار فشل إرساله.`;
            }
            if (expired > 0) {
                suggestion += ` ⏳ ${expired} إشعار منتهي الصلاحية.`;
            }

            Swal.fire({
                title: '🤖 المستشار الذكي - صندوق الإشعارات',
                html: `
                    <div style="text-align:center;">
                        <p>📊 إجمالي الإشعارات: ${total}</p>
                        <p>📬 غير مقروءة: ${unread}</p>
                        <p>📖 مقروءة: ${total - unread}</p>
                        <p>🚨 عاجلة غير مقروءة: ${urgent}</p>
                        <p>❌ فاشلة: ${failed}</p>
                        <p>⏳ منتهية الصلاحية: ${expired}</p>
                        <hr style="border:none;border-top:1px solid var(--silver-border-color);margin:12px 0;">
                        <p style="font-weight:bold;">💡 التوصية: ${suggestion}</p>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'حسناً'
            });
            hapticFeedback('light');
        }

        // ============================================================
        // 23. إعداد القائمة الجانبية
        // ============================================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
                toggle.classList.toggle('hidden');
                hapticFeedback('light');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                    toggle.classList.remove('hidden');
                }
            });
        }

        // ============================================================
        // 24. التهيئة النهائية
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            setupSidebar();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            updateOnlineStatus();
            loadNotifications();

            // تعيين الفلتر النشط
            document.querySelector('.filter-chip.active')?.classList.remove('active');
            document.querySelector('.filter-chip[data-filter="all"]')?.classList.add('active');

            // إضافة مستمع لإغلاق المودالات
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.addEventListener('click', closeModal);
            });

            // إضافة مستمع ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            setTimeout(() => {
                generateAlerts();
            }, 1000);

        });

        // ============================================================
        // 25. زر الرجوع إلى الرئيسية (جديد)
        // ============================================================
        function goToDashboard() {
            window.location.href = '../main.html';
        }
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
