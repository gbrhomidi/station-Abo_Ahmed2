<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صندوق الإشعارات</title>
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <script src="file:///android_asset/assets-local/js/jspdf.umd.min.js"></script>
    <style>
        /* ============================================================
           المتغيرات الأساسية – دعم Light/Dark
           ============================================================ */
        :root {
            --bg-color: #f5efe6;
            --surface-color: #faf3e8;
            --surface-elevated: #fdf8f0;
            --primary-color: #007ACC;
            --primary-dim: rgba(0,122,204,0.12);
            --accent-color: #d4a017;
            --accent-dim: rgba(212,160,23,0.12);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-color: #1a2a3a;
            --text-muted: #6a7f94;
            --border-color: #003366;
            --border-style: dashed;
            --border-width: 2px;
            --shadow-glow: 0 0 20px rgba(0,122,204,0.08);
            --glass-bg: rgba(255,248,240,0.85);
            --header-bg: linear-gradient(135deg, #e8e0d5 0%, #d5cdc0 100%);
            --card-hover-bg: rgba(0,122,204,0.04);
            --fab-shadow: rgba(0,122,204,0.3);
            --toast-bg: #fdf8f0;
            --scrollbar-track: #f5efe6;
            --scrollbar-thumb: rgba(0,51,102,0.2);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;
            --modal-border-color: #003366;
            --modal-border-style: dashed;
            --input-bg: #fdf8f0;
            --input-border: #003366;
            --input-border-style: dashed;
            --data-text-color: #1a2a3a;
            --data-text-muted: #4a5a6a;
            --channel-sms: #2196F3;
            --channel-email: #4CAF50;
            --channel-push: #FF9800;
            --channel-whatsapp: #25D366;
            --channel-telegram: #0088cc;
            --channel-inapp: #9C27B0;
            --priority-low: #6a7f94;
            --priority-normal: #2196F3;
            --priority-high: #FF9800;
            --priority-urgent: #ef4444;
        }

        [data-theme="dark"] {
            --bg-color: #0a0e1a;
            --surface-color: #111827;
            --surface-elevated: #1a2236;
            --primary-color: #00d4ff;
            --primary-dim: rgba(0,212,255,0.15);
            --accent-color: #f59e0b;
            --accent-dim: rgba(245,158,11,0.15);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #e8d48b;
            --border-style: dashed;
            --border-width: 2px;
            --shadow-glow: 0 0 20px rgba(0,212,255,0.1);
            --glass-bg: rgba(22,34,64,0.85);
            --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-hover-bg: rgba(0,212,255,0.05);
            --fab-shadow: rgba(0,212,255,0.3);
            --toast-bg: #1a2236;
            --scrollbar-track: transparent;
            --scrollbar-thumb: rgba(255,255,255,0.1);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;
            --modal-border-color: #e8d48b;
            --modal-border-style: dashed;
            --input-bg: #1e293b;
            --input-border: #e8d48b;
            --input-border-style: dashed;
            --data-text-color: #f1f5f9;
            --data-text-muted: #94a3b8;
            --channel-sms: #2196F3;
            --channel-email: #4CAF50;
            --channel-push: #FF9800;
            --channel-whatsapp: #25D366;
            --channel-telegram: #0088cc;
            --channel-inapp: #9C27B0;
            --priority-low: #94a3b8;
            --priority-normal: #2196F3;
            --priority-high: #FF9800;
            --priority-urgent: #ef4444;
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
            transition: background 0.4s ease, color 0.4s ease;
            touch-action: pan-y;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(0,212,255,0.2);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي (Header)
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            background: var(--header-bg);
            border-bottom: var(--border-width) var(--border-style) var(--border-color);
            z-index: 100;
            backdrop-filter: blur(20px);
            transition: background 0.4s ease;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary-color), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-elevated);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            position: relative;
        }
        .icon-btn:hover {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--error);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--error);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* ============================================================
           البحث والفلاتر
           ============================================================ */
        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 14px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-elevated);
            color: var(--text-color);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-dim);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip.active {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .filter-chip:hover:not(.active) {
            border-color: var(--text-muted);
            color: var(--text-color);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--surface-elevated);
            border: var(--border-width) var(--border-style) var(--border-color);
            border-radius: 16px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            touch-action: manipulation;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: var(--shadow-glow);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card:hover::before { opacity: 1; }
        .stat-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        .stat-icon.blue { background: var(--primary-dim); color: var(--primary-color); }
        .stat-icon.green { background: rgba(16,185,129,0.15); color: var(--success); }
        .stat-icon.orange { background: var(--accent-dim); color: var(--accent-color); }
        .stat-icon.red { background: rgba(239,68,68,0.15); color: var(--error); }
        .stat-icon.purple { background: rgba(155,89,182,0.15); color: #9b59b6; }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--data-text-color);
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           بطاقات الإشعارات
           ============================================================ */
        .cards-container {
            padding: 0 16px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .notification-card {
            background: var(--surface-elevated);
            border: var(--border-width) var(--border-style) var(--border-color);
            border-radius: 18px;
            padding: 16px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            touch-action: pan-y;
        }
        .notification-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            background: var(--card-hover-bg);
        }
        .notification-card.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-dim), 0 4px 20px rgba(0,212,255,0.1);
        }
        .notification-card:active { transform: scale(0.98); }
        .notification-card.unread {
            border-color: var(--primary-color);
            background: var(--primary-dim);
        }

        .notification-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .notification-card .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--data-text-color);
            flex: 1;
            text-align: center;
        }
        .notification-card .card-badges {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .notification-card .badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.6rem;
            font-weight: 600;
            border: var(--border-width) var(--border-style) var(--border-color);
        }
        .badge-unread { background: rgba(0,122,204,0.15); color: var(--primary-color); }
        .badge-read { background: rgba(148,163,184,0.15); color: var(--text-muted); }
        .badge-priority-low { background: rgba(106,127,148,0.15); color: var(--priority-low); }
        .badge-priority-normal { background: rgba(33,150,243,0.15); color: var(--priority-normal); }
        .badge-priority-high { background: rgba(255,152,0,0.15); color: var(--priority-high); }
        .badge-priority-urgent { background: rgba(239,68,68,0.15); color: var(--priority-urgent); }
        .badge-channel-sms { background: rgba(33,150,243,0.15); color: var(--channel-sms); }
        .badge-channel-email { background: rgba(76,175,80,0.15); color: var(--channel-email); }
        .badge-channel-push { background: rgba(255,152,0,0.15); color: var(--channel-push); }
        .badge-channel-whatsapp { background: rgba(37,211,102,0.15); color: var(--channel-whatsapp); }
        .badge-channel-telegram { background: rgba(0,136,204,0.15); color: var(--channel-telegram); }
        .badge-channel-inapp { background: rgba(156,39,176,0.15); color: var(--channel-inapp); }
        .badge-status-pending { background: rgba(255,152,0,0.15); color: var(--warning); }
        .badge-status-queued { background: rgba(33,150,243,0.15); color: var(--primary-color); }
        .badge-status-sent { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-status-failed { background: rgba(239,68,68,0.15); color: var(--error); }
        .badge-status-cancelled { background: rgba(148,163,184,0.15); color: var(--text-muted); }
        .badge-status-read { background: rgba(16,185,129,0.15); color: var(--success); }

        .notification-card .card-body {
            margin: 6px 0 8px;
        }
        .notification-card .card-body .message-preview {
            font-size: 0.85rem;
            color: var(--data-text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-align: center;
        }
        .notification-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }
        .notification-card .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .notification-card .card-actions .card-btn {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .notification-card .card-actions .card-btn:active { transform: scale(0.95); }
        .notification-card .card-actions .card-btn:hover {
            background: var(--primary-dim);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .notification-card .card-actions .card-btn.primary:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

        /* ============================================================
           القائمة الجانبية (Sidebar)
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(145deg, #4B0082, #5a1a9a);
            color: white;
            width: 35px; height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 10px rgba(0,0,0,0.4);
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -90px;
            transform: translateY(-50%);
            width: 70px;
            background: var(--surface-elevated);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 8px;
            border-radius: 15px 0 0 15px;
            overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border: var(--border-width) var(--border-style) var(--border-color);
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: rgba(75, 0, 130, 0.8);
            border: var(--border-width) var(--border-style) var(--border-color);
            padding: 8px 4px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 55px;
            text-align: center;
            font-size: 0.75rem;
            font-family: 'Cairo', sans-serif;
            touch-action: manipulation;
        }
        .sidebar-btn:active { transform: scale(0.95); }
        .sidebar-btn:hover {
            transform: scale(1.05);
            background: rgba(75,0,130,0.35);
            box-shadow: 0 0 15px rgba(0,212,255,0.2);
        }
        .sidebar-btn i { font-size: 1.1rem; }
        .sidebar-btn span { font-size: 0.65rem; }

        /* ============================================================
           القائمة السفلية (Bottom Navigation)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--border-width) var(--border-style) var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
        }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 8px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 18px; transition: all 0.3s; }
        .bottom-nav .nav-item span { font-weight: 600; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--primary-color); }
        .bottom-nav .nav-item.active i { transform: translateY(-3px); text-shadow: 0 0 20px var(--primary-dim); }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background: var(--primary-color);
            border-radius: 10px;
        }

        /* ============================================================
           مودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 800;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--surface-elevated);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
            border: var(--border-width) var(--border-style) var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-overlay.show .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: var(--border-width) var(--border-style) var(--border-color);

        .modal-title { font-size: 1.1rem; font-weight: 800; color: var(--data-text-color); text-align: center; flex: 1; }
        .modal-close {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        .modal-body {
            max-height: 60vh;
            overflow-y: auto;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: var(--border-width) var(--border-style) var(--border-color);
        }
        .modal-actions .btn-secondary { flex: 1; }

        /* ===== مودال الجدول (القائمة السفلية) ===== */
        .modal-table .modal { max-width: 700px; }
        .modal-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .modal-body table th {
            background: var(--primary-dim);
            color: var(--primary-color);
            padding: 10px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 700;
            border-bottom: var(--border-width) var(--border-style) var(--border-color);

            padding: 8px 12px;
            border-bottom: var(--border-width) var(--border-style) var(--border-color);
            text-align: center;
            color: var(--data-text-color);
        }
        .modal-body table tr:hover { background: var(--card-hover-bg); }

        /* ===== عام ===== */
        .submit-btn {
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), #6366f1);
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--primary-dim);
        }
        .submit-btn.danger {
            background: linear-gradient(135deg, var(--error), #dc2626);
        }
        .btn-secondary {
            padding: 14px 20px;
            border-radius: 14px;
            border: var(--border-width) var(--border-style) var(--border-color);
            background: var(--surface-color);
            color: var(--text-muted);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-secondary:active { transform: scale(0.97); }
        .btn-secondary:hover {
            background: var(--border-color);
            color: var(--text-color);
        }

        /* ============================================================
           Toast إشعارات
           ============================================================ */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--border-width) var(--border-style) var(--border-color);
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--error); }
        .toast.warning { border-color: var(--warning); }
        .toast-icon {
            width: 28px; height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .toast.success .toast-icon { background: rgba(16,185,129,0.15); color: var(--success); }
        .toast.error .toast-icon { background: rgba(239,68,68,0.15); color: var(--error); }
        .toast.warning .toast-icon { background: var(--accent-dim); color: var(--warning); }

        /* ============================================================
           الرسوم المتحركة
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }

        /* ============================================================
           تحسينات للهواتف
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
            .stat-card { padding: 12px; }
            .stat-value { font-size: 1.1rem; }
            .cards-container { padding: 0 12px 16px; }
            .bottom-nav .nav-item i { font-size: 15px; }
            .bottom-nav .nav-item span { font-size: 0.7rem; }
            .sidebar { width: 60px; }

            .modal { padding: 16px; max-width: 100%; margin: 10px; }
            .modal-actions { flex-direction: column; }
            .modal-actions .submit-btn,
            .modal-actions .btn-secondary { width: 100%; }
        }

        @media (max-width: 480px) {

            .bottom-nav .nav-item span { font-size: 0.6rem; }
            .modal { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- Offline Banner -->

    <!-- ============================================================

    <!-- ============================================================

    <!-- ============================================================

    <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;padding:0 16px;margin-bottom:12px;">
        <h3>📋 قائمة الإشعارات</h3>
        <span class="count-badge" id="notificationCount" style="background:var(--primary-dim);color:var(--primary-color);padding:2px 10px;border-radius:10px;font-size:0.75rem;font-weight:700;">0</span>

    <!-- ============================================================

    <!-- ============================================================
    مودال تفاصيل الإشعار
    ============================================================ -->
    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event)">

    <!-- ============================================================
    مودال الجدول (القائمة السفلية)
    ============================================================ -->
    <div class="modal-overlay modal-table" id="tableModal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="tableModalTitle">📊 البيانات</h3>

                <button class="btn-secondary" onclick="closeModal()" style="width:100%;">
                    <i class="fas fa-times"></i> إغلاق

    <!-- ============================================================
    Toast إشعارات
    ============================================================ -->
    <div class="toast" id="toast">
        <div class="toast-icon"><i class="fas fa-check"></i></div>
        <span id="toastMessage">تمت العملية بنجاح</span>
    </div>

    <!-- ============================================================
    JavaScript المتكامل
    ============================================================ -->
    <script>
        // ============================================================
        // 1. Android Bridge – من MainActivity.kt
        // ============================================================
        function apiCall(action, params = {}) {
            return new Promise((resolve, reject) => {
                try {
                    const bridge = window.AndroidInterface;
                    if (!bridge) throw new Error('AndroidInterface غير متاح');
                    let raw;
                    switch (action) {
                        case 'getNotifications': raw = bridge.getNotifications(); break;
                        case 'getCurrentUser': raw = bridge.getCurrentUser(); break;
                        case 'markNotificationRead': raw = bridge.markNotificationRead(Number(params?.id || 0)); break;
                        default: throw new Error('إجراء غير مدعوم: ' + action);
                    }
                    resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
                } catch (error) {
                    reject({ success: false, error: error?.message || 'تعذر تنفيذ العملية' });
                }
            });
        }

        // ============================================================
        // 2. حالة WebView
        // ============================================================
        let isOnline = true;

        function updateOnlineStatus() {
            const banner = document.getElementById('offlineBanner');
            const bridgeAvailable = typeof window.AndroidInterface !== 'undefined' && !!window.AndroidInterface;
            isOnline = bridgeAvailable;
            if (!bridgeAvailable) {
                banner.classList.add('show');
                showToast('⚠️ قاعدة بيانات التطبيق غير متاحة داخل WebView', 'warning');
            } else {
                banner.classList.remove('show');
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ============================================================
        // 3. Haptic Feedback
        // ============================================================
        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(20);
                    else if (type === 'error') navigator.vibrate([30, 50, 30]);
                    else if (type === 'light') navigator.vibrate(10);
                }
            } catch (e) { /* تجاهل */ }
        }

        // ============================================================
        // 6. دوال مساعدة
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;
            if (type === 'success') { iconEl.className = 'fas fa-check'; hapticFeedback('success'); }
            else if (type === 'error') { iconEl.className = 'fas fa-times'; hapticFeedback('error'); }
            else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle'; hapticFeedback('light'); }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getChannelLabel(channel) {
            const map = {
                'sms': '💬 SMS',
                'email': '📧 Email',
                'push': '🔔 Push',
                'whatsapp': '💚 WhatsApp',
                'telegram': '✈️ Telegram',
                'in_app': '📱 In-App'
            };
            return map[channel] || channel || 'غير محدد';
        }

        function getChannelClass(channel) {
            const map = {
                'sms': 'sms',
                'email': 'email',
                'push': 'push',
                'whatsapp': 'whatsapp',
                'telegram': 'telegram',
                'in_app': 'inapp'
            };
            return map[channel] || 'default';
        }

        function getPriorityLabel(priority) {
            const map = {
                'low': 'منخفضة',
                'normal': 'عادية',
                'high': 'عالية',
                'urgent': 'عاجلة'
            };
            return map[priority] || priority || 'عادية';
        }

        function getPriorityClass(priority) {
            const map = {
                'low': 'low',
                'normal': 'normal',
                'high': 'high',
                'urgent': 'urgent'
            };
            return map[priority] || 'normal';
        }

        function getStatusLabel(status) {
            const map = {
                'pending': 'معلقة',
                'queued': 'في الانتظار',
                'sent': 'مرسلة',
                'failed': 'فاشلة',
                'read': 'مقروءة',
                'cancelled': 'ملغية'
            };
            return map[status] || status || 'غير محدد';
        }

        function getStatusClass(status) {
            const map = {
                'pending': 'pending',
                'queued': 'queued',
                'sent': 'sent',
                'failed': 'failed',
                'read': 'read',
                'cancelled': 'cancelled'
            };
            return map[status] || 'pending';
        }

        function isExpired(expiresAt) {
            if (!expiresAt) return false;
            const expiry = new Date(expiresAt);
            return expiry < new Date();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '---';
            try {
                const d = new Date(dateStr);
                return d.toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
            } catch (e) { return dateStr; }
        }

        // ============================================================
        // 7. نظام تبديل الوضع
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            const icon = document.getElementById('themeIcon');
            if (saved === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // ============================================================
        // 8. متغيرات الحالة
        // ============================================================
        let currentFilter = 'all';
        let allNotifications = [];
        let isInitialLoad = true;
        let currentUserId = 0;
        let currentUserRole = '';

        // ============================================================
        // 9. تحميل البيانات
        // ============================================================
        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card" style="background:var(--surface-elevated);border-radius:18px;padding:16px;border:var(--border-width) var(--border-style) var(--border-color);position:relative;overflow:hidden;">
                        <div style="display:flex;align-items:center;margin-bottom:12px;">
                            <div style="width:48px;height:48px;border-radius:14px;background:var(--skeleton-bg);flex-shrink:0;margin-left:12px;"></div>
                            <div style="flex:1;">
                                <div class="skeleton-row long" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                                <div class="skeleton-row medium" style="height:12px;background:var(--skeleton-bg);border-radius:6px;width:60%;"></div>
                            </div>
                        </div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div class="skeleton-row" style="height:12px;background:var(--skeleton-bg);border-radius:6px;margin-bottom:8px;"></div>
                        <div style="display:flex;gap:10px;margin-top:12px;">
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:6px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;background:var(--skeleton-bg);border-radius:6px;"></div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = `<div class="skeleton-grid" style="display:flex;flex-direction:column;gap:12px;padding:0 16px 16px;">${skeleton}</div>`;
        }

        async function getCurrentUser() {
            try {
                const result = await apiCall('getCurrentUser', {});
                if (result.success && result.data) {
                    currentUserId = result.data.user_id || 0;
                    currentUserRole = result.data.role || '';
                    return result.data;
                }
                return null;
            } catch (e) {
                console.warn('getCurrentUser failed:', e);
                return null;
            }
        }

        async function loadNotifications() {
            if (isInitialLoad) renderSkeleton();

            showLoading(true);
            try {
                // جلب المستخدم الحالي للحصول على user_id
                await getCurrentUser();

                // جلب الإشعارات عبر Android Bridge – الدالة getNotifications من MainActivity.kt
                const result = await apiCall('getNotifications', {});
                if (result.success && result.data) {
                    allNotifications = result.data;
                } else {
                    throw new Error(result?.error || result?.message || 'تعذر تحميل الإشعارات');
                }

                if (allNotifications.length === 0) {
                    showToast('⚠️ لا توجد إشعارات', 'warning');
                }

            } catch (e) {
                allNotifications = [];
                showToast('❌ ' + (e?.message || 'تعذر تحميل الإشعارات من قاعدة بيانات التطبيق'), 'error');
            }

            renderCards();
            updateStats();
            isInitialLoad = false;
            showLoading(false);
        }

        // ============================================================
        // 10. عرض البطاقات
        // ============================================================
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allNotifications];

            // تطبيق الفلتر
            if (currentFilter === 'unread') {
                filtered = filtered.filter(n => n.is_read == 0 || n.is_read === false);
            } else if (currentFilter === 'read') {
                filtered = filtered.filter(n => n.is_read == 1 || n.is_read === true);
            } else if (currentFilter === 'urgent') {
                filtered = filtered.filter(n => (n.priority || '').toLowerCase() === 'urgent');
            } else if (currentFilter === 'high') {
                filtered = filtered.filter(n => (n.priority || '').toLowerCase() === 'high');
            } else if (['sms', 'email', 'push', 'whatsapp', 'telegram', 'in_app'].includes(currentFilter)) {
                filtered = filtered.filter(n => (n.channel || '').toLowerCase() === currentFilter);
            }

            // تطبيق البحث
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(n => {
                    const title = (n.title || '').toLowerCase();
                    const titleAr = (n.title_ar || '').toLowerCase();
                    const message = (n.message || '').toLowerCase();
                    const messageAr = (n.message_ar || '').toLowerCase();
                    const type = (n.notification_type || '').toLowerCase();
                    return title.includes(searchQuery) || titleAr.includes(searchQuery) ||
                        message.includes(searchQuery) || messageAr.includes(searchQuery) ||
                        type.includes(searchQuery);
                });
            }

            document.getElementById('notificationCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>لا توجد إشعارات مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((n, idx) => {
                const id = n.id;
                const title = n.title || n.title_ar || 'إشعار';
                const message = n.message || n.message_ar || 'لا يوجد محتوى';
                const isRead = n.is_read == 1 || n.is_read === true;
                const priority = n.priority || 'normal';
                const channel = n.channel || 'in_app';
                const status = n.status || 'pending';
                const createdAt = n.created_at || '---';
                const expiresAt = n.expires_at || null;
                const actionUrl = n.action_url || null;
                const actionText = n.action_text || 'فتح';
                const notificationType = n.notification_type || 'info';

                const priorityLabel = getPriorityLabel(priority);
                const priorityClass = getPriorityClass(priority);
                const channelLabel = getChannelLabel(channel);
                const channelClass = getChannelClass(channel);
                const statusLabel = getStatusLabel(status);
                const statusClass = getStatusClass(status);
                const expired = isExpired(expiresAt);

                const unreadClass = !isRead ? 'unread' : '';

                let icon = 'fa-bell';
                if (notificationType === 'info') icon = 'fa-info-circle';
                else if (notificationType === 'warning') icon = 'fa-exclamation-triangle';
                else if (notificationType === 'success') icon = 'fa-check-circle';
                else if (notificationType === 'error') icon = 'fa-times-circle';

                return `
                    <div class="notification-card animate-fade-up ${unreadClass}" style="animation-delay:${idx*0.04}s" data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <div class="card-title"><i class="fas ${icon}" style="color:${priority === 'urgent' ? 'var(--error)' : 'var(--primary-color)'};margin-left:6px;"></i> ${escapeHtml(title)}</div>
                            <div class="card-badges">
                                ${!isRead ? `<span class="badge badge-unread">جديد</span>` : `<span class="badge badge-read">مقروء</span>`}
                                <span class="badge badge-priority-${priorityClass}">${priorityLabel}</span>
                                <span class="badge badge-channel-${channelClass}">${channelLabel}</span>
                                ${expired ? `<span class="badge badge-status-cancelled">منتهي</span>` : ''}
                                <span class="badge badge-status-${statusClass}">${statusLabel}</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="message-preview">${escapeHtml(message)}</div>
                        </div>
                        <div class="card-footer">
                            <span><i class="far fa-clock"></i> ${formatDate(createdAt)}</span>
                            ${expiresAt ? `<span>⏳ ينتهي: ${formatDate(expiresAt)}</span>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); viewNotification(${id})">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                            ${!isRead ? `
                            <button class="card-btn primary" onclick="event.stopPropagation(); markAsRead(${id})">
                                <i class="fas fa-check"></i> تعليم كمقروء
                            </button>
                            ` : ''}
                            ${actionUrl ? `
                            <button class="card-btn" onclick="event.stopPropagation(); executeAction('${actionUrl}')">
                                <i class="fas fa-external-link-alt"></i> ${escapeHtml(actionText)}
                            </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.notification-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            hapticFeedback('light');
        }

        // ============================================================
        // 11. تحديث الإحصائيات
        // ============================================================
        function updateStats() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            const read = total - unread;
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent').length;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statUnread').textContent = unread;
            document.getElementById('statRead').textContent = read;
            document.getElementById('statUrgent').textContent = urgent;
        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'success');
        }

        // ============================================================
        // 12. البحث والفلاتر
        // ============================================================
        function handleSearch(query) { renderCards(); }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
            hapticFeedback('light');
        }

        // ============================================================
        // 13. التنبيهات (إشعارات)
        // ============================================================
        function generateAlerts() {
            const alerts = [];
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false);
            if (unread.length > 0) {
                alerts.push({
                    type: 'warning',
                    icon: 'fa-circle',
                    title: '📬 إشعارات غير مقروءة',
                    desc: unread.length + ' إشعار غير مقروء',
                    time: 'الآن'
                });
            }
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent' && (n.is_read == 0 || n.is_read === false));
            if (urgent.length > 0) {
                alerts.push({
                    type: 'danger',
                    icon: 'fa-exclamation-triangle',
                    title: '🚨 إشعارات عاجلة غير مقروءة',
                    desc: urgent.length + ' إشعار عاجل',
                    time: 'الآن'
                });
            }
            renderAlerts(alerts);
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            if (!container) return;
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = alerts.slice(0, 3).map((a, i) => `
                <div class="alert-item ${a.type}" style="animation-delay:${i*0.1}s;padding:10px 16px;background:var(--surface-elevated);border-radius:12px;margin-bottom:8px;border:2px dashed ${a.type === 'danger' ? 'var(--error)' : 'var(--warning)'};display:flex;align-items:center;gap:10px;">
                    <div class="alert-icon" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;${a.type === 'danger' ? 'background:rgba(239,68,68,0.15);color:var(--error);' : 'background:rgba(245,158,11,0.15);color:var(--warning);'}"><i class="fas ${a.icon}"></i></div>
                    <div class="alert-content" style="flex:1;"><div class="alert-title" style="font-size:0.85rem;font-weight:700;color:var(--data-text-color);">${a.title}</div><div class="alert-desc" style="font-size:0.75rem;color:var(--text-muted);">${a.desc}</div></div>
                    <div class="alert-time" style="font-size:0.7rem;color:var(--text-muted);">${a.time}</div>
                </div>
            `).join('');
        }

        function showNotifications() {
            const unreadCount = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            if (unreadCount === 0) {
                showToast('🔔 لا توجد إشعارات غير مقروءة', 'info');
                return;
            }
            showToast('🔔 لديك ' + unreadCount + ' إشعار غير مقروء', 'warning');
            hapticFeedback('light');
        }

        // ============================================================
        // 14. عرض تفاصيل الإشعار
        // ============================================================
        function viewNotification(id) {
            const notification = allNotifications.find(n => n.id == id);
            if (!notification) {
                showToast('❌ الإشعار غير موجود', 'error');
                return;
            }

            // إذا كان غير مقروء، نعلمه كمقروء
            if (notification.is_read == 0 || notification.is_read === false) {
                markAsRead(id, true); // silent mode

            document.getElementById('detailsTitle').textContent = '📄 تفاصيل الإشعار';

            const isRead = notification.is_read == 1 || notification.is_read === true;
            const priority = notification.priority || 'normal';
            const priorityLabel = getPriorityLabel(priority);
            const priorityClass = getPriorityClass(priority);

            const channelLabel = getChannelLabel(channel);
            const status = notification.status || 'pending';
            const statusLabel = getStatusLabel(status);

            const expired = isExpired(notification.expires_at);

            let html = `

                    <div style="display:grid;gap:10px;text-align:right;">

                            <span style="color:var(--data-text-color);">${escapeHtml(notification.title_ar)}</span>
                        </div>
                        ` : ''}
                        <div style="padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">الرسالة:</span>
                            <div style="background:var(--surface-color);padding:10px;border-radius:8px;margin-top:4px;color:var(--data-text-color);border:var(--border-width) var(--border-style) var(--border-color);">
                                ${escapeHtml(notification.message || '---')}
                            </div>
                        </div>
                        ${notification.message_ar ? `
                        <div style="padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">الرسالة (عربي):</span>
                            <div style="background:var(--surface-color);padding:10px;border-radius:8px;margin-top:4px;color:var(--data-text-color);border:var(--border-width) var(--border-style) var(--border-color);">
                                ${escapeHtml(notification.message_ar)}
                            </div>
                        </div>
                        ` : ''}
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">النوع:</span>
                            <span style="color:var(--data-text-color);">${escapeHtml(type)}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">الأولوية:</span>
                            <span class="badge badge-priority-${priorityClass}" style="font-size:0.8rem;padding:4px 12px;">${priorityLabel}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">القناة:</span>
                            <span class="badge badge-channel-${getChannelClass(channel)}" style="font-size:0.8rem;padding:4px 12px;">${channelLabel}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">الحالة:</span>
                            <span class="badge badge-status-${statusClass}" style="font-size:0.8rem;padding:4px 12px;">${statusLabel}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">الحالة:</span>
                            <span style="color:var(--data-text-color);">${isRead ? '✅ مقروء' : '📬 غير مقروء'}</span>
                        </div>
                        ${notification.sent_at ? `
                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">تاريخ الإرسال:</span>
                            <span style="color:var(--data-text-color);">${formatDate(notification.sent_at)}</span>
                        </div>
                        ` : ''}
                        ${notification.read_at ? `

                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">
                            <span style="font-weight:600;color:var(--text-muted);">تاريخ الإنشاء:</span>

                        </div>
                        ${notification.expires_at ? `

                            <span style="color:${expired ? 'var(--error)' : 'var(--data-text-color)'};">${formatDate(notification.expires_at)} ${expired ? '⚠️ منتهي' : ''}</span>

                            <span style="font-weight:600;color:var(--text-muted);">المرجع:</span>

                        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--border-width) var(--border-style) var(--border-color);">

                            <span style="font-weight:600;color:var(--text-muted);">خطأ:</span>
                            <div style="background:rgba(239,68,68,0.1);padding:8px;border-radius:8px;margin-top:4px;color:var(--error);border:1px solid var(--error);">
