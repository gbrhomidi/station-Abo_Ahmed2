        // ============================================================
        // 15. تعليم الإشعار كمقروء
        // ============================================================
        async function markAsRead(id, silent = false) {
            const notification = allNotifications.find(n => n.id == id);
            if (!notification) {
                if (!silent) showToast('❌ الإشعار غير موجود', 'error');
                return;
            }

            if (notification.is_read == 1 || notification.is_read === true) {
                if (!silent) showToast('📖 الإشعار مقروء بالفعل', 'info');
                return;
            }

            showLoading(true);
            try {
                const result = await apiCall('markNotificationRead', { id: id });
                if (result.success) {
                    if (!silent) showToast('✅ تم تعليم الإشعار كمقروء', 'success');
                    // تحديث محلي
                    const idx = allNotifications.findIndex(n => n.id == id);
                    if (idx >= 0) {
                        allNotifications[idx].is_read = 1;
                        allNotifications[idx].read_at = new Date().toISOString();
                    }
                    renderCards();
                    updateStats();
                    generateAlerts();
                    // إذا كانت التفاصيل مفتوحة، نحدثها
                    const detailsModal = document.getElementById('detailsModal');
                    if (detailsModal.classList.contains('show')) {
                        viewNotification(id);
                    }
                } else {
                    throw new Error(result.message || 'فشل في التحديث');
                }
            } catch (e) {
                if (!silent) showToast('❌ ' + (e?.message || 'خطأ في التحديث'), 'error');
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // 16. تحديد الكل كمقروء
        // ============================================================
        async function markAllAsRead() {
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false);
            if (unread.length === 0) {
                showToast('📖 جميع الإشعارات مقروءة بالفعل', 'info');
                return;
            }

            const confirmed = await Swal.fire({
                title: '⚠️ تأكيد',
                text: `هل أنت متأكد من تعليم ${unread.length} إشعار غير مقروء كمقروء؟`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'نعم، تعليم الكل كمقروء',
                cancelButtonText: 'إلغاء',
                background: '#1a2236',
                color: '#f1f5f9'
            });
            if (!confirmed.isConfirmed) return;

            showLoading(true);
            let successCount = 0;
            let failCount = 0;

            for (const n of unread) {
                try {
                    const result = await apiCall('markNotificationRead', { id: n.id });
                    if (result.success) {
                        successCount++;
                        const idx = allNotifications.findIndex(item => item.id == n.id);
                        if (idx >= 0) {
                            allNotifications[idx].is_read = 1;
                            allNotifications[idx].read_at = new Date().toISOString();
                        }
                    } else {
                        failCount++;
                    }
                } catch (e) {
                    failCount++;
                }
            }

            if (successCount === 0 && failCount === unread.length) {
                showToast('❌ تعذر تعليم الإشعارات كمقروءة في قاعدة بيانات التطبيق', 'error');
                showLoading(false);
                return;
            }
            renderCards();
            updateStats();
            generateAlerts();
            showLoading(false);

            if (successCount > 0) {
                showToast(`✅ تم تعليم ${successCount} إشعار كمقروء${failCount > 0 ? `، فشل ${failCount}` : ''}`, 'success');
            } else {
                showToast('❌ فشل تعليم الإشعارات', 'error');
            }
        }

        // ============================================================
        // 17. تنفيذ الإجراء المرتبط بالإشعار
        // ============================================================
        function executeAction(actionUrl) {
            if (!actionUrl) {
                showToast('⚠️ لا يوجد إجراء مرتبط', 'warning');
                return;
            }
            try {
                const value = String(actionUrl).trim();
                const parsed = new URL(value, window.location.href);
                const protocol = parsed.protocol.toLowerCase();
                if (protocol === 'http:' || protocol === 'https:') {
                    window.open(parsed.href, '_blank', 'noopener,noreferrer');
                    showToast('✅ تم فتح الرابط', 'success');
                    return;
                }
                if (['tel:', 'mailto:', 'whatsapp:', 'fb:'].includes(protocol)) {
                    window.location.href = value;
                    return;
                }
                if (value.startsWith('../') || value.startsWith('./') || value.startsWith('#')) {
                    window.location.href = value;
                    return;
                }
                showToast('⚠️ إجراء غير معروف أو غير مسموح', 'warning');
            } catch (error) {
                showToast('⚠️ الرابط المرتبط غير صالح', 'warning');
            }
        }

        // ============================================================
        // 18. القائمة السفلية
        // ============================================================
        function openTableModal(type) {
            const modal = document.getElementById('tableModal');
            const title = document.getElementById('tableModalTitle');
            const body = document.getElementById('tableModalBody');

            let html = '';
            let titleText = '';

            switch (type) {
                case 'all':
                    titleText = '📬 جميع الإشعارات';
                    html = generateTableFromNotifications(allNotifications);
                    break;
                case 'unread':
                    titleText = '📬 الإشعارات غير المقروءة';
                    const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false);
                    html = generateTableFromNotifications(unread);
                    break;
                case 'read':
                    titleText = '📖 الإشعارات المقروءة';
                    const read = allNotifications.filter(n => n.is_read == 1 || n.is_read === true);
                    html = generateTableFromNotifications(read);
                    break;
                case 'channels':
                    titleText = '📡 توزيع الإشعارات حسب القناة';
                    const channelMap = {};
                    allNotifications.forEach(n => {
                        const ch = n.channel || 'unknown';
                        channelMap[ch] = (channelMap[ch] || 0) + 1;
                    });
                    html = generateTableFromObject(channelMap, ['القناة', 'عدد الإشعارات']);
                    break;
                case 'reports':
                    titleText = '📊 تقارير صندوق الإشعارات';
                    const total = allNotifications.length;
                    const unreadCount = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
                    const readCount = total - unreadCount;
                    const urgentCount = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent').length;
                    const highCount = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'high').length;
                    const normalCount = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'normal').length;
                    const lowCount = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'low').length;
                    const pendingCount = allNotifications.filter(n => (n.status || '').toLowerCase() === 'pending').length;
                    const sentCount = allNotifications.filter(n => (n.status || '').toLowerCase() === 'sent').length;
                    const failedCount = allNotifications.filter(n => (n.status || '').toLowerCase() === 'failed').length;
                    const expiredCount = allNotifications.filter(n => isExpired(n.expires_at)).length;

                    html = `
                        <div style="text-align:center;padding:8px 0;">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                                <div class="stat-card" style="padding:12px;border:var(--border-width) var(--border-style) var(--border-color);border-radius:12px;">
                                    <div class="stat-value" style="font-size:1.2rem;">${total}</div>
                                    <div class="stat-label">إجمالي الإشعارات</div>
                                </div>
                                <div class="stat-card" style="padding:12px;border:var(--border-width) var(--border-style) var(--border-color);border-radius:12px;">
                                    <div class="stat-value" style="font-size:1.2rem;color:var(--error);">${unreadCount}</div>
                                    <div class="stat-label">غير مقروءة</div>
                                </div>
                                <div class="stat-card" style="padding:12px;border:var(--border-width) var(--border-style) var(--border-color);border-radius:12px;">
                                    <div class="stat-value" style="font-size:1.2rem;color:var(--success);">${readCount}</div>
                                    <div class="stat-label">مقروءة</div>
                                </div>
                                <div class="stat-card" style="padding:12px;border:var(--border-width) var(--border-style) var(--border-color);border-radius:12px;">
                                    <div class="stat-value" style="font-size:1.2rem;color:var(--error);">${urgentCount}</div>
                                    <div class="stat-label">عاجلة</div>
                                </div>
                            </div>
                            <table>
                                <thead><tr><th>المعيار</th><th>العدد</th></tr></thead>
                                <tbody>
                                    <tr><td>عالية الأولوية</td><td>${highCount}</td></tr>
                                    <tr><td>عادية</td><td>${normalCount}</td></tr>
                                    <tr><td>منخفضة</td><td>${lowCount}</td></tr>
                                    <tr><td>معلقة</td><td>${pendingCount}</td></tr>
                                    <tr><td>مرسلة</td><td>${sentCount}</td></tr>
                                    <tr><td>فاشلة</td><td>${failedCount}</td></tr>
                                    <tr><td>منتهية الصلاحية</td><td>${expiredCount}</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    break;
                default:
                    titleText = 'غير معروف';
                    html = '<div class="empty-state">لا توجد بيانات</div>';
            }

            title.textContent = titleText;
            body.innerHTML = html;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            hapticFeedback('light');

            // تفعيل العنصر في القائمة السفلية
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.bottom-nav .nav-item[data-modal="${type}"]`)?.classList.add('active');
        }

        function generateTableFromNotifications(notifications) {
            if (!notifications || notifications.length === 0) {
                return `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد إشعارات</p></div>`;
            }
            let table = `<table><thead><tr>
                <th>العنوان</th>
                <th>الأولوية</th>
                <th>القناة</th>
                <th>الحالة</th>
                <th>التاريخ</th>
            </tr></thead><tbody>`;
            notifications.forEach(n => {
                const isRead = n.is_read == 1 || n.is_read === true;
                const priority = getPriorityLabel(n.priority);
                const channel = getChannelLabel(n.channel);
                const status = getStatusLabel(n.status);
                table += `<tr>
                    <td>${escapeHtml((n.title || n.title_ar || '---').substring(0, 30))}${(n.title || '').length > 30 ? '...' : ''}</td>
                    <td><span class="badge badge-priority-${getPriorityClass(n.priority)}" style="font-size:0.7rem;padding:2px 8px;">${priority}</span></td>
                    <td><span class="badge badge-channel-${getChannelClass(n.channel)}" style="font-size:0.7rem;padding:2px 8px;">${channel}</span></td>
                    <td><span class="badge badge-status-${getStatusClass(n.status)}" style="font-size:0.7rem;padding:2px 8px;">${status}</span> ${isRead ? '📖' : '📬'}</td>
                    <td>${formatDate(n.created_at)}</td>
                </tr>`;
            });
            table += `</tbody></table>`;
            return table;
        }

        function generateTableFromObject(obj, headers) {
            const entries = Object.entries(obj);
            if (entries.length === 0) {
                return `<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد بيانات</p></div>`;
            }
            let table = `<table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            entries.forEach(([key, value]) => {
                const label = getChannelLabel(key);
                table += `<tr><td>${label}</td><td>${value}</td></tr>`;
            });
            table += `</tbody></table>`;
            return table;
        }

        // ============================================================
        // 19. إغلاق المودالات
        // ============================================================
        function closeModal(e) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('show'));
            document.body.style.overflow = '';
        }

        // ============================================================
        // 20. معالج أزرار القائمة الجانبية
        // ============================================================
        function handleSidebarAction(action) {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('open');
            document.getElementById('sidebarToggle').classList.remove('hidden');

            switch (action) {
                case 'refresh':
                    showLoading(true);
                    loadNotifications().finally(() => showLoading(false));
                    showToast('🔄 جاري تحديث الإشعارات...', 'info');
                    break;
                case 'markAllRead':
                    markAllAsRead();
                    break;
                case 'search':
                    document.getElementById('searchInput').focus();
                    showToast('🔍 اكتب كلمة البحث في الحقل أعلاه', 'info');
                    break;
                case 'stats':
                    openTableModal('reports');
                    break;
                case 'export':
                    exportNotifications();
                    break;
                default:
                    showToast('❌ إجراء غير معروف', 'error');
            }
        }

        // ============================================================
        // 21. تصدير الإشعارات
        // ============================================================
        function exportNotifications() {
            if (allNotifications.length === 0) {
                showToast('⚠️ لا توجد إشعارات للتصدير', 'warning');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const margin = 10;
                let y = margin;

                doc.setFontSize(18);
                doc.setTextColor(0, 122, 204);
                doc.text('صندوق الإشعارات', pageWidth / 2, y, { align: 'center' });
                y += 8;

                doc.setFontSize(10);
                doc.setTextColor(100);
                doc.text(`تاريخ التصدير: ${new Date().toLocaleString('ar-EG')}`, pageWidth / 2, y, { align: 'center' });
                y += 10;

                allNotifications.forEach((n, idx) => {
                    if (y > 250) {
                        doc.addPage();
                        y = margin;
                    }

                    const isRead = n.is_read == 1 || n.is_read === true;
                    const priority = getPriorityLabel(n.priority);
                    const channel = getChannelLabel(n.channel);
                    const status = getStatusLabel(n.status);

                    doc.setFontSize(11);
                    doc.setTextColor(50);
                    doc.setFont('helvetica', 'bold');
                    doc.text(`${idx + 1}. ${n.title || n.title_ar || 'إشعار'}`, margin, y);
                    y += 5;

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(9);
                    doc.text(`الأولوية: ${priority} | القناة: ${channel} | الحالة: ${status} | ${isRead ? 'مقروء ✅' : 'غير مقروء 📬'}`, margin + 5, y);
                    y += 4;

                    const msg = (n.message || n.message_ar || '').substring(0, 80);
                    doc.text(`الرسالة: ${msg}${(n.message || '').length > 80 ? '...' : ''}`, margin + 5, y);
                    y += 5;

                    doc.text(`التاريخ: ${formatDate(n.created_at)}`, margin + 5, y);
                    y += 4;

                    if (n.expires_at) {
                        doc.text(`ينتهي في: ${formatDate(n.expires_at)}`, margin + 5, y);
                        y += 4;
                    }

                    doc.line(margin, y, pageWidth - margin, y);
                    y += 4;
                });

                const fileName = `notifications_inbox_${new Date().toISOString().substring(0, 10)}.pdf`;
                doc.save(fileName);
                showToast('✅ تم تصدير الإشعارات بنجاح', 'success');
                hapticFeedback('success');
            } catch (e) {
                showToast('❌ فشل التصدير: ' + e.message, 'error');
                console.error('Export error:', e);
            }
        }

        // ============================================================
        // 22. المستشار الذكي (AI Advisor)
        // ============================================================
        function openAIAdvisor() {
            const total = allNotifications.length;
            const unread = allNotifications.filter(n => n.is_read == 0 || n.is_read === false).length;
            const urgent = allNotifications.filter(n => (n.priority || '').toLowerCase() === 'urgent' && (n.is_read == 0 || n.is_read === false)).length;
            const failed = allNotifications.filter(n => (n.status || '').toLowerCase() === 'failed').length;
            const expired = allNotifications.filter(n => isExpired(n.expires_at)).length;

            let suggestion = '';
            if (total === 0) {
                suggestion = '📭 لا توجد إشعارات في صندوق الوارد.';
            } else if (urgent > 0) {
                suggestion = `🚨 لديك ${urgent} إشعار عاجل غير مقروء. يُنصح بمراجعتهم فوراً.`;
            } else if (unread > 0) {
                suggestion = `📬 لديك ${unread} إشعار غير مقروء. يُنصح بمراجعتهم.`;
            } else {
                suggestion = '✅ جميع الإشعارات مقروءة.';
            }

            if (failed > 0) {
                suggestion += ` ❌ ${failed} إشعار فشل إرساله.`;
            }
            if (expired > 0) {
                suggestion += ` ⏳ ${expired} إشعار منتهي الصلاحية.`;
            }

            Swal.fire({
                title: '🤖 المستشار الذكي - صندوق الإشعارات',
                html: `
                    <div style="text-align:center;">
                        <p>📊 إجمالي الإشعارات: ${total}</p>
                        <p>📬 غير مقروءة: ${unread}</p>
                        <p>📖 مقروءة: ${total - unread}</p>
                        <p>🚨 عاجلة غير مقروءة: ${urgent}</p>
                        <p>❌ فاشلة: ${failed}</p>
                        <p>⏳ منتهية الصلاحية: ${expired}</p>
                        <hr style="border:var(--border-width) var(--border-style) var(--border-color);margin:12px 0;">
                        <p style="font-weight:bold;">💡 التوصية: ${suggestion}</p>
                    </div>
                `,
                icon: 'info',
                confirmButtonText: 'حسناً',
                background: '#1a2236',
                color: '#f1f5f9'
            });
            hapticFeedback('light');
        }

        // ============================================================
        // 23. إعداد القائمة الجانبية
        // ============================================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
                toggle.classList.toggle('hidden');
                hapticFeedback('light');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                    toggle.classList.remove('hidden');
                }
            });
        }

        // ============================================================
        // 24. التهيئة النهائية
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            setupSidebar();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            updateOnlineStatus();
            loadNotifications();

            // تعيين الفلتر النشط
            document.querySelector('.filter-chip.active')?.classList.remove('active');
            document.querySelector('.filter-chip[data-filter="all"]')?.classList.add('active');

            // إضافة مستمع لإغلاق المودالات
            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.addEventListener('click', closeModal);
            });

            // إضافة مستمع ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            setTimeout(() => {
                generateAlerts();
            }, 1000);

        });
    </script>
</body>
</html>
