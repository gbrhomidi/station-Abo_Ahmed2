<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام إدارة محطات الوقود – إدارة الفئات</title>
  <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
  <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
  <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
  <style>
    /* ============================================================
       نظام الألوان الموحّد — مستوحى من debt-reminders.html
       وضع فاتح افتراضي + وضع مظلم مخفف
       إطار فضي رفيع (1px) على جميع البطاقات والحقول
       ============================================================ */
    :root {
      /* ═══ الوضع الفاتح (افتراضي) ═══ */
      --bg-primary: #f0f2f5;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.96);
      --bg-glass: rgba(0, 0, 0, 0.025);
      --bg-glass-light: rgba(0, 0, 0, 0.05);
      --text-primary: #1a2233;
      --text-secondary: #44546a;
      --text-muted: #8391a5;
      --border-color: #d8dde4;

      /* إطار فضي رفيع موحّد */
      --silver-border-color: #c4cad2;
      --silver-border-color-strong: #a8b0bb;
      --silver-border: 1px solid var(--silver-border-color);
      --silver-border-strong: 1px solid var(--silver-border-color-strong);
      --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

      --gold-primary: #c89a12;
      --gold-dark: #a67c00;
      --gold-light: #f5c842;
      --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

      --emerald-primary: #059669;
      --emerald-dark: #047857;
      --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --info: #2563eb;
      --purple: #7c3aed;

      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
      --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

      --radius-card: 20px;
      --radius-small: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

      --header-bg: rgba(255, 255, 255, 0.94);
      --nav-bg: rgba(255, 255, 255, 0.96);
      --sidebar-bg: rgba(255, 255, 255, 0.98);
      --toast-bg: #ffffff;

      color-scheme: light;
    }

    /* ═══ الوضع المظلم المخفّف ═══ */
    [data-theme="dark"] {
      --bg-primary: #1e232b;
      --bg-secondary: #262c36;
      --bg-card: rgba(40, 47, 58, 0.88);
      --bg-glass: rgba(255, 255, 255, 0.035);
      --bg-glass-light: rgba(255, 255, 255, 0.075);
      --text-primary: #d8dee6;
      --text-secondary: #9aa5b4;
      --text-muted: #6a7686;
      --border-color: rgba(200, 205, 212, 0.2);

      --silver-border-color: rgba(192, 197, 204, 0.35);
      --silver-border-color-strong: rgba(192, 197, 204, 0.55);
      --silver-border: 1px solid var(--silver-border-color);
      --silver-border-strong: 1px solid var(--silver-border-color-strong);
      --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

      --gold-primary: #f5c842;
      --gold-dark: #c99f1e;
      --gold-light: #f7d268;
      --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

      --emerald-primary: #10b981;
      --emerald-dark: #059669;
      --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --purple: #9b59b6;

      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

      --header-bg: rgba(30, 35, 43, 0.94);
      --nav-bg: rgba(30, 35, 43, 0.96);
      --sidebar-bg: rgba(38, 44, 54, 0.98);
      --toast-bg: #262c36;

      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      direction: rtl;
      overflow-x: hidden;
      min-height: 100vh;
      padding: 0 0 90px 0;
      background-image:
          radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
          radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
      -webkit-font-smoothing: antialiased;
      transition: background 0.35s ease, color 0.35s ease;
    }

    [data-theme="dark"] body {
      background-image:
          radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
          radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

    /* ============================================================
       الشريط العلوي
       ============================================================ */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: var(--silver-border);
      padding: 14px 22px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      transition: var(--transition);
      min-height: 70px;
    }

    .top-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .top-title h2 {
      font-size: 1.35rem;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: none;
    }

    .top-title h2::before {
      content: '\f02d';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      -webkit-text-fill-color: var(--gold-primary);
      color: var(--gold-primary);
      font-size: 1.1rem;
    }

    /* مجموعة الأزرار في الشريط العلوي */
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .mode-toggle-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: var(--silver-border);
      background: var(--bg-glass);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
      position: relative;
      box-shadow: var(--silver-shadow);
      flex-shrink: 0;
    }

    .mode-toggle-btn i {
      font-size: 1rem;
      color: var(--gold-primary);
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle-btn:hover {
      background: var(--bg-glass-light);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      transform: translateY(-2px);
      box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
    }

    .mode-toggle-btn:active { transform: scale(0.92); }

    /* ============================================================
       القائمة الجانبية
       ============================================================ */
    .sidebar {
      position: fixed;
      top: 50%;
      right: -140px;
      transform: translateY(-50%);
      width: 110px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 999;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      padding: 12px 10px;
      border-radius: 18px 0 0 18px;
      overflow-y: auto;
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
      border: var(--silver-border);
      opacity: 0;
      border-right: none;
      perspective: none;
      transform-style: flat;
    }

    .sidebar.open {
      right: 0;
      opacity: 1;
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-btn {
      position: relative;
      overflow: hidden;
      background: var(--bg-glass);
      border: var(--silver-border);
      padding: 12px 6px;
      border-radius: 12px;
      color: var(--text-secondary);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 72px;
      text-align: center;
      font-size: 0.85rem;
      font-family: 'Cairo', 'Inter', sans-serif;
      touch-action: manipulation;
      box-shadow: var(--silver-shadow);
      animation: none;
      transform-style: flat;
      backdrop-filter: none;
    }

    .sidebar-btn .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(200, 154, 18, 0.15) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .sidebar-btn:hover .glow { opacity: 1; }

    .sidebar-btn:active { transform: scale(0.92); }

    .sidebar-btn:hover {
      background: var(--bg-glass-light);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      transform: scale(1.05);
      box-shadow: var(--silver-shadow), 0 4px 14px rgba(200, 154, 18, 0.18);
    }

    .sidebar-btn i {
      font-size: 1.5rem;
      transition: var(--transition);
      text-shadow: none;
    }

    .sidebar-btn:hover i {
      transform: scale(1.2);
      color: var(--gold-primary);
    }

    .sidebar-btn span {
      font-size: 0.68rem;
      margin-top: 2px;
      font-weight: 800;
    }

    .sidebar-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      white-space: nowrap;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: none;
      z-index: 1002;
      font-weight: 700;
      box-shadow: var(--silver-shadow), 0 4px 12px rgba(0, 0, 0, 0.15);
      min-width: 100px;
      text-align: center;
      border: var(--silver-border);
      opacity: 0;
    }

    .sidebar-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sidebar-toggle {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      background: var(--gold-primary);
      color: #ffffff;
      width: 40px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50% 0 0 50%;
      cursor: pointer;
      z-index: 1001;
      box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
      transition: var(--transition);
      border: var(--silver-border);
      perspective: none;
      transform-style: flat;
    }

    .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }

    .sidebar-toggle.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(0.8);
    }

    .sidebar-toggle:hover {
      background: var(--gold-dark);
      width: 44px;
      box-shadow: -4px 0 18px rgba(200, 154, 18, 0.4);
      transform: translateY(-50%) scale(1.05);
    }

    .sidebar-toggle i {
      font-size: 1.1rem;
      transition: transform 0.3s;
      color: #ffffff;
    }

    /* ============================================================
       مؤشر التحميل
       ============================================================ */
    .loading-indicator {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 3000;
      display: none;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }

    .loading-indicator.show { display: flex; }

    .spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(200, 154, 18, 0.15);
      border-top: 4px solid var(--gold-primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       التنبيهات (Toast)
       ============================================================ */
    .alert-message {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--toast-bg);
      border: var(--silver-border-strong);
      border-radius: 14px;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 2000;
      transition: all 0.4s ease;
      pointer-events: none;
      box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
      min-width: 220px;
      font-size: 0.85rem;
      color: var(--text-primary);
      font-weight: 700;
      font-family: 'Cairo', 'Inter', sans-serif;
      text-align: center;
      animation: toastAnim 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      max-width: 90%;
      box-sizing: border-box;
    }

    @keyframes toastAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      10%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      90%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }

    .alert-message.success {
      border-color: var(--emerald-primary);
      color: var(--emerald-primary);
      background: var(--toast-bg);
    }

    .alert-message.error {
      border-color: var(--danger);
      color: var(--danger);
      background: var(--toast-bg);
    }

    .alert-message.info {
      border-color: var(--gold-primary);
      color: var(--gold-primary);
      background: var(--toast-bg);
    }

    /* ============================================================
       الحاوية والمحتوى
       ============================================================ */
    .container {
      max-width: 100%;
      overflow-x: hidden;
      padding: 0 20px 30px;
      box-sizing: border-box;
      margin-top: 90px;
    }

    /* ============================================================
       البطاقة الزجاجية
       ============================================================ */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--silver-border-strong);
      border-radius: var(--radius-card);
      box-shadow: var(--silver-shadow), var(--shadow-card);
      padding: 20px;
      margin-bottom: 18px;
      transition: var(--transition);
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
      opacity: 0.85;
    }

    .glass-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-primary);
      box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
    }

    /* ============================================================
       النموذج (Form Grid)
       ============================================================ */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 4px;
    }

    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      padding: 12px 14px;
      border-radius: var(--radius-small);
      border: var(--silver-border);
      background: var(--bg-glass);
      color: var(--text-primary);
      font-family: 'Cairo', 'Inter', sans-serif;
      font-size: 0.88rem;
      width: 100%;
      box-sizing: border-box;
      transition: var(--transition);
      outline: none;
      box-shadow: var(--silver-shadow);
      text-align: center;
      font-weight: 600;
    }

    .form-grid input:focus,
    .form-grid select:focus,
    .form-grid textarea:focus {
      border: var(--silver-border-strong);
      box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
    }

    .form-grid input::placeholder,
    .form-grid textarea::placeholder {
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
    }

    .form-grid select option {
      background: var(--bg-secondary);
      color: var(--text-primary);
      text-align: center;
    }

    .form-grid textarea {
      resize: vertical;
      min-height: 70px;
      line-height: 1.8;
      text-align: center;
    }

    /* ─── الصف الأفقي: حقلان في كل سطر ─── */
    .horizontal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .horizontal-row > div {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       تسميات النموذج
       ============================================================ */
    .form-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 800;
      color: var(--text-secondary);
      font-size: 0.82rem;
      text-align: center;
      letter-spacing: 0.2px;
    }

    /* ============================================================
       الجدول — إطارات فضية على كل خلية
       ============================================================ */
    .table-container {
      width: 100%;
      overflow: auto;
      margin-top: 8px;
      max-height: 420px;
      border-radius: var(--radius-card);
      border: var(--silver-border-strong);
      box-shadow: var(--silver-shadow), var(--shadow-card);
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      padding: 8px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      font-size: 0.82rem;
      min-width: 640px;
    }

    table th,
    table td {
      padding: 12px 10px;
      text-align: center;
      white-space: nowrap;
      vertical-align: middle;
      font-size: 0.8rem;
      border: var(--silver-border);
    }

    table th {
      background: var(--bg-glass-light);
      color: var(--gold-primary);
      font-weight: 800;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: sticky;
      top: 0;
      z-index: 5;
      border-radius: 10px 10px 0 0;
    }

    table td {
      background: var(--bg-glass);
      color: var(--text-secondary);
      border-radius: 10px;
      font-weight: 600;
    }

    table tr:first-child th:first-child {
      border-top-right-radius: 10px;
    }

    table tr:first-child th:last-child {
      border-top-left-radius: 10px;
    }

    table tr:last-child td:first-child {
      border-bottom-right-radius: 10px;
    }

    table tr:last-child td:last-child {
      border-bottom-left-radius: 10px;
    }

    table tr:nth-child(even) td {
      background: var(--bg-glass);
    }

    [data-theme="dark"] table tr:nth-child(even) td {
      background: var(--bg-glass);
    }

    table tr:hover td {
      background: var(--bg-glass-light);
      color: var(--text-primary);
    }

    [data-theme="dark"] table tr:hover td {
      background: var(--bg-glass-light);
    }

    tr.selected td {
      background: rgba(200, 154, 18, 0.12) !important;
      color: var(--gold-primary) !important;
      border-color: var(--gold-primary) !important;
      box-shadow: inset 0 0 0 1px var(--gold-primary);
    }

    [data-theme="dark"] tr.selected td {
      background: rgba(245, 200, 66, 0.12) !important;
      color: var(--gold-light) !important;
      border-color: var(--gold-primary) !important;
    }

    /* ============================================================
       استجابة الشاشات الصغيرة
       ============================================================ */
    @media (max-width: 768px) {
      .container {
        padding: 0 12px 30px;
        margin-top: 85px;
      }

      .glass-card {
        padding: 16px 14px;
      }

      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        padding: 10px 12px;
        font-size: 0.85rem;
      }

      table th,
      table td {
        padding: 10px 8px;
        font-size: 0.75rem;
      }

      .sidebar {
        width: 100px;
        padding: 10px 8px;
      }

      .sidebar-btn {
        min-height: 66px;
        padding: 10px 4px;
      }

      .sidebar-btn i {
        font-size: 1.3rem;
      }

      .top-title h2 {
        font-size: 1.15rem;
      }
    }

    @media (max-width: 480px) {
      .horizontal-row {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .top-bar {
        padding: 12px 14px 10px;
        min-height: 64px;
      }

      .top-title h2 {
        font-size: 1.05rem;
      }

      .mode-toggle-btn {
        width: 38px;
        height: 38px;
      }

      .header-actions {
        gap: 6px;
      }
    }

    /* ============================================================
       الطباعة
       ============================================================ */
    @media print {
      .top-bar, .sidebar, .sidebar-toggle, .loading-indicator,
      .mode-toggle-btn, .header-actions { display: none !important; }
      .container { margin-top: 0; }
    }
  </style>
</head>
<body>
  <!-- شريط المعلومات العلوي -->
  <div class="top-bar">
    <div class="top-title">
      <h2>إدارة الفئات</h2>
    </div>
    <div class="header-actions">
      <button id="homeBtn" class="mode-toggle-btn" title="العودة للرئيسية" onclick="goHome()">
        <i class="fas fa-home"></i>
      </button>
      <button id="darkModeToggle" class="mode-toggle-btn" title="تبديل الوضع">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </div>

  <!-- القائمة الجانبية -->
  <div class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-content">
      <button class="sidebar-btn ripple" data-tooltip="حفظ التغييرات" onclick="saveCategory()">
        <div class="glow"></div>
        <i class="fas fa-save"></i>
        <span>💾 حفظ</span>
      </button>
      <button class="sidebar-btn ripple" data-tooltip="بحث عن فئة" onclick="searchCategory()">
        <div class="glow"></div>
        <i class="fas fa-search"></i>
        <span>👀 استعلام</span>
      </button>
      <button class="sidebar-btn ripple" data-tooltip="تعديل الفئة المحددة" onclick="updateCategory()">
        <div class="glow"></div>
        <i class="fas fa-edit"></i>
        <span>🛠 تعديل</span>
      </button>
      <button class="sidebar-btn ripple" data-tooltip="حذف الفئة المحددة" onclick="deleteCategory()">
        <div class="glow"></div>
        <i class="fas fa-trash"></i>
        <span>🗑 حذف</span>
      </button>
      <button class="sidebar-btn ripple" data-tooltip="إضافة فئة جديدة" onclick="newCategory()">
        <div class="glow"></div>
        <i class="fas fa-plus"></i>
        <span>➕ جديد</span>
      </button>
    </div>
  </div>

  <!-- مؤشر تحميل -->
  <div class="loading-indicator" id="loadingIndicator">
    <div class="spinner"></div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="container">
    <div id="alertContainer"></div>

    <form id="categoryForm" onsubmit="return false;">
      <input type="hidden" name="category_id" id="categoryId" value="0">
      <div class="form-grid">
        <!-- حقل اسم الفئة -->
        <div>
          <label class="form-label">اسم الفئة</label>
          <input type="text" name="category_name" id="categoryName" placeholder="أدخل اسم الفئة" required>
        </div>

        <!-- الصف الأفقي: حقلان في كل سطر -->
        <div class="horizontal-row">
          <div>
            <label class="form-label">النوع</label>
            <select name="category_type" id="categoryType" required>
              <option value="">اختر النوع</option>
              <option value="product">منتج</option>
              <option value="service">خدمة</option>
              <option value="asset">أصل</option>
              <option value="expense">مصروف</option>
            </select>
          </div>
          <div>
            <label class="form-label">الفئة الأب</label>
            <select name="parent_category_id" id="parentCategory">
              <option value="">اختر الفئة الأب</option>
              <!-- سيتم ملء هذا من قاعدة البيانات -->
            </select>
          </div>
        </div>

        <div class="horizontal-row">
          <div>
            <label class="form-label">الحالة</label>
            <select name="is_active" id="isActive" required>
              <option value="1">نشط</option>
              <option value="0">غير نشط</option>
            </select>
          </div>
          <div>
            <label class="form-label">معدل الضريبة (%)</label>
            <input type="number" step="0.01" name="tax_rate" id="taxRate" placeholder="أدخل معدل الضريبة">
          </div>
        </div>

        <!-- الحقول الأخرى -->
        <div>
          <label class="form-label">الوصف</label>
          <textarea name="description" id="description" placeholder="أدخل وصفاً للفئة" rows="2"></textarea>
        </div>
      </div>
    </form>

    <div class="table-container">
      <table id="categoriesTable">
        <thead>
          <tr>
            <th>المعرف</th>
            <th>الاسم</th>
            <th>النوع</th>
            <th>الفئة الأب</th>
            <th>معدل الضريبة</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="categoriesTableBody">
          <!-- سيتم ملء هذا من قاعدة البيانات -->
        </tbody>
      </table>
    </div>
  </div>

<script>
// ============================================================
// 1. دوال apiCall و handleAndroidResult (الموحدة)
// ============================================================
function apiCall(action, params) {
    const p = params || {};
    if (!window.AndroidInterface) return Promise.reject({ success: false, message: 'جسر Android غير متاح' });
    try {
        let raw;
        switch (action) {
            case 'getCategories': raw = AndroidInterface.getCategories(); break;
            case 'saveCategory': {
                const payload = { category_code: p.category_code || `CAT-${Date.now()}`, category_name: p.category_name, category_name_ar: p.category_name_ar || p.category_name, category_type: p.category_type || 'product', parent_category_id: p.parent_category_id || null, tax_rate: Number(p.tax_rate || 0), description: p.description || '', is_active: Number(p.is_active ?? 1) };
                raw = Number(p.category_id || 0) > 0 ? AndroidInterface.updateProductCategory(Number(p.category_id), JSON.stringify(payload)) : AndroidInterface.addProductCategory(JSON.stringify(payload)); break;
            }
            case 'deleteCategory': raw = AndroidInterface.deleteProductCategory(Number(p.category_id)); break;
            case 'searchCategories': raw = AndroidInterface.searchProductCategories(String(p.search || '')); break;
            case 'getCategory': {
                const item = (AppState.categories || []).find(x => Number(x.id || x.category_id) === Number(p.category_id));
                return Promise.resolve(item ? { success: true, data: item } : { success: false, message: 'الفئة غير موجودة' });
            }
            default: return Promise.reject({ success: false, message: 'العملية غير مدعومة: ' + action });
        }
        return Promise.resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
    } catch (e) { return Promise.reject({ success: false, message: e.message || 'فشل استدعاء الجسر' }); }
}

function handleAndroidResult(action, data) {
    try {
        const parsed = typeof data === 'string' ? JSON.parse(data) : data;
        if (window._pendingResolve) {
            window._pendingResolve(parsed);
            window._pendingResolve = null;
        }
    } catch (e) {
        console.error('Error in handleAndroidResult:', e);
    }
}

// ============================================================
// 2. دوال مساعدة (Toast, Loading)
// ============================================================
function showToast(message, type = 'success') {
    // محاكاة الـ Toast الأصلية مع دعم الأنواع
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert-message ${type}`;
    alertDiv.textContent = message;
    document.body.appendChild(alertDiv);
    setTimeout(() => {
        alertDiv.remove();
    }, 3000);
}

function showLoading(show) {
    const loader = document.getElementById('loadingIndicator');
    if (loader) {
        loader.style.display = show ? 'flex' : 'none';
        loader.classList.toggle('show', !!show);
    }
}

// ============================================================
// 3. حالة التطبيق
// ============================================================
const AppState = {
    categories: [],
    parentCategories: [],
    selectedCategoryId: null
};

// ============================================================
// 4. دوال جلب البيانات عبر apiCall
// ============================================================
function loadCategories() {
    showLoading(true);
    apiCall('getCategories', {})
    .then(result => {
        showLoading(false);
        if (result.success) {
            const categories = result.data || [];
            AppState.categories = categories;
            AppState.parentCategories = categories.filter(c => !c.parent_category_id || c.parent_category_id === '');
            populateTable(categories);

            // تحديث قائمة الفئات الأب
            const parentSelect = document.getElementById('parentCategory');
            parentSelect.innerHTML = '<option value="">اختر الفئة الأب</option>';
            AppState.parentCategories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.id;
                option.textContent = cat.category_name || cat.name;
                parentSelect.appendChild(option);
            });
        } else {
            showToast(result.message || 'حدث خطأ أثناء جلب البيانات', 'error');
        }
    })
    .catch(error => {
        showLoading(false);
        showToast('حدث خطأ في الاتصال بالجسر', 'error');
        console.error(error);
    });
}

function populateTable(categories) {
    const tbody = document.getElementById('categoriesTableBody');
    tbody.innerHTML = '';

    if (categories.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="6" style="text-align: center;">لا توجد بيانات متاحة</td>';
        tbody.appendChild(tr);
        return;
    }

    categories.forEach(category => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-id', category.id);

        if (AppState.selectedCategoryId && AppState.selectedCategoryId == category.id) {
            tr.classList.add('selected');
        }

        const parentName = category.parent_name || (category.parent_category_name) || '-';

        tr.innerHTML = `
            <td>${category.id}</td>
            <td>${category.category_name || category.name}</td>
            <td>${category.category_type || category.type || '-'}</td>
            <td>${parentName}</td>
            <td>${category.tax_rate || '0.00'}%</td>
            <td>${category.is_active ? 'نشط' : 'غير نشط'}</td>
        `;

        tr.addEventListener('click', function() {
            document.querySelectorAll('tr.selected').forEach(row => {
                row.classList.remove('selected');
            });
            this.classList.add('selected');
            AppState.selectedCategoryId = category.id;
            fillFormWithCategoryData(category);
        });

        tbody.appendChild(tr);
    });
}

function fillFormWithCategoryData(category) {
    document.getElementById('categoryId').value = category.id;
    document.getElementById('categoryName').value = category.category_name || category.name || '';
    document.getElementById('categoryType').value = category.category_type || category.type || '';
    document.getElementById('parentCategory').value = category.parent_category_id || category.parent_id || '';
    document.getElementById('taxRate').value = category.tax_rate || '';
    document.getElementById('description').value = category.description || '';
    document.getElementById('isActive').value = category.is_active ? '1' : '0';
    AppState.selectedCategoryId = category.id;
}

// ============================================================
// 5. دوال العمليات (حفظ، حذف، بحث، تحديث، جديد)
// ============================================================
function saveCategory() {
    const categoryId = document.getElementById('categoryId').value;
    const categoryName = document.getElementById('categoryName').value.trim();
    const categoryType = document.getElementById('categoryType').value;
    const parentCategory = document.getElementById('parentCategory').value;
    const taxRate = document.getElementById('taxRate').value;
    const description = document.getElementById('description').value.trim();
    const isActive = document.getElementById('isActive').value;

    if (!categoryName) {
        showToast('يرجى إدخال اسم الفئة', 'error');
        return;
    }

    const data = {
        category_id: parseInt(categoryId) || 0,
        category_name: categoryName,
        category_type: categoryType,
        parent_category_id: parentCategory ? parseInt(parentCategory) : null,
        tax_rate: parseFloat(taxRate) || 0,
        description: description,
        is_active: parseInt(isActive)
    };

    showLoading(true);
    apiCall('saveCategory', data)
    .then(result => {
        showLoading(false);
        if (result.success) {
            const action = categoryId === '0' ? 'إضافة' : 'تحديث';
            showToast(`تم ${action} الفئة بنجاح`, 'success');
            loadCategories();
            if (categoryId === '0') {
                document.getElementById('categoryForm').reset();
                document.getElementById('categoryId').value = '0';
                AppState.selectedCategoryId = null;
            }
        } else {
            showToast(result.message || 'حدث خطأ أثناء الحفظ', 'error');
        }
    })
    .catch(error => {
        showLoading(false);
        showToast('حدث خطأ في الاتصال بالجسر', 'error');
        console.error(error);
    });
}

function deleteCategory() {
    const id = AppState.selectedCategoryId || document.getElementById('categoryId').value;
    if (!id || id === "0") {
        showToast('يرجى اختيار فئة لحذفها', 'error');
        return;
    }

    if (confirm("هل أنت متأكد من حذف هذه الفئة؟")) {
        showLoading(true);
        apiCall('deleteCategory', { category_id: parseInt(id) })
        .then(result => {
            showLoading(false);
            if (result.success) {
                showToast('تم حذف الفئة بنجاح', 'success');
                loadCategories();
                document.getElementById('categoryForm').reset();
                document.getElementById('categoryId').value = '0';
                AppState.selectedCategoryId = null;
            } else {
                showToast(result.message || 'حدث خطأ أثناء الحذف', 'error');
            }
        })
        .catch(error => {
            showLoading(false);
            showToast('حدث خطأ في الاتصال بالجسر', 'error');
            console.error(error);
        });
    }
}

function searchCategory() {
    const name = document.getElementById('categoryName').value.trim();
    if (name) {
        showLoading(true);
        apiCall('searchCategories', { search: name })
        .then(result => {
            showLoading(false);
            if (result.success) {
                showToast(`تم العثور على ${result.data ? result.data.length : 0} نتيجة`, 'info');
                populateTable(result.data || []);
            } else {
                showToast(result.message || 'حدث خطأ أثناء البحث', 'error');
            }
        })
        .catch(error => {
            showLoading(false);
            showToast('حدث خطأ في الاتصال بالجسر', 'error');
            console.error(error);
        });
    } else {
        loadCategories();
    }
}

function updateCategory() {
    const id = AppState.selectedCategoryId || document.getElementById('categoryId').value;
    if (!id || id === "0") {
        showToast('يرجى اختيار فئة لتعديلها', 'error');
        return;
    }

    showLoading(true);
    apiCall('getCategory', { category_id: parseInt(id) })
    .then(result => {
        showLoading(false);
        if (result.success) {
            fillFormWithCategoryData(result.data);
            showToast('تم تحميل بيانات الفئة للتعديل', 'info');
        } else {
            showToast(result.message || 'حدث خطأ أثناء جلب بيانات الفئة', 'error');
        }
    })
    .catch(error => {
        showLoading(false);
        showToast('حدث خطأ في الاتصال بالجسر', 'error');
        console.error(error);
    });
}

function newCategory() {
    document.getElementById('categoryId').value = '0';
    document.getElementById('categoryForm').reset();
    document.querySelectorAll('tr.selected').forEach(row => {
        row.classList.remove('selected');
    });
    AppState.selectedCategoryId = null;
    showToast('تم تفعيل وضع إضافة فئة جديدة', 'info');
}

function goHome() {
    window.location.href = '../main.html';
}

// ============================================================
// 6. الوضع الليلي وإدارة القائمة الجانبية
// ============================================================
function toggleMode() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
    const icon = document.querySelector('#darkModeToggle i');
    icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
}

function loadSavedTheme() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const icon = document.querySelector('#darkModeToggle i');
    icon.className = savedTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

function setupSidebar() {
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');

    sidebarToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        sidebar.classList.toggle('open');
        if (sidebar.classList.contains('open')) {
            sidebarToggle.classList.add('hidden');
        } else {
            sidebarToggle.classList.remove('hidden');
        }
    });

    document.addEventListener('click', (e) => {
        if (!sidebar.contains(e.target) && e.target !== sidebarToggle) {
            sidebar.classList.remove('open');
            sidebarToggle.classList.remove('hidden');
        }
    });
}

// ============================================================
// 7. التهيئة الأولية
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    loadCategories();
    loadSavedTheme();
    setupSidebar();
    document.getElementById('darkModeToggle').addEventListener('click', toggleMode);

    // التنقل بين الحقول باستخدام Enter
    const formElements = document.querySelectorAll('#categoryForm input, #categoryForm select, #categoryForm textarea');
    formElements.forEach((el, index) => {
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < formElements.length - 1) {
                    formElements[index + 1].focus();
                } else {
                    saveCategory();
                }
            }
        });
    });
});
</script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
