                <button type="button" class="btn btn-primary" onclick="generateReport()"><i class="fas fa-cog"></i> توليد التقرير</button>
                <button type="button" class="btn" onclick="exportData()"><i class="fas fa-file-export"></i> Excel/CSV</button>
                <button type="button" class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة/PDF</button>
            </div>
            <div id="reportResults" style="margin-top:14px"></div>
        </div>
    </div></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
        'use strict';
        const CFG = {
            "title": "معايرة المعدات",
            "icon": "fa-sliders-h",
            "module": "tanks",
            "listMethod": "getCalibrationRecords",
            "listArgs": ["{}"],
            "fields": [
                { "label": "كود المعايرة", "key": "calibration_code", "type": "text", "required": true, "placeholder": "" },
                { "label": "نوع المعدة", "key": "entity_type", "type": "select", "required": true, "placeholder": "" },
                { "label": "المعدة", "key": "entity_id", "type": "number", "required": true, "placeholder": "" },
                { "label": "تاريخ المعايرة", "key": "calibration_date", "type": "date", "required": true, "placeholder": "" },
                { "label": "الفني", "key": "technician", "type": "text", "required": false, "placeholder": "" },
                { "label": "القيمة قبل", "key": "before_value", "type": "number", "required": false, "placeholder": "" },
                { "label": "القيمة بعد", "key": "after_value", "type": "number", "required": false, "placeholder": "" },
                { "label": "قيمة الخطأ", "key": "error_value", "type": "number", "required": false, "placeholder": "" },
                { "label": "نسبة التصحيح", "key": "correction_percent", "type": "number", "required": false, "placeholder": "" },
                { "label": "معامل المعايرة", "key": "calibration_factor", "type": "number", "required": false, "placeholder": "" },
                { "label": "رقم الشهادة", "key": "certificate_number", "type": "text", "required": false, "placeholder": "" },
                { "label": "مسار الشهادة", "key": "certificate_path", "type": "text", "required": false, "placeholder": "" },
                { "label": "المعايرة القادمة", "key": "next_calibration_date", "type": "date", "required": false, "placeholder": "" },
                { "label": "ملاحظات", "key": "notes", "type": "textarea", "required": false, "placeholder": "" },
                { "label": "الحالة", "key": "status", "type": "select", "required": false, "placeholder": "" }
            ],
            "valueFields": ["before_value", "after_value", "error_value"],
            "titleFields": ["calibration_code", "entity_type", "entity_id"],
            "subtitleFields": ["calibration_code", "entity_type", "entity_id", "calibration_date", "technician", "error_value", "correction_percent"],
            "createMethod": "saveCalibrationRecord",
            "updateMethod": "updateCalibrationRecord",
            "deleteMethod": "deleteCalibrationRecord",
            "note": "",
            "mode": "list",
            "objectMode": false,
            "updateAction": null,
            "reportKind": "operational:Calibration",
            "aiMethod": null,
            "reports": ["الكل", "مكتملة", "مجدولة", "قيد التنفيذ", "فاشلة"],
            "filterKeys": ["all", "completed", "scheduled", "in_progress", "failed"],
            "resolveMethod": null,
            "operationKey": "calibration_records"
        };
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: '0', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => businessDayDate();
        const numFmt = (v, decimals=4) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('ar',{maximumFractionDigits:decimals}) : '—'; };

        // ============================================================
        // أدوات مساعدة
        // ============================================================
        function toast(message, bad=false) {
            const node = $('toast');
            node.textContent = message;
            node.className = 'toast show';
            node.style.background = bad ? 'var(--danger)' : 'var(--toast-bg)';
            node.style.color = bad ? '#fff' : 'var(--text-primary)';
            clearTimeout(node._timer);
            node._timer = setTimeout(() => node.classList.remove('show'), 3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) {
            if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
            const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
            return value;
        }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            try { return Promise.resolve(parse(bridge[method](...args))); }
            catch (error) { return Promise.reject(error); }
        }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({ limit: 500, search: $('searchInput').value || '' })];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw = dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val]) => ({key, value:val}));
            if (raw && typeof raw === 'object' && raw.id !== undefined) return [raw];
            return [];
        }
        function field(row, names) {
            for (const name of (names || [])) {
                if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
            }
            return '';
        }
        function titleOf(row) {
            const code = field(row, ['calibration_code']);
            const entityType = trEntityType(field(row, ['entity_type']));
            const entityId = field(row, ['entity_id']);
            return `${code || '—'} · ${entityType} ${entityId || ''}`;
        }
        function subtitleOf(row) {
            const date = field(row, ['calibration_date']);
            const tech = field(row, ['technician']);
            const err = field(row, ['error_value']);
            return `التاريخ: ${date || '—'}${tech ? ' · الفني: ' + tech : ''}${err !== '' ? ' · الخطأ: ' + numFmt(err, 4) : ''}`;
        }
        function idOf(row) { return field(row,['id','_id','calibration_id','calibration_record_id']); }
        function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function setDateDefaults() {
            $('reportFrom').value = $('reportFrom').value || today();
            $('reportTo').value = $('reportTo').value || today();
        }

        // ============================================================
        // ترجمة
        // ============================================================
        const AR = {
            id: 'المعرّف',
            calibration_code: 'كود المعايرة',
            entity_type: 'نوع المعدة',
            entity_id: 'المعدة',
            calibration_date: 'تاريخ المعايرة',
            technician: 'الفني',
            before_value: 'القيمة قبل',
            after_value: 'القيمة بعد',
            error_value: 'قيمة الخطأ',
            correction_percent: 'نسبة التصحيح',
            calibration_factor: 'معامل المعايرة',
            certificate_number: 'رقم الشهادة',
            certificate_path: 'مسار الشهادة',
            next_calibration_date: 'المعايرة القادمة',
            notes: 'ملاحظات',
            status: 'الحالة',
            station_id: 'المحطة',
            created_at: 'تاريخ الإنشاء',
            updated_at: 'تاريخ التحديث',
            created_by: 'أنشأه'
        };
        function tr(key) { return AR[key] || key; }
        function trEntityType(v) {
            const s = String(v||'').toLowerCase();
            if (s === 'tank' || s === 'tanks') return 'خزان';
            if (s === 'pump' || s === 'pumps') return 'مضخة';
            if (s === 'nozzle' || s === 'nozzles' || s === 'pump_nozzle' || s === 'pump_nozzles') return 'فوهة';
            return v || '—';
        }
        function trStatus(v) {
            const s = String(v||'').toLowerCase();
            if (s === 'completed') return 'مكتملة';
            if (s === 'scheduled') return 'مجدولة';
            if (s === 'in_progress') return 'قيد التنفيذ';
            if (s === 'failed') return 'فاشلة';
            return v || '—';
        }
        function statusCode(label) {
            if (label === 'نشطة' || label === 'مكتملة') return 'completed';
            if (label === 'غير نشطة' || label === 'مجدولة') return 'scheduled';
            return label;
        }

        // ============================================================
        // التصفية بالتبويبات العلوية
        // ============================================================
        function renderFilters() {
            const labels = CFG.reports || ['الكل'];
            const icons = ['fa-list', 'fa-check-circle', 'fa-calendar', 'fa-tools', 'fa-times-circle'];
            const chips = $('filterChips');
            chips.innerHTML = labels.map((label,i) => `
                <button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">
                    <i class="fas ${icons[i]||'fa-circle'}"></i>
                    <span>${esc(label)}</span>
                    <span class="chip-count" data-chip-count="${i}">0</span>
                </button>`).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
                chips.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                applyFilter();
            }));

            // القائمة السفلية: إجراءات مختلفة (بدون تكرار التبويبات)
            const nav = $('bottomNav');
            nav.innerHTML = `
                <button type="button" class="nav-item" data-bottom-action="reload">
                    <i class="fas fa-sync-alt"></i><span>تحديث</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="export">
                    <i class="fas fa-file-export"></i><span>تصدير</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="report">
                    <i class="fas fa-chart-bar"></i><span>تقارير</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="print">
                    <i class="fas fa-print"></i><span>طباعة</span>
                </button>
                <button type="button" class="nav-item" data-bottom-action="home">
                    <i class="fas fa-home"></i><span>الرئيسية</span>
                </button>`;
            nav.querySelectorAll('[data-bottom-action]').forEach(btn => btn.addEventListener('click', () => {
                const action = btn.dataset.bottomAction;
                if (action === 'reload') reloadData();
                else if (action === 'export') exportData();
                else if (action === 'report') openReport();
                else if (action === 'print') window.print();
                else if (action === 'home') goHome();
            }));
        }

        function filterMatch(row, key) {
            if (!key || key === 'all') return true;
            const status = String(field(row, ['status']) || '').toLowerCase();
            return status === key;
        }

        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const keys = CFG.filterKeys || ['all'];
            const idx = parseInt(state.filter, 10);
            const filterKey = keys[isNaN(idx) ? 0 : idx] || 'all';

            state.filtered = state.rows.filter(row => {
                if (q) {
                    const rowText = JSON.stringify(row || {}).toLowerCase();
                    const arabicEntity = trEntityType(field(row, ['entity_type'])).toLowerCase();
                    const arabicStatus = trStatus(field(row, ['status'])).toLowerCase();
                    if (!rowText.includes(q) && !arabicEntity.includes(q) && !arabicStatus.includes(q)) return false;
                }
                return filterMatch(row, filterKey);
            });
            updateChipCounts();
            renderCards();
        }

        function updateChipCounts() {
            const keys = CFG.filterKeys || ['all'];
            const counts = keys.map(k => state.rows.filter(r => filterMatch(r, k)).length);
            counts.forEach((c, i) => {
                const el = document.querySelector(`[data-chip-count="${i}"]`);
                if (el) el.textContent = c.toLocaleString('ar');
            });
        }

        // ============================================================
        // الإحصائيات
        // ============================================================
        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = rows.length.toLocaleString('ar');
            $('itemCount').textContent = rows.length.toLocaleString('ar');

            const completed = rows.filter(r => String(field(r, ['status']) || '').toLowerCase() === 'completed').length;
            $('statActive').textContent = completed.toLocaleString('ar');

            const percents = rows
                .map(r => Number(field(r, ['correction_percent'])))
                .filter(n => Number.isFinite(n) && n !== 0);
            const avgPercent = percents.length ? percents.reduce((a,b) => a + b, 0) / percents.length : 0;
            $('statTotal').textContent = avgPercent ? avgPercent.toLocaleString('ar', { maximumFractionDigits: 2 }) + '%' : '—';

            $('statUpdated').textContent = state.loadedAt
                ? state.loadedAt.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
                : '—';
        }

        // ============================================================
        // شارات الحالة والأداء
        // ============================================================
        function statusBadge(row) {
            const s = String(field(row, ['status']) || '').toLowerCase();
            if (s === 'completed') return `<span class="data-card-badge ok"><i class="fas fa-check"></i> مكتملة</span>`;
            if (s === 'scheduled') return `<span class="data-card-badge info"><i class="fas fa-calendar"></i> مجدولة</span>`;
            if (s === 'in_progress') return `<span class="data-card-badge warn"><i class="fas fa-tools"></i> قيد التنفيذ</span>`;
            if (s === 'failed') return `<span class="data-card-badge danger"><i class="fas fa-times"></i> فاشلة</span>`;
            return `<span class="data-card-badge neutral">—</span>`;
        }
        function accuracyBadge(row) {
            const err = Number(field(row, ['error_value']));
            if (!Number.isFinite(err)) return '';
            const abs = Math.abs(err);
            if (abs <= 0.01) return `<span class="data-card-badge ok"><i class="fas fa-bullseye"></i> دقة عالية</span>`;
            if (abs <= 1) return `<span class="data-card-badge info"><i class="fas fa-check"></i> ضمن الحدود</span>`;
            if (abs <= 3) return `<span class="data-card-badge warn"><i class="fas fa-exclamation-triangle"></i> انحراف</span>`;
            return `<span class="data-card-badge danger"><i class="fas fa-times"></i> انحراف كبير</span>`;
        }

        // ============================================================
        // البطاقات
        // ============================================================
        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`;
                return;
            }
            box.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const displayFields = ['calibration_date','technician','before_value','after_value','error_value','correction_percent','next_calibration_date']
                    .filter(k => row && row[k] !== undefined && row[k] !== null && row[k] !== '');
                const buttons = `
                    <div class="action-row">
                        <button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>
                        ${CFG.updateMethod ? `<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                        ${CFG.deleteMethod ? `<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>` : ''}
                    </div>`;
                return `<article class="data-card">
                    <div class="data-card-head">
                        <div style="flex:1">
                            <div class="data-card-title">${esc(titleOf(row))}</div>
                            <div class="data-card-subtitle">${esc(subtitleOf(row))}</div>
                        </div>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
                            ${statusBadge(row)}
                            ${accuracyBadge(row)}
                        </div>
                    </div>
                    <div class="data-fields">
                        ${displayFields.map(k => {
                            let v = row[k];
                            if (['before_value','after_value','error_value'].includes(k)) v = numFmt(v, 4);
                            else if (k === 'correction_percent') v = numFmt(v, 2) + (v !== '—' ? '%' : '');
                            return `<div class="data-field"><span>${esc(tr(k))}</span><strong>${esc(v)}</strong></div>`;
                        }).join('')}
                    </div>
                    ${buttons}
                </article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.delete))));
        }

        function findRow(id) { return state.rows.find((row, index) => String(idOf(row) || index) === String(id)); }

        // ============================================================
        // التفاصيل
        // ============================================================
        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            $('detailsBody').innerHTML = `
                <div class="detail-grid">
                    ${Object.entries(row).map(([k, v]) => {
                        let val = (typeof v === 'object') ? JSON.stringify(v) : v;
                        if (k === 'entity_type') val = trEntityType(val);
                        if (k === 'status') val = trStatus(val);
                        return `<div class="detail-item"><span>${esc(tr(k))}</span><strong>${esc(val)}</strong></div>`;
                    }).join('')}
                </div>
                <details style="margin-top:14px"><summary style="text-align:center;cursor:pointer;color:var(--text-muted)">JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row, null, 2))}</pre></details>`;
            openModal(null, 'detailsModal');
        }

        // ============================================================
        // النموذج
        // ============================================================
        const FULL_WIDTH_KEYS = ['notes', 'extra_data'];
        const HIDDEN_KEYS = ['calibration_code'];

        function inputHtml(def, row) {
            const value = row && row[def.key] !== undefined ? row[def.key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const isFull = def.type === 'textarea' || FULL_WIDTH_KEYS.includes(def.key);
            const isHidden = HIDDEN_KEYS.includes(def.key);
            const groupClass = `form-group${isFull ? ' full' : ''}${isHidden ? ' hidden-field' : ''}`;

            if (def.type === 'textarea') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`;
            }

            // ===== نوع المعدة =====
            if (def.key === 'entity_type') {
                const v = String(value || '').toLowerCase();
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" ${req}>
                        <option value="">اختر نوع المعدة...</option>
                        <option value="tank" ${v==='tank'?'selected':''}>خزان</option>
                        <option value="pump" ${v==='pump'?'selected':''}>مضخة</option>
                        <option value="nozzle" ${v==='nozzle'?'selected':''}>فوهة</option>
                    </select></div>`;
            }

            // ===== المعدة (entity_id) - dropdown ديناميكي =====
            if (def.key === 'entity_id') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" data-needs-options="true" ${req}>
                        <option value="">اختر نوع المعدة أولاً...</option>
                    </select>
                    <span class="form-hint" data-hint="entity_id"></span></div>`;
            }

            // ===== الحالة =====
            if (def.key === 'status') {
                const v = String(value || '').toLowerCase();
                const isActive = v === 'completed';
                const isInactive = v === 'scheduled';
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}</label>
                    <select class="form-input" data-key="${esc(def.key)}">
                        <option value="">اختر...</option>
                        <option value="completed" ${isActive?'selected':''}>نشطة</option>
                        <option value="scheduled" ${isInactive?'selected':''}>غير نشطة</option>
                    </select></div>`;
            }

            if (def.type === 'select') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" ${req}>
                        <option value="">اختر...</option>
                    </select></div>`;
            }

            return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                <input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`;
        }

        // ============================================================
        // توليد كود المعايرة التلقائي
        // ============================================================
        function generateCalibrationCode() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            return `CAL-${stamp}`;
        }

        // ============================================================
        // جلب البيانات المرجعية من الجسر
        // ============================================================
        async function fetchTanks() {
            try { return rowsFrom(await invoke('getTankRecords', [JSON.stringify({ limit: 500 })])); }
            catch (e) { console.warn('fetchTanks failed', e); return []; }
        }
        async function fetchPumps() {
            try { return rowsFrom(await invoke('getPumpRecords', [JSON.stringify({ limit: 500 })])); }
            catch (e) { console.warn('fetchPumps failed', e); return []; }
        }
        async function fetchNozzles() {
            try { return rowsFrom(await invoke('getPumpNozzleRecords', [])); }
            catch (e) { console.warn('fetchNozzles failed', e); return []; }
        }

        async function loadEntityOptions(entityType, selectedId) {
            const el = document.querySelector('#recordForm [data-key="entity_id"]');
            if (!el) return;
            const hint = document.querySelector('#recordForm [data-hint="entity_id"]');
            if (!entityType) {
                el.innerHTML = '<option value="">اختر نوع المعدة أولاً...</option>';
                if (hint) hint.textContent = '';
                return;
            }
            el.innerHTML = '<option value="">جاري التحميل...</option>';
            let items = [];
            if (entityType === 'tank') items = await fetchTanks();
            else if (entityType === 'pump') items = await fetchPumps();
            else if (entityType === 'nozzle') items = await fetchNozzles();

            if (!items.length) {
                el.innerHTML = '<option value="">لا توجد عناصر متاحة</option>';
                if (hint) hint.textContent = 'لا توجد معدات من هذا النوع';
                return;
            }
            const options = items.map(it => {
                const id = it.id || it.tank_id || it.pump_id || it.nozzle_id;
                const code = it.tank_code || it.pump_code || it.nozzle_code || '';
                const name = it.tank_name_ar || it.tank_name || it.pump_name_ar || it.pump_name || it.nozzle_number || '';
                const label = `${code} ${name}`.trim() || (trEntityType(entityType) + ' #' + id);
                return `<option value="${esc(id)}">${esc(label)}</option>`;
            }).join('');
            el.innerHTML = '<option value="">اختر...</option>' + options;
            if (selectedId) el.value = String(selectedId);
            if (hint) hint.textContent = `${items.length} ${trEntityType(entityType)} متاحة`;
        }

        async function populateFormSelects(row) {
            // نوع المعدة: إذا كان موجوداً في السجل، نحمّل المعدات
            const currentType = row && row.entity_type ? String(row.entity_type).toLowerCase() : '';
            if (currentType) {
                await loadEntityOptions(currentType, row.entity_id);
            }
            // ربط حدث تغيير نوع المعدة
            const typeEl = document.querySelector('#recordForm [data-key="entity_type"]');
            if (typeEl) {
                typeEl.addEventListener('change', () => {
                    loadEntityOptions(typeEl.value, null);
                });
            }
        }

        // ============================================================
        // ربط سلوكيات الحقول: تركيز + حساب تلقائي
        // ============================================================
        function bindFormFieldBehaviors() {
            document.querySelectorAll('#recordForm .form-input').forEach(el => {
                el.addEventListener('focus', () => {
                    if (el.tagName === 'INPUT' && (el.type === 'number' || el.type === 'text')) {
                        setTimeout(() => { try { el.select(); } catch(_) {} }, 30);
                    }
                });
            });

            // حساب تلقائي: error_value = after_value - before_value
            const beforeEl = document.querySelector('#recordForm [data-key="before_value"]');
            const afterEl = document.querySelector('#recordForm [data-key="after_value"]');
            const errorEl = document.querySelector('#recordForm [data-key="error_value"]');
            const percentEl = document.querySelector('#recordForm [data-key="correction_percent"]');

            function recompute() {
                if (beforeEl && afterEl && errorEl) {
                    const b = Number(beforeEl.value);
                    const a = Number(afterEl.value);
                    if (Number.isFinite(b) && Number.isFinite(a) && (beforeEl.value !== '' || afterEl.value !== '')) {
                        const err = a - b;
                        errorEl.value = err.toFixed(4).replace(/\.?0+$/, '');
                    }
                }
                if (beforeEl && errorEl && percentEl) {
                    const b = Number(beforeEl.value);
                    const e = Number(errorEl.value);
                    if (Number.isFinite(b) && Number.isFinite(e) && b !== 0) {
                        const pct = (e / b) * 100;
                        percentEl.value = pct.toFixed(2);
                    }
                }
            }
            [beforeEl, afterEl].forEach(el => { if (el) el.addEventListener('input', recompute); });
        }

        // ============================================================
        // فتح النموذج
        // ============================================================
        async function openForm(row = null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل المعايرة' : 'إضافة معايرة جديدة';
            $('recordForm').innerHTML = (CFG.fields || []).map(def => inputHtml(def, row)).join('');

            // تعبئة كود المعايرة التلقائي
            const codeEl = document.querySelector('#recordForm [data-key="calibration_code"]');
            if (codeEl && !row) codeEl.value = generateCalibrationCode();

            // تعبئة القوائم المنسدلة
            await populateFormSelects(row);
            bindFormFieldBehaviors();

            // تركيز على أول حقل مرئي
            const firstVisible = document.querySelector('#recordForm .form-group:not(.hidden-field) .form-input');
            if (firstVisible) setTimeout(() => firstVisible.focus(), 180);

            $('formModal').classList.add('show');
        }

        // ============================================================
        // جمع بيانات النموذج
        // ============================================================
        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                let value = el.value;
                if (el.type === 'number') {
                    value = value === '' ? 0 : Number(value);
                }
                payload[el.dataset.key] = value;
            });
            // توحيد اسم كود المعايرة
            if (payload.calibration_code) payload.calibration_code = payload.calibration_code.trim();
            return payload;
        }

        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم تنفيذ العملية والتحقق من نجاحها');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشلت العملية', true);
            } finally {
                setLoading(false);
            }
        }

        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم الحذف فعلياً');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // تحميل البيانات
        // ============================================================
        async function reloadData() {
            if (CFG.mode === 'unsupported' || CFG.mode === 'ai') { renderCards(); return; }
            if (!CFG.listMethod) { renderCards(); return; }
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                renderCards();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // المودالات
        // ============================================================
        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }

        // ============================================================
        // التقارير
        // ============================================================
        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات من SQLite.</p></div>';
            openModal(null, 'reportModal');
        }

        function buildReportSummary(rows) {
            const total = rows.length;
            const completed = rows.filter(r => String(field(r, ['status']) || '').toLowerCase() === 'completed').length;
            const failed = rows.filter(r => String(field(r, ['status']) || '').toLowerCase() === 'failed').length;
            const scheduled = rows.filter(r => String(field(r, ['status']) || '').toLowerCase() === 'scheduled').length;
            const errors = rows.map(r => Number(field(r, ['error_value']))).filter(n => Number.isFinite(n));
            const avgAbsError = errors.length ? errors.reduce((a,b) => a + Math.abs(b), 0) / errors.length : 0;
            const percents = rows.map(r => Number(field(r, ['correction_percent']))).filter(n => Number.isFinite(n) && n !== 0);
            const avgPercent = percents.length ? percents.reduce((a,b) => a + b, 0) / percents.length : 0;
            const passRate = total ? ((completed / total) * 100) : 0;
            return `
                <div class="report-summary">
                    <div class="report-summary-item"><span>إجمالي السجلات</span><strong>${total.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>مكتملة</span><strong>${completed.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>فاشلة</span><strong>${failed.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>مجدولة</span><strong>${scheduled.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>نسبة النجاح</span><strong>${passRate.toFixed(1)}%</strong></div>
                    <div class="report-summary-item"><span>متوسط الخطأ</span><strong>${avgAbsError ? avgAbsError.toFixed(4) : '—'}</strong></div>
                    <div class="report-summary-item"><span>متوسط التصحيح</span><strong>${avgPercent ? avgPercent.toFixed(2) + '%' : '—'}</strong></div>
                </div>`;
        }

        async function generateReport() {
            setLoading(true);
            try {
                let result;
                if (String(CFG.reportKind || '').startsWith('operational:')) {
                    const suffix = String(CFG.reportKind).split(':')[1];
                    const payload = {
                        from_date: $('reportFrom').value || '',
                        to_date: $('reportTo').value || '',
                        search: $('searchInput').value || '',
                        entity_type: $('reportEntityTypeFilter') ? $('reportEntityTypeFilter').value : '',
                        status: $('reportStatusFilter') ? $('reportStatusFilter').value : '',
                        technician: $('reportTechnicianFilter') ? $('reportTechnicianFilter').value : '',
                        certificate_number: $('reportCertFilter') ? $('reportCertFilter').value : '',
                        correction_min: $('reportPercentMin') ? $('reportPercentMin').value : '',
                        correction_max: $('reportPercentMax') ? $('reportPercentMax').value : '',
                        error_status: $('reportErrorFilter') ? $('reportErrorFilter').value : '',
                        report_type: $('reportKindFilter') ? $('reportKindFilter').value : 'detailed',
                        include_archived: true,
                        limit: 2000
                    };
                    result = await invoke('generate' + suffix + 'Report', [JSON.stringify(payload)]);
                } else {
                    result = { data: state.filtered };
                }

                let rows = rowsFrom(result);
                // تصفية إضافية محلية
                rows = rows.filter(row => {
                    const entityType = $('reportEntityTypeFilter') ? $('reportEntityTypeFilter').value : '';
                    const status = $('reportStatusFilter') ? $('reportStatusFilter').value : '';
                    const technician = $('reportTechnicianFilter') ? $('reportTechnicianFilter').value.trim().toLowerCase() : '';
                    const certFilter = $('reportCertFilter') ? $('reportCertFilter').value.trim().toLowerCase() : '';
                    const pctMin = $('reportPercentMin') ? Number($('reportPercentMin').value) : NaN;
                    const pctMax = $('reportPercentMax') ? Number($('reportPercentMax').value) : NaN;
                    const errFilter = $('reportErrorFilter') ? $('reportErrorFilter').value : '';

                    if (entityType && String(field(row, ['entity_type']) || '').toLowerCase() !== entityType) return false;
                    if (status && String(field(row, ['status']) || '').toLowerCase() !== status) return false;
                    if (technician && !String(field(row, ['technician']) || '').toLowerCase().includes(technician)) return false;
                    if (certFilter && !String(field(row, ['certificate_number']) || '').toLowerCase().includes(certFilter)) return false;

                    const pct = Number(field(row, ['correction_percent']));
                    if (Number.isFinite(pctMin) && Number.isFinite(pct) && pct < pctMin) return false;
                    if (Number.isFinite(pctMax) && Number.isFinite(pct) && pct > pctMax) return false;

                    const err = Number(field(row, ['error_value']));
                    if (errFilter === 'zero' && Math.abs(err) > 0.01) return false;
                    if (errFilter === 'within' && Math.abs(err) > 1) return false;
                    if (errFilter === 'exceeds' && Math.abs(err) <= 1) return false;

                    return true;
                });

                $('reportResults').innerHTML = buildReportSummary(rows) + renderReport(rows);
                toast(`تم توليد التقرير (${rows.length} سجل)`);
            } catch (e) {
                toast(e.message || 'فشل التقرير', true);
            } finally {
                setLoading(false);
            }
        }

        function renderReport(rows) {
            if (!rows.length) return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="data-fields">${rows.slice(0, 200).map(row => `
                <div class="data-field">
                    <span>${esc(titleOf(row))}</span>
                    <strong>${esc(subtitleOf(row) || JSON.stringify(row))}</strong>
                    <small style="display:block;color:var(--text-muted);font-size:.7rem;margin-top:3px">
                        ${esc(trStatus(field(row, ['status'])))}
                    </small>
                </div>`).join('')}</div>`;
        }

        // ============================================================
        // تصدير CSV
        // ============================================================
        function exportData() {
            const rows = state.filtered;
            if (!rows.length) { toast('لا توجد بيانات حقيقية لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const headers = keys.map(k => tr(k));
            const csv = '\ufeff' + [headers, ...rows.map(row => keys.map(k => {
                const v = row[k];
                if (k === 'entity_type') return trEntityType(v);
                if (k === 'status') return trStatus(v);
                return String(v == null ? '' : v).replace(/"/g, '""');
            }))].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            a.href = url;
            a.download = `equipment_calibration_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً');
        }

        // ============================================================
        // التنقل والوضع
        // ============================================================
        function goHome() { window.location.href = '../main.html'; }

        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // ============================================================
        // القائمة الجانبية: إخفاء اللسان + إغلاق ذكي
        // ============================================================
        function openSidebar() {
            $('sidebar').classList.add('open');
            $('sidebarToggle').classList.add('hidden');
        }
        function closeSidebar() {
            $('sidebar').classList.remove('open');
            $('sidebarToggle').classList.remove('hidden');
        }

        function initSidebar() {
            $('sidebarToggle').addEventListener('click', (e) => {
                e.stopPropagation();
                if ($('sidebar').classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.sidebarAction;
                    closeSidebar();
                    setTimeout(() => {
                        if (action === 'reload') reloadData();
                        else if (action === 'report') openReport();
                        else if (action === 'export') exportData();
                        else if (action === 'print') window.print();
                        else if (action === 'close') { /* مغلق مسبقاً */ }
                    }, 120);
                });
            });
            // إغلاق النقر الخارجي (بديل Escape على الهاتف)
            document.addEventListener('click', (e) => {
                const side = $('sidebar');
                const toggle = $('sidebarToggle');
                if (!side.classList.contains('open')) return;
                if (side.contains(e.target) || toggle.contains(e.target)) return;
                closeSidebar();
            });
            // إغلاق عند لمس الشاشة في منطقة المودال المفتوحة (بديل Escape للهاتف)
            document.querySelectorAll('.modal-overlay').forEach(overlay => {
                overlay.addEventListener('touchstart', (e) => {
                    if (e.target === overlay) {
                        overlay.classList.remove('show');
                    }
                }, { passive: true });
            });
            // إغلاق اللوحة السفلية والأعلى عند التمرير السريع (سلوك آمن للهاتف)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    closeSidebar();
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                }
            });
        }

        // ============================================================
        // ربط الأحداث العامة
        // ============================================================
        function bindGlobalEvents() {
            $('searchInput').addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('fab').addEventListener('click', () => openForm());
            $('saveBtn').addEventListener('click', saveForm);
            window.addEventListener('online', () => toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
            window.addEventListener('offline', () => $('offlineBanner').classList.add('show'));
        }

        // ============================================================
        // تصدير الدوال
        // ============================================================
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm, saveForm,
            openModal, closeModal, generateReport
        });

        // ============================================================
        // التهيئة
        // ============================================================
        applyTheme();
        renderFilters();
        initSidebar();
        bindGlobalEvents();
        reloadData();
    })();
    </script>
