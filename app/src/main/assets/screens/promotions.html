<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>العروض والمناسبات</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/fonts/cairo.css">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--text:#172033;--muted:#64748b;--border:#d7dee8;--primary:#087ea4;--success:#16a34a;--danger:#dc2626;--warning:#d97706}*{box-sizing:border-box}body{margin:0;padding-bottom:80px;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:14px}.toprow,.actions,.form-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:1.1rem;margin:0}.top p{font-size:.7rem;color:var(--muted);margin:3px 0 0}.wrap{max-width:1050px;margin:auto;padding:14px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 8px 25px #0f172a0d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.input,.btn{min-height:42px;border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:var(--text);padding:8px 11px;font:inherit}.input{width:100%}.toolbar .input{flex:1;min-width:220px}.btn{cursor:pointer;font-weight:800}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{color:var(--danger)}.btn.success{color:var(--success)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:.72rem;color:var(--muted);font-weight:800;margin-bottom:5px}.full{grid-column:1/-1}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid var(--border);border-radius:15px;padding:12px;background:var(--surface2)}.card h3{font-size:.9rem;margin:0 0 5px}.meta{font-size:.7rem;color:var(--muted);line-height:1.9}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.65rem;font-weight:800}.on{color:var(--success);background:#16a34a18}.off{color:var(--muted);background:#64748b18}.expired{color:var(--danger);background:#dc262618}.card .actions{margin-top:9px}.modal{display:none;position:fixed;inset:0;background:#020817aa;z-index:20;align-items:flex-end;justify-content:center}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:94vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px}.notice{font-size:.72rem;color:var(--muted);line-height:1.8;background:#087ea412;border-radius:10px;padding:9px;margin-bottom:12px}.empty{text-align:center;padding:35px;color:var(--muted)}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:30;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;display:none;font-size:.75rem}#toast.show{display:block}@media(max-width:650px){.grid,.cards{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="toprow"><div><h1><i class="fas fa-bullhorn"></i> العروض والمناسبات</h1><p>إدارة مباشرة من SQLite عبر Android Bridge</p></div><div class="actions"><button class="btn" id="themeBtn">الوضع</button><button class="btn" id="homeBtn">الرئيسية</button></div></div></header>
<main class="wrap">
<section class="panel"><div class="toolbar"><input class="input" id="search" placeholder="بحث بالاسم أو الرمز..." autocomplete="off"><button class="btn primary" id="newBtn">＋ عرض جديد</button><button class="btn" id="refreshBtn">تحديث</button></div></section>
<section class="panel"><div class="toprow"><h2 style="font-size:.95rem;margin:0">العروض المحفوظة</h2><span id="count" class="badge on">0</span></div><div id="cards" class="cards" style="margin-top:10px"></div></section>
</main>
<div class="modal" id="modal"><div class="dialog"><div class="toprow"><h2 id="formTitle" style="font-size:1rem;margin:0">إضافة عرض</h2><button class="btn" id="closeBtn">×</button></div><div class="notice">يرتبط العرض بقائمة أسعار SQLite. بعد حفظه، افتح تفاصيل قائمة الأسعار لإضافة المنتجات أو أنواع الوقود وأسعار الخصم. يمكن لشاشات البيع اختيار العرض النشط تلقائياً.</div><div id="error" style="color:var(--danger);font-size:.72rem;margin-bottom:8px"></div><form id="form" class="grid">
<div class="field"><label>اسم العرض بالعربية *</label><input class="input" id="list_name_ar" required></div><div class="field"><label>رمز العرض *</label><input class="input" id="occasion_code" maxlength="80" placeholder="مثال: RAMADAN-2027" required></div>
<div class="field"><label>نوع العرض</label><select class="input" id="applies_when"><option value="promotion">عرض ترويجي / خصم</option><option value="quantity">عرض حسب الكمية</option><option value="occasion">مناسبة / حملة محددة</option><option value="always">حسب الفترة والطرف</option><option value="clearance_stock">تصفية المخزون</option></select></div><div class="field"><label>الأولوية</label><input class="input" id="priority" type="number" step="1" value="100"></div>
<div class="field"><label>يبدأ في</label><input class="input" id="valid_from" type="datetime-local"></div><div class="field"><label>ينتهي في</label><input class="input" id="valid_to" type="datetime-local"></div>
<div class="field"><label>الحالة</label><select class="input" id="is_active"><option value="1">نشط</option><option value="0">غير نشط</option></select></div><div class="field"><label>الوصف</label><input class="input" id="description"></div>
</form><div class="form-actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">حفظ في SQLite</button><button class="btn" id="cancelBtn">إلغاء</button></div></div></div>
<div id="toast"></div>
<script>
(()=>{'use strict';
const bridge=window.AndroidInterface, $=id=>document.getElementById(id); let rows=[],editing=null,stationId=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(raw){const v=typeof raw==='string'?JSON.parse(raw):raw;if(v?.success===false)throw Error(v.message||v.error||'فشلت العملية');return v}
function data(v){return v&&Object.prototype.hasOwnProperty.call(v,'data')?v.data:v}
function list(v){const x=data(v);return Array.isArray(x)?x:(x?.rows||x?.data||[])}
function invoke(method,args=[]){if(!bridge||typeof bridge[method]!=='function')return Promise.reject(Error('جسر SQLite غير متاح: '+method));try{return Promise.resolve(parse(bridge[method](...args)))}catch(e){return Promise.reject(e)}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),3000)}
function local(v){return v?String(v).replace(' ','T').slice(0,16):''}
function status(r){const now=new Date().toISOString().slice(0,19).replace('T',' '),from=String(r.valid_from||'').replace('T',' '),to=String(r.valid_to||'').replace('T',' ');if(Number(r.is_active)!==1)return ['غير نشط','off'];if(to&&to<now)return ['منتهٍ','expired'];if(from&&from>now)return ['مجدول','off'];return ['نشط','on']}
function render(){const q=$('search').value.trim().toLowerCase();const shown=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=shown.length; if(!shown.length){$('cards').innerHTML='<div class="empty">لا توجد عروض محفوظة في SQLite</div>';return}$('cards').innerHTML=shown.map(r=>{const [s,c]=status(r);return `<article class="card"><div class="toprow"><h3>${esc(r.list_name_ar||r.list_name||'عرض بلا اسم')}</h3><span class="badge ${c}">${s}</span></div><div class="meta">الرمز: <b>${esc(r.occasion_code||r.list_code||'—')}</b><br>النوع: ${esc(r.applies_when||'always')} · الأولوية: ${esc(r.priority||0)}<br>من: ${esc(r.valid_from||'—')}<br>إلى: ${esc(r.valid_to||'—')}</div><div class="actions"><button class="btn" data-edit="${r.id}">تعديل</button><button class="btn danger" data-del="${r.id}">حذف</button></div></article>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(rows.find(r=>String(r.id)===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(rows.find(r=>String(r.id)===b.dataset.del)))}
async function load(){try{const profile=await invoke('getCurrentStationProfile',[]).catch(()=>null);const p=data(profile);stationId=Number(p?.station_id||p?.id||stationId||0);const r=await invoke('getPriceListRecords',['{}']);rows=list(r);if(!stationId&&rows[0])stationId=Number(rows[0].station_id||0);render()}catch(e){toast(e.message)}}
function open(r=null){editing=r||null;$('formTitle').textContent=r?'تعديل العرض':'إضافة عرض';$('list_name_ar').value=r?.list_name_ar||r?.list_name||'';$('occasion_code').value=r?.occasion_code||'';$('applies_when').value=r?.applies_when||'promotion';$('priority').value=r?.priority??100;$('valid_from').value=local(r?.valid_from);$('valid_to').value=local(r?.valid_to);$('is_active').value=String(r?.is_active??1);$('description').value=r?.description||'';$('error').textContent='';$('modal').classList.add('show')}
function close(){$('modal').classList.remove('show')}
async function save(e){e.preventDefault();const name=$('list_name_ar').value.trim(),code=$('occasion_code').value.trim();if(!name||!code){$('error').textContent='اسم العرض والرمز مطلوبان';return}if(!stationId&&!editing?.station_id){$('error').textContent='تعذر تحديد المحطة الحالية من SQLite';return}const payload={list_code:editing?.list_code||'PROMO-'+Date.now(),list_name:name,list_name_ar:name,description:$('description').value.trim(),valid_from:$('valid_from').value.replace('T',' '),valid_to:$('valid_to').value.replace('T',' '),applies_when:$('applies_when').value,occasion_code:code,occasion_name_ar:name,priority:Number($('priority').value||0),is_active:Number($('is_active').value),is_default:0,station_id:Number(editing?.station_id||stationId)};try{if(editing)await invoke('updatePriceListRecord',[Number(editing.id),JSON.stringify(payload)]);else await invoke('savePriceListRecord',[JSON.stringify(payload)]);close();toast('تم حفظ العرض في SQLite');await load()}catch(e){$('error').textContent=e.message;toast(e.message)}}
async function remove(r){if(!r||!confirm('حذف العرض من SQLite؟'))return;try{await invoke('deletePriceListRecord',[Number(r.id)]);toast('تم حذف العرض');await load()}catch(e){toast(e.message)}}
$('newBtn').onclick=()=>open();$('refreshBtn').onclick=load;$('search').oninput=render;$('closeBtn').onclick=close;$('cancelBtn').onclick=close;$('form').onsubmit=save;$('homeBtn').onclick=()=>location.href='../main.html';$('themeBtn').onclick=()=>document.body.toggleAttribute('data-theme');load();
})();
</script>
</body></html>
