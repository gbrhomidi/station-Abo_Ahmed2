<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>قوائم الأسعار</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/fonts/cairo.css">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface-2:#f8fafc;--surface-3:#eef4f9;--primary:#087ea4;--primary-2:#2563eb;--primary-soft:rgba(37,99,235,.10);--success:#16a34a;--warning:#d97706;--danger:#dc2626;--text:#172033;--muted:#64748b;--border:#d7dee8;--border-strong:#c4cfdd;--accent:#c58a18;--shadow:0 12px 35px rgba(15,23,42,.08);--shadow-lg:0 25px 70px rgba(15,23,42,.16);--radius:20px;--radius-sm:13px;--font-sans:"Cairo","Noto Sans Arabic",Arial,sans-serif}
[data-theme="dark"]{--bg:#06111f;--surface:#0c1b2d;--surface-2:#102238;--surface-3:#132941;--primary:#55c7f5;--primary-2:#6ea8ff;--primary-soft:rgba(85,199,245,.12);--success:#42e39a;--warning:#ffd166;--danger:#ff7184;--text:#eef7ff;--muted:#aabbd0;--border:#49a9ee;--border-strong:#76c8ff;--accent:#f1cf7a;--shadow:0 14px 40px rgba(0,0,0,.38);--shadow-lg:0 25px 75px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-sans);direction:rtl}body{padding-bottom:92px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 14px}.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{display:flex;align-items:center;gap:10px}.title-icon{width:44px;height:44px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:20px}.title h1{margin:0;font-size:1.08rem;font-weight:950}.title p{margin:2px 0 0;color:var(--muted);font-size:.7rem}.actions{display:flex;gap:7px}.icon-btn{width:42px;height:42px;border:1px solid var(--border);border-radius:13px;background:var(--surface-2);color:var(--text);display:grid;place-items:center;font-size:19px}.icon-btn:active{transform:scale(.94)}
.search{margin-top:12px;position:relative}.search input{width:100%;height:48px;border:1px solid var(--border);border-radius:15px;background:var(--surface-2);color:var(--text);padding:0 45px 0 14px;text-align:center;outline:none}.search i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.tabs{display:flex;gap:7px;overflow:auto;padding:11px 1px 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:.76rem;font-weight:800}.tab.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.container{max-width:1200px;margin:auto;padding:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:linear-gradient(145deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center;animation:up .45s both}.kpi b{display:block;font-size:1.35rem}.kpi span{color:var(--muted);font-size:.72rem;font-weight:800}.panel{margin-top:12px;background:linear-gradient(145deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.panel-head h2{font-size:.95rem;margin:0}.count{background:var(--primary-soft);color:var(--primary);padding:5px 10px;border-radius:999px;font-size:.72rem;font-weight:900}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:14px;box-shadow:0 7px 20px rgba(15,23,42,.05);animation:up .42s both;text-align:center}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.code{font-size:.7rem;color:var(--muted);font-weight:900}.status{padding:5px 10px;border-radius:999px;font-size:.68rem;font-weight:900}.status.on{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}.status.off{color:var(--muted);background:var(--surface-3)}.card h3{font-size:1rem;margin:12px 0 4px}.card-sub{font-size:.72rem;color:var(--muted);line-height:1.8}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:12px}.meta-item{padding:9px;border-radius:11px;background:var(--primary-soft);font-size:.68rem}.meta-item span{display:block;color:var(--muted);margin-bottom:2px}.meta-item b{display:block;overflow-wrap:anywhere}.card-actions{display:flex;gap:7px;margin-top:11px}.btn{border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--text);padding:9px 11px;font-weight:850;font-size:.72rem;flex:1}.btn.primary{background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;border:none}.btn.danger{color:var(--danger)}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}.empty i{font-size:38px;color:var(--primary);display:block;margin-bottom:10px}.loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);z-index:1000;place-items:center}.loading.show{display:grid}.spinner{width:46px;height:46px;border:4px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}.offline{position:fixed;top:0;left:0;right:0;z-index:1100;background:var(--danger);color:#fff;padding:9px;text-align:center;font-size:.75rem;font-weight:900;transform:translateY(-110%);transition:.25s}.offline.show{transform:none}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}.bottom button{flex:1;border:1px solid transparent;border-radius:15px;background:transparent;color:var(--muted);padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:1.05rem;font-weight:950}.bottom button span{font-size:1.05rem;font-weight:950}.bottom button.active{color:var(--primary);background:var(--primary-soft)}
.overlay{position:fixed;inset:0;z-index:800;background:rgba(2,8,23,.62);backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:25px 25px 0 0;box-shadow:var(--shadow-lg);animation:modalIn .28s ease}.modal-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border)}.modal-head h2{font-size:1rem;margin:0}.modal-body{padding:16px}.modal-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;text-align:center;color:var(--muted);font-size:.75rem;font-weight:900;margin-bottom:6px}.input{width:100%;min-height:46px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);padding:10px 12px;text-align:center;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}.input:disabled,.readonly{background:var(--surface-3);color:var(--muted);opacity:.72}.textarea{min-height:92px;resize:vertical}.hidden-field{display:none!important}.error-box{display:none;margin-bottom:12px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-radius:13px;padding:10px;text-align:center;font-size:.74rem;font-weight:800}.error-box.show{display:block}.select-wrap{position:relative}.select-wrap:after{content:'⌄';position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.lookup-list{display:grid;gap:7px}.lookup{width:100%;text-align:center;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:11px;color:var(--text)}.lookup:hover{border-color:var(--primary);background:var(--primary-soft)}.lookup small{display:block;color:var(--muted);margin-top:3px}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%) translateY(-15px);z-index:1300;max-width:90%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;text-align:center;font-size:.75rem;font-weight:850}.toast.show{opacity:1;transform:translateX(-50%)}.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger);color:var(--danger)}.toast.warning{border-color:var(--warning);color:var(--warning)}
.pull{position:fixed;top:0;left:50%;transform:translate(-50%,-70px);z-index:1200;background:var(--surface);border:1px solid var(--border);border-radius:0 0 14px 14px;padding:8px 15px;color:var(--primary);font-size:.72rem;font-weight:900;transition:.2s}.pull.show{transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes modalIn{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}
[data-theme="dark"] .panel,[data-theme="dark"] .card,[data-theme="dark"] .kpi{border-color:#63c7ff!important;box-shadow:0 0 0 1px rgba(99,199,255,.16),0 0 18px rgba(99,199,255,.07)}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:460px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.title p{display:none}.container{padding:10px}.panel{padding:10px}.modal-body{padding:12px}.bottom button span{font-size:1.05rem}}
</style>
</head>
<body>
<div class="offline" id="offline">انقطع الاتصال بطبقة Android/SQLite — لن يتم اعتماد أي بيانات بديلة.</div>
<div class="pull" id="pull">اسحب للتحديث…</div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<header class="topbar">
  <div class="topbar-row">
    <div class="title"><div class="title-icon">🏷️</div><div><h1>قوائم الأسعار</h1><p id="contextText">بيانات فعلية من قاعدة بيانات المشروع</p></div></div>
    <div class="actions"><button class="icon-btn" id="themeBtn" title="الوضع">🌞</button><button class="icon-btn" id="homeBtn" title="رجوع">🏠</button></div>
  </div>
  <div class="search"><i class="fas fa-search"></i><input id="search" type="search" inputmode="search" placeholder="بحث فوري في جميع حقول قوائم الأسعار…" autocomplete="off"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main class="container">
  <section class="kpis"><div class="kpi"><b id="kAll">0</b><span>إجمالي القوائم</span></div><div class="kpi"><b id="kActive">0</b><span>نشطة</span></div><div class="kpi"><b id="kValid">0</b><span>سارية الآن</span></div><div class="kpi"><b id="kDefault">0</b><span>افتراضية</span></div></section>
  <section class="panel"><div class="panel-head"><h2>قوائم الأسعار</h2><span class="count" id="count">0</span></div><div class="cards" id="cards"></div></section>
</main>
<nav class="bottom"><button id="newBtn" class="active">＋<span>قائمة جديدة</span></button><button id="reportBtn">▤<span>تقارير</span></button></nav>
<div class="overlay" id="formOverlay"><div class="modal"><div class="modal-head"><h2 id="formTitle">إضافة قائمة جديدة</h2><button class="icon-btn" id="closeForm">×</button></div><div class="modal-body"><div class="error-box" id="formError"></div><form id="form" class="form-grid" novalidate>
  <div class="field"><label>كود القائمة</label><input class="input readonly" id="list_code" name="list_code" readonly disabled></div>
  <div class="field"><label>اسم القائمة</label><input class="input" id="list_name" name="list_name" type="text" inputmode="text" autocomplete="off" required></div>
  <div class="field hidden-field"><label>اسم القائمة بالعربية</label><input class="input" id="list_name_ar" name="list_name_ar" type="text"></div>
  <div class="field"><label>نوع الطرف</label><div class="select-wrap"><select class="input" id="party_type_id" name="party_type_id"><option value="">اختر نوع الطرف</option></select></div></div>
  <div class="field"><label>الطرف / العميل</label><div class="select-wrap"><select class="input" id="party_id" name="party_id"><option value="">اختر الطرف / العميل</option></select></div></div>
  <div class="field"><label>من تاريخ</label><input class="input" id="valid_from" name="valid_from" type="date"></div>
  <div class="field"><label>إلى تاريخ</label><input class="input" id="valid_to" name="valid_to" type="date"></div>
  <div class="field"><label>الحالة</label><div class="select-wrap"><select class="input" id="is_active" name="is_active"><option value="1">نشطة</option><option value="0">غير نشطة</option></select></div></div>
  <div class="field"><label>القائمة الافتراضية</label><div class="select-wrap"><select class="input" id="is_default" name="is_default"><option value="0">لا</option><option value="1">نعم</option></select></div></div>
  <div class="field hidden-field"><label>المحطة</label><input class="input" id="station_id" name="station_id" type="number" readonly></div>
  <div class="field hidden-field"><label>تاريخ الإنشاء</label><input class="input" id="created_at" name="created_at" type="text" readonly></div>
  <div class="field full"><label>الوصف</label><textarea class="input textarea" id="description" name="description" inputmode="text"></textarea></div>
</form></div><div class="modal-foot"><button class="btn primary" id="saveBtn">حفظ القائمة</button><button class="btn" id="cancelForm">إلغاء</button></div></div></div>
<div class="overlay" id="lookupOverlay"><div class="modal"><div class="modal-head"><h2 id="lookupTitle">اختيار</h2><button class="icon-btn" id="closeLookup">×</button></div><div class="modal-body"><div class="search"><i class="fas fa-search"></i><input id="lookupSearch" type="search" placeholder="بحث…"></div><div class="lookup-list" id="lookupList"></div></div></div></div>
<div class="overlay" id="detailsOverlay"><div class="modal"><div class="modal-head"><h2>تفاصيل قائمة الأسعار</h2><button class="icon-btn" id="closeDetails">×</button></div><div class="modal-body" id="details"></div></div></div>
<div class="overlay" id="reportOverlay"><div class="modal"><div class="modal-head"><h2>تقارير قوائم الأسعار</h2><button class="icon-btn" id="closeReport">×</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>من تاريخ</label><input class="input" id="reportFrom" type="date"></div><div class="field"><label>إلى تاريخ</label><input class="input" id="reportTo" type="date"></div></div><div class="card-actions"><button class="btn primary" id="runReport">توليد التقرير</button><button class="btn" id="exportBtn">تصدير CSV</button><button class="btn" id="printBtn">طباعة</button></div><div id="reportResult" style="margin-top:12px"></div></div></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const bridge=window.AndroidInterface||null;
const state={rows:[],filtered:[],tab:'all',editing:null,partyTypes:[],parties:[],loadedAt:null,stationId:0};
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10); const now=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};
function parse(v){if(v==null)throw Error('لم يرجع الجسر نتيجة');const x=typeof v==='string'?JSON.parse(v):v;if(x&&x.success===false)throw Error(x.error||x.message||'فشلت العملية');return x}
function data(v){return v&&Object.prototype.hasOwnProperty.call(v,'data')?v.data:v}
function invoke(name,args=[]){if(!bridge||typeof bridge[name]!=='function')return Promise.reject(Error('العقد '+name+' غير متاح في Android Bridge'));try{return Promise.resolve(parse(bridge[name](...args)))}catch(e){return Promise.reject(e)}}
function rows(v){const x=data(v);if(Array.isArray(x))return x;if(x&&Array.isArray(x.rows))return x.rows;if(x&&Array.isArray(x.data))return x.data;return x&&typeof x==='object'?[x]:[]}
function loading(v){$('loading').classList.toggle('show',!!v)}
let toastTimer;function toast(msg,type='success'){const n=$('toast');n.textContent=msg;n.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.className='toast',3600)}
function open(id){$(id).classList.add('show')}function close(id){$(id).classList.remove('show')}
function validNow(r){const f=r.valid_from?String(r.valid_from).slice(0,10):'';const t=r.valid_to?String(r.valid_to).slice(0,10):'';const d=today();return Number(r.is_active)==1&&(!f||f<=d)&&(!t||t>=d)}
const tabs=[['all','الكل'],['active','النشطة'],['valid','السارية الآن'],['upcoming','القادمة'],['expired','المنتهية'],['default','الافتراضية']];
function renderTabs(){ $('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();apply()}) }
function matchesTab(r){const d=today();switch(state.tab){case'active':return Number(r.is_active)==1;case'valid':return validNow(r);case'upcoming':return Number(r.is_active)==1&&r.valid_from&&String(r.valid_from).slice(0,10)>d;case'expired':return !!r.valid_to&&String(r.valid_to).slice(0,10)<d;case'default':return Number(r.is_default)==1;default:return true}}
function apply(){const q=($('search').value||'').trim().toLowerCase();state.filtered=state.rows.filter(r=>matchesTab(r)&&(!q||Object.values(r||{}).some(v=>String(v??'').toLowerCase().includes(q))));renderCards();}
function renderCards(){const a=state.rows;state.filtered=state.filtered||[];$('kAll').textContent=a.length.toLocaleString('ar');$('kActive').textContent=a.filter(r=>Number(r.is_active)==1).length.toLocaleString('ar');$('kValid').textContent=a.filter(validNow).length.toLocaleString('ar');$('kDefault').textContent=a.filter(r=>Number(r.is_default)==1).length.toLocaleString('ar');$('count').textContent=state.filtered.length.toLocaleString('ar');const box=$('cards');if(!state.filtered.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><i class="fas fa-tags"></i><div>لا توجد قوائم مطابقة.</div></div>';return}box.innerHTML=state.filtered.map((r,i)=>{const id=r.id??i;const active=Number(r.is_active)==1;return `<article class="card" style="animation-delay:${Math.min(i*35,350)}ms"><div class="card-top"><span class="code">${esc(r.list_code||'—')}</span><span class="status ${active?'on':'off'}">${active?'نشطة':'غير نشطة'}</span></div><h3>${esc(r.list_name_ar||r.list_name||'بدون اسم')}</h3><div class="card-sub">${esc(r.description||'بدون وصف')}</div><div class="meta"><div class="meta-item"><span>نوع الطرف</span><b>${esc(r.party_type_name_ar||r.type_name_ar||r.party_type_id||'عام')}</b></div><div class="meta-item"><span>الطرف</span><b>${esc(r.party_name_ar||r.commercial_name_ar||r.party_id||'عام')}</b></div><div class="meta-item"><span>من</span><b>${esc(String(r.valid_from||'—').slice(0,10))}</b></div><div class="meta-item"><span>إلى</span><b>${esc(String(r.valid_to||'—').slice(0,10))}</b></div></div><div class="card-actions"><button class="btn" data-view="${esc(id)}">عرض</button><button class="btn" data-edit="${esc(id)}">تعديل</button><button class="btn danger" data-delete="${esc(id)}">حذف</button></div></article>`}).join('');box.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>details(find(b.dataset.view)));box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>form(find(b.dataset.edit)));box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(find(b.dataset.delete)))}
function find(id){return state.rows.find((r,i)=>String(r.id??i)===String(id))}
function details(r){if(!r)return;$('details').innerHTML='<div class="meta">'+Object.entries(r).map(([k,v])=>`<div class="meta-item"><span>${esc(label(k))}</span><b>${esc(typeof v==='object'?JSON.stringify(v):v??'—')}</b></div>`).join('')+'</div>';open('detailsOverlay')}
function label(k){return ({id:'المعرف',uuid:'المعرف الفريد',list_code:'كود القائمة',list_name:'اسم القائمة',list_name_ar:'اسم القائمة بالعربية',description:'الوصف',party_id:'معرف الطرف',party_type_id:'معرف نوع الطرف',station_id:'المحطة',valid_from:'من تاريخ',valid_to:'إلى تاريخ',is_active:'الحالة',is_default:'افتراضية',created_at:'تاريخ الإنشاء',updated_at:'آخر تحديث',created_by:'أنشأ بواسطة'}[k]||k)}
function nextCode(){let max=0;state.rows.forEach(r=>{const m=String(r.list_code||'').match(/(\d+)$/);if(m)max=Math.max(max,Number(m[1]))});return 'PL-'+String(max+1).padStart(3,'0')}
function fillForm(r){$('list_code').value=r?.list_code||nextCode();$('list_name').value=r?.list_name||'';$('list_name_ar').value=r?.list_name_ar||r?.list_name||'';$('description').value=r?.description||'';$('party_type_id').value=r?.party_type_id??'';$('party_id').value=r?.party_id??'';$('valid_from').value=r?.valid_from?String(r.valid_from).slice(0,10):'';$('valid_to').value=r?.valid_to?String(r.valid_to).slice(0,10):'';$('is_active').value=r?.is_active==null?'1':String(r.is_active);$('is_default').value=r?.is_default==null?'0':String(r.is_default);state.stationId=Number(r?.station_id||state.stationId||0);$('station_id').value=state.stationId||'';$('created_at').value=r?.created_at||now()}
async function loadLookups(){try{const pt=await invoke('getPartyTypes',[]);state.partyTypes=rows(pt);$('party_type_id').innerHTML='<option value="">اختر نوع الطرف</option>'+state.partyTypes.filter(x=>Number(x.is_active??1)==1).map(x=>`<option value="${esc(x.id)}">${esc(x.type_name_ar||x.type_name||'')}</option>`).join('')}catch(e){toast(e.message,'warning')}try{const ps=await invoke('getParties',[]);state.parties=rows(ps);$('party_id').innerHTML='<option value="">اختر الطرف / العميل</option>'+state.parties.map(x=>`<option value="${esc(x.id)}">${esc(x.commercial_name_ar||x.commercial_name||'')}</option>`).join('')}catch(e){toast(e.message,'warning')}}
function form(r=null){state.editing=r;fillForm(r);$('formTitle').textContent=r?'تعديل قائمة الأسعار':'إضافة قائمة جديدة';$('formError').className='error-box';$('formError').textContent='';open('formOverlay');loadLookups().then(()=>{if(r){$('party_type_id').value=r.party_type_id??'';$('party_id').value=r.party_id??''}});setTimeout(()=>{const target=r?$('list_name'): $('list_name');target?.focus()},180)}
function validate(p){const e=[];if(!p.list_name.trim())e.push('اسم القائمة مطلوب.');if(p.valid_from&&p.valid_to&&p.valid_from>p.valid_to)e.push('تاريخ البداية يجب ألا يتجاوز تاريخ النهاية.');if(p.party_type_id&&!state.partyTypes.some(x=>String(x.id)===String(p.party_type_id)))e.push('نوع الطرف المحدد غير موجود في قاعدة البيانات.');if(p.party_id&&!state.parties.some(x=>String(x.id)===String(p.party_id)))e.push('الطرف المحدد غير موجود في قاعدة البيانات.');if(p.is_active!=='0'&&p.is_active!=='1')e.push('حالة القائمة غير صحيحة.');if(p.is_default!=='0'&&p.is_default!=='1')e.push('قيمة الافتراضية غير صحيحة.');return e}
async function save(){const p={list_code:$('list_code').value,list_name:$('list_name').value.trim(),list_name_ar:$('list_name').value.trim(),description:$('description').value.trim(),party_id:$('party_id').value?Number($('party_id').value):0,party_type_id:$('party_type_id').value?Number($('party_type_id').value):0,station_id:$('station_id').value?Number($('station_id').value):state.stationId||0,valid_from:$('valid_from').value||'',valid_to:$('valid_to').value||'',is_active:Number($('is_active').value),is_default:Number($('is_default').value),created_at:$('created_at').value||now()};const errors=validate({...p,is_active:String(p.is_active),is_default:String(p.is_default),party_type_id:String(p.party_type_id||''),party_id:String(p.party_id||'')});if(errors.length){$('formError').innerHTML=errors.map(x=>`• ${esc(x)}`).join('<br>');$('formError').className='error-box show';toast('يرجى تصحيح أخطاء الإدخال','error');return}loading(true);try{let result;if(state.editing){result=await invoke('updatePriceListRecord',[Number(state.editing.id),JSON.stringify(p)])}else{result=await invoke('savePriceListRecord',[JSON.stringify(p)])}parse(result);toast(state.editing?'تم تحديث قائمة الأسعار فعلياً':'تم حفظ قائمة الأسعار فعلياً');close('formOverlay');await load()}catch(e){$('formError').textContent=e.message||'تعذر الحفظ';$('formError').className='error-box show';toast(e.message||'تعذر الحفظ','error')}finally{loading(false)}}
async function del(r){if(!r)return;if(!confirm('هل تريد حذف قائمة الأسعار فعلياً؟'))return;loading(true);try{await invoke('deletePriceListRecord',[Number(r.id)]);toast('تم حذف القائمة فعلياً');await load()}catch(e){toast(e.message,'error')}finally{loading(false)}}
async function load(){if(!bridge){$('offline').classList.add('show');state.rows=[];apply();return}loading(true);try{const result=await invoke('getPriceListRecords',[JSON.stringify({limit:1000,offset:0,search:''})]);state.rows=rows(result);state.loadedAt=new Date();state.rows.forEach(r=>{if(!state.stationId&&Number(r.station_id)>0)state.stationId=Number(r.station_id)});$('station_id').value=state.stationId||'';$('contextText').textContent=state.stationId?'المحطة الحالية: '+state.stationId+' · SQLite':'بيانات فعلية من قاعدة بيانات المشروع';$('offline').classList.remove('show');apply()}catch(e){$('offline').classList.add('show');state.rows=[];apply();toast(e.message,'error')}finally{loading(false)}}
async function runReport(){loading(true);try{const params={from_date:$('reportFrom').value||'',to_date:$('reportTo').value||'',search:$('search').value||'',include_archived:true,limit:1000};const result=await invoke('generatePriceListReport',[JSON.stringify(params)]);const rr=rows(result);$('reportResult').innerHTML=rr.length?rr.slice(0,100).map(r=>`<div class="meta" style="margin-bottom:8px">${Object.entries(r).slice(0,8).map(([k,v])=>`<div class="meta-item"><span>${esc(label(k))}</span><b>${esc(v)}</b></div>`).join('')}</div>`).join(''):'<div class="empty">لا توجد بيانات للتقرير.</div>'}catch(e){$('reportResult').innerHTML='<div class="empty">تعذر تشغيل تقرير مستقل؛ تم استخدام البيانات الفعلية المحملة.</div>';toast(e.message,'warning')}finally{loading(false)}}
function exportCsv(){if(!state.filtered.length){toast('لا توجد بيانات للتصدير','warning');return}const keys=[...new Set(state.filtered.flatMap(r=>Object.keys(r)))];const csv='\ufeff'+[keys,...state.filtered.map(r=>keys.map(k=>String(r[k]??'').replace(/"/g,'""')))].map(a=>a.map(v=>'"'+v+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='price-lists.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let touchY=0;document.addEventListener('touchstart',e=>{if(window.scrollY===0)touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchmove',e=>{if(touchY&&e.touches[0].clientY-touchY>35)$('pull').classList.add('show')},{passive:true});document.addEventListener('touchend',async()=>{if($('pull').classList.contains('show')){ $('pull').textContent='جاري التحديث…';await load();setTimeout(()=>$('pull').classList.remove('show'),300);$('pull').textContent='اسحب للتحديث…'}touchY=0});
$('search').oninput=apply;$('newBtn').onclick=()=>form();$('reportBtn').onclick=()=>open('reportOverlay');$('runReport').onclick=runReport;$('exportBtn').onclick=exportCsv;$('printBtn').onclick=()=>window.print();$('saveBtn').onclick=save;$('cancelForm').onclick=()=>close('formOverlay');$('closeForm').onclick=()=>close('formOverlay');$('closeLookup').onclick=()=>close('lookupOverlay');$('closeDetails').onclick=()=>close('detailsOverlay');$('closeReport').onclick=()=>close('reportOverlay');$('homeBtn').onclick=()=>{window.location.href='../main.html'};$('list_name').oninput=()=>{$('list_name_ar').value=$('list_name').value};$('party_type_id').onchange=()=>{const id=$('party_type_id').value;$('party_id').value='';if(id){const filtered=state.parties.filter(p=>String(p.party_type_id)===String(id));$('party_id').innerHTML='<option value="">اختر الطرف / العميل</option>'+filtered.map(x=>`<option value="${esc(x.id)}">${esc(x.commercial_name_ar||x.commercial_name||'')}</option>`).join('')}};
function theme(){const dark=document.documentElement.dataset.theme==='dark';$('themeBtn').textContent=dark?'🌙':'🌞'}$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';if(dark)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='dark';localStorage.setItem('priceListsTheme',dark?'light':'dark');theme()};if(localStorage.getItem('priceListsTheme')==='dark')document.documentElement.dataset.theme='dark';theme();renderTabs();load();
})();
</script>
</body>
