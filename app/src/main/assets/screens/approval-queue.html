<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اعتمادات العمليات المالية</title>
<style>
:root{color-scheme:light;--ink:#17212b;--muted:#64748b;--line:#dbe2ea;--paper:#f4f7fa;--surface:#fff;--green:#087f5b;--red:#b42318;--gold:#9a6b12}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
header{background:#123d32;color:#fff;padding:18px 16px;box-shadow:0 2px 10px #0001}
.header-row{max-width:1050px;margin:auto;display:flex;align-items:center;gap:12px}
h1{font-size:20px;margin:0;line-height:1.5}
.subtitle{font-size:12px;color:#d7e7e1;margin-top:4px}
main{max-width:1050px;margin:18px auto;padding:0 12px 30px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
select,button{font:inherit}
select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:140px}
button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:700}
button:disabled{opacity:.55;cursor:wait}
.refresh{background:#e6f4ee;color:#075c43}
.back{background:#fff;color:#123d32;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 2px 8px #14243a08;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h2{font-size:16px;margin:0 0 7px;overflow-wrap:anywhere}
.badge{font-size:12px;padding:5px 8px;border-radius:20px;background:#edf2f7;color:#334155;white-space:nowrap}
.badge.pending{background:#fff2cc;color:#805b00}
.badge.approved{background:#dff7e9;color:#075c43}
.badge.rejected{background:#fee4e2;color:#912018}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.meta div{border:1px solid #edf0f4;border-radius:8px;padding:8px;min-width:0}
.meta small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.meta strong{display:block;font-size:13px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #edf0f4;padding-top:12px}
.approve{background:var(--green);color:white}
.reject{background:#fff0ef;color:var(--red);border:1px solid #f4c7c4}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:10px 0 0;overflow-wrap:anywhere}
.empty,.error,.loading{padding:28px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted);line-height:1.8}
.error{color:var(--red);border-color:#f4c7c4}
.toast{position:fixed;bottom:18px;left:12px;right:12px;max-width:600px;margin:auto;padding:12px 14px;background:#17212b;color:#fff;border-radius:10px;box-shadow:0 6px 24px #0002;z-index:10;line-height:1.6}
@media(max-width:480px){h1{font-size:17px}.meta{grid-template-columns:1fr 1fr}.toolbar select{flex:1}}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <button class="back" type="button" onclick="history.back()">رجوع</button>
    <div><h1>اعتمادات العمليات المالية</h1><div class="subtitle">Maker–Checker · قرارات منفصلة عن تنفيذ العملية المالية</div></div>
  </div>
</header>
<main>
  <div class="toolbar">
    <label for="statusFilter">حالة الطلب</label>
    <select id="statusFilter">
      <option value="pending">بانتظار الاعتماد</option>
      <option value="approved">معتمدة</option>
      <option value="rejected">مرفوضة</option>
      <option value="all">كل الطلبات</option>
    </select>
    <button id="refreshButton" class="refresh" type="button">تحديث القائمة</button>
  </div>
  <div id="notice" class="loading">جارٍ تحميل طلبات الاعتماد…</div>
  <section id="approvalCards" class="cards" aria-live="polite"></section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function(){
  "use strict";
  const notice=document.getElementById("notice");
  const cards=document.getElementById("approvalCards");
  const filter=document.getElementById("statusFilter");
  const refreshButton=document.getElementById("refreshButton");
  let busy=false;
  const statusLabels={pending:"بانتظار الاعتماد",approved:"معتمدة",rejected:"مرفوضة",expired:"منتهية"};
  const entityLabels={journal:"قيد محاسبي",journal_entry:"قيد محاسبي",journal_entries:"قيود محاسبية",payment:"دفعة",payments:"دفعات",expense:"مصروف",expenses:"مصروفات"};
  const operationLabels={post:"ترحيل",reverse:"عكس مالي",refund:"استرداد"};
  function toast(message){const el=document.getElementById("toast");el.textContent=String(message||"");el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4500);}
  function callBridge(method,args){
    if(!window.AndroidInterface||typeof window.AndroidInterface[method]!=="function") throw new Error("واجهة التطبيق الأصلية غير متاحة");
    let raw=window.AndroidInterface[method].apply(window.AndroidInterface,args);
    const result=typeof raw==="string"?JSON.parse(raw):raw;
    if(!result||result.success!==true) throw new Error(result&&result.error?result.error:"تعذر تنفيذ الطلب");
    return result;
  }
  function addMeta(parent,label,value){
    const cell=document.createElement("div"),small=document.createElement("small"),strong=document.createElement("strong");
    small.textContent=label;strong.textContent=value===null||value===undefined||value===""?"—":String(value);
    cell.appendChild(small);cell.appendChild(strong);parent.appendChild(cell);
  }
  function makeButton(label,className,handler){
    const button=document.createElement("button");button.type="button";button.className=className;button.textContent=label;
    button.addEventListener("click",handler);return button;
  }
  function render(rows){
    while(cards.firstChild) cards.removeChild(cards.firstChild);
    if(!rows.length){notice.className="empty";notice.textContent="لا توجد طلبات في هذه الحالة ضمن نطاق المحطة الحالية.";notice.hidden=false;return;}
    notice.hidden=true;
    rows.forEach(row=>{
      const card=document.createElement("article");card.className="card";
      const head=document.createElement("div");head.className="card-head";
      const title=document.createElement("h2");title.textContent=(entityLabels[row.entity_type]||row.entity_type)+" · "+(operationLabels[row.operation]||row.operation)+" #"+row.entity_id;
      const badge=document.createElement("span");badge.className="badge "+(row.status||"");badge.textContent=statusLabels[row.status]||row.status;
      head.appendChild(title);head.appendChild(badge);card.appendChild(head);
      const meta=document.createElement("div");meta.className="meta";
      addMeta(meta,"رقم الطلب",row.id);addMeta(meta,"المبلغ",row.amount===null?"غير محدد":Number(row.amount).toLocaleString("ar-EG"));
      addMeta(meta,"مقدم الطلب",row.requested_by_name);addMeta(meta,"تاريخ الطلب",row.requested_at);
      addMeta(meta,"عدد الموافقات",row.approvals_count||0);addMeta(meta,"رقم المحطة",row.station_id);
      card.appendChild(meta);
      if(row.rejection_reason){const note=document.createElement("p");note.className="note";note.textContent="سبب الرفض: "+row.rejection_reason;card.appendChild(note);}
      if(row.status==="pending"){
        const actions=document.createElement("div");actions.className="actions";
        actions.appendChild(makeButton("اعتماد وتنفيذ","approve",()=>{
          const note=window.prompt("ملاحظة الاعتماد. عند عكس قيد أو دفعة أو مصروف، اكتب سبب العكس:", "");
          if(note===null)return;
          if(["reverse","refund"].includes(String(row.operation).toLowerCase())&&!note.trim()){toast("سبب العكس مطلوب.");return;}
          try{
            const result=callBridge("approvePendingApproval",[Number(row.id),note.trim()]);
            toast(result.message||"تم تسجيل قرار الاعتماد.");
            load();
          }catch(e){toast(e.message||"تعذر اعتماد الطلب.");}
        }));
        actions.appendChild(makeButton("رفض الطلب","reject",()=>{
          const reason=window.prompt("أدخل سبب رفض طلب الاعتماد:");
          if(reason===null)return;
          if(!reason.trim()){toast("سبب الرفض مطلوب.");return;}
          try{
            const result=callBridge("rejectPendingApproval",[Number(row.id),reason.trim()]);
            toast(result.message||"تم رفض الطلب.");
            load();
          }catch(e){toast(e.message||"تعذر رفض الطلب.");}
        }));
        card.appendChild(actions);
      }
      cards.appendChild(card);
    });
  }
  function load(){
    if(busy)return;
    busy=true;refreshButton.disabled=true;notice.hidden=false;notice.className="loading";notice.textContent="جارٍ تحميل طلبات الاعتماد…";while(cards.firstChild) cards.removeChild(cards.firstChild);
    try{
      const result=callBridge("getPendingApprovals",[filter.value]);
      const rows=Array.isArray(result.data)?result.data:[];
      render(rows);
    }catch(e){notice.hidden=false;notice.className="error";notice.textContent=e.message||"تعذر تحميل طلبات الاعتماد.";}
    finally{busy=false;refreshButton.disabled=false;}
  }
  refreshButton.addEventListener("click",load);
  filter.addEventListener("change",load);
  load();
})();
</script>
</body>
</html>
