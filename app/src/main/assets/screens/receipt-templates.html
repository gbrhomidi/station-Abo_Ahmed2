    /* ============================================================
       الرندر الرئيسي
       ============================================================ */
    function render() {
        renderStats();
        const cards = $('cardsContainer');
        const table = $('tableContainer');
        const tree = $('treeContainer');
        cards.classList.toggle('hidden', state.view !== 'cards');
        table.classList.toggle('hidden', state.view !== 'table');
        tree.classList.toggle('hidden', state.view !== 'tree');

        if (state.view === 'cards') renderCards();
        else if (state.view === 'table') renderTable();
        else if (state.view === 'tree') renderTree();
    }

    function findRow(id) {
        return state.rows.find((r, i) => String(idOf(r) || i) === String(id));
    }

    /* ============================================================
       تحميل البيانات (مع بحث من قاعدة البيانات)
       ============================================================ */
    async function reloadData() {
        if (!bridge) {
            $('offlineBanner').classList.add('show');
            render();
            toast('الجسر غير متاح؛ لن تُعرض بيانات', 'warning');
            return;
        }
        setLoading(true);
        try {
            const searchTerm = ($('searchInput') && $('searchInput').value || '').trim();
            const args = [JSON.stringify({ limit: 200, search: searchTerm })];
            const result = await invoke(CFG.listMethod, args);
            state.rows = rowsFrom(result);
            state.loadedAt = new Date();
            $('offlineBanner').classList.remove('show');
            applyFilter();
        } catch (e) {
            state.rows = [];
            state.loadedAt = new Date();
            render();
            toast(e.message || 'فشل تحميل البيانات', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       التقارير
       ============================================================ */
    function fillReportFilters() {
        const stationSel = $('reportStation');
        if (stationSel) {
            fillDynamicSelect(stationSel, state.lookup.stations, stationLabel, '');
        }
    }

    function getReportFilters() {
        return {
            from: ($('reportFrom') && $('reportFrom').value) || '',
            to: ($('reportTo') && $('reportTo').value) || '',
            status: ($('reportStatus') && $('reportStatus').value) || '',
            def: ($('reportDefault') && $('reportDefault').value) || '',
            station: ($('reportStation') && $('reportStation').value) || '',
            type: ($('reportType') && $('reportType').value) || 'summary',
            sort: ($('reportSort') && $('reportSort').value) || 'template_code',
            search: ($('reportSearch') && $('reportSearch').value || '').trim().toLowerCase()
        };
    }

    function applyReportFilters() {
        const f = getReportFilters();
        let list = state.rows.slice();
        if (f.status) list = list.filter(r => f.status === 'active' ? isActive(r) : !isActive(r));
        if (f.def) list = list.filter(r => f.def === '1' ? isDefault(r) : !isDefault(r));
        if (f.station) list = list.filter(r => String(r.station_id) === String(f.station));
        if (f.search) list = list.filter(r => JSON.stringify(r || {}).toLowerCase().includes(f.search));
        if (f.from) list = list.filter(r => {
            const d = r.created_at || r.updated_at;
            return d && String(d).slice(0, 10) >= f.from;
        });
        if (f.to) list = list.filter(r => {
            const d = r.created_at || r.updated_at;
            return d && String(d).slice(0, 10) <= f.to;
        });
        list.sort((a, b) => String(a[f.sort] || '').localeCompare(String(b[f.sort] || ''), 'ar'));
        return list;
    }

    function renderReportResults(list) {
        if (!list.length) {
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد نتائج مطابقة للفلاتر</p></div>';
            return;
        }
        const summary = {
            total: list.length,
            active: list.filter(isActive).length,
            inactive: list.filter(r => !isActive(r)).length,
            def: list.filter(isDefault).length,
            stations: new Set(list.map(r => r.station_id).filter(Boolean)).size
        };

        let summaryHtml = '<div class="report-summary">' +
            '<div class="sum-card"><strong>' + summary.total + '</strong><span>الإجمالي</span></div>' +
            '<div class="sum-card"><strong style="color:var(--success)">' + summary.active + '</strong><span>نشط</span></div>' +
            '<div class="sum-card"><strong style="color:var(--text-muted)">' + summary.inactive + '</strong><span>غير نشط</span></div>' +
            '<div class="sum-card"><strong style="color:var(--gold-primary)">' + summary.def + '</strong><span>افتراضي</span></div>' +
            '<div class="sum-card"><strong style="color:var(--info)">' + summary.stations + '</strong><span>محطات</span></div>' +
            '</div>';

        const f = getReportFilters();

        // تقرير حسب المحطة
        if (f.type === 'by_station') {
            const groups = new Map();
            list.forEach(r => {
                const sid = String(r.station_id || 'none');
                if (!groups.has(sid)) groups.set(sid, []);
                groups.get(sid).push(r);
            });
            let html = summaryHtml + '<table class="report-table"><thead><tr>' +
                '<th>المحطة</th><th>عدد القوالب</th><th>نشط</th><th>غير نشط</th><th>افتراضي</th>' +
                '</tr></thead><tbody>';
            groups.forEach((rows, sid) => {
                const st = findStation(sid);
                const stName = st ? stationLabel(st) : (sid === 'none' ? 'بدون محطة' : ('محطة #' + sid));
                html += '<tr>' +
                    '<td>' + esc(stName) + '</td>' +
                    '<td>' + rows.length + '</td>' +
                    '<td>' + rows.filter(isActive).length + '</td>' +
                    '<td>' + rows.filter(r => !isActive(r)).length + '</td>' +
                    '<td>' + rows.filter(isDefault).length + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            $('reportResults').innerHTML = html;
            return;
        }

        // تقرير حسب الحالة
        if (f.type === 'by_status') {
            const activeList = list.filter(isActive);
            const inactiveList = list.filter(r => !isActive(r));
            let html = summaryHtml;
            html += '<h4 style="text-align:center;color:var(--emerald-primary);margin:10px 0;font-size:0.85rem;font-weight:800"><i class="fas fa-check-circle"></i> القوالب النشطة (' + activeList.length + ')</h4>';
            html += '<table class="report-table"><thead><tr><th>الكود</th><th>الاسم</th><th>افتراضي</th></tr></thead><tbody>';
            activeList.forEach(r => {
                html += '<tr><td>' + esc(r.template_code || '—') + '</td><td>' + esc(r.template_name || '—') + '</td><td>' + (isDefault(r) ? '✓' : '—') + '</td></tr>';
            });
            html += '</tbody></table>';
            html += '<h4 style="text-align:center;color:var(--text-muted);margin:14px 0 10px;font-size:0.85rem;font-weight:800"><i class="fas fa-ban"></i> القوالب غير النشطة (' + inactiveList.length + ')</h4>';
            html += '<table class="report-table"><thead><tr><th>الكود</th><th>الاسم</th><th>افتراضي</th></tr></thead><tbody>';
            inactiveList.forEach(r => {
                html += '<tr><td>' + esc(r.template_code || '—') + '</td><td>' + esc(r.template_name || '—') + '</td><td>' + (isDefault(r) ? '✓' : '—') + '</td></tr>';
            });
            html += '</tbody></table>';
            $('reportResults').innerHTML = html;
            return;
        }

        // تقرير حسب حجم الورق
        if (f.type === 'by_paper') {
            const groups = new Map();
            list.forEach(r => {
                const pw = String(r.paper_width || 'غير محدد');
                if (!groups.has(pw)) groups.set(pw, []);
                groups.get(pw).push(r);
            });
            let html = summaryHtml + '<table class="report-table"><thead><tr>' +
                '<th>عرض الورق</th><th>عدد القوالب</th><th>الأسماء</th>' +
                '</tr></thead><tbody>';
            groups.forEach((rows, pw) => {
                html += '<tr>' +
                    '<td>' + esc(pw) + ' مم</td>' +
                    '<td>' + rows.length + '</td>' +
                    '<td>' + esc(rows.map(r => r.template_name || r.template_code).join('، ')) + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table>';
            $('reportResults').innerHTML = html;
            return;
        }

        // تقرير تفصيلي أو ملخص
        const showDetails = f.type === 'detailed';
        let tableHtml = '<table class="report-table"><thead><tr>' +
            '<th>الكود</th><th>الاسم</th>' +
            (showDetails ? '<th>الوصف</th><th>المحطة</th><th>عرض الورق</th><th>حجم الخط</th>' : '') +
            '<th>الحالة</th><th>افتراضي</th>' +
            '</tr></thead><tbody>';
        list.slice(0, 500).forEach(r => {
            const status = statusInfo(r);
            const station = findStation(r.station_id);
            tableHtml += '<tr>' +
                '<td>' + esc(r.template_code || '—') + '</td>' +
                '<td>' + esc(r.template_name || '—') + '</td>' +
                (showDetails ? (
                    '<td>' + esc((r.description || '—').toString().slice(0, 50)) + '</td>' +
                    '<td>' + esc(station ? stationLabel(station) : (r.station_id || '—')) + '</td>' +
                    '<td>' + esc(r.paper_width || '—') + '</td>' +
                    '<td>' + esc(r.font_size || '—') + '</td>'
                ) : '') +
                '<td>' + esc(status.label) + '</td>' +
                '<td>' + (isDefault(r) ? '✓' : '—') + '</td>' +
                '</tr>';
        });
        tableHtml += '</tbody></table>';
        if (list.length > 500) {
            tableHtml += '<p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:8px">عرض 500 من ' + list.length + ' سجل</p>';
        }
        $('reportResults').innerHTML = summaryHtml + tableHtml;
    }

    function generateReport() {
        try {
            setLoading(true);
            const list = applyReportFilters();
            renderReportResults(list);
            state.reportGenerated = true;
            toast('تم توليد التقرير من ' + list.length + ' سجل', 'success');
        } catch (e) {
            toast(e.message || 'فشل توليد التقرير', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       تصدير CSV - نافذة سفلية
       ============================================================ */
    function openExportSheet() {
        const list = state.reportGenerated ? applyReportFilters() : state.filtered;
        if (!list.length) {
            toast('لا توجد بيانات للتصدير', 'warning');
            return;
        }
        const fnameInput = $('exportFilename');
        if (fnameInput) {
            fnameInput.value = 'receipt_templates_' + today();
        }
        const customGroup = $('customPathGroup');
        if (customGroup) customGroup.style.display = 'none';
        const pathSel = $('exportPath');
        if (pathSel) pathSel.value = 'documents';
        openModal(null, 'exportSheet');
    }

    function buildCSV(list) {
        const keys = [
            'template_code', 'template_name', 'description', 'station_id',
            'header', 'body', 'footer', 'variables',
            'paper_width', 'font_size', 'is_default', 'is_active'
        ];
        const labels = [
            'كود القالب', 'اسم القالب', 'الوصف', 'المحطة',
            'الترويسة', 'الجسم', 'التذييل', 'المتغيرات',
            'عرض الورق', 'حجم الخط', 'افتراضي', 'الحالة'
        ];
        const cell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        const lines = [labels.map(cell).join(',')];
        list.forEach(r => {
            lines.push(keys.map(k => {
                if (k === 'is_default') return cell(isDefault(r) ? 'نعم' : 'لا');
                if (k === 'is_active') return cell(isActive(r) ? 'نشط' : 'غير نشط');
                return cell(r[k]);
            }).join(','));
        });
        return '\uFEFF' + lines.join('\n');
    }

    function buildTXT(list) {
        const lines = [];
        list.forEach((r, i) => {
            lines.push('=== ' + (i + 1) + ' ===');
            lines.push('كود القالب: ' + (r.template_code || '—'));
            lines.push('اسم القالب: ' + (r.template_name || '—'));
            lines.push('الوصف: ' + (r.description || '—'));
            lines.push('الحالة: ' + (isActive(r) ? 'نشط' : 'غير نشط'));
            lines.push('افتراضي: ' + (isDefault(r) ? 'نعم' : 'لا'));
            lines.push('');
        });
        return '\uFEFF' + lines.join('\n');
    }

    function buildJSON(list) {
        return JSON.stringify(list, null, 2);
    }

    async function confirmExport() {
        try {
            const list = state.reportGenerated ? applyReportFilters() : state.filtered;
            if (!list.length) { toast('لا توجد بيانات', 'warning'); return; }

            const format = $('exportFormat').value || 'csv';
            const filename = ($('exportFilename').value || ('receipt_templates_' + today())).trim();
            const pathType = $('exportPath').value || 'documents';
            const customPath = $('customPath') ? $('customPath').value.trim() : '';

            let content, mimeType, ext;
            if (format === 'csv') { content = buildCSV(list); mimeType = 'text/csv;charset=utf-8'; ext = 'csv'; }
            else if (format === 'txt') { content = buildTXT(list); mimeType = 'text/plain;charset=utf-8'; ext = 'txt'; }
            else { content = buildJSON(list); mimeType = 'application/json;charset=utf-8'; ext = 'json'; }

            const fullFilename = filename.endsWith('.' + ext) ? filename : filename + '.' + ext;

            if (window.StationExportRuntime && typeof window.StationExportRuntime.openPreparedExport === 'function') {
                window.StationExportRuntime.openPreparedExport({
                    blob: new Blob([content], { type: mimeType }),
                    filename: fullFilename,
                    label: 'تصدير القوالب',
                    formats: ['csv', 'xlsx', 'pdf', 'json']
                });
                closeModal(null, 'exportSheet');
                return;
            }

            setLoading(true);

            // محاولة استخدام الجسر أولاً
            if (hasBridgeMethod('saveFileToStorage')) {
                try {
                    const result = await invoke('saveFileToStorage', [fullFilename, content, mimeType, pathType, customPath]);
                    toast('تم حفظ الملف: ' + fullFilename, 'success');
                    closeModal(null, 'exportSheet');
                    setLoading(false);
                    return;
                } catch (e) {
                    // متابعة إلى البديل
                }
            }

            // بديل: Blob + تنزيل
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fullFilename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 500);
            toast('تم إنشاء الملف: ' + fullFilename + ' (' + list.length + ' سجل)', 'success');
            closeModal(null, 'exportSheet');
        } catch (e) {
            toast(e.message || 'فشل التصدير', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       معاينة الطباعة + PDF
       ============================================================ */
    function buildPrintHTML(list, title) {
        const f = getReportFilters();
        let html = '<h1>' + esc(title) + '</h1>';
        html += '<div class="meta">تاريخ الطباعة: ' + new Date().toLocaleString('ar-EG') +
                ' | عدد السجلات: ' + list.length + '</div>';
        html += '<table><thead><tr>' +
                '<th>#</th><th>الكود</th><th>الاسم</th><th>الوصف</th>' +
                '<th>المحطة</th><th>الحالة</th><th>افتراضي</th>' +
                '</tr></thead><tbody>';
        list.forEach((r, i) => {
            const station = findStation(r.station_id);
            html += '<tr>' +
                '<td>' + (i + 1) + '</td>' +
                '<td>' + esc(r.template_code || '') + '</td>' +
                '<td>' + esc(r.template_name || '') + '</td>' +
                '<td>' + esc((r.description || '').toString().slice(0, 60)) + '</td>' +
                '<td>' + esc(station ? stationLabel(station) : (r.station_id || '—')) + '</td>' +
                '<td>' + esc(isActive(r) ? 'نشط' : 'غير نشط') + '</td>' +
                '<td>' + (isDefault(r) ? 'نعم' : 'لا') + '</td>' +
                '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function openPrintPreview() {
        const list = state.reportGenerated ? applyReportFilters() : state.filtered;
        if (!list.length) {
            toast('لا توجد بيانات للطباعة', 'warning');
            return;
        }
        const title = 'تقرير قوالب الإيصالات';
        const sheet = $('printSheet');
        if (sheet) sheet.innerHTML = buildPrintHTML(list, title);

        const fname = $('printFilename');
        if (fname) {
            fname.value = 'receipt_templates_report_' + today();
        }

        const overlay = $('printPreview');
        if (overlay) overlay.classList.add('show');
    }

    async function downloadPDF() {
        try {
            const filename = ($('printFilename').value || ('receipt_templates_report_' + today())).trim();
            const fullName = filename.endsWith('.pdf') ? filename : filename + '.pdf';
            const sheet = $('printSheet');
            if (!sheet) return;

            setLoading(true);

            // محاولة استخدام الجسر
            if (hasBridgeMethod('generatePDFFromHTML')) {
                try {
                    const result = await invoke('generatePDFFromHTML', [fullName, sheet.innerHTML]);
                    toast('تم حفظ PDF: ' + fullName, 'success');
                    setLoading(false);
                    return;
                } catch (e) { /* متابعة */ }
            }

            if (hasBridgeMethod('printCurrentPageWithTitle')) {
                try {
                    bridge.printCurrentPageWithTitle(fullName);
                    toast('تم فتح نافذة الطباعة كـ PDF', 'success');
                    setLoading(false);
                    return;
                } catch (e) { /* متابعة */ }
            }

            // بديل: استخدام window.print مع تحويل
            toast('جاري تجهيز الطباعة... استخدم "حفظ كـ PDF" من نافذة الطباعة', 'info');
            setTimeout(() => {
                window.print();
                setLoading(false);
            }, 500);
        } catch (e) {
            toast(e.message || 'فشل إنشاء PDF', 'error');
            setLoading(false);
        }
    }

    function printNow() {
        try {
            const filename = ($('printFilename').value || 'receipt_templates_report').trim();
            if (hasBridgeMethod('printCurrentPageWithTitle')) {
                try {
                    bridge.printCurrentPageWithTitle(filename);
                    toast('تم فتح نافذة الطباعة', 'success');
                    return;
                } catch (_) { /* متابعة */ }
            }
            window.print();
            toast('تم فتح نافذة الطباعة', 'success');
        } catch (e) {
            toast(e.message || 'فشل الطباعة', 'error');
        }
    }

    /* ============================================================
       تصدير سريع (بدون نافذة)
       ============================================================ */
    function exportData() {
        const rows = state.filtered.length ? state.filtered : state.rows;
        if (!rows.length) { toast('لا توجد بيانات لتصديرها', 'warning'); return; }
        try {
            const csv = buildCSV(rows);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'receipt_templates_' + today() + '.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('تم تصدير ' + rows.length + ' سجل', 'success');
        } catch (e) {
            toast(e.message || 'فشل التصدير', 'error');
        }
    }

    function goHome() {
        try {
            window.location.href = '../main.html';
        } catch (_) {
            try { window.location.href = 'file:///android_asset/main.html'; } catch (__) {}
        }
    }

    function openReport() {
        const fromEl = $('reportFrom');
        const toEl = $('reportTo');
        if (fromEl && !fromEl.value) fromEl.value = today();
        if (toEl && !toEl.value) toEl.value = today();
        fillReportFilters();
        $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i>' +
            '<p>اختر الفلاتر ثم اضغط على "توليد من المصدر"</p></div>';
        state.reportGenerated = false;
        openModal(null, 'reportModal');
    }

    /* ============================================================
       التهيئة
       ============================================================ */
    function initViewModes() {
        const container = $('viewModes');
        if (!container) return;
        container.querySelectorAll('button[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                state.view = btn.dataset.view;
                container.querySelectorAll('button').forEach(b => {
                    const active = b === btn;
                    b.classList.toggle('active', active);
                    b.setAttribute('aria-selected', active ? 'true' : 'false');
                });
                render();
            });
        });
    }

    function initSidebar() {
        const toggle = $('sidebarToggle');
        if (toggle) toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSidebar();
        });

        document.querySelectorAll('.sidebar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                closeSidebar();
                setTimeout(() => {
                    switch (action) {
                        case 'refresh': reloadData(); break;
                        case 'new': openForm(null); break;
                        case 'report': openReport(); break;
                        case 'export': exportData(); break;
                        case 'print': openPrintPreview(); break;
                        case 'home': goHome(); break;
                    }
                }, 200);
            });
        });
    }

    function initSearch() {
        const input = $('searchInput');
        if (!input) return;
        let timer = null;
        input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                state.search = input.value || '';
                // جلب من قاعدة البيانات إذا كان الجسر متاحاً
                if (bridge && hasBridgeMethod(CFG.listMethod)) {
                    reloadData();
                } else {
                    applyFilter();
                }
            }, 400);
        });
    }

    function initReportButtons() {
        const gen = $('genReportBtn');
        const exp = $('exportReportBtn');
        const prn = $('printReportBtn');
        if (gen) gen.addEventListener('click', generateReport);
        if (exp) exp.addEventListener('click', openExportSheet);
        if (prn) prn.addEventListener('click', openPrintPreview);

        const confirmBtn = $('confirmExportBtn');
        if (confirmBtn) confirmBtn.addEventListener('click', confirmExport);

        const pathSel = $('exportPath');
        if (pathSel) {
            pathSel.addEventListener('change', () => {
                const cg = $('customPathGroup');
                if (cg) cg.style.display = pathSel.value === 'custom' ? 'flex' : 'none';
            });
        }

        const downloadBtn = $('downloadPdfBtn');
        if (downloadBtn) downloadBtn.addEventListener('click', downloadPDF);

        const printBtn = $('printNowBtn');
        if (printBtn) printBtn.addEventListener('click', printNow);

        const closeBtn = $('closePrintBtn');
        if (closeBtn) closeBtn.addEventListener('click', () => {
            const ov = $('printPreview');
            if (ov) ov.classList.remove('show');
        });
    }

    function initGlobalListeners() {
        const themeBtn = $('themeToggle');
        if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
        const saveBtn = $('saveBtn');
        if (saveBtn) saveBtn.addEventListener('click', saveForm);

        // بديل Escape للهاتف: زر رجوع فعلي + swipe down لإغلاق المودالات
        document.querySelectorAll('.modal-overlay, .sheet-overlay, .print-preview-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
            });
        });

        // Swipe down to close modals
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            let startY = 0;
            let lastY = 0;
            let dragging = false;
            const modal = overlay.querySelector('.modal');
            if (!modal) return;
            overlay.addEventListener('touchstart', (e) => {
                if (!overlay.classList.contains('show')) return;
                if (e.target.closest('.modal-header') || e.target === overlay) {
                    startY = e.touches[0].clientY;
                    lastY = startY;
                    dragging = true;
                }
            }, { passive: true });
            overlay.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                lastY = e.touches[0].clientY;
                const delta = lastY - startY;
                if (delta > 0 && delta < 120) {
                    modal.style.transform = 'translateY(' + delta + 'px)';
                }
            }, { passive: true });
            overlay.addEventListener('touchend', () => {
                if (!dragging) return;
                const delta = lastY - startY;
                modal.style.transform = '';
                if (delta > 80) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
                dragging = false;
            });
        });

        // دعم زر الرجوع في الهاتف (popstate) كبديل Escape
        try {
            history.pushState({ modal: false }, '');
            window.addEventListener('popstate', () => {
                const openModal = document.querySelector('.modal-overlay.show, .sheet-overlay.show, .print-preview-overlay.show');
                const sidebarOpen = document.querySelector('.sidebar.open');
                if (openModal) {
                    openModal.classList.remove('show');
                    document.body.style.overflow = '';
                    history.pushState({ modal: false }, '');
                } else if (sidebarOpen) {
                    closeSidebar();
                    history.pushState({ modal: false }, '');
                } else {
                    history.back();
                }
            });
        } catch (_) { /* تجاهل */ }
    }

    async function bootstrap() {
        applyTheme();
        renderFilters();
        renderBottomNav();
        initViewModes();
        initSidebar();
        initSearch();
        initReportButtons();
        initGlobalListeners();
        await loadLookups();
        await reloadData();
    }

    // تعريض الدوال العامة للنطاق العام (مطلوب من onclick)
    window.goHome = goHome;
    window.closeModal = closeModal;
    window.openModal = openModal;
    window.reloadData = reloadData;
    window.openForm = openForm;
    window.saveForm = saveForm;
    window.openReport = openReport;
    window.exportData = exportData;
    window.generateReport = generateReport;
    window.openExportSheet = openExportSheet;
    window.openPrintPreview = openPrintPreview;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
        bootstrap();
    }
})();
</script>
