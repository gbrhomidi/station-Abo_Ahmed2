<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>نظام إدارة محطة الوقود – قوالب الإيصالات</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
<link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
<style>
/* ============================================================
   نظام الألوان الموحّد (من إدارة المضخات)
   ============================================================ */
:root {
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;
    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --emerald-primary: #059669;
    --success: #059669;
    --danger: #dc2626;
    --warning: #d97706;
    --info: #2563eb;
    --purple: #7c3aed;
    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;
    --scrollbar-thumb: var(--gold-primary);
    --skeleton-bg: #e8e0d5;
    --skeleton-shine: #f5efe6;
    color-scheme: light;
}
[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);
    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --emerald-primary: #10b981;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --purple: #9b59b6;
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;
    --scrollbar-thumb: var(--gold-primary);
    --skeleton-bg: #1e293b;
    --skeleton-shine: #2d3a4f;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 0 0 100px 0;
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: pan-y;
}
[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

.loading-indicator {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 3000; display: none; justify-content: center; align-items: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.loading-indicator.show { display: flex; }
.spinner {
    width: 56px; height: 56px;
    border: 4px solid rgba(200, 154, 18, 0.15);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.offline-banner {
    position: fixed; top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning), #f97316);
    color: #000; text-align: center; padding: 8px;
    font-size: 0.8rem; font-weight: 700; z-index: 2000;
    transform: translateY(-100%); transition: transform 0.3s;
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky; top: 0;
    display: flex; flex-direction: column;
    padding: 14px 18px 10px;
    background: var(--header-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-bottom: var(--silver-border);
    z-index: 100;
    transition: var(--transition);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    gap: 10px;
}
.header-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
}
.top-title { flex: 1; min-width: 150px; text-align: center; }
.top-title h2 {
    margin: 0; font-size: 1.35rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}
.top-title h2 i { -webkit-text-fill-color: initial; color: var(--gold-primary); font-size: 1.1rem; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary); display: flex;
    align-items: center; justify-content: center;
    cursor: pointer; transition: var(--transition);
    font-size: 1rem; position: relative;
    box-shadow: var(--silver-shadow);
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
}

.search-wrap { position: relative; }
.search-input {
    width: 100%; padding: 12px 44px 12px 16px;
    border-radius: 12px; border: var(--silver-border);
    background: var(--bg-glass); color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.88rem; outline: none;
    transition: var(--transition);
    box-shadow: var(--silver-shadow); text-align: center;
}
.search-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
.search-wrap i {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted); font-size: 0.9rem;
    pointer-events: none;
}

/* Filter chips */
.filter-chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 0; scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 8px 16px; border-radius: 999px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.78rem; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: var(--transition);
    display: inline-flex; align-items: center; gap: 6px;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    user-select: none;
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
    background: var(--gold-primary); color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
}
.filter-chip .chip-count {
    background: rgba(0,0,0,0.1); padding: 1px 8px;
    border-radius: 10px; font-size: 0.7rem;
}
.filter-chip.active .chip-count { background: rgba(255,255,255,0.25); }

/* ============================================================
   Stats
   ============================================================ */
.stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 16px;
}
.stat-card {
    background: var(--bg-card); backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 18px 16px; position: relative;
    overflow: hidden; transition: var(--transition);
    text-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}
.stat-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; margin-bottom: 10px;
    border: var(--silver-border); background: var(--bg-glass-light);
    color: var(--gold-primary);
}
.stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
.stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
.stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
.stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
.stat-value {
    font-size: 1.6rem; font-weight: 900;
    margin: 4px 0 2px; color: var(--text-primary);
    direction: ltr; font-family: 'Inter', 'Arial', sans-serif;
    letter-spacing: -0.5px; line-height: 1.1; text-align: center;
}
.stat-label {
    font-size: 0.78rem; color: var(--text-muted);
    font-weight: 700; text-align: center;
}
@media (min-width: 768px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ============================================================
   Data panel
   ============================================================ */
.page-container { max-width: 1280px; margin: 0 auto; padding: 0 0 90px; }
.data-panel {
    margin: 0 16px; padding: 16px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: var(--silver-border-strong);
    box-shadow: var(--silver-shadow), var(--shadow-card);
    backdrop-filter: blur(12px); position: relative; overflow: hidden;
}
.data-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}

.section-title {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: space-between;
}
.section-title h3 {
    font-size: 1rem; font-weight: 800;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
    margin: 0;
    flex: 1;
    justify-content: center;
    text-align: center;
}
.section-title h3 i { color: var(--gold-primary); }
.section-title .count-badge {
    background: var(--gold-primary); color: #fff;
    border-radius: 30px; padding: 3px 12px;
    font-size: 0.75rem; font-weight: 900;
    border: var(--silver-border);
    flex-shrink: 0;
}

.view-modes {
    display: inline-flex; gap: 4px;
    background: var(--bg-glass);
    border: var(--silver-border); border-radius: 10px;
    padding: 3px;
    flex-shrink: 0;
}
.view-modes button {
    border: none; background: transparent;
    color: var(--text-muted); padding: 6px 10px;
    border-radius: 7px; cursor: pointer;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
    transition: var(--transition);
    touch-action: manipulation;
    white-space: nowrap;
}
.view-modes button.active {
    background: var(--gold-primary); color: #fff;
    box-shadow: 0 2px 6px rgba(200, 154, 18, 0.3);
}
.view-modes button i { font-size: 0.78rem; }
.view-modes button span { display: none; }
@media (min-width: 480px) {
    .view-modes button span { display: inline; }
    .view-modes button { padding: 6px 12px; }
}

.cards-container { display: flex; flex-direction: column; gap: 12px; }

/* Template card */
.template-card {
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px 18px; position: relative;
    transition: var(--transition); cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
    text-align: center;
}
.template-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 4px; height: 100%;
    background: var(--gold-primary); opacity: 0.7;
    transition: var(--transition);
}
.template-card:hover { border-color: var(--gold-primary); transform: translateY(-2px); }
.template-card:active { transform: scale(0.98); }
.template-card .card-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 10px;
}
.template-card .card-avatar {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 800; color: white;
    flex-shrink: 0; border: var(--silver-border);
}
.template-card .card-status {
    padding: 4px 12px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700;
    border: var(--silver-border);
}
.card-status.active { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.card-status.inactive { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }
.card-status.default { background: rgba(200, 154, 18, 0.15); color: var(--gold-primary); }
.template-card .card-name {
    font-size: 1rem; font-weight: 800;
    color: var(--text-primary); margin-bottom: 2px;
    text-align: center;
}
.template-card .card-code {
    font-size: 0.75rem; color: var(--text-muted);
    font-family: 'Inter', 'Arial', monospace;
    margin-bottom: 8px; text-align: center; direction: ltr;
}
.template-card .card-details {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 12px; margin: 8px 0 10px;
}
.template-card .detail-item {
    font-size: 0.78rem; color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 6px 8px;
    border: var(--silver-border); border-radius: 8px;
    background: var(--bg-glass); text-align: center;
    word-break: break-word;
}
.template-card .detail-item i { font-size: 0.8rem; color: var(--gold-primary); flex-shrink: 0; }
.template-card .detail-item span { overflow-wrap: anywhere; }
.template-card .card-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
}
.template-card .card-btn {
    flex: 1; min-width: 80px;
    padding: 9px 8px; border-radius: 10px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.75rem; font-weight: 700;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    gap: 5px; transition: var(--transition);
    box-shadow: var(--silver-shadow);
    touch-action: manipulation;
}
.template-card .card-btn:active { transform: scale(0.95); }
.template-card .card-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.template-card .card-btn.danger:hover {
    background: rgba(220, 38, 38, 0.1); color: var(--danger);
    border-color: var(--danger);
}

/* Table view */
.table-container { overflow-x: auto; border-radius: 12px; border: var(--silver-border-strong); }
.data-table {
    width: 100%; border-collapse: collapse;
    font-size: 0.78rem; min-width: 640px;
}
.data-table th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 10px 8px; text-align: center;
    font-weight: 800; border-bottom: var(--silver-border-strong);
    position: sticky; top: 0;
    font-family: 'Cairo', 'Inter', sans-serif;
}
.data-table td {
    padding: 9px 8px; text-align: center;
    border-bottom: var(--silver-border);
    color: var(--text-secondary);
    font-weight: 600;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg-glass); }
.data-table .status-badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 999px; font-size: 0.7rem; font-weight: 700;
}
.data-table .actions-cell button {
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary); width: 30px; height: 30px;
    border-radius: 8px; margin: 0 2px;
    cursor: pointer; transition: var(--transition);
}
.data-table .actions-cell button:hover {
    border-color: var(--gold-primary); color: var(--gold-primary);
}

/* Tree view */
.tree-container { display: flex; flex-direction: column; gap: 10px; }
.tree-station {
    background: var(--bg-glass);
    border: var(--silver-border-strong);
    border-radius: 14px; padding: 12px;
    box-shadow: var(--silver-shadow);
}
.tree-station-header {
    display: flex; align-items: center;
    gap: 10px; font-weight: 800;
    color: var(--gold-primary); cursor: pointer;
    padding: 4px 0; font-size: 0.95rem;
}
.tree-station-header .tree-count {
    background: var(--gold-primary); color: #fff;
    border-radius: 999px; padding: 1px 10px;
    font-size: 0.7rem; margin-right: auto;
}
.tree-group {
    margin-right: 16px; margin-top: 8px;
    background: var(--bg-glass-light);
    border-radius: 12px; padding: 10px;
    border-right: 3px solid var(--info);
}
.tree-group-header {
    font-weight: 700; color: var(--text-secondary);
    display: flex; align-items: center;
    gap: 6px; margin-bottom: 6px; font-size: 0.85rem;
}
.tree-item {
    padding: 10px 12px; margin-right: 18px;
    background: var(--bg-card);
    border: var(--silver-border); border-radius: 10px;
    margin-top: 6px; display: flex;
    justify-content: space-between; align-items: center;
    cursor: pointer; transition: var(--transition);
}
.tree-item:hover { border-color: var(--gold-primary); background: var(--bg-glass-light); }
.tree-item .item-name { font-weight: 700; color: var(--text-primary); font-size: 0.85rem; }
.tree-item .item-code {
    font-size: 0.7rem; color: var(--text-muted);
    font-family: monospace; direction: ltr;
}

.empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted);
}
.empty-state i {
    font-size: 3.5rem; margin-bottom: 14px;
    opacity: 0.4; display: block; color: var(--gold-primary);
}
.empty-state p { font-size: 0.9rem; line-height: 1.8; }

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {
    position: fixed; top: 50%; right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary); color: white;
    width: 40px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer; z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: var(--transition);
    border: var(--silver-border); touch-action: manipulation;
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
.sidebar-toggle.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(60px); }
.sidebar {
    position: fixed; top: 50%; right: -160px;
    transform: translateY(-50%);
    width: 130px; background: var(--sidebar-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    z-index: 999;
    transition: all 0.45s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    padding: 12px 10px; border-radius: 18px 0 0 18px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    border: var(--silver-border); border-right: none;
    opacity: 0;
}
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 8px; }
.sidebar-btn {
    position: relative; background: var(--bg-glass);
    border: var(--silver-border); padding: 12px 6px;
    border-radius: 12px; color: var(--text-secondary);
    font-weight: 700; cursor: pointer;
    transition: var(--transition);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 5px; min-height: 72px; text-align: center;
    font-size: 0.85rem; font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.sidebar-btn:active { transform: scale(0.92); }
.sidebar-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary); color: var(--gold-primary);
}
.sidebar-btn i { font-size: 1.4rem; }
.sidebar-btn span { font-size: 0.7rem; font-weight: 800; }

/* ============================================================
   Bottom Navigation
   ============================================================ */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: var(--silver-border-strong);
    display: flex; justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300; overflow-x: auto;
    scrollbar-width: none;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.nav-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    background: none; border: none;
    color: var(--text-muted);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem; cursor: pointer;
    transition: var(--transition);
    padding: 6px 10px; position: relative;
    touch-action: manipulation;
    flex: 1; min-width: 70px;
}
.nav-item:active { transform: scale(0.9); }
.nav-item i { font-size: 20px; transition: var(--transition); }
.nav-item span { font-weight: 700; margin-top: 2px; }
.nav-item.active { color: var(--gold-primary); }
.nav-item.active i { transform: translateY(-3px); }
.nav-item.active::after {
    content: ''; position: absolute; top: -1px; left: 50%;
    transform: translateX(-50%);
    width: 24px; height: 3px;
    background: var(--gold-primary); border-radius: 10px;
}
.nav-item.nav-new { color: var(--emerald-primary); }
.nav-item.nav-new i { color: var(--emerald-primary); }

/* ============================================================
   Modals
   ============================================================ */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 900; display: none;
    align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 720px;
    max-height: 92vh; overflow-y: auto;
    padding: 20px 18px 24px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: var(--silver-border-strong); border-bottom: none;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 18px;
    border-bottom: var(--silver-border); padding-bottom: 14px;
    position: sticky; top: 0;
    background: var(--bg-secondary); z-index: 5;
    margin: -20px -18px 12px; padding: 16px 18px;
    border-radius: 24px 24px 0 0;
}
.modal-title {
    font-size: 1.1rem; font-weight: 900;
    color: var(--gold-primary);
    display: flex; align-items: center; gap: 10px;
}
.modal-close {
    width: 40px; height: 40px; border-radius: 12px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    font-size: 1rem;
}
.modal-close:active { transform: scale(0.9); }
.modal-close:hover {
    background: var(--danger); color: white;
    border-color: var(--danger);
}

/* ============================================================
   Bottom Sheet
   ============================================================ */
.sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 950; display: none;
    align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
}
.sheet-overlay.show { display: flex; opacity: 1; }
.sheet {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 720px;
    max-height: 88vh; overflow-y: auto;
    padding: 20px 18px 24px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: var(--silver-border-strong); border-bottom: none;
}
.sheet-overlay.show .sheet { transform: translateY(0); }
.sheet-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: var(--silver-border);
}
.sheet-title {
    font-size: 1.05rem; font-weight: 900;
    color: var(--gold-primary);
    display: flex; align-items: center; gap: 8px;
}
.sheet-body { display: flex; flex-direction: column; gap: 12px; }
.sheet-footer { display: flex; gap: 10px; margin-top: 16px; }

/* ============================================================
   Form
   ============================================================ */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 12px;
}
.form-group {
    margin-bottom: 4px;
    display: flex; flex-direction: column; gap: 5px;
    min-width: 0;
}
.form-group.full { grid-column: 1 / -1; }
.form-label {
    display: block; font-size: 0.76rem;
    font-weight: 700; color: var(--text-secondary);
    text-align: center; letter-spacing: 0.2px;
}
.form-label .required-star { color: var(--danger); margin-right: 2px; }
.form-input {
    width: 100%; padding: 10px 12px;
    border-radius: var(--radius-small);
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.85rem; transition: var(--transition);
    outline: none; box-shadow: var(--silver-shadow);
    text-align: center; font-weight: 600;
}
.form-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.15), var(--silver-shadow);
    background: var(--bg-glass-light);
}
.form-input::placeholder { color: var(--text-muted); text-align: center; }
select.form-input option { background: var(--bg-secondary); color: var(--text-primary); text-align: center; }
textarea.form-input { min-height: 70px; resize: vertical; line-height: 1.6; text-align: center; }
.form-input.auto-field {
    color: var(--danger) !important;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-family: 'Inter', 'Arial', monospace;
}
.form-input[readonly] {
    background: var(--bg-glass-light);
    cursor: not-allowed;
}

.modal-footer {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding: 14px 0 0; border-top: var(--silver-border);
    margin-top: 14px;
}
.submit-btn, .cancel-btn {
    flex: 1; min-width: 120px; padding: 12px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.9rem; font-weight: 800;
    cursor: pointer; transition: var(--transition);
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.submit-btn {
    background: var(--gold-primary); color: white;
    border-color: var(--gold-dark);
}
.submit-btn:active { transform: scale(0.97); }
.submit-btn:hover { background: var(--gold-dark); }
.cancel-btn { background: var(--bg-glass); color: var(--text-secondary); }
.cancel-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }

/* ============================================================
   Reports
   ============================================================ */
.report-filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.report-filter-grid .form-group { margin-bottom: 0; }
.report-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 12px 0;
}
.report-actions .btn {
    flex: 1; min-width: 100px;
    padding: 10px; border-radius: var(--radius-small);
    border: var(--silver-border);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.8rem; font-weight: 800;
    cursor: pointer; transition: var(--transition);
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg-glass); color: var(--text-secondary);
}
.report-actions .btn:active { transform: scale(0.97); }
.report-actions .btn.primary {
    background: var(--gold-primary); color: white;
    border-color: var(--gold-dark);
}
.report-actions .btn.excel {
    background: linear-gradient(135deg, #059669, #047857);
    color: white; border-color: #047857;
}
.report-actions .btn.print {
    background: linear-gradient(135deg, #7c3aed, #6366f1);
    color: white; border-color: #6366f1;
}
.report-results {
    margin-top: 14px; max-height: 340px; overflow-y: auto;
    border: var(--silver-border-strong);
    border-radius: var(--radius-small);
    background: var(--bg-card); padding: 6px;
}
.report-summary {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 12px;
}
.report-summary .sum-card {
    background: var(--bg-glass);
    border: var(--silver-border); border-radius: 10px;
    padding: 10px; text-align: center;
}
.report-summary .sum-card strong {
    display: block; color: var(--gold-primary);
    font-size: 1.05rem; font-weight: 900;
    direction: ltr; font-family: 'Inter', sans-serif;
}
.report-summary .sum-card span {
    font-size: 0.68rem; color: var(--text-muted); font-weight: 700;
}
.report-table {
    width: 100%; border-collapse: separate;
    border-spacing: 0 4px; font-size: 0.72rem;
}
.report-table th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 8px 6px; text-align: center;
    position: sticky; top: 0;
    font-weight: 800;
    border: var(--silver-border); border-radius: 8px 8px 0 0;
}
.report-table td {
    padding: 7px 6px; border: var(--silver-border);
    text-align: center; color: var(--text-secondary);
    background: var(--bg-glass); border-radius: 8px;
}

/* ============================================================
   Details
   ============================================================ */
.detail-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
}
.detail-item {
    padding: 10px; border-radius: 10px;
    background: var(--bg-glass);
    border: var(--silver-border);
    text-align: center;
}
.detail-item span {
    display: block; color: var(--text-muted);
    font-size: 0.7rem; font-weight: 600;
}
.detail-item strong {
    display: block; margin-top: 3px;
    overflow-wrap: anywhere;
    text-align: center; color: var(--text-primary);
    font-weight: 800; font-size: 0.85rem;
}
.raw-json {
    direction: ltr; text-align: left;
    white-space: pre-wrap; word-break: break-word;
    background: var(--bg-glass-light); color: var(--text-primary);
    padding: 12px; border-radius: 10px;
    border: var(--silver-border);
    font: 0.72rem/1.5 monospace;
    max-height: 300px; overflow: auto; margin-top: 8px;
}

/* ============================================================
   Print Preview
   ============================================================ */
.print-preview-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 1000; display: none;
    flex-direction: column;
    opacity: 0; transition: opacity 0.3s;
}
.print-preview-overlay.show { display: flex; opacity: 1; }
.print-preview-toolbar {
    background: var(--bg-secondary);
    border-bottom: var(--silver-border-strong);
    padding: 12px 16px;
    display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.print-preview-toolbar .filename-input {
    flex: 1; min-width: 140px;
    padding: 10px 12px;
    border-radius: 10px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.85rem;
    text-align: center;
    outline: none;
    font-weight: 600;
}
.print-preview-toolbar .filename-input:focus {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.15);
}
.print-preview-toolbar .toolbar-btn {
    padding: 10px 14px;
    border-radius: 10px;
    border: var(--silver-border);
    background: var(--gold-primary);
    color: #fff;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: var(--transition);
    touch-action: manipulation;
}
.print-preview-toolbar .toolbar-btn:active { transform: scale(0.95); }
.print-preview-toolbar .toolbar-btn.secondary {
    background: var(--bg-glass); color: var(--text-secondary);
}
.print-preview-toolbar .toolbar-btn.secondary:hover {
    border-color: var(--gold-primary); color: var(--gold-primary);
}
.print-preview-body {
    flex: 1; overflow-y: auto;
    background: #e5e7eb; padding: 16px;
    display: flex; justify-content: center;
}
[data-theme="dark"] .print-preview-body { background: #0f1419; }
.print-sheet {
    background: #fff; color: #111;
    width: 100%; max-width: 720px;
    padding: 24px;
    border-radius: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    direction: rtl;
    font-family: 'Cairo', 'Arial', sans-serif;
}
.print-sheet h1 {
    text-align: center; color: #c89a12;
    font-size: 1.4rem; margin-bottom: 8px;
}
.print-sheet .meta {
    text-align: center; color: #666;
    font-size: 0.75rem; margin-bottom: 16px;
    border-bottom: 1px solid #ddd; padding-bottom: 10px;
}
.print-sheet table {
    width: 100%; border-collapse: collapse;
    font-size: 0.75rem;
}
.print-sheet th, .print-sheet td {
    border: 1px solid #999; padding: 6px 4px;
    text-align: center;
}
.print-sheet th { background: #f0f2f5; font-weight: 800; }

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed; top: 85px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 14px; padding: 12px 22px;
    display: flex; align-items: center; gap: 10px;
    z-index: 600; opacity: 0;
    transition: var(--transition);
    pointer-events: none;
    box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
    min-width: 220px; max-width: 90vw;
    font-size: 0.85rem; font-weight: 700;
    font-family: 'Cairo', 'Inter', sans-serif;
    color: var(--text-primary); text-align: center;
    justify-content: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--emerald-primary); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast.info { border-color: var(--gold-primary); }

.hidden { display: none !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.animate-fade-up { animation: fadeUp 0.5s ease forwards; }

@media (max-width: 480px) {
    .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .form-input { padding: 9px 8px; font-size: 0.8rem; }
    .form-label { font-size: 0.7rem; }
    .top-title h2 { font-size: 1.1rem; }
    .report-filter-grid { grid-template-columns: 1fr 1fr; }
    .modal { padding: 16px 14px; }
    .modal-header { margin: -16px -14px 10px; padding: 14px; }
    .report-summary { grid-template-columns: repeat(2, 1fr); }
    .section-title h3 { font-size: 0.9rem; }
    .view-modes button { padding: 6px 8px; font-size: 0.7rem; }
    .template-card .card-details { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 360px) {
    .form-grid { gap: 6px; }
    .form-input { padding: 8px 6px; font-size: 0.75rem; }
    .form-label { font-size: 0.66rem; }
    .template-card .card-details { grid-template-columns: 1fr; }
}
@media print {
    .top-bar, .bottom-nav, .sidebar-toggle, .sidebar,
    .offline-banner, .icon-btn, .modal-footer, .report-actions,
    .print-preview-toolbar { display: none !important; }
    body { background: #fff; color: #111; padding: 0; }
    .print-preview-overlay { position: static; display: block !important; opacity: 1; background: #fff; }
    .print-preview-body { background: #fff; padding: 0; }
    .print-sheet { box-shadow: none; border-radius: 0; }
}
</style>

</button>

<!-- ============ Bottom Nav ============ -->

<!-- ============ Form Modal ============ -->

        <div class="modal-body">

<script>
(function () {
    'use strict';

    /* ============================================================
       إعدادات الشاشة
       ============================================================ */
    const CFG = {
        title: 'قوالب الإيصالات',
        icon: 'fa-receipt',
        module: 'printing',
        operationKey: 'receipt_templates',
        listMethod: 'getReceiptTemplateRecords',
        createMethod: 'saveReceiptTemplateRecord',
        updateMethod: 'updateReceiptTemplateRecord',
        deleteMethod: 'deleteReceiptTemplateRecord',
        fullWidthKeys: ['description', 'header', 'body', 'footer', 'variables'],
        hiddenKeys: ['template_code', 'id'],
        fields: [
            { key: 'template_code', label: 'كود القالب', type: 'text', required: true, auto: true, attrs: { readonly: true } },
            { key: 'template_name', label: 'اسم القالب', type: 'text', required: true, placeholder: 'مثال: إيصال وقود أساسي' },
            { key: 'description', label: 'الوصف', type: 'textarea', placeholder: 'وصف موجز للقالب' },
            { key: 'station_id', label: 'المحطة', type: 'dynamic-select', source: 'stations' },
            { key: 'header', label: 'نص الترويسة', type: 'textarea', placeholder: 'النص الذي يظهر أعلى الإيصال' },
            { key: 'body', label: 'نص الجسم', type: 'textarea', placeholder: 'المحتوى الرئيسي للإيصال' },
            { key: 'footer', label: 'نص التذييل', type: 'textarea', placeholder: 'النص الذي يظهر أسفل الإيصال' },
            { key: 'variables', label: 'المتغيرات', type: 'textarea', placeholder: '{{name}}، {{amount}}، ...' },
            { key: 'paper_width', label: 'عرض الورق (مم)', type: 'number', defaultValue: 80 },
            { key: 'font_size', label: 'حجم الخط (pt)', type: 'number', defaultValue: 12 },
            { key: 'is_default', label: 'افتراضي', type: 'select', options: [
                { v: '1', t: 'نعم' },
                { v: '0', t: 'لا' }
            ], defaultValue: '0' },
            { key: 'is_active', label: 'الحالة', type: 'select', options: [
                { v: '1', t: 'نشط' },
                { v: '0', t: 'غير نشط' }
            ], defaultValue: '1' }
        ],
        // تبويبات علوية مخصصة لقوالب الإيصالات
        filters: [
            { key: 'all', label: 'الكل', icon: 'fa-list' },
            { key: 'active', label: 'نشط', icon: 'fa-check-circle' },
            { key: 'inactive', label: 'غير نشط', icon: 'fa-ban' },
            { key: 'default', label: 'افتراضي', icon: 'fa-star' },
            { key: 'no_default', label: 'غير افتراضي', icon: 'fa-star-half-alt' }
        ],
        // عناصر القائمة السفلية (مختلفة عن التبويبات العلوية)
        bottomNav: [
            { key: 'home', label: 'الرئيسية', icon: 'fa-home' },
            { key: 'summary', label: 'الملخص', icon: 'fa-clipboard-list' },
            { key: 'by-station', label: 'حسب المحطة', icon: 'fa-building' },
            { key: 'new', label: 'قالب جديد', icon: 'fa-plus', cls: 'nav-new' }
        ]
    };

    /* ============================================================
       الحالة
       ============================================================ */
    const state = {
        rows: [],
        filtered: [],
        editing: null,
        filter: 'all',
        search: '',
        view: 'cards',
        loadedAt: null,
        lookup: { stations: [] },
        reportGenerated: false,
        sortBy: 'template_code',
        sortDir: 'asc',
        session: { stationId: null }
    };

    /* ============================================================
       أدوات مساعدة
       ============================================================ */
    const $ = (id) => document.getElementById(id);
    const bridge = window.AndroidInterface;

    const esc = (v) => String(v == null ? '—' : v)
        .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const today = () => (typeof businessDayDate === 'function' ? businessDayDate() : new Date().toISOString().slice(0, 10));

    function toast(message, type = 'info') {
        const node = $('toast');
        if (!node) return;
        node.className = 'toast show ' + type;
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
        node.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + esc(message);
        clearTimeout(node._t);
        node._t = setTimeout(() => node.classList.remove('show'), 3500);
    }

    function setLoading(v) {
        const node = $('loadingIndicator');
        if (node) node.classList.toggle('show', !!v);
    }

    function parse(raw) {
        if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
        const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (v && v.success === false) throw new Error(v.error || v.message || 'فشلت العملية');
        return v;
    }

    function dataOf(v) {
        if (v && Object.prototype.hasOwnProperty.call(v, 'data')) return v.data;
        return v;
    }

    function invoke(method, args = []) {
        if (!bridge || typeof bridge[method] !== 'function') {
            return Promise.reject(new Error('العقد ' + method + ' غير متاح في الجسر'));
        }
        try {
            return Promise.resolve(parse(bridge[method].apply(bridge, args)));
        } catch (e) {
            return Promise.reject(e);
        }
    }

    function hasBridgeMethod(method) {
        return bridge && typeof bridge[method] === 'function';
    }

    function rowsFrom(v) {
        const raw = dataOf(v);
        if (Array.isArray(raw)) return raw;
        if (raw && Array.isArray(raw.rows)) return raw.rows;
        if (raw && Array.isArray(raw.data)) return raw.data;
        if (raw && typeof raw === 'object') return [raw];
        return [];
    }

    function pick(row, keys) {
        if (!row) return '';
        for (const k of keys) {
            const v = row[k];
            if (v !== undefined && v !== null && v !== '') return v;
        }
        return '';
    }

    function idOf(row) {
        return pick(row, ['id', '_id', 'template_id']);
    }

    function isActive(row) {
        const v = pick(row, ['is_active', 'active']);
        return v === 1 || v === '1' || v === true || String(v).toLowerCase() === 'active' || String(v) === 'نشط';
    }

    function isDefault(row) {
        const v = pick(row, ['is_default', 'default']);
        return v === 1 || v === '1' || v === true || String(v).toLowerCase() === 'yes' || String(v) === 'نعم';
    }

    function isGlobalTemplate(row) {
        return !!row && (row.station_id == null || String(row.station_id).trim() === '');
    }

    function statusInfo(row) {
        return isActive(row)
            ? { label: 'نشط', cls: 'active' }
            : { label: 'غير نشط', cls: 'inactive' };
    }

    function defaultInfo(row) {
        return isDefault(row)
            ? { label: 'افتراضي', cls: 'default' }
            : null;
    }

    function fmtDate(d) {
        if (!d) return '—';
        try {
            const date = new Date(d);
            if (isNaN(date.getTime())) return String(d);
            return date.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
        } catch (_) { return String(d); }
    }

    /* ============================================================
       الثيم
       ============================================================ */
    function applyTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
        else document.documentElement.removeAttribute('data-theme');
        const icon = $('themeIcon');
        if (icon) icon.textContent = saved === 'dark' ? '🌞' : '🌙';
    }
    function toggleTheme() {
        const isDark = document.documentElement.dataset.theme === 'dark';
        if (isDark) document.documentElement.removeAttribute('data-theme');
        else document.documentElement.dataset.theme = 'dark';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
        const icon = $('themeIcon');
        if (icon) icon.textContent = isDark ? '🌙' : '🌞';
    }

    /* ============================================================
       Sidebar
       ============================================================ */
    let sidebarOutsideHandler = null;

    function openSidebar() {
        const sidebar = $('sidebar');
        const toggle = $('sidebarToggle');
        if (!sidebar || !toggle) return;
        sidebar.classList.add('open');
        sidebar.setAttribute('aria-hidden', 'false');
        toggle.classList.add('hidden');
        sidebarOutsideHandler = (e) => {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                closeSidebar();
            }
        };
        setTimeout(() => document.addEventListener('click', sidebarOutsideHandler, true), 50);
    }

    function closeSidebar() {
        const sidebar = $('sidebar');
        const toggle = $('sidebarToggle');
        if (!sidebar || !toggle) return;
        sidebar.classList.remove('open');
        sidebar.setAttribute('aria-hidden', 'true');
        toggle.classList.remove('hidden');
        if (sidebarOutsideHandler) {
            document.removeEventListener('click', sidebarOutsideHandler, true);
            sidebarOutsideHandler = null;
        }
    }

    function toggleSidebar() {
        const sidebar = $('sidebar');
        if (!sidebar) return;
        if (sidebar.classList.contains('open')) closeSidebar();
        else openSidebar();
    }

    /* ============================================================
       تحميل البيانات المرجعية
       ============================================================ */
    async function loadLookups() {
        // جلب المحطات
        try {
            const r = await invoke('getStations', []);
            state.lookup.stations = rowsFrom(r);
        } catch (e) {
            state.lookup.stations = [];
        }
        // جلب المحطة من جلسة المستخدم
        try {
            if (hasBridgeMethod('getCurrentSession')) {
                const s = await invoke('getCurrentSession', []);
                const data = dataOf(s);
                const sid = pick(data || {}, ['station_id', 'stationId', 'current_station_id']);
                if (sid) state.session.stationId = sid;
            }
        } catch (_) { /* تجاهل */ }
    }

    function stationLabel(s) {
        return pick(s, ['station_name_ar', 'station_name', 'station_code', 'name_ar', 'name']) || ('محطة #' + idOf(s));
    }

    function findStation(id) {
        if (id == null || id === '') return null;
        return state.lookup.stations.find(s => String(idOf(s)) === String(id)) || null;
    }

    /* ============================================================
       توليد الحقول
       ============================================================ */
    function buildFieldHtml(def, row) {
        const required = def.required ? 'required' : '';
        const full = CFG.fullWidthKeys.includes(def.key) ? ' full' : '';
        const star = def.required ? '<span class="required-star">*</span>' : '';
        const value = row && row[def.key] != null ? row[def.key] : (def.defaultValue || '');
        const cls = ['form-input'];
        if (def.auto) cls.push('auto-field');
        const clsStr = cls.join(' ');

        if (CFG.hiddenKeys.includes(def.key) && def.type === 'hidden') {
            return '<input type="hidden" data-key="' + esc(def.key) + '" value="' + esc(value) + '">';
        }

        let inner = '';
        if (def.type === 'textarea') {
            inner = '<textarea class="' + clsStr + '" data-key="' + esc(def.key) + '" rows="2" ' +
                    'placeholder="' + esc(def.placeholder || '') + '" ' + required + '>' + esc(value) + '</textarea>';
        } else if (def.type === 'select') {
            const opts = (def.options || []).map(o =>
                '<option value="' + esc(o.v) + '"' + (String(value) === String(o.v) ? ' selected' : '') + '>' + esc(o.t) + '</option>'
            ).join('');
            inner = '<select class="' + clsStr + '" data-key="' + esc(def.key) + '" ' + required + '>' +
                    '<option value="">— اختر —</option>' + opts + '</select>';
        } else if (def.type === 'dynamic-select') {
            inner = '<select class="' + clsStr + '" data-key="' + esc(def.key) +
                    '" data-source="' + esc(def.source) + '" ' + required + '>' +
                    '<option value="">— اختر —</option></select>';
        } else {
            const inputType = def.type === 'number' ? 'number' : (def.type === 'date' ? 'date' : 'text');
            const readonlyAttr = (def.attrs && def.attrs.readonly) ? 'readonly' : '';
            const stepAttr = def.type === 'number' ? 'step="any"' : '';
            const inputmodeAttr = def.type === 'number' ? 'inputmode="numeric"' : 'inputmode="text"';
            inner = '<input class="' + clsStr + '" data-key="' + esc(def.key) + '" type="' + inputType + '" ' +
                    'value="' + esc(value) + '" placeholder="' + esc(def.placeholder || '') + '" ' +
                    required + ' ' + readonlyAttr + ' ' + stepAttr + ' ' + inputmodeAttr + '>';
        }
        return '<div class="form-group' + full + '">' +
               '<label class="form-label">' + esc(def.label) + star + '</label>' + inner +
               '</div>';
    }

    function fillDynamicSelect(sel, items, labelFn, selectedValue) {
        const current = selectedValue != null ? String(selectedValue) : '';
        let html = '<option value="">— اختر —</option>';
        items.forEach(it => {
            const id = idOf(it);
            const label = labelFn(it);
            html += '<option value="' + esc(id) + '"' + (String(id) === current ? ' selected' : '') + '>' + esc(label) + '</option>';
        });
        sel.innerHTML = html;
    }

    async function refreshDynamicSelects(formEl, row) {
        const selects = formEl.querySelectorAll('select[data-source]');
        for (const sel of selects) {
            const src = sel.dataset.source;
            if (src === 'stations') {
                // إذا كان هناك محطة في الجلسة، استخدمها كقيمة افتراضية
                let selectedVal = '';
                if (row && row.station_id != null) selectedVal = row.station_id;
                else if (state.session.stationId != null) selectedVal = state.session.stationId;
                fillDynamicSelect(sel, state.lookup.stations, stationLabel, selectedVal);
            }
        }
    }

    /* ============================================================
       توليد كود تلقائي
       ============================================================ */
    function nextTemplateCode() {
        const existing = new Set(state.rows.map(r => String(r.template_code || '')));
        let n = state.rows.length + 1;
        let code = 'TPL-' + String(n).padStart(3, '0');
        while (existing.has(code)) { n++; code = 'TPL-' + String(n).padStart(3, '0'); }
        return code;
    }

    /* ============================================================
       فتح/إغلاق المودالات
       ============================================================ */
    function openModal(event, id) {
        if (event && event.target !== event.currentTarget) return;
        const el = $(id);
        if (!el) return;
        el.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(event, id) {
        if (event && event.target !== event.currentTarget) return;
        const el = $(id);
        if (!el) return;
        el.classList.remove('show');
        document.body.style.overflow = '';
    }

    /* ============================================================
       نموذج الإضافة/التعديل
       ============================================================ */
    async function openForm(row = null) {
        const isSharedTemplate = isGlobalTemplate(row);
        const requiredMethod = isSharedTemplate || !row ? CFG.createMethod : CFG.updateMethod;
        if (!hasBridgeMethod(requiredMethod)) {
            toast('لا توجد عملية كتابة متاحة', 'error');
            return;
        }
        const formRow = isSharedTemplate ? Object.assign({}, row, {
            template_code: nextTemplateCode(),
            station_id: state.session.stationId || ''
        }) : row;
        state.editing = isSharedTemplate ? null : row;
        const title = isSharedTemplate ? 'إنشاء نسخة محلية من قالب عام' : (row ? 'تعديل قالب' : 'إضافة قالب جديد');
        $('formTitle').innerHTML = '<i class="fas ' + (isSharedTemplate ? 'fa-copy' : (row ? 'fa-edit' : 'fa-plus-circle')) + '"></i> ' + title;

        const form = $('recordForm');
        form.innerHTML = CFG.fields.map(def => buildFieldHtml(def, formRow)).join('');

        if (!formRow) {
            const codeEl = form.querySelector('[data-key="template_code"]');
            if (codeEl) codeEl.value = nextTemplateCode();
        } else {
            CFG.fields.forEach(def => {
                const el = form.querySelector('[data-key="' + CSS.escape(def.key) + '"]');
                if (!el) return;
                const v = formRow[def.key];
                if (v != null) el.value = v;
            });
        }

        await refreshDynamicSelects(form, formRow);

        // تركيز تلقائي على أول حقل قابل للتعديل
        setTimeout(() => {
            const first = form.querySelector('input:not([readonly]):not([type="hidden"]), textarea:not([readonly]), select');
            if (first) first.focus();
        }, 200);

        openModal(null, 'formModal');
    }

    function collectForm() {
        const form = $('recordForm');
        const payload = {};
        form.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            let v = el.value;
            if (key === 'station_id') v = v === '' ? null : Number(v);
            else if (key === 'is_active' || key === 'is_default') v = String(v) === '1' ? 1 : 0;
            else if (el.type === 'number') v = v === '' ? 0 : Number(v);
            payload[key] = v;
        });
        return payload;
    }

    async function saveForm() {
        const form = $('recordForm');
        if (!form.reportValidity()) return;
        const payload = collectForm();
        setLoading(true);
        try {
            if (state.editing) {
                const id = idOf(state.editing);
                if (!id) throw new Error('معرف السجل غير صالح');
                if (!hasBridgeMethod(CFG.updateMethod)) {
                    throw new Error('لا توجد عملية تحديث متاحة');
                }
                await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                toast('تم تحديث القالب بنجاح', 'success');
            } else {
                if (!hasBridgeMethod(CFG.createMethod)) {
                    throw new Error('لا توجد عملية إضافة متاحة');
                }
                await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                toast('تمت إضافة القالب بنجاح', 'success');
            }
            closeModal(null, 'formModal');
            await reloadData();
        } catch (e) {
            toast(e.message || 'فشلت العملية', 'error');
        } finally {
            setLoading(false);
        }
    }

    async function deleteRow(row) {
        const id = idOf(row);
        if (!id) return;
        if (isGlobalTemplate(row)) {
            toast('القالب العام مشترك؛ أنشئ نسخة محلية بدلاً من حذفه', 'warning');
            return;
        }
        if (!hasBridgeMethod(CFG.deleteMethod)) {
            toast('لا توجد عملية حذف متاحة', 'error');
            return;
        }
        if (!confirm('هل تريد حذف هذا القالب فعلياً؟')) return;
        setLoading(true);
        try {
            await invoke(CFG.deleteMethod, [Number(id)]);
            toast('تم حذف القالب', 'success');
            await reloadData();
        } catch (e) {
            toast(e.message || 'فشل الحذف', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       الفلترة والرندر
       ============================================================ */
    function filterRows() {
        const q = state.search.trim().toLowerCase();
        let list = state.rows.slice();

        if (state.filter !== 'all') {
            list = list.filter(r => {
                switch (state.filter) {
                    case 'active': return isActive(r);
                    case 'inactive': return !isActive(r);
                    case 'default': return isDefault(r);
                    case 'no_default': return !isDefault(r);
                    default: return true;
                }
            });
        }

        if (q) {
            list = list.filter(r => {
                try { return JSON.stringify(r || {}).toLowerCase().includes(q); }
                catch (_) { return false; }
            });
        }

        const sb = state.sortBy;
        const dir = state.sortDir === 'desc' ? -1 : 1;
        list.sort((a, b) => {
            const av = String(a[sb] == null ? '' : a[sb]);
            const bv = String(b[sb] == null ? '' : b[sb]);
            return av.localeCompare(bv, 'ar') * dir;
        });

        return list;
    }

    function applyFilter() {
        state.filtered = filterRows();
        updateChipCounts();
        render();
    }

    function updateChipCounts() {
        const counts = {
            all: state.rows.length,
            active: 0,
            inactive: 0,
            default: 0,
            no_default: 0
        };
        state.rows.forEach(r => {
            if (isActive(r)) counts.active++; else counts.inactive++;
            if (isDefault(r)) counts.default++; else counts.no_default++;
        });
        document.querySelectorAll('[data-count]').forEach(el => {
            const k = el.dataset.count;
            if (k in counts) el.textContent = counts[k];
        });
    }

    /* ============================================================
       الإحصائيات

        const rows = state.rows;
        const total = rows.length;
        const active = rows.filter(r => isActive(r)).length;
        const def = rows.filter(r => isDefault(r)).length;

        $('statCount').textContent = total.toLocaleString('ar-EG');
        $('statActive').textContent = active.toLocaleString('ar-EG');

        $('statUpdated').textContent = state.loadedAt

            : '—';
        $('itemCount').textContent = state.filtered.length.toLocaleString('ar-EG');
    }
