    async function openAddModal() {
        state.editing = null; state.editingId = 0;
        $('formTitle').innerHTML = '<i class="fas fa-file-circle-plus"></i> فاتورة توريد جديدة';
        try {
            const result = await invoke('getNextRefillCode', []);
            const d = dataOf(result);
            state.nextRefillCode = (d && d.refill_code) ? d.refill_code : '';
        } catch (_) { state.nextRefillCode = ''; }

        $('recordForm').innerHTML = buildFormHtml(null);
        $('formModal').classList.add('show');
        bindFormEvents();
        applyDefaultsForAdd();
        recalcAll();
        $('approveSupplyBtn').disabled = true;
        $('printSupplyBtn').disabled = true;
        setTimeout(() => { $('supplierSelect')?.focus(); }, 200);
    }

    function openEditModal(row) {
        state.editing = row;
        state.editingId = Number(field(row, ['id']));
        $('formTitle').innerHTML = '<i class="fas fa-file-pen"></i> تعديل فاتورة التوريد';
        $('recordForm').innerHTML = buildFormHtml(row);
        $('formModal').classList.add('show');

        const setVal = (key, val) => {
            const el = document.querySelector(`[data-key="${key}"]`);
            if (el && val !== undefined && val !== null) el.value = String(val);
        };
        setVal('supplier_id', field(row, ['supplier_id']));
        setVal('tank_id', field(row, ['tank_id']));
        setVal('fuel_type_id', field(row, ['fuel_type_id']));
        setVal('currency_id', field(row, ['currency_id']));
        setVal('status', field(row, ['status']));
        setVal('lab_test_result', field(row, ['lab_test_result']));
        setVal('payment_method', getPaymentMethod(row));
        setVal('cash_box_id', getCashBoxId(row));

        bindFormEvents();
        // حدّث بيانات الخزان فور فتح التعديل
        updateTankInfo();
        recalcAll();
        togglePaymentFields();
        if (field(row, ['supplier_id'])) loadSupplierBalance(field(row, ['supplier_id'])).then(renderSupplierBalance);

        $('approveSupplyBtn').disabled = false;
        $('printSupplyBtn').disabled = false;
    }

    function applyDefaultsForAdd() {
        // الوقت الحالي تلقائياً
        const arrival = document.querySelector('[data-key="arrival_date"]');
        if (arrival) arrival.value = nowLocal();
        // نتيجة الفحص الافتراضية: pending
        const lab = $('labResultField');
        if (lab) lab.value = 'pending';
    }

    function bindFormEvents() {
        // الحقول الحسابية
        ['orderedQty'].forEach(id => {
            const el = $(id); if (!el) return;
            el.removeEventListener('input', recalcAll); el.addEventListener('input', recalcAll);
        });
        ['transport_cost','discount','tax_amount'].forEach(key => {
            const el = document.querySelector(`[data-key="${key}"]`); if (!el) return;
            el.removeEventListener('input', recalcAll); el.addEventListener('input', recalcAll);
        });
        // تغيير الخزان
        const tankSel = $('tankSelect');
        if (tankSel) {
            tankSel.removeEventListener('change', onTankChange);
            tankSel.addEventListener('change', onTankChange);
        }
        // تغيير نوع الوقود
        const fuelSel = $('fuelTypeSelect');
        if (fuelSel) {
            fuelSel.removeEventListener('change', onFuelTypeChange);
            fuelSel.addEventListener('change', onFuelTypeChange);
        }
        // تغيير طريقة الدفع
        const pm = $('paymentMethodSelect');
        if (pm) { pm.removeEventListener('change', togglePaymentFields); pm.addEventListener('change', togglePaymentFields); }
        const cb = $('cashBoxSelect');
        if (cb) { cb.removeEventListener('change', togglePaymentFields); cb.addEventListener('change', togglePaymentFields); }
        // تغيير المورد
        const sup = $('supplierSelect');
        if (sup) {
            sup.removeEventListener('change', onSupplierChange);
            sup.addEventListener('change', onSupplierChange);
            if (sup.value) onSupplierChange();
        }

        // تفعيل التنقل بـ Enter على كل حقول النموذج
        setupEnterNavigation();

        togglePaymentFields();
    }

    // ============================================================
    // Tank & Fuel Type change handlers (الملاحظات 3، 4)
    // ============================================================
    function onTankChange() { updateTankInfo(); recalcAll(); }
    function onFuelTypeChange() { updateTankInfo(); recalcAll(); }

    function findTank(id) {
        return state.lookups.tanks.find(t => Number(field(t, ['tank_id','id'])) === Number(id));
    }
    function findFuelType(id) {
        return state.lookups.fuelTypes.find(f => Number(field(f, ['fuel_type_id','id'])) === Number(id));
    }

    function updateTankInfo() {
        const tankId = $('tankSelect')?.value;
        const tank = tankId ? findTank(tankId) : null;
        const preview = $('tankPreview');

        if (!tank) {
            if (preview) preview.style.display = 'none';
            return;
        }

        // عرض معاينة الخزان
        if (preview) preview.style.display = 'grid';
        $('tankCurrentQty').textContent = fmt(num(field(tank, ['current_quantity'])), 2) + ' ل';
        $('tankCapacity').textContent = fmt(num(field(tank, ['capacity_liters'])), 2) + ' ل';
        // سعر الشراء: من الخزان (default_purchase_price) أو من نوع الوقود
        const purchasePrice = num(field(tank, ['purchase_price_per_liter','default_purchase_price']))
            || num(field(findFuelType(field(tank, ['fuel_type_id'])) || {}, ['default_purchase_price']));
        const salePrice = num(field(tank, ['selling_price_per_liter','default_sale_price']))
            || num(field(findFuelType(field(tank, ['fuel_type_id'])) || {}, ['default_sale_price']));
        $('tankPurchasePrice').textContent = purchasePrice ? fmt(purchasePrice, 2) : '—';
        $('tankSalePrice').textContent = salePrice ? fmt(salePrice, 2) : '—';

        // حقول الكثافة والحرارة وشهادة الجودة تأتي من الخزان
        const densityField = $('densityField');
        const tempField = $('tempField');
        const qualityCertField = $('qualityCertField');
        if (densityField && !densityField.value) {
            densityField.value = num(field(tank, ['fuel_density'])) || '';
        }
        if (tempField && !tempField.value) {
            tempField.value = num(field(tank, ['fuel_temperature'])) || '';
        }
        if (qualityCertField && !qualityCertField.value) {
            qualityCertField.value = field(tank, ['quality_certificate']) || '';
        }

        // سعر الشراء يُحدَّث من الخزان
        const unitPriceField = $('unitPrice');
        if (unitPriceField && purchasePrice > 0) {
            unitPriceField.value = purchasePrice.toFixed(4);
        }

        // نوع الوقود المقترح (إذا كان الخزان يشير إلى نوع)
        const fuelTypeFromTank = field(tank, ['fuel_type_id']);
        const fuelSel = $('fuelTypeSelect');
        if (fuelSel && fuelTypeFromTank && !fuelSel.value) {
            fuelSel.value = String(fuelTypeFromTank);
        }
    }

    function onSupplierChange() {
        const supId = $('supplierSelect')?.value;
        if (!supId) { $('supplierBalancePreview').style.display = 'none'; return; }
        loadSupplierBalance(supId).then(renderSupplierBalance); togglePaymentFields();
    }

    function renderSupplierBalance(balance) {
        const preview = $('supplierBalancePreview');
        const valueEl = $('supplierBalanceValue');
        if (!preview || !valueEl) return;
        if (balance === null || balance === undefined) { preview.style.display = 'none'; return; }
        preview.style.display = 'flex';
        valueEl.textContent = fmt(balance, 2) + ' ر.ي';
        valueEl.style.color = balance > 0 ? '#d97706' : 'var(--success)';
    }

    function togglePaymentFields() {
        const method = $('paymentMethodSelect')?.value || 'cash';
        const cashGroup = $('cashBoxGroup');
        const cashNotice = $('cashNotice');
        const creditNotice = $('creditNotice');
        const cashBoxSelect = $('cashBoxSelect');

        if (method === 'cash') {
            if (cashGroup) cashGroup.style.display = '';
            if (cashNotice) cashNotice.style.display = 'flex';
            if (creditNotice) creditNotice.style.display = 'none';
            if (cashBoxSelect) cashBoxSelect.required = true;
            const box = state.lookups.cashBoxes.find(b => Number(b.id) === Number(cashBoxSelect?.value || 0));
            const amount = num($('netAmount')?.value);
            const balance = box ? num(field(box, ['current_balance'])) : 0;
            const impact = $('cashImpactText');
            if (impact) impact.textContent = box
                ? `الصندوق: ${field(box, ['box_name_ar','box_name'])} — الرصيد الحالي ${fmt(balance, 2)} ر.ي. وسيُخصم ${fmt(amount, 2)} ر.ي. بعد نجاح الحفظ.`
                : 'اختر صندوقاً نشطاً لعرض الأثر المالي الفعلي.';
        } else {
            if (cashGroup) cashGroup.style.display = 'none';
            if (cashNotice) cashNotice.style.display = 'none';
            if (creditNotice) creditNotice.style.display = 'flex';
            if (cashBoxSelect) { cashBoxSelect.required = false; cashBoxSelect.value = ''; }
            const supplierId = $('supplierSelect')?.value;
            const supplier = state.lookups.suppliers.find(s => Number(s.id) === Number(supplierId || 0));
            const amount = num($('netAmount')?.value);
            const impact = $('creditImpactText');
            if (impact) impact.textContent = supplier
                ? `المورد: ${field(supplier, ['commercial_name_ar','commercial_name','legal_name'])} — ستزداد مديونيته بمقدار ${fmt(amount, 2)} ر.ي. بعد نجاح الحفظ.`
                : 'اختر المورد لعرض الأثر المالي الفعلي.';
        }
    }

    // ============================================================
    // RECALC (الملاحظات 5) — الكميات المطلوبة/الموردة/الفعلية
    // ============================================================
    function recalcAll() {
        const ordered = num($('orderedQty')?.value);
        const tankId = $('tankSelect')?.value;
        const tank = tankId ? findTank(tankId) : null;
        const tankCurrentQty = tank ? num(field(tank, ['current_quantity'])) : 0;

        // الكمية الموردة = الكمية المطلوبة
        const delivered = ordered;
        // الكمية الفعلية = المطلوبة + الكمية في الخزان المحدد
        const actual = ordered + tankCurrentQty;
        // الفرق = الفعلية - الموردة (= الكمية في الخزان)
        const diff = actual - delivered;

        const deliveredField = $('deliveredQty');
        const actualField = $('actualQty');
        const diffField = $('qtyDiff');
        if (deliveredField) deliveredField.value = delivered ? delivered.toFixed(2) : '0.00';
        if (actualField) actualField.value = actual ? actual.toFixed(2) : '0.00';
        if (diffField) diffField.value = diff.toFixed(2);

        // حساب التسعير
        const unitPrice = num($('unitPrice')?.value);
        const transport = num(document.querySelector('[data-key="transport_cost"]')?.value);
        const discount = num(document.querySelector('[data-key="discount"]')?.value);
        const tax = num(document.querySelector('[data-key="tax_amount"]')?.value);

        const total = delivered * unitPrice;
        const net = Math.max(0, total + transport - discount + tax);

        if ($('totalAmount')) $('totalAmount').value = total.toFixed(2);
        if ($('netAmount')) $('netAmount').value = net.toFixed(2);
        togglePaymentFields();
    }

    function collectForm() {
        const payload = {};
        document.querySelectorAll('#recordForm [data-key]').forEach(el => {
            const key = el.dataset.key;
            if (key === 'refill_code' || key === 'arrival_date') return; // auto
            let v = el.value;
            if (el.type === 'number') v = v === '' ? 0 : Number(v);
            if ((el.type === 'date' || el.type === 'datetime-local') && v === '') v = null;
            payload[key] = v;
        });
        // arrival_date يُدخَل من النظام
        payload.arrival_date = nowLocal();
        return payload;
    }

    // ============================================================
    // Enter navigation (الملاحظة 2)
    // ============================================================
    function setupEnterNavigation() {
        const form = $('recordForm');
        if (!form) return;
        const fields = Array.from(form.querySelectorAll('input:not([readonly]):not([tabindex="-1"]), select, textarea'));
        fields.forEach((field, index) => {
            field.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const next = fields[index + 1];
                    if (next) {
                        try { next.focus(); if (typeof next.select === 'function' && next.tagName === 'INPUT') next.select(); }
                        catch (_) { next.focus(); }
                    } else {
                        // آخر حقل → احفظ تلقائياً
                        saveForm();
                    }
                }
            });
        });
    }

    // ============================================================
    // SAVE
    // ============================================================
    async function saveForm(opts = {}) {
        const printAfter = Boolean(opts && opts.printAfter);
        const form = $('recordForm');
        if (!form.reportValidity()) return;

        const payload = collectForm();
        if (!payload.supplier_id) return toast('اختر المورد', 'error');
        if (!payload.tank_id) return toast('اختر الخزان', 'error');
        if (!payload.fuel_type_id) return toast('اختر نوع الوقود', 'error');
        if (!(num(payload.ordered_quantity) > 0)) return toast('أدخل الكمية المطلوبة', 'error');
        const method = payload.payment_method || 'cash';
        if (method === 'cash' && !payload.cash_box_id) return toast('اختر الصندوق النقدي', 'error');
        if (!state.editing) payload.status = 'completed';

        // القيم النهائية
        const ordered = num(payload.ordered_quantity);
        const tankId = payload.tank_id;
        const tank = tankId ? findTank(tankId) : null;
        const tankCurrentQty = tank ? num(field(tank, ['current_quantity'])) : 0;
        const delivered = ordered;
        const actual = ordered + tankCurrentQty;
        const unitPrice = num(payload.unit_price);
        const transport = num(payload.transport_cost);
        const discount = num(payload.discount);
        const tax = num(payload.tax_amount);

        payload.delivered_quantity = delivered;
        payload.actual_quantity = actual;
        payload.quantity_difference = actual - delivered;
        payload.total_amount = delivered * unitPrice;
        payload.net_amount = Math.max(0, payload.total_amount + transport - discount + tax);
        payload.status = payload.status || 'pending';

        setLoading(true);
        try {
            let result;
            if (state.editing) {
                result = await invoke('updateTankRefillRecord', [state.editingId, JSON.stringify(payload)]);
                parse(result);
                toast('تم تحديث الفاتورة', 'success');
                closeModal(null, 'formModal');
                await reloadData();
            } else {
                result = await invoke('saveTankRefillWithPayment', [JSON.stringify(payload)]);
                const saved = dataOf(parse(result));
                const savedId = Number(saved.id || saved.refill_id || 0);
                if (!savedId) throw new Error('لم يتم استلام معرف الفاتورة من SQLite');

                state.lastSavedRow = {
                    ...payload,
                    id: savedId,
                    refill_code: saved.refill_code || payload.refill_code || state.nextRefillCode,
                    supplier_name: ($('supplierSelect')?.selectedOptions?.[0]?.textContent || '').trim(),
                    tank_name: ($('tankSelect')?.selectedOptions?.[0]?.textContent || '').trim(),
                    fuel_name: ($('fuelTypeSelect')?.selectedOptions?.[0]?.textContent || '').trim(),
                    payment_method: method,
                    net_amount: payload.net_amount,
                    created_at: nowLocal(),
                    actual_quantity: actual,
                    delivered_quantity: delivered,
                    unit_price: unitPrice
                };

                toast(saved.message || 'تم حفظ فاتورة التوريد بنجاح', 'success', 5000);
                state.supplierBalances = {};

                if (printAfter) {
                    // اطبع الفاتورة بعد الحفظ
                    await printSupplyInvoice(state.lastSavedRow, true);
                } else {
                    // اعرض خيار الطباعة بعد نجاح الحفظ
                    const choice = await Swal.fire({
                        title: '✅ تم حفظ الفاتورة',
                        text: 'هل تريد طباعة فاتورة التوريد الآن؟',
                        icon: 'success',
                        showCancelButton: true,
                        confirmButtonText: '🖨️ طباعة',

    // ============================================================
    // AI Advisor
    // ============================================================
    function buildAIInsights() {
        const insights = [];
        const now = Date.now();
        const supplierTotals = {};
        state.rows.forEach(row => {
            const sid = row.supplier_id; if (!sid) return;
            if (!supplierTotals[sid]) supplierTotals[sid] = { credit: 0, cash: 0, count: 0, qualityIssues: 0 };
            const net = num(field(row, ['net_amount','total_amount']));
            if (getPaymentMethod(row) === 'credit') supplierTotals[sid].credit += net;
            else supplierTotals[sid].cash += net;
            supplierTotals[sid].count++;
            if (String(row.lab_test_result) === 'failed' || String(row.lab_test_result) === 'warning') {
                supplierTotals[sid].qualityIssues++;
            }
        });

        Object.entries(supplierTotals).forEach(([sid, t]) => {
            const supplier = state.lookups.suppliers.find(s => Number(s.id) === Number(sid));
            const name = supplier ? (field(supplier, ['commercial_name_ar','commercial_name','legal_name']) || `مورد #${sid}`) : `مورد #${sid}`;
            if (t.credit > 500_000) {
                insights.push({
                    severity: 'warning',
                    title: '⚠️ مديونية مورد مرتفعة',
                    desc: `المورد "${name}" مديونية قائمة بقيمة ${fmt(t.credit)} ر.ي.`
                });
            }
            if (t.qualityIssues >= 2) {
                insights.push({
                    severity: 'danger',
                    title: '🚨 مشاكل جودة متكررة',
                    desc: `المورد "${name}" سجل ${t.qualityIssues} حالات جودة مرفوضة/تحذير.`
                });
            }
        });

        state.rows.forEach(row => {
            if (String(row.status) === 'pending') {
                const d = new Date(field(row, ['order_date','created_at']));
                if (!isNaN(d.getTime()) && (now - d.getTime()) > 15 * 86400000) {
                    insights.push({
                        severity: 'info',
                        title: '⏳ فاتورة معلقة',
                        desc: `الفاتورة ${field(row, ['refill_code'])} معلقة منذ أكثر من 15 يوماً.`
                    });
                }
            }
        });
        state.aiInsights = insights;
        return insights;
    }

    function exportCSV() {
        const rows = state.filtered;
        if (!rows.length) return toast('لا توجد بيانات', 'warning');
        const keys = ['refill_code','invoice_number','supplier_name','tank_name','fuel_name_ar',
            'delivered_quantity','actual_quantity','unit_price','net_amount','payment_method','status','order_date'];
        const csv = '\ufeff' + [keys, ...rows.map(r => {
            const pm = getPaymentMethod(r);
            return keys.map(k => {
                if (k === 'payment_method') return pm === 'credit' ? 'آجل' : 'نقد';
                if (k === 'supplier_name') return field(r, ['supplier_name','supplier_id']);
                if (k === 'tank_name') return field(r, ['tank_name','tank_id']);
                if (k === 'fuel_name_ar') return field(r, ['fuel_name_ar','fuel_name']);
                return String(r[k] ?? '');
            });
        })].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fuel_supplies_${Date.now()}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('تم تصدير CSV', 'success');
    }

    let stationLogoDataUrl = '';
    async function loadStationLogo() {
        if (!bridge || typeof bridge.getCurrentStationProfile !== 'function') return '';
        try {
            const resp = await invoke('getCurrentStationProfile', []);
            const profile = dataOf(resp);
            if (!profile) return '';
            const photoValue = profile.station_photo || '';
            if (!photoValue) return '';
            let uri = photoValue;
            try {
                const parsed = JSON.parse(photoValue);
                uri = parsed.uri || parsed.path || photoValue;
            } catch (_) {}
            if (!uri) return '';
            const preview = await invoke('getStationFilePreviewDataUrl', [uri]);
            const p = dataOf(preview);
            stationLogoDataUrl = (p && p.dataUrl) || '';
            return stationLogoDataUrl;
        } catch (_) { return ''; }
    }

                    <div class="lbl">سعر الشراء/لتر</div>
                    <div class="val">${unitPrice.toFixed(4)}</div>
                </div>
                <div class="inv-summary-card">
                    <div class="lbl">الإجمالي الفرعي</div>
                    <div class="val">${totalAmount.toFixed(2)}</div>
                </div>
                <div class="inv-summary-card grand">
                    <div class="lbl">الإجمالي النهائي</div>
                    <div class="val">${netAmount.toFixed(2)} ر.ي</div>
                </div>
            </div>

            <div class="inv-footer-signatures">
                <div class="signature-block">
                    <div class="lbl">المورد</div>
                    <div class="line"></div>
                </div>
                <div class="signature-block">
                    <div class="lbl">أمين المستودع</div>
                    <div class="line"></div>
                </div>
                <div class="signature-block">
                    <div class="lbl">المشتريات</div>
                    <div class="line" style="text-align:center;border-bottom:none;font-size:11px;padding-bottom:2mm;font-weight:800;color:#1a3a5a;">${esc(createdBy)}</div>
                </div>
            </div>

            <div class="inv-received-note">
                استلمنا البضاعة الموضحة أعلاه كاملة وسليمة
            </div>
        `;
    }

    // ============================================================
    // PRINT INVOICE
    // ============================================================
    async function printSupplyInvoice(row, silent) {
        if (!row) {
            // استخدم الصف المحدد
            const id = Number(state.selectedId || 0);
            if (id > 0) row = state.rows.find(r => Number(r.id) === id);
        }
        if (!row) {
            if (!silent) toast('يرجى تحديد فاتورة أولاً', 'warning');
            return;
        }
        try {
            setLoading(true);
            await loadStationLogo();
            const section = $('supplyInvoice');
            section.innerHTML = buildInvoiceHtml(row);
            section.style.display = 'block';

            document.body.classList.add('invoice-print-mode');

            // بعض المسارات للطباعة عبر AndroidBridge
            if (bridge && typeof bridge.printCurrentPage === 'function') {
                const result = await invoke('printCurrentPage', []);
                if (result && !result.success) throw new Error(result.message || 'فشل فتح نافذة الطباعة');
            } else {
                // Fallback: window.print
                window.print();
            }

            toast('تم إرسال الفاتورة للطباعة', 'success');
            setTimeout(() => {
                section.style.display = 'none';
                document.body.classList.remove('invoice-print-mode');
            }, 3000);
        } catch (e) {
            document.body.classList.remove('invoice-print-mode');
            if (!silent) toast(e.message || 'فشل الطباعة', 'error');
        } finally {
            setLoading(false);
        }
    }

    // عرض فاتورة موجودة من القائمة
    function viewInvoice(id) {
        const row = state.rows.find(r => Number(r.id) === Number(id));
        if (!row) { toast('لم يتم العثور على الفاتورة', 'error'); return; }
        state.selectedId = id;
        printSupplyInvoice(row, false);
    }

    // ============================================================
    // Sidebar
    // ============================================================
    function setupSidebar() {
        const sidebar = $('sidebar'); const toggle = $('sidebarToggle');
        if (!sidebar || !toggle) return;
        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.toggle('open');
            toggle.classList.toggle('hidden');
        });
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                sidebar.classList.remove('open');
                toggle.classList.remove('hidden');
            }
        });
    }

    function handleSidebarAction(action) {
        $('sidebar').classList.remove('open');
        $('sidebarToggle').classList.remove('hidden');
        switch (action) {
            case 'add': openAddModal(); break;
            case 'ai_advisor': openAIAdvisor(); break;
            case 'report': openReport(); break;
            case 'home': window.location.href = '../main.html'; break;
        }
    }

    function closeModal(event, id) {
        if (event && event.target !== event.currentTarget) return;
        if (!id) return;
        $(id).classList.remove('show');
    }

    // ============================================================
    // Pull-to-Refresh
    // ============================================================
    let pullStartY = 0, pullOffset = 0, isPulling = false;
    function setupPullToRefresh() {
        const isInteractive = (target) => Boolean(target && target.closest &&
            target.closest('input, textarea, select, button, a, [contenteditable="true"], .modal-overlay'));
        document.addEventListener('touchstart', (e) => {
            if (isInteractive(e.target)) { isPulling = false; return; }
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            if (scrollTop <= 0) { pullStartY = e.touches[0].clientY; isPulling = true; }
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (!isPulling || isInteractive(e.target)) return;
            const diff = e.touches[0].clientY - pullStartY;
            if (diff > 20) {
                pullOffset = Math.min(diff, 80);
                const indicator = $('pullIndicator');
                indicator.style.top = (pullOffset - 60) + 'px';
                indicator.querySelector('span').textContent = pullOffset > 60 ? 'حرر للتحديث' : 'اسحب للتحديث';
                e.preventDefault();
            }
        }, { passive: false });
        document.addEventListener('touchend', () => {
            if (isPulling && pullOffset > 60) {
                const indicator = $('pullIndicator');
                indicator.classList.add('active');
                indicator.querySelector('i').className = 'fas fa-spinner fa-spin';
                indicator.querySelector('span').textContent = 'جاري التحديث...';
                setTimeout(() => {
                    loadLookups().then(() => reloadData());
                    setTimeout(() => {
                        indicator.style.top = '-60px';
                        indicator.classList.remove('active');
                        indicator.querySelector('i').className = 'fas fa-arrow-down';
                        indicator.querySelector('span').textContent = 'اسحب للتحديث';
                        isPulling = false; pullOffset = 0;
                    }, 500);
                }, 300);
            } else {
                $('pullIndicator').style.top = '-60px';
                isPulling = false; pullOffset = 0;
            }
        }, { passive: true });
    }

    // ============================================================
    // Global expose
    // ============================================================
    window.openAddModal = openAddModal;
    window.editSupply = (id) => { const row = state.rows.find(r => Number(r.id) === Number(id)); if (row) openEditModal(row); };
    window.viewDetails = viewDetails;
    window.viewInvoice = viewInvoice;
    window.approveSupply = approveSupply;
    window.deleteSupply = deleteSupply;
    window.openAIAdvisor = openAIAdvisor;
    window.openReport = openReport;
    window.generateReport = generateReport;
    window.exportCSV = exportCSV;
    window.handleSidebarAction = handleSidebarAction;
    window.handleSearch = handleSearch;
    window.setFilter = setFilter;
    window.closeModal = closeModal;
    window.showNotifications = showNotifications;
    window.selectCard = selectCard;
    window.printSupplyInvoice = printSupplyInvoice;

    // ============================================================
    // Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
        applyTheme();
        setupSidebar();
        setupPullToRefresh();
        $('themeToggle').addEventListener('click', toggleTheme);
        $('saveSupplyBtn').addEventListener('click', () => saveForm());
        $('saveAndPrintBtn').addEventListener('click', () => saveForm({ printAfter: true }));
        $('approveSupplyBtn').addEventListener('click', () => {
            if (state.editingId) approveSupply(state.editingId);
            else toast('احفظ الفاتورة أولاً', 'warning');
        });

        renderSkeleton();
        await loadLookups();
        await reloadData();

        buildAIInsights();
        renderAlerts();

        setTimeout(() => {
            if (state.aiInsights.length > 0) {
                toast(`🤖 المستشار الذكي جاهز — ${state.aiInsights.length} توصية`, 'info', 4000);
            }
        }, 1500);
    });
})();
</script>
