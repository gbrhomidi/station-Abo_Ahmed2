<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة محطة الوقود – توريد ومشتريات الوقود</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #f2fbff; --card-color: #ffffff; --surface-elevated: #ffffff;
            --primary-color: #007ACC; --primary-hover: #005e99; --primary-dim: rgba(0,122,204,0.12);
            --primary3-color: #4B0082; --accent-color: #d4a017; --accent-dim: rgba(212,160,23,0.12);
            --success: #10b981; --warning: #f59e0b; --error: #ef4444;
            --text-color: #0f1e33; --text-muted: #64748b;
            --border-color: rgba(0,0,0,0.08);
            --shadow-glow: 0 0 20px rgba(0,122,204,0.08);
            --glass-bg: rgba(255,255,255,0.9);
            --header-bg: linear-gradient(135deg, #e8edf4 0%, #d5dce8 100%);
            --toast-bg: #ffffff; --scrollbar-track: #f0f0f0; --scrollbar-thumb: rgba(0,0,0,0.15);
            --skeleton-bg: #e2e8f0; --skeleton-shine: #f0f4f8;
            --font-sans: 'Cairo', sans-serif;
            --fuel-tank: linear-gradient(135deg, #f59e0b, #d97706);
            --invoice-navy: #1a3a5a;
        }
        [data-theme="dark"] {
            --bg-color: #0a0e1a; --card-color: #111827; --surface-elevated: #1a2236;
            --primary-color: #1fa2ff; --primary-hover: #0d81cc; --primary-dim: rgba(31,162,255,0.15);
            --accent-color: #f59e0b; --accent-dim: rgba(245,158,11,0.15);
            --text-color: #f1f5f9; --text-muted: #94a3b8;
            --border-color: rgba(255,255,255,0.08);
            --glass-bg: rgba(22,34,64,0.85);
            --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --toast-bg: #1a2236; --scrollbar-track: transparent; --scrollbar-thumb: rgba(255,255,255,0.12);
            --skeleton-bg: #1e293b; --skeleton-shine: #2d3a4f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font-sans);
            background: radial-gradient(circle at 10% 0%, rgba(0,122,204,0.08), transparent 40%), var(--bg-color);
            color: var(--text-color); direction: rtl; overflow-x: hidden; padding-bottom: 80px;
            transition: background 0.4s ease, color 0.4s ease; touch-action: pan-y;
            text-align: center;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

        /* ===== Loading / offline ===== */
        .pull-indicator { position: fixed; top: -60px; left: 0; right: 0; height: 60px;
            display: flex; align-items: center; justify-content: center; color: var(--text-muted);
            font-size: 0.8rem; transition: top 0.25s ease; z-index: 50;
            background: var(--surface-elevated); border-bottom: 1px solid var(--border-color);
            pointer-events: none; }
        .pull-indicator.active { top: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-indicator { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            z-index: 3000; display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(8px); }
        .loading-indicator.show { display: flex; }
        .spinner { width: 54px; height: 54px; border: 4px solid rgba(0,122,204,0.2);
            border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        .offline-banner { position: fixed; top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316); color: #000;
            text-align: center; padding: 8px; font-size: 0.8rem; font-weight: 700;
            z-index: 2000; transform: translateY(-100%); transition: transform 0.3s; }
        .offline-banner.show { transform: translateY(0); }

        .skeleton-card { background: var(--surface-elevated); border-radius: 18px; padding: 16px;
            border: 1px solid var(--border-color); position: relative; overflow: hidden; margin-bottom: 12px; }
        .skeleton-card::after { content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .skeleton-row { height: 12px; background: var(--skeleton-bg); border-radius: 6px;
            margin-bottom: 8px; margin-left: auto; margin-right: auto; }
        .skeleton-row.short { width: 40%; } .skeleton-row.medium { width: 60%; } .skeleton-row.long { width: 80%; }

        /* ===== Top bar ===== */
        .top-bar { position: sticky; top: 0; display: flex; flex-direction: column;
            padding: 14px 16px 10px; background: var(--header-bg); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); z-index: 100; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .top-title h2 { font-size: 1.25rem; font-weight: 800;
            background: linear-gradient(90deg, var(--primary-color), #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 8px; justify-content: center; }
        .ai-badge { background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white;
            font-size: 0.6rem; font-weight: 700; padding: 2px 8px;
            border-radius: 10px; -webkit-text-fill-color: white; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--surface-elevated);
            color: var(--text-muted); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-size: 1rem; position: relative; }
        .icon-btn:hover { background: var(--primary-dim); color: var(--primary-color);
            border-color: var(--primary-color); transform: translateY(-2px); }

        /* ===== Search & filters ===== */
        .search-wrap { position: relative; margin-bottom: 10px; }
        .search-input { width: 100%; padding: 12px 44px 12px 16px; border-radius: 14px;
            border: 1px solid var(--border-color); background: var(--surface-elevated);
            color: var(--text-color); font-family: var(--font-sans); font-size: 0.9rem;
            outline: none; transition: all 0.3s; text-align: center; }
        .search-input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-dim); }
        .search-wrap i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: none; justify-content: center; flex-wrap: wrap; }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border-color); background: var(--card-color);
            color: var(--text-muted); font-size: 0.75rem; font-family: var(--font-sans);
            cursor: pointer; white-space: nowrap; transition: all 0.3s; touch-action: manipulation; }
        .filter-chip.active { background: var(--primary-dim); color: var(--primary-color);
            border-color: var(--primary-color); font-weight: 700; }

        /* ===== Stats ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
        @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(5, 1fr); } }
        .stat-card { background: linear-gradient(145deg, var(--surface-elevated), var(--card-color));
            border: 1px solid var(--border-color); border-radius: 16px; padding: 14px;
            position: relative; overflow: hidden; box-shadow: var(--shadow-glow);
            text-align: center; display: flex; flex-direction: column; align-items: center; }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            opacity: 0; transition: opacity 0.3s; }
        .stat-card:hover::before { opacity: 1; }
        .stat-icon { width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem; margin: 0 auto 10px; }
        .stat-icon.blue { background: var(--primary-dim); color: var(--primary-color); }
        .stat-icon.green { background: rgba(16,185,129,0.15); color: var(--success); }
        .stat-icon.orange { background: var(--accent-dim); color: var(--accent-color); }
        .stat-icon.purple { background: rgba(139,92,246,0.15); color: #8b5cf6; }
        .stat-icon.red { background: rgba(239,68,68,0.15); color: var(--error); }
        .stat-value { font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; text-align: center; }
        .stat-label { font-size: 0.72rem; color: var(--text-muted); text-align: center; }

        /* ===== Alerts ===== */
        .alerts-container { padding: 0 16px 16px; }
        .alert-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border-color);
            background: var(--surface-elevated); animation: slideIn 0.4s ease; text-align: right; }
        .alert-item.danger { border-right: 3px solid var(--error); }
        .alert-item.warning { border-right: 3px solid var(--warning); }
        .alert-item.info { border-right: 3px solid var(--primary-color); }
        .alert-icon { width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; flex-shrink: 0; }
        .alert-item.danger .alert-icon { background: rgba(239,68,68,0.15); color: var(--error); }
        .alert-item.warning .alert-icon { background: var(--accent-dim); color: var(--warning); }
        .alert-item.info .alert-icon { background: var(--primary-dim); color: var(--primary-color); }
        .alert-content { flex: 1; min-width: 0; text-align: right; }
        .alert-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
        .alert-desc { font-size: 0.72rem; color: var(--text-muted); overflow-wrap: anywhere; }
        .alert-item .ai-tag { font-size: 0.55rem; background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white; padding: 1px 6px; border-radius: 6px; margin-right: 6px; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* ===== Section title ===== */
        .section-title { display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; margin-bottom: 12px; }
        .section-title h3 { font-size: 0.95rem; font-weight: 700;
            display: flex; align-items: center; gap: 6px; }
        .count-badge { background: var(--primary-dim); color: var(--primary-color);
            padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; }

        /* ===== Cards ===== */
        .cards-container { padding: 0 16px 80px; display: flex; flex-direction: column; gap: 12px; }
        .supply-card { background: var(--surface-elevated); border: 1px solid var(--border-color);
            border-radius: 18px; padding: 14px; position: relative;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 14px rgba(0,0,0,0.05); animation: fadeUp 0.4s ease forwards;
            text-align: center; }
        .supply-card:hover { transform: translateY(-3px); border-color: var(--primary-color);
            box-shadow: var(--shadow-glow); }
        .supply-card.selected { border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-dim), 0 4px 20px rgba(0,122,204,0.15); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start;
            gap: 10px; margin-bottom: 10px; }
        .invoice-chip { display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #dc2626, #991b1b); color: #fff;
            padding: 5px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 800;
            letter-spacing: 0.5px; font-family: 'Courier New', monospace;
            box-shadow: 0 3px 10px rgba(220,38,38,0.3); }
        .card-header-right { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.68rem;
            font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
        .status-badge.pending { background: rgba(217,119,6,0.15); color: var(--warning); border-color: rgba(217,119,6,0.3); }
        .status-badge.in_progress { background: var(--primary-dim); color: var(--primary-color); border-color: rgba(0,122,204,0.3); }
        .status-badge.completed { background: rgba(16,185,129,0.15); color: var(--success); border-color: rgba(16,185,129,0.3); }
        .status-badge.rejected { background: rgba(239,68,68,0.15); color: var(--error); border-color: rgba(239,68,68,0.3); }
        .status-badge.cancelled { background: rgba(100,116,139,0.15); color: var(--text-muted); border-color: rgba(100,116,139,0.3); }

        .payment-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.68rem;
            font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        .payment-badge.cash { background: rgba(16,185,129,0.18); color: #059669;
            border: 1px solid rgba(16,185,129,0.35); }
        .payment-badge.credit { background: rgba(245,158,11,0.18); color: #d97706;
            border: 1px solid rgba(245,158,11,0.35); }

        .supplier-name { font-size: 0.95rem; font-weight: 800; margin-bottom: 4px;
            display: flex; align-items: center; justify-content: center; gap: 6px; }
        .supplier-name i { color: var(--accent-color); }

        .fuel-badge { display: inline-flex; align-items: center; gap: 6px;
            background: var(--fuel-tank); color: #fff; padding: 3px 12px;
            border-radius: 20px; font-size: 0.72rem; font-weight: 700; margin: 4px 0 8px;
            box-shadow: 0 3px 10px rgba(245,158,11,0.3); }

        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
        .metric-box { background: var(--primary-dim); padding: 8px 10px; border-radius: 10px; text-align: center; }
        .metric-box.cash-metric { background: rgba(16,185,129,0.12); }
        .metric-box.credit-metric { background: rgba(245,158,11,0.12); }
        .metric-value { font-size: 0.95rem; font-weight: 800; margin-bottom: 2px;
            color: var(--primary-color); text-align: center; }
        .metric-box.cash-metric .metric-value { color: #059669; }
        .metric-box.credit-metric .metric-value { color: #d97706; }
        .metric-label { font-size: 0.68rem; color: var(--text-muted); text-align: center; }

        .card-info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin: 10px 0; }
        .card-info-item { background: var(--card-color); padding: 6px 8px; border-radius: 8px;
            font-size: 0.7rem; display: flex; justify-content: space-between;
            align-items: center; gap: 4px; }
        .card-info-item .label { color: var(--text-muted); white-space: nowrap; }
        .card-info-item .value { color: var(--text-color); font-weight: 700; direction: ltr; }

        .card-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
        .card-btn { flex: 1; min-width: 70px; padding: 8px 10px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--card-color);
            color: var(--text-muted); font-family: var(--font-sans); font-size: 0.72rem;
            font-weight: 700; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 4px; transition: all 0.3s; touch-action: manipulation; }
        .card-btn:hover { background: var(--primary-dim); color: var(--primary-color);
            border-color: var(--primary-color); }
        .card-btn.success { background: linear-gradient(135deg, var(--success), #059669);
            color: white; border: none; }
        .card-btn.danger:hover { background: rgba(239,68,68,0.15); color: var(--error); border-color: var(--error); }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; display: block; }

        /* ===== FAB ===== */
        .fab { position: fixed; bottom: 90px; left: 20px; width: 58px; height: 58px;
            border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), #6366f1);
            border: none; color: white; font-size: 1.4rem; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,122,204,0.3);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        /* ===== Sidebar / Bottom nav ===== */
        .sidebar-toggle { position: fixed; top: 50%; right: 0; transform: translateY(-50%);
            background: linear-gradient(145deg, var(--primary3-color), #5a1a9a); color: white;
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            border-radius: 50% 0 0 50%; cursor: pointer; z-index: 1001;
            box-shadow: -3px 0 10px rgba(0,0,0,0.4); transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.2); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar { position: fixed; top: 50%; right: -90px; transform: translateY(-50%);
            width: 70px; background: var(--surface-elevated); z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); padding: 8px;
            border-radius: 15px 0 0 15px; overflow-y: auto;
            box-shadow: -5px 0 20px rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); opacity: 0; }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn { background: rgba(75, 0, 130, 0.8); border: 1px solid var(--border-color);
            padding: 8px 4px; border-radius: 10px; color: white; font-weight: bold;
            cursor: pointer; transition: all 0.3s; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px; min-height: 55px;
            text-align: center; font-size: 0.7rem; font-family: var(--font-sans); }
        .sidebar-btn i { font-size: 1rem; } .sidebar-btn span { font-size: 0.62rem; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass-bg);
            backdrop-filter: blur(20px); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0; z-index: 300; }
        .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center;
            gap: 2px; background: none; border: none; color: var(--text-muted);
            font-family: var(--font-sans); font-size: 0.55rem; cursor: pointer;
            transition: all 0.3s; padding: 4px 8px; position: relative; flex: 1; }
        .bottom-nav .nav-item i { font-size: 17px; }
        .bottom-nav .nav-item span { font-weight: 600; }
        .bottom-nav .nav-item.active { color: var(--primary-color); font-weight: 700; }
        .bottom-nav .nav-item.active::after { content: ''; position: absolute; top: -1px;
            left: 50%; transform: translateX(-50%); width: 22px; height: 3px;
            background: var(--primary-color); border-radius: 10px; }

        /* ===== Modals ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px); z-index: 900; display: none;
            align-items: flex-end; justify-content: center; opacity: 0;
            transition: opacity 0.3s; touch-action: none; }
        .modal-overlay.show { display: flex; opacity: 1; touch-action: auto; }
        .modal { background: var(--surface-elevated); border-radius: 24px 24px 0 0;
            width: 100%; max-height: 94vh; overflow-y: auto; padding: 20px 18px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color); border-bottom: none;
            overscroll-behavior: contain; }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color); }
        .modal-title { font-size: 1.05rem; font-weight: 800;
            display: flex; align-items: center; gap: 8px; }
        .modal-close { width: 36px; height: 36px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--card-color);
            color: var(--text-muted); cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: all 0.3s; }
        .modal-close:hover { background: var(--error); color: white; border-color: var(--error); }

        /* ===== Form ===== */
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .form-section-title { grid-column: 1 / -1; font-size: 0.8rem; font-weight: 800;
            color: var(--primary-color); padding: 8px 12px; background: var(--primary-dim);
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; gap: 6px; margin-top: 8px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { color: var(--text-muted); font-size: 0.72rem; font-weight: 600;
            text-align: center; }
        .form-label .req { color: var(--error); }
        .form-input { width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--card-color);
            color: var(--text-color); font-family: var(--font-sans); font-size: 0.85rem;
            outline: none; transition: 0.3s; touch-action: manipulation;
            text-align: center; }
        .form-input:focus { border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-dim); }
        .form-input.readonly { background: var(--primary-dim); color: var(--primary-color);
            font-family: 'Courier New', monospace; font-weight: 800;
            letter-spacing: 0.5px; cursor: not-allowed; text-align: center; }
        /* حقول الفاتورة المميزة: حقل رقم الفاتورة أحمر وأكبر */
        .form-input.invoice-number-field { background: rgba(220,38,38,0.1);
            color: #dc2626; font-weight: 900; font-size: 1rem;
            border: 2px solid rgba(220,38,38,0.4); letter-spacing: 1px;
            cursor: not-allowed; text-align: center; }
        .form-input.calc { background: linear-gradient(135deg, rgba(212,160,23,0.15), rgba(212,160,23,0.08));
            color: var(--accent-color); font-weight: 800;
            direction: ltr; text-align: center; }
        textarea.form-input { resize: vertical; min-height: 60px; text-align: center; }
        select.form-input { text-align: center; }
        select.form-input option { text-align: right; }

        /* ===== Payment notices ===== */
        .payment-notice { grid-column: 1 / -1; padding: 12px 14px; border-radius: 12px;
            font-size: 0.78rem; line-height: 1.6; display: flex; align-items: flex-start;
            gap: 10px; margin-top: 4px; text-align: right; }
        .payment-notice.cash { background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3); color: #065f46; }
        .payment-notice.credit { background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.35); color: #92400e; }
        .payment-notice i { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }

        /* ===== Supplier preview ===== */
        .supplier-preview { grid-column: 1 / -1; padding: 10px 14px; border-radius: 10px;
            background: var(--card-color); border: 1px dashed var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.75rem; margin-top: 4px; }
        .supplier-preview .label { color: var(--text-muted); }
        .supplier-preview .value { font-weight: 800; color: var(--accent-color); direction: ltr; }

        /* ===== Tank preview ===== */
        .tank-preview { grid-column: 1 / -1; padding: 12px 14px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-dim), rgba(212,160,23,0.06));
            border: 1px solid rgba(0,122,204,0.25);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px; margin-top: 4px; }
        .tank-preview-item { text-align: center; padding: 6px; }
        .tank-preview-item .label { display: block; font-size: 0.66rem;
            color: var(--text-muted); margin-bottom: 3px; }
        .tank-preview-item .value { font-weight: 800; color: var(--primary-color);
            font-size: 0.85rem; direction: ltr; }

        /* ===== Action buttons ===== */
        .pos-action-btn { position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; padding: 12px 8px;
            min-height: 70px; border-radius: 12px; border: none; font-weight: 700;
            font-size: 0.78rem; cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
            color: #fff; font-family: var(--font-sans);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 -3px 0 rgba(0,0,0,0.15);
            flex: 1; min-width: 90px; touch-action: manipulation; }
        .pos-action-btn svg { width: 24px; height: 24px; fill: currentColor;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25));
            transition: transform 0.3s ease; }
        .pos-action-btn span { font-size: 0.72rem; font-weight: 800; white-space: nowrap; }
        .pos-action-btn:hover { transform: translateY(-3px); }
        .pos-action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #saveSupplyBtn.pos-action-btn { background: linear-gradient(145deg, #2ecc71, #27ae60, #1e8449); }
        #saveAndPrintBtn.pos-action-btn { background: linear-gradient(145deg, #dc2626, #b91c1c, #991b1b); }
        #printSupplyBtn.pos-action-btn { background: linear-gradient(145deg, #3498db, #2980b9, #1f6391); }
        #approveSupplyBtn.pos-action-btn { background: linear-gradient(145deg, #f39c12, #e67e22, #d35400); }

        .action-buttons-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

        /* ===== Toast ===== */
        .toast { position: fixed; top: 70px; left: 50%;
            transform: translateX(-50%) translateY(-20px); background: var(--toast-bg);
            border: 1px solid var(--border-color); border-radius: 14px;
            padding: 12px 18px; display: flex; align-items: center; gap: 8px;
            z-index: 6000; opacity: 0; transition: all 0.4s; pointer-events: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35); max-width: 90vw;
            font-size: 0.82rem; font-weight: 600; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--error); color: var(--error); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }
        .toast.info { border-color: var(--primary-color); color: var(--primary-color); }

        /* ============================================================
           Invoice styles — تصميم فاتورة التوريد (مستوحى من الصورة)
           ============================================================ */
        #supplyInvoice {
            display: none;
            width: 794px; /* A4 width @ 96dpi */
            min-height: 1123px;
            background: #ffffff;
            color: #0f172a;
            direction: rtl;
            font-family: 'Cairo', 'Noto Sans Arabic', Arial, sans-serif;
            padding: 12mm 10mm 10mm;
            box-sizing: border-box;
        }
        #supplyInvoice * { box-sizing: border-box; }

        #supplyInvoice .inv-header {
            background-color: var(--invoice-navy);
            border-radius: 5mm;
            padding: 6mm 8mm;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            align-items: center;
            gap: 4mm;
            min-height: 40mm;
            position: relative;
            margin-bottom: 7mm;
            overflow: visible;
        }
        #supplyInvoice .inv-logo-circle {
            width: 34mm; height: 34mm;
            background-color: #ffffff;
            border: 1.5mm solid var(--invoice-navy);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: absolute;
            top: 50%; right: -6mm;
            transform: translateY(-50%);
            box-shadow: 0 0 0 1.5mm #ffffff;
            z-index: 10;
        }
        #supplyInvoice .inv-logo-circle img {
            width: 100%; height: 100%; object-fit: contain;
            display: block; border-radius: 50%;
        }
        #supplyInvoice .inv-center {
            grid-column: 2; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2mm; text-align: center;
        }
        #supplyInvoice .inv-title {
            background-color: #ffffff; color: var(--invoice-navy);
            padding: 2.5mm 14mm; border-radius: 5mm;
            font-size: 22px; font-weight: 900; line-height: 1.15;
            white-space: nowrap; display: inline-block;
        }
        #supplyInvoice .inv-subtitle {
            color: #ffffff; font-size: 10px; font-weight: 800;
            letter-spacing: 1px; opacity: 0.95; margin-top: 1mm;
        }
        #supplyInvoice .inv-payment-types {
            display: flex; justify-content: center; align-items: center;
            gap: 8mm; margin-top: 2mm; color: #ffffff;
            font-size: 12px; font-weight: 800;
        }
        #supplyInvoice .inv-payment-types .box {
            display: inline-block; width: 4mm; height: 4mm;
            border: 1.2px solid #ffffff; margin-left: 2mm;
            vertical-align: middle;
        }
        #supplyInvoice .inv-meta {
            grid-column: 3; display: flex; flex-direction: column;
            gap: 2mm; align-self: center;
        }
        #supplyInvoice .inv-meta-pill {
            border: 1.2px solid #ffffff; border-radius: 4mm;
            padding: 1.5mm 3mm; display: flex; align-items: center; gap: 2mm;
            color: #ffffff; font-size: 11px; font-weight: 700;
            background-color: transparent; min-height: 7mm;
        }
        #supplyInvoice .inv-meta-pill .val {
            flex: 1; text-align: center; border-bottom: 1px dotted #ffffff;
            min-height: 1em; padding: 0 2mm;
        }
        #supplyInvoice .inv-meta-pill .inv-no {
            color: #ff5f6d; font-size: 14px; font-weight: 900;
            border-bottom: 1px dotted #ffffff;
        }

        #supplyInvoice .inv-order-text {
            border: 2px solid var(--invoice-navy);
            border-radius: 4mm;
            padding: 4mm 6mm;
            margin-bottom: 5mm;
            color: var(--invoice-navy);
            line-height: 1.7;
            font-size: 13px;
            font-weight: 700;
        }
        #supplyInvoice .inv-order-text .party-line {
            display: flex; align-items: baseline;
            gap: 3mm; margin-bottom: 2mm;
        }
        #supplyInvoice .inv-order-text .party-line .lbl {
            white-space: nowrap; font-weight: 800;
        }
        #supplyInvoice .inv-order-text .party-line .val {
            flex: 1; border-bottom: 1.5px dotted var(--invoice-navy);
            text-align: center; padding: 0 3mm; font-weight: 800;
            color: #000000; min-height: 5mm; font-size: 14px;
        }
        #supplyInvoice .inv-order-text .request-line {
            text-align: center; font-weight: 800;
            color: var(--invoice-navy); font-size: 13px;
        }

        #supplyInvoice .inv-items {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 2px solid var(--invoice-navy);
            border-radius: 4mm;
            overflow: hidden;
            margin-bottom: 4mm;
            table-layout: fixed;
        }
        #supplyInvoice .inv-items th,
        #supplyInvoice .inv-items td {
            border: 1px solid var(--invoice-navy);
            padding: 2.5mm 2mm;
            font-size: 11px;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }
        #supplyInvoice .inv-items th {
            background-color: var(--invoice-navy);
            color: #ffffff;
            font-weight: 900;
            line-height: 1.3;
        }
        #supplyInvoice .inv-items th .en {
            display: block; font-size: 9px; opacity: 0.85;
            margin-top: 1mm; font-weight: 700;
        }
        #supplyInvoice .inv-items td {
            color: #000000; font-weight: 700; min-height: 10mm;
        }
        #supplyInvoice .inv-items tbody tr:nth-child(even) td {
            background: linear-gradient(to bottom, #f8fafc 0%, #f1f5f9 100%);
        }
        #supplyInvoice .inv-items .col-desc  { width: 38%; text-align: right; padding-right: 3mm; }
        #supplyInvoice .inv-items .col-qty   { width: 12%; }
        #supplyInvoice .inv-items .col-dens  { width: 14%; }
        #supplyInvoice .inv-items .col-temp  { width: 12%; }
        #supplyInvoice .inv-items .col-notes { width: 24%; text-align: right; padding-right: 3mm; }

        #supplyInvoice .inv-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5mm;
            margin: 4mm 0 5mm;
        }
        #supplyInvoice .inv-summary-card {
            border: 1.2px solid var(--invoice-navy);
            border-radius: 3mm;
            overflow: hidden;
            background: #ffffff;
            text-align: center;
        }
        #supplyInvoice .inv-summary-card .lbl {
            background: var(--invoice-navy);
            color: #ffffff;
            padding: 2mm 1mm;
            font-size: 10px;
            font-weight: 900;
        }
        #supplyInvoice .inv-summary-card .val {
            padding: 2.5mm 1mm;
            font-size: 12px;
            font-weight: 800;
            color: #000000;
            direction: ltr;
        }
        #supplyInvoice .inv-summary-card.grand .val {
            background: linear-gradient(135deg, #fef9c3, #fde68a);
            color: #7c2d12;
            font-size: 14px;
            font-weight: 900;
        }

        #supplyInvoice .inv-footer-signatures {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6mm;
            margin-top: 12mm;
            page-break-inside: avoid;
        }
        #supplyInvoice .inv-footer-signatures .signature-block {
            text-align: center;
        }
        #supplyInvoice .inv-footer-signatures .signature-block .lbl {
            font-size: 12px;
            font-weight: 900;
            color: var(--invoice-navy);
            margin-bottom: 12mm;
        }
        #supplyInvoice .inv-footer-signatures .signature-block .line {
            border-bottom: 1.5px dotted var(--invoice-navy);
            height: 4mm;
        }
        #supplyInvoice .inv-received-note {
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--invoice-navy);
            margin-top: 8mm;
            padding: 3mm;
            border-top: 1.5px dashed var(--invoice-navy);
            border-bottom: 1.5px dashed var(--invoice-navy);
        }

        /* ============================================================
           Dark theme overrides
           ============================================================ */
        [data-theme="dark"] .supply-card,
        [data-theme="dark"] .stat-card,
        [data-theme="dark"] .modal,
        [data-theme="dark"] .skeleton-card,
        [data-theme="dark"] .alert-item { border-color: #3d5a80 !important; }
        [data-theme="dark"] .payment-notice.cash { color: #6ee7b7; }
        [data-theme="dark"] .payment-notice.credit { color: #fcd34d; }

        /* ============================================================
           Responsive
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { gap: 8px; padding: 12px; }
            .stat-card { padding: 11px; }
            .stat-value { font-size: 1.1rem; }
            .cards-container { padding: 0 12px 80px; }
            .form-grid { gap: 8px; }
            .form-label { font-size: 11px; }
            .form-input { font-size: 12px; padding: 9px 8px; }
        }
        @media (max-width: 420px) {
            .form-grid { gap: 6px; }
            .form-label { font-size: 10px; }
            .form-input { font-size: 11px; padding: 8px 6px; }
            .top-title h2 { font-size: 1rem; }
            .icon-btn { width: 36px; height: 36px; }
            .card-info-grid { grid-template-columns: 1fr; }
        }

        /* Print styles */
        body.invoice-print-mode > * { visibility: hidden !important; }
        body.invoice-print-mode #supplyInvoice,
        body.invoice-print-mode #supplyInvoice * { visibility: visible !important; }
        body.invoice-print-mode #supplyInvoice {
            display: block !important;
            position: absolute !important;
            inset: 0 !important;
            margin: 0 !important;
            width: 210mm !important;
            min-height: 297mm !important;
            box-shadow: none !important;
        }
        @page { size: A4; margin: 0; }
    </style>

        <div class="form-grid">
            <div class="form-group"><label class="form-label">من تاريخ</label><input class="form-input" type="date" id="reportFrom"></div>
            <div class="form-group"><label class="form-label">إلى تاريخ</label><input class="form-input" type="date" id="reportTo"></div>
            <div class="form-group"><label class="form-label">طريقة الدفع</label>
                <select class="form-input" id="reportPaymentMethod">
                    <option value="">الكل</option>
                    <option value="cash">نقد فقط</option>
                    <option value="credit">آجل فقط</option>
                </select>
            </div>
            <div class="form-group"><label class="form-label">المورد</label>
                <select class="form-input" id="reportSupplier"><option value="">كل الموردين</option></select>
            </div>
        </div>
        <div class="action-buttons-row">
            <button class="card-btn success" onclick="generateReport()"><i class="fas fa-cog"></i> توليد</button>
            <button class="card-btn" onclick="exportCSV()"><i class="fas fa-file-csv"></i> CSV</button>
        </div>
        <div id="reportResults" style="margin-top:14px;"></div>
    </div>
</div>

<div class="modal-overlay" id="aiModal" onclick="closeModal(event,'aiModal')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-robot" style="color:#8b5cf6;"></i> المستشار الذكي</h3>
            <button type="button" class="modal-close" onclick="closeModal(null,'aiModal')"><i class="fas fa-times"></i></button>
        </div>
        <div id="aiContent"></div>
    </div>
</div>

<div class="toast" id="toast">
    <i class="fas fa-check-circle" id="toastIcon"></i>
    <span id="toastMessage"></span>
</div>

<!-- حاوية الفاتورة للطباعة -->
<section id="supplyInvoice" aria-label="فاتورة توريد وقود"></section>

<script>
(() => {
    'use strict';

    const STATUS_LABELS = {
        'pending': { label: 'قيد الانتظار', class: 'pending', icon: 'fa-clock' },
        'in_progress': { label: 'جاري التفريغ', class: 'in_progress', icon: 'fa-spinner' },
        'completed': { label: 'مكتمل', class: 'completed', icon: 'fa-circle-check' },
        'rejected': { label: 'مرفوض', class: 'rejected', icon: 'fa-circle-xmark' },
        'cancelled': { label: 'ملغى', class: 'cancelled', icon: 'fa-ban' }
    };
    const LAB_LABELS = { 'pending': '⏳ في الانتظار', 'passed': '✅ مقبول', 'failed': '❌ مرفوض', 'warning': '⚠️ تحذير' };

    const state = {
        rows: [], filtered: [], editing: null, editingId: 0, filter: 'all', loadedAt: null,
        lookups: { suppliers: [], tanks: [], fuelTypes: [], currencies: [], cashBoxes: [] },
        aiInsights: [], nextRefillCode: '',
        supplierBalances: {},
        currentUserName: '',
        lastSavedRow: null
    };

    const $ = (id) => document.getElementById(id);
    const bridge = window.AndroidInterface;
    const esc = (v) => String(v == null ? '—' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const fmt = (v, dec=2) => num(v).toLocaleString('ar-EG', {minimumFractionDigits: dec, maximumFractionDigits: dec});
    const fmtShort = (v) => {
        const n = num(v);
        if (n >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M';
        if (n >= 1000) return (n/1000).toFixed(1) + 'K';
        return n.toLocaleString('en');
    };
    const today = () => {
        const d = new Date(); const pad = n => String(n).padStart(2,'0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    };
    const nowLocal = () => {
        const d = new Date(); const pad = n => String(n).padStart(2,'0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };
    const nowReadable = () => {
        try {
            return new Intl.DateTimeFormat('ar-EG', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hour12: false
            }).format(new Date());
        } catch (_) {
            const d = new Date(); const pad = n => String(n).padStart(2,'0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }
    };

    function toast(message, kind='info', ms=3800) {
        const node = $('toast'); const icon = $('toastIcon'); const msg = $('toastMessage');
        msg.textContent = message; node.className = `toast show ${kind}`;
        icon.className = `fas ${kind === 'success' ? 'fa-check-circle' : kind === 'error' ? 'fa-times-circle' : kind === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`;
        clearTimeout(node._timer); node._timer = setTimeout(() => node.classList.remove('show'), ms);
    }
    function setLoading(on) { $('loadingIndicator').classList.toggle('show', Boolean(on)); }
    function parse(raw) {
        if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
        const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (v && v.success === false) throw new Error(v.error || v.message || 'فشلت العملية');
        return v;
    }
    function dataOf(v) { return v && Object.prototype.hasOwnProperty.call(v,'data') ? v.data : v; }
    function invoke(method, args=[]) {
        if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error(`العقد ${method} غير متاح`));
        try { return Promise.resolve(parse(bridge[method](...args))); }
        catch (e) { return Promise.reject(e); }
    }
    function rowsFrom(v) {
        const raw = dataOf(v);
        if (Array.isArray(raw)) return raw;
        if (raw && Array.isArray(raw.rows)) return raw.rows;
        if (raw && Array.isArray(raw.data)) return raw.data;
        if (raw && typeof raw === 'object') return [raw];
        return [];
    }
    function field(row, names) {
        for (const n of (names || [])) {
            if (row && row[n] !== undefined && row[n] !== null && row[n] !== '') return row[n];
        }
        return '';
    }

    function getPaymentMethod(row) {
        let method = '';
        try {
            if (row.extra_data) {
                const extra = typeof row.extra_data === 'string' ? JSON.parse(row.extra_data) : row.extra_data;
                method = String(extra.payment_method || '').toLowerCase();
            }
        } catch (_) {}
        if (!method) method = String(row.payment_method || '').toLowerCase();
        return method === 'credit' ? 'credit' : 'cash';
    }
    function getCashBoxId(row) {
        try {
            if (row.extra_data) {
                const extra = typeof row.extra_data === 'string' ? JSON.parse(row.extra_data) : row.extra_data;
                const id = Number(extra.cash_box_id || 0);
                if (id > 0) return id;
            }
        } catch (_) {}
        return Number(row.cash_box_id || 0);
    }

    // ============ Theme ============
    function applyTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        const icon = $('themeIcon');
        if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); $('themeIcon').className = 'fas fa-moon'; }
        else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); $('themeIcon').className = 'fas fa-sun'; }
    }

    // ============ Lookups ============
    async function loadLookups() {
        const tasks = [
            (bridge && typeof bridge.getSuppliers === 'function') ? invoke('getSuppliers',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getTanks === 'function') ? invoke('getTanks',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getFuelTypes === 'function') ? invoke('getFuelTypes',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getCurrencies === 'function') ? invoke('getCurrencies',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getNextRefillCode === 'function') ? invoke('getNextRefillCode',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getActiveCashBoxes === 'function') ? invoke('getActiveCashBoxes',[]) : Promise.resolve(null),
            (bridge && typeof bridge.getCurrentUser === 'function') ? invoke('getCurrentUser',[]) : Promise.resolve(null)
        ];
        const [sup, tanks, fuels, curr, nextCode, cashBoxes, user] = await Promise.all(tasks.map(p => p.catch(() => null)));
        state.lookups.suppliers = rowsFrom(sup);
        state.lookups.tanks = rowsFrom(tanks);
        state.lookups.fuelTypes = rowsFrom(fuels);
        state.lookups.currencies = rowsFrom(curr);
        state.lookups.cashBoxes = rowsFrom(cashBoxes);
        const nc = dataOf(nextCode);
        state.nextRefillCode = (nc && nc.refill_code) ? nc.refill_code : '';
        const u = dataOf(user);
        if (u) {
            state.currentUserName = u.full_name_ar || u.full_name || u.display_name || u.username || '';
        }
    }

    async function loadSupplierBalance(supplierId) {
        if (!supplierId || Number(supplierId) <= 0) return null;
        if (state.supplierBalances[supplierId] !== undefined) return state.supplierBalances[supplierId];
        try {
            const r = await invoke('getSupplierOutstandingBalance', [Number(supplierId)]);
            const d = dataOf(r) || {};
            state.supplierBalances[supplierId] = Number(d.current_balance || 0);
            return state.supplierBalances[supplierId];
        } catch (_) { return null; }
    }

    // ============ Load Data ============
    function renderSkeleton() {
        $('cardsContainer').innerHTML = Array.from({length: 4}).map(() => `
            <div class="skeleton-card"><div class="skeleton-row long"></div><div class="skeleton-row medium"></div><div class="skeleton-row short"></div></div>
        `).join('');
    }

    async function reloadData() {
        if (!bridge || typeof bridge.getTankRefillRecords !== 'function') {
            $('offlineBanner').classList.add('show'); renderSkeleton(); setTimeout(renderCards, 400); return;
        }
        setLoading(true);
        try {
            const params = { limit: 300, offset: 0, search: ($('searchInput').value || '').trim() };
            if (state.filter === 'pending' || state.filter === 'completed') params.status = state.filter;
            const result = await invoke('getTankRefillRecords', [JSON.stringify(params)]);
            state.rows = rowsFrom(result);
            state.loadedAt = new Date();
            $('offlineBanner').classList.remove('show');
            applyFilter();
        } catch (e) {
            state.rows = []; state.loadedAt = new Date(); renderCards(); toast(e.message || 'فشل التحميل', 'error');
        } finally { setLoading(false); }
    }

    function handleSearch() { clearTimeout(window._searchTimer); window._searchTimer = setTimeout(applyFilter, 250); }
    function setFilter(filter, btn) {
        state.filter = filter;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        if (btn) btn.classList.add('active');
        applyFilter();
    }
    function applyFilter() {
        const q = ($('searchInput').value || '').trim().toLowerCase();
        state.filtered = state.rows.filter(row => {
            if (state.filter === 'cash' || state.filter === 'credit') {
                if (getPaymentMethod(row) !== state.filter) return false;
            } else if (state.filter !== 'all') {
                if (String(row.status || '') !== state.filter) return false;
            }
            if (!q) return true;
            return JSON.stringify(row || {}).toLowerCase().includes(q);
        });
        renderStats(); renderCards();
    }

    function renderStats() {
        const rows = state.filtered;
        $('statTotal').textContent = rows.length.toLocaleString('ar-EG');
        $('supplyCount').textContent = rows.length.toLocaleString('ar-EG');

        let cashTotal = 0, creditTotal = 0, litersTotal = 0;
        rows.forEach(r => {
            const net = num(field(r, ['net_amount','total_amount']));
            const liters = num(field(r, ['actual_quantity','delivered_quantity']));
            litersTotal += liters;
            if (getPaymentMethod(r) === 'credit') creditTotal += net; else cashTotal += net;
        });
        $('statCash').textContent = cashTotal ? fmtShort(cashTotal) : '0';
        $('statCredit').textContent = creditTotal ? fmtShort(creditTotal) : '0';
        $('statLiters').textContent = litersTotal ? fmtShort(litersTotal) : '0';
        $('statSupplierDebt').textContent = creditTotal ? fmtShort(creditTotal) : '0';
    }

    function statusBadge(status) {
        const key = String(status || 'pending').toLowerCase();
        const info = STATUS_LABELS[key] || STATUS_LABELS.pending;
        return `<span class="status-badge ${info.class}"><i class="fas ${info.icon}"></i> ${info.label}</span>`;
    }
    function paymentBadge(method) {
        if (method === 'credit') return `<span class="payment-badge credit"><i class="fas fa-file-invoice-dollar"></i> آجل</span>`;
        return `<span class="payment-badge cash"><i class="fas fa-money-bill-wave"></i> نقد</span>`;
    }
    function qualityBadge(result) {
        const key = String(result || 'pending').toLowerCase();
        const map = {
            'pending': { bg: 'rgba(217,119,6,0.15)', color: '#d97706', label: 'فحص معلق', icon: 'fa-flask' },
            'passed': { bg: 'rgba(16,185,129,0.15)', color: '#10b981', label: 'مقبول', icon: 'fa-circle-check' },
            'failed': { bg: 'rgba(239,68,68,0.15)', color: '#ef4444', label: 'مرفوض', icon: 'fa-circle-xmark' },
            'warning': { bg: 'rgba(217,119,6,0.15)', color: '#d97706', label: 'تحذير', icon: 'fa-triangle-exclamation' }
        };
        const info = map[key] || map.pending;
        return `<span style="background:${info.bg};color:${info.color};padding:3px 10px;border-radius:10px;font-size:0.66rem;font-weight:700;display:inline-flex;align-items:center;gap:4px;"><i class="fas ${info.icon}"></i> ${info.label}</span>`;
    }

    function renderCards() {
        const box = $('cardsContainer');
        if (!state.filtered.length) {
            box.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p style="font-weight:700;">لا توجد فواتير مطابقة</p><p style="font-size:0.78rem;">اضغط <strong>+</strong> لإضافة فاتورة توريد.</p></div>`;
            return;
        }

        box.innerHTML = state.filtered.map((row, idx) => {
            const id = esc(field(row, ['id']) || idx);
            const refCode = field(row, ['refill_code']) || '—';
            const supplier = field(row, ['supplier_name','supplier_id']) || '—';
            const tankName = field(row, ['tank_name','tank_id']) || '—';
            const fuelName = field(row, ['fuel_name_ar','fuel_name','fuel_type_id']) || '—';
            const delivered = num(field(row, ['delivered_quantity']));
            const actual = num(field(row, ['actual_quantity'])) || delivered;
            const netAmount = num(field(row, ['net_amount','total_amount']));
            const tankerNumber = field(row, ['tanker_number']) || '—';
            const tankerDriver = field(row, ['tanker_driver']) || '—';
            const orderDate = String(field(row, ['order_date','arrival_date','created_at']) || '—').slice(0, 10);
            const status = field(row, ['status']) || 'pending';
            const labResult = field(row, ['lab_test_result']) || 'pending';
            const paymentMethod = getPaymentMethod(row);

            return `
                <article class="supply-card" data-id="${id}" onclick="selectCard(this, ${id})" style="animation-delay:${idx * 0.03}s;">
                    <div class="card-header">
                        <div style="text-align:right;flex:1;min-width:0;">
                            <div class="invoice-chip"><i class="fas fa-file-invoice"></i> ${esc(refCode)}</div>
                        </div>
                        <div class="card-header-right">
                            ${paymentBadge(paymentMethod)}
                            ${statusBadge(status)}
                        </div>
                    </div>
                    <div class="supplier-name"><i class="fas fa-user-tie"></i> ${esc(supplier)}</div>
                    <div class="fuel-badge"><i class="fas fa-gas-pump"></i> ${esc(fuelName)}</div>

                    <div class="metrics-grid">
                        <div class="metric-box"><div class="metric-value">${fmtShort(delivered)} ل</div><div class="metric-label">الكمية الموردة</div></div>
                        <div class="metric-box ${paymentMethod === 'credit' ? 'credit-metric' : 'cash-metric'}">
                            <div class="metric-value">${fmtShort(netAmount)}</div>
                            <div class="metric-label">${paymentMethod === 'credit' ? 'قيمة آجلة' : 'قيمة نقدية'}</div>
                        </div>
                    </div>

                    <div class="card-info-grid">
                        <div class="card-info-item"><span class="label"><i class="fas fa-database"></i> الخزان</span><span class="value">${esc(tankName)}</span></div>
                        <div class="card-info-item"><span class="label"><i class="fas fa-truck"></i> الصهريج</span><span class="value">${esc(tankerNumber)}</span></div>
                        <div class="card-info-item"><span class="label"><i class="fas fa-user"></i> السائق</span><span class="value">${esc(tankerDriver)}</span></div>
                        <div class="card-info-item"><span class="label"><i class="fas fa-calendar"></i> التاريخ</span><span class="value">${esc(orderDate)}</span></div>
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px;">
                        <span style="font-size:0.7rem;color:var(--text-muted);"><i class="fas fa-vial"></i> حالة الجودة</span>
                        ${qualityBadge(labResult)}
                    </div>

                    <div class="card-actions" onclick="event.stopPropagation();">
                        <button class="card-btn" type="button" onclick="viewDetails(${id})"><i class="fas fa-eye"></i> تفاصيل</button>
                        <button class="card-btn" type="button" onclick="editSupply(${id})"><i class="fas fa-edit"></i> تعديل</button>
                        <button class="card-btn" type="button" onclick="viewInvoice(${id})"><i class="fas fa-file-invoice"></i> فاتورة</button>
                        ${status !== 'completed' ? `<button class="card-btn success" type="button" onclick="approveSupply(${id})"><i class="fas fa-check"></i> اعتماد</button>` : ''}
                        <button class="card-btn danger" type="button" onclick="deleteSupply(${id})"><i class="fas fa-trash"></i></button>
                    </div>
                </article>
            `;
        }).join('');
    }

    function selectCard(card, id) {
        document.querySelectorAll('.supply-card').forEach(c => c.classList.remove('selected'));
        if (card) card.classList.add('selected');
        state.selectedId = id;
    }

    // ============================================================
    // FORM
    // ============================================================
    function selectOptions(items, valueKey, labelKey, placeholder='اختر...') {
        return `<option value="">${placeholder}</option>` + items.map(item => {
            const value = field(item, [valueKey]);
            const label = field(item, [labelKey]) || value;
            return `<option value="${esc(value)}">${esc(label)}</option>`;
        }).join('');
    }

    function buildFormHtml(row) {
        const get = (k) => row ? field(row, [k]) : '';
        const refCode = get('refill_code') || state.nextRefillCode || '— سيتم التوليد آلياً —';
        const paymentMethod = row ? getPaymentMethod(row) : 'cash';
        const cashBoxId = row ? getCashBoxId(row) : '';
        // تاريخ ووقت الطلب يُدخلان آلياً عند الإنشاء
        const orderDateTime = row ? (get('arrival_date') || nowLocal()) : nowLocal();
        const defaultStatus = row ? (get('status') || 'completed') : 'completed';

        return `
            <!-- ===== رقم الفاتورة والطلب ===== -->
            <div class="form-section-title"><i class="fas fa-file-invoice"></i> بيانات الفاتورة الأساسية</div>
            <div class="form-group">
                <label class="form-label">رقم فاتورة التوريد (آلي) <span class="req">*</span></label>
                <input class="form-input invoice-number-field" type="text" data-key="refill_code" value="${esc(refCode)}" readonly tabindex="-1">
            </div>
            <div class="form-group">
                <label class="form-label">رقم فاتورة المورد</label>
                <input class="form-input" type="text" data-key="invoice_number" value="${esc(get('invoice_number'))}" placeholder="رقم فاتورة المورد">
            </div>
            <div class="form-group">
                <label class="form-label">تاريخ ووقت الطلب (تلقائي) <span class="req">*</span></label>
                <input class="form-input readonly" type="datetime-local" data-key="arrival_date" value="${esc(orderDateTime)}" readonly tabindex="-1">
            </div>
            <div class="form-group">
                <label class="form-label">الحالة <span class="req">*</span></label>
                <select class="form-input" data-key="status" required>
                    ${Object.entries(STATUS_LABELS).map(([k,v]) => `<option value="${k}" ${defaultStatus === k ? 'selected' : ''}>${v.label}</option>`).join('')}
                </select>
            </div>

            <!-- ===== المورد ===== -->
            <div class="form-section-title"><i class="fas fa-user-tie"></i> بيانات المورد</div>
            <div class="form-group full">
                <label class="form-label">اسم المورد <span class="req">*</span></label>
                <select class="form-input" data-key="supplier_id" id="supplierSelect" required>
                    ${selectOptions(state.lookups.suppliers, 'id', 'commercial_name_ar', 'اختر المورد...')}
                </select>
            </div>
            <div class="supplier-preview" id="supplierBalancePreview" style="display:none;">
                <span class="label"><i class="fas fa-wallet"></i> رصيد المورد الحالي (مديونية قائمة):</span>
                <span class="value" id="supplierBalanceValue">—</span>
            </div>
            <div class="form-group">
                <label class="form-label">رقم الصهريج</label>
                <input class="form-input" type="text" data-key="tanker_number" value="${esc(get('tanker_number'))}" placeholder="رقم لوحة الصهريج">
            </div>
            <div class="form-group">
                <label class="form-label">اسم السائق</label>
                <input class="form-input" type="text" data-key="tanker_driver" value="${esc(get('tanker_driver'))}" placeholder="اسم السائق">
            </div>
            <div class="form-group">
                <label class="form-label">هاتف السائق</label>
                <input class="form-input" type="tel" data-key="tanker_driver_phone" value="${esc(get('tanker_driver_phone'))}" placeholder="7XXXXXXXX" dir="ltr">
            </div>
            <div class="form-group">
                <label class="form-label">رقم الرصاص</label>
                <input class="form-input" type="text" data-key="seal_number" value="${esc(get('seal_number'))}" placeholder="رقم الرصاص">
            </div>

            <!-- ===== الخزان ونوع الوقود ===== -->
            <div class="form-section-title"><i class="fas fa-database"></i> الخزان ونوع الوقود</div>
            <div class="form-group">
                <label class="form-label">الخزان <span class="req">*</span></label>
                <select class="form-input" data-key="tank_id" id="tankSelect" required>
                    ${selectOptions(state.lookups.tanks, 'tank_id', 'tank_name', 'اختر الخزان...')}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">نوع الوقود <span class="req">*</span></label>
                <select class="form-input" data-key="fuel_type_id" id="fuelTypeSelect" required>
