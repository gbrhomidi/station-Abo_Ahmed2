<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة محطات الوقود – أنواع الأطراف</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <script src="file:///android_asset/assets-local/js/sweetalert2@11"></script>
    <script src="file:///android_asset/assets-local/js/jspdf.umd.min.js"></script>
    <style>
/* ============================================================
   نظام الألوان — وضع فاتح افتراضي + وضع مظلم مخفف
   إطار فضي رفيع (1px) على جميع البطاقات والحقول
   ============================================================ */
:root {
    /* ═══ الوضع الفاتح (افتراضي) ═══ */
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;

    /* إطار فضي رفيع موحّد */
    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

    --emerald-primary: #059669;
    --emerald-dark: #047857;
    --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

    --success: #059669;
    --danger: #dc2626;
    --warning: #d97706;
    --info: #2563eb;
    --purple: #7c3aed;

    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;

    color-scheme: light;

    /* ═══ Aliases متوافقة مع الأنماط القديمة ═══ */
    --bg-color: var(--bg-primary);
    --surface-color: var(--bg-glass);
    --surface-elevated: var(--bg-secondary);
    --primary-color: var(--gold-primary);
    --primary-dim: rgba(200, 154, 18, 0.12);
    --accent-color: var(--gold-primary);
    --accent-dim: rgba(200, 154, 18, 0.12);
    --text-color: var(--text-primary);
    --border-style: solid;
    --border-width: 1px;
    --glass-bg: var(--bg-card);
    --card-hover-bg: var(--bg-glass-light);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--gold-primary);
    --modal-border-color: var(--silver-border-color);
    --modal-border-style: solid;
    --input-bg: var(--bg-glass);
    --input-border: var(--silver-border-color);
    --input-border-style: solid;
    --data-text-color: var(--text-primary);
    --data-text-muted: var(--text-secondary);
    --skeleton-bg: rgba(0, 0, 0, 0.05);
    --skeleton-shine: rgba(0, 0, 0, 0.08);
    --fab-shadow: rgba(200, 154, 18, 0.3);
}

/* ═══ الوضع المظلم المخفّف ═══ */
[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);

    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

    --emerald-primary: #10b981;
    --emerald-dark: #059669;
    --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --purple: #9b59b6;

    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;

    color-scheme: dark;

    --skeleton-bg: rgba(255, 255, 255, 0.05);
    --skeleton-shine: rgba(255, 255, 255, 0.08);
    --fab-shadow: rgba(245, 200, 66, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 0 0 90px 0;
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: pan-y;
}
[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

/* ============================================================
   Pull-to-Refresh Indicator
   ============================================================ */
.pull-indicator {
    position: fixed;
    top: -60px;
    left: 0;
    right: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    transition: top 0.2s ease;
    z-index: 50;
    background: var(--bg-secondary);
    border-bottom: var(--silver-border);
    box-shadow: var(--silver-shadow);
    pointer-events: none;
    font-weight: 700;
}
.pull-indicator.active { top: 0; }
.pull-indicator i { margin-left: 8px; transition: transform 0.3s; color: var(--gold-primary); }

/* ============================================================
   Loading
   ============================================================ */
.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
[data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
.loading-indicator.show, .loading-indicator[style*="display: flex"] { display: flex !important; }
.spinner {
    width: 56px;
    height: 56px;
    border: 4px solid rgba(200, 154, 18, 0.15);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   Skeleton
   ============================================================ */
.skeleton-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 24px 16px;
}
.skeleton-card {
    background: var(--bg-card) !important;
    border: var(--silver-border-strong) !important;
    border-radius: var(--radius-card) !important;
    padding: 16px;
    box-shadow: var(--silver-shadow);
    position: relative;
    overflow: hidden;
}
.skeleton-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, var(--skeleton-shine) 50%, transparent 100%);
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
.skeleton-row {
    height: 12px;
    background: var(--skeleton-bg);
    border-radius: 6px;
    margin-bottom: 8px;
}
.skeleton-row.short { width: 40%; }
.skeleton-row.medium { width: 60%; }
.skeleton-row.long { width: 80%; }

/* ============================================================
   Offline Banner
   ============================================================ */
.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning), var(--gold-primary));
    color: #ffffff;
    text-align: center;
    padding: 8px;
    font-size: 0.8rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
    border-bottom: var(--silver-border-strong);
    box-shadow: var(--silver-shadow);
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky;
    top: 0;
    z-index: 120;
    background: var(--header-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: var(--silver-border);
    padding: 14px 22px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    transition: var(--transition);
}
.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}
.top-title h2 {
    font-size: 1.45rem;
    font-weight: 900;
    margin: 0;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.top-title h2 i {
    -webkit-text-fill-color: initial;
    color: var(--gold-primary);
}
.header-actions { display: flex; gap: 10px; align-items: center; }

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
    font-size: 1rem;
    position: relative;
    box-shadow: var(--silver-shadow);
}
.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    transform: translateY(-2px);
    box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn.has-badge::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--danger);
    animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
}

/* البحث */
.search-wrap { position: relative; }
.search-input {
    width: 100%;
    padding: 12px 44px 12px 16px;
    border-radius: 12px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
    text-align: center;
}
.search-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
.search-input::placeholder { color: var(--text-muted); }
.search-wrap i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.9rem;
    pointer-events: none;
}

/* شرائح الفلتر */
.filter-chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0;
    scrollbar-width: none;
    justify-content: center;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 8px 16px;
    border-radius: 999px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.filter-chip i { font-size: 0.75rem; }
.filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.filter-chip.active {
    background: var(--gold-primary);
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
}

/* ============================================================
   بطاقات الإحصائيات - مع توسيط كامل
   ============================================================ */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 20px 24px;
}
.stat-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 18px 16px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}
.stat-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
}
.stat-card:active { transform: scale(0.97); }
.stat-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    margin-bottom: 10px;
    border: var(--silver-border);
}
.stat-icon.blue { color: var(--info); background: rgba(37, 99, 235, 0.1); }
.stat-icon.green { color: var(--emerald-primary); background: rgba(5, 150, 105, 0.1); }
.stat-icon.orange { color: var(--warning); background: rgba(217, 119, 6, 0.1); }
.stat-icon.red { color: var(--danger); background: rgba(220, 38, 38, 0.1); }
.stat-icon.purple { color: var(--purple); background: rgba(124, 58, 237, 0.1); }
.stat-value {
    font-size: 1.75rem;
    font-weight: 900;
    font-family: 'Inter', 'Arial', sans-serif;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--text-primary);
    margin: 4px 0 2px;
    direction: ltr;
    text-align: center;
}
.stat-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 700;
    text-align: center;
}
.stat-trend {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 6px;
    border: var(--silver-border);
}
.stat-trend.up { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.stat-trend.down { background: rgba(220, 38, 38, 0.1); color: var(--danger); }

@media (max-width: 992px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
    .stat-card { padding: 12px 10px; }
    .stat-value { font-size: 1.15rem; }
    .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
}

/* ============================================================
   عنوان القسم
   ============================================================ */
.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 12px !important;
}
.section-title h3 {
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
}
.count-badge {
    background: var(--gold-primary) !important;
    color: #ffffff !important;
    padding: 3px 12px !important;
    border-radius: 30px !important;
    font-size: 0.75rem !important;
    font-weight: 900 !important;
    border: var(--silver-border);
}

/* ============================================================
   بطاقات أنواع الأطراف
   ============================================================ */
.cards-container {
    padding: 0 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    touch-action: pan-y;
}

.party-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px 18px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
    touch-action: pan-y;
    text-align: center;
}
.party-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px;
    height: 100%;
    background: var(--gold-primary);
    opacity: 0.7;
    transition: var(--transition);
}
.party-card:hover {
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 8px 28px rgba(200, 154, 18, 0.12);
    transform: translateY(-2px);
}
.party-card:hover::before { opacity: 1; width: 6px; }
.party-card.selected {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 2px rgba(200, 154, 18, 0.25), var(--silver-shadow), var(--shadow-card);
}
.party-card.selected::before { background: var(--gold-dark); opacity: 1; }
.party-card:active { transform: scale(0.98); transition-duration: 0.05s; }

.party-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 10px;
}
.party-card .card-header .card-avatar {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    font-weight: 800;
    color: #ffffff;
    flex-shrink: 0;
    border: var(--silver-border);
    box-shadow: var(--silver-shadow);
}
.party-card .card-header .card-status {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.62rem;
    font-weight: 700;
    border: var(--silver-border);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}
.card-status.active { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.card-status.inactive { background: rgba(107, 114, 128, 0.1); color: var(--text-muted); }

.party-card .card-name {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 4px;
    color: var(--text-primary);
    text-align: center;
}
.party-card .card-code {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-family: 'Inter', 'Arial', sans-serif;
    direction: ltr;
    text-align: center;
    font-weight: 700;
}
.party-card .card-description {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin: 8px 0 12px;
    padding: 10px;
    background: var(--bg-glass);
    border-radius: 10px;
    border: var(--silver-border);
    border-right: 3px solid var(--gold-primary);
    text-align: center;
    line-height: 1.6;
}
.party-card .card-body {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
}
.party-card .card-body .metric-box {
    background: var(--bg-glass);
    padding: 10px 8px;
    border-radius: 10px;
    border: var(--silver-border);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    box-shadow: var(--silver-shadow);
}
.party-card .card-body .metric-box .metric-value {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text-primary);
    text-align: center;
    direction: ltr;
}
.party-card .card-body .metric-box .metric-label {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-align: center;
    font-weight: 700;
}
.party-card .card-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
}
.party-card .card-actions .card-btn {
    flex: 1;
    min-width: 80px;
    padding: 9px 8px;
    border-radius: 10px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    box-shadow: var(--silver-shadow);
}
.party-card .card-actions .card-btn:active { transform: scale(0.95); }
.party-card .card-actions .card-btn:hover {

    background: var(--bg-glass-light);
    transform: translateY(-2px);
}
.party-card .card-actions .card-btn.danger:hover {

}

.empty-state {

}

/* ============================================================
   الزر العائم FAB
   ============================================================ */
.fab {
    position: fixed;
    bottom: 90px;
    left: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    border: var(--silver-border-strong);
    color: #ffffff;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: var(--silver-shadow), 0 6px 24px rgba(200, 154, 18, 0.35);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
}
.fab:active { transform: scale(0.9); }
.fab:hover {
    transform: scale(1.1) rotate(90deg);
    box-shadow: var(--silver-shadow), 0 10px 36px rgba(200, 154, 18, 0.45);
}

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary);
    color: #ffffff;
    width: 40px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer;
    z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: var(--transition);
    border: var(--silver-border);
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
.sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
.sidebar {
    position: fixed;
    top: 50%;
    right: -140px;
    transform: translateY(-50%);
    width: 110px;
    background: var(--sidebar-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 999;
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    padding: 12px 10px;
    border-radius: 18px 0 0 18px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    border: var(--silver-border);
    opacity: 0;
}
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 8px; }
.sidebar-btn {
    background: var(--bg-glass);
    border: var(--silver-border);
    padding: 12px 6px;
    border-radius: 12px;
    color: var(--text-secondary);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 72px;
    text-align: center;
    font-size: 0.85rem;
    font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.sidebar-btn:active { transform: scale(0.92); }
.sidebar-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    transform: scale(1.05);
}
.sidebar-btn i { font-size: 1.5rem; color: var(--gold-primary); }
.sidebar-btn span { font-size: 0.68rem; margin-top: 2px; }

/* زر الرجوع داخل السايدبار */
.sidebar-btn[onclick*="handleSidebarAction('home')"] {
    background: rgba(220, 38, 38, 0.1) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
}
.sidebar-btn[onclick*="handleSidebarAction('home')"]:hover {
    background: var(--danger) !important;
    color: #ffffff !important;
}
.sidebar-btn[onclick*="handleSidebarAction('home')"] i { color: var(--danger) !important; }
.sidebar-btn[onclick*="handleSidebarAction('home')"]:hover i { color: #ffffff !important; }

/* ============================================================
   Bottom Navigation
   ============================================================ */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: var(--silver-border-strong);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300;
    overflow-x: auto;
    scrollbar-width: none;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.bottom-nav .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem;
    cursor: pointer;
    transition: var(--transition);
    padding: 6px 10px;
    position: relative;
    touch-action: manipulation;
    flex: 1;
    min-width: 90px;
}
.bottom-nav .nav-item:active { transform: scale(0.9); }
.bottom-nav .nav-item i {
    font-size: 20px;
    transition: var(--transition);
}
.bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
.bottom-nav .nav-item.active { color: var(--gold-primary); }
.bottom-nav .nav-item.active i {
    transform: translateY(-3px);
    text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
}
.bottom-nav .nav-item.active::after {
    content: '';
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 3px;
    background: var(--gold-primary);
    border-radius: 10px;
}

/* ============================================================
   Report Modal
   ============================================================ */
.report-modal-overlay {

.report-modal .modal-title {

}

.report-filter-row {

}
.report-filter-row .form-group { margin-bottom: 0; }
.report-filter-row .form-label {
    display: block;

}
.report-filter-row .form-input {
    width: 100%;

}

}
.report-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
}
.report-actions .btn {
    flex: 1;
    padding: 13px 20px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    font-weight: 800;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.9rem;

    transition: var(--transition);

}
.report-actions .btn:active { transform: scale(0.97); }
.report-actions .btn-primary {

}
.report-actions .btn-primary:hover {
    background: var(--gold-dark);
    color: #ffffff;
    transform: translateY(-2px);

}
.report-actions .btn-secondary {

}

.report-results {

}

    top: 0;
    z-index: 10;

.report-results table td {
    padding: 10px 12px;
    border: var(--silver-border);
    text-align: center;

.report-results table tr:hover td {

}
.report-results .empty-state { padding: 30px; text-align: center; color: var(--text-muted); }

/* ============================================================
   Details Overlay
   ============================================================ */
.details-overlay {
    position: fixed;

    background: rgba(0, 0, 0, 0.7);

    display: none;
    opacity: 0;

    overflow-y: auto;

.details-content {
    background: var(--bg-secondary);
    min-height: 100vh;
    padding: 20px;
    border: var(--silver-border-strong);
    border-top: none;
}
.details-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: var(--bg-secondary);
    padding: 12px 0;

.details-title {
    font-size: 1.1rem;
    font-weight: 900;

}
.details-close {

    height: 40px;
    border-radius: 12px;

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 14px;
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
    min-width: 220px;
    font-size: 0.85rem;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--emerald-primary); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast-icon {
    width: 28px;
    height: 28px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    background: rgba(200, 154, 18, 0.12);
    color: var(--gold-primary);
    border: var(--silver-border);
}
.toast.success .toast-icon { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
.toast.error .toast-icon { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
.toast.warning .toast-icon { background: rgba(217, 119, 6, 0.12); color: var(--warning); }

/* ============================================================
   Alerts
   ============================================================ */
.alerts-container { padding: 0 24px 16px; }

/* ============================================================
   الرسوم المتحركة
   ============================================================ */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

    <!-- ============================================================
    JavaScript المتكامل

    <script>
        // ============================================================
        // 1. دالة apiCall الموحدة
        // ============================================================
        function apiCall(action, params) {
            const p = params || {};
            if (!window.AndroidInterface) return Promise.reject({ success: false, message: 'جسر Android غير متاح' });
            try {
                let raw;
                switch (action) {
                    case 'getPartyTypes': raw = AndroidInterface.getPartyTypes(); break;
                    case 'savePartyType': raw = Number(p.id || 0) > 0 ? AndroidInterface.updatePartyType(Number(p.id), JSON.stringify(p)) : AndroidInterface.addPartyType(JSON.stringify(p)); break;
                    case 'deletePartyType': raw = AndroidInterface.deletePartyType(Number(p.id)); break;
                    case 'generatePartyTypeReport': raw = AndroidInterface.generatePartyTypeReport(JSON.stringify(p)); break;
                    default: return Promise.reject({ success: false, message: 'العملية غير مدعومة: ' + action });
                }
                return Promise.resolve(typeof raw === 'string' ? JSON.parse(raw) : raw);
            } catch (e) { return Promise.reject({ success: false, message: e.message || 'فشل استدعاء الجسر' }); }
        }

        // ============================================================
        // 2. حالة الاتصال — بيانات الأعمال لا تُخزّن محلياً
        // ============================================================
        // ============================================================
        // 3. حالة الاتصال
        // ============================================================
        let isOnline = navigator.onLine;

        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const banner = document.getElementById('offlineBanner');
            if (!isOnline) {
                banner.classList.add('show');
                showToast('⚠️ لا يوجد اتصال — بيانات أنواع الأطراف للقراءة من قاعدة التطبيق فقط', 'warning');
            } else {
                banner.classList.remove('show');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ============================================================
        // 4. مزامنة العمليات المعلقة
        // ============================================================
        async function syncPendingOperations() { return; }

        // ============================================================
        // 5. Haptic Feedback        // ============================================================
        // 5. Haptic Feedback
        // ============================================================
        function hapticFeedback(type) {
            try {
                if (navigator.vibrate) {
                    if (type === 'success') navigator.vibrate(20);
                    else if (type === 'error') navigator.vibrate([30, 50, 30]);
                    else if (type === 'light') navigator.vibrate(10);
                }
            } catch (e) { /* تجاهل */ }
        }

        // ============================================================
        // 6. دوال مساعدة
        // ============================================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = toast.querySelector('.toast-icon i');
            toast.className = 'toast ' + type;
            msgEl.textContent = message;
            if (type === 'success') { iconEl.className = 'fas fa-check';
                hapticFeedback('success'); } else if (type === 'error') { iconEl.className = 'fas fa-times';
                hapticFeedback('error'); } else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle';
                hapticFeedback('light'); }
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'flex' : 'none';
        }

        function formatNumber(num) {
            if (num === null || num === undefined) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            else if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
            return num.toLocaleString('en');
        }

        function formatCurrency(num) {
            if (num === null || num === undefined) return '0.00';
            return parseFloat(num).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getField(obj, ...keys) {
            for (const key of keys) {
                if (obj[key] !== undefined && obj[key] !== null) return obj[key];
            }
            return null;
        }

        // ============================================================
        // 7. نظام تبديل الوضع (مع أيقونة شمس/هلال صحيحة)
        // ============================================================
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const isDark = current === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            const icon = document.getElementById('themeIcon');
            if (newTheme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
            hapticFeedback('light');
        }

        function loadSavedTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);

            const icon = document.getElementById('themeIcon');
            if (saved === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // ============================================================
        // 8. Pull-to-Refresh
        // ============================================================
                // لا يبدأ pull-to-refresh من عناصر تفاعلية أو من داخل مودال؛
        // منع preventDefault هنا يحافظ على تركيز حقول الإدخال ولوحة المفاتيح في WebView.
        const isInteractiveTouchTarget = (target) => Boolean(
            target && target.closest && target.closest(
                'input, textarea, select, button, a, [contenteditable="true"], .modal-overlay, [role="dialog"]'
            )
        );

let pullStartY = 0,
            pullOffset = 0,
            isPulling = false;

        document.addEventListener('touchstart', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            const scrollTop = window.scrollY || document.documentElement.scrollTop;
            if (scrollTop <= 0) {
                pullStartY = e.touches[0].clientY;
                isPulling = true;
            }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (isInteractiveTouchTarget(e.target)) {
                isPulling = false;
                pullOffset = 0;
                return;
            }
            if (!isPulling) return;
            const currentY = e.touches[0].clientY;
            const diff = currentY - pullStartY;
            if (diff > 20) {
                pullOffset = Math.min(diff, 80);
                const indicator = document.getElementById('pullIndicator');
                indicator.style.top = (pullOffset - 60) + 'px';
                if (pullOffset > 60) {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'حرر للتحديث';
                } else {
                    indicator.querySelector('i').className = 'fas fa-arrow-down';
                    indicator.querySelector('span').textContent = 'اسحب للتحديث';
                }
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener('touchend', function() {
            if (isPulling && pullOffset > 60) {
                const indicator = document.getElementById('pullIndicator');
                indicator.querySelector('i').className = 'fas fa-spinner fa-spin';
                indicator.querySelector('span').textContent = 'جاري التحديث...';
                setTimeout(() => {
                    loadPartyTypes();
                    setTimeout(() => {
                        indicator.style.top = '-60px';
                        isPulling = false;
                        pullOffset = 0;
                    }, 500);
                }, 300);
            } else {
                document.getElementById('pullIndicator').style.top = '-60px';
                isPulling = false;
                pullOffset = 0;
            }
        }, { passive: true });

        // ============================================================
        // 9. نظام التقارير
        // ============================================================
        let currentReportType = 'types';
        let reportData = [];

        function openReport(type) {
            currentReportType = type;
            const titles = {
                'parties_by_type': '📊 الأطراف حسب النوع',
                'type_summary': '📊 ملخص الأنواع',
                'types': '📊 أنواع الأطراف',
                'credit_analysis': '📊 تحليل الائتمان',
                'activity': '📊 تقرير النشاط'
            };
            document.getElementById('reportModalTitle').textContent = titles[type] || '📊 التقرير';

            const today = new Date();
            const monthAgo = new Date();
            monthAgo.setDate(monthAgo.getDate() - 30);
            document.getElementById('reportFrom').value = monthAgo.toISOString().split('T')[0];
            document.getElementById('reportTo').value = today.toISOString().split('T')[0];

            document.getElementById('reportModal').classList.add('show');
            document.body.style.overflow = 'hidden';
            document.getElementById('reportResults').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-file-alt" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                    <p>اختر الفترة ونوع التقرير ثم اضغط "توليد التقرير"</p>
                </div>
            `;
            hapticFeedback('light');
        }

        function closeReportModal(e) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            document.getElementById('reportModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        async function generateReport() {
            const from = document.getElementById('reportFrom').value;
            const to = document.getElementById('reportTo').value;
            const status = document.getElementById('reportStatus').value;
            const extra = document.getElementById('reportExtra').value;

            showLoading(true);
            try {
                const params = {
                    report_type: currentReportType,
                    start_date: from,
                    end_date: to,
                    status: status || null,
                    extra: extra || null
                };
                const result = await apiCall('generatePartyTypeReport', params);
                if (result.success && result.data) {
                    reportData = result.data;
                    renderReportResults(result.data);
                    showToast('✅ تم توليد التقرير بنجاح', 'success');
                    hapticFeedback('success');
                } else {
                    document.getElementById('reportResults').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                            <p>${result.message || 'لا توجد بيانات للتقرير'}</p>
                        </div>
                    `;
                    showToast(result.message || '❌ لا توجد بيانات', 'warning');
                }
            } catch (e) {
                showToast('❌ فشل توليد التقرير', 'error');
                console.error(e);
            } finally {
                showLoading(false);
            }
        }

        function renderReportResults(data) {
            const container = document.getElementById('reportResults');
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
                        <p>لا توجد بيانات مطابقة للفترة المحددة</p>
                    </div>
                `;
                return;
            }

            let headers = [];
            let rows = [];

            switch (currentReportType) {
                case 'parties_by_type':
                    headers = ['#', 'نوع الطرف', 'عدد الأطراف', 'نشط', 'غير نشط', 'إجمالي المشتريات', 'إجمالي المدفوعات'];
                    rows = data.map((item, idx) => [
                        idx + 1,
                        item.type_name || item.name || '---',
                        item.total_parties || 0,
                        item.active_parties || 0,
                        item.inactive_parties || 0,
                        formatCurrency(item.total_purchases || 0),
                        formatCurrency(item.total_payments || 0)
                    ]);
                    break;
                case 'type_summary':
                    headers = ['#', 'الكود', 'الاسم', 'الوصف', 'الخصم %', 'الحد الائتماني', 'شروط الدفع', 'الحالة'];
                    rows = data.map((item, idx) => [
                        idx + 1,
                        item.type_code || '---',
                        item.type_name_ar || item.type_name || '---',
                        (item.description || '').substring(0, 30) + ((item.description || '').length > 30 ? '...' : ''),
                        (item.default_discount || 0).toFixed(2),
                        formatCurrency(item.default_credit_limit || 0),
                        item.payment_terms_days || 0,
                        item.is_active ? 'نشط' : 'غير نشط'
                    ]);
                    break;
                case 'types':
                    headers = ['#', 'الكود', 'الاسم (عربي)', 'الاسم (إنجليزي)', 'الوصف', 'الخصم %', 'الحد الائتماني', 'شروط الدفع', 'الحالة'];
                    rows = data.map((item, idx) => [
                        idx + 1,
                        item.type_code || '---',
                        item.type_name_ar || '---',
                        item.type_name || '---',
                        (item.description || '').substring(0, 30) + ((item.description || '').length > 30 ? '...' : ''),
                        (item.default_discount || 0).toFixed(2),
                        formatCurrency(item.default_credit_limit || 0),
                        item.payment_terms_days || 0,
                        item.is_active ? '✅ نشط' : '❌ غير نشط'
                    ]);
                    break;
                case 'credit_analysis':
                    headers = ['#', 'النوع', 'عدد الأطراف', 'متوسط الحد الائتماني', 'إجمالي الحد', 'متوسط الاستهلاك', 'نسبة الاستخدام'];
                    rows = data.map((item, idx) => {
                        const totalLimit = parseFloat(item.total_credit || 0);
                        const totalBalance = parseFloat(item.total_balance || 0);
                        const usage = totalLimit > 0 ? ((totalBalance / totalLimit) * 100) : 0;
                        return [
                            idx + 1,
                            item.type_name || '---',
                            item.party_count || 0,
                            formatCurrency(item.avg_credit || 0),
                            formatCurrency(totalLimit),
                            formatCurrency(totalBalance),
                            usage.toFixed(1) + '%'
                        ];
                    });
                    break;
                case 'activity':
                    headers = ['#', 'النوع', 'عدد الفواتير', 'إجمالي المبيعات', 'عدد المدفوعات', 'آخر نشاط'];
                    rows = data.map((item, idx) => [
                        idx + 1,
                        item.type_name || '---',
                        item.invoice_count || 0,
                        formatCurrency(item.total_sales || 0),
                        item.payment_count || 0,
                        item.last_activity || '---'
                    ]);
                    break;
                default:
                    headers = ['#', 'البيانات'];
                    rows = data.map((item, idx) => [idx + 1, JSON.stringify(item)]);
            }

            let tableHtml = `
                <table>
                    <thead><tr>${headers.map(h => `<th style="color:var(--gold-primary);">${h}</th>`).join('')}</tr></thead>
                    <tbody>
            `;
            rows.forEach(row => {
                tableHtml += `<tr>${row.map(cell => `<td style="color:var(--text-primary);">${cell}</td>`).join('')}</tr>`;
            });
            tableHtml += `</tbody></table>`;
            container.innerHTML = tableHtml;
        }

        // ============================================================
        // 10. متغيرات الحالة
        // ============================================================
        let currentEditId = 0;
        let currentFilter = 'all';
        let allPartyTypes = [];
        let selectedPartyId = null;
        let isInitialLoad = true;

        // ============================================================
        // 11. تحميل البيانات مع Skeleton Loading
        // ============================================================
        function renderSkeleton() {
            const container = document.getElementById('cardsContainer');
            let skeleton = '';
            for (let i = 0; i < 4; i++) {
                skeleton += `
                    <div class="skeleton-card">
                        <div style="display:flex;align-items:center;margin-bottom:12px;">
                            <div style="width:48px;height:48px;border-radius:14px;background:var(--skeleton-bg);flex-shrink:0;margin-left:12px;"></div>
                            <div style="flex:1;">
                                <div class="skeleton-row long"></div>
                                <div class="skeleton-row medium" style="width:60%;"></div>
                            </div>
                        </div>
                        <div class="skeleton-row"></div>
                        <div class="skeleton-row"></div>
                        <div style="display:flex;gap:10px;margin-top:12px;">
                            <div class="skeleton-row" style="flex:1;height:40px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;"></div>
                            <div class="skeleton-row" style="flex:1;height:40px;"></div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = `<div class="skeleton-grid" style="padding:0;">${skeleton}</div>`;
        }

        async function loadPartyTypes() {
            if (isInitialLoad) renderSkeleton();

            showLoading(true);
            try {
                const result = await apiCall('getPartyTypes', {});
                if (result.success && result.data && result.data.length > 0) {
                    allPartyTypes = result.data;
                } else {
                    allPartyTypes = [];
                    showToast('⚠️ لا توجد بيانات متاحة', 'warning');
                }
            } catch (e) {
                allPartyTypes = [];
                showToast(e?.message || '❌ فشل قراءة أنواع الأطراف من SQLite', 'error');
            }
            renderCards();
            updateStats();
            isInitialLoad = false;
            showLoading(false);
        }

        // ============================================================
        // 12. عرض البطاقات
        // ============================================================
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            let filtered = [...allPartyTypes];

            if (currentFilter === 'active') {
                filtered = filtered.filter(s => s.is_active == 1 || s.isActive == 1);
            } else if (currentFilter === 'inactive') {
                filtered = filtered.filter(s => s.is_active == 0 || s.isActive == 0);
            }

            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            if (searchQuery) {
                filtered = filtered.filter(s => {
                    const code = (s.type_code || '').toLowerCase();
                    const name = (s.type_name || s.type_name_ar || '').toLowerCase();
                    const desc = (s.description || '').toLowerCase();
                    return code.includes(searchQuery) || name.includes(searchQuery) || desc.includes(searchQuery);
                });
            }

            document.getElementById('partyCount').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tags"></i>
                        <p>لا توجد أنواع أطراف مطابقة</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map((s, idx) => {
                const id = s.id;
                const code = s.type_code || '---';
                const nameAr = s.type_name_ar || s.type_name || '---';
                const nameEn = s.type_name || '---';
                const description = s.description || '';
                const discount = parseFloat(s.default_discount || 0);
                const creditLimit = parseFloat(s.default_credit_limit || 0);
                const terms = s.payment_terms_days || 0;
                const isActive = s.is_active == 1 || s.isActive == 1;
                const avatar = nameAr.substring(0, 2);
                const statusClass = isActive ? 'active' : 'inactive';
                const statusText = isActive ? 'نشط' : 'غير نشط';

                return `
                    <div class="party-card animate-fade-up" style="animation-delay:${idx*0.04}s" data-id="${id}" onclick="selectCard(this, ${id})">
                        <div class="card-header">
                            <div class="card-avatar">${avatar}</div>
                            <span class="card-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="card-name">${escapeHtml(nameAr)} <span style="font-size:0.8rem;color:var(--text-muted);font-weight:400;">(${escapeHtml(nameEn)})</span></div>
                        <div class="card-code">${escapeHtml(code)}</div>
                        ${description ? `<div class="card-description">${escapeHtml(description)}</div>` : ''}
                        <div class="card-body">
                            <div class="metric-box">
                                <div class="metric-value" style="color:var(--gold-primary)">${discount.toFixed(2)}%</div>
                                <div class="metric-label">الخصم</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-value" style="color:var(--emerald-primary)">${formatCurrency(creditLimit)}</div>
                                <div class="metric-label">الحد الائتماني</div>
                            </div>
                            <div class="metric-box">
                                <div class="metric-value" style="color:var(--warning)">${terms} يوم</div>
                                <div class="metric-label">شروط الدفع</div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="card-btn" onclick="event.stopPropagation(); editPartyType(${id})">
                                <i class="fas fa-edit"></i> تعديل
                            </button>
                            <button class="card-btn danger" onclick="event.stopPropagation(); deletePartyType(${id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCard(card, id) {
            document.querySelectorAll('.party-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedPartyId = id;
            hapticFeedback('light');
        }

        // ============================================================
        // 13. تحديث الإحصائيات
        // ============================================================
        function updateStats() {
            const total = allPartyTypes.length;
            const active = allPartyTypes.filter(s => s.is_active == 1 || s.isActive == 1).length;
            const inactive = allPartyTypes.filter(s => s.is_active == 0 || s.isActive == 0).length;
            const avgCredit = total > 0 ?
                allPartyTypes.reduce((sum, s) => sum + parseFloat(s.default_credit_limit || 0), 0) / total :
                0;

            document.getElementById('statTotal').textContent = total;
            document.getElementById('statActive').textContent = active;
            document.getElementById('statInactive').textContent = inactive;
            document.getElementById('statAvgCredit').textContent = formatNumber(avgCredit);

        }

        function showStatDetail(type) {
            showToast('📊 عرض تفاصيل: ' + type, 'success');
        }

        // ============================================================
        // 14. البحث والفلاتر
        // ============================================================
        function handleSearch(query) { renderCards(); }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
            hapticFeedback('light');
        }

        // ============================================================
        // 15. نظام التنبيهات
        // ============================================================
        function generateAlerts() {
            const alerts = [];
            allPartyTypes.forEach(s => {
                if (s.is_active == 0 || s.isActive == 0) {
                    alerts.push({
                        type: 'warning',
                        icon: 'fa-exclamation-circle',
                        title: '⏸️ نوع غير نشط',
                        desc: s.type_name_ar || s.type_name || 'نوع' + ' (' + (s.type_code || '') + ')',
                        time: 'الآن'
                    });
                }
            });
            renderAlerts(alerts);
        }

        function renderAlerts(alerts) {
            const container = document.getElementById('alertsContainer');
            if (!container) return;
            if (!alerts || alerts.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = alerts.slice(0, 3).map((a, i) => `
                <div class="alert-item ${a.type}" style="animation-delay:${i*0.1}s;padding:10px 16px;background:var(--bg-card);border-radius:12px;margin-bottom:8px;border:var(--silver-border-strong);display:flex;align-items:center;gap:10px;box-shadow:var(--silver-shadow);">
                    <div class="alert-icon" style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.85rem;background:rgba(217,119,6,0.12);color:var(--warning);border:var(--silver-border);"><i class="fas ${a.icon}"></i></div>
                    <div class="alert-content" style="flex:1;"><div class="alert-title" style="font-size:0.85rem;font-weight:700;color:var(--text-primary);">${a.title}</div><div class="alert-desc" style="font-size:0.75rem;color:var(--text-muted);">${a.desc}</div></div>
                    <div class="alert-time" style="font-size:0.7rem;color:var(--text-muted);">${a.time}</div>
                </div>
            `).join('');
        }

        function showNotifications() {
            const notifications = allPartyTypes.filter(s => s.is_active == 0 || s.isActive == 0);
            if (notifications.length === 0) {
                showToast('🔔 لا توجد إشعارات جديدة', 'info');
                return;
            }
            showToast('🔔 لديك ' + notifications.length + ' إشعارات', 'success');
            hapticFeedback('light');
        }

        // ============================================================
        // 16. نافذة الإضافة / التعديل
        // ============================================================
        function openAddModal() {
            currentEditId = 0;
            document.getElementById('modalTitle').textContent = '➕ إضافة نوع جديد';
            document.getElementById('editId').value = '0';
            document.getElementById('partyTypeForm').reset();
            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            hapticFeedback('light');
            setTimeout(() => { document.getElementById('typeCode').focus(); }, 400);
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget && e.type === 'click') return;
            document.getElementById('modalOverlay').classList.remove('show');
            document.body.style.overflow = '';
            currentEditId = 0;
        }

        // ============================================================
        // 17. حفظ النوع
        // ============================================================
        async function savePartyType() {
            const typeCode = document.getElementById('typeCode').value.trim();
            const typeNameAr = document.getElementById('typeNameAr').value.trim();
            const typeNameEn = document.getElementById('typeNameEn').value.trim();

            if (!typeCode) {
                showToast('❌ الرجاء إدخال كود النوع', 'error');
                document.getElementById('typeCode').focus();
                return;
            }
            if (!typeNameAr || !typeNameEn) {
                showToast('❌ الرجاء إدخال الاسم بالعربية والإنجليزية', 'error');
                document.getElementById('typeNameAr').focus();
                return;
            }

            const data = {
                id: currentEditId || 0,
                type_code: typeCode.toUpperCase(),
                type_name_ar: typeNameAr,
                type_name: typeNameEn,
                description: document.getElementById('description').value.trim(),
                default_discount: parseFloat(document.getElementById('defaultDiscount').value) || 0,
                default_credit_limit: parseFloat(document.getElementById('defaultCreditLimit').value) || 0,
                payment_terms_days: parseInt(document.getElementById('paymentTermsDays').value) || 0,
                is_active: parseInt(document.getElementById('isActive').value)
            };

            showLoading(true);

            try {
                const result = await apiCall('savePartyType', data);
                if (result.success) {
                    showToast(result.message || '✅ تم حفظ النوع بنجاح', 'success');
                    closeModal();
                    await loadPartyTypes();
                } else {
                    throw new Error(result.message || 'فشل في الحفظ');
                }
            } catch (e) {
                showToast('❌ ' + (e.message || 'خطأ في الحفظ'), 'error');
            } finally {
                showLoading(false);
            }
        }

        // ============================================================
        // 18. تعديل نوع
        // ============================================================
        async function editPartyType(id) {
            const item = allPartyTypes.find(s => s.id == id);
            if (!item) {
                showToast('❌ النوع غير موجود', 'error');
                return;
            }

            currentEditId = id;
            document.getElementById('modalTitle').textContent = '✏️ تعديل نوع';
            document.getElementById('editId').value = id;

            document.getElementById('typeCode').value = item.type_code || '';
            document.getElementById('typeNameAr').value = item.type_name_ar || '';
            document.getElementById('typeNameEn').value = item.type_name || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('defaultDiscount').value = item.default_discount || '';
            document.getElementById('defaultCreditLimit').value = item.default_credit_limit || '';
            document.getElementById('paymentTermsDays').value = item.payment_terms_days || '';
            document.getElementById('isActive').value = (item.is_active || item.isActive || 1).toString();

            document.getElementById('modalOverlay').classList.add('show');
            document.body.style.overflow = 'hidden';
            hapticFeedback('light');

            setTimeout(() => { document.getElementById('typeCode').focus(); }, 400);
        }

        // ============================================================
        // 19. حذف نوع
        // ============================================================
        async function deletePartyType(id) {
            const item = allPartyTypes.find(s => s.id == id);
            const name = item ? (item.type_name_ar || item.type_name || 'هذا النوع') : 'هذا النوع';

            const confirmed = await Swal.fire({
                title: '⚠️ هل أنت متأكد؟',
                text: 'سيتم حذف النوع "' + name + '" - لا يمكن التراجع!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#8391a5',
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            });

            if (!confirmed.isConfirmed) return;

            showLoading(true);

            try {
                const result = await apiCall('deletePartyType', { id: id });
                if (result.success) {
                    showToast('✅ تم الحذف بنجاح', 'success');
                    allPartyTypes = allPartyTypes.filter(s => s.id != id);
                    renderCards();
                    updateStats();
                    hapticFeedback('success');
                } else {
                    throw new Error(result.message || 'فشل في الحذف');
                }
            } catch (e) {
                showToast('❌ ' + (e.message || 'خطأ في الحذف'), 'error');
            } finally {
                showLoading(false);
            }
        }

        function exportPartyTypesCSV() {
            const rows = [['الكود','الاسم العربي','الاسم الإنجليزي','الخصم','الحد الائتماني','أيام الدفع','الحالة']];
            allPartyTypes.forEach(x => rows.push([x.type_code || '', x.type_name_ar || '', x.type_name || '', x.default_discount || 0, x.default_credit_limit || 0, x.payment_terms_days || 0, Number(x.is_active) === 1 ? 'نشط' : 'غير نشط']));
            const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `party-types-${new Date().toISOString().slice(0,10)}.csv`; a.click(); URL.revokeObjectURL(url);
        }

        // ============================================================
        // 20. معالج أزرار القائمة الجانبية
        // ============================================================
        function handleSidebarAction(action) {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('open');
            document.getElementById('sidebarToggle').classList.remove('hidden');

            switch (action) {
                case 'add':
                    openAddModal();
                    break;
                case 'save':
                    if (currentEditId > 0 || document.getElementById('modalOverlay').classList.contains('show')) {
                        savePartyType();
                    } else {
                        showToast('⚠️ لا يوجد نموذج مفتوح للحفظ', 'warning');
                    }
                    break;
                case 'search':
                    document.getElementById('searchInput').focus();
                    showToast('🔍 اكتب كلمة البحث في الحقل أعلاه', 'info');
                    break;
                case 'delete':
                    if (selectedPartyId) {
                        deletePartyType(selectedPartyId);
                    } else {
                        showToast('❌ يرجى تحديد نوع أولاً (انقر على البطاقة)', 'error');
                    }
                    break;
                case 'export':
                    exportPartyTypesCSV();
                    break;
                case 'home':
                    window.location.href = '../main.html';
                    break;
                default:
                    showToast('❌ إجراء غير معروف', 'error');
            }
        }

        // ============================================================
        // 21. إعداد القائمة الجانبية
        // ============================================================
        function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            toggle.addEventListener('click', (e) => {
                e.stopPropagation();
                sidebar.classList.toggle('open');
                toggle.classList.toggle('hidden');
                hapticFeedback('light');
            });
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) {
                    sidebar.classList.remove('open');
                    toggle.classList.remove('hidden');
                }
            });
        }

        // ============================================================
        // 22. التهيئة النهائية
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedTheme();
            setupSidebar();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            updateOnlineStatus();
            loadPartyTypes();

            document.getElementById('reportModal').addEventListener('click', function(e) {
                if (e.target === this) closeReportModal();
            });

            if (isOnline) {
                syncPendingOperations();
            }
        });
    </script>

    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
