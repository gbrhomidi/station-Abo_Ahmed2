<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – التنبؤات والتحليلات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحّد — بنفسجي / ذهبي
           مستوحى من customer-reports.html
           وضع فاتح افتراضي + وضع مظلم مخفف
           ============================================================ */
        :root {
            /* ═══ الوضع الفاتح (افتراضي) ═══ */
            --bg-primary: #f5f3ff;
            --bg-secondary: #ede9fe;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-glass: rgba(0, 0, 0, 0.03);
            --bg-glass-light: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1025;
            --text-secondary: #3d2a5c;
            --text-muted: #6b5b7a;
            --border-color: #d4c8e8;
            --border-glow: rgba(168, 130, 255, 0.25);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --violet-primary: #a882ff;
            --violet-dark: #7c4dff;
            --violet-glow: 0 0 30px rgba(168, 130, 255, 0.15);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;

            --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.08);
            --shadow-glow: 0 0 60px rgba(168, 130, 255, 0.05);
            --radius-card: 24px;
            --radius-small: 14px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(245, 243, 255, 0.9);
            --nav-bg: rgba(245, 243, 255, 0.94);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--violet-primary);

            color-scheme: light;
        }

        /* ═══ الوضع المظلم المخفّف ═══ */
        [data-theme="dark"] {
            --bg-primary: #0b0719;
            --bg-secondary: #14102b;
            --bg-card: rgba(26, 20, 56, 0.78);
            --bg-glass: rgba(255, 255, 255, 0.04);
            --bg-glass-light: rgba(255, 255, 255, 0.08);
            --text-primary: #ede7ff;
            --text-secondary: #b4a7e6;
            --text-muted: #7a6da0;
            --border-color: rgba(168, 130, 255, 0.18);
            --border-glow: rgba(168, 130, 255, 0.3);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --violet-primary: #a882ff;
            --violet-dark: #7c4dff;
            --violet-glow: 0 0 30px rgba(168, 130, 255, 0.18);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;

            --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.6);
            --shadow-glow: 0 0 60px rgba(168, 130, 255, 0.05);

            --header-bg: rgba(11, 7, 25, 0.85);
            --nav-bg: rgba(11, 7, 25, 0.94);
            --sidebar-bg: rgba(26, 20, 56, 0.98);
            --toast-bg: #14102b;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--violet-primary);

            color-scheme: dark;
        }

        /* ============================================================
           الأنماط الأساسية — منع تجاوز حدود الشاشة
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
            min-height: 100vh;
            padding: 0;
            padding-bottom: 90px;
            margin: 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(168, 130, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(245, 200, 66, 0.04) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(168, 130, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(245, 200, 66, 0.04) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--violet-primary); border-radius: 10px; }

        /* ===== Pull-to-Refresh Indicator ===== */
        .pull-indicator {
            position: fixed;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: top 0.2s ease;
            z-index: 50;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            pointer-events: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .pull-indicator.active { top: 0; }
        .pull-indicator i { margin-left: 8px; transition: transform 0.3s; }
        .pull-indicator.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(168, 130, 255, 0.15);
            border-top: 5px solid var(--violet-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        /* ===== Skeleton Loading ===== */
        .skeleton-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px 16px;
        }
        .skeleton-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-row {
            height: 12px;
            background: var(--bg-glass-light);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           Report Source Banner (hidden)
           ============================================================ */
        .report-source-banner { display: none; }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 120;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 22px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.12);
            transition: var(--transition);
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
        }
        [data-theme="dark"] .top-bar {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }
        .top-title { flex: 1; min-width: 140px; text-align: center; }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--violet-primary), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--violet-primary);
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--violet-primary);
            color: var(--violet-primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(168, 130, 255, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            background: var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--gold-primary);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }
        .ai-badge {
            background: linear-gradient(135deg, var(--violet-primary), var(--violet-dark));
            color: #fff;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 30px;
            margin-right: 8px;
            vertical-align: middle;
            box-shadow: 0 0 20px rgba(168, 130, 255, 0.3);
            -webkit-text-fill-color: white;
        }

        /* ============================================================
           البحث والفلاتر
           ============================================================ */
        .search-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .search-input {
            width: 100%;
            max-width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: var(--radius-small);
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            text-align: center;
            box-sizing: border-box;
        }
        .search-input:focus {
            border-color: var(--violet-primary);
            box-shadow: 0 0 0 3px var(--violet-glow);
        }
        .search-input::placeholder { color: var(--text-muted); text-align: center; }
        .search-wrap > i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
            justify-content: center;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover {
            border-color: var(--violet-primary);
            color: var(--violet-primary);
            background: var(--bg-glass-light);
        }
        .filter-chip.active {
            background: linear-gradient(135deg, var(--violet-primary), var(--violet-dark));
            color: #ffffff;
            border-color: var(--violet-primary);
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.35);
        }

        /* ============================================================
           بطاقات الإحصائيات — توسيط كامل
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding: 20px 22px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 20px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-card);
            min-width: 0;
            box-sizing: border-box;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--violet-primary), var(--gold-primary));
            opacity: 0.7;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: var(--violet-primary);
            box-shadow: var(--shadow-glow), 0 20px 50px rgba(168, 130, 255, 0.15);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            background: var(--bg-glass-light);
            color: var(--violet-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.12); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.12); color: var(--success); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .stat-icon.purple { background: rgba(124, 58, 237, 0.15); color: var(--violet-primary); }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
            word-break: break-word;
            max-width: 100%;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-top: 6px;
            padding: 3px 12px;
            border-radius: 30px;
        }
        .stat-trend.up { background: rgba(5, 150, 105, 0.15); color: var(--success); }
        .stat-trend.down { background: rgba(220, 38, 38, 0.15); color: var(--danger); }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           لوحة البيانات الرئيسية
           ============================================================ */
        .page-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 0 90px;
            width: 100%;
            box-sizing: border-box;
        }
        .data-panel {
            margin: 0 22px;
            padding: 18px;
            border-radius: var(--radius-card);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
            width: auto;
            box-sizing: border-box;
        }
        .data-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--violet-primary), var(--gold-primary));
            opacity: 0.7;
        }
        .section-title {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .section-title h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 i { color: var(--violet-primary); }
        .section-title .count-badge {
            background: linear-gradient(135deg, var(--violet-primary), var(--violet-dark));
            color: #fff;
            border-radius: 30px;
            padding: 3px 14px;
            font-size: 0.75rem;
            font-weight: 900;
            box-shadow: 0 4px 16px rgba(168, 130, 255, 0.25);
        }

        /* ============================================================
           بطاقات البيانات
           ============================================================ */
        .cards-container {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .data-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            padding: 16px;
            margin-bottom: 0;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }
        .data-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px;
            height: 100%;
            background: var(--violet-primary);
            opacity: 0.6;
            transition: var(--transition);
        }
        .data-card:hover {
            border-color: var(--violet-primary);
            box-shadow: var(--shadow-glow), 0 8px 28px rgba(168, 130, 255, 0.12);
            transform: translateY(-2px);
            background: var(--bg-glass-light);
        }
        .data-card:hover::before { opacity: 1; width: 6px; }
        .data-card-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .data-card-title {
            font-weight: 800;
            color: var(--text-primary);
            text-align: center;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }
        .data-card-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            margin-top: 4px;
            line-height: 1.7;
            text-align: center;
            word-break: break-word;
        }
        .data-card-value {
            color: var(--gold-primary);
            font-weight: 900;
            white-space: nowrap;
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        .data-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .data-field {
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            min-width: 0;
            text-align: center;
            overflow: hidden;
        }
        .data-field span {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
            word-break: break-word;
        }
        .data-field strong {
            display: block;
            margin-top: 2px;
            overflow-wrap: anywhere;
            color: var(--text-primary);
            font-size: 0.8rem;
            text-align: center;
            font-weight: 800;
            word-break: break-word;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }

        /* ============================================================
           الأزرار
           ============================================================ */
        .btn {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 14px;
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            border-color: var(--violet-primary);
            color: var(--violet-primary);
            transform: translateY(-1px);
            background: var(--bg-glass-light);
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--violet-primary), var(--violet-dark));
            color: #fff;
            border-color: var(--violet-primary);
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.25);
        }
        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(168, 130, 255, 0.35);
            color: #fff;
        }
        .btn.danger {
            color: var(--danger);
        }
        .btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.08);
        }
        .btn.warning {
            color: var(--warning);
        }
        .btn.warning:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(217, 119, 6, 0.08);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================
           الحالة الفارغة
           ============================================================ */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 50px 20px;
            line-height: 1.9;
        }
        .empty-state i {
            font-size: 3.5rem;
            display: block;
            color: var(--violet-primary);
            margin-bottom: 14px;
            opacity: 0.4;
        }

        /* ============================================================
           FAB — مخفي نهائياً
           ============================================================ */
        .fab { display: none !important; }

        /* ============================================================
           القائمة الجانبية (Sidebar)
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: linear-gradient(145deg, var(--violet-primary), var(--violet-dark));
            color: #fff;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 25px rgba(168, 130, 255, 0.3);
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.15);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { width: 48px; }
        .sidebar-toggle i { font-size: 1.05rem; }

        .sidebar {
            position: fixed;
            top: 50%;
            right: -160px;
            transform: translateY(-50%);
            width: 130px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 14px 12px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            padding: 14px 8px;
            border-radius: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 80px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--violet-primary);
            color: var(--violet-primary);
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(168, 130, 255, 0.2);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.7rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية (Bottom Navigation)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 100vw;
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            min-width: 70px;
            text-align: center;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; font-size: 0.68rem; }
        .bottom-nav .nav-item.active { color: var(--violet-primary); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 25px rgba(168, 130, 255, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--violet-primary);
            border-radius: 10px;
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            overflow-y: auto;
            width: 100%;
            max-width: 100vw;
            box-sizing: border-box;
        }
        [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.82); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color);
            border-bottom: none;
            box-sizing: border-box;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--violet-primary);
            flex: 1;
            min-width: 0;
            word-break: break-word;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-title i { color: var(--violet-primary); }
        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .modal-body {
            padding: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }
        .modal-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 0 0;
            border-top: 1px solid var(--border-color);
            margin-top: 14px;
        }

        /* ============================================================
           نموذج الحقول
           ============================================================ */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            box-sizing: border-box;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 0;
            min-width: 0;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-label {
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.2px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-small);
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
            text-align: center;
            font-weight: 600;
            box-sizing: border-box;
            max-width: 100%;
        }
        .form-input:focus {
            border-color: var(--violet-primary);
            box-shadow: 0 0 0 3px var(--violet-glow);
        }
        .form-input::placeholder { color: var(--text-muted); text-align: center; }
        select.form-input option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        textarea.form-input {
            text-align: center;
            resize: vertical;
            min-height: 90px;
            line-height: 1.7;
        }

        /* ============================================================
           مودال التقارير
           ============================================================ */
        .report-modal-overlay { /* alias — يستخدم نفس تنسيق modal-overlay */ }
        .report-results {
            margin-top: 20px;
            max-height: 320px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            background: var(--bg-glass);
            padding: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        .report-results table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            font-size: 0.8rem;
        }
        .report-results table th {
            background: var(--bg-glass-light);
            color: var(--violet-primary);
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 800;
            border: 1px solid var(--border-color);
            border-radius: 10px 10px 0 0;
            white-space: nowrap;
        }
        .report-results table td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-glass);
            border-radius: 10px;
        }

        /* ============================================================
           تفاصيل السجل
           ============================================================ */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .detail-item {
            padding: 10px;
            border-radius: var(--radius-small);
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            text-align: center;
            overflow: hidden;
        }
        .detail-item span {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
            word-break: break-word;
        }
        .detail-item strong {
            display: block;
            margin-top: 3px;
            overflow-wrap: anywhere;
            text-align: center;
            color: var(--text-primary);
            font-weight: 800;
            word-break: break-word;
        }
        .raw-json {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-glass-light);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font: 0.72rem/1.5 monospace;
            max-height: 300px;
            overflow: auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* ============================================================
           AI Assistant Output
           ============================================================ */
        .ai-output {
            min-height: 100px;
            white-space: pre-wrap;
            line-height: 1.9;
            color: var(--text-primary);
            text-align: center;
            padding: 14px;
            border-radius: var(--radius-small);
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            margin-top: 10px;
            word-break: break-word;
            box-sizing: border-box;
        }

        /* ============================================================
           Settings / Utility Cards (متوافقة مع البنية الحالية)
           ============================================================ */
        .settings-wrap { padding: 0; }
        .settings-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            padding: 16px;
            text-align: center;
        }
        .settings-line {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }
        .settings-line:last-child { border-bottom: 0; }
        .settings-line label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 700;
        }
        .utility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding: 0;
        }
        .utility-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            padding: 16px;
            text-align: center;
        }
        .utility-card h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 800;
            text-align: center;
        }
        .utility-card p {
            color: var(--text-muted);
            font-size: 0.75rem;
            line-height: 1.8;
            margin-bottom: 12px;
            text-align: center;
        }

        /* ============================================================
           Toast
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
            min-width: 200px;
            max-width: calc(100vw - 32px);
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-primary);
            text-align: center;
            box-sizing: border-box;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--violet-primary); }
        .toast-icon {
            width: 28px;
            height: 28px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .toast.success .toast-icon { background: rgba(5, 150, 105, 0.15); color: var(--success); }
        .toast.error .toast-icon { background: rgba(220, 38, 38, 0.15); color: var(--danger); }
        .toast.warning .toast-icon { background: rgba(217, 119, 6, 0.15); color: var(--warning); }
        .toast.info .toast-icon { background: rgba(168, 130, 255, 0.15); color: var(--violet-primary); }

        /* ============================================================
           الرسوم المتحركة
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.5s ease forwards;
        }

        /* ============================================================
           عناصر متبقية من البنية الأصلية
           ============================================================ */
        .support-note { color: var(--warning); }
        .hidden { display: none !important; }

        /* ============================================================
           استجابة الشاشات الصغيرة
           ============================================================ */
        @media (max-width: 768px) {
            .top-bar { padding: 10px 14px; }
            .top-title h2 { font-size: 1.1rem; }
            .filter-chip { font-size: 0.72rem; padding: 6px 14px; }
            .stats-grid { padding: 14px; gap: 12px; }
            .stat-card { padding: 14px 12px; }
            .stat-value { font-size: 1.35rem; }
            .stat-icon { width: 40px; height: 40px; font-size: 1.05rem; }
            .data-panel { margin: 0 14px; padding: 14px; }
            .sidebar { width: 110px; padding: 12px 10px; }
            .sidebar-btn { min-height: 70px; font-size: 0.8rem; }
            .sidebar-btn i { font-size: 1.35rem; }
            .bottom-nav .nav-item i { font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 0.65rem; }
            .modal { padding: 20px 16px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .detail-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .stats-grid { gap: 10px; padding: 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.15rem; }
            .stat-icon { width: 36px; height: 36px; font-size: 0.95rem; }
            .bottom-nav .nav-item { padding: 4px 4px; min-width: 60px; }
            .bottom-nav .nav-item i { font-size: 16px; }
            .bottom-nav .nav-item span { font-size: 0.6rem; }
            .sidebar { width: 100px; padding: 10px 8px; }
            .sidebar-btn { min-height: 62px; font-size: 0.72rem; }
            .sidebar-btn i { font-size: 1.2rem; }
            .top-bar { padding: 12px 12px 10px; }
            .data-panel { margin: 0 12px; padding: 12px; }
            .detail-grid { grid-template-columns: 1fr; }
            .modal-title { font-size: 1.05rem; }
        }

        /* ============================================================
           الطباعة
           ============================================================ */
        @media print {
            .top-bar, .bottom-nav, .sidebar-toggle, .sidebar, .fab,
            .offline-banner, .icon-btn, .action-row,
            .filter-chips, .pull-indicator { display: none !important; }
            body { background: #fff; color: #111; padding: 0; }
            .data-panel, .data-card, .stat-card {
                box-shadow: none;
                color: #111;
                border: 1px solid #aaa;
                background: #fff;
            }
        }
    </style>
    <meta name="reports-bridge-methods" content="getPredictionRecords">
    <script src="file:///android_asset/assets-local/js/reports-runtime.js" defer></script>
</head>
<body>
    <div id="reportsDataSource" class="report-source-banner" data-state="unavailable" role="status"><i class="fas fa-plug-circle-xmark" aria-hidden="true"></i><span>جاري التحقق من مصدر بيانات SQLite...</span></div>

    <div class="offline-banner" id="offlineBanner"><i class="fas fa-triangle-exclamation"></i> Android Bridge غير متاح؛ لن تُحفظ أو تُعرض بيانات تجارية بديلة</div>
    <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>

    <header class="top-bar">
        <div class="header-top">
            <div class="top-title"><h2><i class="fas fa-chart-area"></i> التنبؤات والتحليلات</h2></div>
            <div class="header-actions">
                <button type="button" class="icon-btn" id="themeToggle" title="تبديل الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button type="button" class="icon-btn" onclick="goHome()" title="رجوع"><i class="fas fa-arrow-right"></i></button>
                <button type="button" class="icon-btn" onclick="openReport()" title="التقرير"><i class="fas fa-chart-bar"></i></button>
            </div>
        </div>
        <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="searchInput" type="search" placeholder="ابحث في البيانات..." autocomplete="off"></div>
        <div class="filter-chips" id="filterChips" aria-label="الفلاتر"></div>
    </header>

    <main class="page-container">
        <section class="stats-grid" id="statsGrid">
            <article class="stat-card"><div class="stat-icon blue"><i class="fas fa-chart-area"></i></div><div class="stat-value" id="statCount">—</div><div class="stat-label">عدد السجلات المعروضة</div></article>
            <article class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="statActive">—</div><div class="stat-label">نشط / مكتمل</div></article>
            <article class="stat-card"><div class="stat-icon orange"><i class="fas fa-calculator"></i></div><div class="stat-value" id="statTotal">—</div><div class="stat-label">المجموع الرقمي المتاح</div></article>
            <article class="stat-card"><div class="stat-icon purple"><i class="fas fa-clock"></i></div><div class="stat-value" id="statUpdated">—</div><div class="stat-label">آخر تحديث</div></article>
        </section>

        <section class="data-panel">
            <div class="section-title"><h3><i class="fas fa-chart-area"></i> التنبؤات والتحليلات</h3><span class="count-badge" id="itemCount">0</span></div>
            <div class="cards-container" id="cardsContainer"></div>
        </section>
    </main>

    <button type="button" class="fab" id="fab" title="إضافة"><i class="fas fa-plus"></i></button>

    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>

    <aside class="sidebar" id="sidebar"><div class="sidebar-content">
        <button type="button" class="sidebar-btn" onclick="reloadData()"><i class="fas fa-sync-alt"></i><span>تحديث</span></button>
        <button type="button" class="sidebar-btn" onclick="openReport()"><i class="fas fa-file-alt"></i><span>تقارير</span></button>
        <button type="button" class="sidebar-btn" onclick="exportData()"><i class="fas fa-file-export"></i><span>تصدير</span></button>
        <button type="button" class="sidebar-btn" onclick="window.print()"><i class="fas fa-print"></i><span>طباعة</span></button>
        <button type="button" class="sidebar-btn" onclick="goHome()"><i class="fas fa-home"></i><span>رجوع</span></button>
    </div></aside>

    <nav class="bottom-nav" id="bottomNav" aria-label="التقارير والعمليات"></nav>

    <div class="modal-overlay" id="formModal" onclick="closeModal(event,'formModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">إضافة سجل</h3><button type="button" class="modal-close" onclick="closeModal(null,'formModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><form id="recordForm" class="form-grid"></form></div>
        <div class="modal-footer"><button type="button" class="btn primary" id="saveBtn"><i class="fas fa-save"></i> حفظ فعلي</button><button type="button" class="btn" onclick="closeModal(null,'formModal')">إلغاء</button></div>
    </div></div>

    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event,'detailsModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تفاصيل السجل</h3><button type="button" class="modal-close" onclick="closeModal(null,'detailsModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body" id="detailsBody"></div>
    </div></div>

    <div class="modal-overlay" id="reportModal" onclick="closeModal(event,'reportModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تقرير التنبؤات والتحليلات</h3><button type="button" class="modal-close" onclick="closeModal(null,'reportModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><div class="form-grid"><div class="form-group"><label class="form-label">من تاريخ</label><input class="form-input" type="date" id="reportFrom"></div><div class="form-group"><label class="form-label">إلى تاريخ</label><input class="form-input" type="date" id="reportTo"></div></div><div class="action-row"><button type="button" class="btn primary" onclick="generateReport()"><i class="fas fa-cog"></i> توليد من المصدر</button><button type="button" class="btn" onclick="exportData()"><i class="fas fa-file-export"></i> Excel/CSV</button><button type="button" class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة/PDF</button></div><div id="reportResults" class="report-results" style="margin-top:14px"></div></div>
    </div></div>

    <div class="modal-overlay" id="aiModal" onclick="closeModal(event,'aiModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><h3 class="modal-title">المساعد الذكي</h3><button type="button" class="modal-close" onclick="closeModal(null,'aiModal')"><i class="fas fa-times"></i></button></div><div class="modal-body"><textarea class="form-input" id="aiPrompt" rows="4" placeholder="اكتب سؤالك..."></textarea><div class="action-row"><button class="btn primary" type="button" onclick="askAI()">إرسال</button></div><div class="ai-output" id="aiOutput"></div></div></div></div>

    <div class="toast" id="toast"><div class="toast-icon"><i class="fas fa-check"></i></div><span id="toastMessage"></span></div>

    <script>
    (() => {
        'use strict';
        const CFG = {"title":"التنبؤات والتحليلات","icon":"fa-chart-area","module":"reports","listMethod":"getPredictionRecords","listArgs":["{}"],"fields":[{"label":"prediction type","key":"prediction_type","type":"text","required":true,"placeholder":""},{"label":"entity type","key":"entity_type","type":"text","required":false,"placeholder":""},{"label":"entity id","key":"entity_id","type":"number","required":false,"placeholder":""},{"label":"prediction date","key":"prediction_date","type":"date","required":true,"placeholder":""},{"label":"predicted value","key":"predicted_value","type":"number","required":false,"placeholder":""},{"label":"confidence interval low","key":"confidence_interval_low","type":"text","required":false,"placeholder":""},{"label":"confidence interval high","key":"confidence_interval_high","type":"text","required":false,"placeholder":""},{"label":"actual value","key":"actual_value","type":"number","required":false,"placeholder":""},{"label":"model version","key":"model_version","type":"number","required":false,"placeholder":""}],"valueFields":["predicted_value","actual_value"],"titleFields":["prediction_type","entity_type","entity_id"],"subtitleFields":["prediction_type","entity_type","entity_id","prediction_date","predicted_value","confidence_interval_low","confidence_interval_high","actual_value"],"createMethod":"savePredictionRecord","updateMethod":"updatePredictionRecord","deleteMethod":"deletePredictionRecord","note":"","mode":"list","objectMode":false,"updateAction":null,"reportKind":"operational:Prediction","aiMethod":null,"reports":["الكل","قيد التنبؤ","مُحقَّقة","دقة عالية","دقة منخفضة"],"resolveMethod":null,"operationKey":"predictions"};
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: '0', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => new Date().toISOString().slice(0,10);
        function toast(message, bad=false) {
            const node=$('toast');
            const msgEl = $('toastMessage');
            if (msgEl) msgEl.textContent = message;
            else node.textContent = message;
            node.className='toast show' + (bad ? ' error' : '');
            clearTimeout(node._timer);
            node._timer=setTimeout(()=>node.classList.remove('show'),3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) { if (raw == null) throw new Error('لم يرجع الجسر نتيجة'); const value=typeof raw==='string'?JSON.parse(raw):raw; if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية'); return value; }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method,args=[]) { if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد '+method+' غير متاح في Android Bridge')); try { return Promise.resolve(parse(bridge[method](...args))); } catch (error) { return Promise.reject(error); } }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({limit: 200, search: $('searchInput').value || ''})];
            if (CFG.reportKind === 'balanceSheet') return [today(), 0];
            if (CFG.reportKind === 'eod') return [];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw=dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val])=>({key,value:val}));
            if (raw && typeof raw === 'object') return [raw];
            return [];
        }
        function field(row, names) { for (const name of (names||[])) { if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name]; } return ''; }
        function titleOf(row) { return field(row, CFG.titleFields) || field(row,['name','title','label','id','key']) || 'سجل بلا اسم'; }
        function subtitleOf(row) { return (CFG.subtitleFields||[]).map(k => { const v=row&&row[k]; return v===undefined||v===null||v===''?null:k+': '+v; }).filter(Boolean).join(' · '); }
        function idOf(row) { return field(row,['id','_id','vehicle_id','pump_id','tank_id','payment_id','shift_id','sale_id','request_id','asset_id','employee_id']); }
        function numeric(v) { const n=Number(v); return Number.isFinite(n)?n:0; }
        function setDateDefaults() { $('reportFrom').value = $('reportFrom').value || today(); $('reportTo').value = $('reportTo').value || today(); }
        function renderFilters() {
            const labels=CFG.reports||['الكل','قيد التنبؤ','مُحقَّقة','دقة عالية','دقة منخفضة'];
            $('filterChips').innerHTML=labels.map((label,i)=>`<button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">${esc(label)}</button>`).join('');
            document.querySelectorAll('#filterChips [data-filter]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('#filterChips .filter-chip').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.filter=btn.dataset.filter; applyFilter(); }));
            $('bottomNav').innerHTML=labels.slice(0,5).map((label,i)=>`<button type="button" class="nav-item ${i===0?'active':''}" data-bottom-filter="${i}"><i class="fas ${i===0?'fa-list':i===1?'fa-hourglass-half':i===2?'fa-check-circle':i===3?'fa-bullseye':'fa-triangle-exclamation'}"></i><span>${esc(label)}</span></button>`).join('');
            document.querySelectorAll('#bottomNav [data-bottom-filter]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('#bottomNav .nav-item').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.filter=btn.dataset.bottomFilter; applyFilter(); }));
        }
        function applyFilter() {
            const q=($('searchInput').value||'').trim().toLowerCase();
            const filter=String(state.filter||'0');
            const matchesFilter=row=>{ if(filter==='0')return true; const status=String(field(row,['status','state','prediction_status'])||'').toLowerCase(); const confidence=Number(field(row,['confidence','confidence_score','confidence_level'])||0); if(filter==='1')return ['pending','forecast','predicted','قيد التنبؤ','قيد التنفيذ'].includes(status)||!status; if(filter==='2')return ['actual','realized','completed','verified','محققة','متحققة'].includes(status)||row.actual_value!==undefined&&row.actual_value!==null; if(filter==='3')return confidence>=0.8||String(field(row,['confidence_level'])||'').toLowerCase()==='high'; if(filter==='4')return confidence>0&&confidence<0.5||String(field(row,['confidence_level'])||'').toLowerCase()==='low'; return true;};
            state.filtered=state.rows.filter(row=>{ const text=JSON.stringify(row||{}).toLowerCase(); return matchesFilter(row)&&(!q || text.includes(q)); });
            renderCards();
        }
        function renderStats() {
            const rows=state.filtered; $('statCount').textContent=rows.length.toLocaleString('ar'); $('itemCount').textContent=rows.length.toLocaleString('ar');
            const active=rows.filter(row=>['active','open','pending','completed','مفتوحة','نشط','قيد التنفيذ'].includes(String(field(row,['status','state','is_active'])))).length;
            $('statActive').textContent=active.toLocaleString('ar');
            let total=0; (CFG.valueFields||[]).forEach(k=>total += rows.reduce((sum,row)=>sum+numeric(row&&row[k]),0)); $('statTotal').textContent=total?total.toLocaleString('ar',{maximumFractionDigits:2}):'—';
            $('statUpdated').textContent=state.loadedAt?state.loadedAt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}):'—';
        }
        function renderCards() {
            renderStats(); const box=$('cardsContainer');
            if (!state.filtered.length) { box.innerHTML=`<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`; return; }
            box.innerHTML=state.filtered.map((row,index)=>{
                const id=esc(idOf(row)||index); const fields=(CFG.subtitleFields||[]).filter(k=>row && row[k]!==undefined && row[k]!==null && row[k]!=='').slice(0,8);
                const value=(CFG.valueFields||[]).map(k=>numeric(row&&row[k])).filter(v=>v!==0).reduce((a,b)=>a+b,0);
                const buttons=`<div class="action-row"><button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>${CFG.updateMethod?`<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>`:''}${CFG.resolveMethod?`<button class="btn" type="button" data-resolve="${id}"><i class="fas fa-check"></i> اعتماد/حل</button>`:''}${CFG.deleteMethod?`<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>`:''}</div>`;
                return `<article class="data-card"><div class="data-card-head"><div style="flex:1"><div class="data-card-title">${esc(titleOf(row))}</div><div class="data-card-subtitle">${esc(subtitleOf(row))}</div></div>${value?`<div class="data-card-value">${value.toLocaleString('ar',{maximumFractionDigits:2})}</div>`:''}</div><div class="data-fields">${fields.map(k=>`<div class="data-field"><span>${esc(k)}</span><strong>${esc(row[k])}</strong></div>`).join('')}</div>${buttons}</article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRow(findRow(b.dataset.delete))));
            box.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>resolveRow(findRow(b.dataset.resolve))));
        }
        function findRow(id) { return state.rows.find((row,index)=>String(idOf(row)||index)===String(id)); }
        function openDetails(id) { const row=findRow(id); if(!row)return; $('detailsBody').innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-item"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}</div><details style="margin-top:14px"><summary>JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row,null,2))}</pre></details>`; openModal(null,'detailsModal'); }
        function inputHtml(def,row) { const value=row&&row[def.key]!==undefined?row[def.key]:''; const req=def.required?'required':''; const placeholder=def.placeholder?`placeholder="${esc(def.placeholder)}"`:''; if(def.type==='textarea')return `<div class="form-group full"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`; if(def.type==='select')return `<div class="form-group"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><select class="form-input" data-key="${esc(def.key)}" ${req}><option value="">اختر...</option><option value="active">نشط</option><option value="inactive">غير نشط</option><option value="open">مفتوح</option><option value="pending">معلق</option><option value="cash">نقدي</option><option value="credit">آجل</option><option value="morning">صباحية</option><option value="evening">مسائية</option><option value="night">ليلية</option><option value="in">إيراد</option><option value="out">مصروف</option><option value="high">عالية</option><option value="medium">متوسطة</option><option value="low">منخفضة</option><option value="completed">مكتمل</option></select></div>`; return `<div class="form-group ${def.type==='datetime-local'?'full':''}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`; }
        function openForm(row=null) { if(!CFG.createMethod && !CFG.updateMethod){toast('لا توجد عملية كتابة مدعومة لهذه الشاشة في العقد الحالي',true);return;} state.editing=row; $('formTitle').textContent=row?'تعديل السجل':'إضافة سجل جديد'; $('recordForm').innerHTML=(CFG.fields||[]).map(def=>inputHtml(def,row)).join(''); if(row) (CFG.fields||[]).forEach(def=>{const el=document.querySelector(`[data-key="${CSS.escape(def.key)}"]`); if(el&&def.type==='select')el.value=row[def.key]??'';}); $('formModal').classList.add('show'); }
        function collectForm() { const payload={}; document.querySelectorAll('#recordForm [data-key]').forEach(el=>{ let value=el.value; const type=el.type; if(type==='number') value=value===''?0:Number(value); payload[el.dataset.key]=value; }); if(CFG.module==='vehicles' && CFG.title==='إدارة السائقين') payload.party_type='driver'; return payload; }
        async function saveForm() { const form=$('recordForm'); if(!form.reportValidity())return; const payload=collectForm(); setLoading(true); try { let result; if(state.editing && CFG.updateMethod) { const id=idOf(state.editing); if(!id)throw new Error('معرف السجل غير صالح'); if(CFG.updateAction==='tankQuantity') result=await invoke(CFG.updateMethod,[Number(id),Number(payload.current_quantity||0)]); else if(CFG.updateAction==='maintenanceStatus') result=await invoke(CFG.updateMethod,[JSON.stringify({request_id:Number(id),status:payload.status||'completed'})]); else if(CFG.updateAction==='endShift') result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); else result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); } else if(CFG.createMethod) { if(CFG.createMethod==='saveBalanceSheet') result=await invoke(CFG.createMethod,[today(),0]); else result=await invoke(CFG.createMethod,[JSON.stringify(payload)]); } else throw new Error('لا توجد عملية حفظ مدعومة'); parse(result); toast('تم تنفيذ العملية والتحقق من نجاحها'); closeModal(null,'formModal'); await reloadData(); } catch(error) { toast(error.message||'فشلت العملية',true); } finally { setLoading(false); } }
        async function deleteRow(row) { const id=row&&idOf(row); if(!id||!CFG.deleteMethod)return; if(!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟'))return; setLoading(true); try { const result=await invoke(CFG.deleteMethod,[Number(id)]); parse(result); toast('تم الحذف فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل الحذف',true); } finally { setLoading(false); } }
        async function resolveRow(row) { const id=row&&idOf(row); if(!id||!CFG.resolveMethod)return; const note=prompt('أدخل ملاحظة الاعتماد/الحل إن لزم:',''); if(note===null)return; setLoading(true); try { const result=await invoke(CFG.resolveMethod,[Number(id),String(note)]); parse(result); toast('تم تنفيذ العملية فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل تنفيذ العملية',true); } finally { setLoading(false); } }
        async function reloadData() { if(CFG.mode==='unsupported'||CFG.mode==='ai'){ renderCards(); return; } if(CFG.mode==='backup'){ loadBackupHistory(); return; } if(!CFG.listMethod){ renderCards(); return; } if(!bridge){ $('offlineBanner').classList.add('show'); renderCards(); return; } setLoading(true); try { const result=await invoke(CFG.listMethod,argsForLoad()); state.rows=rowsFrom(result); state.loadedAt=new Date(); $('offlineBanner').classList.remove('show'); applyFilter(); } catch(error) { state.rows=[]; state.loadedAt=new Date(); renderCards(); toast(error.message||'فشل تحميل البيانات',true); } finally { setLoading(false); } }
        function openModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.add('show'); }
        function closeModal(event,id) { if(event&&event.target!==event.currentTarget)return; if(!id){ document.querySelectorAll('.modal-overlay').forEach(el=>el.classList.remove('show')); return; } $(id).classList.remove('show'); }
        function openReport() { setDateDefaults(); $('reportResults').innerHTML='<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات المحملة من SQLite.</p></div>'; openModal(null,'reportModal'); }
        async function generateReport() { setLoading(true); try { let result; if(CFG.reportKind==='balanceSheet') result=await invoke('getBalanceSheet',[($('reportTo').value||today()),0]); else if(CFG.reportKind==='eod') result=await invoke('getEodReport',[]); else if(String(CFG.reportKind||'').startsWith('operational:')) { const suffix=String(CFG.reportKind).split(':')[1]; result=await invoke('generate'+suffix+'Report',[JSON.stringify({from_date:$('reportFrom').value||'',to_date:$('reportTo').value||'',search:$('searchInput').value||'',include_archived:true,limit:1000})]); } else result={data:state.filtered}; $('reportResults').innerHTML=renderReport(rowsFrom(result)); toast('تم توليد التقرير من المصدر الفعلي'); } catch(e) { toast(e.message||'فشل التقرير',true); } finally { setLoading(false); } }
        function renderReport(rows) { if(!rows.length)return '<div class="empty-state">لا توجد بيانات للتقرير.</div>'; return `<div class="data-fields">${rows.slice(0,100).map(row=>`<div class="data-field"><span>${esc(titleOf(row))}</span><strong>${esc(subtitleOf(row)||JSON.stringify(row))}</strong></div>`).join('')}</div>`; }
        function exportData() { const rows=state.filtered; if(!rows.length){toast('لا توجد بيانات حقيقية لتصديرها',true);return;} const keys=[...new Set(rows.flatMap(row=>Object.keys(row||{})))]; const csv='\ufeff'+[keys, ...rows.map(row=>keys.map(k=>String(row[k]??'').replace(/"/g,'""')))].map(row=>row.map(v=>`"${v}"`).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='{filename}.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً'); }
        async function askAI() { if(CFG.aiMethod!=='sendToAI'){toast('المساعد غير متاح لهذا المسار',true);return;} const prompt=($('aiPrompt').value||'').trim(); if(!prompt){toast('اكتب السؤال أولاً',true);return;} if(!bridge||typeof bridge.sendToAI!=='function'){toast('عقد المساعد غير متاح في Android Bridge',true);return;} $('aiOutput').textContent='جاري انتظار رد Android...'; window.onAIResponse=(payload)=>{ const result=typeof payload==='string'?JSON.parse(payload):payload; if(result&&result.success){ $('aiOutput').textContent=result.response||'عاد الرد دون نص'; toast('وصل رد المساعد فعلياً'); } else { $('aiOutput').textContent=result&&result.error||'فشل رد المساعد'; toast($('aiOutput').textContent,true); } setLoading(false); }; setLoading(true); try { const started=parse(bridge.sendToAI(prompt)); if(started.status!=='processing') window.onAIResponse(started); } catch(e) { setLoading(false); $('aiOutput').textContent=e.message; toast(e.message,true); } }
        function goHome() { window.location.href='../main.html'; }
        function applyTheme() { const saved=localStorage.getItem('theme')||'light'; if(saved==='dark')document.documentElement.dataset.theme='dark'; $('themeIcon').className=saved==='dark'?'fas fa-sun':'fas fa-moon'; }
        function toggleTheme() { const dark=document.documentElement.dataset.theme==='dark'; if(dark)delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme='dark'; localStorage.setItem('theme',dark?'light':'dark'); $('themeIcon').className=dark?'fas fa-moon':'fas fa-sun'; }
        function initSpecial() {
            if(CFG.mode==='unsupported'){ $('fab').classList.add('hidden'); }
            if(CFG.mode==='ai'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="settings-wrap"><div class="settings-card"><h3>أرسل طلباً إلى المساعد</h3><p class="data-card-subtitle">لا تُحفظ الرسالة في localStorage ولا تُعرض نتيجة نجاح قبل عودة الجسر.</p><div class="action-row"><button class="btn primary" onclick="openModal(null,\'aiModal\')">فتح المساعد</button></div></div></div>'; }
            if(CFG.mode==='backup'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="utility-grid"><div class="utility-card"><h3>نسخة قاعدة البيانات</h3><p>تنفيذ النسخ عبر Android ثم استقبال callback الفعلي.</p><button class="btn primary" onclick="startAsync(\'backupDatabase\',\'onBackupResult\')">إنشاء نسخة</button></div><div class="utility-card"><h3>تصدير كل البيانات</h3><p>يستخدم exportAllData ويعرض نتيجة callback.</p><button class="btn primary" onclick="startAsync(\'exportAllData\',\'onExportAllResult\')">بدء التصدير</button></div><div class="utility-card"><h3>معلومات قاعدة البيانات</h3><p id="dbInfo">اضغط لقراءة المعلومات الفعلية.</p><button class="btn" onclick="loadDbInfo()">قراءة</button></div></div>'; }
        }
        function startAsync(method,callbackName){ if(!bridge||typeof bridge[method]!=='function'){toast('العقد '+method+' غير متاح',true);return;} window[callbackName]=(value)=>{const parsed=typeof value==='string'?JSON.parse(value):value; if(parsed.success)toast(parsed.message||'اكتملت العملية فعلياً'); else toast(parsed.error||'فشلت العملية',true);}; try{const result=parse(bridge[method]()); if(result.status==='processing')toast('بدأت العملية؛ انتظار نتيجة Android...');}catch(e){toast(e.message,true);} }
        async function loadDbInfo(){try{const result=await invoke('getDatabaseInfo',[]); $('dbInfo').textContent=JSON.stringify(dataOf(result));}catch(e){$('dbInfo').textContent=e.message;toast(e.message,true);}}
        async function loadBackupHistory(){if(CFG.mode!=='backup'||!bridge||typeof bridge.getBackupHistoryRecords!=='function')return;try{const result=await invoke('getBackupHistoryRecords',[JSON.stringify({limit:100})]);const rows=rowsFrom(result);$('backupHistory').innerHTML=rows.length?rows.map(row=>`<div class="data-card"><strong>${esc(row.file_name||row.backup_type||row.id)}</strong><div class="data-card-subtitle">${esc([row.status,row.started_at,row.completed_at,row.file_size_mb,row.storage_location].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="empty-state">لا توجد سجلات نسخ في SQLite.</div>';}catch(e){$('backupHistory').textContent=e.message;toast(e.message,true);}}
        $('searchInput').addEventListener('input',applyFilter);
        $('themeToggle').addEventListener('click',toggleTheme);
        $('fab').addEventListener('click',()=>openForm());
        $('saveBtn').addEventListener('click',saveForm);
        // Sidebar: فتح/إغلاق + إخفاء اللسان عند الفتح + إغلاق عند النقر خارجها أو على أي زر داخلها
        $('sidebarToggle').addEventListener('click',(e)=>{e.stopPropagation();const side=$('sidebar');const toggle=$('sidebarToggle');side.classList.toggle('open');toggle.classList.toggle('hidden');});
        $('sidebar').addEventListener('click',(e)=>{ if(e.target.closest('.sidebar-btn')){ const side=$('sidebar'); const toggle=$('sidebarToggle'); side.classList.remove('open'); toggle.classList.remove('hidden'); } });
        document.addEventListener('click',(e)=>{ const side=$('sidebar'); const toggle=$('sidebarToggle'); if(side.classList.contains('open') && !side.contains(e.target) && !toggle.contains(e.target)){ side.classList.remove('open'); toggle.classList.remove('hidden'); } });
        document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay').forEach(x=>x.classList.remove('show'));});
        window.addEventListener('online',()=>toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
        window.addEventListener('offline',()=>$('offlineBanner').classList.add('show'));
        Object.assign(window, {goHome, openReport, generateReport, exportData, reloadData, openForm, saveForm, openModal, closeModal, startAsync, loadDbInfo, askAI});
        applyTheme(); renderFilters(); initSpecial(); if(CFG.mode!=='unsupported'&&CFG.mode!=='backup'&&CFG.mode!=='ai')reloadData(); else renderCards();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
</html>
