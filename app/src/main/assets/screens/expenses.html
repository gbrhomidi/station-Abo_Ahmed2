<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المصروفات</title><link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css"><style>
:root{--p:#b8860b;--ink:#172033;--muted:#64748b;--surface:#fff;--soft:#f8fafc;--line:#e2e8f0;--danger:#b42318;--ok:#13795b}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Cairo,Arial,sans-serif;direction:rtl}.app{max-width:1280px;margin:auto;padding-bottom:42px}.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h1{font-size:1.18rem;margin:0}.head p{font-size:.72rem;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.select,.input{font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;color:var(--ink)}.btn{cursor:pointer}.btn:hover{border-color:var(--p);color:var(--p)}.btn.primary{background:var(--p);border-color:var(--p);color:#fff}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}.stat span{display:block;font-size:.7rem;color:var(--muted)}.stat strong{display:block;font-size:1.3rem;margin-top:4px}.panel{margin:0 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.panel-title h2{font-size:1rem;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;background:#fff}.card-head{display:flex;justify-content:space-between;gap:10px}.title{font-weight:800}.sub{font-size:.76rem;color:var(--muted);line-height:1.8}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:10px}.field{background:#f8fafc;border-radius:9px;padding:8px;min-width:0}.field small{display:block;color:var(--muted);font-size:.67rem}.field b{display:block;overflow-wrap:anywhere;font-size:.8rem;margin-top:2px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px}.empty,.error{text-align:center;padding:35px;color:var(--muted);line-height:2}.error{color:var(--danger)}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:var(--surface);width:min(700px,100%);max-height:90vh;overflow:auto;border-radius:16px}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.dialog-body{padding:16px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted)}.form .full{grid-column:1/-1}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}.notice{margin:16px;padding:12px 14px;border-radius:12px;background:#fff8df;color:#725d00;font-size:.78rem;line-height:1.8}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.form .full{grid-column:auto}}
.dark{--surface:#111827;--soft:#0b1220;--ink:#e5e7eb;--muted:#94a3b8;--line:#334155}.loading{position:fixed;inset:0;background:#0005;z-index:30;display:grid;place-items:center;color:white;font-size:1.3rem}.toast{position:fixed;bottom:22px;left:22px;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:40;font-size:.78rem}.toast.show{display:block}[hidden]{display:none!important}</style></head><body data-module="module-009"><div id="busy" class="loading" hidden>جاري تنفيذ العملية...</div><div id="offline" class="notice" hidden>تعذر الوصول إلى Android Bridge؛ لم يتم عرض أو إنشاء بيانات بديلة.</div><div class="app"><header class="topbar"><div class="head"><div><h1><i class="fas fa-file-invoice-dollar"></i> المصروفات</h1><p>إدارة المصروفات وخصمها من الصندوق مباشرة</p></div><div class="actions"><button class="btn" id="theme">الوضع</button><button class="btn" id="home">رجوع</button><button class="btn" id="reload">تحديث</button><button class="btn" id="export">تصدير الصفحة</button><button class="btn primary" id="add">إضافة</button></div></div><div class="filters"><input class="input" id="search" type="search" placeholder="بحث في SQLite..." aria-label="بحث"><select class="select" id="sort"><option value="id">الأحدث</option><option value="created_at">التاريخ</option><option value="status">الحالة</option><option value="amount">القيمة</option></select><select class="select" id="dir"><option value="desc">تنازلي</option><option value="asc">تصاعدي</option></select><select class="select" id="status" data-filter><option value="">كل الحالات</option><option value="paid">مدفوعة</option><option value="pending">معلقة</option><option value="cancelled">ملغاة</option></select><input class="input" id="from" type="date" data-filter aria-label="من تاريخ"><input class="input" id="to" type="date" data-filter aria-label="إلى تاريخ"></div></header><section class="stats"><div class="stat"><span>السجلات في الصفحة</span><strong id="statPage">—</strong></div><div class="stat"><span>إجمالي النتائج</span><strong id="statTotal">—</strong></div><div class="stat"><span>قيمة الصفحة</span><strong id="statAmount">—</strong></div></section><main class="panel"><div class="panel-title"><h2>النتائج المرقمة من قاعدة البيانات</h2><span id="count">0</span></div><div id="list"></div><div class="pager"><button class="btn" id="prev">السابق</button><span id="pageInfo">—</span><button class="btn" id="next">التالي</button></div></main></div><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog"><div class="dialog-head"><strong id="dialogTitle">عملية</strong><button class="btn" onclick="closeModal()">إغلاق</button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-foot" id="modalFoot"><button class="btn primary" id="save">حفظ فعلي</button><button class="btn" id="cancel">إلغاء</button></div></div></div><div id="toast" class="toast"></div><script>const CFG={'list':'getExpensesPage','create':'saveExpenseRecord','file':'expenses','formTitle':'تسجيل مصروف جديد','form':'<label>فئة المصروف<select class="select" data-k="expense_category_id" required></select></label><label>المبلغ<input class="input" data-k="amount" type="number" min="0.01" step="0.01" required></label><label>المدفوع له<input class="input" data-k="payee_name" required></label><label>دفع من صندوق<select class="select" data-k="cash_box_id" required></select></label><label class="full">البيان/الوصف<textarea class="input" data-k="description"></textarea></label>'};
const bridge=window.AndroidInterface;const $=id=>document.getElementById(id);const esc=v=>String(v==null?'—':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={rows:[],payload:null,page:0,size:25,total:0,pages:0,busy:false,editing:null};
function parse(raw){if(raw==null)throw Error('لم يُرجع Android Bridge نتيجة');const v=typeof raw==='string'?JSON.parse(raw):raw;if(v&&v.success===false)throw Error(v.error||v.message||'فشلت العملية');return v}
function invoke(name,args=[]){if(!bridge||typeof bridge[name]!=='function')throw Error('العقد '+name+' غير متاح في Android Bridge');return parse(bridge[name](...args))}
function payloadOf(v){let p=v&&Object.prototype.hasOwnProperty.call(v,'data')?v.data:v;while(p&&p.data&&!Array.isArray(p.data)&&!Array.isArray(p.rows)&&typeof p.data==='object')p=p.data;return p}
function rowsOf(v){const p=payloadOf(v);if(Array.isArray(p))return p;if(p&&Array.isArray(p.rows))return p.rows;if(p&&Array.isArray(p.data))return p.data;return []}
function metaOf(v){const p=payloadOf(v)||{};return p.meta||p.metadata||p}
function toast(msg,bad=false){const n=$('toast');n.textContent=msg;n.style.background=bad?'#b42318':'#172033';n.classList.add('show');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('show'),3200)}
function setBusy(v){state.busy=v;$('busy').hidden=!v}
function params(){const p={limit:state.size,offset:state.page*state.size,search:$('search').value||'',sort_by:$('sort').value||'id',sort_dir:$('dir').value||'desc'};if($('status'))p.status=$('status').value||'';if($('payment'))p.payment_method=$('payment').value||'';if($('from'))p.from_date=$('from').value||'';if($('to'))p.to_date=$('to').value||'';return p}
function field(row,keys){for(const k of keys){if(row&&row[k]!==undefined&&row[k]!==null&&row[k]!=='')return row[k]}return ''}
function label(row){return field(row,['payment_code','receipt_number','expense_code','budget_name','deposit_code','box_name','bank_name','account_name','id'])||'سجل'}
function status(row){return field(row,['status','payment_status'])||'—'}
function render(){const box=$('list');if(!state.rows.length){box.innerHTML='<div class="empty">لا توجد سجلات مطابقة في SQLite ضمن نطاق المحطة الحالية.</div>'}else{box.innerHTML=state.rows.map((r,i)=>{const id=field(r,['id']);return `<article class="card"><div class="card-head"><div><div class="title">${esc(label(r))}</div><div class="sub">${esc(field(r,['customer_name','supplier_name','payee_name','bank_account_name','created_at','date']))}</div></div><strong>${esc(status(r))}</strong></div><div class="fields">${Object.entries(r).filter(([k,v])=>v!==null&&v!==''&&!['station_id','uuid','id'].includes(k)).slice(0,8).map(([k,v])=>`<div class="field"><small>${esc(k)}</small><b>${esc(typeof v==='object'?JSON.stringify(v):v)}</b></div>`).join('')}</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="details(${JSON.stringify(String(id))})">عرض التفاصيل</button></div></article>`}).join('')}
$('count').textContent=state.total.toLocaleString('ar');$('pageInfo').textContent=state.pages?`صفحة ${state.page+1} من ${state.pages}`:'لا صفحات';$('prev').disabled=state.page<=0;$('next').disabled=state.page+1>=state.pages;renderStats()}
function renderStats(){const nums=state.rows.reduce((a,r)=>{a.amount+=Number(field(r,['amount','total_amount','current_balance'])||0);return a},{amount:0});$('statPage').textContent=state.rows.length.toLocaleString('ar');$('statTotal').textContent=state.total.toLocaleString('ar');$('statAmount').textContent=nums.amount.toLocaleString('ar',{maximumFractionDigits:2})}
async function reload(){if(state.busy)return;setBusy(true);try{const result=invoke(CFG.list,[JSON.stringify(params())]);const p=payloadOf(result);state.rows=rowsOf(result);state.payload=p;const m=metaOf(result);state.total=Number(m.total_count??m.total??state.rows.length);state.pages=Number(m.total_pages??(state.total?Math.ceil(state.total/state.size):0));render();$('offline').hidden=true}catch(e){state.rows=[];state.total=0;state.pages=0;render();$('offline').hidden=false;toast(e.message,true)}finally{setBusy(false)}}
function details(id){const r=state.rows.find(x=>String(field(x,['id']))===String(id));if(!r)return;$('dialogTitle').textContent='تفاصيل السجل';$('dialogBody').innerHTML='<pre style="direction:ltr;text-align:left;white-space:pre-wrap">'+esc(JSON.stringify(r,null,2))+'</pre>';$('modalFoot').hidden=true;$('modal').classList.add('show')}
function closeModal(){ $('modal').classList.remove('show') }
function openForm(){if(!CFG.create){toast('لا توجد عملية إنشاء مدعومة',true);return}state.editing=null;$('dialogTitle').textContent=CFG.formTitle;$('dialogBody').innerHTML=CFG.form; $('modalFoot').hidden=false;loadRelations();$('modal').classList.add('show')}
function value(id){const n=$(id);return n&&n.value!==''?n.value:null}
function collect(){const p={};document.querySelectorAll('#dialogBody [data-k]').forEach(e=>{let v=e.value;if(e.type==='number')v=v===''?0:Number(v);p[e.dataset.k]=v});return p}
async function save(){if(!CFG.create)return;setBusy(true);try{const p=collect();const result=invoke(CFG.create,[JSON.stringify(p)]);parse(result);closeModal();toast('تم حفظ العملية فعلياً في SQLite وإرسال SMS إذا لزم الأمر');await reload()}catch(e){toast(e.message,true)}finally{setBusy(false)}}
async function loadRelations(){if(!bridge)return;try{if(document.querySelector('[data-k="customer_party_id"]')){const p=rowsOf(invoke('getCustomers'));const s=$('[data-k="customer_party_id"]');s.innerHTML='<option value="">بدون عميل</option>'+p.map(x=>`<option value="${esc(x.id||x.party_id)}">${esc(x.commercial_name||x.commercial_name_ar||x.name||x.id)}</option>`).join('')}if(document.querySelector('[data-k="supplier_party_id"]')){const p=rowsOf(invoke('getSuppliers'));const s=$('[data-k="supplier_party_id"]');s.innerHTML='<option value="">بدون مورد</option>'+p.map(x=>`<option value="${esc(x.id||x.party_id)}">${esc(x.commercial_name||x.commercial_name_ar||x.name||x.id)}</option>`).join('')}if(document.querySelector('[data-k="cash_box_id"]')){const p=rowsOf(invoke('getCashBoxRecords'));const s=$('[data-k="cash_box_id"]');s.innerHTML='<option value="">بدون صندوق</option>'+p.map(x=>`<option value="${esc(x.id)}">${esc(x.box_name||x.id)}</option>`).join('')}if(document.querySelector('[data-k="bank_account_id"]')){const p=rowsOf(invoke('getBankAccountRecords'));const s=$('[data-k="bank_account_id"]');s.innerHTML='<option value="">بدون حساب بنكي</option>'+p.map(x=>`<option value="${esc(x.id)}">${esc(x.account_name||x.id)}</option>`).join('')}if(document.querySelector('[data-k="expense_category_id"]')){const p=rowsOf(invoke('getExpenseCategoryRecords'));const s=$('[data-k="expense_category_id"]');s.innerHTML='<option value="">اختر الفئة</option>'+p.map(x=>`<option value="${esc(x.id)}">${esc(x.category_name||x.id)}</option>`).join('')}}catch(e){toast('تعذر تحميل العلاقات من SQLite: '+e.message,true)}}
function exportPage(){if(!state.rows.length){toast('لا توجد بيانات حقيقية لتصديرها',true);return}const keys=[...new Set(state.rows.flatMap(x=>Object.keys(x)))];const csv='\ufeff'+[keys,...state.rows.map(x=>keys.map(k=>String(x[k]??'').replace(/"/g,'""')))].map(row=>row.map(v=>'"'+v+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=CFG.file+'.csv';a.click()}
function goHome(){location.href='../main.html'}function toggleTheme(){document.documentElement.classList.toggle('dark')}
function setup(){document.querySelectorAll('[data-filter]').forEach(e=>e.addEventListener('change',()=>{state.page=0;reload()}));$('search').addEventListener('input',()=>{clearTimeout(state.t);state.t=setTimeout(()=>{state.page=0;reload()},350)});$('dir').addEventListener('change',()=>{state.page=0;reload()});$('prev').onclick=()=>{if(state.page>0){state.page--;reload()}};$('next').onclick=()=>{if(state.page+1<state.pages){state.page++;reload()}};$('reload').onclick=reload;$('export').onclick=exportPage;$('theme').onclick=toggleTheme;$('home').onclick=goHome;if(CFG.create)$('add').onclick=openForm;else $('add').hidden=true;$('save').onclick=save;$('cancel').onclick=closeModal;window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});reload()}
setup();</script></body></html>
