<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>إدارة المضخات – نظام محطة الوقود</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
<link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
<style>
/* ============================================================
   نظام الألوان الموحّد
   ============================================================ */
:root {
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;
    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --emerald-primary: #059669;
    --success: #059669;
    --danger: #dc2626;
    --warning: #d97706;
    --info: #2563eb;
    --purple: #7c3aed;
    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;
    --scrollbar-thumb: var(--gold-primary);
    --skeleton-bg: #e8e0d5;
    --skeleton-shine: #f5efe6;
    color-scheme: light;
}
[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);
    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --emerald-primary: #10b981;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --purple: #9b59b6;
    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;
    --scrollbar-thumb: var(--gold-primary);
    --skeleton-bg: #1e293b;
    --skeleton-shine: #2d3a4f;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    direction: rtl;
    overflow-x: hidden;
    min-height: 100vh;
    padding: 0 0 100px 0;
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    -webkit-font-smoothing: antialiased;
    transition: background 0.35s ease, color 0.35s ease;
    touch-action: pan-y;
}
[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

.loading-indicator {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 3000; display: none; justify-content: center; align-items: center;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.loading-indicator.show { display: flex; }
.spinner {
    width: 56px; height: 56px;
    border: 4px solid rgba(200, 154, 18, 0.15);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.offline-banner {
    position: fixed; top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning), #f97316);
    color: #000; text-align: center; padding: 8px;
    font-size: 0.8rem; font-weight: 700; z-index: 2000;
    transform: translateY(-100%); transition: transform 0.3s;
}
.offline-banner.show { transform: translateY(0); }

/* ============================================================
   الشريط العلوي
   ============================================================ */
.top-bar {
    position: sticky; top: 0;
    display: flex; flex-direction: column;
    padding: 14px 18px 10px;
    background: var(--header-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-bottom: var(--silver-border);
    z-index: 100;
    transition: var(--transition);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    gap: 10px;
}
.header-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
}
.top-title { flex: 1; min-width: 150px; text-align: center; }
.top-title h2 {
    margin: 0; font-size: 1.35rem; font-weight: 900;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}
.top-title h2 i { -webkit-text-fill-color: initial; color: var(--gold-primary); font-size: 1.1rem; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary); display: flex;
    align-items: center; justify-content: center;
    cursor: pointer; transition: var(--transition);
    font-size: 1rem; position: relative;
    box-shadow: var(--silver-shadow);
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
}

.search-wrap { position: relative; }
.search-input {
    width: 100%; padding: 12px 44px 12px 16px;
    border-radius: 12px; border: var(--silver-border);
    background: var(--bg-glass); color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.88rem; outline: none;
    transition: var(--transition);
    box-shadow: var(--silver-shadow); text-align: center;
}
.search-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}
.search-wrap i {
    position: absolute; right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted); font-size: 0.9rem;
    pointer-events: none;
}

/* Filter chips */
.filter-chips {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 0; scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 8px 16px; border-radius: 999px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.78rem; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: var(--transition);
    display: inline-flex; align-items: center; gap: 6px;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    user-select: none;
}
.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
    background: var(--gold-primary); color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
}
.filter-chip .chip-count {
    background: rgba(0,0,0,0.1); padding: 1px 8px;
    border-radius: 10px; font-size: 0.7rem;
}
.filter-chip.active .chip-count { background: rgba(255,255,255,0.25); }

/* ============================================================
   Stats
   ============================================================ */
.stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 16px;
}
.stat-card {
    background: var(--bg-card); backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 18px 16px; position: relative;
    overflow: hidden; transition: var(--transition);
    text-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}
.stat-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; margin-bottom: 10px;
    border: var(--silver-border); background: var(--bg-glass-light);
    color: var(--gold-primary);
}
.stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
.stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
.stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
.stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
.stat-value {
    font-size: 1.6rem; font-weight: 900;
    margin: 4px 0 2px; color: var(--text-primary);
    direction: ltr; font-family: 'Inter', 'Arial', sans-serif;
    letter-spacing: -0.5px; line-height: 1.1; text-align: center;
}
.stat-label {
    font-size: 0.78rem; color: var(--text-muted);
    font-weight: 700; text-align: center;
}
@media (min-width: 768px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
}

/* ============================================================
   Data panel
   ============================================================ */
.page-container { max-width: 1280px; margin: 0 auto; padding: 0 0 90px; }
.data-panel {
    margin: 0 16px; padding: 16px;
    border-radius: var(--radius-card);
    background: var(--bg-card);
    border: var(--silver-border-strong);
    box-shadow: var(--silver-shadow), var(--shadow-card);
    backdrop-filter: blur(12px); position: relative; overflow: hidden;
}
.data-panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0.85;
}

/* Section title: view-modes أولاً ثم العنوان ثم العدّاد */
.section-title {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: space-between;
}
.section-title h3 {
    font-size: 1rem; font-weight: 800;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 8px;
    margin: 0;
    flex: 1;
    justify-content: center;
    text-align: center;
}
.section-title h3 i { color: var(--gold-primary); }
.section-title .count-badge {
    background: var(--gold-primary); color: #fff;
    border-radius: 30px; padding: 3px 12px;
    font-size: 0.75rem; font-weight: 900;
    border: var(--silver-border);
    flex-shrink: 0;
}

/* View modes (in section title) */
.view-modes {
    display: inline-flex; gap: 4px;
    background: var(--bg-glass);
    border: var(--silver-border); border-radius: 10px;
    padding: 3px;
    flex-shrink: 0;
}
.view-modes button {
    border: none; background: transparent;
    color: var(--text-muted); padding: 6px 10px;
    border-radius: 7px; cursor: pointer;
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem; font-weight: 700;
    display: flex; align-items: center; gap: 4px;
    transition: var(--transition);
    touch-action: manipulation;
    white-space: nowrap;
}
.view-modes button.active {
    background: var(--gold-primary); color: #fff;
    box-shadow: 0 2px 6px rgba(200, 154, 18, 0.3);
}
.view-modes button i { font-size: 0.78rem; }
.view-modes button span { display: none; }
@media (min-width: 480px) {
    .view-modes button span { display: inline; }
    .view-modes button { padding: 6px 12px; }
}

.cards-container { display: flex; flex-direction: column; gap: 12px; }

/* Card */
.bank-card {
    background: var(--bg-glass);
    backdrop-filter: blur(12px);
    border: var(--silver-border-strong);
    border-radius: var(--radius-card);
    padding: 16px 18px; position: relative;
    transition: var(--transition); cursor: pointer;
    box-shadow: var(--silver-shadow), var(--shadow-card);
}
.bank-card::before {
    content: ''; position: absolute; top: 0; right: 0;
    width: 4px; height: 100%;
    background: var(--gold-primary); opacity: 0.7;
    transition: var(--transition);
}
.bank-card:hover { border-color: var(--gold-primary); transform: translateY(-2px); }
.bank-card:active { transform: scale(0.98); }
.bank-card .card-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 10px;
}
.bank-card .card-avatar {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; font-weight: 800; color: white;
    flex-shrink: 0; border: var(--silver-border);
}
.bank-card .card-status {
    padding: 4px 12px; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700;
    border: var(--silver-border);
}
.card-status.active { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
.card-status.inactive { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }
.card-status.maintenance { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
.bank-card .card-name {
    font-size: 1rem; font-weight: 800;
    color: var(--text-primary); margin-bottom: 2px;
    text-align: center;
}
.bank-card .card-code {
    font-size: 0.75rem; color: var(--text-muted);
    font-family: 'Inter', 'Arial', monospace;
    margin-bottom: 8px; text-align: center; direction: ltr;
}
.bank-card .card-details {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 12px; margin: 8px 0 10px;
}
.bank-card .detail-item {
    font-size: 0.8rem; color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center;
    gap: 6px; padding: 6px 8px;
    border: var(--silver-border); border-radius: 8px;
    background: var(--bg-glass); text-align: center;
}
.bank-card .detail-item i { font-size: 0.8rem; color: var(--gold-primary); }
.bank-card .card-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
}
.bank-card .card-btn {
    flex: 1; min-width: 80px;
    padding: 9px 8px; border-radius: 10px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.75rem; font-weight: 700;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    gap: 5px; transition: var(--transition);
    box-shadow: var(--silver-shadow);
    touch-action: manipulation;
}
.bank-card .card-btn:active { transform: scale(0.95); }
.bank-card .card-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.bank-card .card-btn.danger:hover {
    background: rgba(220, 38, 38, 0.1); color: var(--danger);
    border-color: var(--danger);
}

/* Table view */
.table-container { overflow-x: auto; border-radius: 12px; border: var(--silver-border-strong); }
.data-table {
    width: 100%; border-collapse: collapse;
    font-size: 0.78rem; min-width: 640px;
}
.data-table th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 10px 8px; text-align: center;
    font-weight: 800; border-bottom: var(--silver-border-strong);
    position: sticky; top: 0;
    font-family: 'Cairo', 'Inter', sans-serif;
}
.data-table td {
    padding: 9px 8px; text-align: center;
    border-bottom: var(--silver-border);
    color: var(--text-secondary);
    font-weight: 600;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg-glass); }
.data-table .status-badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 999px; font-size: 0.7rem; font-weight: 700;
}
.data-table .actions-cell button {
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-secondary); width: 30px; height: 30px;
    border-radius: 8px; margin: 0 2px;
    cursor: pointer; transition: var(--transition);
}
.data-table .actions-cell button:hover {
    border-color: var(--gold-primary); color: var(--gold-primary);
}

/* Tree view */
.tree-container { display: flex; flex-direction: column; gap: 10px; }
.tree-station {
    background: var(--bg-glass);
    border: var(--silver-border-strong);
    border-radius: 14px; padding: 12px;
    box-shadow: var(--silver-shadow);
}
.tree-station-header {
    display: flex; align-items: center;
    gap: 10px; font-weight: 800;
    color: var(--gold-primary); cursor: pointer;
    padding: 4px 0; font-size: 0.95rem;
}
.tree-station-header .tree-count {
    background: var(--gold-primary); color: #fff;
    border-radius: 999px; padding: 1px 10px;
    font-size: 0.7rem; margin-right: auto;
}
.tree-tank {
    margin-right: 16px; margin-top: 8px;
    background: var(--bg-glass-light);
    border-radius: 12px; padding: 10px;
    border-right: 3px solid var(--info);
}
.tree-tank-header {
    font-weight: 700; color: var(--text-secondary);
    display: flex; align-items: center;
    gap: 6px; margin-bottom: 6px; font-size: 0.85rem;
}
.tree-pump {
    padding: 10px 12px; margin-right: 18px;
    background: var(--bg-card);
    border: var(--silver-border); border-radius: 10px;
    margin-top: 6px; display: flex;
    justify-content: space-between; align-items: center;
    cursor: pointer; transition: var(--transition);
}
.tree-pump:hover { border-color: var(--gold-primary); background: var(--bg-glass-light); }
.tree-pump .pump-name { font-weight: 700; color: var(--text-primary); font-size: 0.85rem; }
.tree-pump .pump-code {
    font-size: 0.7rem; color: var(--text-muted);
    font-family: monospace; direction: ltr;
}

.empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted);
}
.empty-state i {
    font-size: 3.5rem; margin-bottom: 14px;
    opacity: 0.4; display: block; color: var(--gold-primary);
}
.empty-state p { font-size: 0.9rem; }

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {
    position: fixed; top: 50%; right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary); color: white;
    width: 40px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer; z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: var(--transition);
    border: var(--silver-border); touch-action: manipulation;
}
.sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
.sidebar-toggle.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(60px); }
.sidebar {
    position: fixed; top: 50%; right: -160px;
    transform: translateY(-50%);
    width: 130px; background: var(--sidebar-bg);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    z-index: 999;
    transition: all 0.45s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    padding: 12px 10px; border-radius: 18px 0 0 18px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    border: var(--silver-border); border-right: none;
    opacity: 0;
}
.sidebar.open { right: 0; opacity: 1; }
.sidebar-content { display: flex; flex-direction: column; gap: 8px; }
.sidebar-btn {
    position: relative; background: var(--bg-glass);
    border: var(--silver-border); padding: 12px 6px;
    border-radius: 12px; color: var(--text-secondary);
    font-weight: 700; cursor: pointer;
    transition: var(--transition);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 5px; min-height: 72px; text-align: center;
    font-size: 0.85rem; font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
}
.sidebar-btn:active { transform: scale(0.92); }
.sidebar-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary); color: var(--gold-primary);
}
.sidebar-btn i { font-size: 1.4rem; }
.sidebar-btn span { font-size: 0.7rem; font-weight: 800; }

/* ============================================================
   Bottom Navigation – موحّد تماماً (بدون دائرة)
   ============================================================ */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--nav-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: var(--silver-border-strong);
    display: flex; justify-content: space-around;
    padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
    z-index: 300; overflow-x: auto;
    scrollbar-width: none;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.bottom-nav::-webkit-scrollbar { display: none; }
.nav-item {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    background: none; border: none;
    color: var(--text-muted);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem; cursor: pointer;
    transition: var(--transition);
    padding: 6px 10px; position: relative;
    touch-action: manipulation;
    flex: 1; min-width: 70px;
}
.nav-item:active { transform: scale(0.9); }
.nav-item i { font-size: 20px; transition: var(--transition); }
.nav-item span { font-weight: 700; margin-top: 2px; }
.nav-item.active { color: var(--gold-primary); }
.nav-item.active i { transform: translateY(-3px); }
.nav-item.active::after {
    content: ''; position: absolute; top: -1px; left: 50%;
    transform: translateX(-50%);
    width: 24px; height: 3px;
    background: var(--gold-primary); border-radius: 10px;
}
/* زر جديد: نفس النمط تماماً لكن بلون مميز بسيط */
.nav-item.nav-new { color: var(--emerald-primary); }
.nav-item.nav-new i { color: var(--emerald-primary); }

/* ============================================================
   Modals
   ============================================================ */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 900; display: none;
    align-items: flex-end; justify-content: center;
    opacity: 0; transition: opacity 0.3s;
}
.modal-overlay.show { display: flex; opacity: 1; }
.modal {
    background: var(--bg-secondary);
    border-radius: 24px 24px 0 0;
    width: 100%; max-width: 720px;
    max-height: 92vh; overflow-y: auto;
    padding: 20px 18px 24px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: var(--silver-border-strong); border-bottom: none;
}
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 18px;
    border-bottom: var(--silver-border); padding-bottom: 14px;
    position: sticky; top: 0;
    background: var(--bg-secondary); z-index: 5;
    margin: -20px -18px 12px; padding: 16px 18px;
    border-radius: 24px 24px 0 0;
}
.modal-title {
    font-size: 1.1rem; font-weight: 900;
    color: var(--gold-primary);
    display: flex; align-items: center; gap: 10px;
}
.modal-close {
    width: 40px; height: 40px; border-radius: 12px;
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    font-size: 1rem;
}
.modal-close:active { transform: scale(0.9); }
.modal-close:hover {
    background: var(--danger); color: white;
    border-color: var(--danger);
}

/* ============================================================
   Form (2-column layout)
   ============================================================ */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 12px;
}
.form-group {
    margin-bottom: 4px;
    display: flex; flex-direction: column; gap: 5px;
    min-width: 0;
}
.form-group.full { grid-column: 1 / -1; }
.form-label {
    display: block; font-size: 0.76rem;
    font-weight: 700; color: var(--text-secondary);
    text-align: center; letter-spacing: 0.2px;
}
.form-label .required-star { color: var(--danger); margin-right: 2px; }
.form-input {
    width: 100%; padding: 10px 12px;
    border-radius: var(--radius-small);
    border: var(--silver-border); background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.85rem; transition: var(--transition);
    outline: none; box-shadow: var(--silver-shadow);
    text-align: center; font-weight: 600;
}
.form-input:focus {
    border: var(--silver-border-strong);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.15), var(--silver-shadow);
    background: var(--bg-glass-light);
}
.form-input::placeholder { color: var(--text-muted); text-align: center; }
select.form-input option { background: var(--bg-secondary); color: var(--text-primary); text-align: center; }
textarea.form-input { min-height: 70px; resize: vertical; line-height: 1.6; text-align: center; }
.form-input.auto-field {
    color: var(--danger) !important;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-family: 'Inter', 'Arial', monospace;
}
.form-input.serial-field {
    color: #8B0000 !important;
    font-weight: 800;
    letter-spacing: 0.4px;
}
.form-input[readonly] {
    background: var(--bg-glass-light);
    cursor: not-allowed;
}

.modal-footer {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding: 14px 0 0; border-top: var(--silver-border);
    margin-top: 14px;
}
.submit-btn, .cancel-btn {
    flex: 1; min-width: 120px; padding: 12px;
    border-radius: var(--radius-small);
    border: var(--silver-border);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.9rem; font-weight: 800;
    cursor: pointer; transition: var(--transition);
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.submit-btn {
    background: var(--gold-primary); color: white;
    border-color: var(--gold-dark);
}
.submit-btn:active { transform: scale(0.97); }
.submit-btn:hover { background: var(--gold-dark); }
.cancel-btn { background: var(--bg-glass); color: var(--text-secondary); }
.cancel-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }

/* ============================================================
   Reports
   ============================================================ */
.report-filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
}
.report-filter-grid .form-group { margin-bottom: 0; }
.report-actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 12px 0;
}
.report-actions .btn {
    flex: 1; min-width: 100px;
    padding: 10px; border-radius: var(--radius-small);
    border: var(--silver-border);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.8rem; font-weight: 800;
    cursor: pointer; transition: var(--transition);
    touch-action: manipulation;
    box-shadow: var(--silver-shadow);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--bg-glass); color: var(--text-secondary);
}
.report-actions .btn:active { transform: scale(0.97); }
.report-actions .btn.primary {
    background: var(--gold-primary); color: white;
    border-color: var(--gold-dark);
}
.report-actions .btn.excel {
    background: linear-gradient(135deg, #059669, #047857);
    color: white; border-color: #047857;
}
.report-actions .btn.print {
    background: linear-gradient(135deg, #7c3aed, #6366f1);
    color: white; border-color: #6366f1;
}
.report-results {
    margin-top: 14px; max-height: 340px; overflow-y: auto;
    border: var(--silver-border-strong);
    border-radius: var(--radius-small);
    background: var(--bg-card); padding: 6px;
}
.report-summary {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 12px;
}
.report-summary .sum-card {
    background: var(--bg-glass);
    border: var(--silver-border); border-radius: 10px;
    padding: 10px; text-align: center;
}
.report-summary .sum-card strong {
    display: block; color: var(--gold-primary);
    font-size: 1.05rem; font-weight: 900;
    direction: ltr; font-family: 'Inter', sans-serif;
}
.report-summary .sum-card span {
    font-size: 0.68rem; color: var(--text-muted); font-weight: 700;
}
.report-table {
    width: 100%; border-collapse: separate;
    border-spacing: 0 4px; font-size: 0.72rem;
}
.report-table th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 8px 6px; text-align: center;
    position: sticky; top: 0;
    font-weight: 800;
    border: var(--silver-border); border-radius: 8px 8px 0 0;
}
.report-table td {
    padding: 7px 6px; border: var(--silver-border);
    text-align: center; color: var(--text-secondary);
    background: var(--bg-glass); border-radius: 8px;
}

/* ============================================================
   Diagnostics & Maintenance panels
   ============================================================ */
.diag-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}
.diag-card {
    background: var(--bg-glass);
    border: var(--silver-border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.diag-card .diag-value {
    font-size: 1.6rem;
    font-weight: 900;
    font-family: 'Inter', sans-serif;
    direction: ltr;
    margin-bottom: 2px;
}
.diag-card .diag-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 700;
}
.diag-card.ok .diag-value { color: var(--success); }
.diag-card.warn .diag-value { color: var(--warning); }
.diag-card.bad .diag-value { color: var(--danger); }
.diag-card.info .diag-value { color: var(--info); }

.health-score {
    background: var(--bg-glass);
    border: var(--silver-border-strong);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    margin-bottom: 14px;
    position: relative;
}
.health-score .score-value {
    font-size: 2.4rem;
    font-weight: 900;
    font-family: 'Inter', sans-serif;
    direction: ltr;
    line-height: 1;
}
.health-score .score-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 700;
    margin-top: 4px;
}
.health-score .score-bar {
    height: 8px;
    background: var(--bg-glass-light);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 12px;
    border: var(--silver-border);
}
.health-score .score-bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.8s ease;
}
.health-score.excellent .score-value { color: var(--success); }
.health-score.excellent .score-bar-fill { background: linear-gradient(90deg, #059669, #10b981); }
.health-score.good .score-value { color: var(--info); }
.health-score.good .score-bar-fill { background: linear-gradient(90deg, #2563eb, #3b82f6); }
.health-score.warn .score-value { color: var(--warning); }
.health-score.warn .score-bar-fill { background: linear-gradient(90deg, #d97706, #f59e0b); }
.health-score.critical .score-value { color: var(--danger); }
.health-score.critical .score-bar-fill { background: linear-gradient(90deg, #dc2626, #ef4444); }

.diag-section {
    background: var(--bg-glass);
    border: var(--silver-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
}
.diag-section-title {
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--gold-primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
}
.diag-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 260px;
    overflow-y: auto;
}
.diag-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg-card);
    border: var(--silver-border);
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: var(--transition);
}
.diag-item:hover { border-color: var(--gold-primary); }
.diag-item .di-name { font-weight: 700; color: var(--text-primary); }
.diag-item .di-meta { font-size: 0.68rem; color: var(--text-muted); direction: ltr; font-family: monospace; }
.diag-item.critical { border-right: 3px solid var(--danger); }
.diag-item.warn { border-right: 3px solid var(--warning); }
.diag-item.ok { border-right: 3px solid var(--success); }

.maintenance-filter {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
}
.maintenance-filter button {
    padding: 6px 14px;
    border-radius: 999px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}
.maintenance-filter button.active {
    background: var(--gold-primary);
    color: #fff;
    border-color: var(--gold-dark);
}

/* ============================================================
   Toast
   ============================================================ */
.toast {
    position: fixed; top: 85px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 14px; padding: 12px 22px;
    display: flex; align-items: center; gap: 10px;
    z-index: 600; opacity: 0;
    transition: var(--transition);
    pointer-events: none;
    box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
    min-width: 220px; max-width: 90vw;
    font-size: 0.85rem; font-weight: 700;
    font-family: 'Cairo', 'Inter', sans-serif;
    color: var(--text-primary); text-align: center;
    justify-content: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--emerald-primary); }
.toast.error { border-color: var(--danger); }
.toast.warning { border-color: var(--warning); }
.toast.info { border-color: var(--gold-primary); }

.hidden { display: none !important; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.animate-fade-up { animation: fadeUp 0.5s ease forwards; }

@media (max-width: 480px) {
    .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .form-input { padding: 9px 8px; font-size: 0.8rem; }
    .form-label { font-size: 0.7rem; }
    .top-title h2 { font-size: 1.1rem; }
    .report-filter-grid { grid-template-columns: 1fr 1fr; }
    .modal { padding: 16px 14px; }
    .modal-header { margin: -16px -14px 10px; padding: 14px; }
    .report-summary { grid-template-columns: repeat(2, 1fr); }
    .diag-grid { grid-template-columns: 1fr 1fr; }
    .section-title h3 { font-size: 0.9rem; }
    .view-modes button { padding: 6px 8px; font-size: 0.7rem; }
}
@media (max-width: 360px) {
    .form-grid { gap: 6px; }
    .form-input { padding: 8px 6px; font-size: 0.75rem; }
    .form-label { font-size: 0.66rem; }
}
@media print {
    .top-bar, .bottom-nav, .sidebar-toggle, .sidebar,
    .offline-banner, .action-row, .icon-btn, .modal-footer { display: none !important; }
    body { background: #fff; color: #111; padding: 0; }
}
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner">
    <i class="fas fa-triangle-exclamation"></i> الجسر غير متاح؛ لن تُحفظ أو تُعرض بيانات بديلة
</div>
<div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>

<!-- ============ Top Bar ============ -->
<header class="top-bar">
    <div class="header-top">
        <div class="top-title">
            <h2><i class="fas fa-gas-pump"></i> إدارة المضخات</h2>
        </div>
        <div class="header-actions">
            <button type="button" class="icon-btn" id="themeToggle" title="تبديل الوضع" aria-label="تبديل الوضع">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button type="button" class="icon-btn" onclick="goHome()" title="الرئيسية" aria-label="الرئيسية">
                <i class="fas fa-home"></i>
            </button>
        </div>
    </div>

    <div class="search-wrap">
        <i class="fas fa-search"></i>
        <input class="search-input" id="searchInput" type="search"
               placeholder="ابحث باسم المضخة، الكود، الرقم التسلسلي..." autocomplete="off">
    </div>

    <div class="filter-chips" id="filterChips" aria-label="الفلاتر"></div>
</header>

<main class="page-container">
    <section class="stats-grid" id="statsGrid">
        <article class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-gas-pump"></i></div>
            <div class="stat-value" id="statCount">—</div>
            <div class="stat-label">عدد المضخات</div>
        </article>
        <article class="stat-card">
            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
            <div class="stat-value" id="statActive">—</div>
            <div class="stat-label">نشطة</div>
        </article>
        <article class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-wrench"></i></div>
            <div class="stat-value" id="statMaintenance">—</div>
            <div class="stat-label">تحت الصيانة / متوقفة</div>
        </article>
        <article class="stat-card">
            <div class="stat-icon purple"><i class="fas fa-clock"></i></div>
            <div class="stat-value" id="statUpdated">—</div>
            <div class="stat-label">آخر تحديث</div>
        </article>
    </section>

    <section class="data-panel">
        <!-- view-modes أمام النص "سجل المضخات" -->
        <div class="section-title">
            <div class="view-modes" id="viewModes" role="tablist" aria-label="أنماط العرض">
                <button type="button" data-view="cards" class="active" role="tab" aria-selected="true">
                    <i class="fas fa-th-large"></i> <span>بطاقات</span>
                </button>
                <button type="button" data-view="table" role="tab" aria-selected="false">
                    <i class="fas fa-table"></i> <span>جدول</span>
                </button>
                <button type="button" data-view="tree" role="tab" aria-selected="false">
                    <i class="fas fa-sitemap"></i> <span>شجرة</span>
                </button>
            </div>
            <h3><i class="fas fa-list"></i> سجل المضخات</h3>
            <span class="count-badge" id="itemCount">0</span>
        </div>
        <div class="cards-container" id="cardsContainer" role="tabpanel"></div>
        <div class="table-container hidden" id="tableContainer" role="tabpanel"></div>
        <div class="tree-container hidden" id="treeContainer" role="tabpanel"></div>
    </section>
</main>

<!-- ============ Sidebar ============ -->
<button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="فتح القائمة الجانبية">
    <i class="fas fa-bars"></i>
</button>
<aside class="sidebar" id="sidebar" aria-hidden="true">
    <div class="sidebar-content">
        <button type="button" class="sidebar-btn" data-action="refresh">
            <i class="fas fa-sync-alt"></i><span>تحديث</span>
        </button>
        <button type="button" class="sidebar-btn" data-action="new-pump">
            <i class="fas fa-plus-circle"></i><span>مضخة جديدة</span>
        </button>
        <button type="button" class="sidebar-btn" data-action="report">
            <i class="fas fa-chart-bar"></i><span>التقارير</span>
        </button>
        <button type="button" class="sidebar-btn" data-action="export">
            <i class="fas fa-file-csv"></i><span>تصدير CSV</span>
        </button>
        <button type="button" class="sidebar-btn" data-action="print">
            <i class="fas fa-print"></i><span>طباعة</span>
        </button>
        <button type="button" class="sidebar-btn" data-action="home">
            <i class="fas fa-home"></i><span>الرئيسية</span>
        </button>
    </div>
</aside>

<!-- ============ Bottom Nav ============ -->
<nav class="bottom-nav" id="bottomNav" aria-label="شريط التنقل السفلي"></nav>

<!-- ============ Form Modal ============ -->
<div class="modal-overlay" id="formModal" onclick="closeModal(event,'formModal')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title" id="formTitle"><i class="fas fa-plus-circle"></i> إضافة مضخة</h3>
            <button type="button" class="modal-close" onclick="closeModal(null,'formModal')" aria-label="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="recordForm" class="form-grid"></form>
        </div>
        <div class="modal-footer">
            <button type="button" class="submit-btn" id="saveBtn">
                <i class="fas fa-save"></i> حفظ
            </button>
            <button type="button" class="cancel-btn" onclick="closeModal(null,'formModal')">
                <i class="fas fa-times"></i> إلغاء
            </button>
        </div>
    </div>
</div>

<!-- ============ Details Modal ============ -->
<div class="modal-overlay" id="detailsModal" onclick="closeModal(event,'detailsModal')">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-info-circle"></i> تفاصيل المضخة</h3>
            <button type="button" class="modal-close" onclick="closeModal(null,'detailsModal')" aria-label="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body" id="detailsBody"></div>
    </div>
</div>

<!-- ============ Report Modal ============ -->
<div class="modal-overlay" id="reportModal" onclick="closeModal(event,'reportModal')">

                <div class="form-group">

            <div class="report-filter-grid">
                <div class="form-group">
                    <label class="form-label">الحالة</label>
                    <select class="form-input" id="reportStatus">
                        <option value="">الكل</option>
                        <option value="active">نشطة</option>

                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">المحطة</label>
                    <select class="form-input" id="reportStation">
                        <option value="">جميع المحطات</option>
                    </select>
                </div>
            </div>
            <div class="report-filter-grid">
                <div class="form-group">
                    <label class="form-label">الخزان</label>
                    <select class="form-input" id="reportTank">
                        <option value="">جميع الخزانات</option>

                </div>
                <div class="form-group">
                    <label class="form-label">الشركة المصنعة</label>
                    <select class="form-input" id="reportManufacturer">

            <div class="report-filter-grid">
                <div class="form-group">
                    <label class="form-label">حالة الصيانة</label>

                <div class="form-group">

                    <select class="form-input" id="reportSort">

                        <option value="status">الحالة</option>
                        <option value="installation_date">تاريخ التركيب</option>

            <div class="report-actions">
                <button type="button" class="btn primary" id="genReportBtn">
                    <i class="fas fa-cog"></i> توليد التقرير
                </button>
                <button type="button" class="btn excel" id="exportReportBtn">
                    <i class="fas fa-file-excel"></i> Excel/CSV
                </button>
                <button type="button" class="btn print" id="printReportBtn">
                    <i class="fas fa-print"></i> طباعة/PDF
                </button>
            </div>
            <div class="report-results" id="reportResults">
                <div class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>اضغط على "توليد التقرير" لعرض البيانات من SQLite</p>
                </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
    'use strict';

    /* ============================================================
       إعدادات الشاشة
       ============================================================ */
    const CFG = {
        title: 'إدارة المضخات',
        icon: 'fa-gas-pump',
        module: 'pumps',
        operationKey: 'pumps',
        listMethod: 'getPumpRecords',
        fallbackListMethod: 'getPumps',
        createMethod: 'savePumpRecord',
        updateMethod: 'updatePumpRecord',
        deleteMethod: 'deletePumpRecord',
        fullWidthKeys: [
            'pump_name', 'employee_id', 'serial_number',
            'manufacturer', 'remarks', 'extra_data'
        ],
        reports: [
            { key: 'all', label: 'الكل', icon: 'fa-list' },
            { key: 'active', label: 'نشطة', icon: 'fa-check-circle' },
            { key: 'maintenance', label: 'صيانة', icon: 'fa-wrench' },
            { key: 'offline', label: 'متوقفة', icon: 'fa-ban' },
            { key: 'retired', label: 'مستبعدة', icon: 'fa-archive' }
        ],
        fields: [
            { key: 'pump_code', label: 'كود المضخة', type: 'text', required: true, auto: true, attrs: { readonly: true } },
            { key: 'pump_number', label: 'رقم المضخة', type: 'text', required: true, auto: true, attrs: { readonly: true } },
            { key: 'pump_name', label: 'اسم المضخة', type: 'text', required: true, placeholder: 'مثال: مضخة الوقود الرئيسية' },
            { key: 'pump_name_ar', label: 'اسم المضخة بالعربي', type: 'hidden' },
            { key: 'station_id', label: 'المحطة', type: 'dynamic-select', source: 'stations', required: true },
            { key: 'tank_id', label: 'الخزان', type: 'dynamic-select', source: 'tanks', required: true },
            { key: 'serial_number', label: 'الرقم التسلسلي', type: 'text', className: 'serial-field', placeholder: 'الرقم التسلسلي للمضخة' },
            { key: 'manufacturer', label: 'الشركة المصنعة', type: 'text', placeholder: 'مثال: Wayne, Tokheim' },
            { key: 'model', label: 'الطراز', type: 'text', placeholder: 'طراز المضخة' },
            { key: 'installation_date', label: 'تاريخ التركيب', type: 'date' },
            { key: 'max_flow_rate', label: 'أقصى معدل تدفق (لتر/دقيقة)', type: 'number' },
            { key: 'meter_start', label: 'بداية العداد', type: 'text' },
            { key: 'meter_current', label: 'قراءة العداد الحالية', type: 'number' },
            { key: 'meter_last_reset', label: 'آخر تصفير للعداد', type: 'date' },
            { key: 'status', label: 'الحالة', type: 'select', options: [
                { v: 'active', t: 'نشطة' },
                { v: 'maintenance', t: 'صيانة' },
                { v: 'offline', t: 'متوقفة' },
                { v: 'retired', t: 'مستبعدة' }
            ], defaultValue: 'active' },
            { key: 'shift', label: 'الوردية', type: 'select', options: [
                { v: 'morning', t: 'صباحية' },
                { v: 'evening', t: 'مسائية' }
            ], defaultValue: 'morning' },
            { key: 'last_maintenance', label: 'آخر صيانة', type: 'date' },
            { key: 'next_maintenance', label: 'الصيانة القادمة', type: 'date' },
            { key: 'maintenance_interval', label: 'فترة الصيانة (أيام)', type: 'number', defaultValue: 90 },
            { key: 'status_reason', label: 'سبب الحالة', type: 'text', placeholder: 'سبب الحالة إن وُجد' },
            { key: 'employee_id', label: 'اسم الموظف المسؤول', type: 'dynamic-select', source: 'employees' },
            { key: 'remarks', label: 'ملاحظات', type: 'textarea', placeholder: 'أي ملاحظات إضافية' },
            { key: 'extra_data', label: 'تفاصيل إضافية', type: 'textarea', placeholder: 'تفاصيل تقنية أو إضافية' }
        ]
    };

    /* ============================================================
       الحالة
       ============================================================ */
    const state = {
        rows: [],
        filtered: [],
        editing: null,
        filter: 'all',
        search: '',
        view: 'cards',
        loadedAt: null,
        lookup: { stations: [], tanks: [], employees: [] },
        sortBy: 'pump_code',
        sortDir: 'asc',
        reportGenerated: false,
        maintFilter: 'all'
    };

    /* ============================================================
       أدوات مساعدة
       ============================================================ */
    const $ = (id) => document.getElementById(id);
    const bridge = window.AndroidInterface;

    const esc = (v) => String(v == null ? '—' : v)
        .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
    const today = () => new Date().toISOString().slice(0, 10);

    function toast(message, type = 'info') {
        const node = $('toast');
        if (!node) return;
        node.className = 'toast show ' + type;
        const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
        node.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i> ' + esc(message);
        clearTimeout(node._t);
        node._t = setTimeout(() => node.classList.remove('show'), 3500);
    }

    function setLoading(v) {
        const node = $('loadingIndicator');
        if (node) node.classList.toggle('show', !!v);
    }

    function parse(raw) {
        if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
        const v = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (v && v.success === false) throw new Error(v.error || v.message || 'فشلت العملية');
        return v;
    }

    function dataOf(v) {
        if (v && Object.prototype.hasOwnProperty.call(v, 'data')) return v.data;
        return v;
    }

    function invoke(method, args = []) {
        if (!bridge || typeof bridge[method] !== 'function') {
            return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
        }
        try {
            return Promise.resolve(parse(bridge[method].apply(bridge, args)));
        } catch (e) {
            return Promise.reject(e);
        }
    }

    function hasBridgeMethod(method) {
        return bridge && typeof bridge[method] === 'function';
    }

    function rowsFrom(v) {
        const raw = dataOf(v);
        if (Array.isArray(raw)) return raw;
        if (raw && Array.isArray(raw.rows)) return raw.rows;
        if (raw && Array.isArray(raw.data)) return raw.data;
        if (raw && typeof raw === 'object') return [raw];
        return [];
    }

    function pick(row, keys) {
        if (!row) return '';
        for (const k of keys) {
            const v = row[k];
            if (v !== undefined && v !== null && v !== '') return v;
        }
        return '';
    }

    function idOf(row) {
        return pick(row, ['id', 'pump_id', '_id']);
    }

    function statusOf(row) {
        return String(pick(row, ['status', 'state']) || '').toLowerCase();
    }

    function statusInfo(status) {
        switch (status) {
            case 'active': return { label: 'نشطة', cls: 'active' };
            case 'maintenance': return { label: 'صيانة', cls: 'maintenance' };
            case 'offline': return { label: 'متوقفة', cls: 'inactive' };
            case 'retired': return { label: 'مستبعدة', cls: 'inactive' };
            default: return { label: status || 'غير معروفة', cls: 'inactive' };
        }
    }

    function fmtDate(d) {
        if (!d) return '—';
        try {
            const date = new Date(d);
            if (isNaN(date.getTime())) return String(d);
            return date.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
        } catch (_) { return String(d); }
    }

    function daysUntil(dateStr) {
        if (!dateStr) return null;
        try {
            const target = new Date(dateStr).getTime();
            if (!Number.isFinite(target)) return null;
            const now = Date.now();
            return Math.round((target - now) / 86400000);
        } catch (_) { return null; }
    }

    /* ============================================================
       الثيم
       ============================================================ */
    function applyTheme() {
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
        else document.documentElement.removeAttribute('data-theme');
        const icon = $('themeIcon');
        if (icon) icon.className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }
    function toggleTheme() {
        const isDark = document.documentElement.dataset.theme === 'dark';
        if (isDark) document.documentElement.removeAttribute('data-theme');
        else document.documentElement.dataset.theme = 'dark';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
        const icon = $('themeIcon');
        if (icon) icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
    }

    /* ============================================================
       Sidebar
       ============================================================ */
    let sidebarOutsideHandler = null;

    function openSidebar() {
        const sidebar = $('sidebar');
        const toggle = $('sidebarToggle');
        if (!sidebar || !toggle) return;
        sidebar.classList.add('open');
        sidebar.setAttribute('aria-hidden', 'false');
        toggle.classList.add('hidden');
        sidebarOutsideHandler = (e) => {
            if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                closeSidebar();
            }
        };
        setTimeout(() => document.addEventListener('click', sidebarOutsideHandler, true), 50);
    }

    function closeSidebar() {
        const sidebar = $('sidebar');
        const toggle = $('sidebarToggle');
        if (!sidebar || !toggle) return;
        sidebar.classList.remove('open');
        sidebar.setAttribute('aria-hidden', 'true');
        toggle.classList.remove('hidden');
        if (sidebarOutsideHandler) {
            document.removeEventListener('click', sidebarOutsideHandler, true);
            sidebarOutsideHandler = null;
        }
    }

    function toggleSidebar() {
        const sidebar = $('sidebar');
        if (!sidebar) return;
        if (sidebar.classList.contains('open')) closeSidebar();
        else openSidebar();
    }

    /* ============================================================
       تحميل بيانات القوائم المرجعية
       ============================================================ */
    async function loadLookups() {
        try {
            const r = await invoke('getStations');
            state.lookup.stations = rowsFrom(r);
        } catch (e) { state.lookup.stations = []; }

        try {
            const r = await invoke('getEmployees');
            state.lookup.employees = rowsFrom(r);
        } catch (e) { state.lookup.employees = []; }

        try {
            const r = await invoke('getTanks');
            state.lookup.tanks = rowsFrom(r);
        } catch (e) { state.lookup.tanks = []; }
    }

    function stationLabel(s) {
        return pick(s, ['station_name_ar', 'station_name', 'station_code', 'name_ar', 'name']) || ('محطة #' + idOf(s));
    }
    function tankLabel(t) {
        return pick(t, ['tank_name', 'tank_name_ar', 'tank_code']) || ('خزان #' + idOf(t));
    }
    function employeeLabel(e) {
        return pick(e, ['full_name_ar', 'full_name', 'name_ar', 'name', 'employee_code']) || ('موظف #' + idOf(e));
    }

    /* ============================================================
       توليد الحقول
       ============================================================ */
    function buildFieldHtml(def, row) {
        const required = def.required ? 'required' : '';
        const full = CFG.fullWidthKeys.includes(def.key) ? ' full' : '';
        const star = def.required ? '<span class="required-star">*</span>' : '';
        const value = row && row[def.key] != null ? row[def.key] : (def.defaultValue || '');
        const cls = ['form-input'];
        if (def.className) cls.push(def.className);
        if (def.auto) cls.push('auto-field');
        const clsStr = cls.join(' ');

        if (def.type === 'hidden') {
            return '<input type="hidden" data-key="' + esc(def.key) + '" value="' + esc(value) + '">';
        }

        let inner = '';
        if (def.type === 'textarea') {
            inner = '<textarea class="' + clsStr + '" data-key="' + esc(def.key) + '" rows="2" ' +
                    'placeholder="' + esc(def.placeholder || '') + '" ' + required + '>' + esc(value) + '</textarea>';
        } else if (def.type === 'select') {
            const opts = (def.options || []).map(o =>
                '<option value="' + esc(o.v) + '"' + (String(value) === String(o.v) ? ' selected' : '') + '>' + esc(o.t) + '</option>'
            ).join('');
            inner = '<select class="' + clsStr + '" data-key="' + esc(def.key) + '" ' + required + '>' +
                    '<option value="">— اختر —</option>' + opts + '</select>';
        } else if (def.type === 'dynamic-select') {
            inner = '<select class="' + clsStr + '" data-key="' + esc(def.key) +
                    '" data-source="' + esc(def.source) + '" ' + required + '>' +
                    '<option value="">— اختر —</option></select>';
        } else {
            const inputType = def.type === 'number' ? 'number' : (def.type === 'date' ? 'date' : 'text');
            const readonlyAttr = (def.attrs && def.attrs.readonly) ? 'readonly' : '';
            const stepAttr = def.type === 'number' ? 'step="any"' : '';
            inner = '<input class="' + clsStr + '" data-key="' + esc(def.key) + '" type="' + inputType + '" ' +
                    'value="' + esc(value) + '" placeholder="' + esc(def.placeholder || '') + '" ' +
                    required + ' ' + readonlyAttr + ' ' + stepAttr + '>';
        }
        return '<div class="form-group' + full + '">' +
               '<label class="form-label">' + esc(def.label) + star + '</label>' + inner +
               '</div>';
    }

    function fillDynamicSelect(sel, items, labelFn, selectedValue) {
        const current = selectedValue != null ? String(selectedValue) : '';
        let html = '<option value="">— اختر —</option>';
        items.forEach(it => {
            const id = idOf(it);
            const label = labelFn(it);
            html += '<option value="' + esc(id) + '"' + (String(id) === current ? ' selected' : '') + '>' + esc(label) + '</option>';
        });
        sel.innerHTML = html;
    }

    async function refreshDynamicSelects(formEl, row) {
        const selects = formEl.querySelectorAll('select[data-source]');
        for (const sel of selects) {
            const src = sel.dataset.source;
            if (src === 'stations') {
                fillDynamicSelect(sel, state.lookup.stations, stationLabel,
                    row && row.station_id != null ? row.station_id : (state.lookup.stations[0] ? idOf(state.lookup.stations[0]) : ''));
            } else if (src === 'tanks') {
                fillDynamicSelect(sel, state.lookup.tanks, tankLabel,
                    row && row.tank_id != null ? row.tank_id : '');
            } else if (src === 'employees') {
                fillDynamicSelect(sel, state.lookup.employees, employeeLabel,
                    row && row.employee_id != null ? row.employee_id : '');
            }
        }
    }

    /* ============================================================
       توليد أكواد تلقائية
       ============================================================ */
    function nextPumpCode() {
        const existing = new Set(state.rows.map(r => String(r.pump_code || '')));
        let n = state.rows.length + 1;
        let code = 'PUMP-' + String(n).padStart(3, '0');
        while (existing.has(code)) { n++; code = 'PUMP-' + String(n).padStart(3, '0'); }
        return code;
    }

    function nextPumpNumber() {
        const existing = new Set(state.rows.map(r => String(r.pump_number || '')));
        let n = 1;
        let num = String(n);
        while (existing.has(num)) { n++; num = String(n); }
        return num;
    }

    /* ============================================================
       فتح/إغلاق المودالات
       ============================================================ */
    function openModal(event, id) {
        if (event && event.target !== event.currentTarget) return;
        const el = $(id);
        if (!el) return;
        el.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeModal(event, id) {
        if (event && event.target !== event.currentTarget) return;
        const el = $(id);
        if (!el) return;
        el.classList.remove('show');
        document.body.style.overflow = '';
    }

    /* ============================================================
       نموذج الإضافة/التعديل
       ============================================================ */
    async function openForm(row = null) {
        if (!hasBridgeMethod(CFG.createMethod) && !hasBridgeMethod(CFG.updateMethod)) {
            toast('لا توجد عملية كتابة متاحة للمضخات في العقد الحالي', 'error');
            return;
        }
        state.editing = row;
        $('formTitle').innerHTML = '<i class="fas ' + (row ? 'fa-edit' : 'fa-plus-circle') + '"></i> ' +
            (row ? 'تعديل مضخة' : 'إضافة مضخة جديدة');

        const form = $('recordForm');
        form.innerHTML = CFG.fields.map(def => buildFieldHtml(def, row)).join('');

        if (!row) {
            const codeEl = form.querySelector('[data-key="pump_code"]');
            const numEl = form.querySelector('[data-key="pump_number"]');
            if (codeEl) codeEl.value = nextPumpCode();
            if (numEl) numEl.value = nextPumpNumber();
        } else {
            CFG.fields.forEach(def => {
                const el = form.querySelector('[data-key="' + CSS.escape(def.key) + '"]');
                if (!el) return;
                const v = row[def.key];
                if (v != null) el.value = v;
            });
        }

        await refreshDynamicSelects(form, row);

        const nameInput = form.querySelector('[data-key="pump_name"]');
        const nameArInput = form.querySelector('[data-key="pump_name_ar"]');
        if (nameInput && nameArInput) {
            nameInput.addEventListener('input', () => {
                nameArInput.value = nameInput.value;
            });
            if (row && !nameArInput.value && nameInput.value) {
                nameArInput.value = nameInput.value;
            }
        }

        setTimeout(() => {
            const first = form.querySelector('input:not([readonly]):not([type="hidden"]), textarea:not([readonly]), select:not([disabled])');
            if (first) first.focus();
        }, 200);

        openModal(null, 'formModal');
    }

    function collectForm() {
        const form = $('recordForm');
        const payload = {};
        form.querySelectorAll('[data-key]').forEach(el => {
            const key = el.dataset.key;
            let v = el.value;
            if (el.type === 'number') v = v === '' ? 0 : Number(v);
            payload[key] = v;
        });
        if (payload.pump_name && !payload.pump_name_ar) {
            payload.pump_name_ar = payload.pump_name;
        }
        return payload;
    }

    async function saveForm() {
        const form = $('recordForm');
        if (!form.reportValidity()) return;
        const payload = collectForm();
        setLoading(true);
        try {
            if (state.editing) {
                const id = idOf(state.editing);
                if (!id) throw new Error('معرف السجل غير صالح');
                if (!hasBridgeMethod(CFG.updateMethod)) {
                    throw new Error('لا توجد عملية تحديث متاحة');
                }
                await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                toast('تم تحديث المضخة بنجاح', 'success');
            } else {
                if (!hasBridgeMethod(CFG.createMethod)) {
                    throw new Error('لا توجد عملية إضافة متاحة');
                }
                await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                toast('تمت إضافة المضخة بنجاح', 'success');
            }
            closeModal(null, 'formModal');
            await reloadData();
        } catch (e) {
            toast(e.message || 'فشلت العملية', 'error');
        } finally {
            setLoading(false);
        }
    }

    async function deleteRow(row) {
        const id = idOf(row);
        if (!id) return;
        if (!hasBridgeMethod(CFG.deleteMethod)) {
            toast('لا توجد عملية حذف متاحة', 'error');
            return;
        }
        if (!confirm('هل تريد حذف هذه المضخة فعلياً؟')) return;
        setLoading(true);
        try {
            await invoke(CFG.deleteMethod, [Number(id)]);
            toast('تم حذف المضخة', 'success');
            await reloadData();
        } catch (e) {
            toast(e.message || 'فشل الحذف', 'error');
        } finally {
            setLoading(false);
        }
    }
