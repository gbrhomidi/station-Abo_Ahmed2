    /* ============================================================
       التشخيص (Diagnostics) - صحة المضخات
       ============================================================ */
    function openDiagnostics() {
        const rows = state.rows;
        const total = rows.length;

        if (total === 0) {
            $('diagBody').innerHTML = '<div class="empty-state"><i class="fas fa-stethoscope"></i><p>لا توجد بيانات للتشخيص</p></div>';
            openModal(null, 'diagModal');
            return;
        }

        // إحصائيات
        let active = 0, maint = 0, offline = 0, retired = 0;
        let overdueMaint = 0, soonMaint = 0, okMaint = 0;
        let noNextMaint = 0;
        let missingSerial = 0, missingManufacturer = 0, missingInstallDate = 0;
        let withMeterReadings = 0;
        let maintenanceOverdueList = [];
        let soonMaintenanceList = [];
        let offlineList = [];

        rows.forEach(r => {
            const s = statusOf(r);
            if (s === 'active') active++;
            else if (s === 'maintenance') { maint++; }
            else if (s === 'offline') { offline++; offlineList.push(r); }
            else if (s === 'retired') retired++;

            const days = daysUntil(r.next_maintenance);
            if (days === null) noNextMaint++;
            else if (days < 0) { overdueMaint++; maintenanceOverdueList.push({ row: r, days }); }
            else if (days <= 30) { soonMaint++; soonMaintenanceList.push({ row: r, days }); }
            else okMaint++;

            if (!r.serial_number) missingSerial++;
            if (!r.manufacturer) missingManufacturer++;
            if (!r.installation_date) missingInstallDate++;
            if (num(r.meter_current) > 0) withMeterReadings++;
        });

        // حساب درجة الصحة (Health Score)
        // كل مشكلة = خصم نقاط
        let score = 100;
        score -= Math.round((offline / total) * 30);
        score -= Math.round((maint / total) * 20);
        score -= Math.round((overdueMaint / total) * 25);
        score -= Math.round((missingSerial / total) * 10);
        score -= Math.round((noNextMaint / total) * 15);
        score = Math.max(0, Math.min(100, score));

        const scoreClass = score >= 90 ? 'excellent'
                        : score >= 75 ? 'good'
                        : score >= 50 ? 'warn'
                        : 'critical';
        const scoreLabel = score >= 90 ? 'ممتازة'
                        : score >= 75 ? 'جيدة'
                        : score >= 50 ? 'تحتاج اهتمام'
                        : 'حرجة';

        let html = '';
        html += '<div class="health-score ' + scoreClass + '">' +
            '<div class="score-value">' + score + '%</div>' +
            '<div class="score-label">درجة صحة المضخات — ' + scoreLabel + '</div>' +
            '<div class="score-bar"><div class="score-bar-fill" style="width:' + score + '%"></div></div>' +
            '</div>';

        // شبكة الإحصائيات
        html += '<div class="diag-grid">' +
            '<div class="diag-card ok"><div class="diag-value">' + active + '</div><div class="diag-label">نشطة</div></div>' +
            '<div class="diag-card warn"><div class="diag-value">' + maint + '</div><div class="diag-label">تحت الصيانة</div></div>' +
            '<div class="diag-card bad"><div class="diag-value">' + offline + '</div><div class="diag-label">متوقفة</div></div>' +
            '<div class="diag-card info"><div class="diag-value">' + total + '</div><div class="diag-label">إجمالي المضخات</div></div>' +
            '<div class="diag-card bad"><div class="diag-value">' + overdueMaint + '</div><div class="diag-label">صيانة متأخرة</div></div>' +
            '<div class="diag-card warn"><div class="diag-value">' + soonMaint + '</div><div class="diag-label">صيانة قريبة</div></div>' +
            '</div>';

        // الصيانة المتأخرة
        if (maintenanceOverdueList.length) {
            maintenanceOverdueList.sort((a, b) => a.days - b.days);
            html += '<div class="diag-section">' +
                '<div class="diag-section-title"><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i> صيانة متأخرة (' + maintenanceOverdueList.length + ')</div>' +
                '<div class="diag-list">';
            maintenanceOverdueList.slice(0, 20).forEach(({ row: r, days }) => {
                const id = idOf(r);
                html += '<div class="diag-item critical" data-id="' + esc(id) + '">' +
                    '<span class="di-name">' + esc(pick(r, ['pump_name_ar', 'pump_name']) || 'بدون اسم') + '</span>' +
                    '<span class="di-meta">متأخرة ' + Math.abs(days) + ' يوم</span>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        // الصيانة القريبة
        if (soonMaintenanceList.length) {
            soonMaintenanceList.sort((a, b) => a.days - b.days);
            html += '<div class="diag-section">' +
                '<div class="diag-section-title"><i class="fas fa-clock" style="color:var(--warning)"></i> صيانة قريبة (' + soonMaintenanceList.length + ')</div>' +
                '<div class="diag-list">';
            soonMaintenanceList.slice(0, 20).forEach(({ row: r, days }) => {
                const id = idOf(r);
                html += '<div class="diag-item warn" data-id="' + esc(id) + '">' +
                    '<span class="di-name">' + esc(pick(r, ['pump_name_ar', 'pump_name']) || 'بدون اسم') + '</span>' +
                    '<span class="di-meta">خلال ' + days + ' يوم</span>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        // المضخات المتوقفة
        if (offlineList.length) {
            html += '<div class="diag-section">' +
                '<div class="diag-section-title"><i class="fas fa-power-off" style="color:var(--danger)"></i> مضخات متوقفة (' + offlineList.length + ')</div>' +
                '<div class="diag-list">';
            offlineList.slice(0, 20).forEach(r => {
                const id = idOf(r);
                html += '<div class="diag-item critical" data-id="' + esc(id) + '">' +
                    '<span class="di-name">' + esc(pick(r, ['pump_name_ar', 'pump_name']) || 'بدون اسم') + '</span>' +
                    '<span class="di-meta">' + esc(r.pump_code || '') + '</span>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        // البيانات الناقصة
        const missing = [];
        if (missingSerial) missing.push({ label: 'بدون رقم تسلسلي', count: missingSerial });
        if (missingManufacturer) missing.push({ label: 'بدون شركة مصنعة', count: missingManufacturer });
        if (missingInstallDate) missing.push({ label: 'بدون تاريخ تركيب', count: missingInstallDate });
        if (noNextMaint) missing.push({ label: 'بدون موعد صيانة قادمة', count: noNextMaint });

        if (missing.length) {
            html += '<div class="diag-section">' +
                '<div class="diag-section-title"><i class="fas fa-info-circle" style="color:var(--info)"></i> بيانات ناقصة</div>' +
                '<div class="diag-list">';
            missing.forEach(m => {
                html += '<div class="diag-item warn">' +
                    '<span class="di-name">' + esc(m.label) + '</span>' +
                    '<span class="di-meta">' + m.count + ' مضخة</span>' +
                    '</div>';
            });
            html += '</div></div>';
        }

        $('diagBody').innerHTML = html;

        // ربط النقر على العناصر لعرض التفاصيل
        $('diagBody').querySelectorAll('.diag-item[data-id]').forEach(el => {
            el.addEventListener('click', () => {
                const row = findRow(el.dataset.id);
                if (row) {
                    closeModal(null, 'diagModal');
                    setTimeout(() => openDetails(row), 200);
                }
            });
        });

        openModal(null, 'diagModal');
    }

    /* ============================================================
       الصيانة (Maintenance) - متتبع بصري
       ============================================================ */
    function openMaintenance() {
        state.maintFilter = 'all';
        renderMaintenanceBody();
        openModal(null, 'maintModal');
    }

    function renderMaintenanceBody() {
        const rows = state.rows;
        if (!rows.length) {
            $('maintBody').innerHTML = '<div class="empty-state"><i class="fas fa-tools"></i><p>لا توجد بيانات صيانة</p></div>';
            return;
        }

        let filterFn;
        switch (state.maintFilter) {
            case 'overdue': filterFn = (r) => { const d = daysUntil(r.next_maintenance); return d !== null && d < 0; }; break;
            case 'soon': filterFn = (r) => { const d = daysUntil(r.next_maintenance); return d !== null && d >= 0 && d <= 30; }; break;
            case 'no-date': filterFn = (r) => !r.next_maintenance; break;
            case 'all':
            default: filterFn = () => true;
        }

        const filtered = rows.filter(filterFn);
        // ترتيب حسب الصيانة القادمة
        filtered.sort((a, b) => {
            const da = daysUntil(a.next_maintenance);
            const db = daysUntil(b.next_maintenance);
            if (da === null && db === null) return 0;
            if (da === null) return 1;
            if (db === null) return -1;
            return da - db;
        });

        // إحصائيات
        let overdue = 0, soon = 0, ok = 0, noDate = 0;
        rows.forEach(r => {
            const d = daysUntil(r.next_maintenance);
            if (d === null) noDate++;
            else if (d < 0) overdue++;
            else if (d <= 30) soon++;
            else ok++;
        });

        let html = '';
        html += '<div class="diag-grid">' +
            '<div class="diag-card bad"><div class="diag-value">' + overdue + '</div><div class="diag-label">متأخرة</div></div>' +
            '<div class="diag-card warn"><div class="diag-value">' + soon + '</div><div class="diag-label">قريبة (30 يوم)</div></div>' +
            '<div class="diag-card ok"><div class="diag-value">' + ok + '</div><div class="diag-label">سليمة</div></div>' +
            '<div class="diag-card info"><div class="diag-value">' + noDate + '</div><div class="diag-label">بدون موعد</div></div>' +
            '</div>';

        html += '<div class="maintenance-filter">' +
            '<button type="button" data-mf="all" class="' + (state.maintFilter === 'all' ? 'active' : '') + '">الكل</button>' +
            '<button type="button" data-mf="overdue" class="' + (state.maintFilter === 'overdue' ? 'active' : '') + '">متأخرة</button>' +
            '<button type="button" data-mf="soon" class="' + (state.maintFilter === 'soon' ? 'active' : '') + '">قريبة</button>' +
            '<button type="button" data-mf="no-date" class="' + (state.maintFilter === 'no-date' ? 'active' : '') + '">بدون موعد</button>' +
            '</div>';

        if (!filtered.length) {
            html += '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد نتائج مطابقة</p></div>';
        } else {
            html += '<div class="diag-list" style="max-height:400px">';
            filtered.slice(0, 100).forEach(r => {
                const id = idOf(r);
                const d = daysUntil(r.next_maintenance);
                let cls = 'ok', meta = fmtDate(r.next_maintenance);
                if (d === null) { cls = ''; meta = 'بدون موعد'; }
                else if (d < 0) { cls = 'critical'; meta = 'متأخرة ' + Math.abs(d) + ' يوم'; }
                else if (d <= 30) { cls = 'warn'; meta = 'خلال ' + d + ' يوم'; }
                else { meta = 'خلال ' + d + ' يوم'; }

                html += '<div class="diag-item ' + cls + '" data-id="' + esc(id) + '">' +
                    '<span class="di-name">' + esc(pick(r, ['pump_name_ar', 'pump_name']) || 'بدون اسم') + '</span>' +
                    '<span class="di-meta">' + esc(meta) + '</span>' +
                    '</div>';
            });
            html += '</div>';
        }

        $('maintBody').innerHTML = html;

        // ربط فلاتر الصيانة
        $('maintBody').querySelectorAll('[data-mf]').forEach(b => {
            b.addEventListener('click', () => {
                state.maintFilter = b.dataset.mf;
                renderMaintenanceBody();
            });
        });

        // ربط النقر على عنصر الصيانة
        $('maintBody').querySelectorAll('.diag-item[data-id]').forEach(el => {
            el.addEventListener('click', () => {
                const row = findRow(el.dataset.id);
                if (row) {
                    closeModal(null, 'maintModal');
                    setTimeout(() => openDetails(row), 200);
                }
            });
        });
    }

    /* ============================================================
       الفلترة
       ============================================================ */
    function filterRows() {
        const q = state.search.trim().toLowerCase();
        let list = state.rows.slice();

        if (state.filter !== 'all') {
            list = list.filter(r => {
                const s = statusOf(r);
                if (state.filter === 'active') return s === 'active';
                if (state.filter === 'maintenance') return s === 'maintenance';
                if (state.filter === 'offline') return s === 'offline';
                if (state.filter === 'retired') return s === 'retired';
                return true;
            });
        }

        if (q) {
            list = list.filter(r => {
                try { return JSON.stringify(r || {}).toLowerCase().includes(q); }
                catch (_) { return false; }
            });
        }

        const sb = state.sortBy;
        const dir = state.sortDir === 'desc' ? -1 : 1;
        list.sort((a, b) => {
            const av = String(a[sb] == null ? '' : a[sb]);
            const bv = String(b[sb] == null ? '' : b[sb]);
            return av.localeCompare(bv, 'ar') * dir;
        });

        return list;
    }

    function applyFilter() {
        state.filtered = filterRows();
        updateChipCounts();
        render();
    }

    function updateChipCounts() {
        const counts = { all: state.rows.length, active: 0, maintenance: 0, offline: 0, retired: 0 };
        state.rows.forEach(r => {
            const s = statusOf(r);
            if (s === 'active') counts.active++;
            else if (s === 'maintenance') counts.maintenance++;
            else if (s === 'offline') counts.offline++;
            else if (s === 'retired') counts.retired++;
        });
        document.querySelectorAll('[data-count]').forEach(el => {
            const k = el.dataset.count;
            if (k in counts) el.textContent = counts[k];
        });
    }

    /* ============================================================
       الإحصائيات
       ============================================================ */
    function renderStats() {
        const rows = state.rows;
        const total = rows.length;
        const active = rows.filter(r => statusOf(r) === 'active').length;
        const maint = rows.filter(r => {
            const s = statusOf(r);
            return s === 'maintenance' || s === 'offline';
        }).length;

        $('statCount').textContent = total.toLocaleString('ar-EG');
        $('statActive').textContent = active.toLocaleString('ar-EG');
        $('statMaintenance').textContent = maint.toLocaleString('ar-EG');
        $('statUpdated').textContent = state.loadedAt
            ? state.loadedAt.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            : '—';
        $('itemCount').textContent = state.filtered.length.toLocaleString('ar-EG');
    }

    /* ============================================================
       عرض الشجرة
       ============================================================ */
    function renderTree() {
        const box = $('treeContainer');
        if (!state.filtered.length) {
            box.innerHTML = '<div class="empty-state"><i class="fas fa-sitemap"></i>' +
                '<p>لا توجد بيانات للعرض</p></div>';
            return;
        }

        const stations = new Map();
        state.filtered.forEach(row => {
            const stationId = String(row.station_id || 'unknown');
            const stationObj = state.lookup.stations.find(s => String(idOf(s)) === stationId);
            const stationLabelText = stationObj ? stationLabel(stationObj) : (stationId === 'unknown' ? 'بدون محطة' : ('محطة #' + stationId));
            const tankId = String(row.tank_id || 'unknown');
            const tankObj = state.lookup.tanks.find(t => String(idOf(t)) === tankId);
            const tankLabelText = tankObj ? tankLabel(tankObj) : (row.tank_name || (tankId === 'unknown' ? 'بدون خزان' : ('خزان #' + tankId)));

            if (!stations.has(stationId)) stations.set(stationId, { label: stationLabelText, tanks: new Map() });
            const stationEntry = stations.get(stationId);
            if (!stationEntry.tanks.has(tankId)) stationEntry.tanks.set(tankId, { label: tankLabelText, pumps: [] });
            stationEntry.tanks.get(tankId).pumps.push(row);
        });

        let html = '';
        stations.forEach((st) => {
            const total = Array.from(st.tanks.values()).reduce((s, t) => s + t.pumps.length, 0);
            html += '<div class="tree-station">';
            html += '<div class="tree-station-header"><i class="fas fa-building"></i> ' + esc(st.label) +
                    '<span class="tree-count">' + total + '</span></div>';
            st.tanks.forEach((tk) => {
                html += '<div class="tree-tank">';
                html += '<div class="tree-tank-header"><i class="fas fa-cube"></i> ' + esc(tk.label) +
                        ' <span style="color:var(--text-muted);font-size:0.7rem">(' + tk.pumps.length + ')</span></div>';
                tk.pumps.forEach(row => {
                    const id = idOf(row);
                    const name = pick(row, ['pump_name_ar', 'pump_name']) || 'بدون اسم';
                    const code = pick(row, ['pump_code']) || '—';
                    html += '<div class="tree-pump" data-id="' + esc(id) + '">' +
                            '<span class="pump-name"><i class="fas fa-gas-pump" style="color:var(--gold-primary);margin-left:6px"></i>' + esc(name) + '</span>' +
                            '<span class="pump-code">' + esc(code) + '</span></div>';
                });
                html += '</div>';
            });
            html += '</div>';
        });
        box.innerHTML = html;
        box.querySelectorAll('.tree-pump').forEach(el => {
            el.addEventListener('click', () => openDetails(findRow(el.dataset.id)));
        });
    }

    /* ============================================================
       الرندر الرئيسي
       ============================================================ */
    function render() {
        renderStats();
        const cards = $('cardsContainer');
        const table = $('tableContainer');
        const tree = $('treeContainer');
        cards.classList.toggle('hidden', state.view !== 'cards');
        table.classList.toggle('hidden', state.view !== 'table');
        tree.classList.toggle('hidden', state.view !== 'tree');

        if (state.view === 'cards') renderCards();
        else if (state.view === 'table') renderTable();
        else if (state.view === 'tree') renderTree();
    }

    function findRow(id) {
        return state.rows.find((r, i) => String(idOf(r) || i) === String(id));
    }

    /* ============================================================
       تحميل البيانات
       ============================================================ */
    async function reloadData() {
        if (!bridge) {
            $('offlineBanner').classList.add('show');
            render();
            toast('الجسر غير متاح؛ لن تُعرض بيانات', 'warning');
            return;
        }
        setLoading(true);
        try {
            let result = null;
            let lastError = null;
            const methods = [CFG.listMethod, CFG.fallbackListMethod].filter(Boolean);
            for (const m of methods) {
                if (!hasBridgeMethod(m)) continue;
                try {
                    result = await invoke(m, []);
                    break;
                } catch (e) { lastError = e; }
            }
            if (result == null && lastError) throw lastError;
            if (result == null) throw new Error('لا توجد دالة قراءة متاحة للمضخات');

            state.rows = rowsFrom(result);
            state.loadedAt = new Date();
            $('offlineBanner').classList.remove('show');
            applyFilter();
        } catch (e) {
            state.rows = [];
            state.loadedAt = new Date();
            render();
            toast(e.message || 'فشل تحميل البيانات', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       التقارير
       ============================================================ */
    function fillReportFilters() {
        const stationSel = $('reportStation');
        if (stationSel) {
            fillDynamicSelect(stationSel, state.lookup.stations, stationLabel, '');
        }
        const tankSel = $('reportTank');
        if (tankSel) {
            fillDynamicSelect(tankSel, state.lookup.tanks, tankLabel, '');
        }
        const manSel = $('reportManufacturer');
        if (manSel) {
            const mans = Array.from(new Set(state.rows.map(r => r.manufacturer).filter(Boolean))).sort();
            let html = '<option value="">الكل</option>';
            mans.forEach(m => { html += '<option value="' + esc(m) + '">' + esc(m) + '</option>'; });
            manSel.innerHTML = html;
        }
    }

    function getReportFilters() {
        return {
            from: $('reportFrom').value || '',
            to: $('reportTo').value || '',
            status: $('reportStatus').value || '',
            station: $('reportStation').value || '',
            tank: $('reportTank').value || '',
            manufacturer: $('reportManufacturer').value || '',
            maint: $('reportMaint').value || '',
            sort: $('reportSort').value || 'pump_code'
        };
    }

    function applyReportFilters() {
        const f = getReportFilters();
        let list = state.rows.slice();
        if (f.status) list = list.filter(r => statusOf(r) === f.status);
        if (f.station) list = list.filter(r => String(r.station_id) === String(f.station));
        if (f.tank) list = list.filter(r => String(r.tank_id) === String(f.tank));
        if (f.manufacturer) list = list.filter(r => String(r.manufacturer || '') === f.manufacturer);
        if (f.from) list = list.filter(r => {
            const d = r.installation_date || r.created_at;
            return d && d >= f.from;
        });
        if (f.to) list = list.filter(r => {
            const d = r.installation_date || r.created_at;
            return d && d <= f.to;
        });
        if (f.maint) {
            list = list.filter(r => {
                const days = daysUntil(r.next_maintenance);
                if (f.maint === 'overdue') return days !== null && days < 0;
                if (f.maint === 'soon') return days !== null && days >= 0 && days <= 30;
                if (f.maint === 'ok') return days === null || days > 30;
                return true;
            });
        }
        list.sort((a, b) => String(a[f.sort] || '').localeCompare(String(b[f.sort] || ''), 'ar'));
        return list;
    }

    function renderReportResults(list) {
        if (!list.length) {
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد نتائج مطابقة للفلاتر</p></div>';
            return;
        }
        const summary = {
            total: list.length,
            active: list.filter(r => statusOf(r) === 'active').length,
            maintenance: list.filter(r => statusOf(r) === 'maintenance').length,
            offline: list.filter(r => statusOf(r) === 'offline').length,
            overdue: list.filter(r => { const d = daysUntil(r.next_maintenance); return d !== null && d < 0; }).length,
            soon: list.filter(r => { const d = daysUntil(r.next_maintenance); return d !== null && d >= 0 && d <= 30; }).length
        };

        const summaryHtml = '<div class="report-summary">' +
            '<div class="sum-card"><strong>' + summary.total + '</strong><span>الإجمالي</span></div>' +
            '<div class="sum-card"><strong style="color:var(--success)">' + summary.active + '</strong><span>نشطة</span></div>' +
            '<div class="sum-card"><strong style="color:var(--warning)">' + summary.maintenance + '</strong><span>صيانة</span></div>' +
            '<div class="sum-card"><strong style="color:var(--danger)">' + summary.offline + '</strong><span>متوقفة</span></div>' +
            '<div class="sum-card"><strong style="color:var(--danger)">' + summary.overdue + '</strong><span>صيانة متأخرة</span></div>' +
            '<div class="sum-card"><strong style="color:var(--warning)">' + summary.soon + '</strong><span>صيانة قريبة</span></div>' +
            '</div>';

        let tableHtml = '<table class="report-table"><thead><tr>' +
            '<th>الكود</th><th>الرقم</th><th>الاسم</th><th>الحالة</th><th>الرقم التسلسلي</th><th>الشركة</th>' +
            '<th>الخزان</th><th>آخر صيانة</th><th>الصيانة القادمة</th></tr></thead><tbody>';
        list.slice(0, 500).forEach(r => {
            const s = statusInfo(statusOf(r));
            tableHtml += '<tr>' +
                '<td>' + esc(r.pump_code || '—') + '</td>' +
                '<td>' + esc(r.pump_number || '—') + '</td>' +
                '<td>' + esc(pick(r, ['pump_name_ar', 'pump_name']) || '—') + '</td>' +
                '<td>' + esc(s.label) + '</td>' +
                '<td>' + esc(r.serial_number || '—') + '</td>' +
                '<td>' + esc(r.manufacturer || '—') + '</td>' +
                '<td>' + esc(r.tank_name || '—') + '</td>' +
                '<td>' + esc(fmtDate(r.last_maintenance)) + '</td>' +
                '<td>' + esc(fmtDate(r.next_maintenance)) + '</td>' +
                '</tr>';
        });
        tableHtml += '</tbody></table>';
        if (list.length > 500) {
            tableHtml += '<p style="text-align:center;color:var(--text-muted);font-size:0.75rem;padding:8px">عرض 500 من ' + list.length + ' سجل</p>';
        }
        $('reportResults').innerHTML = summaryHtml + tableHtml;
    }

    function generateReport() {
        try {
            setLoading(true);
            const list = applyReportFilters();
            renderReportResults(list);
            state.reportGenerated = true;
            toast('تم توليد التقرير من ' + list.length + ' سجل', 'success');
        } catch (e) {
            toast(e.message || 'فشل توليد التقرير', 'error');
        } finally {
            setLoading(false);
        }
    }

    /* ============================================================
       تصدير CSV
       ============================================================ */
    function exportReportCSV() {
        try {
            const list = state.reportGenerated ? applyReportFilters() : state.filtered;
            if (!list.length) { toast('لا توجد بيانات للتصدير', 'warning'); return; }

            const keys = [
                'pump_code', 'pump_number', 'pump_name', 'pump_name_ar',
                'station_id', 'tank_id', 'serial_number', 'manufacturer', 'model',
                'installation_date', 'max_flow_rate', 'meter_start', 'meter_current',
                'meter_last_reset', 'status', 'status_reason',
                'last_maintenance', 'next_maintenance', 'maintenance_interval',
                'remarks', 'extra_data'
            ];
            const labels = [
                'الكود', 'الرقم', 'الاسم', 'الاسم بالعربي',
                'المحطة', 'الخزان', 'الرقم التسلسلي', 'الشركة المصنعة', 'الطراز',
                'تاريخ التركيب', 'أقصى معدل تدفق', 'بداية العداد', 'قراءة العداد',
                'آخر تصفير', 'الحالة', 'سبب الحالة',
                'آخر صيانة', 'الصيانة القادمة', 'فترة الصيانة',
                'ملاحظات', 'تفاصيل إضافية'
            ];
            const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const lines = [labels.map(csvCell).join(',')];
            list.forEach(r => {
                lines.push(keys.map(k => csvCell(r[k])).join(','));
            });
            const csv = '\uFEFF' + lines.join('\n');
            const filename = 'pumps_report_' + new Date().toISOString().slice(0, 10) + '.csv';

            try {
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    URL.revokeObjectURL(url);
                    a.remove();
                }, 500);
                toast('تم إنشاء ملف CSV (' + list.length + ' سجل)', 'success');
            } catch (dlErr) {
                const dataUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
                window.open(dataUri, '_blank');
                toast('تم فتح CSV في نافذة جديدة', 'success');
            }
        } catch (e) {
            toast(e.message || 'فشل تصدير CSV', 'error');
        }
    }

       طباعة / PDF

            if (hasBridgeMethod('printCurrentPageWithTitle')) {

                    bridge.printCurrentPageWithTitle('تقرير إدارة المضخات');
                    toast('تم فتح نافذة الطباعة', 'success');
                    return;
                } catch (_) {}
            }
            if (hasBridgeMethod('printCurrentPage')) {
                try {
                    bridge.printCurrentPage();
                    toast('تم فتح نافذة الطباعة', 'success');
                    return;
                } catch (_) {}
            }

            const printWindow = window.open('', '_blank');
            if (!printWindow) { toast('يجب السماح بالنوافذ المنبثقة للطباعة', 'error'); return; }
            let html = '<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8">' +

                'body{font-family:Cairo,Arial,sans-serif;padding:20px;direction:rtl}' +

                'table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}' +
                'th,td{border:1px solid #999;padding:6px;text-align:center}' +
                'th{background:#f0f2f5}' +
                '.meta{text-align:center;color:#666;font-size:11px;margin-bottom:14px}' +
                '@media print{body{padding:0}}' +
                '</style></head><body>';
            html += '<h1>تقرير إدارة المضخات</h1>';
            html += '<div class="meta">تاريخ الطباعة: ' + new Date().toLocaleString('ar-EG') +
                    ' | عدد السجلات: ' + list.length + '</div>';
            html += '<table><thead><tr>' +
                    '<th>#</th><th>الكود</th><th>الرقم</th><th>الاسم</th><th>الحالة</th>' +
                    '<th>الرقم التسلسلي</th><th>الشركة</th><th>الخزان</th><th>الصيانة القادمة</th>' +
                    '</tr></thead><tbody>';
            list.forEach((r, i) => {
                html += '<tr>' +

                    '<td>' + esc(r.pump_code || '') + '</td>' +
                    '<td>' + esc(r.pump_number || '') + '</td>' +
                    '<td>' + esc(pick(r, ['pump_name_ar', 'pump_name']) || '') + '</td>' +
                    '<td>' + esc(statusInfo(statusOf(r)).label) + '</td>' +
                    '<td>' + esc(r.serial_number || '') + '</td>' +
                    '<td>' + esc(r.manufacturer || '') + '</td>' +
                    '<td>' + esc(r.tank_name || '') + '</td>' +
                    '<td>' + esc(fmtDate(r.next_maintenance)) + '</td>' +
                    '</tr>';
            });
            html += '</tbody></table></body></html>';
            printWindow.document.write(html);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 300);
            toast('تم فتح نافذة الطباعة', 'success');
        } catch (e) {
            toast(e.message || 'فشل الطباعة', 'error');
        }

    function openReport() {
        const fromEl = $('reportFrom');
        const toEl = $('reportTo');
        if (fromEl && !fromEl.value) fromEl.value = today();
        if (toEl && !toEl.value) toEl.value = today();
        fillReportFilters();
        $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i>' +
            '<p>اختر الفلاتر ثم اضغط على "توليد التقرير"</p></div>';
        state.reportGenerated = false;
        openModal(null, 'reportModal');
    }

    function exportData() {
        const rows = state.filtered.length ? state.filtered : state.rows;
        if (!rows.length) { toast('لا توجد بيانات لتصديرها', 'warning'); return; }
        try {
            const keys = Object.keys(rows[0] || {});
            const csvCell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
            const lines = [keys.map(csvCell).join(',')];
            rows.forEach(r => lines.push(keys.map(k => csvCell(r[k])).join(',')));
            const csv = '\uFEFF' + lines.join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pumps_' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('تم تصدير ' + rows.length + ' سجل', 'success');
        } catch (e) {
            toast(e.message || 'فشل التصدير', 'error');
        }
    }

    /* ============================================================
       التهيئة
       ============================================================ */
    function initViewModes() {
        const container = $('viewModes');
        if (!container) return;
        container.querySelectorAll('button[data-view]').forEach(btn => {
            btn.addEventListener('click', () => {
                state.view = btn.dataset.view;
                container.querySelectorAll('button').forEach(b => {
                    const active = b === btn;
                    b.classList.toggle('active', active);
                    b.setAttribute('aria-selected', active ? 'true' : 'false');
                });
                render();
            });
        });
    }

    function initSidebar() {
        const toggle = $('sidebarToggle');
        if (toggle) toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSidebar();
        });

        document.querySelectorAll('.sidebar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.action;
                closeSidebar();
                setTimeout(() => {
                    switch (action) {
                        case 'refresh': reloadData(); break;
                        case 'new-pump': openForm(null); break;
                        case 'report': openReport(); break;
                        case 'export': exportData(); break;
                        case 'print': window.print(); break;
                        case 'home': goHome(); break;
                    }
                }, 200);
            });
        });
    }

    function initSearch() {
        const input = $('searchInput');
        if (!input) return;
        let timer = null;
        input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                state.search = input.value || '';
                applyFilter();
            }, 200);
        });
    }

    function initReportButtons() {
        const gen = $('genReportBtn');
        const exp = $('exportReportBtn');
        const prn = $('printReportBtn');
        if (gen) gen.addEventListener('click', generateReport);
        if (exp) exp.addEventListener('click', exportReportCSV);
        if (prn) prn.addEventListener('click', printReport);
    }

    function initGlobalListeners() {
        const themeBtn = $('themeToggle');
        if (themeBtn) themeBtn.addEventListener('click', toggleTheme);
        const saveBtn = $('saveBtn');
        if (saveBtn) saveBtn.addEventListener('click', saveForm);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
                document.body.style.overflow = '';
                closeSidebar();
            }
        });

        // Swipe down to close modals
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            let startY = 0;
            let lastY = 0;
            let dragging = false;
            const modal = overlay.querySelector('.modal');
            if (!modal) return;
            overlay.addEventListener('touchstart', (e) => {
                if (!overlay.classList.contains('show')) return;
                if (e.target.closest('.modal-header') || e.target === overlay) {
                    startY = e.touches[0].clientY;
                    lastY = startY;
                    dragging = true;
                }
            }, { passive: true });
            overlay.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                lastY = e.touches[0].clientY;
                const delta = lastY - startY;
                if (delta > 0 && delta < 120) {
                    modal.style.transform = 'translateY(' + delta + 'px)';
                }
            }, { passive: true });
            overlay.addEventListener('touchend', () => {
                if (!dragging) return;
                const delta = lastY - startY;
                modal.style.transform = '';
                if (delta > 80) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
                dragging = false;
            });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('show');
                    document.body.style.overflow = '';
                }
            });
        });
    }

    async function bootstrap() {
        applyTheme();
        renderFilters();
        renderBottomNav();
        initViewModes();
        initSidebar();
        initSearch();
        initReportButtons();
        initGlobalListeners();
        await loadLookups();
        await reloadData();
    }

    window.goHome = goHome;
    window.closeModal = closeModal;
    window.openModal = openModal;

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
        bootstrap();
    }
})();
</script>
