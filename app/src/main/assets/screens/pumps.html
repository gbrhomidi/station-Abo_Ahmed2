<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – إدارة المضخات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحّد — مستوحى من debt-reminders.html
           وضع فاتح افتراضي + وضع مظلم مخفف
           إطار فضي رفيع (1px) على جميع البطاقات والحقول
           ============================================================ */
        :root {
            /* ═══ الوضع الفاتح (افتراضي) ═══ */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-glass: rgba(0, 0, 0, 0.025);
            --bg-glass-light: rgba(0, 0, 0, 0.05);
            --text-primary: #1a2233;
            --text-secondary: #44546a;
            --text-muted: #8391a5;
            --border-color: #d8dde4;

            /* إطار فضي رفيع موحّد */
            --silver-border-color: #c4cad2;
            --silver-border-color-strong: #a8b0bb;
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

            --gold-primary: #c89a12;
            --gold-dark: #a67c00;
            --gold-light: #f5c842;
            --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

            --emerald-primary: #059669;
            --emerald-dark: #047857;
            --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --purple: #7c3aed;

            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

            --radius-card: 20px;
            --radius-small: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(255, 255, 255, 0.94);
            --nav-bg: rgba(255, 255, 255, 0.96);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;

            color-scheme: light;
        }

        /* ═══ الوضع المظلم المخفّف ═══ */
        [data-theme="dark"] {
            --bg-primary: #1e232b;
            --bg-secondary: #262c36;
            --bg-card: rgba(40, 47, 58, 0.88);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-light: rgba(255, 255, 255, 0.075);
            --text-primary: #d8dee6;
            --text-secondary: #9aa5b4;
            --text-muted: #6a7686;
            --border-color: rgba(200, 205, 212, 0.2);

            --silver-border-color: rgba(192, 197, 204, 0.35);
            --silver-border-color-strong: rgba(192, 197, 204, 0.55);
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --emerald-primary: #10b981;
            --emerald-dark: #059669;
            --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #9b59b6;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

            --header-bg: rgba(30, 35, 43, 0.94);
            --nav-bg: rgba(30, 35, 43, 0.96);
            --sidebar-bg: rgba(38, 44, 54, 0.98);
            --toast-bg: #262c36;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;

            color-scheme: dark;
        }

        /* ============================================================
           الأنماط الأساسية
           ============================================================ */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0 0 90px 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        /* ===== Pull-to-Refresh Indicator ===== */
        .pull-indicator {
            position: fixed;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            transition: top 0.2s ease;
            z-index: 50;
            background: var(--bg-secondary);
            border-bottom: var(--silver-border);
            pointer-events: none;
        }
        .pull-indicator.active { top: 0; }
        .pull-indicator i { margin-left: 8px; transition: transform 0.3s; }
        .pull-indicator.loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ===== Loading ===== */
        .loading-indicator {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(200, 154, 18, 0.15);
            border-top: 4px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        /* ===== Skeleton Loading ===== */
        .skeleton-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 16px 16px;
        }
        .skeleton-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            border: var(--silver-border-strong);
            position: relative;
            overflow: hidden;
        }
        .skeleton-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--skeleton-shine) 50%,
                transparent 100%);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .skeleton-row {
            height: 12px;
            background: var(--skeleton-bg);
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .skeleton-row.short { width: 40%; }
        .skeleton-row.medium { width: 60%; }
        .skeleton-row.long { width: 80%; }

        /* ===== Offline Banner ===== */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي (Header)
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 22px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: var(--silver-border);
            z-index: 100;
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-title {
            flex: 1;
            min-width: 150px;
        }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--gold-primary);
            font-size: 1.1rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            box-shadow: var(--silver-shadow);
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            background: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--danger);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.4); }
        }

        .ai-badge {
            background: linear-gradient(135deg, var(--purple), #6366f1);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 6px;
            vertical-align: middle;
        }

        /* ============================================================
           البحث والفلاتر
           ============================================================ */
        .search-wrap {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: right;
        }
        .search-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
        .filter-chip.active {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
            box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
        }

        /* ============================================================
           بطاقات الإحصائيات — توسيط كامل
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border: var(--silver-border);
            background: var(--bg-glass-light);
            color: var(--gold-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        .stat-trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            margin-top: 6px;
            padding: 3px 12px;
            border-radius: 30px;
            border: var(--silver-border);
        }
        .stat-trend.up { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-trend.down { background: rgba(220, 38, 38, 0.1); color: var(--danger); }

        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           بطاقات البيانات
           ============================================================ */
        .cards-container {
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .bank-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 16px 18px;
            position: relative;
            transition: var(--transition);
            cursor: pointer;
            touch-action: pan-y;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .bank-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px;
            height: 100%;
            background: var(--gold-primary);
            opacity: 0.7;
            transition: var(--transition);
        }
        .bank-card:hover {
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 8px 28px rgba(200, 154, 18, 0.12);
            transform: translateY(-2px);
        }
        .bank-card:hover::before { opacity: 1; width: 6px; }
        .bank-card.selected {
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 0 0 2px rgba(200, 154, 18, 0.2), 0 8px 28px rgba(200, 154, 18, 0.15);
        }
        .bank-card:active { transform: scale(0.98); transition-duration: 0.05s; }

        .bank-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .bank-card .card-header .card-avatar {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
            border: var(--silver-border);
        }
        .bank-card .card-header .card-status {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 700;
            border: var(--silver-border);
        }
        .card-status.active { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .card-status.inactive { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }

        .bank-card .card-name {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 2px;
            text-align: center;
        }
        .bank-card .card-code {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Inter', 'Arial', monospace;
            margin-bottom: 8px;
            text-align: center;
            direction: ltr;
        }
        .bank-card .card-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin: 8px 0 10px;
        }
        .bank-card .card-details .detail-item {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 4px 6px;
            border: var(--silver-border);
            border-radius: 8px;
            background: var(--bg-glass);
            text-align: center;
        }
        .bank-card .card-details .detail-item i {
            font-size: 0.8rem;
            color: var(--gold-primary);
        }
        .bank-card .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bank-card .card-actions .card-btn {
            flex: 1;
            min-width: 80px;
            padding: 9px 8px;
            border-radius: 10px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .bank-card .card-actions .card-btn:active { transform: scale(0.95); }
        .bank-card .card-actions .card-btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            background: var(--bg-glass-light);
        }
        .bank-card .card-actions .card-btn.danger:hover {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
            border-color: var(--danger);
        }

        .account-card {
            background: var(--bg-glass);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: var(--silver-border);
            transition: var(--transition);
            text-align: center;
        }
        .account-card:hover {
            border-color: var(--gold-primary);
            background: var(--bg-glass-light);
        }
        .account-card .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        .account-card .account-name {
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .account-card .account-number {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Inter', 'Arial', monospace;
            direction: ltr;
        }
        .account-card .account-balance {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--gold-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            text-align: center;
        }
        .account-card .account-details {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.7rem;
            color: var(--text-muted);
            justify-content: center;
        }
        .account-card .account-details .badge-type {
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
            border: var(--silver-border);
        }
        .badge-type.current { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .badge-type.savings { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .badge-type.deposit { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
        .badge-type.loan { background: rgba(220, 38, 38, 0.1); color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.4;
            display: block;
            color: var(--gold-primary);
        }
        .empty-state p { font-size: 0.9rem; }

        /* ============================================================
           الزر العائم (FAB)
           ============================================================ */
        .fab {
            position: fixed;
            bottom: 90px;
            left: 24px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--gold-primary);
            border: var(--silver-border);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(200, 154, 18, 0.3), var(--silver-shadow);
            transition: var(--transition);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active { transform: scale(0.9); }
        .fab:hover {
            background: var(--gold-dark);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 30px rgba(200, 154, 18, 0.4);
        }

        /* ============================================================
           القائمة الجانبية (Sidebar)
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--gold-primary);
            color: white;
            width: 40px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
            transition: var(--transition);
            border: var(--silver-border);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { background: var(--gold-dark); width: 44px; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 110px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 12px 10px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            border: var(--silver-border);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: var(--silver-border);
            padding: 12px 6px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 72px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.68rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية (Bottom Navigation)
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--silver-border-strong);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            min-width: 80px;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--gold-primary); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 10px;
        }

        /* ============================================================
           مودال التقارير
           ============================================================ */
        .report-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 900;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .report-modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .report-modal-overlay.show { display: flex; opacity: 1; }
        .report-modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .report-modal-overlay.show .report-modal { transform: translateY(0); }
        .report-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .report-modal .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
        }
        .report-modal .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .report-modal .modal-close:active { transform: scale(0.9); }
        .report-modal .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        .report-filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .report-filter-row .form-group { margin-bottom: 0; }
        .report-filter-row .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-align: center;
        }
        .report-filter-row .form-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .report-filter-row .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
        }
        .report-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .report-actions .btn {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            font-weight: 800;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            background: var(--bg-glass);
            color: var(--text-secondary);
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .report-actions .btn:active { transform: scale(0.97); }
        .report-actions .btn-primary {
            background: var(--gold-primary);
            color: white;
            border-color: var(--gold-dark);
        }
        .report-actions .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }
        .report-actions .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-secondary);
        }
        .report-actions .btn-secondary:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
        .report-results {
            margin-top: 20px;
            max-height: 320px;
            overflow-y: auto;
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            background: var(--bg-card);
            padding: 4px;
        }
        .report-results table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            font-size: 0.8rem;
        }
        .report-results table th {
            background: var(--bg-glass-light);
            color: var(--gold-primary);
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: 800;
            border: var(--silver-border);
            border-radius: 10px 10px 0 0;
        }
        .report-results table td {
            padding: 10px 12px;
            border: var(--silver-border);
            text-align: center;
            color: var(--text-secondary);
            background: var(--bg-glass);
            border-radius: 10px;
        }
        .report-results table tr:hover td {
            background: var(--bg-glass-light);
            color: var(--text-primary);
        }
        .report-results .empty-state {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
        }

        /* ============================================================
           مودال الإضافة / التعديل
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: var(--silver-border);
            padding-bottom: 14px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* ===== حقول النموذج ===== */
        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
            font-weight: 600;
        }
        .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
        }
        .form-input::placeholder { color: var(--text-muted); text-align: center; }
        select.form-input option { background: var(--bg-secondary); color: var(--text-primary); }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--gold-primary);
            color: white;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }

        /* ============================================================
           مودال التفاصيل
           ============================================================ */
        .details-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 850;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            overflow-y: auto;
        }
        [data-theme="dark"] .details-overlay { background: rgba(0, 0, 0, 0.85); }
        .details-overlay.show { display: block; opacity: 1; }
        .details-content {
            background: var(--bg-secondary);
            min-height: 100vh;
            padding: 24px 20px 100px;
            border: var(--silver-border-strong);
            border-top: none;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            padding: 10px 0;
            z-index: 10;
            border-bottom: var(--silver-border);
        }
        .details-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
        }
        .details-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .details-close:active { transform: scale(0.9); }
        .details-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }
        .details-profile { text-align: center; margin-bottom: 24px; }
        .details-avatar {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            margin: 0 auto 12px;
            border: var(--silver-border);
        }
        .details-name {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-primary);
            text-align: center;
        }
        .details-status {
            padding: 4px 16px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            border: var(--silver-border);
        }
        .details-status.active { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .details-status.inactive { background: rgba(148, 163, 184, 0.1); color: var(--text-muted); }
        .details-section {
            background: var(--bg-glass);
            border-radius: var(--radius-small);
            padding: 16px;
            margin-bottom: 16px;
            border: var(--silver-border-strong);
            box-shadow: var(--silver-shadow);
        }
        .details-section-title {
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .details-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: var(--silver-border);
            gap: 10px;
        }
        .details-row:last-child { border-bottom: none; }
        .details-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
        }
        .details-value {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            text-align: left;
            direction: ltr;
        }

        /* ============================================================
           Toast إشعارات
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--silver-border-strong);
            border-radius: 14px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
            min-width: 220px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-primary);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--emerald-primary); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--gold-primary); }
        .toast-icon {
            width: 28px; height: 28px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border: var(--silver-border);
        }
        .toast.success .toast-icon { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
        .toast.error .toast-icon { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .toast.warning .toast-icon { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .toast.info .toast-icon { background: rgba(200, 154, 18, 0.12); color: var(--gold-primary); }

        /* ============================================================
           الرسوم المتحركة
           ============================================================ */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease forwards; }

        /* ============================================================
           تحسينات للهواتف
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.15rem; }
            .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
            .bank-card .card-details { grid-template-columns: 1fr; }
            .report-filter-row { grid-template-columns: 1fr; }
            .cards-container { padding: 0 12px 16px; }
            .bottom-nav .nav-item i { font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 0.68rem; }
            .sidebar { width: 100px; padding: 10px 8px; }
            .sidebar-btn { min-height: 66px; font-size: 0.8rem; }
            .sidebar-btn i { font-size: 1.3rem; }
            .fab { width: 48px; height: 48px; font-size: 1.2rem; bottom: 80px; left: 16px; }
            .filter-chip { font-size: 0.72rem; padding: 6px 12px; }
            .top-title h2 { font-size: 1.1rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .report-modal { padding: 16px; }
            .report-results { max-height: 220px; }
            .report-results table th,

            .form-row { grid-template-columns: 1fr; }

</head>
<body>

    <div class="modal-overlay" id="aiModal" onclick="closeModal(event,'aiModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><h3 class="modal-title">المساعد الذكي</h3><button type="button" class="modal-close" onclick="closeModal(null,'aiModal')"><i class="fas fa-times"></i></button></div><div class="modal-body"><textarea class="form-input" id="aiPrompt" rows="4" placeholder="اكتب سؤالك..."></textarea><div class="action-row"><button class="btn primary" type="button" onclick="askAI()">إرسال</button></div><div class="ai-output" id="aiOutput"></div></div></div></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
        'use strict';
        const CFG = {"title":"إدارة المضخات","icon":"fa-charging-station","module":"tanks","listMethod":"getPumpRecords","listArgs":["{}"],"fields":[{"label":"كود المضخة","key":"pump_code","type":"text","required":true,"placeholder":""},{"label":"رقم المضخة","key":"pump_number","type":"text","required":true,"placeholder":""},{"label":"اسم المضخة","key":"pump_name","type":"text","required":false,"placeholder":""},{"label":"pump name ar","key":"pump_name_ar","type":"text","required":false,"placeholder":""},{"label":"المحطة","key":"station_id","type":"number","required":true,"placeholder":""},{"label":"الخزان","key":"tank_id","type":"number","required":true,"placeholder":""},{"label":"serial number","key":"serial_number","type":"text","required":false,"placeholder":""},{"label":"manufacturer","key":"manufacturer","type":"text","required":false,"placeholder":""},{"label":"model","key":"model","type":"text","required":false,"placeholder":""},{"label":"installation date","key":"installation_date","type":"date","required":false,"placeholder":""},{"label":"max flow rate","key":"max_flow_rate","type":"number","required":false,"placeholder":""},{"label":"meter start","key":"meter_start","type":"text","required":false,"placeholder":""},{"label":"meter current","key":"meter_current","type":"number","required":false,"placeholder":""},{"label":"meter last reset","key":"meter_last_reset","type":"text","required":false,"placeholder":""},{"label":"الحالة","key":"status","type":"select","required":false,"placeholder":""},{"label":"status reason","key":"status_reason","type":"text","required":false,"placeholder":""},{"label":"last maintenance","key":"last_maintenance","type":"text","required":false,"placeholder":""},{"label":"next maintenance","key":"next_maintenance","type":"text","required":false,"placeholder":""},{"label":"maintenance interval","key":"maintenance_interval","type":"text","required":false,"placeholder":""},{"label":"ملاحظات","key":"remarks","type":"textarea","required":false,"placeholder":""},{"label":"extra data","key":"extra_data","type":"textarea","required":false,"placeholder":""}],"valueFields":["max_flow_rate"],"titleFields":["pump_code","pump_number","pump_name"],"subtitleFields":["pump_code","pump_number","pump_name","pump_name_ar","station_id","tank_id","serial_number","manufacturer"],"createMethod":"savePumpRecord","updateMethod":"updatePumpRecord","deleteMethod":"deletePumpRecord","note":"","mode":"list","objectMode":false,"updateAction":null,"reportKind":"operational:Pump","aiMethod":null,"reports":["الكل","نشطة","متوقفة","صيانة","تقارير"],"resolveMethod":null,"operationKey":"pumps"};
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: 'all', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => new Date().toISOString().slice(0,10);
        function toast(message, bad=false) { const node=$('toast'); node.textContent=message; node.className='toast show'; node.style.background=bad?'var(--error)':'#111827'; clearTimeout(node._timer); node._timer=setTimeout(()=>node.classList.remove('show'),3500); }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) { if (raw == null) throw new Error('لم يرجع الجسر نتيجة'); const value=typeof raw==='string'?JSON.parse(raw):raw; if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية'); return value; }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }

        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({limit: 200, search: $('searchInput').value || ''})];

            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw=dataOf(value);

            if (raw && Array.isArray(raw.rows)) return raw.rows;

        function field(row, names) { for (const name of (names||[])) { if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name]; } return ''; }

        function subtitleOf(row) { return (CFG.subtitleFields||[]).map(k => { const v=row&&row[k]; return v===undefined||v===null||v===''?null:k+': '+v; }).filter(Boolean).join(' · '); }
        function idOf(row) { return field(row,['id','_id','vehicle_id','pump_id','tank_id','payment_id','shift_id','sale_id','request_id','asset_id','employee_id']); }
        function numeric(v) { const n=Number(v); return Number.isFinite(n)?n:0; }

        function renderFilters() {

            document.querySelectorAll('#bottomNav [data-bottom-filter]').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('#bottomNav .nav-item').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.filter=btn.dataset.bottomFilter; applyFilter(); }));

        function renderCards() {
            renderStats(); const box=$('cardsContainer');
            if (!state.filtered.length) { box.innerHTML=`<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`; return; }
            box.innerHTML=state.filtered.map((row,index)=>{
                const id=esc(idOf(row)||index); const fields=(CFG.subtitleFields||[]).filter(k=>row && row[k]!==undefined && row[k]!==null && row[k]!=='').slice(0,8);
                const value=(CFG.valueFields||[]).map(k=>numeric(row&&row[k])).filter(v=>v!==0).reduce((a,b)=>a+b,0);
                const buttons=`<div class="action-row"><button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>${CFG.updateMethod?`<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>`:''}${CFG.resolveMethod?`<button class="btn" type="button" data-resolve="${id}"><i class="fas fa-check"></i> اعتماد/حل</button>`:''}${CFG.deleteMethod?`<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>`:''}</div>`;
                return `<article class="data-card"><div class="data-card-head"><div style="flex:1"><div class="data-card-title">${esc(titleOf(row))}</div><div class="data-card-subtitle">${esc(subtitleOf(row))}</div></div>${value?`<div class="data-card-value">${value.toLocaleString('ar',{maximumFractionDigits:2})}</div>`:''}</div><div class="data-fields">${fields.map(k=>`<div class="data-field"><span>${esc(k)}</span><strong>${esc(row[k])}</strong></div>`).join('')}</div>${buttons}</article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRow(findRow(b.dataset.delete))));
            box.querySelectorAll('[data-resolve]').forEach(b=>b.addEventListener('click',()=>resolveRow(findRow(b.dataset.resolve))));
        }
        function findRow(id) { return state.rows.find((row,index)=>String(idOf(row)||index)===String(id)); }
        function openDetails(id) { const row=findRow(id); if(!row)return; $('detailsBody').innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-item"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join('')}</div><details style="margin-top:14px"><summary>JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row,null,2))}</pre></details>`; openModal(null,'detailsModal'); }
        function inputHtml(def,row) { const value=row&&row[def.key]!==undefined?row[def.key]:''; const req=def.required?'required':''; const placeholder=def.placeholder?`placeholder="${esc(def.placeholder)}"`:''; if(def.type==='textarea')return `<div class="form-group full"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`; if(def.type==='select')return `<div class="form-group"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><select class="form-input" data-key="${esc(def.key)}" ${req}><option value="">اختر...</option><option value="active">نشط</option><option value="inactive">غير نشط</option><option value="open">مفتوح</option><option value="pending">معلق</option><option value="cash">نقدي</option><option value="credit">آجل</option><option value="morning">صباحية</option><option value="evening">مسائية</option><option value="night">ليلية</option><option value="in">إيراد</option><option value="out">مصروف</option><option value="high">عالية</option><option value="medium">متوسطة</option><option value="low">منخفضة</option><option value="completed">مكتمل</option></select></div>`; return `<div class="form-group ${def.type==='datetime-local'?'full':''}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label><input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`; }
        function openForm(row=null) { if(!CFG.createMethod && !CFG.updateMethod){toast('لا توجد عملية كتابة مدعومة لهذه الشاشة في العقد الحالي',true);return;} state.editing=row; $('formTitle').textContent=row?'تعديل السجل':'إضافة سجل جديد'; $('recordForm').innerHTML=(CFG.fields||[]).map(def=>inputHtml(def,row)).join(''); if(row) (CFG.fields||[]).forEach(def=>{const el=document.querySelector(`[data-key="${CSS.escape(def.key)}"]`); if(el&&def.type==='select')el.value=row[def.key]??'';}); $('formModal').classList.add('show'); }
        function collectForm() { const payload={}; document.querySelectorAll('#recordForm [data-key]').forEach(el=>{ let value=el.value; const type=el.type; if(type==='number') value=value===''?0:Number(value); payload[el.dataset.key]=value; }); if(CFG.module==='vehicles' && CFG.title==='إدارة السائقين') payload.party_type='driver'; return payload; }
        async function saveForm() { const form=$('recordForm'); if(!form.reportValidity())return; const payload=collectForm(); setLoading(true); try { let result; if(state.editing && CFG.updateMethod) { const id=idOf(state.editing); if(!id)throw new Error('معرف السجل غير صالح'); if(CFG.updateAction==='tankQuantity') result=await invoke(CFG.updateMethod,[Number(id),Number(payload.current_quantity||0)]); else if(CFG.updateAction==='maintenanceStatus') result=await invoke(CFG.updateMethod,[JSON.stringify({request_id:Number(id),status:payload.status||'completed'})]); else if(CFG.updateAction==='endShift') result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); else result=await invoke(CFG.updateMethod,[Number(id),JSON.stringify(payload)]); } else if(CFG.createMethod) { if(CFG.createMethod==='saveBalanceSheet') result=await invoke(CFG.createMethod,[today(),0]); else result=await invoke(CFG.createMethod,[JSON.stringify(payload)]); } else throw new Error('لا توجد عملية حفظ مدعومة'); parse(result); toast('تم تنفيذ العملية والتحقق من نجاحها'); closeModal(null,'formModal'); await reloadData(); } catch(error) { toast(error.message||'فشلت العملية',true); } finally { setLoading(false); } }
        async function deleteRow(row) { const id=row&&idOf(row); if(!id||!CFG.deleteMethod)return; if(!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟'))return; setLoading(true); try { const result=await invoke(CFG.deleteMethod,[Number(id)]); parse(result); toast('تم الحذف فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل الحذف',true); } finally { setLoading(false); } }
        async function resolveRow(row) { const id=row&&idOf(row); if(!id||!CFG.resolveMethod)return; const note=prompt('أدخل ملاحظة الاعتماد/الحل إن لزم:',''); if(note===null)return; setLoading(true); try { const result=await invoke(CFG.resolveMethod,[Number(id),String(note)]); parse(result); toast('تم تنفيذ العملية فعلياً'); await reloadData(); } catch(error) { toast(error.message||'فشل تنفيذ العملية',true); } finally { setLoading(false); } }
        async function reloadData() { if(CFG.mode==='unsupported'||CFG.mode==='ai'){ renderCards(); return; } if(CFG.mode==='backup'){ loadBackupHistory(); return; } if(!CFG.listMethod){ renderCards(); return; } if(!bridge){ $('offlineBanner').classList.add('show'); renderCards(); return; } setLoading(true); try { const result=await invoke(CFG.listMethod,argsForLoad()); state.rows=rowsFrom(result); state.loadedAt=new Date(); $('offlineBanner').classList.remove('show'); applyFilter(); } catch(error) { state.rows=[]; state.loadedAt=new Date(); renderCards(); toast(error.message||'فشل تحميل البيانات',true); } finally { setLoading(false); } }
        function openModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.add('show'); } function closeModal(event,id) { if(event&&event.target!==event.currentTarget)return; $(id).classList.remove('show'); }
        function openReport() { setDateDefaults(); $('reportResults').innerHTML='<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات المحملة من SQLite.</p></div>'; openModal(null,'reportModal'); }
        async function generateReport() { setLoading(true); try { let result; if(CFG.reportKind==='balanceSheet') result=await invoke('getBalanceSheet',[($('reportTo').value||today()),0]); else if(CFG.reportKind==='eod') result=await invoke('getEodReport',[]); else if(String(CFG.reportKind||'').startsWith('operational:')) { const suffix=String(CFG.reportKind).split(':')[1]; result=await invoke('generate'+suffix+'Report',[JSON.stringify({from_date:$('reportFrom').value||'',to_date:$('reportTo').value||'',search:$('searchInput').value||'',include_archived:true,limit:1000})]); } else result={data:state.filtered}; $('reportResults').innerHTML=renderReport(rowsFrom(result)); toast('تم توليد التقرير من المصدر الفعلي'); } catch(e) { toast(e.message||'فشل التقرير',true); } finally { setLoading(false); } }
        function renderReport(rows) { if(!rows.length)return '<div class="empty-state">لا توجد بيانات للتقرير.</div>'; return `<div class="data-fields">${rows.slice(0,100).map(row=>`<div class="data-field"><span>${esc(titleOf(row))}</span><strong>${esc(subtitleOf(row)||JSON.stringify(row))}</strong></div>`).join('')}</div>`; }
        function exportData() { const rows=state.filtered; if(!rows.length){toast('لا توجد بيانات حقيقية لتصديرها',true);return;} const keys=[...new Set(rows.flatMap(row=>Object.keys(row||{})))]; const csv='\ufeff'+[keys, ...rows.map(row=>keys.map(k=>String(row[k]??'').replace(/"/g,'""')))].map(row=>row.map(v=>`"${v}"`).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='{filename}.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً'); }
        async function askAI() { if(CFG.aiMethod!=='sendToAI'){toast('المساعد غير متاح لهذا المسار',true);return;} const prompt=($('aiPrompt').value||'').trim(); if(!prompt){toast('اكتب السؤال أولاً',true);return;} if(!bridge||typeof bridge.sendToAI!=='function'){toast('عقد المساعد غير متاح في Android Bridge',true);return;} $('aiOutput').textContent='جاري انتظار رد Android...'; window.onAIResponse=(payload)=>{ const result=typeof payload==='string'?JSON.parse(payload):payload; if(result&&result.success){ $('aiOutput').textContent=result.response||'عاد الرد دون نص'; toast('وصل رد المساعد فعلياً'); } else { $('aiOutput').textContent=result&&result.error||'فشل رد المساعد'; toast($('aiOutput').textContent,true); } setLoading(false); }; setLoading(true); try { const started=parse(bridge.sendToAI(prompt)); if(started.status!=='processing') window.onAIResponse(started); } catch(e) { setLoading(false); $('aiOutput').textContent=e.message; toast(e.message,true); } }
        function goHome() { window.location.href='../main.html'; }
        function applyTheme() { const saved=localStorage.getItem('theme')||'light'; if(saved==='dark')document.documentElement.dataset.theme='dark'; $('themeIcon').className=saved==='dark'?'fas fa-sun':'fas fa-moon'; }
        function toggleTheme() { const dark=document.documentElement.dataset.theme==='dark'; if(dark)delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme='dark'; localStorage.setItem('theme',dark?'light':'dark'); $('themeIcon').className=dark?'fas fa-moon':'fas fa-sun'; }
        function initSpecial() {
            if(CFG.mode==='unsupported'){ $('fab').classList.add('hidden'); }
            if(CFG.mode==='ai'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="settings-wrap"><div class="settings-card"><h3>أرسل طلباً إلى المساعد</h3><p class="data-card-subtitle">لا تُحفظ الرسالة في localStorage ولا تُعرض نتيجة نجاح قبل عودة الجسر.</p><div class="action-row"><button class="btn primary" onclick="openModal(null,\'aiModal\')">فتح المساعد</button></div></div></div>'; }
            if(CFG.mode==='backup'){ $('fab').classList.add('hidden'); $('cardsContainer').innerHTML='<div class="utility-grid"><div class="utility-card"><h3>نسخة قاعدة البيانات</h3><p>تنفيذ النسخ عبر Android ثم استقبال callback الفعلي.</p><button class="btn primary" onclick="startAsync(\'backupDatabase\',\'onBackupResult\')">إنشاء نسخة</button></div><div class="utility-card"><h3>تصدير كل البيانات</h3><p>يستخدم exportAllData ويعرض نتيجة callback.</p><button class="btn primary" onclick="startAsync(\'exportAllData\',\'onExportAllResult\')">بدء التصدير</button></div><div class="utility-card"><h3>معلومات قاعدة البيانات</h3><p id="dbInfo">اضغط لقراءة المعلومات الفعلية.</p><button class="btn" onclick="loadDbInfo()">قراءة</button></div></div>'; }
        }
        function startAsync(method,callbackName){ if(!bridge||typeof bridge[method]!=='function'){toast('العقد '+method+' غير متاح',true);return;} window[callbackName]=(value)=>{const parsed=typeof value==='string'?JSON.parse(value):value; if(parsed.success)toast(parsed.message||'اكتملت العملية فعلياً'); else toast(parsed.error||'فشلت العملية',true);}; try{const result=parse(bridge[method]()); if(result.status==='processing')toast('بدأت العملية؛ انتظار نتيجة Android...');}catch(e){toast(e.message,true);} }
        async function loadDbInfo(){try{const result=await invoke('getDatabaseInfo',[]); $('dbInfo').textContent=JSON.stringify(dataOf(result));}catch(e){$('dbInfo').textContent=e.message;toast(e.message,true);}}
        async function loadBackupHistory(){if(CFG.mode!=='backup'||!bridge||typeof bridge.getBackupHistoryRecords!=='function')return;try{const result=await invoke('getBackupHistoryRecords',[JSON.stringify({limit:100})]);const rows=rowsFrom(result);$('backupHistory').innerHTML=rows.length?rows.map(row=>`<div class="data-card"><strong>${esc(row.file_name||row.backup_type||row.id)}</strong><div class="data-card-subtitle">${esc([row.status,row.started_at,row.completed_at,row.file_size_mb,row.storage_location].filter(Boolean).join(' · '))}</div></div>`).join(''):'<div class="empty-state">لا توجد سجلات نسخ في SQLite.</div>';}catch(e){$('backupHistory').textContent=e.message;toast(e.message,true);}}
        $('searchInput').addEventListener('input',applyFilter); $('themeToggle').addEventListener('click',toggleTheme); $('fab').addEventListener('click',()=>openForm()); $('saveBtn').addEventListener('click',saveForm); $('sidebarToggle').addEventListener('click',()=>{const side=$('sidebar');side.classList.toggle('open');}); document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay').forEach(x=>x.classList.remove('show'));});
        window.addEventListener('online',()=>toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق')); window.addEventListener('offline',()=>$('offlineBanner').classList.add('show'));
        Object.assign(window, {goHome, openReport, exportData, reloadData, openForm, saveForm, openModal, closeModal, startAsync, loadDbInfo, askAI});
        applyTheme(); renderFilters(); initSpecial(); if(CFG.mode!=='unsupported'&&CFG.mode!=='backup'&&CFG.mode!=='ai')reloadData(); else renderCards();
    })();
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
