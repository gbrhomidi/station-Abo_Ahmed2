function openSidebar() {
    const sidebar = $('sidebar');
    if (!sidebar) return;
    sidebar.classList.add('open');
    document.body.classList.add('sidebar-is-open');
    const toggle = $('sidebarToggle');
    if (toggle) toggle.setAttribute('aria-expanded', 'true');
}

function closeSidebar() {
    const sidebar = $('sidebar');
    if (!sidebar) return;
    sidebar.classList.remove('open');
    document.body.classList.remove('sidebar-is-open');
    const toggle = $('sidebarToggle');
    if (toggle) toggle.setAttribute('aria-expanded', 'false');
}

function toggleSidebar() {
    const sidebar = $('sidebar');
    if (!sidebar) return;
    if (sidebar.classList.contains('open')) closeSidebar();
    else openSidebar();
}

function setupSidebar() {
    const sidebar = $('sidebar');
    const toggle = $('sidebarToggle');
    if (!sidebar || !toggle) return;
    toggle.addEventListener('click', (e) => { e.stopPropagation(); toggleSidebar(); });
    document.addEventListener('click', (e) => {
        if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && !toggle.contains(e.target)) {
            closeSidebar();
        }
    }, true);
    document.addEventListener('touchstart', (e) => {
        if (!sidebar.classList.contains('open')) return;
        const t = e.target;
        if (sidebar.contains(t) || toggle.contains(t)) return;
        closeSidebar();
    }, {passive:true});
    sidebar.querySelectorAll('[data-sidebar]').forEach(btn => {
        btn.addEventListener('click', () => {
            handleSidebarAction(btn.dataset.sidebar);
        });
    });
}

function handleSidebarAction(action) {
    closeSidebar();
    switch(action) {
        case 'newSale':
            openForm();
            break;
        case 'return':
            openFuelAdjustment(null);
            break;
        case 'report':
            openReport();
            break;
        case 'home':
            goHome();
            break;
    }
}

async function fetchAllForReport(filters) {
    const MAX_ROWS = 5000;
    const PAGE_SIZE = 100;
    let allRows = [];
    let offset = 0;
    let total = 0;
    let iterations = 0;
    const maxIter = Math.ceil(MAX_ROWS / PAGE_SIZE);

    while (iterations < maxIter) {
        const params = {
            limit: PAGE_SIZE,
            offset: offset,
            search: ($('searchInput')?.value || '').trim()
        };
        if (filters.from_date) params.from_date = filters.from_date;
        if (filters.to_date) params.to_date = filters.to_date;
        if (filters.fuel_type_id > 0) params.fuel_type_id = filters.fuel_type_id;
        if (filters.pump_id > 0) params.pump_id = filters.pump_id;
        if (filters.payment_method) params.payment_method = filters.payment_method;
        if (filters.shift_id > 0) params.shift_id = filters.shift_id;

        let result;
        try {
            result = await invoke('getFuelSalesPage', [JSON.stringify(params)]);
        } catch (err) {
            console.error('[Report Fetch]', err);
            break;
        }
        const parsed = dataOf(result) || {};
        const rows = Array.isArray(parsed.rows) ? parsed.rows : [];
        total = Number(parsed.total_count || 0);
        if (rows.length === 0) break;
        allRows = allRows.concat(rows);
        offset += rows.length;
        if (offset >= total) break;
        iterations++;
    }
    return {rows: allRows, total};
}

function aggregate(rows, keyFn) {
    const map = new Map();
    rows.forEach(row => {
        const key = keyFn(row) || 'غير محدد';
        if (!map.has(key)) {
            map.set(key, {key: key, count: 0, quantity: 0, total_amount: 0, returned: 0, damaged: 0});
        }
        const agg = map.get(key);
        agg.count += 1;
        agg.quantity += numeric(row.quantity);
        agg.total_amount += numeric(row.total_amount);
        agg.returned += numeric(row.returned_quantity);
        agg.damaged += numeric(row.damaged_quantity);
    });
    return Array.from(map.values()).sort((a,b) => b.total_amount - a.total_amount);
}

function aggregateDaily(rows) {
    const map = new Map();
    rows.forEach(row => {
        const day = String(row.sale_date || '').trim() || 'بدون تاريخ';
        if (!map.has(day)) {
            map.set(day, {key: day, count: 0, quantity: 0, total_amount: 0});
        }
        const agg = map.get(day);
        agg.count += 1;
        agg.quantity += numeric(row.quantity);
        agg.total_amount += numeric(row.total_amount);
    });
    return Array.from(map.values()).sort((a,b) => String(b.key).localeCompare(String(a.key)));
}

async function generateReport() {
    const results = $('reportResults');
    if (!results) return;
    const filters = readReportFilters();
    if (filters.from_date && filters.to_date && filters.from_date > filters.to_date) {
        showAdvancedNotification('تاريخ البداية يجب ألا يتجاوز تاريخ النهاية', 'warning', 'تنبيه');
        return;
    }
    if (!bridge) {
        showAdvancedNotification('Android Bridge غير متاح', 'error', 'خطأ');
        return;
    }

    results.style.display = 'block';
    results.innerHTML = '<div class="report-meta"><i class="fas fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>';
    setLoading(true);

    try {
        const fetchResult = await fetchAllForReport(filters);
        state.reportRows = fetchResult.rows || [];
        state.reportMeta = {
            from_date: filters.from_date,
            to_date: filters.to_date,
            total_count: fetchResult.total,
            generated_at: new Date().toISOString()
        };
        const html = buildReportView(state.reportRows, state.reportMeta);
        results.innerHTML = html;
        showAdvancedNotification(
            'تم توليد التقرير — ' + state.reportRows.length + ' سجل',
            'success',
            '✅ التقرير جاهز'
        );

    } finally {
        setLoading(false);
    }
}

function openExportSheet() {

    const status = $('exportStatus');
    if (status) { status.className = 'export-status'; status.innerHTML = ''; }

}

function closeExportSheet(event) {
    if (event && event.target !== event.currentTarget) return;
    $('exportSheet').classList.remove('show');
}

function buildCsvContent(rows) {
    if (!rows.length) return '';
    const keys = ['sale_id','sale_date','sale_time','fuel_type_id','fuel_name','quantity','price_per_liter','total_amount','payment_method','customer_id','shift_id','pump_id','nozzle_id','notes'];
    const headers = keys.map(k => translateFieldLabel(k));
    const csvRows = [headers];
    rows.forEach(row => {
        csvRows.push(keys.map(k => {
            const v = row[k];
            if (v == null) return '';
            return String(v).replace(/"/g, '""');
        }));
    });
    const BOM = '\uFEFF';
    return BOM + csvRows.map(r => r.map(v => '"' + v + '"').join(',')).join('\n');
}

function buildReportFilename() {
    const meta = state.reportMeta || {};
    const typeLabel = REPORT_TYPE_LABELS[state.reportType] || 'تقرير';
    const from = meta.from_date || 'غير_محدد';
    const to = meta.to_date || 'غير_محدد';
    let name = 'تقرير_مبيعات_الوقود_' + typeLabel + '_' + from + '_' + to;
    return name.replace(/[\\/:*?"<>|\n\r\t]/g, '_').replace(/\s+/g, '_').substring(0, 100);
}

async function confirmExport(mode) {
    const status = $('exportStatus');
    if (!status) return;
    if (!state.reportRows || !state.reportRows.length) {
        status.className = 'export-status error show';
        status.textContent = 'لا توجد بيانات للتصدير. قم بتوليد التقرير أولاً.';
        return;
    }
    const filename = buildReportFilename();

    if (mode === 'bridge') {
        status.className = 'export-status show';
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التصدير عبر النظام...';
        try {
            if (!bridge || typeof bridge.exportOperationalCsv !== 'function') {
                throw new Error('طريقة التصدير عبر النظام غير متاحة في هذا الإصدار');
            }
            const filters = readReportFilters();
            const params = {
                limit: 1000,
                offset: 0
            };
            if (filters.from_date) params.from_date = filters.from_date;
            if (filters.to_date) params.to_date = filters.to_date;

            const done = new Promise((resolve) => {
                window.onOperationalExportResult = function(result) {
                    resolve(result || {});
                };
                setTimeout(() => resolve({timeout: true}), 30000);
            });

            try {
                const raw = bridge.exportOperationalCsv('fuel_sales', JSON.stringify(params));
                const ack = typeof raw === 'string' ? JSON.parse(raw) : raw;
                if (ack && ack.success === false) throw new Error(ack.error || ack.message || 'رفض الجسر بدء التصدير');
            } catch (e) {
                throw new Error(e.message || 'تعذر بدء التصدير');
            }

            const result = await done;
            if (result.timeout) {
                status.className = 'export-status error show';
                status.textContent = 'انتهت مهلة التصدير. تحقق من مجلد التطبيق.';
                return;
            }
            if (result.success) {
                status.className = 'export-status show';
                status.innerHTML = '<i class="fas fa-check-circle"></i> تم التصدير بنجاح'
                    + '<span class="export-path">' + esc(result.path || '') + '</span>'
                    + '<div style="margin-top:6px;font-size:0.68rem;color:var(--text-muted);">يمكنك فتح الملف عبر مدير الملفات في المسار أعلاه</div>';
            } else {
                status.className = 'export-status error show';
                status.textContent = result.error || 'فشل التصدير';
            }
        } catch (e) {
            status.className = 'export-status error show';
            status.textContent = e.message || 'فشل التصدير عبر النظام';
        }
    } else if (mode === 'browser') {
        status.className = 'export-status show';
        status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تجهيز الملف للتنزيل...';
        try {
            const csv = buildCsvContent(state.reportRows);
            if (!csv) throw new Error('لا توجد بيانات');
            const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename + '.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 500);
            status.className = 'export-status show';
            status.innerHTML = '<i class="fas fa-check-circle"></i> تم تجهيز الملف للتنزيل. ابحث عنه في مجلد التنزيلات.';
        } catch (e) {
            status.className = 'export-status error show';
            status.textContent = e.message || 'فشل التنزيل';
        }
    }
}

/* ============================================================
   Fuel Adjustment
   ============================================================ */
let fuelAdjustmentRow = null;

function resetFuelAdjustmentForm(options) {
    const opts = options || {};
    if (opts.keepDropdown !== true) {
        const sel = $('fuelAdjustmentSaleSelect');
        if (sel) sel.value = '';
    }
    $('fuelAdjustmentPreviewFuel').value = '';
    $('fuelAdjustmentPreviewDate').value = '';
    $('fuelAdjustmentPreviewCustomer').value = '';
    $('fuelAdjustmentPreviewQty').value = '';
    $('fuelAdjustmentAvailable').value = '';
    $('fuelAdjustmentQty').value = '';
    $('fuelAdjustmentReason').value = '';
    const typeEl = $('fuelAdjustmentType');
    if (typeEl) typeEl.value = 'return';
    fuelAdjustmentRow = null;
}

function fillFuelAdjustmentFromRow(row) {
    if (!row) return;
    fuelAdjustmentRow = row;
    const saleId = Number(row.sale_id || row.id || 0);
    const fuelLabel = translateFieldValue('fuel_type_id', row.fuel_name_ar || row.fuel_name || row.fuel_type_name || row.fuel_type_id);
    const saleDate = String(row.sale_date || '').trim() || '—';
    const saleTime = String(row.sale_time || '').trim();
    const saleDateFull = saleTime ? saleDate + ' — ' + saleTime : saleDate;
    const customer = String(row.customer_name || row.customer_name_ar || row.customer_display_name || '').trim() || 'بيع نقدي';
    const originalQty = numeric(row.original_quantity ?? row.quantity);
    const alreadyReturned = numeric(row.returned_quantity);
    const alreadyDamaged = numeric(row.damaged_quantity);
    const available = Math.max(0, originalQty - alreadyReturned - alreadyDamaged);

    const sel = $('fuelAdjustmentSaleSelect');
    if (sel && !sel.value && saleId) sel.value = String(saleId);

    $('fuelAdjustmentPreviewFuel').value = fuelLabel;
    $('fuelAdjustmentPreviewDate').value = saleDateFull;
    $('fuelAdjustmentPreviewCustomer').value = customer;
    $('fuelAdjustmentPreviewQty').value = originalQty.toFixed(2) + ' لتر';
    $('fuelAdjustmentAvailable').value = available.toFixed(2);
    $('fuelAdjustmentQty').value = available > 0 ? available.toFixed(2) : '';
    $('fuelAdjustmentQty').max = String(available);
    $('fuelAdjustmentReason').value = '';
}

async function populateFuelAdjustmentSaleSelect() {
    const sel = $('fuelAdjustmentSaleSelect');
    if (!sel) return;
    sel.innerHTML = '<option value="">جارٍ تحميل القائمة...</option>';
    try {
        const result = await invoke('getFuelSalesPage', [JSON.stringify({limit: 500, offset: 0})]);
        const rows = rowsFrom(result);
        rows.sort((a, b) => {
            const idA = Number(a.sale_id || a.id || 0);
            const idB = Number(b.sale_id || b.id || 0);
            return idB - idA;
        });
        state.fuelAdjustmentCache = rows;
        if (!rows.length) {
            sel.innerHTML = '<option value="">لا توجد مبيعات وقود</option>';
            return;
        }
        const options = rows.map(r => {
            const saleId = Number(r.sale_id || r.id || 0);
            const date = String(r.sale_date || '').trim();
            const time = String(r.sale_time || '').trim();
            const fuel = r.fuel_name_ar || r.fuel_name || ('وقود #' + (r.fuel_type_id || ''));
            const qty = numeric(r.quantity).toFixed(2);
            const dt = [date, time].filter(Boolean).join(' ');
            return '<option value="' + saleId + '">#' + saleId + ' — ' + esc(dt) + ' — ' + esc(fuel) + ' — ' + qty + ' لتر</option>';
        }).join('');
        sel.innerHTML = '<option value="">— اختر رقم البيع —</option>' + options;
    } catch (e) {
        sel.innerHTML = '<option value="">تعذر تحميل القائمة</option>';
        showAdvancedNotification('تعذر تحميل قائمة مبيعات الوقود: ' + (e.message||''), 'error', 'خطأ');
    }
}

async function openFuelAdjustment(row) {
    resetFuelAdjustmentForm({keepDropdown: false});
    if (row) {
        fillFuelAdjustmentFromRow(row);
        openModal(null, 'fuelAdjustmentModal');
        populateFuelAdjustmentSaleSelect().then(() => {
            const sel = $('fuelAdjustmentSaleSelect');
            const saleId = Number(row.sale_id || row.id || 0);
            if (sel && saleId) {
                let found = false;
                for (let i = 0; i < sel.options.length; i++) {
                    if (Number(sel.options[i].value) === saleId) { found = true; break; }
                }
                if (!found) {
                    const opt = document.createElement('option');
                    opt.value = String(saleId);
                    opt.textContent = '#' + saleId + ' — ' + (row.sale_date || '') + ' — ' + (row.fuel_name_ar || row.fuel_type_id || '');
                    sel.appendChild(opt);
                }
                sel.value = String(saleId);
            }
        });
    } else {
        openModal(null, 'fuelAdjustmentModal');
        await populateFuelAdjustmentSaleSelect();
    }
}

async function saveFuelAdjustment() {
    const saleIdFromRow = fuelAdjustmentRow ? Number(fuelAdjustmentRow.sale_id || fuelAdjustmentRow.id || 0) : 0;
    const saleIdFromSelect = Number($('fuelAdjustmentSaleSelect')?.value || 0);
    const saleId = saleIdFromRow || saleIdFromSelect;
    if (!saleId) {
        showAdvancedNotification('يرجى اختيار رقم البيع أولاً', 'warning', 'تنبيه');
        return;
    }
    if (saleIdFromSelect && saleIdFromSelect !== saleIdFromRow) {
        const cached = state.fuelAdjustmentCache.find(r => Number(r.sale_id || r.id) === saleIdFromSelect);
        if (cached) fuelAdjustmentRow = cached;
    }
    const qty = Number($('fuelAdjustmentQty').value);
    const available = Number($('fuelAdjustmentAvailable').value || 0);
    const reason = ($('fuelAdjustmentReason').value || '').trim();
    if (!Number.isFinite(qty) || qty <= 0) {
        showAdvancedNotification('الكمية يجب أن تكون أكبر من صفر', 'warning', 'تنبيه');
        return;
    }
    if (available > 0 && qty > available + 1e-9) {
        showAdvancedNotification('الكمية تتجاوز المتاح (' + available.toFixed(2) + ' لتر)', 'warning', 'تنبيه');
        return;
    }
    if (!reason) {
        showAdvancedNotification('يرجى إدخال سبب الإرجاع / التلف', 'warning', 'تنبيه');
        return;
    }
    const confirmBtn = $('fuelAdjustmentConfirmBtn');
    if (confirmBtn) confirmBtn.disabled = true;
    setLoading(true);
    try {
        const payload = {
            sale_id: saleId,
            fuel_sale_id: saleId,
            adjustment_type: $('fuelAdjustmentType').value || 'return',
            quantity: qty,
            reason: reason,
            idempotency_key: newIdempotencyKey()
        };
        const result = parse(await invoke('processFuelSaleAdjustment', [JSON.stringify(payload)]));
        const message = result.message || (result.data && result.data.message) || 'تم توثيق العملية بنجاح';
        showAdvancedNotification(message, 'success', '✅ تم التوثيق');
        closeModal(null, 'fuelAdjustmentModal');
        resetFuelAdjustmentForm();
        await reloadData();
    } catch (e) {
        showAdvancedNotification(e.message || 'تعذر توثيق العملية', 'error', '❌ فشل');
    } finally {
        if (confirmBtn) confirmBtn.disabled = false;
        setLoading(false);
    }
}

function setupFuelAdjustmentEvents() {
    const sel = $('fuelAdjustmentSaleSelect');
    if (sel) {
        sel.addEventListener('change', function() {
            const saleId = Number(this.value || 0);
            if (!saleId) { resetFuelAdjustmentForm({keepDropdown: true}); return; }
            let row = state.fuelAdjustmentCache.find(r => Number(r.sale_id || r.id) === saleId);
            if (!row) row = {sale_id: saleId};
            fillFuelAdjustmentFromRow(row);
        });
    }
}

/* ============================================================
   Theme
   ============================================================ */
function goHome() { window.location.href = '../main.html'; }

function applyTheme() {
    const saved = localStorage.getItem('theme') || 'light';
    if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
    else delete document.documentElement.dataset.theme;
    const icon = $('themeIcon');
    if (icon) icon.textContent = saved === 'dark' ? '🌞' : '🌙';
}

function toggleTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    if (dark) delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = 'dark';
    localStorage.setItem('theme', dark ? 'light' : 'dark');
    const icon = $('themeIcon');
    if (icon) icon.textContent = dark ? '🌙' : '🌞';
}

/* ============================================================
   INIT
   ============================================================ */
$('searchInput').addEventListener('input', () => CFG.listMethod === 'getFuelSalesPage' ? reloadData() : applyFilter());
$('themeToggle').addEventListener('click', toggleTheme);
$('saveBtn').addEventListener('click', saveForm);
$('deliveryBtn').addEventListener('click', () => openDelivery($('deliveryBtn').dataset.saleId));

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
        const es = $('exportSheet');
        if (es) es.classList.remove('show');
        document.body.classList.remove('modal-open');
        setTimeout(updateTopBarHeight, 100);
    }
});
window.addEventListener('online', () => toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق', false, 'global'));
window.addEventListener('offline', () => $('offlineBanner').classList.add('show'));

// EXPOSE TO WINDOW
Object.assign(window, {
    goHome,
    openReport,
    generateReport,
    openExportSheet,
    closeExportSheet,
    confirmExport,
    printReport,
    reloadData,
    openForm,
    saveForm,
    openModal,
    closeModal,
    openFuelAdjustment,
    saveFuelAdjustment,
    handleSidebarAction,
    toggleSidebar
});

applyTheme();
renderFilters();
setupViewSwitcher();
setupReportTypeSelector();
setupFuelAdjustmentEvents();
setupSidebar();

// Update top bar height after initial render
setTimeout(updateTopBarHeight, 200);

reloadData();

})();
</script>
<script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
