<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>نظام إدارة محطة الوقود – مبيعات الوقود</title>
<link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
<link href="file:///android_asset/assets-local/css/fonts/cairo.css" rel="stylesheet">
<link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
<style>
@import url('file:///android_asset/assets-local/css/fonts/cairo.css');

/* ============================================================
   نظام الألوان — منقول من pos.html
   ============================================================ */
:root {
    --bg-primary: #f0f2f5;
    --bg-secondary: #ffffff;
    --bg-card: rgba(255, 255, 255, 0.96);
    --bg-glass: rgba(0, 0, 0, 0.025);
    --bg-glass-light: rgba(0, 0, 0, 0.05);
    --text-primary: #1a2233;
    --text-secondary: #44546a;
    --text-muted: #8391a5;
    --border-color: #d8dde4;

    --silver-border-color: #c4cad2;
    --silver-border-color-strong: #a8b0bb;
    --silver-border: 1px solid var(--silver-border-color);
    --silver-border-strong: 1px solid var(--silver-border-color-strong);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

    --gold-primary: #c89a12;
    --gold-dark: #a67c00;
    --gold-light: #f5c842;
    --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

    --emerald-primary: #059669;
    --emerald-dark: #047857;
    --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

    --success-token: #059669;
    --danger-token: #dc2626;
    --warning-token: #d97706;
    --info-token: #2563eb;
    --purple-token: #7c3aed;

    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

    --radius-card: 20px;
    --radius-small: 12px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

    --header-bg: rgba(255, 255, 255, 0.94);
    --nav-bg: rgba(255, 255, 255, 0.96);
    --sidebar-bg-token: rgba(255, 255, 255, 0.98);
    --toast-bg: #ffffff;

    color-scheme: light;

    --bg-color: var(--bg-primary);
    --surface-color: var(--bg-secondary);
    --primary-color: var(--gold-primary);
    --primary-dim: rgba(200, 154, 18, 0.12);
    --accent-color: var(--gold-primary);
    --error: var(--danger-token);
    --text-color: var(--text-primary);
    --text-muted-color: var(--text-muted);
    --success: var(--success-token);
    --warning: var(--warning-token);
    --gold: var(--gold-primary);
    --glass-bg: var(--bg-card);
    --glass-border: var(--silver-border-color);
    --input-bg: var(--bg-glass);
    --input-border: var(--silver-border-color);
    --data-text-color: var(--text-primary);
    --data-text-muted: var(--text-secondary);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--gold-primary);
    --modal-border-color: var(--silver-border-color);
    --fab-shadow: rgba(200, 154, 18, 0.3);
    --primary-hover: var(--gold-dark);
    --border-style: solid;
    --border-width: 1px;
    --card-hover-bg: var(--bg-glass-light);
    --input-border-style: solid;
    --modal-border-style: solid;
}

[data-theme="dark"] {
    --bg-primary: #1e232b;
    --bg-secondary: #262c36;
    --bg-card: rgba(40, 47, 58, 0.88);
    --bg-glass: rgba(255, 255, 255, 0.035);
    --bg-glass-light: rgba(255, 255, 255, 0.075);
    --text-primary: #d8dee6;
    --text-secondary: #9aa5b4;
    --text-muted: #6a7686;
    --border-color: rgba(200, 205, 212, 0.2);

    --silver-border-color: rgba(192, 197, 204, 0.35);
    --silver-border-color-strong: rgba(192, 197, 204, 0.55);
    --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

    --gold-primary: #f5c842;
    --gold-dark: #c99f1e;
    --gold-light: #f7d268;
    --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

    --emerald-primary: #10b981;
    --emerald-dark: #059669;
    --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

    --success-token: #10b981;
    --danger-token: #ef4444;
    --warning-token: #f59e0b;
    --info-token: #3b82f6;
    --purple-token: #9b59b6;

    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

    --header-bg: rgba(30, 35, 43, 0.94);
    --nav-bg: rgba(30, 35, 43, 0.96);
    --sidebar-bg-token: rgba(38, 44, 54, 0.98);
    --toast-bg: #262c36;

    color-scheme: dark;

    --bg-color: var(--bg-primary);
    --surface-color: var(--bg-secondary);
    --primary-color: var(--gold-primary);
    --primary-dim: rgba(245, 200, 66, 0.12);
    --accent-color: var(--gold-primary);
    --error: var(--danger-token);
    --text-color: var(--text-primary);
    --text-muted-color: var(--text-muted);
    --success: var(--success-token);
    --warning: var(--warning-token);
    --gold: var(--gold-primary);
    --glass-bg: var(--bg-card);
    --glass-border: var(--silver-border-color);
    --input-bg: var(--bg-glass);
    --input-border: var(--silver-border-color);
    --data-text-color: var(--text-primary);
    --data-text-muted: var(--text-secondary);
    --scrollbar-track: transparent;
    --scrollbar-thumb: var(--gold-primary);
    --modal-border-color: var(--silver-border-color);
    --fab-shadow: rgba(245, 200, 66, 0.3);
    --primary-hover: var(--gold-dark);
    --border-style: solid;
    --border-width: 1px;
    --card-hover-bg: var(--bg-glass-light);
    --input-border-style: solid;
    --modal-border-style: solid;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
}

body {
    font-family: 'Cairo', 'Inter', sans-serif;
    background-color: var(--bg-primary);
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
    color: var(--text-primary);
    direction: rtl;
    /* المسافة العلوية تُحسب ديناميكياً عبر JS */
    padding-top: 120px;
    padding-bottom: 15px;
    touch-action: manipulation;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: lining-nums tabular-nums;
    text-align: center;
    transition: background 0.35s ease, color 0.35s ease;
}

/* عند فتح أي مودال: تصفير المسافة العلوية وإخفاء عناصر الشريط العلوي */
body.modal-open {
    padding-top: 50px !important;
}

body.modal-open .top-bar .header-actions,
body.modal-open .top-bar .search-wrap,
body.modal-open .top-bar .filter-chips {
    display: none !important;
}

body.modal-open .top-bar {
    padding-bottom: 5px;
    border-bottom: none;
    box-shadow: none;
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}

body.modal-open .top-bar .top-title h2 {
    font-size: 1rem;
    color: var(--gold-primary);
    -webkit-text-fill-color: var(--gold-primary);
}

body.modal-open .top-bar #subtitle {
    display: none;
}

[data-theme="dark"] body {
    background-image:
        radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
        radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

/* ============================================================
   Top Bar
   ============================================================ */
.top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    background: var(--header-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    z-index: 1000;
    border-bottom: var(--silver-border-strong);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    padding: 6px 8px 8px;
    transition: var(--transition);
    gap: 6px;
}

.header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.top-title {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
    text-align: right;
    flex-wrap: wrap;
}

.top-title h2 {
    font-size: 1.05rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
    margin: 0;
}

.top-title h2 i {
    -webkit-text-fill-color: var(--gold-primary);
    color: var(--gold-primary);
    margin-left: 4px;
    font-size: 0.85rem;
}

#subtitle {
    margin: 0;
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: right;
    direction: rtl;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-basis: 100%;
}

.header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.icon-btn {
    font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: 1rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-secondary);
    border-radius: 10px;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
    padding: 0;
}

.icon-btn:hover {
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    transform: translateY(-2px);
    box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
}

.icon-btn:active { transform: scale(0.92); }

.search-wrap { position: relative; width: 100%; }

.search-input {
    width: 100%;
    padding: 8px 36px 8px 10px;
    border-radius: 10px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.82rem;
    transition: var(--transition);
    outline: none;
    text-align: center;
    box-shadow: var(--silver-shadow);
}

.search-input:focus {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}

.search-wrap i {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.8rem;
    pointer-events: none;
}

.filter-chips {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
    justify-content: center;
    width: 100%;
}

.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
    padding: 5px 12px;
    border-radius: 14px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-muted);
    font-size: 0.75rem;
    font-family: 'Cairo', 'Inter', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
    font-weight: 700;
    flex-shrink: 0;
}

.filter-chip:active { transform: scale(0.95); }
.filter-chip.active {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.3);
}

/* ============================================================
   Page
   ============================================================ */
.page-container {
    width: 100%;
    padding: 0 0 10px;
    margin: 0;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    padding: 5px;
    width: 100%;
}

.stat-card {
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
    border: var(--silver-border);
    border-radius: var(--radius-small);
    padding: 10px 6px;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
    cursor: pointer;
    box-shadow: var(--silver-shadow);
    text-align: center;
    min-width: 0;
}

.stat-card:active { transform: scale(0.97); }
.stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 4px 16px rgba(200, 154, 18, 0.15);
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
    opacity: 0;
    transition: opacity 0.3s;
}

.stat-card:hover::before { opacity: 1; }

.stat-icon {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    margin: 0 auto 5px;
}

.stat-icon.blue { background: rgba(37, 99, 235, 0.12); color: var(--info-token); }
.stat-icon.green { background: rgba(5, 150, 105, 0.12); color: var(--success-token); }
.stat-icon.orange { background: rgba(217, 119, 6, 0.12); color: var(--warning-token); }
.stat-icon.red { background: rgba(220, 38, 38, 0.12); color: var(--danger-token); }
.stat-icon.purple { background: rgba(124, 58, 237, 0.12); color: var(--purple-token); }
.stat-icon.gold { background: rgba(200, 154, 18, 0.12); color: var(--gold-primary); }

.stat-value {
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 1px;
    color: var(--text-primary);
    text-align: center;
    word-break: break-word;
    line-height: 1.2;
}

.stat-label {
    font-size: 0.64rem;
    color: var(--text-secondary);
    text-align: center;
    line-height: 1.2;
}

/* ============================================================
   Data Panel
   ============================================================ */
.data-panel {
    margin: 0;
    padding: 8px;
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
    border-top: var(--silver-border-strong);
    border-bottom: var(--silver-border-strong);
    border-radius: 0;
    box-shadow: var(--silver-shadow);
    width: 100%;
}

.section-title {
    display: flex;
    gap: 6px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    width: 100%;
}

.section-title h3 {
    font-size: 0.85rem;
    color: var(--text-primary);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 5px;
}

.section-title h3 i { color: var(--gold-primary); }

.title-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.view-switcher {
    display: inline-flex;
    padding: 3px;
    border-radius: 9px;
    background: var(--bg-glass);
    border: var(--silver-border);
    gap: 2px;
    box-shadow: var(--silver-shadow);
}

.view-btn {
    width: 30px; height: 30px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    transition: var(--transition);
    padding: 0;
}

.view-btn:hover { background: var(--bg-glass-light); color: var(--gold-primary); }

.view-btn.active {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(200, 154, 18, 0.35);
}

.view-btn:active { transform: scale(0.9); }

.count-badge {
    background: rgba(200, 154, 18, 0.12);
    color: var(--gold-primary);
    border-radius: 9px;
    padding: 3px 9px;
    font-size: 0.7rem;
    font-weight: 800;
    border: var(--silver-border);
}

.cards-container {
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
}

.empty-state {
    text-align: center;
    padding: 36px 14px;
    color: var(--text-muted);
    line-height: 1.8;
}

.empty-state i {
    font-size: 2.4rem;
    display: block;
    color: var(--gold-primary);
    margin-bottom: 8px;
    opacity: 0.5;
}

.data-card {
    background: linear-gradient(145deg, var(--bg-secondary), var(--bg-primary));
    border: var(--silver-border);
    border-radius: var(--radius-small);
    padding: 10px;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
    text-align: center;
    width: 100%;
}

.data-card:hover {
    border-color: var(--gold-primary);
    box-shadow: var(--silver-shadow), 0 6px 20px rgba(200, 154, 18, 0.15);
    transform: translateY(-2px);
}

.data-card-head {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: flex-start;
    flex-wrap: wrap;
}

.data-card-title {
    font-weight: 800;
    color: var(--text-primary);
    text-align: center;
    font-size: 0.88rem;
}

.data-card-subtitle {
    color: var(--text-secondary);
    font-size: 0.7rem;
    margin-top: 3px;
    line-height: 1.6;
    text-align: center;
}

.data-card-value {
    color: var(--gold-primary);
    font-weight: 900;
    white-space: nowrap;
    font-size: 0.9rem;
    background: rgba(200, 154, 18, 0.1);
    padding: 3px 8px;
    border-radius: 8px;
    border: 1px solid rgba(200, 154, 18, 0.2);
}

.data-fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
    gap: 5px;
    margin-top: 8px;
}

.data-field {
    padding: 6px 7px;
    border-radius: 7px;
    background: var(--bg-glass);
    border: var(--silver-border);
    min-width: 0;
    text-align: center;
}

.data-field span {
    display: block;
    font-size: 0.64rem;
    color: var(--text-muted);
}

.data-field strong {
    display: block;
    margin-top: 2px;
    overflow-wrap: anywhere;
    color: var(--text-primary);
    font-size: 0.76rem;
}

.action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
    justify-content: center;
}

.btn {
    border: var(--silver-border);
    border-radius: 9px;
    padding: 7px 10px;
    background: var(--bg-glass);
    color: var(--text-secondary);
    font-family: 'Cairo', 'Inter', sans-serif;
    cursor: pointer;
    font-size: 0.74rem;
    transition: var(--transition);
    font-weight: 700;
    box-shadow: var(--silver-shadow);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
}

.btn:hover {
    border-color: var(--gold-primary);
    color: var(--gold-primary);
    background: var(--bg-glass-light);
    transform: translateY(-1px);
}

.btn:active { transform: scale(0.97); }

.btn.primary {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: var(--silver-shadow), 0 2px 8px rgba(200, 154, 18, 0.3);
}

.btn.primary:hover {
    color: #ffffff;
    box-shadow: var(--silver-shadow), 0 4px 14px rgba(200, 154, 18, 0.45);
}

.btn.danger { color: var(--danger-token); border-color: rgba(220, 38, 38, 0.3); }
.btn.danger:hover { background: rgba(220, 38, 38, 0.1); color: var(--danger-token); border-color: var(--danger-token); }

.btn.warning { color: var(--warning-token); border-color: rgba(217, 119, 6, 0.3); }
.btn.warning:hover { background: rgba(217, 119, 6, 0.1); color: var(--warning-token); border-color: var(--warning-token); }

.btn.success {
    background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-dark));
    color: #ffffff;
    border-color: var(--emerald-dark);
    box-shadow: var(--silver-shadow), 0 2px 8px rgba(5, 150, 105, 0.3);
}

.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

/* ============================================================
   Sidebar
   ============================================================ */
.sidebar-toggle {
    position: fixed;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    background: var(--gold-primary);
    color: #ffffff;
    width: 38px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 0 0 50%;
    cursor: pointer;
    z-index: 1001;
    box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
    transition: background 0.3s ease, box-shadow 0.3s ease;
    border: var(--silver-border);
    border-right: none;
    padding: 0;
}

.sidebar-toggle:hover {
    background: var(--gold-dark);
    box-shadow: -4px 0 18px rgba(200, 154, 18, 0.5);
}

.sidebar-toggle i {
    transition: transform 0.3s;
    font-size: 1rem;
    color: #ffffff;
}

body.sidebar-is-open .sidebar-toggle {
    display: none !important;
}

.sidebar {
    position: fixed;
    top: 50%;
    right: 0;
    width: 110px;
    background: var(--sidebar-bg-token);
    z-index: 999;
    transition: transform 0.45s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s ease;
    padding: 10px 8px;
    border-radius: 16px 0 0 16px;
    overflow-y: auto;
    box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: var(--silver-border);
    border-right: 3px solid var(--gold-primary);
    opacity: 0;
    pointer-events: none;
    transform: translate(120%, -50%);
    max-height: 82vh;
}

.sidebar.open {
    transform: translate(0, -50%);
    opacity: 1;
    pointer-events: auto;
}

.sidebar-content {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.sidebar-btn {
    position: relative;
    overflow: hidden;
    background: var(--bg-glass);
    backdrop-filter: blur(6px);
    border: var(--silver-border);
    box-shadow: var(--silver-shadow);
    padding: 9px 4px;
    border-radius: 11px;
    color: var(--text-secondary);
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 62px;
    text-align: center;
    font-size: 0.78rem;
    width: 100%;
    font-family: 'Cairo', 'Inter', sans-serif;
    touch-action: manipulation;
    margin-bottom: 2px;
}

.sidebar-btn:hover {
    transform: scale(1.05);
    box-shadow: var(--silver-shadow), 0 0 15px rgba(200, 154, 18, 0.3);
    background: var(--bg-glass-light);
    border-color: var(--gold-primary);
    color: var(--gold-primary);
}

.sidebar-btn:active { transform: scale(0.94); }

.sidebar-btn i {
    font-size: 1.2rem;
    transition: transform 0.3s;
    color: var(--gold-primary);
    text-shadow: 0 0 8px rgba(200, 154, 18, 0.35);
}

.sidebar-btn:hover i { transform: scale(1.2); }

.sidebar-btn span {
    font-size: 0.62rem;
    margin-top: 1px;
    line-height: 1.15;
}

.sidebar-btn .glow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 70%);
    border-radius: 10px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 0;
    pointer-events: none;
}

.sidebar-btn:hover .glow { opacity: 0.6; }

/* ============================================================
   Modal
   ============================================================ */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1200;
    display: none;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.modal-overlay.show { display: flex; opacity: 1; }

.modal {
    background: var(--bg-secondary);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 18px 14px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border: var(--silver-border-strong);
    border-bottom: none;
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.2);
    position: relative;
    overscroll-behavior: contain;
}

.modal::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(to right, var(--gold-primary), var(--gold-dark));
    border-radius: 20px 20px 0 0;
}

.modal-overlay.show .modal { transform: translateY(0); }

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: var(--silver-border);
    gap: 8px;
}

.modal-title {
    font-size: 0.95rem;
    font-weight: 900;
    color: var(--gold-primary);
    display: flex;
    align-items: center;
    gap: 6px;
    text-align: right;
}

.modal-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    font-size: 0.85rem;
    padding: 0;
    box-shadow: var(--silver-shadow);
    flex-shrink: 0;
}

.modal-close:hover {
    background: var(--danger-token);
    color: white;
    border-color: var(--danger-token);
    transform: scale(1.05);
}

.modal-close:active { transform: scale(0.9); }

.modal-body { padding: 2px; }

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
}

.form-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.form-group.full { grid-column: 1 / -1; }
.delivery-fee-composite { display:flex; flex-direction:row; align-items:flex-end; gap:8px; width:100%; min-width:0; }
.delivery-fee-composite .delivery-fee-cell { display:flex; flex-direction:column; gap:4px; flex:1 1 0; min-width:0; }
.delivery-fee-composite .form-input { min-width:0; padding:8px 5px; font-size:clamp(.61rem,2.4vw,.78rem); }
.delivery-fee-composite .form-label { font-size:clamp(.61rem,2.4vw,.75rem); line-height:1.35; }
@media(max-width:340px) {
    .delivery-fee-composite { gap:4px; }
    .delivery-fee-composite .form-input { padding:7px 3px; font-size:.60rem; }
    .delivery-fee-composite .form-label { font-size:.60rem; }
}

/* Match readable new-sale form controls to the payment-method field size. */
#formModal #recordForm *:not(i):not(svg):not(path) {
    font-size: 0.83rem !important;
}
#formModal .modal-footer button { font-size: 0.83rem !important; }

.form-label {
    color: var(--text-secondary);
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
}

.form-input {
    width: 100%;
    padding: 9px 11px;
    border-radius: 9px;
    border: var(--silver-border);
    background: var(--bg-glass);
    color: var(--text-primary);
    font-family: 'Cairo', 'Inter', sans-serif;
    font-size: 0.83rem;
    outline: none;
    text-align: center;
    transition: var(--transition);
    box-shadow: var(--silver-shadow);
}

.form-input:focus {
    border-color: var(--gold-primary);
    box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
}

select.form-input {
    cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) calc(50% - 3px), calc(100% - 10px) calc(50% - 3px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-left: 26px;
}

textarea.form-input { text-align: right; min-height: 64px; resize: vertical; }

.modal-footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 12px 2px 2px;
    border-top: var(--silver-border);
    margin-top: 10px;
}

.detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 6px;
}

.detail-item {
    padding: 7px;
    border-radius: 8px;
    background: var(--bg-glass);
    border: var(--silver-border);
    text-align: center;
}

.detail-item span {
    display: block;
    color: var(--text-muted);
    font-size: 0.66rem;
}

.detail-item strong {
    display: block;
    margin-top: 3px;
    overflow-wrap: anywhere;
    color: var(--text-primary);
    font-size: 0.8rem;
}

.raw-json {
    direction: ltr;
    text-align: left;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0b1220;
    color: #dbeafe;
    padding: 10px;
    border-radius: 8px;
    font: .7rem/1.5 monospace;
    max-height: 260px;
    overflow: auto;
    margin-top: 8px;
}

/* ============================================================
   Report Modal
   ============================================================ */
.report-type-selector {
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px;
    background: var(--bg-glass);
    border: var(--silver-border);
    border-radius: 10px;
    justify-content: center;
    margin-bottom: 8px;
}

.report-type-btn {
    padding: 5px 10px;
    border-radius: 7px;
    border: var(--silver-border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    font-family: 'Cairo', 'Inter', sans-serif;
    box-shadow: var(--silver-shadow);
    white-space: nowrap;
}

.report-type-btn:hover { border-color: var(--gold-primary); color: var(--gold-primary); }

.report-type-btn.active {
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    border-color: var(--gold-dark);
    box-shadow: 0 2px 8px rgba(200, 154, 18, 0.3);
}

/* ============================================================
   Filters Grid — إجبار عنصرين في كل صف
   ============================================================ */
.report-filters {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
    margin-bottom: 8px;
    width: 100%;
}

.report-filters .form-group {
    min-width: 0;
    width: 100%;
}

.report-station-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    background: rgba(200, 154, 18, 0.08);
    border: 1px solid rgba(200, 154, 18, 0.25);
    border-radius: 9px;
    color: var(--text-secondary);
    font-size: 0.74rem;
    font-weight: 700;
    margin-bottom: 8px;
}

.report-station-info i {
    color: var(--gold-primary);
    font-size: 0.8rem;
}

.report-station-info strong {
    color: var(--gold-primary);
    font-weight: 800;
}

.report-results {
    margin-top: 10px;
    border-radius: 10px;
    background: var(--bg-glass);
    border: var(--silver-border);
    overflow: hidden;
    max-height: 55vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

.report-header {
    padding: 9px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    text-align: center;
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 0.3px;
}

.report-meta {
    padding: 6px 10px;
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: center;
    border-bottom: var(--silver-border);
    background: var(--bg-secondary);
}

.report-summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    padding: 7px;
    background: var(--bg-secondary);
    border-bottom: var(--silver-border);
}

.report-summary-card {
    padding: 7px;
    background: var(--bg-glass);
    border-radius: 7px;
    border: var(--silver-border);
    text-align: center;
}

.report-summary-card .label {
    font-size: 0.65rem;
    color: var(--text-muted);
    display: block;
}

.report-summary-card .value {
    font-size: 0.85rem;
    font-weight: 900;
    color: var(--gold-primary);
    display: block;
    margin-top: 2px;
}

.report-table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.report-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.72rem;
}

.report-table thead th {
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    padding: 7px 5px;
    text-align: center;
    font-weight: 800;
    border-bottom: var(--silver-border-strong);
    position: sticky;
    top: 0;
    z-index: 5;
    font-size: 0.7rem;
    white-space: nowrap;
}

.report-table tbody td {
    padding: 6px 5px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    font-weight: 600;
}

.report-table tbody tr:nth-child(even) { background: var(--bg-glass); }
.report-table tbody tr:hover { background: rgba(200, 154, 18, 0.06); }

.report-table tfoot td {
    padding: 7px 5px;
    text-align: center;
    font-weight: 900;
    background: var(--bg-glass-light);
    color: var(--gold-primary);
    border-top: 2px solid var(--gold-primary);
}

.report-no-data {
    text-align: center;
    padding: 28px 14px;
    color: var(--text-muted);
    line-height: 1.6;
}

.report-no-data i {
    font-size: 2rem;
    display: block;
    color: var(--gold-primary);
    opacity: 0.4;
    margin-bottom: 8px;
}

/* ============================================================
   Export Sheet
   ============================================================ */
.export-sheet {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1300;
    display: none;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
}

.export-sheet.show { display: flex; opacity: 1; }

.export-sheet-content {
    background: var(--bg-secondary);
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 18px 14px calc(18px + env(safe-area-inset-bottom, 0));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    border-top: 4px solid var(--gold-primary);
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.25);
    position: relative;
    max-height: 80vh;
    overflow-y: auto;
}

.export-sheet.show .export-sheet-content { transform: translateY(0); }

.export-sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: var(--silver-border);
}

.export-sheet-title {
    font-size: 0.9rem;
    font-weight: 900;
    color: var(--gold-primary);
    display: flex;
    align-items: center;
    gap: 6px;
}

.export-option-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.export-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: var(--silver-border);
    border-radius: 11px;
    background: var(--bg-glass);
    cursor: pointer;
    transition: var(--transition);
    text-align: right;
    font-family: 'Cairo', 'Inter', sans-serif;
    width: 100%;
}

.export-option:hover {
    border-color: var(--gold-primary);
    background: var(--bg-glass-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(200, 154, 18, 0.15);
}

.export-option:active { transform: scale(0.98); }

.export-option-icon {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    flex-shrink: 0;
}

.export-option-text { flex: 1; min-width: 0; text-align: right; }

.export-option-text strong {
    display: block;
    font-size: 0.82rem;
    color: var(--text-primary);
    font-weight: 800;
    margin-bottom: 2px;
}

.export-option-text small {
    display: block;
    font-size: 0.68rem;
    color: var(--text-muted);
    line-height: 1.3;
}

.export-status {
    display: none;
    padding: 10px;
    margin-top: 10px;
    border-radius: 9px;
    background: rgba(5, 150, 105, 0.08);
    border: 1px solid var(--emerald-primary);
    color: var(--success-token);
    font-size: 0.75rem;
    text-align: center;
    line-height: 1.5;
}

.export-status.show { display: block; }
.export-status.error {
    background: rgba(220, 38, 38, 0.08);
    border-color: var(--danger-token);
    color: var(--danger-token);
}

.export-path {
    display: block;
    direction: ltr;
    text-align: left;
    font-family: monospace;
    font-size: 0.66rem;
    color: var(--text-muted);
    margin-top: 6px;
    word-break: break-all;
    padding: 6px 8px;
    background: var(--bg-glass);
    border-radius: 6px;
    border: var(--silver-border);
}

/* ============================================================
   Toast & Notification
   ============================================================ */
.toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--toast-bg);
    border: var(--silver-border-strong);
    border-radius: 12px;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 2000;
    opacity: 0;
    transition: all 0.4s;
    pointer-events: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-primary);
    max-width: 90vw;
    text-align: center;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success-token); color: var(--success-token); }
.toast.error { border-color: var(--danger-token); color: var(--danger-token); }
.toast.warning { border-color: var(--warning-token); color: var(--warning-token); }
.toast.info { border-color: var(--info-token); color: var(--info-token); }

.advanced-notification {
    position: fixed;
    top: 78px;
    left: 50%;
    transform: translate(-50%, -220%) scale(0.85);
    z-index: 5000;
    width: min(420px, 92vw);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35), 0 8px 20px rgba(0,0,0,0.22);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
    direction: rtl;
}

.advanced-notification.show {
    transform: translate(-50%, 0) scale(1);
    opacity: 1;
    pointer-events: auto;
}

.advanced-notification.success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #fff; }
.advanced-notification.error { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #fff; }
.advanced-notification.warning { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); color: #fff; }

.advanced-notification-content {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
}

.advanced-notification-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    flex-shrink: 0;
}

.advanced-notification-text { flex: 1; min-width: 0; text-align: right; }

.advanced-notification-title {
    font-size: 0.88rem;
    font-weight: 900;
    margin-bottom: 3px;
}

.advanced-notification-message {
    font-size: 0.76rem;
    line-height: 1.4;
    opacity: 0.95;
    word-wrap: break-word;
}

.advanced-notification-close {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: none;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    flex-shrink: 0;
}

/* ============================================================
   Loading / Offline
   ============================================================ */
.loading-indicator {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.loading-indicator.show { display: flex; }

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(200, 154, 18, 0.2);
    border-top: 4px solid var(--gold-primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.offline-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: linear-gradient(90deg, var(--warning-token), #f97316);
    color: #000;
    text-align: center;
    padding: 5px;
    font-size: 0.72rem;
    font-weight: 700;
    z-index: 2000;
    transform: translateY(-100%);
    transition: transform 0.3s;
}

.offline-banner.show { transform: translateY(0); }

.hidden { display: none !important; }

/* ============================================================
   Print Area
   ============================================================ */
#printArea { display: none; }

@media print {
    @page { size: A4; margin: 8mm; }
    html, body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
    }
    body > *:not(#printArea) {
        display: none !important;
        visibility: hidden !important;
    }
    #printArea {
        display: block !important;
        visibility: visible !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        direction: rtl !important;

const VALUE_TRANSLATIONS = {
    cash:'نقدي', cash_payment:'نقدي', 'نقداً':'نقدي', 'نقدي':'نقدي',
    credit:'آجل', credit_sale:'آجل', credit_account:'آجل', 'آجل':'آجل',
    credit_card:'بطاقة', card:'بطاقة', bank_transfer:'تحويل بنكي',
    transfer:'تحويل بنكي', cheque:'شيك', check:'شيك',
    mobile_money:'محفظة إلكترونية', wallet:'محفظة إلكترونية',
    active:'نشط', inactive:'غير نشط', pending:'قيد المعالجة',
    processing:'قيد المعالجة', completed:'مكتمل', done:'مكتمل',
    cancelled:'ملغى', canceled:'ملغى', failed:'فاشل', rejected:'مرفوض',
    returned:'مرتجع', damaged:'تالف', 'true':'نعم', 'false':'لا',
    '1':'نعم', '0':'لا'
};

function translateFieldLabel(key) {
    if (!key) return '';
    return FIELD_LABELS[key] || FIELD_LABELS[String(key).toLowerCase()] || String(key);
}

function translateFieldValue(key, value) {
    if (value === null || value === undefined || value === '') return '—';
    const k = String(key || '').toLowerCase();
    const v = String(value).trim();
    const vLower = v.toLowerCase();
    if (k === 'payment_method' || k === 'payment_type') return VALUE_TRANSLATIONS[vLower] || v;
    if (k === 'status' || k === 'delivery_status' || k === 'sms_status') return VALUE_TRANSLATIONS[vLower] || v;
    if (k === 'is_active' || k === 'is_deleted') {
        const n = Number(value);
        const isOne = n === 1 || vLower === 'true' || v === '1' || v === 'نعم';
        if (k === 'is_deleted') return isOne ? 'نعم' : 'لا';
        return isOne ? 'نشط' : 'غير نشط';
    }
    if (k === 'quantity' || k === 'liters' || k === 'price_per_liter' ||
        k === 'unit_price' || k === 'total_amount' || k === 'total_price' ||
        k === 'net_amount' || k === 'original_quantity' ||
        k === 'returned_quantity' || k === 'damaged_quantity' ||
        k === 'returnable_quantity') {
        const n = Number(value);
        if (Number.isFinite(n)) return n.toFixed(2);
    }
    if (vLower === 'true') return 'نعم';
    if (vLower === 'false') return 'لا';
    return v;
}

/* ============================================================
   Toast
   ============================================================ */
function toast(message, bad=false, context='auto') {
    let node;
    if (context === 'form') node = $('formToast');
    else if (context === 'global') node = $('toast');
    else node = ($('formModal') && $('formModal').classList.contains('show')) ? $('formToast') : $('toast');
    if (!node) node = $('toast');
    if (!node) return;
    node.textContent = message;
    node.className = 'toast show ' + (bad ? 'error' : 'success');
    clearTimeout(node._timer);
    node._timer = setTimeout(() => node.classList.remove('show'), 3200);
}

let _advTimeout = null;
function showAdvancedNotification(message, type='success', title) {
    const el = $('advancedNotification');
    if (!el) return;
    const iconEl = $('advancedNotificationIcon');
    const titleEl = $('advancedNotificationTitle');
    const msgEl = $('advancedNotificationMessage');
    const normalized = (type === 'error' || type === 'fail' || type === 'danger') ? 'error'
        : (type === 'warning' || type === 'warn') ? 'warning' : 'success';
    const config = {
        success: { icon: 'fa-check', title: title || 'عملية ناجحة', duration: 3200 },
        error: { icon: 'fa-exclamation-triangle', title: title || 'فشلت العملية', duration: 4200 },
        warning: { icon: 'fa-exclamation-circle', title: title || 'تنبيه', duration: 3800 }
    }[normalized];
    el.classList.remove('show', 'success', 'error', 'warning');
    void el.offsetWidth;
    el.classList.add(normalized);
    if (iconEl) iconEl.innerHTML = '<i class="fas ' + config.icon + '"></i>';
    if (titleEl) titleEl.textContent = config.title;
    if (msgEl) msgEl.textContent = message || '';
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(_advTimeout);
    _advTimeout = setTimeout(() => el.classList.remove('show'), config.duration);
}

document.addEventListener('DOMContentLoaded', () => {
    const closeBtn = $('advancedNotificationClose');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            const el = $('advancedNotification');
            if (el) el.classList.remove('show');
            clearTimeout(_advTimeout);
        });
    }
});

/* ============================================================

function setLoading(v) { $('loadingIndicator').classList.toggle('show', Boolean(v)); }

function parse(raw) {
    if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
    const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
    return value;
}

function dataOf(value) {
    return value && Object.prototype.hasOwnProperty.call(value, 'data') ? value.data : value;
}

function invoke(method, args=[]) {
    if (!bridge || typeof bridge[method] !== 'function') {
        return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
    }
    try { return Promise.resolve(parse(bridge[method](...args))); }
    catch (error) { return Promise.reject(error); }
}

function argsForLoad() {
    if (CFG.listMethod === 'getFuelSalesPage') {
        const params = {limit: 100, offset: 0, search: $('searchInput').value || ''};
        if (state.filter === 'cash' || state.filter === 'credit') params.payment_method = state.filter;
        return [JSON.stringify(params)];
    }
    return CFG.listArgs || [];
}

function rowsFrom(value) {
    const raw = dataOf(value);
    if (Array.isArray(raw)) return raw;
    if (raw && Array.isArray(raw.rows)) return raw.rows;
    if (raw && Array.isArray(raw.data)) return raw.data;
    if (raw && typeof raw === 'object') return [raw];
    return [];
}

function field(row, names) {
    for (const name of (names||[])) {
        if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
    }
    return '';
}
function titleOf(row) { return field(row, CFG.titleFields) || field(row,['name','title','label','id','key']) || 'سجل'; }
function subtitleOf(row) {
    return (CFG.subtitleFields||[]).map(k => {
        const v = row && row[k];
        return v===undefined||v===null||v==='' ? null : k+': '+v;
    }).filter(Boolean).join(' · ');
}
function idOf(row) { return field(row,['id','_id','sale_id','shift_id','pump_id','fuel_sale_id','vehicle_id','tank_id','payment_id','request_id','asset_id','employee_id']); }
function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function setDateDefaults() {
    if ($('reportFrom') && !$('reportFrom').value) $('reportFrom').value = today();
    if ($('reportTo') && !$('reportTo').value) $('reportTo').value = today();
}

function setupViewSwitcher() {
    const container = $('viewSwitcher');
    if (!container) return;
    const buttons = container.querySelectorAll('.view-btn');
    buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === state.viewMode);
        btn.addEventListener('click', () => {
            const view = btn.dataset.view;
            if (!view || view === state.viewMode) return;
            state.viewMode = view;
            buttons.forEach(b => b.classList.toggle('active', b.dataset.view === view));
            try { localStorage.setItem('fuel-sales-view', view); } catch (_) {}
            renderCards();
        });
    });
}

function renderFilters() {
    document.querySelectorAll('#filterChips .filter-chip').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('#filterChips .filter-chip').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        state.filter = btn.dataset.filter;
        reloadData();
    }));
}

function paymentType(row) {
    const v = String(field(row,['payment_method','payment_type','paymentMethod','is_credit'])||'').trim().toLowerCase();
    if (['credit','credit_sale','credit_account','آجل','اجل','1','true'].includes(v)) return 'credit';
    return 'cash';
}

function applyFilter() {
    const q = ($('searchInput').value||'').trim().toLowerCase();
    state.filtered = state.rows.filter(row => {
        const text = JSON.stringify(row||{}).toLowerCase();
        const matchesSearch = !q || text.includes(q);
        const matchesPayment = state.filter==='all' || paymentType(row)===state.filter;
        return matchesSearch && matchesPayment;
    });
    renderCards();
}

function renderStats() {
    const rows = state.filtered;
    $('statCount').textContent = rows.length.toLocaleString('ar');
    $('itemCount').textContent = rows.length.toLocaleString('ar');
    const active = rows.filter(row => ['active','open','pending','completed','مفتوحة','نشط','قيد التنفيذ']
        .includes(String(field(row,['status','state','is_active'])))).length;
    $('statActive').textContent = active.toLocaleString('ar');
    let total = 0;
    (CFG.valueFields||[]).forEach(k => total += rows.reduce((sum,row)=>sum+numeric(row&&row[k]),0));
    $('statTotal').textContent = total ? total.toLocaleString('ar',{maximumFractionDigits:2}) : '—';
    $('statUpdated').textContent = state.loadedAt
        ? state.loadedAt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'}) : '—';
}

        box.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد نتائج مطابقة.</p></div>';

    if (state.viewMode === 'table') {
        box.className = 'cards-container view-table';

        box.className = 'cards-container view-tree';

        box.innerHTML = renderCardsHtml();

function bindRowEvents(box) {
    box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        openDetails(b.dataset.view);
    }));
    box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        openForm(findRow(b.dataset.edit));
    }));
    box.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteRow(findRow(b.dataset.delete));
    }));
    box.querySelectorAll('[data-adjust]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        openFuelAdjustment(findRow(b.dataset.adjust));
    }));
    box.querySelectorAll('[data-tree-toggle]').forEach(h => h.addEventListener('click', (e) => {
        e.stopPropagation();
        const group = h.closest('[data-group]');
        if (!group) return;
        const body = group.children[1];
        if (!body) return;
        const isHidden = body.style.display === 'none';
        body.style.display = isHidden ? '' : 'none';
        const chev = h.querySelector('.tree-chevron');
        if (chev) chev.style.transform = isHidden ? '' : 'rotate(-90deg)';
    }));
}

function findRow(id) {
    return state.rows.find((row,index) => String(idOf(row)||index) === String(id));
}

function openDetails(id) {
    const row = findRow(id);

        const label = translateFieldLabel(k);

function inputHtml(def, row) {
    const value = row && row[def.key] !== undefined ? row[def.key] : (def.value !== undefined ? def.value : '');
    const req = def.required ? 'required' : '';
    const ro = def.readonly ? 'readonly tabindex="-1"' : '';
    const cls = def.readonly ? ' readonly' : '';
    if (def.type === 'delivery_fee_configuration') {
        const fee = row && row.delivery_service_fee !== undefined ? row.delivery_service_fee : 0;

            '<div class="delivery-fee-cell"><label class="form-label" for="deliveryServiceFeeInput">رسوم خدمة التوصيل</label>' +
            '<input id="deliveryServiceFeeInput" class="form-input" data-key="delivery_service_fee" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(fee) + '" placeholder="0.00"></div>' +
            '<div class="delivery-fee-cell"><label class="form-label" for="deliveryFeeModeSelect">احتساب رسوم التوصيل</label>' +
            '<select id="deliveryFeeModeSelect" class="form-input" data-key="delivery_fee_mode" required>' +
            '<option value="exempt">معفي منها</option><option value="add_to_sales">تُضاف لقيمة المبيعات</option>' +
            '<option value="driver">على حساب السائق</option><option value="deduct_from_sales">تُنقص من المبيعات</option></select></div>' +
            '</div></div>';
    }
    if (def.type === 'textarea') {
        return '<div class="form-group full"><label class="form-label">' + esc(def.label) + (def.required?' *':'') + '</label>'
            + '<textarea class="form-input" data-key="' + esc(def.key) + '" rows="3" ' + req + '>' + esc(value) + '</textarea></div>';
    }
    if (def.type === 'select') {
        return '<div class="form-group' + (def.full?' full':'') + '"><label class="form-label">' + esc(def.label) + (def.required?' *':'') + '</label>'
            + '<select class="form-input' + cls + '" data-key="' + esc(def.key) + '" ' + req + ' ' + ro + '><option value="">اختر...</option></select></div>';
    }
    const cashCustomerWrapper = def.key === 'cash_customer_name'

        : '';
    return '<div class="form-group' + (def.full?' full':'') + '"' + cashCustomerWrapper + '><label class="form-label">' + esc(def.label) + (def.required?' *':'') + '</label>'

function normalizePromotionBoundary(value, isEnd=false) {
    const boundary = String(value||'').trim().replace('T', ' ');
    if (!boundary) return '';
    if (/^\d{4}-\d{2}-\d{2}$/.test(boundary)) return boundary + ' ' + (isEnd?'23:59:59.999':'00:00:00');
    return boundary;
}

function selectedFuelSaleDateTime() {
    const date = document.querySelector('[data-key="sale_date"]')?.value || localDate(new Date());
    const time = document.querySelector('[data-key="sale_time"]')?.value || localTime(new Date());
    return date + ' ' + time;
}

function promotionIsValidAt(row, at) {
    const from = normalizePromotionBoundary(row?.valid_from, false);
    const to = normalizePromotionBoundary(row?.valid_to, true);
    const instant = String(at||'').trim().replace('T', ' ');
    return (!from || from <= instant) && (!to || to >= instant);
}

async function loadActivePromotions(row=null) {
    const select = document.querySelector('[data-key="occasion_code"]');
    if (!select || !bridge || typeof bridge.getPriceListRecords !== 'function') return;
    try {
        const at = selectedFuelSaleDateTime();
        const customerId = Number(document.querySelector('[data-key="customer_id"]')?.value || 0);
        const result = await invoke('getPriceListRecords', [JSON.stringify({})]);
        if (result && result.success === false) throw new Error(result.message || result.error || 'تعذر قراءة قوائم الأسعار');
        const isActive = (r) => {
            if (!r) return false;
            const v = r.is_active;
            if (v === undefined || v === null) return true;
            if (v === true || v === 'true' || v === '1') return true;
            if (v === false || v === 'false' || v === '0') return false;
            const n = Number(v); return Number.isFinite(n) ? n === 1 : true;
        };
        const isDeleted = (r) => {
            if (!r) return true;
            const v = r.is_deleted;
            if (v === undefined || v === null) return false;
            if (v === true || v === 'true' || v === '1') return true;
            if (v === false || v === 'false' || v === '0') return false;
            const n = Number(v); return Number.isFinite(n) ? n === 1 : false;
        };
        const active = rowsFrom(result).filter(r => r && isActive(r) && !isDeleted(r) && promotionIsValidAt(r, at));
        const occasionOptions = new Map();
        active.forEach(r => {
            const code = String(r.occasion_code || '').trim();
            if (code && !occasionOptions.has(code)) occasionOptions.set(code, r.list_name_ar || r.list_name || r.list_code || code);
        });
        const previous = String(field(row,['occasion_code']) || select.value || '').trim();
        select.innerHTML = '<option value="">بدون عرض محدد</option>'
            + Array.from(occasionOptions.entries()).map(([code,label]) => '<option value="' + esc(code) + '">' + esc(label) + '</option>').join('');
        if (previous && occasionOptions.has(previous)) select.value = previous;
        else if (occasionOptions.size === 1) select.value = occasionOptions.keys().next().value;
        select.onchange = () => refreshResolvedFuelPrice();
    } catch (e) {
        console.warn('[Fuel Promotions]', e);
    }
}

async function loadSaleFormLookups(row=null) {

        (bridge && typeof bridge.getFuelTypes === 'function') ? invoke('getFuelTypes', []).catch(()=>null) : Promise.resolve(null),
        (bridge && typeof bridge.getCustomers === 'function') ? invoke('getCustomers', []).catch(()=>null) : Promise.resolve(null)
    ]);

    const pumps = rowsFrom(results[1]);
    const fuels = rowsFrom(results[2]);

        if (row) pumpEl.value = field(row,['pump_id'])||'';
    }
    await loadPumpNozzles(row ? field(row,['pump_id']) : (document.querySelector('[data-key="pump_id"]')?.value||''), row ? field(row,['nozzle_id']) : '');
    const fuelEl = document.querySelector('[data-key="fuel_type_id"]');
    if (fuelEl) {
        fuelEl.innerHTML = '<option value="">اختر نوع الوقود...</option>'
            + fuels.map(x => '<option value="' + esc(field(x,['id','fuel_type_id'])) + '" data-price="' + esc(field(x,['default_sale_price','sale_price','price_per_liter'])||'') + '">'
                + esc(field(x,['id','fuel_type_id'])) + ' — ' + esc(field(x,['fuel_name_ar','fuel_name','name'])||'وقود') + '</option>').join('');
        if (row) fuelEl.value = field(row,['fuel_type_id'])||'';
    }
    const feeModeEl = document.querySelector('[data-key="delivery_fee_mode"]');
    if (feeModeEl) {
        feeModeEl.value = String(field(row,['delivery_fee_mode']) || 'exempt');
        if (!['exempt','add_to_sales','driver','deduct_from_sales'].includes(feeModeEl.value)) feeModeEl.value = 'exempt';
    }
    const deliveryLocationEl = document.querySelector('[data-key="delivery_location"]');
    if (deliveryLocationEl) deliveryLocationEl.value = String(field(row,['delivery_location','location']) || '');
    const cashNameEl = document.querySelector('[data-key="cash_customer_name"]');
    if (cashNameEl) cashNameEl.value = String(field(row,['cash_customer_name','cash_customer_display_name']) || '');
    const displayTotalEl = document.querySelector('[data-key="delivery_fee_display_total"]');
    if (displayTotalEl && row) displayTotalEl.value = Number(field(row,['delivery_fee_display_total','total_amount']) || 0).toFixed(2);
    const pay = document.querySelector('[data-key="payment_method"]');
    if (pay) {
        pay.innerHTML = '<option value="cash">نقدي</option>'
            + '<option value="credit">آجل</option>'
            + '<option value="credit_card">بطاقة</option>';
        pay.value = field(row,['payment_method']) || 'cash';
    }
    const customerEl = document.querySelector('[data-key="customer_id"]');
    if (customerEl) {
        customerEl.innerHTML = '<option value="">اختر العميل عند الحاجة...</option>'
            + '<option value="cash_sale">مبيعات نقدية</option>'
            + customers.map(x => '<option value="' + esc(field(x,['id','party_id','customer_id'])) + '">' + esc(field(x,['commercial_name_ar','commercial_name','legal_name','name']) || 'عميل') + '</option>').join('');
        const existingCustomerId = field(row,['customer_id','customer_party_id']);
        const hasCashName = String(field(row,['cash_customer_name']) || '').trim().length > 0;
        if (existingCustomerId) customerEl.value = String(existingCustomerId);
        else if (row && hasCashName && ['cash','نقدي','نقداً'].includes(String(field(row,['payment_method']) || '').trim().toLowerCase())) {
            customerEl.value = 'cash_sale';
        } else customerEl.value = '';
    }
    if (!row) {
        const now = new Date();
        const dateEl = document.querySelector('[data-key="sale_date"]');
        if (dateEl) dateEl.value = localDate(now);
        const timeEl = document.querySelector('[data-key="sale_time"]');
        if (timeEl) timeEl.value = localTime(now);
    }
    await loadActivePromotions(row);
    bindFuelCalculation(!row);
    const pumpSelect = document.querySelector('[data-key="pump_id"]');
    if (pumpSelect) {
        pumpSelect.onchange = async () => {
            await loadPumpNozzles(pumpSelect.value, '');
            const fuel = document.querySelector('[data-key="fuel_type_id"]');
            const price = document.querySelector('[data-key="price_per_liter"]');
            const total = document.querySelector('[data-key="total_amount"]');

            if (price) price.value = '';
            if (total) total.value = '';

        };
    }
    const nozzleSelect = document.querySelector('[data-key="nozzle_id"]');
    if (nozzleSelect) nozzleSelect.onchange = () => {
        const option = nozzleSelect.options[nozzleSelect.selectedIndex];
        const fuelId = option?.dataset?.fuelTypeId || '';

        if (fuel && fuelId && Array.from(fuel.options).some(o => String(o.value) === String(fuelId))) {
            fuel.value = String(fuelId);
            fuel.dispatchEvent(new Event('change', {bubbles:true}));
        } else {
            const price = document.querySelector('[data-key="price_per_liter"]');
            const total = document.querySelector('[data-key="total_amount"]');
            if (fuel) fuel.value = '';
            if (price) price.value = '';
            if (total) total.value = '';
            toast('هذه الفوهة غير مرتبطة بنوع وقود صالح في قاعدة البيانات؛ تحقق من إعداد الفوهة.', true, 'form');

    };

    if (fee) fee.oninput = updateDeliveryFeeDisplay;
    if (mode) mode.onchange = () => {
        if (mode.value === 'exempt' && fee) fee.value = '0';
        updateDeliveryFeeDisplay();
    };
    const location = document.querySelector('[data-key="delivery_location"]');
    const cashName = document.querySelector('[data-key="cash_customer_name"]');
    [location,cashName].forEach(el => { if (el) el.addEventListener('input', () => { state.lastSuccessfulSaleFingerprint = null; }); });
    if (pumpSelect?.value) await loadPumpNozzles(pumpSelect.value, row ? field(row,['nozzle_id']) : '');
    updateDeliveryFeeDisplay();
}

function localDate(d=new Date()) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localTime(d=new Date()) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

async function loadPumpNozzles(pumpId='', selectedId='') {
    const nozzleEl = document.querySelector('[data-key="nozzle_id"]');
    if (!nozzleEl) return;
    nozzleEl.innerHTML = '<option value="">اختر الفوهة...</option>';
    if (!pumpId || !bridge || typeof bridge.getPumpNozzles !== 'function') return;
    try {
        const result = parse(bridge.getPumpNozzles(JSON.stringify({pump_id: Number(pumpId)})));
        const nozzles = rowsFrom(result);
        nozzleEl.innerHTML = '<option value="">اختر الفوهة...</option>'
            + nozzles.map(n => '<option value="' + esc(n.id) + '" data-fuel-type-id="' + esc(n.fuel_type_id || '') + '">' + esc(n.nozzle_number||n.nozzle_code||n.id) + ' — ' + esc(n.nozzle_code||'فوهة') + '</option>').join('');
        nozzleEl.value = String(selectedId||'');
    } catch (e) {
        toast('تعذر تحميل فوهات المضخة: ' + e.message, true, 'form');
    }
}

async function refreshResolvedFuelPrice() {
    const f = document.querySelector('[data-key="fuel_type_id"]');
    const q = document.querySelector('[data-key="quantity"]');
    const p = document.querySelector('[data-key="price_per_liter"]');
    const t = document.querySelector('[data-key="total_amount"]');
    const customer = document.querySelector('[data-key="customer_id"]');
    if (!f || !p || !f.value) return;
    const seq = ++state.priceLookupSeq;
    const quantity = Math.max(0.000001, numeric(q?.value)||1);
    const date = document.querySelector('[data-key="sale_date"]')?.value || localDate(new Date());
    const time = document.querySelector('[data-key="sale_time"]')?.value || localTime(new Date());
    try {
        const raw = await invoke('getResolvedFuelSalePrice', [JSON.stringify({
            fuel_type_id: Number(f.value),
            quantity,
            customer_id: Number(customer?.value||0),
            transaction_time: date + ' ' + time,
            occasion_code: document.querySelector('[data-key="occasion_code"]')?.value.trim() || null
        })]);
        const resolved = dataOf(raw);
        if (seq !== state.priceLookupSeq) return;
        const price = Number(resolved?.unit_price);
        if (!Number.isFinite(price) || price < 0) throw new Error('لم يرجع محرك التسعير سعراً صالحاً');
        p.value = price.toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
        p.dataset.priceSource = String(resolved?.source||'');
        p.dataset.priceSourceId = String(resolved?.source_id??'');
        if (t) t.value = (numeric(q?.value)*price).toFixed(2);
        updateDeliveryFeeDisplay();
    } catch (e) {
        if (seq === state.priceLookupSeq) {
            toast('تعذر احتساب سعر الوقود الفعلي: ' + (e.message||'خطأ'), true, 'form');
        }
    }
}

function updateDeliveryFeeDisplay() {
    const quantity = numeric(document.querySelector('[data-key="quantity"]')?.value);
    const price = numeric(document.querySelector('[data-key="price_per_liter"]')?.value);
    const base = quantity * price;
    const feeInput = document.querySelector('[data-key="delivery_service_fee"]');
    const modeInput = document.querySelector('[data-key="delivery_fee_mode"]');
    const mode = modeInput?.value || 'exempt';
    if (mode === 'exempt' && feeInput && numeric(feeInput.value) !== 0) feeInput.value = '0';
    const fee = mode === 'exempt' ? 0 : Math.max(0, numeric(feeInput?.value));
    const display = document.querySelector('[data-key="delivery_fee_display_total"]');
    if (!display) return;
    // Deduct mode reduces litres/fuel value, not the overall customer invoice.
    const total = (mode === 'add_to_sales' || mode === 'driver') ? base + fee : base;
    display.value = total.toFixed(2);
}

function bindFuelCalculation(resolveDynamic=true) {
    const q = document.querySelector('[data-key="quantity"]');
    const p = document.querySelector('[data-key="price_per_liter"]');
    const t = document.querySelector('[data-key="total_amount"]');
    const f = document.querySelector('[data-key="fuel_type_id"]');
    const customer = document.querySelector('[data-key="customer_id"]');
    const payment = document.querySelector('[data-key="payment_method"]');
    const cashName = document.querySelector('[data-key="cash_customer_name"]');
    const updateCashCustomerVisibility = () => {
        const option = customer?.options?.[customer.selectedIndex];
        const selectedCashSale = customer?.value === 'cash_sale' ||
            String(option?.textContent || '').trim() === 'مبيعات نقدية';
        const visible = Boolean(selectedCashSale && (!payment || payment.value === 'cash'));
        const wrapper = cashName?.closest('[data-cash-customer-group]') || cashName?.closest('.form-group');
        if (wrapper) wrapper.style.display = visible ? '' : 'none';
        if (cashName && !visible) cashName.value = '';
    };
    const calc = () => { if (t) t.value = (numeric(q?.value)*numeric(p?.value)).toFixed(2); };
    if (f) f.onchange = () => {
        const o = f.options[f.selectedIndex];
        if (p) p.value = o?.dataset.price || '';
        calc();
        updateDeliveryFeeDisplay();
        if (resolveDynamic) refreshResolvedFuelPrice();
    };
    if (q) q.oninput = () => { calc(); updateDeliveryFeeDisplay(); if (resolveDynamic) refreshResolvedFuelPrice(); };
    if (customer) customer.onchange = () => {
        if (customer.value === 'cash_sale' && payment) payment.value = 'cash';
        updateCashCustomerVisibility();
        if (resolveDynamic) { loadActivePromotions(); refreshResolvedFuelPrice(); }
    };
    if (payment) payment.onchange = () => {
        if (payment.value !== 'cash' && customer?.value === 'cash_sale') customer.value = '';
        updateCashCustomerVisibility();
    };
    updateCashCustomerVisibility();
    const occ = document.querySelector('[data-key="occasion_code"]');
    if (occ) occ.addEventListener('change', () => refreshResolvedFuelPrice());
    calc();
    if (resolveDynamic) refreshResolvedFuelPrice();
}

async function openForm(row=null) {

        toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true, 'global');

    $('recordForm').innerHTML = (CFG.fields||[]).map(def => inputHtml(def, row)).join('');
    $('formModal').classList.add('show');

function collectForm() {
    const payload = {};
    document.querySelectorAll('#recordForm [data-key]').forEach(el => {
        if (el.dataset.key === 'sale_id') return;
        let v = el.value;
        if (el.type === 'number') v = v==='' ? 0 : Number(v);
        payload[el.dataset.key] = v;
    });
    payload.created_at = new Date().toISOString();
    return payload;
}

function fuelSaleFingerprint(payload) {
    const stable = {...payload};
    delete stable.idempotency_key;
    delete stable.created_at;
    return JSON.stringify(stable);
}

async function saveForm() {
    const form = $('recordForm');
    if (!form.reportValidity()) return;
    const payload = collectForm();
    payload.transaction_time = String(payload.sale_date || localDate(new Date())) + ' ' + String(payload.sale_time || localTime(new Date()));
    const customerSelection = String(payload.customer_id || '');
    const cashSaleSelected = customerSelection === 'cash_sale';
    const customerId = cashSaleSelected ? 0 : (Number(customerSelection) || 0);
    if (cashSaleSelected) payload.payment_method = 'cash';
    const deliveryFeeMode = String(payload.delivery_fee_mode || 'exempt');
    const feeInput = document.querySelector('[data-key="delivery_service_fee"]');
    if (deliveryFeeMode === 'exempt' && feeInput) feeInput.value = '0';
    const deliveryFee = deliveryFeeMode === 'exempt' ? 0 : Number(payload.delivery_service_fee || 0);
    const deliveryLocation = String(payload.delivery_location || '').trim();
    const cashCustomerName = cashSaleSelected ? String(payload.cash_customer_name || '').trim() : '';
    if (!Number.isFinite(deliveryFee) || deliveryFee < 0) return toast('رسوم خدمة التوصيل يجب أن تكون صفراً أو أكثر', true, 'form');
    if (!['exempt','add_to_sales','driver','deduct_from_sales'].includes(deliveryFeeMode)) return toast('اختر طريقة احتساب رسوم التوصيل', true, 'form');
    if (deliveryFee > 0 && deliveryFeeMode !== 'exempt' && !deliveryLocation) return toast('أدخل موقع التوصيل قبل احتساب رسوم الخدمة', true, 'form');
    if (deliveryFee > 0 && deliveryFeeMode === 'deduct_from_sales' && deliveryFee >= numeric(payload.quantity) * numeric(payload.price_per_liter)) return toast('رسوم التوصيل يجب أن تكون أقل من قيمة المبيعات حتى تبقى كمية وقود موجبة', true, 'form');
    if (cashSaleSelected && deliveryLocation && !cashCustomerName) return toast('أدخل اسم العميل النقدي المرتبط بالتوصيل', true, 'form');
    payload.delivery_service_fee = deliveryFee;
    payload.delivery_fee_mode = deliveryFeeMode;
    payload.delivery_location = deliveryLocation;
    payload.cash_customer_name = cashCustomerName;
    payload.delivery_fee_display_total = Number(document.querySelector('[data-key="delivery_fee_display_total"]')?.value || payload.total_amount || 0);
    const fingerprint = fuelSaleFingerprint(payload);
    if (!state.editing && state.lastSuccessfulSaleFingerprint === fingerprint) {
        return toast('تم حفظ هذه البيانات بالفعل. عدّل الكمية أو الحقول المطلوبة قبل إنشاء عملية بيع جديدة.', true, 'form');
    }
    if (customerId > 0) { payload.customer_id = customerId; } else { delete payload.customer_id; }
    if (payload.payment_method === 'credit' && customerId <= 0) {
        return toast('اختر عميلاً حقيقياً للبيع الآجل', true, 'form');
    }
    if (!payload.shift_id) return toast('لا توجد وردية مفتوحة حالياً', true, 'form');
    if (!payload.pump_id) return toast('اختر المضخة', true, 'form');
    if (!payload.fuel_type_id) return toast('اختر نوع الوقود', true, 'form');
    if (!payload.nozzle_id) return toast('اختر الفوهة التابعة للمضخة', true, 'form');
    if (!(numeric(payload.quantity) > 0)) return toast('أدخل كمية أكبر من صفر', true, 'form');
    payload.total_amount = (numeric(payload.quantity) * numeric(payload.price_per_liter)).toFixed(2);
    if (!state.pendingIdempotencyKey) state.pendingIdempotencyKey = newIdempotencyKey();
    payload.idempotency_key = state.pendingIdempotencyKey;
    setLoading(true);
    try {
        let result;
        if (state.editing && CFG.updateMethod) {
            result = await invoke(CFG.updateMethod, [Number(idOf(state.editing)), JSON.stringify(payload)]);
            parse(result);
            showAdvancedNotification('تم تحديث عملية البيع بنجاح', 'success', 'تم التحديث');
            closeModal(null, 'formModal');
            await reloadData();
            return;
        } else {
            result = await invoke('saveFuelSaleRecord', [JSON.stringify(payload)]);
            const saved = parse(result);
            const saleId = Number(saved.sale_id || saved.id || 0);
            if (!saleId) throw new Error('لم يتم استلام sale_id الحقيقي من SQLite');
            state.lastSavedSaleId = saleId;
            state.pendingIdempotencyKey = null;
            state.lastSuccessfulSaleFingerprint = fingerprint;
            if (deliveryFeeMode === 'deduct_from_sales') {
                const savedQuantity = Number(saved.quantity);
                const savedFuelAmount = Number(saved.total_amount);
                const savedInvoiceTotal = Number(saved.delivery_fee_display_total);
                const quantityEl = document.querySelector('[data-key="quantity"]');
                const totalEl = document.querySelector('[data-key="total_amount"]');
                const displayEl = document.querySelector('[data-key="delivery_fee_display_total"]');
                if (quantityEl && Number.isFinite(savedQuantity) && savedQuantity > 0) quantityEl.value = String(savedQuantity);
                if (totalEl && Number.isFinite(savedFuelAmount) && savedFuelAmount >= 0) totalEl.value = savedFuelAmount.toFixed(2);
                if (displayEl && Number.isFinite(savedInvoiceTotal) && savedInvoiceTotal >= 0) displayEl.value = savedInvoiceTotal.toFixed(2);
                state.lastSuccessfulSaleFingerprint = fuelSaleFingerprint(collectForm());
            }
            const sms = saved.sms || {};
            const smsNote = sms.queued
                ? ' — تم وضع SMS في طابور الإرسال'
                : (payload.payment_method === 'credit' ? ' — تعذر تجهيز SMS: ' + (sms.reason||'غير معروف') : '');
            toast('تم حفظ عملية البيع رقم ' + saleId + ' وتحديث المخزون' + smsNote, false, 'form');
            showDeliveryAction(saleId);
            void reloadData().catch(refreshError => console.warn('[Fuel Sales] Background refresh failed:', refreshError));
            // Keep the form modal open for review; the operator closes it explicitly.
            // The refresh no longer delays visible save-success feedback.
            return;
        }
    } catch (e) {
        showAdvancedNotification(e.message || 'فشل حفظ العملية', 'error', '❌ فشل الحفظ');
        toast(e.message || 'فشل حفظ العملية', true, 'form');
    } finally {
        setLoading(false);
    }
}

async function deleteRow(row) {
    const id = row && idOf(row);
    if (!id || !CFG.deleteMethod) return;
    if (!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟')) return;
    setLoading(true);
    try {
        const result = await invoke(CFG.deleteMethod, [Number(id)]);
        parse(result);
        showAdvancedNotification('تم الحذف بنجاح', 'success', 'تم الحذف');
        await reloadData();
    } catch (error) {
        showAdvancedNotification(error.message||'فشل الحذف', 'error', 'فشل');
    } finally {
        setLoading(false);
    }
}

   Reload
   ============================================================ */
async function reloadData() {
    if (!CFG.listMethod) { renderCards(); return; }
    if (!bridge) { $('offlineBanner').classList.add('show'); renderCards(); return; }
    setLoading(true);
    try {
        const result = await invoke(CFG.listMethod, argsForLoad());
        state.rows = rowsFrom(result);
        state.loadedAt = new Date();
        $('offlineBanner').classList.remove('show');
        applyFilter();
    } catch (error) {
        state.rows = [];
        state.loadedAt = new Date();
        renderCards();
        toast(error.message||'فشل تحميل البيانات', true, 'global');
    } finally {
        setLoading(false);
    }
}

function openModal(event, id) {
    if (event && event.target !== event.currentTarget) return;
    const el = $(id);
    if (!el) return;
    el.classList.add('show');
    document.body.classList.add('modal-open');
    setTimeout(updateTopBarHeight, 100);
}

function closeModal(event, id) {
    if (event && event.target !== event.currentTarget) return;
    const el = $(id);
    if (!el) return;
    el.classList.remove('show');
    // التحقق من عدم وجود مودالات أخرى مفتوحة قبل إزالة الكلاس
    const openModals = document.querySelectorAll('.modal-overlay.show');
    if (openModals.length === 0) {
        document.body.classList.remove('modal-open');
    }
    setTimeout(updateTopBarHeight, 100);
}
