            // تركيز على أول حقل مرئي
            const firstVisible = document.querySelector('#recordForm .form-group:not(.hidden-field) .form-input');
            if (firstVisible) setTimeout(() => firstVisible.focus(), 180);

            $('formModal').classList.add('show');
        }

        // ============================================================
        // جمع البيانات
        // ============================================================
        function collectForm() {
            const payload = {};
            document.querySelectorAll('#recordForm [data-key]').forEach(el => {
                let value = el.value;
                if (el.type === 'number') {
                    value = value === '' ? 0 : Number(value);
                }
                // توحيد القيم true/false في القوائم
                if (el.tagName === 'SELECT' && (el.dataset.key === 'is_below_minimum' || el.dataset.key === 'is_near_maximum' || el.dataset.key === 'alert_triggered')) {
                    if (value === '1') value = 1;
                    else if (value === '0') value = 0;
                    else value = '';
                }
                payload[el.dataset.key] = value;
            });
            return payload;
        }

        async function saveForm() {
            const form = $('recordForm');
            if (!form.reportValidity()) return;
            const payload = collectForm();
            setLoading(true);
            try {
                let result;
                if (state.editing && CFG.updateMethod) {
                    const id = idOf(state.editing);
                    if (!id) throw new Error('معرف السجل غير صالح');
                    result = await invoke(CFG.updateMethod, [Number(id), JSON.stringify(payload)]);
                } else if (CFG.createMethod) {
                    result = await invoke(CFG.createMethod, [JSON.stringify(payload)]);
                } else {
                    throw new Error('لا توجد عملية حفظ مدعومة');
                }
                parse(result);
                toast('تم تنفيذ العملية والتحقق من نجاحها');
                closeModal(null, 'formModal');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشلت العملية', true);
            } finally {
                setLoading(false);
            }
        }

        async function deleteRow(row) {
            const id = row && idOf(row);
            if (!id || !CFG.deleteMethod) return;
            if (!confirm('هل تريد تنفيذ الحذف الفعلي لهذا السجل؟')) return;
            setLoading(true);
            try {
                const result = await invoke(CFG.deleteMethod, [Number(id)]);
                parse(result);
                toast('تم الحذف فعلياً');
                await reloadData();
            } catch (error) {
                toast(error.message || 'فشل الحذف', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // تحميل البيانات
        // ============================================================
        async function reloadData() {
            if (CFG.mode === 'unsupported' || CFG.mode === 'ai') { renderCards(); return; }
            if (!CFG.listMethod) { renderCards(); return; }
            if (!bridge) {
                $('offlineBanner').classList.add('show');
                renderCards();
                return;
            }
            setLoading(true);
            try {
                const result = await invoke(CFG.listMethod, argsForLoad());
                state.rows = rowsFrom(result);
                state.loadedAt = new Date();
                $('offlineBanner').classList.remove('show');
                applyFilter();
            } catch (error) {
                state.rows = [];
                state.loadedAt = new Date();
                renderCards();
                toast(error.message || 'فشل تحميل البيانات', true);
            } finally {
                setLoading(false);
            }
        }

        // ============================================================
        // المودالات
        // ============================================================
        function openModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.add('show');
        }
        function closeModal(event, id) {
            if (event && event.target !== event.currentTarget) return;
            $(id).classList.remove('show');
        }

        // ============================================================
        // التقارير
        // ============================================================
        async function populateReportFilters() {
            try {
                const tanks = await fetchTanks();
                const sel = $('reportTankFilter');
                if (sel) sel.innerHTML = '<option value="">كل الخزانات</option>' +
                    tanks.map(t => {
                        const tid = t.id || t.tank_id;
                        const label = `${t.tank_code || ''} - ${t.tank_name_ar || t.tank_name || ''}`.trim();
                        return `<option value="${esc(tid)}">${esc(label || ('خزان ' + tid))}</option>`;
                    }).join('');
            } catch(_) {}
        }

        function openReport() {
            setDateDefaults();
            $('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>اضغط توليد التقرير لعرض البيانات من SQLite.</p></div>';
            populateReportFilters().then(() => openModal(null, 'reportModal'));
        }

        function buildReportSummary(rows) {
            const totalOpening = rows.reduce((s, r) => s + numeric(field(r, ['opening_level'])), 0);
            const totalClosing = rows.reduce((s, r) => s + numeric(field(r, ['closing_level'])), 0);
            const totalRefills = rows.reduce((s, r) => s + numeric(field(r, ['refills_total'])), 0);
            const totalSales = rows.reduce((s, r) => s + numeric(field(r, ['sales_total'])), 0);
            const alerts = rows.filter(r => isYes(field(r, ['alert_triggered']))).length;
            const low = rows.filter(r => isYes(field(r, ['is_below_minimum']))).length;
            const high = rows.filter(r => isYes(field(r, ['is_near_maximum']))).length;
            return `
                <div class="report-summary">
                    <div class="report-summary-item"><span>إجمالي السجلات</span><strong>${rows.length.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>افتتاحي تراكمي</span><strong>${numFmt(totalOpening)}</strong></div>
                    <div class="report-summary-item"><span>ختامي تراكمي</span><strong>${numFmt(totalClosing)}</strong></div>
                    <div class="report-summary-item"><span>إجمالي التعبئة</span><strong>${numFmt(totalRefills)}</strong></div>
                    <div class="report-summary-item"><span>إجمالي المبيعات</span><strong>${numFmt(totalSales)}</strong></div>
                    <div class="report-summary-item"><span>تنبيهات</span><strong>${alerts.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>منخفض</span><strong>${low.toLocaleString('ar')}</strong></div>
                    <div class="report-summary-item"><span>مرتفع</span><strong>${high.toLocaleString('ar')}</strong></div>
                </div>`;
        }

        async function generateReport() {
            setLoading(true);
            try {
                let result;
                if (String(CFG.reportKind || '').startsWith('operational:')) {
                    const suffix = String(CFG.reportKind).split(':')[1];
                    const payload = {
                        from_date: $('reportFrom').value || '',
                        to_date: $('reportTo').value || '',
                        search: $('searchInput').value || '',
                        tank_id: $('reportTankFilter') ? $('reportTankFilter').value : '',
                        reading_type: $('reportTypeFilter') ? $('reportTypeFilter').value : '',
                        level_status: $('reportLevelFilter') ? $('reportLevelFilter').value : '',
                        alert_status: $('reportAlertFilter') ? $('reportAlertFilter').value : '',
                        difference_status: $('reportDiffFilter') ? $('reportDiffFilter').value : '',
                        report_type: $('reportKindFilter') ? $('reportKindFilter').value : 'detailed',
                        include_archived: true,
                        limit: 2000
                    };
                    result = await invoke('generate' + suffix + 'Report', [JSON.stringify(payload)]);
                } else {
                    result = { data: state.filtered };
                }

                let rows = rowsFrom(result);
                // تصفية إضافية محلية
                rows = rows.filter(row => {
                    const tankId = $('reportTankFilter') ? $('reportTankFilter').value : '';
                    const readingType = $('reportTypeFilter') ? $('reportTypeFilter').value : '';
                    const levelStatus = $('reportLevelFilter') ? $('reportLevelFilter').value : '';
                    const alertStatus = $('reportAlertFilter') ? $('reportAlertFilter').value : '';
                    const diffStatus = $('reportDiffFilter') ? $('reportDiffFilter').value : '';

                    if (tankId && String(field(row, ['tank_id']) || '') !== tankId) return false;
                    if (readingType && String(field(row, ['reading_type']) || '').toLowerCase() !== readingType) return false;

                    const below = isYes(field(row, ['is_below_minimum']));
                    const near = isYes(field(row, ['is_near_maximum']));
                    const alert = isYes(field(row, ['alert_triggered']));
                    if (levelStatus === 'low' && !below) return false;
                    if (levelStatus === 'high' && !near) return false;
                    if (levelStatus === 'normal' && (below || near || alert)) return false;

                    if (alertStatus === 'triggered' && !alert) return false;
                    if (alertStatus === 'clear' && alert) return false;

                    const diff = Math.abs(numeric(field(row, ['difference'])));
                    const tolerance = numeric(field(row, ['tolerance_limit'])) || 0.5;
                    if (diffStatus === 'within' && diff > tolerance) return false;
                    if (diffStatus === 'exceeds' && diff <= tolerance) return false;

                    return true;
                });

                $('reportResults').innerHTML = buildReportSummary(rows) + renderReport(rows);
                toast(`تم توليد التقرير (${rows.length} سجل)`);
            } catch (e) {
                toast(e.message || 'فشل التقرير', true);
            } finally {
                setLoading(false);
            }
        }

        function renderReport(rows) {
            if (!rows.length) return '<div class="empty-state">لا توجد بيانات للتقرير.</div>';
            return `<div class="data-fields">${rows.slice(0, 200).map(row => `
                <div class="data-field">
                    <span>${esc(titleOf(row))}</span>
                    <strong>${esc(subtitleOf(row) || JSON.stringify(row))}</strong>
                    <small style="display:block;color:var(--text-muted);font-size:.7rem;margin-top:3px">
                        ${isYes(field(row,['alert_triggered'])) ? '· تنبيه' : ''}
                        ${isYes(field(row,['is_below_minimum'])) ? '· منخفض' : ''}
                        ${isYes(field(row,['is_near_maximum'])) ? '· مرتفع' : ''}
                    </small>
                </div>`).join('')}</div>`;
        }

        // ============================================================
        // تصدير CSV
        // ============================================================
        function exportData() {
            const rows = state.filtered;
            if (!rows.length) { toast('لا توجد بيانات حقيقية لتصديرها', true); return; }
            const keys = [...new Set(rows.flatMap(row => Object.keys(row || {})))];
            const headers = keys.map(k => tr(k));
            const csv = '\ufeff' + [headers, ...rows.map(row => keys.map(k => {
                const v = row[k];
                if (k === 'reading_type') return trReadingType(v);
                if (k === 'is_below_minimum' || k === 'is_near_maximum' || k === 'alert_triggered') return isYes(v) ? 'نعم' : 'لا';
                return String(v == null ? '' : v).replace(/"/g, '""');
            }))].map(row => row.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            a.href = url;
            a.download = `tank_filling_${stamp}.csv`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            toast('تم إنشاء ملف CSV من البيانات المحملة فعلياً');
        }

        // ============================================================
        // التنقل والوضع
        // ============================================================
        function goHome() { window.location.href = '../main.html'; }

        function applyTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
            $('themeIcon').className = saved === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        function toggleTheme() {
            const dark = document.documentElement.dataset.theme === 'dark';
            if (dark) delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = 'dark';
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            $('themeIcon').className = dark ? 'fas fa-moon' : 'fas fa-sun';
        }

        // ============================================================
        // القائمة الجانبية
        // ============================================================
        function openSidebar() {
            $('sidebar').classList.add('open');
            $('sidebarToggle').classList.add('hidden');
        }
        function closeSidebar() {
            $('sidebar').classList.remove('open');
            $('sidebarToggle').classList.remove('hidden');
        }

        function initSidebar() {
            $('sidebarToggle').addEventListener('click', (e) => {
                e.stopPropagation();
                if ($('sidebar').classList.contains('open')) closeSidebar();
                else openSidebar();
            });
            document.querySelectorAll('.sidebar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.sidebarAction;
                    closeSidebar();
                    setTimeout(() => {
                        if (action === 'reload') reloadData();
                        else if (action === 'report') openReport();
                        else if (action === 'export') exportData();
                        else if (action === 'print') window.print();
                        else if (action === 'home') goHome();
                    }, 120);
                });
            });
            document.addEventListener('click', (e) => {
                const side = $('sidebar');
                const toggle = $('sidebarToggle');
                if (!side.classList.contains('open')) return;
                if (side.contains(e.target) || toggle.contains(e.target)) return;
                closeSidebar();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeSidebar();
                    document.querySelectorAll('.modal-overlay').forEach(x => x.classList.remove('show'));
                }
            });
        }

        // ============================================================
        // ربط الأحداث العامة
        // ============================================================
        function bindGlobalEvents() {
            $('searchInput').addEventListener('input', applyFilter);
            $('themeToggle').addEventListener('click', toggleTheme);
            $('fab').addEventListener('click', () => openForm());
            $('saveBtn').addEventListener('click', saveForm);
            window.addEventListener('online', () => toast('عاد اتصال الجسر المحتمل؛ اضغط تحديث للتحقق'));
            window.addEventListener('offline', () => $('offlineBanner').classList.add('show'));
        }

        // ============================================================
        // تصدير الدوال
        // ============================================================
        Object.assign(window, {
            goHome, openReport, exportData, reloadData, openForm, saveForm,
            openModal, closeModal, generateReport
        });

        // ============================================================
        // التهيئة
        // ============================================================
        applyTheme();
        renderFilters();
        initSidebar();
        bindGlobalEvents();
        reloadData();
    })();
    </script>
