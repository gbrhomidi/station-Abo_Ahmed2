<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>نظام إدارة محطة الوقود – تعبئة الخزانات</title>
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/theme.css" />
    <link href="file:///android_asset/assets-local/css/css2" rel="stylesheet">
    <link rel="stylesheet" href="file:///android_asset/assets-local/css/all.min.css">
    <style>
        /* ============================================================
           نظام الألوان الموحّد — من pumps.html
           ============================================================ */
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.96);
            --bg-glass: rgba(0, 0, 0, 0.025);
            --bg-glass-light: rgba(0, 0, 0, 0.05);
            --text-primary: #1a2233;
            --text-secondary: #44546a;
            --text-muted: #8391a5;
            --border-color: #d8dde4;

            --silver-border-color: #c4cad2;
            --silver-border-color-strong: #a8b0bb;
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.5);

            --gold-primary: #c89a12;
            --gold-dark: #a67c00;
            --gold-light: #f5c842;
            --gold-glow: 0 0 30px rgba(200, 154, 18, 0.18);

            --emerald-primary: #059669;
            --emerald-dark: #047857;
            --emerald-glow: 0 0 30px rgba(5, 150, 105, 0.12);

            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --purple: #7c3aed;

            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-glow: 0 0 40px rgba(200, 154, 18, 0.08);

            --radius-card: 20px;
            --radius-small: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            --header-bg: rgba(255, 255, 255, 0.94);
            --nav-bg: rgba(255, 255, 255, 0.96);
            --sidebar-bg: rgba(255, 255, 255, 0.98);
            --toast-bg: #ffffff;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #e8e0d5;
            --skeleton-shine: #f5efe6;

            color-scheme: light;
        }

        [data-theme="dark"] {
            --bg-primary: #1e232b;
            --bg-secondary: #262c36;
            --bg-card: rgba(40, 47, 58, 0.88);
            --bg-glass: rgba(255, 255, 255, 0.035);
            --bg-glass-light: rgba(255, 255, 255, 0.075);
            --text-primary: #d8dee6;
            --text-secondary: #9aa5b4;
            --text-muted: #6a7686;
            --border-color: rgba(200, 205, 212, 0.2);

            --silver-border-color: rgba(192, 197, 204, 0.35);
            --silver-border-color-strong: rgba(192, 197, 204, 0.55);
            --silver-border: 1px solid var(--silver-border-color);
            --silver-border-strong: 1px solid var(--silver-border-color-strong);
            --silver-shadow: 0 1px 3px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            --gold-primary: #f5c842;
            --gold-dark: #c99f1e;
            --gold-light: #f7d268;
            --gold-glow: 0 0 30px rgba(245, 200, 66, 0.15);

            --emerald-primary: #10b981;
            --emerald-dark: #059669;
            --emerald-glow: 0 0 30px rgba(16, 185, 129, 0.15);

            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --purple: #9b59b6;

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 40px rgba(245, 200, 66, 0.05);

            --header-bg: rgba(30, 35, 43, 0.94);
            --nav-bg: rgba(30, 35, 43, 0.96);
            --sidebar-bg: rgba(38, 44, 54, 0.98);
            --toast-bg: #262c36;

            --scrollbar-track: transparent;
            --scrollbar-thumb: var(--gold-primary);
            --skeleton-bg: #1e293b;
            --skeleton-shine: #2d3a4f;

            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            padding: 0 0 90px 0;
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(200, 154, 18, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(5, 150, 105, 0.035) 0%, transparent 55%);
            -webkit-font-smoothing: antialiased;
            transition: background 0.35s ease, color 0.35s ease;
            touch-action: pan-y;
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 5% 15%, rgba(245, 200, 66, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 95% 85%, rgba(16, 185, 129, 0.03) 0%, transparent 55%);
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-primary); border-radius: 10px; }

        .loading-indicator {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        [data-theme="dark"] .loading-indicator { background: rgba(0, 0, 0, 0.85); }
        .loading-indicator.show { display: flex; }
        .spinner {
            width: 56px; height: 56px;
            border: 4px solid rgba(200, 154, 18, 0.15);
            border-top: 4px solid var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: linear-gradient(90deg, var(--warning), #f97316);
            color: #000;
            text-align: center;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        .offline-banner.show { transform: translateY(0); }

        /* ============================================================
           الشريط العلوي
           ============================================================ */
        .top-bar {
            position: sticky;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 14px 22px 12px;
            background: var(--header-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: var(--silver-border);
            z-index: 100;
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            gap: 12px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .top-title { flex: 1; min-width: 150px; }
        .top-title h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-title h2 i {
            -webkit-text-fill-color: initial;
            color: var(--gold-primary);
            font-size: 1.1rem;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
            position: relative;
            box-shadow: var(--silver-shadow);
        }
        .icon-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-2px);
            box-shadow: var(--silver-shadow), 0 4px 12px rgba(200, 154, 18, 0.15);
        }
        .icon-btn:active { transform: scale(0.92); }

        .search-wrap { position: relative; }
        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: right;
        }
        .search-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.12), var(--silver-shadow);
        }
        .search-wrap i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0;
            scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .filter-chip:active { transform: scale(0.95); }
        .filter-chip:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
        .filter-chip.active {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
            box-shadow: 0 2px 8px rgba(200, 154, 18, 0.35);
        }
        .filter-chip .chip-count {
            background: rgba(255,255,255,0.25);
            color: inherit;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 800;
        }
        .filter-chip:not(.active) .chip-count {
            background: var(--bg-glass-light);
            color: var(--text-muted);
        }

        /* ============================================================
           بطاقات الإحصائيات
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: var(--silver-border-strong);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            touch-action: manipulation;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--silver-shadow), var(--shadow-card);
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .stat-card:active { transform: scale(0.96); }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
            box-shadow: var(--silver-shadow), 0 12px 32px rgba(200, 154, 18, 0.15);
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border: var(--silver-border);
            background: var(--bg-glass-light);
            color: var(--gold-primary);
        }
        .stat-icon.blue { background: rgba(37, 99, 235, 0.1); color: var(--info); }
        .stat-icon.green { background: rgba(5, 150, 105, 0.1); color: var(--emerald-primary); }
        .stat-icon.orange { background: rgba(217, 119, 6, 0.1); color: var(--warning); }
        .stat-icon.red { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .stat-icon.purple { background: rgba(124, 58, 237, 0.1); color: var(--purple); }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            margin: 4px 0 2px;
            color: var(--text-primary);
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            text-align: center;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
        }
        @media (min-width: 768px) {
            .stats-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           لوحة البيانات
           ============================================================ */
        .data-panel {
            margin: 0 16px;
            padding: 16px;
            border-radius: var(--radius-card);
            background: var(--bg-card);
            border: var(--silver-border-strong);
            box-shadow: var(--silver-shadow), var(--shadow-card);
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }
        .data-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
            opacity: 0.85;
        }
        .section-title {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title h3 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title h3 i { color: var(--gold-primary); }
        .section-title .count-badge {
            background: var(--gold-primary);
            color: #ffffff;
            border-radius: 30px;
            padding: 3px 12px;
            font-size: 0.75rem;
            font-weight: 900;
            border: var(--silver-border);
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: pan-y;
        }

        .data-card {
            background: var(--bg-glass);
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            padding: 14px;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .data-card:hover {
            border-color: var(--gold-primary);
            background: var(--bg-glass-light);
            box-shadow: var(--silver-shadow), 0 8px 24px rgba(200, 154, 18, 0.1);
        }
        .data-card-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .data-card-title {
            font-weight: 800;
            color: var(--text-primary);
            text-align: center;
            flex: 1;
            font-size: 0.98rem;
        }
        .data-card-subtitle {
            color: var(--text-muted);
            font-size: 0.76rem;
            margin-top: 4px;
            line-height: 1.7;
            text-align: center;
        }
        .data-card-value {
            color: var(--gold-primary);
            font-weight: 900;
            white-space: nowrap;
            direction: ltr;
            font-family: 'Inter', 'Arial', sans-serif;
        }
        .data-card-badge {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 800;
            border: var(--silver-border);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .data-card-badge.ok { background: rgba(5, 150, 105, 0.12); color: var(--emerald-primary); }
        .data-card-badge.warn { background: rgba(217, 119, 6, 0.12); color: var(--warning); }
        .data-card-badge.danger { background: rgba(220, 38, 38, 0.12); color: var(--danger); }
        .data-card-badge.neutral { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

        .data-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .data-field {
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            min-width: 0;
            text-align: center;
        }
        .data-field span {
            display: block;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }
        .data-field strong {
            display: block;
            margin-top: 2px;
            overflow-wrap: anywhere;
            color: var(--text-primary);
            font-size: 0.8rem;
            text-align: center;
            font-weight: 800;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
        }
        .btn {
            border: var(--silver-border);
            border-radius: 10px;
            padding: 9px 13px;
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-family: 'Cairo', 'Inter', sans-serif;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: var(--silver-shadow);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: translateY(-1px);
            background: var(--bg-glass-light);
        }
        .btn.primary {
            background: var(--gold-primary);
            color: #ffffff;
            border-color: var(--gold-dark);
        }
        .btn.primary:hover { background: var(--gold-dark); color: #ffffff; }
        .btn.danger:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(220, 38, 38, 0.1);
        }
        .btn.warning:hover {
            color: var(--warning);
            border-color: var(--warning);
            background: rgba(217, 119, 6, 0.1);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 3.5rem;
            margin-bottom: 14px;
            opacity: 0.4;
            display: block;
            color: var(--gold-primary);
        }
        .empty-state p { font-size: 0.9rem; }

        /* ============================================================
           الزر العائم
           ============================================================ */
        .fab {
            position: fixed;
            bottom: 90px;
            left: 24px;
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--gold-primary);
            border: var(--silver-border);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(200, 154, 18, 0.3), var(--silver-shadow);
            transition: var(--transition);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .fab:active { transform: scale(0.9); }
        .fab:hover {
            background: var(--gold-dark);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 30px rgba(200, 154, 18, 0.4);
        }

        /* ============================================================
           القائمة الجانبية
           ============================================================ */
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: var(--gold-primary);
            color: white;
            width: 40px; height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50% 0 0 50%;
            cursor: pointer;
            z-index: 1001;
            box-shadow: -3px 0 15px rgba(200, 154, 18, 0.3);
            transition: var(--transition);
            border: var(--silver-border);
            touch-action: manipulation;
        }
        .sidebar-toggle:active { transform: translateY(-50%) scale(0.9); }
        .sidebar-toggle.hidden { opacity: 0; pointer-events: none; }
        .sidebar-toggle:hover { background: var(--gold-dark); width: 44px; }
        .sidebar {
            position: fixed;
            top: 50%;
            right: -140px;
            transform: translateY(-50%);
            width: 110px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 999;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            padding: 12px 10px;
            border-radius: 18px 0 0 18px;
            overflow-y: auto;
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.15);
            border: var(--silver-border);
            border-right: none;
            opacity: 0;
        }
        .sidebar.open { right: 0; opacity: 1; }
        .sidebar-content { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-btn {
            position: relative;
            background: var(--bg-glass);
            border: var(--silver-border);
            padding: 12px 6px;
            border-radius: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 72px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'Cairo', 'Inter', sans-serif;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .sidebar-btn:active { transform: scale(0.92); }
        .sidebar-btn:hover {
            background: var(--bg-glass-light);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
            transform: scale(1.05);
        }
        .sidebar-btn i { font-size: 1.5rem; }
        .sidebar-btn span { font-size: 0.68rem; margin-top: 2px; font-weight: 800; }

        /* ============================================================
           القائمة السفلية
           ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: var(--silver-border-strong);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom, 8px) 0;
            z-index: 300;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
        }
        .bottom-nav::-webkit-scrollbar { display: none; }
        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.72rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 6px 10px;
            position: relative;
            touch-action: manipulation;
            flex: 1;
            min-width: 80px;
        }
        .bottom-nav .nav-item:active { transform: scale(0.9); }
        .bottom-nav .nav-item i { font-size: 20px; transition: var(--transition); }
        .bottom-nav .nav-item span { font-weight: 700; margin-top: 2px; }
        .bottom-nav .nav-item.active { color: var(--gold-primary); }
        .bottom-nav .nav-item.active i {
            transform: translateY(-3px);
            text-shadow: 0 0 20px rgba(200, 154, 18, 0.3);
        }
        .bottom-nav .nav-item.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: var(--gold-primary);
            border-radius: 10px;
        }

        /* ============================================================
           المودالات
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 800;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: var(--silver-border);
            padding-bottom: 14px;
        }
        .modal-title {
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .modal-close {
            width: 40px; height: 40px;
            border-radius: 12px;
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-close:hover {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        /* ===== حقول النموذج ===== */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 2px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group.hidden-field { display: none !important; }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
            font-weight: 600;
        }
        .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
            background: var(--bg-glass-light);
        }
        .form-input::placeholder { color: var(--text-muted); text-align: center; }
        select.form-input option { background: var(--bg-secondary); color: var(--text-primary); text-align: center; }
        textarea.form-input { text-align: center; resize: vertical; min-height: 60px; }
        .form-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 2px;
        }

        .modal-body { padding: 4px 0; }
        .modal-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            padding: 14px 0 0;
            border-top: var(--silver-border);
            margin-top: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--gold-primary);
            color: white;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            touch-action: manipulation;
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); }
        .submit-btn:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }

        /* ============================================================
           مودال التقارير
           ============================================================ */
        .report-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 900;
            display: none;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        [data-theme="dark"] .report-modal-overlay { background: rgba(0, 0, 0, 0.78); }
        .report-modal-overlay.show { display: flex; opacity: 1; }
        .report-modal {
            background: var(--bg-secondary);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: var(--silver-border-strong);
            border-bottom: none;
        }
        .report-modal-overlay.show .report-modal { transform: translateY(0); }

        .report-filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .report-filter-row .form-group { margin-bottom: 0; }
        .report-filter-row .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-align: center;
        }
        .report-filter-row .form-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            background: var(--bg-glass);
            color: var(--text-primary);
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: var(--transition);
            outline: none;
            box-shadow: var(--silver-shadow);
            text-align: center;
        }
        .report-filter-row .form-input:focus {
            border: var(--silver-border-strong);
            box-shadow: 0 0 0 3px rgba(200, 154, 18, 0.1), var(--silver-shadow);
        }
        .report-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .report-actions .btn {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            border-radius: var(--radius-small);
            border: var(--silver-border);
            font-weight: 800;
            font-family: 'Cairo', 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
            background: var(--bg-glass);
            color: var(--text-secondary);
            box-shadow: var(--silver-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .report-actions .btn:active { transform: scale(0.97); }
        .report-actions .btn-primary {
            background: var(--gold-primary);
            color: white;
            border-color: var(--gold-dark);
        }
        .report-actions .btn-primary:hover {
            background: var(--gold-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 154, 18, 0.3);
        }
        .report-results {
            margin-top: 20px;
            max-height: 380px;
            overflow-y: auto;
            border: var(--silver-border-strong);
            border-radius: var(--radius-small);
            background: var(--bg-card);
            padding: 8px;
        }
        .report-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .report-summary-item {
            padding: 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            text-align: center;
        }
        .report-summary-item span {
            display: block;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .report-summary-item strong {
            display: block;
            margin-top: 2px;
            color: var(--gold-primary);
            font-size: 0.95rem;
            font-weight: 900;
            font-family: 'Inter', 'Arial', sans-serif;
        }

        /* ============================================================
           Toast
           ============================================================ */
        .toast {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--toast-bg);
            border: var(--silver-border-strong);
            border-radius: 14px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 600;
            opacity: 0;
            transition: var(--transition);
            pointer-events: none;
            box-shadow: var(--silver-shadow), 0 10px 35px rgba(0, 0, 0, 0.2);
            min-width: 220px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Cairo', 'Inter', sans-serif;
            color: var(--text-primary);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success { border-color: var(--emerald-primary); }
        .toast.error { border-color: var(--danger); }
        .toast.warning { border-color: var(--warning); }
        .toast.info { border-color: var(--gold-primary); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.5s ease forwards; }

        .page-container { max-width: 1280px; margin: 0 auto; padding: 16px 0 90px; }
        .hidden { display: none !important; }

        /* ============================================================
           حقول التفاصيل
           ============================================================ */
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .detail-item {
            padding: 10px;
            border-radius: 10px;
            background: var(--bg-glass);
            border: var(--silver-border);
            text-align: center;
        }
        .detail-item span {
            display: block;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-align: center;
            font-weight: 600;
        }
        .detail-item strong {
            display: block;
            margin-top: 3px;
            overflow-wrap: anywhere;
            text-align: center;
            color: var(--text-primary);
            font-weight: 800;
        }
        .raw-json {
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            background: var(--bg-glass-light);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 10px;
            border: var(--silver-border);
            font: 0.72rem/1.5 monospace;
            max-height: 300px;
            overflow: auto;
        }

        /* ============================================================
           Responsive
           ============================================================ */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 12px; }
            .stat-card { padding: 12px 10px; }
            .stat-value { font-size: 1.15rem; }
            .stat-icon { width: 38px; height: 38px; font-size: 1rem; }
            .bottom-nav .nav-item i { font-size: 18px; }
            .bottom-nav .nav-item span { font-size: 0.68rem; }
            .sidebar { width: 100px; padding: 10px 8px; }
            .sidebar-btn { min-height: 66px; font-size: 0.8rem; }
            .sidebar-btn i { font-size: 1.3rem; }
            .fab { width: 48px; height: 48px; font-size: 1.2rem; bottom: 80px; left: 16px; }
            .filter-chip { font-size: 0.72rem; padding: 6px 12px; }
            .top-title h2 { font-size: 1.1rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .report-modal { padding: 16px; }
            .report-results { max-height: 260px; }
        }
        @media (max-width: 480px) {
            .stats-grid { gap: 8px; padding: 10px; }
            .stat-card { padding: 10px; }
            .stat-value { font-size: 1rem; }
            .stat-icon { width: 34px; height: 34px; font-size: 0.9rem; }
            .card-actions { flex-wrap: wrap; }
            .bottom-nav .nav-item { padding: 4px 4px; min-width: 70px; }
            .bottom-nav .nav-item i { font-size: 16px; }
            .bottom-nav .nav-item span { font-size: 0.62rem; }
            .modal { padding: 16px; }
            .top-bar { padding: 12px 14px 10px; }
        }

        @media print {
            .top-bar, .bottom-nav, .sidebar-toggle, .sidebar, .fab, .offline-banner,
            .action-row, .icon-btn, .report-actions { display: none !important; }
            body { background: #fff; color: #111; padding: 0; }
            .data-panel, .data-card, .stat-card {
                box-shadow: none;
                color: #111;
                border: 1px solid #aaa;
            }
        }
    </style>
</head>
<body>
    <div class="offline-banner" id="offlineBanner"><i class="fas fa-triangle-exclamation"></i> Android Bridge غير متاح؛ لن تُحفظ أو تُعرض بيانات تجارية بديلة</div>
    <div class="loading-indicator" id="loadingIndicator"><div class="spinner"></div></div>
    <header class="top-bar">
        <div class="header-top">
            <div class="top-title"><h2><i class="fas fa-fill-drip"></i> تعبئة الخزانات</h2></div>
            <div class="header-actions">
                <button type="button" class="icon-btn" id="themeToggle" title="تبديل الوضع"><i class="fas fa-moon" id="themeIcon"></i></button>
                <button type="button" class="icon-btn" onclick="goHome()" title="الرئيسية"><i class="fas fa-home"></i></button>
            </div>
        </div>
        <div class="search-wrap"><i class="fas fa-search"></i><input class="search-input" id="searchInput" type="search" placeholder="ابحث في سجلات التعبئة..." autocomplete="off"></div>
        <div class="filter-chips" id="filterChips" aria-label="الفلاتر"></div>
    </header>
    <main class="page-container">
        <section class="stats-grid" id="statsGrid">
            <article class="stat-card"><div class="stat-icon blue"><i class="fas fa-fill-drip"></i></div><div class="stat-value" id="statCount">—</div><div class="stat-label">عدد السجلات المعروضة</div></article>
            <article class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="statActive">—</div><div class="stat-label">مستوى طبيعي</div></article>
            <article class="stat-card"><div class="stat-icon orange"><i class="fas fa-oil-can"></i></div><div class="stat-value" id="statTotal">—</div><div class="stat-label">إجمالي الكميات المقاسة</div></article>
            <article class="stat-card"><div class="stat-icon purple"><i class="fas fa-clock"></i></div><div class="stat-value" id="statUpdated">—</div><div class="stat-label">آخر تحديث</div></article>
        </section>
        <section class="data-panel">
            <div class="section-title"><h3><i class="fas fa-fill-drip"></i> تعبئة الخزانات</h3><span class="count-badge" id="itemCount">0</span></div>
            <div class="cards-container" id="cardsContainer"></div>
        </section>
    </main>
    <button type="button" class="fab" id="fab" title="إضافة تعبئة"><i class="fas fa-plus"></i></button>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>
    <aside class="sidebar" id="sidebar"><div class="sidebar-content">
        <button type="button" class="sidebar-btn" data-sidebar-action="reload"><i class="fas fa-sync-alt"></i><span>تحديث</span></button>
        <button type="button" class="sidebar-btn" data-sidebar-action="report"><i class="fas fa-file-alt"></i><span>تقارير</span></button>
        <button type="button" class="sidebar-btn" data-sidebar-action="export"><i class="fas fa-file-export"></i><span>تصدير</span></button>
        <button type="button" class="sidebar-btn" data-sidebar-action="print"><i class="fas fa-print"></i><span>طباعة</span></button>
        <button type="button" class="sidebar-btn" data-sidebar-action="home"><i class="fas fa-home"></i><span>رجوع</span></button>
    </div></aside>
    <nav class="bottom-nav" id="bottomNav" aria-label="تصفية السجلات"></nav>
    <div class="modal-overlay" id="formModal" onclick="closeModal(event,'formModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">إضافة تعبئة جديدة</h3><button type="button" class="modal-close" onclick="closeModal(null,'formModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><form id="recordForm" class="form-grid"></form></div>
        <div class="modal-footer"><button type="button" class="btn primary" id="saveBtn"><i class="fas fa-save"></i> حفظ</button><button type="button" class="btn" onclick="closeModal(null,'formModal')">إلغاء</button></div>
    </div></div>
    <div class="modal-overlay" id="detailsModal" onclick="closeModal(event,'detailsModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تفاصيل السجل</h3><button type="button" class="modal-close" onclick="closeModal(null,'detailsModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body" id="detailsBody"></div>
    </div></div>
    <div class="modal-overlay" id="reportModal" onclick="closeModal(event,'reportModal')"><div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header"><h3 class="modal-title">تقرير تعبئة الخزانات</h3><button type="button" class="modal-close" onclick="closeModal(null,'reportModal')"><i class="fas fa-times"></i></button></div>
        <div class="modal-body">
            <div class="report-filter-row">
                <div class="form-group"><label class="form-label">من تاريخ</label><input class="form-input" type="date" id="reportFrom"></div>
                <div class="form-group"><label class="form-label">إلى تاريخ</label><input class="form-input" type="date" id="reportTo"></div>
            </div>
            <div class="report-filter-row">
                <div class="form-group"><label class="form-label">الخزان</label><select class="form-input" id="reportTankFilter"><option value="">كل الخزانات</option></select></div>
                <div class="form-group"><label class="form-label">نوع القراءة</label><select class="form-input" id="reportTypeFilter">
                    <option value="">الكل</option>
                    <option value="manual">يدوية</option>
                    <option value="auto">آلية</option>
                    <option value="inspection">فحص</option>
                </select></div>
            </div>
            <div class="report-filter-row">
                <div class="form-group"><label class="form-label">حالة المستوى</label><select class="form-input" id="reportLevelFilter">
                    <option value="">الكل</option>
                    <option value="normal">طبيعي</option>
                    <option value="low">تحت الحد الأدنى</option>
                    <option value="high">قريب من الحد الأعلى</option>
                </select></div>
                <div class="form-group"><label class="form-label">التنبيهات</label><select class="form-input" id="reportAlertFilter">
                    <option value="">الكل</option>
                    <option value="triggered">مُفعَّل</option>
                    <option value="clear">لا يوجد تنبيه</option>
                </select></div>
            </div>
            <div class="report-filter-row">
                <div class="form-group"><label class="form-label">فرق القياس</label><select class="form-input" id="reportDiffFilter">
                    <option value="">الكل</option>
                    <option value="within">ضمن التسامح</option>
                    <option value="exceeds">يتجاوز التسامح</option>
                </select></div>
                <div class="form-group"><label class="form-label">نوع التقرير</label><select class="form-input" id="reportKindFilter">
                    <option value="detailed">تفصيلي</option>
                    <option value="summary">ملخص</option>
                    <option value="variance">تحليل الفروقات</option>
                    <option value="tank">حسب الخزان</option>
                </select></div>
            </div>
            <div class="report-actions">
                <button type="button" class="btn btn-primary" onclick="generateReport()"><i class="fas fa-cog"></i> توليد التقرير</button>
                <button type="button" class="btn" onclick="exportData()"><i class="fas fa-file-export"></i> Excel/CSV</button>
                <button type="button" class="btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة/PDF</button>
            </div>
            <div id="reportResults" style="margin-top:14px"></div>
        </div>
    </div></div>
    <div class="toast" id="toast"></div>
    <script>
    (() => {
        'use strict';
        const CFG = {
            "title": "تعبئة الخزانات",
            "icon": "fa-fill-drip",
            "module": "tanks",
            "listMethod": "getTankLevelRecords",
            "listArgs": ["{}"],
            "fields": [
                { "label": "الخزان", "key": "tank_id", "type": "number", "required": true, "placeholder": "" },
                { "label": "تاريخ القراءة", "key": "reading_date", "type": "date", "required": true, "placeholder": "" },
                { "label": "نوع القراءة", "key": "reading_type", "type": "select", "required": false, "placeholder": "" },
                { "label": "المستوى الافتتاحي", "key": "opening_level", "type": "number", "required": false, "placeholder": "" },
                { "label": "المستوى الختامي", "key": "closing_level", "type": "number", "required": false, "placeholder": "" },
                { "label": "المستوى المقاس", "key": "measured_level", "type": "number", "required": false, "placeholder": "" },
                { "label": "المستوى المحسوب", "key": "calculated_level", "type": "number", "required": false, "placeholder": "" },
                { "label": "الفرق", "key": "difference", "type": "number", "required": false, "placeholder": "" },
                { "label": "درجة حرارة الوقود", "key": "fuel_temperature", "type": "number", "required": false, "placeholder": "" },
                { "label": "كثافة الوقود", "key": "fuel_density", "type": "number", "required": false, "placeholder": "" },
                { "label": "الحجم عند 15°م", "key": "volume_at_15c", "type": "number", "required": false, "placeholder": "" },
                { "label": "إجمالي التعبئة", "key": "refills_total", "type": "number", "required": false, "placeholder": "" },
                { "label": "إجمالي المبيعات", "key": "sales_total", "type": "number", "required": false, "placeholder": "" },
                { "label": "فقد التبخر", "key": "evaporation_loss", "type": "number", "required": false, "placeholder": "" },
                { "label": "تحت الحد الأدنى", "key": "is_below_minimum", "type": "select", "required": false, "placeholder": "" },
                { "label": "قريب من الحد الأعلى", "key": "is_near_maximum", "type": "select", "required": false, "placeholder": "" },
                { "label": "تنبيه مُفعَّل", "key": "alert_triggered", "type": "select", "required": false, "placeholder": "" },
                { "label": "ملاحظات", "key": "remarks", "type": "textarea", "required": false, "placeholder": "" },
                { "label": "تفاصيل إضافية", "key": "extra_data", "type": "textarea", "required": false, "placeholder": "" }
            ],
            "valueFields": ["opening_level", "closing_level", "measured_level", "calculated_level"],
            "titleFields": ["tank_id", "reading_date"],
            "subtitleFields": ["tank_id", "reading_date", "reading_type", "opening_level", "closing_level", "measured_level", "difference"],
            "createMethod": "saveTankLevelRecord",
            "updateMethod": "updateTankLevelRecord",
            "deleteMethod": "deleteTankLevelRecord",
            "note": "",
            "mode": "list",
            "objectMode": false,
            "updateAction": null,
            "reportKind": "operational:TankLevel",
            "aiMethod": null,
            "reports": ["الكل", "طبيعي", "تحذير", "منخفض", "مرتفع"],
            "filterKeys": ["all", "normal", "alert", "low", "high"],
            "resolveMethod": null,
            "operationKey": "tank_level_log"
        };
        const bridge = window.AndroidInterface;
        const state = { rows: [], filtered: [], editing: null, filter: '0', loadedAt: null };
        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value == null ? '—' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const today = () => new Date().toISOString().slice(0,10);
        const numFmt = (v) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('ar',{maximumFractionDigits:2}) : '—'; };

        // ============================================================
        // أدوات مساعدة
        // ============================================================
        function toast(message, bad=false) {
            const node = $('toast');
            node.textContent = message;
            node.className = 'toast show';
            node.style.background = bad ? 'var(--danger)' : 'var(--toast-bg)';
            node.style.color = bad ? '#fff' : 'var(--text-primary)';
            clearTimeout(node._timer);
            node._timer = setTimeout(() => node.classList.remove('show'), 3500);
        }
        function setLoading(value) { $('loadingIndicator').classList.toggle('show', Boolean(value)); }
        function parse(raw) {
            if (raw == null) throw new Error('لم يرجع الجسر نتيجة');
            const value = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (value && value.success === false) throw new Error(value.error || value.message || 'فشلت العملية');
            return value;
        }
        function dataOf(value) { return value && Object.prototype.hasOwnProperty.call(value,'data') ? value.data : value; }
        function invoke(method, args = []) {
            if (!bridge || typeof bridge[method] !== 'function') return Promise.reject(new Error('العقد ' + method + ' غير متاح في Android Bridge'));
            try { return Promise.resolve(parse(bridge[method](...args))); }
            catch (error) { return Promise.reject(error); }
        }
        function argsForLoad() {
            if (CFG.operationKey) return [JSON.stringify({ limit: 500, search: $('searchInput').value || '' })];
            return CFG.listArgs || [];
        }
        function rowsFrom(value) {
            const raw = dataOf(value);
            if (Array.isArray(raw)) return raw;
            if (raw && Array.isArray(raw.rows)) return raw.rows;
            if (raw && Array.isArray(raw.data)) return raw.data;
            if (CFG.objectMode && raw && typeof raw === 'object') return Object.entries(raw).map(([key,val]) => ({key, value:val}));
            if (raw && typeof raw === 'object' && raw.id !== undefined) return [raw];
            return [];
        }
        function field(row, names) {
            for (const name of (names || [])) {
                if (row && row[name] !== undefined && row[name] !== null && row[name] !== '') return row[name];
            }
            return '';
        }
        function titleOf(row) {
            const tankId = field(row, ['tank_id']);
            const date = field(row, ['reading_date']);
            const code = field(row, ['reading_code','id']);
            return `خزان ${tankId || '—'} · ${date || code || '—'}`;
        }
        function subtitleOf(row) {
            const t = field(row, ['reading_type']);
            return `النوع: ${trReadingType(t)} · المستوى الختامي: ${numFmt(field(row,['closing_level']))}`;
        }
        function idOf(row) { return field(row,['id','_id','tank_level_log_id','tank_id','reading_id']); }
        function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function setDateDefaults() {
            $('reportFrom').value = $('reportFrom').value || today();
            $('reportTo').value = $('reportTo').value || today();
        }

        // ============================================================
        // ترجمة
        // ============================================================
        const AR = {
            tank_id: 'الخزان', reading_date: 'تاريخ القراءة', reading_type: 'نوع القراءة',
            opening_level: 'المستوى الافتتاحي', closing_level: 'المستوى الختامي',
            measured_level: 'المستوى المقاس', calculated_level: 'المستوى المحسوب',
            difference: 'الفرق', fuel_temperature: 'حرارة الوقود', fuel_density: 'كثافة الوقود',
            volume_at_15c: 'الحجم عند 15°م', refills_total: 'إجمالي التعبئة',
            sales_total: 'إجمالي المبيعات', evaporation_loss: 'فقد التبخر',
            is_below_minimum: 'تحت الحد الأدنى', is_near_maximum: 'قريب من الأعلى',
            alert_triggered: 'تنبيه مُفعَّل', remarks: 'ملاحظات', extra_data: 'تفاصيل إضافية',
            id: 'المعرّف',
            rt_manual: 'يدوية', rt_auto: 'آلية', rt_inspection: 'فحص',
            yes: 'نعم', no: 'لا'
        };
        function tr(key) { return AR[key] || key; }
        function trReadingType(v) {
            const s = String(v||'').toLowerCase();
            return AR['rt_' + s] || v || '—';
        }
        function isYes(v) {
            const s = String(v == null ? '' : v).trim().toLowerCase();
            return s === '1' || s === 'true' || s === 'yes' || s === 'نعم';
        }

        // ============================================================
        // التصفية بالتبويبات
        // ============================================================
        function renderFilters() {
            const labels = CFG.reports || ['الكل'];
            const icons = ['fa-list', 'fa-check-circle', 'fa-exclamation-triangle', 'fa-arrow-down', 'fa-arrow-up'];
            const chips = $('filterChips');
            chips.innerHTML = labels.map((label,i) => `
                <button type="button" class="filter-chip ${i===0?'active':''}" data-filter="${i}">
                    <i class="fas ${icons[i]||'fa-circle'}"></i>
                    <span>${esc(label)}</span>
                    <span class="chip-count" data-chip-count="${i}">0</span>
                </button>`).join('');
            chips.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
                chips.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                syncBottomNav();
                applyFilter();
            }));

            const nav = $('bottomNav');
            nav.innerHTML = labels.map((label,i) => `
                <button type="button" class="nav-item ${i===0?'active':''}" data-bottom-filter="${i}">
                    <i class="fas ${icons[i]||'fa-circle'}"></i>
                    <span>${esc(label)}</span>
                </button>`).join('');
            nav.querySelectorAll('[data-bottom-filter]').forEach(btn => btn.addEventListener('click', () => {
                nav.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.bottomFilter;
                syncTopChips();
                applyFilter();
            }));
        }
        function syncBottomNav() {
            const idx = state.filter;
            document.querySelectorAll('#bottomNav .nav-item').forEach(x => x.classList.remove('active'));
            const target = document.querySelector(`#bottomNav [data-bottom-filter="${idx}"]`);
            if (target) target.classList.add('active');
        }
        function syncTopChips() {
            const idx = state.filter;
            document.querySelectorAll('#filterChips .filter-chip').forEach(x => x.classList.remove('active'));
            const target = document.querySelector(`#filterChips [data-filter="${idx}"]`);
            if (target) target.classList.add('active');
        }
        function filterMatch(row, key) {
            if (!key || key === 'all') return true;
            const below = isYes(field(row, ['is_below_minimum']));
            const near = isYes(field(row, ['is_near_maximum']));
            const alert = isYes(field(row, ['alert_triggered']));
            switch (key) {
                case 'normal': return !below && !near && !alert;
                case 'alert': return alert;
                case 'low': return below;
                case 'high': return near;
                default: return true;
            }
        }
        function applyFilter() {
            const q = ($('searchInput').value || '').trim().toLowerCase();
            const keys = CFG.filterKeys || ['all'];
            const idx = parseInt(state.filter, 10);
            const filterKey = keys[isNaN(idx) ? 0 : idx] || 'all';

            state.filtered = state.rows.filter(row => {
                if (q) {
                    const text = JSON.stringify(row || {}).toLowerCase();
                    if (!text.includes(q)) return false;
                }
                return filterMatch(row, filterKey);
            });
            updateChipCounts();
            renderCards();
        }
        function updateChipCounts() {
            const keys = CFG.filterKeys || ['all'];
            const counts = keys.map(k => state.rows.filter(r => filterMatch(r, k)).length);
            counts.forEach((c, i) => {
                const el = document.querySelector(`[data-chip-count="${i}"]`);
                if (el) el.textContent = c.toLocaleString('ar');
            });
        }

        // ============================================================
        // الإحصائيات
        // ============================================================
        function renderStats() {
            const rows = state.filtered;
            $('statCount').textContent = rows.length.toLocaleString('ar');
            $('itemCount').textContent = rows.length.toLocaleString('ar');
            const normal = rows.filter(r => filterMatch(r, 'normal')).length;
            $('statActive').textContent = normal.toLocaleString('ar');
            const total = rows.reduce((sum, r) => sum + numeric(field(r, ['closing_level'])), 0);
            $('statTotal').textContent = total ? numFmt(total) : '—';
            $('statUpdated').textContent = state.loadedAt
                ? state.loadedAt.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
                : '—';
        }

        // ============================================================
        // شارات الحالة
        // ============================================================
        function levelBadge(row) {
            const below = isYes(field(row, ['is_below_minimum']));
            const near = isYes(field(row, ['is_near_maximum']));
            const alert = isYes(field(row, ['alert_triggered']));
            if (alert) return `<span class="data-card-badge danger"><i class="fas fa-bell"></i> تنبيه</span>`;
            if (below) return `<span class="data-card-badge danger"><i class="fas fa-arrow-down"></i> منخفض</span>`;
            if (near) return `<span class="data-card-badge warn"><i class="fas fa-arrow-up"></i> مرتفع</span>`;
            return `<span class="data-card-badge ok"><i class="fas fa-check"></i> طبيعي</span>`;
        }

        // ============================================================
        // البطاقات
        // ============================================================
        function renderCards() {
            renderStats();
            const box = $('cardsContainer');
            if (!state.filtered.length) {
                box.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>${CFG.mode==='unsupported'?'لا توجد عملية مدعومة لهذا المسار في العقد الحالي.':'لا توجد نتائج مطابقة أو لم تُرجع قاعدة البيانات سجلات.'}</p></div>`;
                return;
            }
            box.innerHTML = state.filtered.map((row, index) => {
                const id = esc(idOf(row) || index);
                const displayFields = ['reading_type','opening_level','closing_level','measured_level','difference','refills_total','sales_total']
                    .filter(k => row && row[k] !== undefined && row[k] !== null && row[k] !== '');
                const buttons = `
                    <div class="action-row">
                        <button class="btn" type="button" data-view="${id}"><i class="fas fa-eye"></i> عرض</button>
                        ${CFG.updateMethod ? `<button class="btn warning" type="button" data-edit="${id}"><i class="fas fa-edit"></i> تعديل</button>` : ''}
                        ${CFG.deleteMethod ? `<button class="btn danger" type="button" data-delete="${id}"><i class="fas fa-trash"></i> حذف</button>` : ''}
                    </div>`;
                return `<article class="data-card">
                    <div class="data-card-head">
                        <div style="flex:1">
                            <div class="data-card-title">${esc(titleOf(row))}</div>
                            <div class="data-card-subtitle">${esc(subtitleOf(row))}</div>
                        </div>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
                            ${levelBadge(row)}
                        </div>
                    </div>
                    <div class="data-fields">
                        ${displayFields.map(k => {
                            let v = row[k];
                            if (k === 'reading_type') v = trReadingType(v);
                            else if (['opening_level','closing_level','measured_level','difference','refills_total','sales_total'].includes(k)) v = numFmt(v);
                            return `<div class="data-field"><span>${esc(tr(k))}</span><strong>${esc(v)}</strong></div>`;
                        }).join('')}
                    </div>
                    ${buttons}
                </article>`;
            }).join('');
            box.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openDetails(b.dataset.view)));
            box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openForm(findRow(b.dataset.edit))));
            box.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteRow(findRow(b.dataset.delete))));
        }

        function findRow(id) { return state.rows.find((row, index) => String(idOf(row) || index) === String(id)); }

        // ============================================================
        // التفاصيل
        // ============================================================
        function openDetails(id) {
            const row = findRow(id);
            if (!row) return;
            $('detailsBody').innerHTML = `
                <div class="detail-grid">
                    ${Object.entries(row).map(([k, v]) => {
                        let val = (typeof v === 'object') ? JSON.stringify(v) : v;
                        if (k === 'reading_type') val = trReadingType(val);
                        else if (k === 'is_below_minimum' || k === 'is_near_maximum' || k === 'alert_triggered') val = isYes(val) ? 'نعم' : 'لا';
                        return `<div class="detail-item"><span>${esc(tr(k))}</span><strong>${esc(val)}</strong></div>`;
                    }).join('')}
                </div>
                <details style="margin-top:14px"><summary style="text-align:center;cursor:pointer;color:var(--text-muted)">JSON الخام</summary><pre class="raw-json">${esc(JSON.stringify(row, null, 2))}</pre></details>`;
            openModal(null, 'detailsModal');
        }

        // ============================================================
        // النموذج
        // ============================================================
        const FULL_WIDTH_KEYS = ['remarks', 'extra_data', 'notes'];
        const HIDDEN_KEYS = [];

        function inputHtml(def, row) {
            const value = row && row[def.key] !== undefined ? row[def.key] : '';
            const req = def.required ? 'required' : '';
            const placeholder = def.placeholder ? `placeholder="${esc(def.placeholder)}"` : '';
            const isFull = def.type === 'textarea' || FULL_WIDTH_KEYS.includes(def.key);
            const isHidden = HIDDEN_KEYS.includes(def.key);
            const groupClass = `form-group${isFull ? ' full' : ''}${isHidden ? ' hidden-field' : ''}`;

            if (def.type === 'textarea') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <textarea class="form-input" data-key="${esc(def.key)}" rows="3" ${req} ${placeholder}>${esc(value)}</textarea></div>`;
            }

            // ===== الخزان: dropdown من قاعدة البيانات =====
            if (def.key === 'tank_id') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" data-needs-options="true" ${req}>
                        <option value="">جاري التحميل...</option>
                    </select>
                    <span class="form-hint" data-hint="tank_id"></span></div>`;
            }

            // ===== نوع القراءة =====
            if (def.key === 'reading_type') {
                const v = String(value || '').toLowerCase();
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}</label>
                    <select class="form-input" data-key="${esc(def.key)}">
                        <option value="">اختر...</option>
                        <option value="manual" ${v==='manual'?'selected':''}>يدوية</option>
                        <option value="auto" ${v==='auto'?'selected':''}>آلية</option>
                        <option value="inspection" ${v==='inspection'?'selected':''}>فحص</option>
                    </select></div>`;
            }

            // ===== أعلام نعم/لا =====
            if (['is_below_minimum','is_near_maximum','alert_triggered'].includes(def.key)) {
                const yes = isYes(value);
                const hasVal = (value === 0 || value === 1 || value === '0' || value === '1' || value === '' || value == null) ? '' : 'has';
                const isYesSel = yes || value === 1 || value === '1';
                const isNoSel = (!yes && (value === 0 || value === '0')) ? true : false;
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}</label>
                    <select class="form-input" data-key="${esc(def.key)}">
                        <option value="">اختر...</option>
                        <option value="1" ${isYesSel?'selected':''}>نعم</option>
                        <option value="0" ${isNoSel?'selected':''}>لا</option>
                    </select></div>`;
            }

            if (def.type === 'select') {
                return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                    <select class="form-input" data-key="${esc(def.key)}" ${req}>
                        <option value="">اختر...</option>
                    </select></div>`;
            }

            return `<div class="${groupClass}"><label class="form-label">${esc(def.label)}${def.required?' *':''}</label>
                <input class="form-input" data-key="${esc(def.key)}" type="${esc(def.type)}" value="${esc(value)}" ${req} ${placeholder}></div>`;
        }

        // ============================================================
        // جلب قائمة الخزانات من قاعدة البيانات
        // ============================================================
        async function fetchTanks() {
            try {
                // getTankRecords يعيد سجلات الخزانات من جدول tanks
                const result = await invoke('getTankRecords', [JSON.stringify({ limit: 500 })]);
                return rowsFrom(result);
            } catch (e) {
                console.warn('fetchTanks failed', e);
                return [];
            }
        }

        async function populateFormSelects(row) {
            try {
                const tanks = await fetchTanks();
                const el = document.querySelector('#recordForm [data-key="tank_id"]');
                if (el) {
                    el.innerHTML = '<option value="">اختر الخزان...</option>' +
                        tanks.map(t => {
                            const tid = t.id || t.tank_id;
                            const label = `${t.tank_code || ''} - ${t.tank_name_ar || t.tank_name || ''}`.trim();
                            return `<option value="${esc(tid)}">${esc(label || ('خزان ' + tid))}</option>`;
                        }).join('');
                    if (row && row.tank_id) el.value = String(row.tank_id);
                    else if (tanks[0]) el.value = String(tanks[0].id || tanks[0].tank_id);
                    const hint = document.querySelector('#recordForm [data-hint="tank_id"]');
                    if (hint) hint.textContent = tanks.length ? `${tanks.length} خزان متاح` : 'لا توجد خزانات متاحة';
                }
            } catch (e) { console.warn(e); }

            // بقية الحقول select إن وُجدت
            if (row) {
                (CFG.fields || []).forEach(def => {
                    if (def.type === 'select') {
                        const el = document.querySelector(`[data-key="${CSS.escape(def.key)}"]`);
                        if (el && row[def.key] !== undefined && row[def.key] !== null) {
                            const v = String(row[def.key]);
                            el.value = v === 'true' ? '1' : v === 'false' ? '0' : v;
                        }
                    }
                });
            }
        }

        // ============================================================
        // ربط سلوكيات الحقول
        // ============================================================
        function bindFormFieldBehaviors() {
            document.querySelectorAll('#recordForm .form-input').forEach(el => {
                el.addEventListener('focus', () => {
                    if (el.tagName === 'INPUT' && (el.type === 'number' || el.type === 'text')) {
                        setTimeout(() => { try { el.select(); } catch(_) {} }, 30);
                    }
                });
            });

            // حساب difference و volume تلقائياً
            const openingEl = document.querySelector('#recordForm [data-key="opening_level"]');
            const closingEl = document.querySelector('#recordForm [data-key="closing_level"]');
            const measuredEl = document.querySelector('#recordForm [data-key="measured_level"]');
            const diffEl = document.querySelector('#recordForm [data-key="difference"]');
            const refillsEl = document.querySelector('#recordForm [data-key="refills_total"]');
            const salesEl = document.querySelector('#recordForm [data-key="sales_total"]');

            function recompute() {
                // الفرق = closing - opening (إن كانا متاحين)
                if (openingEl && closingEl && diffEl) {
                    const o = Number(openingEl.value);
                    const c = Number(closingEl.value);
                    if (Number.isFinite(o) && Number.isFinite(c) && (openingEl.value !== '' || closingEl.value !== '')) {
                        diffEl.value = (c - o).toFixed(2).replace(/\.00$/, '');
                    }
                }
                // إجمالي المبيعات = opening + refills - closing (تقديري إن كانا متاحين)
                if (openingEl && closingEl && refillsEl && salesEl) {
                    const o = Number(openingEl.value);
                    const c = Number(closingEl.value);
                    const r = Number(refillsEl.value);
                    if (Number.isFinite(o) && Number.isFinite(c) && Number.isFinite(r) && refillsEl.value !== '') {
                        const s = Math.max(0, o + r - c);
                        if (s > 0 || salesEl.value === '') salesEl.value = s.toFixed(2).replace(/\.00$/, '');
                    }
                }
            }
            [openingEl, closingEl, measuredEl, refillsEl, salesEl].forEach(el => {
                if (el) el.addEventListener('input', recompute);
            });
        }

        // ============================================================
        // فتح النموذج
        // ============================================================
        async function openForm(row = null) {
            if (!CFG.createMethod && !CFG.updateMethod) {
                toast('لا توجد عملية كتابة مدعومة لهذه الشاشة', true);
                return;
            }
            state.editing = row;
            $('formTitle').textContent = row ? 'تعديل سجل التعبئة' : 'إضافة تعبئة جديدة';
            $('recordForm').innerHTML = (CFG.fields || []).map(def => inputHtml(def, row)).join('');

            // تعبئة قوائم القيم من قاعدة البيانات
            await populateFormSelects(row);

            // ربط السلوكيات
            bindFormFieldBehaviors();
