<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع مصدر التقرير</title><script src="report-source-trace.js"></script></head><body><main style="padding:16px;font-family:Arial"><h2>تتبع مصدر التقرير</h2><div id="status">جاري التحقق...</div><div id="origin"></div><button id="open" disabled>فتح المستند التشغيلي</button></main><script>(function(){const q=new URLSearchParams(location.search);const scope={from_date:q.get('from_date')||'',to_date:q.get('to_date')||''};const input={source_table:q.get('source_table')||'',source_id:Number(q.get('source_id')||0),reference_code:q.get('reference_code')||'',station_id:Number(q.get('station_id')||0),date_scope:scope,document_type:q.get('document_type')||''};const status=document.getElementById('status');try{const c=SourceTraceContract.build(input);status.textContent='العقد جاهز للتحقق من SQLite والمحطة والفترة.';document.getElementById('open').disabled=false;document.getElementById('open').onclick=()=>SourceTraceContract.open(c);document.getElementById('origin').textContent=JSON.stringify(c,null,2)}catch(e){status.textContent=e.message||String(e)}})();</script></body></html>
