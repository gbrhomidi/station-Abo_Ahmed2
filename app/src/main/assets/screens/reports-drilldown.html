<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع المصدر التشغيلي</title><style>body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f5f7fa;color:#172033}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px}.btn{padding:10px 14px;border:0;border-radius:10px;background:#087ea4;color:#fff;font-weight:700}.muted{color:#667085}.row{padding:9px 0;border-bottom:1px solid #eee;word-break:break-word}</style></head><body><main class="card"><h2>تتبع المستند التشغيلي</h2><div id="status" class="muted">جاري التحقق...</div><div id="data"></div><button id="open" class="btn" disabled>فتح المستند التشغيلي</button> <button class="btn" onclick="history.back()">رجوع</button></main><script>(function(){const q=new URLSearchParams(location.search);let payload={source_table:q.get('source_table')||'',source_id:Number(q.get('source_id')||q.get('record_id')||0),reference_code:q.get('reference_code')||'',from_date:q.get('from_date')||'',to_date:q.get('to_date')||''};try{const s=sessionStorage.getItem('reportsSourceDrilldown');if(s){const x=JSON.parse(s);payload=Object.assign(payload,x);payload.source_table=x.source_table||payload.source_table;payload.source_id=Number(x.source_id||x.record_id||payload.source_id);}}catch(e){}const status=document.getElementById('status'),data=document.getElementById('data'),open=document.getElementById('open');function call(){if(!window.AndroidInterface||typeof AndroidInterface.openReportOperationalDocument!=='function'){status.textContent='جسر المستندات التشغيلية غير متاح.';return}try{const r=JSON.parse(AndroidInterface.openReportOperationalDocument(JSON.stringify(payload)));if(!r.success)throw Error(r.message||r.error||'فشل التحقق');status.textContent='تم التحقق من المحطة والفترة والمصدر.';const p=r.params||{};data.innerHTML=Object.keys(p).map(k=>'<div class="row"><b>'+k+'</b>: '+String(p[k]??'')+'</div>').join('');open.disabled=false;open.onclick=()=>{const qs=Object.keys(p).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(p[k]??'')).join('&');location.href=r.screen+'?'+qs};}catch(e){status.textContent=e.message||String(e);open.disabled=true}}call()})();</script></body></html>
