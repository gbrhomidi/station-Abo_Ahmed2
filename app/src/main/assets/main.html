                }
                let progressHtml = '';
                if (def.progress !== undefined) {
                    progressHtml =
                        `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,def.progress)}%"></div></div>`;
                }
                let trendHtml = '';
                if (def.trend) {
                    const up = def.trendUp !== false;
                    trendHtml =
                        `<div class="stat-trend trend-${up ? 'up' : 'down'}"><i class="fas fa-arrow-${up ? 'up' : 'down'}"></i> ${def.trend}</div>`;
                }
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${def.header}</h3>
                        <div class="card-icon-wrapper"><i class="fas ${def.icon}"></i></div>
                    </div>
                    <div class="stat-value">${def.value}</div>
                    <div class="stat-footer">
                        ${trendHtml}
                        <span class="stat-label">${def.label}</span>
                    </div>
                    ${badgeHtml}
                    ${progressHtml}
                `;
                grid.appendChild(card);
            });

            initCardDoubleClick();

            document.getElementById('last-update').textContent = new Date().toLocaleString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric'
            });
        }

        function readDashboardCache() {
            try {
                const cached = localStorage.getItem('dashboardCache');
                if (!cached) return null;
                const parsed = JSON.parse(cached);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (e) { return null; }
        }

        async function loadDashboard(forceRefresh = false) {
            if (isRefreshing) return;
            isRefreshing = true;

            renderSkeletons();

            try {
                const result = await apiCall('getDashboardStats');
                if (!result.success || !result.data) {
                    throw new Error(result.error || 'فشل تحميل الإحصائيات');
                }
                const stats = result.data;
                dashboardCache = stats;
                try { localStorage.setItem('dashboardCache', JSON.stringify(stats)); } catch (e) {}
                updateStatsCards(stats);
                if (stats.notifications) showRealNotifications(stats);
            } catch (e) {
                console.error('Dashboard error:', e);
                document.getElementById('reportsDataSource')?.setAttribute('data-state', 'error');
                showToast(e.message || 'تعذر تحميل بيانات SQLite؛ لم يتم عرض بديل', 'error');
            } finally {
                isRefreshing = false;
            }
        }

        function manualRefresh() {
            showToast('جاري تحديث البيانات...', 'info');
            loadDashboard(true);
        }

        // ================================================================
        // الإشعارات
        // ================================================================
        function showRealNotifications(stats) {
            if (stats.expiry_soon > 0) {
                addNotificationToQueue({ title: 'تنبيه انتهاء الصلاحية', message: `هناك ${stats.expiry_soon} منتج ستنتهي صلاحيته خلال 30 يومًا`,
                    icon: 'fa-hourglass-half', type: 'warning', targetCard: 'card-expiry-soon' });
            }
            if (stats.low_stock > 0) {
                addNotificationToQueue({ title: 'تنبيه انخفاض المخزون', message: `هناك ${stats.low_stock} منتج تحت الحد الأدنى`,
                    icon: 'fa-exclamation-circle', type: 'danger', targetCard: 'card-low-stock' });
            }
            if (stats.pending_tasks > 0) {
                addNotificationToQueue({ title: 'مهام معلقة', message: `لديك ${stats.pending_tasks} مهمة تحتاج إلى مراجعتك`,
                    icon: 'fa-tasks', type: 'info', targetCard: 'card-pending-tasks' });
            }
            processNotificationQueue();
        }

        function addNotificationToQueue(notification) { notificationQueue.push(notification); }

        function processNotificationQueue() {
            if (isProcessingQueue || notificationQueue.length === 0) return;
            isProcessingQueue = true;
            const notification = notificationQueue.shift();
            createNotificationBubble(notification);
            setTimeout(() => { isProcessingQueue = false;
                processNotificationQueue(); }, 1500);
        }

        function createNotificationBubble(notification) {
            const container = document.getElementById('bubbleContainer') || createBubbleContainer();
            const bubble = document.createElement('div');
            bubble.className = `notification-bubble bubble-${notification.type}`;
            bubble.innerHTML = `<i class="fas ${notification.icon}"></i>`;
            bubble.dataset.target = notification.targetCard;
            const wave = document.createElement('div');
            wave.className = 'bubble-wave';
            bubble.appendChild(wave);
            container.appendChild(bubble);
            const interval = setInterval(() => {
                wave.style.animation = 'none';
                setTimeout(() => { wave.style.animation = 'wave 15s infinite'; }, 10);
            }, 60000);
            bubble.onclick = function() {
                const card = document.getElementById(this.dataset.target);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth' });
                    card.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.8)';
                    setTimeout(() => { card.style.boxShadow = ''; }, 2000);
                    this.style.opacity = '0';
                    this.style.transform = 'scale(0)';
                    setTimeout(() => { if (this.parentNode) { clearInterval(interval);
                            this.parentNode.removeChild(this); } }, 500);
                }
            };
            activeBubbles.push({ element: bubble, interval: interval });
        }

        function createBubbleContainer() {
            const c = document.createElement('div');
            c.id = 'bubbleContainer';
            c.className = 'bubble-container';
            document.body.appendChild(c);
            return c;
        }

        function hideAllBubbles() {
            activeBubbles.forEach(b => { clearInterval(b.interval);
                b.element.remove(); });
            activeBubbles = [];
            notificationQueue = [];
        }

        // ================================================================
        // النقر المزدوج على البطاقات
        // ================================================================
        function initCardDoubleClick() {
            const routes = {
                'card-total-products': 'screens/products.html',
                'card-daily-sales': 'screens/sales-reports.html',
                'card-active-customers': 'screens/customers.html',
                'card-expiry-soon': 'screens/expiry-soon.html',
                'card-low-stock': 'screens/stock-levels.html',
                'card-due-invoices': 'screens/customer-debts.html',
                'card-returned-products': 'screens/returned-products.html',
                'card-damaged-products': 'screens/damaged-products.html',
                'card-customer-debts': 'screens/customer-debts.html',
                'card-supplier-debts': 'screens/suppliers.html',
                'card-inventory-value': 'screens/inventory-reports.html',
                'card-pending-tasks': 'screens/tasks.html',
                'card-occupancy': 'screens/tanks.html'
            };
            Object.entries(routes).forEach(([id, route]) => {
                const card = document.getElementById(id);
                if (!card || card.dataset.bound) return;
                card.dataset.bound = 'true';
                card.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    navigateTo(route);
                });
            });
        }

        // ================================================================
        // Pull-to-Refresh
        // ================================================================
        function initPullToRefresh() {
            let startY = 0,
                moveY = 0,
                pulling = false;
            document.addEventListener('touchstart', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                startY = e.touches[0].clientY;
                pulling = false;
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                moveY = e.touches[0].clientY - startY;
                if (moveY > 0 && window.scrollY === 0) pulling = true;
            }, { passive: true });
            document.addEventListener('touchend', function() {
                if (pulling && moveY > 70) manualRefresh();
                moveY = 0;
                pulling = false;
            }, { passive: true });
        }

        // ================================================================
        // تهيئة التطبيق
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            await loadMenuData();

            // Command Palette events
            const cmdInput = document.getElementById('commandPaletteInput');
            cmdInput.addEventListener('input', function(e) {
                renderCommandPaletteResults(e.target.value.trim());
            });
            cmdInput.addEventListener('keydown', function(e) {
                const results = document.querySelectorAll('.palette-results .result-item');
                let active = -1;
                results.forEach((el, i) => { if (el.classList.contains('active')) active = i; });
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    let next = active + 1;
                    if (next >= results.length) next = 0;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[next]) results[next].classList.add('active');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    let prev = active - 1;
                    if (prev < 0) prev = results.length - 1;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[prev]) results[prev].classList.add('active');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeEl = document.querySelector('.palette-results .result-item.active');
                    if (activeEl) activeEl.click();
                } else if (e.key === 'Escape') {
                    closeCommandPalette();
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    const overlay = document.getElementById('commandPaletteOverlay');
                    if (overlay.classList.contains('show')) closeCommandPalette();
                    else openCommandPalette();
                }
            });

            document.addEventListener('click', handlePanelOutsideClick);

            const bridgeReady = initAndroidBridge();
            initPullToRefresh();

            if (!bridgeReady) {
                setTimeout(() => { if (!useAndroidInterface) initAndroidBridge(); }, 2000);
                return;
            }

            const userLoaded = await loadUserFromKotlin();
            if (!userLoaded) return;

            initCardDoubleClick();

            refreshInterval = setInterval(() => { loadDashboard(true); }, 180000);

            updateThemeButton(document.documentElement.getAttribute('data-theme') === 'dark');

            let lastClick = 0;
            document.addEventListener('click', function(e) {
                const now = Date.now();
                if (now - lastClick < 300) hideAllBubbles();
                lastClick = now;
            });

            if (currentUser) updateUserInfo(currentUser);

            // تحديث البطاقات عند فتح الصفحة
            window.addEventListener('pageshow', function(e) {
                if (e.persisted) {
                    loadDashboard(true);
                }
            });
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    loadDashboard(true);
                }
            });

            setTimeout(adjustMainContentMargin, 300);
            window.addEventListener('resize', adjustMainContentMargin);
        });

        function handlePanelOutsideClick(event) {
            const target = event.target;
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.menu-toggle');
            const searchInput = document.getElementById('sidebarSearch');
            const pinBtn = document.getElementById('pinBtn');
            const closeBtn = document.querySelector('.sidebar-close');
            const compactBtn = document.getElementById('compactBtn');
            const cmdPalette = document.querySelector('.command-palette-box');

            if (sidebar && !sidebar.contains(target) && !menuToggle.contains(target) &&
                !searchInput.contains(target) && !pinBtn.contains(target) && !closeBtn.contains(target) &&
                !compactBtn.contains(target) && !cmdPalette.contains(target)) {
                if (sidebar.classList.contains('open')) closeSidebar();
            }
        }
    </script>
    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
