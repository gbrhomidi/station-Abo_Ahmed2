        async function loadMenuData() {
            try {
                const response = await fetch('file:///android_asset/assets-local/menu.json');
                if (response.ok) {
                    const data = await response.json();
                    sidebarNavData = data.menu || fallbackSidebarData;
                    subPageRouteMap = data.routes || fallbackRouteMap;
                } else {
                    sidebarNavData = fallbackSidebarData;
                    subPageRouteMap = fallbackRouteMap;
                }
            } catch (e) {
                console.warn('Failed to load menu.json, using fallback', e);
                sidebarNavData = fallbackSidebarData;
                subPageRouteMap = fallbackRouteMap;
            }
        }

        function getSidebarData() {
            if (!currentUser) return [];
            return sidebarNavData.map(item => ({
                ...item,
                children: Array.isArray(item.children) ? item.children : []
            }));
        }

        // ================================================================
        // المفضلة والمستخدمة مؤخراً
        // ================================================================
        function addToRecent(label) {
            recent = recent.filter(item => item !== label);
            recent.unshift(label);
            if (recent.length > 10) recent.pop();
            localStorage.setItem('recent', JSON.stringify(recent));
        }

        function toggleFavorite(label) {
            if (favorites.includes(label)) {
                favorites = favorites.filter(item => item !== label);
            } else {
                favorites.push(label);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderSidebar();
        }

        function isFavorite(label) { return favorites.includes(label); }

        // ================================================================
        // بناء القائمة الجانبية
        // ================================================================
        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';

            const sidebarData = getSidebarData();
            if (sidebarData.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'sidebar-empty-state';
                empty.textContent = currentUser ? 'لا توجد شاشات متاحة' : 'تعذر تحميل جلسة المستخدم';
                nav.appendChild(empty);
                return;
            }

            if (favorites.length > 0) {
                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerHTML = '<i class="fas fa-star" style="color: var(--gold);"></i> المفضلة';
                nav.appendChild(title);
                favorites.forEach(label => {
                    const item = sidebarData.find(p => p.label === label);
                    if (item) {
                        const btn = createNavItem(item, true);
                        nav.appendChild(btn);
                    }
                });
            }

            if (recent.length > 0) {
                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerHTML = '<i class="fas fa-clock" style="color: var(--muted);"></i> المستخدمة مؤخراً';
                nav.appendChild(title);
                recent.slice(0, 5).forEach(label => {
                    const item = sidebarData.find(p => p.label === label);
                    if (item) {
                        const btn = createNavItem(item, false);
                        nav.appendChild(btn);
                    }
                });
            }

            const allTitle = document.createElement('div');
            allTitle.className = 'sidebar-section-title';
            allTitle.innerHTML = '<i class="fas fa-list"></i> جميع الشاشات';
            nav.appendChild(allTitle);

            sidebarData.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'nav-item-parent';

                const btn = document.createElement('button');
                btn.className = 'nav-item';
                btn.dataset.label = item.label;
                const hasChildren = item.children && item.children.length > 0;
                btn.innerHTML = `
                    <span class="nav-icon"><i class="fas ${item.icon}"></i></span>
                    <span class="nav-label">${item.label}</span>
                    ${hasChildren ? `<span class="nav-arrow"><i class="fas fa-chevron-down"></i></span>` : ''}
                    <span style="margin-right:auto;font-size:12px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${item.label}');" title="${isFavorite(item.label) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                        <i class="fas ${isFavorite(item.label) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(item.label) ? 'var(--gold)' : 'rgba(26,19,5,.5)'};"></i>
                    </span>
                `;

                if (hasChildren) {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const childContainer = this.parentElement.querySelector('.nav-children');
                        const arrow = this.querySelector('.nav-arrow');
                        if (childContainer) {
                            childContainer.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    };
                } else {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const route = subPageRouteMap[item.label] || '/';
                        addToRecent(item.label);
                        navigateTo(route);
                    };
                }
                wrapper.appendChild(btn);

                if (hasChildren) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'nav-children';
                    item.children.forEach(child => {
                        const childBtn = document.createElement('button');
                        childBtn.className = 'nav-child';
                        childBtn.innerHTML = `
                            <span class="child-icon"><i class="fas fa-chevron-left"></i></span>
                            <span>${child}</span>
                            <span style="margin-right:auto;font-size:11px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${child}');" title="${isFavorite(child) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                                <i class="fas ${isFavorite(child) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(child) ? 'var(--gold)' : 'var(--muted)'};"></i>
                            </span>
                        `;
                        childBtn.onclick = function(e) {
                            e.stopPropagation();
                            const route = subPageRouteMap[child] || null;
                            if (route) {
                                addToRecent(child);
                                navigateTo(route);
                            } else {
                                showToast('هذه الشاشة قيد التطوير', 'info');
                            }
                        };
                        childContainer.appendChild(childBtn);
                    });
                    wrapper.appendChild(childContainer);
                }
                nav.appendChild(wrapper);
            });

            const pinned = localStorage.getItem('sidebar-pinned') === 'true';
            if (pinned) {
                document.getElementById('sidebar').classList.add('pinned');
                document.getElementById('pinBtn').classList.add('pinned');
            }
            const compact = localStorage.getItem('sidebar-compact') === 'true';
            if (compact) {
                document.getElementById('sidebar').classList.add('compact');
                document.getElementById('compactBtn').classList.add('active-mode');
            }

            syncElasticSvgWidth();
        }

        function createNavItem(item, isFav) {
            const btn = document.createElement('button');
            btn.className = 'nav-item';
            if (isFav) {
                btn.style.background = 'linear-gradient(135deg, var(--gold2), var(--gold))';
            }
            btn.dataset.label = item.label;
            const hasChildren = item.children && item.children.length > 0;
            btn.innerHTML = `
                <span class="nav-icon"><i class="fas ${item.icon}"></i></span>
                <span class="nav-label">${item.label}</span>
                ${hasChildren ? `<span class="nav-arrow"><i class="fas fa-chevron-down"></i></span>` : ''}
                <span style="margin-right:auto;font-size:12px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${item.label}');" title="${isFavorite(item.label) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                    <i class="fas ${isFavorite(item.label) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(item.label) ? '#1A1305' : 'rgba(26,19,5,.5)'};"></i>
                </span>
            `;
            btn.onclick = function(e) {
                e.stopPropagation();
                if (hasChildren) {
                    const parent = this.parentElement;
                    if (parent && parent.classList.contains('nav-item-parent')) {
                        const childContainer = parent.querySelector('.nav-children');
                        const arrow = this.querySelector('.nav-arrow');
                        if (childContainer) {
                            childContainer.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    }
                } else {
                    const route = subPageRouteMap[item.label] || '/';
                    addToRecent(item.label);
                    navigateTo(route);
                }
            };
            return btn;
        }

        function filterSidebar(event) {
            const query = event.target.value.toLowerCase().trim();
            const items = document.querySelectorAll('.nav-item-parent');
            let found = false;
            if (!query) {
                items.forEach(p => { p.style.display = ''; });
                return;
            }
            items.forEach(parent => {
                const label = parent.querySelector('.nav-label');
                const text = label ? label.textContent.toLowerCase() : '';
                const match = text.includes(query);
                parent.style.display = match ? '' : 'none';
                if (match) found = true;
                if (match) {
                    const children = parent.querySelector('.nav-children');
                    const arrow = parent.querySelector('.nav-arrow');
                    if (children) children.classList.add('open');
                    if (arrow) arrow.classList.toggle('open', true);
                }
            });
            const emptyState = document.querySelector('.sidebar-empty-state');
            if (!found && !emptyState) {
                const msg = document.createElement('div');
                msg.className = 'sidebar-empty-state';
                msg.textContent = 'لم يتم العثور على نتائج';
                document.getElementById('sidebarNav').appendChild(msg);
            } else if (found && emptyState) {
                emptyState.remove();
            }
        }

        // ================================================================
        // التحكم في القائمة الجانبية
        // ================================================================
        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const sideTab = document.getElementById('sideTab');
            if (isSidebarAnimating || sidebar.classList.contains('open')) return;

            syncElasticSvgWidth();
            sidebar.classList.add('open');
            if (overlay) overlay.classList.add('active');
            if (sideTab) sideTab.classList.add('hidden');

            animateElasticPath(currentLeadX, SIDEBAR_OPEN, 700);
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const sideTab = document.getElementById('sideTab');
            if (isSidebarAnimating || !sidebar.classList.contains('open')) return;

            sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('active');
            if (sideTab) sideTab.classList.remove('hidden');

            animateElasticPath(currentLeadX, SIDEBAR_CLOSED, 620);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                openSidebar();
            }
        }

        function togglePinSidebar() {
            const sidebar = document.getElementById('sidebar');
            const pinBtn = document.getElementById('pinBtn');
            const isPinned = sidebar.classList.toggle('pinned');
            pinBtn.classList.toggle('pinned');
            localStorage.setItem('sidebar-pinned', isPinned ? 'true' : 'false');
            if (isPinned) openSidebar();
            else closeSidebar();
        }

        function toggleCompactSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('compactBtn');
            const isCompact = sidebar.classList.toggle('compact');
            btn.classList.toggle('active-mode');
            localStorage.setItem('sidebar-compact', isCompact ? 'true' : 'false');
            setTimeout(syncElasticSvgWidth, 50);
            showToast(isCompact ? 'تم تفعيل الوضع المضغوط' : 'تم إلغاء الوضع المضغوط', 'info');
        }

        function closePanels() {
            closeSidebar();
        }

        // ================================================================
        // Drag Gestures
        // ================================================================
        let dragState = {
            active: false,
            target: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            direction: null
        };

        function beginDrag(touch, target) {
            if (isSidebarAnimating) return;
            dragState.active = true;
            dragState.target = target;
            dragState.startX = touch.clientX;
            dragState.startY = touch.clientY;
            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;
            dragState.direction = null;
        }

        function moveDrag(e) {
            if (!dragState.active) return;
            const touch = e.touches[0];
            if (!touch) return;

            dragState.currentX = touch.clientX;
            dragState.currentY = touch.clientY;

            const dx = dragState.currentX - dragState.startX;
            const dy = dragState.currentY - dragState.startY;

            if (!dragState.direction) {
                if (Math.abs(dx) > Math.abs(dy) + 4) {
                    dragState.direction = 'horizontal';
                } else if (Math.abs(dy) > Math.abs(dx) + 4) {
                    dragState.direction = 'vertical';
                } else {
                    return;
                }
            }

            if (dragState.direction !== 'horizontal') return;

            e.preventDefault();

            const sidebar = document.getElementById('sidebar');
            const width = sidebar.offsetWidth || 320;
            let leadX;

            if (dragState.target === 'tab') {
                const progress = Math.max(0, Math.min(1, -dx / width));
                leadX = SIDEBAR_CLOSED - (SIDEBAR_CLOSED * progress);
            } else if (dragState.target === 'sidebar') {
                const progress = Math.max(0, Math.min(1, dx / width));
                leadX = SIDEBAR_OPEN + (SIDEBAR_CLOSED - SIDEBAR_OPEN) * progress;
            } else {
                return;
            }

            const normalizedProgress = 1 - (leadX / SIDEBAR_CLOSED);
            const arcRadius = Math.sin(normalizedProgress * Math.PI) * 55;

            const pathEl = document.getElementById('sPath');
            pathEl.setAttribute('d', createElasticD(leadX, arcRadius));
            currentLeadX = leadX;
        }

        function endDrag() {
            if (!dragState.active) return;
            const target = dragState.target;
            const direction = dragState.direction;
            const dx = dragState.currentX - dragState.startX;

            dragState.active = false;
            dragState.target = null;
            dragState.direction = null;

            if (direction !== 'horizontal') return;

            const sidebar = document.getElementById('sidebar');
            const width = sidebar.offsetWidth || 320;
            const threshold = width * 0.28;

            if (target === 'tab') {
                if (-dx > threshold) {
                    sidebar.classList.add('open');
                    document.getElementById('sidebarOverlay').classList.add('active');
                    document.getElementById('sideTab').classList.add('hidden');
                    animateElasticPath(currentLeadX, SIDEBAR_OPEN, 420);
                } else {
                    animateElasticPath(currentLeadX, SIDEBAR_CLOSED, 420);
                }
            } else if (target === 'sidebar') {
                if (dx > threshold) {
                    sidebar.classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                    document.getElementById('sideTab').classList.remove('hidden');
                    animateElasticPath(currentLeadX, SIDEBAR_CLOSED, 420);
                } else {
                    animateElasticPath(currentLeadX, SIDEBAR_OPEN, 420);
                }
            }
        }

        function initDragGestures() {
            const sideTab = document.getElementById('sideTab');
            const sidebar = document.getElementById('sidebar');

            if (sideTab) {
                sideTab.addEventListener('touchstart', function(e) {
                    if (sidebar.classList.contains('open') || isSidebarAnimating) return;
                    const touch = e.touches[0];
                    if (touch) beginDrag(touch, 'tab');
                }, { passive: true });
            }

            if (sidebar) {
                sidebar.addEventListener('touchstart', function(e) {
                    if (!sidebar.classList.contains('open') || isSidebarAnimating) return;
                    const tag = (e.target.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'button' || tag === 'a' || tag === 'textarea' ||
                        tag === 'select' || e.target.closest('button') || e.target.closest('input')) {
                        return;
                    }
                    const touch = e.touches[0];
                    if (touch) beginDrag(touch, 'sidebar');
                }, { passive: true });
            }

            document.addEventListener('touchmove', moveDrag, { passive: false });
            document.addEventListener('touchend', endDrag, { passive: true });
            document.addEventListener('touchcancel', endDrag, { passive: true });
        }

        // ================================================================
        // التنقل

        async function navigateTo(url) {
            if (typeof url !== 'string' || !url.trim()) {
                showToast('مسار الشاشة غير صالح', 'error');
                return;
            }
            if (url === 'dashboard') {
                if (!currentUser) { showToast('لا توجد جلسة مستخدم', 'error'); return; }
                closePanels();
                closeCommandPalette();
                return;
            }
            if (url.startsWith('/')) url = url.substring(1);
            if (!url.startsWith('screens/')) url = 'screens/' + url;
            if (!url.endsWith('.html')) url = url + '.html';
            if (!currentUser) { showToast('لا توجد جلسة مستخدم', 'error'); return; }

            closePanels();
            closeCommandPalette();

            try {
                const result = await apiCall('screenExists', { path: url });
                if (!result.success) {
                    showToast(result.error || 'تعذر التحقق من الشاشة', 'error');
                    return;
                }
                if (result.data === false) {
                    showToast('الشاشة غير موجودة في نسخة التطبيق الحالية', 'error');
                    return;
                }
            } catch (e) {
                console.error('Screen check failed:', e);
                showToast('تعذر التحقق من جاهزية الشاشة', 'error');
                return;
            }
            showLoading(true);
            window.location.href = url;
        }

        function renderCommandPaletteResults(query) {
            const container = document.getElementById('commandPaletteResults');
            container.innerHTML = '';
            const sidebarData = getSidebarData();
            const flatItems = [];
            sidebarData.forEach(item => {
                flatItems.push({ label: item.label, icon: item.icon, parent: null });
                if (item.children && item.children.length) {
                    item.children.forEach(child => {
                        flatItems.push({ label: child, icon: 'fa-chevron-left', parent: item.label });
                    });
                }
            });

            const q = query.trim().toLowerCase();
            const filtered = q === '' ? flatItems : flatItems.filter(item =>
                item.label.includes(q) || (item.parent && item.parent.includes(q))
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة</div>';
                return;
            }

            filtered.slice(0, 15).forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                const icon = item.icon || 'fa-circle';
                div.innerHTML = `
                    <i class="fas ${icon}"></i>
                    <span class="result-label">${item.label}</span>
                    ${item.parent ? `<span class="result-path">${item.parent}</span>` : ''}
                `;
                div.onclick = function() {
                    let route = subPageRouteMap[item.label];
                    if (route) {
                        addToRecent(item.label);
                        navigateTo(route);
                    } else {
                        const parentItem = sidebarData.find(p => p.label === item.label);
                        if (parentItem && parentItem.children && parentItem.children.length) {
                            const navItems = document.querySelectorAll('.nav-item');
                            for (let btn of navItems) {
                                if (btn.dataset.label === item.label) {
                                    btn.click();
                                    break;
                                }
                            }
                            closeCommandPalette();
                        } else {
                            showToast('هذه الشاشة غير متاحة', 'info');
                        }
                    }
                    closeCommandPalette();
                };
                container.appendChild(div);
            });

            const first = container.querySelector('.result-item');
            if (first) first.classList.add('active');
        }

        function readDashboardCache() {
            try {
                const cached = localStorage.getItem('dashboardCache');
                if (!cached) return null;
                const parsed = JSON.parse(cached);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (e) { return null; }

        async function loadDashboard(forceRefresh = false) {
            if (isRefreshing) return;
            isRefreshing = true;
            renderSkeletons();

            try {
                const result = await apiCall('getDashboardStats');
                if (!result.success || !result.data) {
                    throw new Error(result.error || 'فشل تحميل الإحصائيات');
                }
                const stats = result.data;
                dashboardCache = stats;
                try { localStorage.setItem('dashboardCache', JSON.stringify(stats)); } catch (e) {}
                updateStatsCards(stats);
                if (stats.notifications) showRealNotifications(stats);
            } catch (e) {
                console.error('Dashboard error:', e);
                document.getElementById('reportsDataSource')?.setAttribute('data-state', 'error');
                showToast(e.message || 'تعذر تحميل بيانات SQLite', 'error');
            } finally {
                isRefreshing = false;
            }
        }

            loadDashboard(true);

        // ================================================================

        function showRealNotifications(stats) {
            if (stats.expiry_soon > 0) {
                addNotificationToQueue({ title: 'تنبيه انتهاء الصلاحية',
                    message: `هناك ${stats.expiry_soon} منتج ستنتهي صلاحيته خلال 30 يومًا`,
                    icon: 'fa-hourglass-half', type: 'warning', targetCard: 'card-expiry-soon' });
            }
            if (stats.low_stock > 0) {
                addNotificationToQueue({ title: 'تنبيه انخفاض المخزون',
                    message: `هناك ${stats.low_stock} منتج تحت الحد الأدنى`,
                    icon: 'fa-exclamation-circle', type: 'danger', targetCard: 'card-low-stock' });
            }
            if (stats.pending_tasks > 0) {
                addNotificationToQueue({ title: 'مهام معلقة',
                    message: `لديك ${stats.pending_tasks} مهمة تحتاج إلى مراجعتك`,
                    icon: 'fa-tasks', type: 'info', targetCard: 'card-pending-tasks' });
            }
            processNotificationQueue();
        }

        function addNotificationToQueue(notification) { notificationQueue.push(notification); }

        function processNotificationQueue() {
            if (isProcessingQueue || notificationQueue.length === 0) return;
            isProcessingQueue = true;
            const notification = notificationQueue.shift();
            createNotificationBubble(notification);
            setTimeout(() => { isProcessingQueue = false; processNotificationQueue(); }, 1500);
        }

        function createNotificationBubble(notification) {
            const container = document.getElementById('bubbleContainer') || createBubbleContainer();
            const bubble = document.createElement('div');
            bubble.className = `notification-bubble bubble-${notification.type}`;
            bubble.innerHTML = `<i class="fas ${notification.icon}"></i>`;
            bubble.dataset.target = notification.targetCard;
            const wave = document.createElement('div');
            wave.className = 'bubble-wave';
            bubble.appendChild(wave);
            container.appendChild(bubble);
            const interval = setInterval(() => {
                wave.style.animation = 'none';
                setTimeout(() => { wave.style.animation = 'wave 15s infinite'; }, 10);
            }, 60000);
            bubble.onclick = function() {
                const card = document.getElementById(this.dataset.target);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth' });
                    setTimeout(() => {
                        if (this.parentNode) {
                            clearInterval(interval);
                            this.parentNode.removeChild(this);
                        }
                    }, 500);
                }
            };
            activeBubbles.push({ element: bubble, interval: interval });
        }

        function createBubbleContainer() {
            const c = document.createElement('div');
            c.id = 'bubbleContainer';
            c.className = 'bubble-container';
            document.body.appendChild(c);
            return c;
        }

        function hideAllBubbles() {
            activeBubbles.forEach(b => { clearInterval(b.interval); b.element.remove(); });
            activeBubbles = [];
            notificationQueue = [];
        }

        // ================================================================
        // Pull-to-Refresh
        // ================================================================
        function initPullToRefresh() {
            let startY = 0, moveY = 0, pulling = false;
            document.addEventListener('touchstart', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                if (isSleeping) return;
                startY = e.touches[0].clientY;
                pulling = false;
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                if (isSleeping) return;
                moveY = e.touches[0].clientY - startY;
                if (moveY > 0 && window.scrollY === 0) pulling = true;
            }, { passive: true });
            document.addEventListener('touchend', function() {
                if (isSleeping) return;
                if (pulling && moveY > 70) manualRefresh();
                moveY = 0;
                pulling = false;
            }, { passive: true });
        }

        // ================================================================
        // تهيئة التطبيق
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            await loadMenuData();

            currentLeadX = SIDEBAR_CLOSED;
            const pathEl = document.getElementById('sPath');
            if (pathEl) pathEl.setAttribute('d', createElasticD(SIDEBAR_CLOSED, 0));

            setTimeout(syncElasticSvgWidth, 100);

            updateDateTime();
            clockInterval = setInterval(updateDateTime, 1000);

            initDragGestures();
            initSleepMode();

            const cmdInput = document.getElementById('commandPaletteInput');
            cmdInput.addEventListener('input', function(e) {
                renderCommandPaletteResults(e.target.value.trim());
            });
            cmdInput.addEventListener('keydown', function(e) {
                const results = document.querySelectorAll('.palette-results .result-item');
                let active = -1;
                results.forEach((el, i) => { if (el.classList.contains('active')) active = i; });
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    let next = active + 1;
                    if (next >= results.length) next = 0;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[next]) results[next].classList.add('active');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    let prev = active - 1;
                    if (prev < 0) prev = results.length - 1;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[prev]) results[prev].classList.add('active');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeEl = document.querySelector('.palette-results .result-item.active');
                    if (activeEl) activeEl.click();
                } else if (e.key === 'Escape') {
                    closeCommandPalette();
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    const overlay = document.getElementById('commandPaletteOverlay');
                    if (overlay.classList.contains('show')) closeCommandPalette();
                    else openCommandPalette();
                }
                if (e.key === 'Escape') {
                    const sidebar = document.getElementById('sidebar');
                    if (sidebar.classList.contains('open')) closeSidebar();
                }
            });

            document.addEventListener('click', handlePanelOutsideClick);

            const bridgeReady = initAndroidBridge();
            initPullToRefresh();

            if (!bridgeReady) {
                setTimeout(() => { if (!useAndroidInterface) initAndroidBridge(); }, 2000);
                return;
            }

            const userLoaded = await loadUserFromKotlin();
            if (!userLoaded) return;

            initCardDoubleClick();

            refreshInterval = setInterval(() => { loadDashboard(true); }, 180000);

            updateThemeButton(document.documentElement.getAttribute('data-theme') === 'dark');

            let lastClick = 0;
            document.addEventListener('click', function() {
                const now = Date.now();
                if (now - lastClick < 300) hideAllBubbles();
                lastClick = now;
            });

            if (currentUser) updateUserInfo(currentUser);

            window.addEventListener('pageshow', function(e) {
                if (e.persisted) loadDashboard(true);
            });
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && !isSleeping) loadDashboard(true);
            });

            window.addEventListener('resize', function() {
                syncElasticSvgWidth();
            });
        });

        // ================================================================
        // إغلاق القائمة عند النقر خارجها
        // ================================================================
        function handlePanelOutsideClick(event) {
            if (isSleeping) return;
            const target = event.target;
            const sidebar = document.getElementById('sidebar');
            const sideTab = document.getElementById('sideTab');
            const searchInput = document.getElementById('sidebarSearch');
            const pinBtn = document.getElementById('pinBtn');
            const closeBtn = document.querySelector('.sidebar-close');
            const compactBtn = document.getElementById('compactBtn');
            const cmdPalette = document.querySelector('.command-palette-box');

            if (sidebar && sidebar.contains(target)) return;
            if (sideTab && sideTab.contains(target)) return;
            if (searchInput && searchInput.contains(target)) return;
            if (pinBtn && pinBtn.contains(target)) return;
            if (closeBtn && closeBtn.contains(target)) return;
            if (compactBtn && compactBtn.contains(target)) return;
            if (cmdPalette && cmdPalette.contains(target)) return;

            if (sidebar && sidebar.classList.contains('open')) {
                closeSidebar();
            }
        }
    </script>

    <script src="file:///android_asset/assets-local/js/modal-interaction.js"></script>
</body>
