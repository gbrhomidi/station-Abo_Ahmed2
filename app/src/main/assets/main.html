        async function loadMenuData() {
            try {
                const response = await fetch('file:///android_asset/assets-local/menu.json');
                if (response.ok) {
                    const data = await response.json();
                    sidebarNavData = data.menu || fallbackSidebarData;
                    subPageRouteMap = data.routes || fallbackRouteMap;
                } else {
                    sidebarNavData = fallbackSidebarData;
                    subPageRouteMap = fallbackRouteMap;
                }
            } catch (e) {
                console.warn('Failed to load menu.json, using fallback', e);
                sidebarNavData = fallbackSidebarData;
                subPageRouteMap = fallbackRouteMap;
            }
        }

        function getSidebarData() {
            if (!currentUser) return [];
            return sidebarNavData.map(item => ({
                ...item,
                children: Array.isArray(item.children) ? item.children : []
            }));
        }

        // ================================================================
        // المفضلة والمستخدمة مؤخراً
        // ================================================================
        function addToRecent(label) {
            recent = recent.filter(item => item !== label);
            recent.unshift(label);
            if (recent.length > 10) recent.pop();
            localStorage.setItem('recent', JSON.stringify(recent));
        }

        function toggleFavorite(label) {
            if (favorites.includes(label)) {
                favorites = favorites.filter(item => item !== label);
            } else {
                favorites.push(label);
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            renderSidebar();
        }

        function isFavorite(label) { return favorites.includes(label); }

        // ================================================================
        // بناء القائمة الجانبية (Accordion + مفضلة + مستخدمة مؤخراً)
        // ================================================================
        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            if (!nav) return;
            nav.innerHTML = '';

            const sidebarData = getSidebarData();
            if (sidebarData.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'sidebar-empty-state';
                empty.textContent = currentUser ? 'لا توجد شاشات متاحة' : 'تعذر تحميل جلسة المستخدم';
                nav.appendChild(empty);
                return;
            }

            // === المفضلة ===
            if (favorites.length > 0) {
                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerHTML = '<i class="fas fa-star" style="color: var(--gold-color);"></i> المفضلة';
                nav.appendChild(title);
                favorites.forEach(label => {
                    const item = sidebarData.find(p => p.label === label);
                    if (item) {
                        const btn = createNavItem(item, true);
                        nav.appendChild(btn);
                    }
                });
            }

            // === المستخدمة مؤخراً ===
            if (recent.length > 0) {
                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerHTML = '<i class="fas fa-clock" style="color: var(--text-secondary);"></i> المستخدمة مؤخراً';
                nav.appendChild(title);
                recent.slice(0, 5).forEach(label => {
                    const item = sidebarData.find(p => p.label === label);
                    if (item) {
                        const btn = createNavItem(item, false);
                        nav.appendChild(btn);
                    }
                });
            }

            // === جميع العناصر ===
            const allTitle = document.createElement('div');
            allTitle.className = 'sidebar-section-title';
            allTitle.innerHTML = '<i class="fas fa-list"></i> جميع الشاشات';
            nav.appendChild(allTitle);

            sidebarData.forEach(item => {
                const wrapper = document.createElement('div');
                wrapper.className = 'nav-item-parent';

                const btn = document.createElement('button');
                btn.className = 'nav-item';
                btn.dataset.label = item.label;
                const hasChildren = item.children && item.children.length > 0;
                btn.innerHTML = `
                    <span class="nav-icon"><i class="fas ${item.icon}"></i></span>
                    <span class="nav-label">${item.label}</span>
                    ${hasChildren ? `<span class="nav-arrow"><i class="fas fa-chevron-down"></i></span>` : ''}
                    <span style="margin-right:auto;font-size:12px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${item.label}');" title="${isFavorite(item.label) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                        <i class="fas ${isFavorite(item.label) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(item.label) ? 'var(--gold-color)' : 'var(--text-secondary)'};"></i>
                    </span>
                `;

                if (hasChildren) {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const childContainer = this.parentElement.querySelector('.nav-children');
                        const arrow = this.querySelector('.nav-arrow');
                        if (childContainer) {
                            childContainer.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    };
                } else {
                    btn.onclick = function(e) {
                        e.stopPropagation();
                        const route = subPageRouteMap[item.label] || '/';
                        addToRecent(item.label);
                        navigateTo(route);
                    };
                }
                wrapper.appendChild(btn);

                if (hasChildren) {
                    const childContainer = document.createElement('div');
                    childContainer.className = 'nav-children';
                    item.children.forEach(child => {
                        const childBtn = document.createElement('button');
                        childBtn.className = 'nav-child';
                        childBtn.innerHTML = `
                            <span class="child-icon"><i class="fas fa-chevron-left"></i></span>
                            <span>${child}</span>
                            <span style="margin-right:auto;font-size:11px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${child}');" title="${isFavorite(child) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                                <i class="fas ${isFavorite(child) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(child) ? 'var(--gold-color)' : 'var(--text-secondary)'};"></i>
                            </span>
                        `;
                        childBtn.onclick = function(e) {
                            e.stopPropagation();
                            const route = subPageRouteMap[child] || null;
                            if (route) {
                                addToRecent(child);
                                navigateTo(route);
                            } else {
                                showToast('هذه الشاشة قيد التطوير', 'info');
                            }
                        };
                        childContainer.appendChild(childBtn);
                    });
                    wrapper.appendChild(childContainer);
                }
                nav.appendChild(wrapper);
            });

            // استعادة الحالة
            const pinned = localStorage.getItem('sidebar-pinned') === 'true';
            if (pinned) {
                document.getElementById('sidebar').classList.add('pinned');
                document.getElementById('pinBtn').classList.add('pinned');
            }
            const compact = localStorage.getItem('sidebar-compact') === 'true';
            if (compact) {
                document.getElementById('sidebar').classList.add('compact');
                document.getElementById('compactBtn').classList.add('active-mode');
            }

            // ضبط المسافة للمحتوى الرئيسي بناءً على عرض القائمة (للشاشات الكبيرة)
            adjustMainContentMargin();
        }

        function createNavItem(item, isFav) {
            const btn = document.createElement('button');
            btn.className = 'nav-item';
            btn.style.background = isFav ? 'linear-gradient(to left, var(--secondary), var(--secondary-dark))' : '';
            btn.dataset.label = item.label;
            const hasChildren = item.children && item.children.length > 0;
            btn.innerHTML = `
                <span class="nav-icon"><i class="fas ${item.icon}"></i></span>
                <span class="nav-label">${item.label}</span>
                ${hasChildren ? `<span class="nav-arrow"><i class="fas fa-chevron-down"></i></span>` : ''}
                <span style="margin-right:auto;font-size:12px;cursor:pointer;" onclick="event.stopPropagation(); toggleFavorite('${item.label}');" title="${isFavorite(item.label) ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة'}">
                    <i class="fas ${isFavorite(item.label) ? 'fa-star' : 'fa-star-o'}" style="color:${isFavorite(item.label) ? 'var(--gold-color)' : 'var(--text-secondary)'};"></i>
                </span>
            `;
            btn.onclick = function(e) {
                e.stopPropagation();
                if (hasChildren) {
                    const parent = this.parentElement;
                    if (parent && parent.classList.contains('nav-item-parent')) {
                        const childContainer = parent.querySelector('.nav-children');
                        const arrow = this.querySelector('.nav-arrow');
                        if (childContainer) {
                            childContainer.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    }
                } else {
                    const route = subPageRouteMap[item.label] || '/';
                    addToRecent(item.label);
                    navigateTo(route);
                }
            };
            return btn;
        }

        function filterSidebar(event) {
            const query = event.target.value.toLowerCase().trim();
            const items = document.querySelectorAll('.nav-item-parent');
            let found = false;
            if (!query) {
                items.forEach(p => { p.style.display = ''; });
                return;
            }
            items.forEach(parent => {
                const label = parent.querySelector('.nav-label');
                const text = label ? label.textContent.toLowerCase() : '';
                const match = text.includes(query);
                parent.style.display = match ? '' : 'none';
                if (match) found = true;
                if (match) {
                    const children = parent.querySelector('.nav-children');
                    const arrow = parent.querySelector('.nav-arrow');
                    if (children) children.classList.add('open');
                    if (arrow) arrow.classList.add('open');
                }
            });
            const emptyState = document.querySelector('.sidebar-empty-state');
            if (!found && !emptyState) {
                const msg = document.createElement('div');
                msg.className = 'sidebar-empty-state';
                msg.textContent = 'لم يتم العثور على نتائج';
                document.getElementById('sidebarNav').appendChild(msg);
            } else if (found && emptyState) {
                emptyState.remove();
            }
        }

        // ================================================================
        // التحكم في القائمة الجانبية
        // ================================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('active');
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        function togglePinSidebar() {
            const sidebar = document.getElementById('sidebar');
            const pinBtn = document.getElementById('pinBtn');
            const isPinned = sidebar.classList.toggle('pinned');
            pinBtn.classList.toggle('pinned');
            localStorage.setItem('sidebar-pinned', isPinned ? 'true' : 'false');
            if (isPinned) {
                sidebar.classList.add('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            } else {
                closeSidebar();
            }
        }

        function toggleCompactSidebar() {
            const sidebar = document.getElementById('sidebar');
            const btn = document.getElementById('compactBtn');
            const isCompact = sidebar.classList.toggle('compact');
            btn.classList.toggle('active-mode');
            localStorage.setItem('sidebar-compact', isCompact ? 'true' : 'false');
            if (!isCompact) {
                sidebar.style.width = '';
            }
            showToast(isCompact ? 'تم تفعيل الوضع المضغوط' : 'تم إلغاء الوضع المضغوط', 'info');
            adjustMainContentMargin();
        }

        function adjustMainContentMargin() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('mainContent');
            if (window.innerWidth >= 1024) {
                const isCompact = sidebar.classList.contains('compact');
                const width = isCompact ? 64 : sidebar.scrollWidth;
                main.style.marginRight = width + 'px';
            } else {
                main.style.marginRight = '0';
            }
        }

        function closePanels() {
            closeSidebar();
        }

        // ================================================================
        // التنقل بين الصفحات
        // ================================================================
        async function navigateTo(url) {
            if (typeof url !== 'string' || !url.trim()) {
                showToast('مسار الشاشة غير صالح', 'error');
                return;
            }
            if (url === 'dashboard') {
                if (!currentUser) { showToast('لا توجد جلسة مستخدم', 'error'); return; }
                closePanels();
                closeCommandPalette();
                return;
            }
            if (url.startsWith('/')) url = url.substring(1);
            if (!url.startsWith('screens/')) url = 'screens/' + url;
            if (!url.endsWith('.html')) url = url + '.html';
            if (!currentUser) { showToast('لا توجد جلسة مستخدم', 'error'); return; }

            closePanels();
            closeCommandPalette();

            try {
                const result = await apiCall('screenExists', { path: url });
                if (!result.success) {
                    showToast(result.error || 'تعذر التحقق من الشاشة', 'error');
                    return;
                }
                if (result.data === false) {
                    showToast('الشاشة غير موجودة في نسخة التطبيق الحالية', 'error');
                    return;
                }
            } catch (e) {
                console.error('Screen check failed:', e);
                showToast('تعذر التحقق من جاهزية الشاشة', 'error');
                return;
            }
            showLoading(true);
            window.location.href = url;
        }

        // ================================================================
        // Command Palette
        // ================================================================
        function openCommandPalette() {
            const overlay = document.getElementById('commandPaletteOverlay');
            overlay.classList.add('show');
            const input = document.getElementById('commandPaletteInput');
            input.value = '';
            input.focus();
            renderCommandPaletteResults('');
        }

        function closeCommandPalette() {
            document.getElementById('commandPaletteOverlay').classList.remove('show');
            document.getElementById('commandPaletteInput').blur();
        }

        function renderCommandPaletteResults(query) {
            const container = document.getElementById('commandPaletteResults');
            container.innerHTML = '';
            const sidebarData = getSidebarData();
            const flatItems = [];
            sidebarData.forEach(item => {
                flatItems.push({ label: item.label, icon: item.icon, parent: null });
                if (item.children && item.children.length) {
                    item.children.forEach(child => {
                        flatItems.push({ label: child, icon: 'fa-chevron-left', parent: item.label });
                    });
                }
            });

            const q = query.trim().toLowerCase();
            const filtered = q === '' ? flatItems : flatItems.filter(item =>
                item.label.includes(q) || (item.parent && item.parent.includes(q))
            );

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">لا توجد نتائج مطابقة</div>';
                return;
            }

            filtered.slice(0, 15).forEach(item => {
                const div = document.createElement('div');
                div.className = 'result-item';
                const icon = item.icon || 'fa-circle';
                div.innerHTML = `
                    <i class="fas ${icon}"></i>
                    <span class="result-label">${item.label}</span>
                    ${item.parent ? `<span class="result-path">${item.parent}</span>` : ''}
                `;
                div.onclick = function() {
                    let route = subPageRouteMap[item.label];
                    if (route) {
                        addToRecent(item.label);
                        navigateTo(route);
                    } else {
                        const parentItem = sidebarData.find(p => p.label === item.label);
                        if (parentItem && parentItem.children && parentItem.children.length) {
                            const navItems = document.querySelectorAll('.nav-item');
                            for (let btn of navItems) {
                                if (btn.dataset.label === item.label) {
                                    btn.click();
                                    break;
                                }
                            }
                            closeCommandPalette();
                        } else {
                            showToast('هذه الشاشة غير متاحة', 'info');
                        }
                    }
                    closeCommandPalette();
                };
                container.appendChild(div);
            });

            const first = container.querySelector('.result-item');
            if (first) first.classList.add('active');
        }

        // ================================================================
        // لوحة التحكم (Dashboard)
        // ================================================================
        function renderSkeletons() {
            const grid = document.getElementById('dashStats');
            const skeletonCards = [
                'total-products', 'daily-sales', 'active-customers', 'expiry-soon',
                'low-stock', 'due-invoices', 'returned-products', 'damaged-products',
                'customer-debts', 'supplier-debts', 'inventory-value', 'pending-tasks', 'occupancy'
            ];
            grid.innerHTML = '';
            skeletonCards.forEach(id => {
                const card = document.createElement('div');
                card.className = 'stat-card skeleton';
                card.id = `skeleton-${id}`;
                card.innerHTML = `
                    <div class="card-header"></div>
                    <div class="stat-value"></div>
                    <div class="stat-label"></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
                `;
                grid.appendChild(card);
            });
        }

        function updateStatsCards(stats) {
            stats = stats || {};
            const grid = document.getElementById('dashStats');
            grid.innerHTML = '';

            const cardDefs = [
                { id: 'card-total-products', header: 'إجمالي المنتجات', icon: 'fa-boxes', value: stats.total_products ||
                        0, label: 'منتج في النظام', trend: stats.products_trend || '+0%', trendUp: true,
                    progress: 70 },
                { id: 'card-daily-sales', header: 'المبيعات اليومية', icon: 'fa-chart-line', value: (stats
                        .daily_sales || 0).toFixed(2) + ' ر.ي', label: 'إجمالي المبيعات اليوم', trend: stats
                        .sales_trend || '+0%', trendUp: true, cls: 'success-card' },
                { id: 'card-active-customers', header: 'العملاء النشطين', icon: 'fa-users', value: stats
                        .active_customers || 0, label: 'عميل نشط', cls: '' },
                { id: 'card-expiry-soon', header: 'المنتهية قريباً', icon: 'fa-hourglass-half', value: stats
                        .expiry_soon || 0, label: 'منتج خلال 30 يومًا', badge: stats.expiry_soon || 0,
                    cls: 'warning-card' },
                { id: 'card-low-stock', header: 'انخفاض المخزون', icon: 'fa-exclamation-circle', value: stats
                        .low_stock || 0, label: 'تحت الحد الأدنى', badge: stats.low_stock || 0,
                    cls: 'danger-card' },
                { id: 'card-due-invoices', header: 'الفواتير المستحقة', icon: 'fa-file-invoice', value: stats
                        .due_invoices || 0, label: 'فاتورة خلال أسبوع', cls: 'info-card' },
                { id: 'card-returned-products', header: 'المنتجات المرتجعة', icon: 'fa-undo', value: (stats
                        .returned_products_today || 0).toFixed(2), label: 'كمية اليوم (لتر)',
                    cls: 'returned-card' },
                { id: 'card-damaged-products', header: 'المنتجات التالفة', icon: 'fa-ban', value: (stats
                        .damaged_products_today || 0).toFixed(2), label: 'كمية اليوم (لتر)',
                    cls: 'damaged-card' },
                { id: 'card-customer-debts', header: 'مديونية العملاء', icon: 'fa-hand-holding-usd', value: (stats
                        .customer_debts || 0).toFixed(2) + ' ر.ي', label: 'إجمالي الديون المستحقة',
                    cls: 'warning-card' },
                { id: 'card-supplier-debts', header: 'مديونية الموردين', icon: 'fa-file-invoice-dollar',
                    value: (stats.supplier_debts || 0).toFixed(2) + ' ر.ي', label: 'إجمالي الدين للموردين',
                    cls: '' },
                { id: 'card-inventory-value', header: 'قيمة المخزون', icon: 'fa-warehouse', value: (stats
                        .inventory_value || 0).toFixed(2) + ' ر.ي', label: 'القيمة الإجمالية للمخزون',
                    cls: 'success-card' },
                { id: 'card-pending-tasks', header: 'المهام المعلقة', icon: 'fa-tasks', value: stats.pending_tasks ||
                        0, label: 'مهمة تحتاج لمراجعتك', badge: stats.pending_tasks || 0, cls: 'info-card' },
                { id: 'card-occupancy', header: 'نسبة الإشغال', icon: 'fa-tachometer-alt', value: (() => { const o =
                            Math.min(100, Math.round((stats.total_products || 0) / 100 * 75 + 15)); return o +
                        '%'; })(), label: 'معدل استخدام الخزانات', progress: Math.min(100, Math.round((stats
                        .total_products || 0) / 100 * 75 + 15)), cls: 'info-card' }
            ];

            cardDefs.forEach(def => {
                const card = document.createElement('div');
                card.className = `stat-card ${def.cls || ''}`;
                card.id = def.id;
                let badgeHtml = '';
                if (def.badge && def.badge > 0) {
                    badgeHtml = `<div class="card-badge">${def.badge}</div>`;
                }
                let progressHtml = '';
                if (def.progress !== undefined) {
                    progressHtml =
                        `<div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,def.progress)}%"></div></div>`;
                }
                let trendHtml = '';
                if (def.trend) {
                    const up = def.trendUp !== false;
                    trendHtml =
                        `<div class="stat-trend trend-${up ? 'up' : 'down'}"><i class="fas fa-arrow-${up ? 'up' : 'down'}"></i> ${def.trend}</div>`;
                }
                card.innerHTML = `
                    <div class="card-header">
                        <i class="fas ${def.icon}"></i>
                        <h3>${def.header}</h3>
                    </div>
                    <div class="stat-value">${def.value}</div>
                    <div class="stat-label">${def.label}</div>
                    ${trendHtml}
                    ${badgeHtml}
                    ${progressHtml}
                `;
                grid.appendChild(card);
            });

            initCardDoubleClick();

            document.getElementById('last-update').textContent = new Date().toLocaleString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric'
            });
        }

        function readDashboardCache() {
            try {
                const cached = localStorage.getItem('dashboardCache');
                if (!cached) return null;
                const parsed = JSON.parse(cached);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (e) { return null; }
        }

        async function loadDashboard(forceRefresh = false) {
            if (isRefreshing) return;
            isRefreshing = true;

            renderSkeletons();

            if (!forceRefresh && dashboardCache) {
                updateStatsCards(dashboardCache);
                showToast('تم عرض آخر بيانات محملة', 'info');
                isRefreshing = false;
                return;
            }

            const refreshBtn = document.getElementById('refreshButton').querySelector('i');
            if (refreshBtn) refreshBtn.classList.add('spinning');

            try {
                const result = await apiCall('getDashboardStats');
                if (!result.success || !result.data) {
                    throw new Error(result.error || 'فشل تحميل الإحصائيات');
                }
                const stats = result.data;
                dashboardCache = stats;
                try { localStorage.setItem('dashboardCache', JSON.stringify(stats)); } catch (e) {}
                updateStatsCards(stats);
                if (stats.notifications) showRealNotifications(stats);
                showToast('تم تحديث لوحة التحكم', 'success');
            } catch (e) {
                console.error('Dashboard error:', e);
                const cached = readDashboardCache();
                if (cached) {
                    updateStatsCards(cached);
                    showToast('عُرضت آخر بيانات محفوظة', 'warning');
                } else {
                    showToast(e.message || 'تعذر تحميل البيانات', 'error');
                }
            } finally {
                if (refreshBtn) refreshBtn.classList.remove('spinning');
                isRefreshing = false;
            }
        }

        function manualRefresh() {
            showToast('جاري تحديث البيانات...', 'info');
            loadDashboard(true);
        }

        // ================================================================
        // الإشعارات
        // ================================================================
        function showRealNotifications(stats) {
            if (stats.expiry_soon > 0) {
                addNotificationToQueue({ title: 'تنبيه انتهاء الصلاحية', message: `هناك ${stats.expiry_soon} منتج ستنتهي صلاحيته خلال 30 يومًا`,
                    icon: 'fa-hourglass-half', type: 'warning', targetCard: 'card-expiry-soon' });
            }
            if (stats.low_stock > 0) {
                addNotificationToQueue({ title: 'تنبيه انخفاض المخزون', message: `هناك ${stats.low_stock} منتج تحت الحد الأدنى`,
                    icon: 'fa-exclamation-circle', type: 'danger', targetCard: 'card-low-stock' });
            }
            if (stats.pending_tasks > 0) {
                addNotificationToQueue({ title: 'مهام معلقة', message: `لديك ${stats.pending_tasks} مهمة تحتاج إلى مراجعتك`,
                    icon: 'fa-tasks', type: 'info', targetCard: 'card-pending-tasks' });
            }
            processNotificationQueue();
        }

        function addNotificationToQueue(notification) { notificationQueue.push(notification); }

        function processNotificationQueue() {
            if (isProcessingQueue || notificationQueue.length === 0) return;
            isProcessingQueue = true;
            const notification = notificationQueue.shift();
            createNotificationBubble(notification);
            setTimeout(() => { isProcessingQueue = false;
                processNotificationQueue(); }, 1500);
        }

        function createNotificationBubble(notification) {
            const container = document.getElementById('bubbleContainer') || createBubbleContainer();
            const bubble = document.createElement('div');
            bubble.className = `notification-bubble bubble-${notification.type}`;
            bubble.innerHTML = `<i class="fas ${notification.icon}"></i>`;
            bubble.dataset.target = notification.targetCard;
            const wave = document.createElement('div');
            wave.className = 'bubble-wave';
            bubble.appendChild(wave);
            container.appendChild(bubble);
            const interval = setInterval(() => {
                wave.style.animation = 'none';
                setTimeout(() => { wave.style.animation = 'wave 15s infinite'; }, 10);
            }, 60000);
            bubble.onclick = function() {
                const card = document.getElementById(this.dataset.target);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth' });
                    card.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.8)';
                    setTimeout(() => { card.style.boxShadow = ''; }, 2000);
                    this.style.opacity = '0';
                    this.style.transform = 'scale(0)';
                    setTimeout(() => { if (this.parentNode) { clearInterval(interval);
                            this.parentNode.removeChild(this); } }, 500);
                }
            };
            activeBubbles.push({ element: bubble, interval: interval });
        }

        function createBubbleContainer() {
            const c = document.createElement('div');
            c.id = 'bubbleContainer';
            c.className = 'bubble-container';
            document.body.appendChild(c);
            return c;
        }

        function hideAllBubbles() {
            activeBubbles.forEach(b => { clearInterval(b.interval);
                b.element.remove(); });
            activeBubbles = [];
            notificationQueue = [];
        }

        // ================================================================
        // النقر المزدوج على البطاقات
        // ================================================================
        function initCardDoubleClick() {
            const routes = {
                'card-total-products': 'screens/products.html',
                'card-daily-sales': 'screens/sales-reports.html',
                'card-active-customers': 'screens/customers.html',
                'card-expiry-soon': 'screens/expiry-soon.html',
                'card-low-stock': 'screens/stock-levels.html',
                'card-due-invoices': 'screens/customer-debts.html',
                'card-returned-products': 'screens/returned-products.html',
                'card-damaged-products': 'screens/damaged-products.html',
                'card-customer-debts': 'screens/customer-debts.html',
                'card-supplier-debts': 'screens/suppliers.html',
                'card-inventory-value': 'screens/inventory-reports.html',
                'card-pending-tasks': 'screens/tasks.html',
                'card-occupancy': 'screens/tanks.html'
            };
            Object.entries(routes).forEach(([id, route]) => {
                const card = document.getElementById(id);
                if (!card || card.dataset.bound) return;
                card.dataset.bound = 'true';
                card.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    navigateTo(route);
                });
            });
        }

        // ================================================================
        // Pull-to-Refresh
        // ================================================================
        function initPullToRefresh() {
            let startY = 0,
                moveY = 0,
                pulling = false;
            document.addEventListener('touchstart', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                startY = e.touches[0].clientY;
                pulling = false;
            }, { passive: true });
            document.addEventListener('touchmove', function(e) {
                if (document.querySelector('.command-palette-overlay.show')) return;
                moveY = e.touches[0].clientY - startY;
                if (moveY > 0 && window.scrollY === 0) pulling = true;
            }, { passive: true });
            document.addEventListener('touchend', function() {
                if (pulling && moveY > 70) manualRefresh();
                moveY = 0;
                pulling = false;
            }, { passive: true });
        }

        // ================================================================
        // تهيئة التطبيق
        // ================================================================
        document.addEventListener('DOMContentLoaded', async function() {
            await loadMenuData();

            // Command Palette events
            const cmdInput = document.getElementById('commandPaletteInput');
            cmdInput.addEventListener('input', function(e) {
                renderCommandPaletteResults(e.target.value.trim());
            });
            cmdInput.addEventListener('keydown', function(e) {
                const results = document.querySelectorAll('.palette-results .result-item');
                let active = -1;
                results.forEach((el, i) => { if (el.classList.contains('active')) active = i; });
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    let next = active + 1;
                    if (next >= results.length) next = 0;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[next]) results[next].classList.add('active');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    let prev = active - 1;
                    if (prev < 0) prev = results.length - 1;
                    results.forEach(el => el.classList.remove('active'));
                    if (results[prev]) results[prev].classList.add('active');
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeEl = document.querySelector('.palette-results .result-item.active');
                    if (activeEl) activeEl.click();
                } else if (e.key === 'Escape') {
                    closeCommandPalette();
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    const overlay = document.getElementById('commandPaletteOverlay');
                    if (overlay.classList.contains('show')) closeCommandPalette();
                    else openCommandPalette();
                }
            });

            document.addEventListener('click', handlePanelOutsideClick);

            const bridgeReady = initAndroidBridge();
            initPullToRefresh();

            if (!bridgeReady) {
                setTimeout(() => { if (!useAndroidInterface) initAndroidBridge(); }, 2000);
                return;
            }

            const userLoaded = await loadUserFromKotlin();
            if (!userLoaded) return;

            initCardDoubleClick();

            refreshInterval = setInterval(() => { loadDashboard(true); }, 180000);

            updateThemeButton(document.documentElement.getAttribute('data-theme') === 'dark');

            let lastClick = 0;
            document.addEventListener('click', function(e) {
                const now = Date.now();
                if (now - lastClick < 300) hideAllBubbles();
                lastClick = now;
            });

            if (currentUser) updateUserInfo(currentUser);

            setTimeout(adjustMainContentMargin, 300);
            window.addEventListener('resize', adjustMainContentMargin);
        });

        function handlePanelOutsideClick(event) {
            const target = event.target;
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.querySelector('.menu-toggle');
            const searchInput = document.getElementById('sidebarSearch');
            const pinBtn = document.getElementById('pinBtn');
            const closeBtn = document.querySelector('.sidebar-close');
            const compactBtn = document.getElementById('compactBtn');
            const cmdPalette = document.querySelector('.command-palette-box');

            if (sidebar && !sidebar.contains(target) && !menuToggle.contains(target) &&
                !searchInput.contains(target) && !pinBtn.contains(target) && !closeBtn.contains(target) &&
                !compactBtn.contains(target) && !cmdPalette.contains(target)) {
                if (sidebar.classList.contains('open')) closeSidebar();
            }
        }
    </script>
