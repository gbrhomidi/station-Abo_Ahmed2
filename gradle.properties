org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true

# ⚠️ تحذير: هذا التطبيق يستخدم compileSdk=35
# القيمة 36 قد تسبب تحذيرات أو مشاكل في المستقبل
android.suppressUnsupportedCompileSdk=35

# Use Maven Central's canonical endpoint for Robolectric's runtime Android SDK artifacts.
# This avoids the repo1 endpoint's missing checksum-metadata failures observed in CI.
systemProp.robolectric.dependency.repo.url=https\://repo.maven.apache.org/maven2
