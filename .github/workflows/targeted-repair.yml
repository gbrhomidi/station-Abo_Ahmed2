name: Execute targeted repair
on:
  push:
    branches: [feature/ai-health-sqlite]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[targeted-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-health-sqlite
          fetch-depth: 0
      - name: Run repair script
        run: python3 repair_targeted.py
      - name: Static checks
        run: |
          set -e
          git diff --check
          grep -q "function goHome(){location.href='../main.html'}" app/src/main/assets/screens/users.html
          ! grep -q "submitBtn.focus();" app/src/main/assets/screens/login.html
          grep -q "getCustomers')" app/src/main/assets/screens/deliveries.html
          grep -q "fun updateFuelSaleRecord(id: Long, jsonData: String): String" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -q "fun deleteFuelSaleRecord(id: Long): String" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
      - name: Run existing Gradle tests without installing SDK
        continue-on-error: true
        run: ./gradlew test --no-daemon --stacktrace
      - name: Commit source changes only
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/screens/first-user-setup.html app/src/main/assets/screens/users.html app/src/main/assets/screens/login.html app/src/main/assets/main.html app/src/main/assets/screens/deliveries.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git diff --cached --check
          git commit -m 'fix: repair SQLite and WebView integration [targeted-repair]'
          git push origin HEAD:feature/ai-health-sqlite
      - name: Cleanup temporary files
        if: always()
        run: |
          git fetch origin feature/ai-health-sqlite
          git checkout feature/ai-health-sqlite
          git pull --ff-only origin feature/ai-health-sqlite
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f repair_targeted.py .github/workflows/targeted-repair.yml .github/workflows/ai-health-sqlite-fix.yml || true
          if ! git diff --cached --quiet; then git commit -m 'chore: remove temporary repair files [targeted-repair]' && git push origin HEAD:feature/ai-health-sqlite; fi
