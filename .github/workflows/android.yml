name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/ai-health-sqlite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite

      - name: Verify target repository and branch
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/gbrhomidi/station-Abo_Ahmed2.git"
          test "$(git branch --show-current)" = "feature/ai-health-sqlite"
          echo "HEAD at workflow start: $(git rev-parse HEAD)"
          echo "HEAD parent (pre-workflow change): $(git rev-parse HEAD^)"
          test -z "$(git status --porcelain)"
          git status --short --branch

      - name: Repair users and shifts end-to-end contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          ROOT=Path('.')
          MAIN=ROOT/'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt'
          DB=ROOT/'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt'
          USERS=ROOT/'app/src/main/assets/screens/users.html'
          SHIFTS=ROOT/'app/src/main/assets/screens/shifts.html'
          required=[MAIN,DB,USERS,SHIFTS,ROOT/'app/src/main/AndroidManifest.xml',ROOT/'app/build.gradle.kts',ROOT/'build.gradle.kts',ROOT/'settings.gradle.kts',ROOT/'gradle/libs.versions.toml']
          missing=[str(p) for p in required if not p.exists()]
          if missing: raise SystemExit('Required files missing: '+', '.join(missing))

          def once(t,o,n,label):
              c=t.count(o)
              if c!=1: raise SystemExit(f'{label}: expected 1 match, found {c}')
              return t.replace(o,n,1)
          def rgx(t,p,n,label):
              out,c=re.subn(p,n,t,count=1,flags=re.S)
              if c!=1: raise SystemExit(f'{label}: expected 1 match, found {c}')
              return out
          def fn_replace(t,name,body):
              marker='fun '+name+'('
              st=t.find(marker)
              if st<0: raise SystemExit('Missing function: '+name)
              op=t.find('{',st)
              if op<0: raise SystemExit('Missing function body: '+name)
              depth=0; ins=False; inc=False; line=False; block=False; esc=False; i=op
              while i<len(t):
                  c=t[i]; n=t[i+1] if i+1<len(t) else ''
                  if line:
                      if c=='\n': line=False
                  elif block:
                      if c=='*' and n=='/': block=False; i+=1
                  elif ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  elif inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                  else:
                      if c=='/' and n=='/': line=True; i+=1
                      elif c=='/' and n=='*': block=True; i+=1
                      elif c=='"': ins=True
                      elif c=="'": inc=True
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return t[:op]+body+t[i+1:]
                  i+=1
              raise SystemExit('Unbalanced braces: '+name)

