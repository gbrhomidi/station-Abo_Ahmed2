              cls=m.find('class WebAppInterface');op=m.find('{',cls);depth=0;ins=False;inc=False;line=False;block=False;escp=False;i=op;end=None
              while i<len(m):
                  c=m[i];n=m[i+1] if i+1<len(m) else ''
                  if line:
                      if c=='\n':line=False
                  elif block:
                      if c=='*' and n=='/':block=False;i+=1
                  elif ins:
                      if escp:escp=False
                      elif c=='\\':escp=True
                      elif c=='"':ins=False
                  elif inc:
                      if escp:escp=False
                      elif c=='\\':escp=True
                      elif c=="'":inc=False
                  else:
                      if c=='/' and n=='/':line=True;i+=1
                      elif c=='/' and n=='*':block=True;i+=1
                      elif c=='"':ins=True
                      elif c=="'":inc=True
                      elif c=='{':depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:end=i;break
                  i+=1
              if end is None:raise SystemExit('WebAppInterface closing brace not found')
              m=m[:end]+bm+'\n'+m[end:]
          if 'putString("last_uri"' not in m:
              m=once(m,'callback.onReceiveValue(results)','''results?.firstOrNull()?.let { uri ->
                    getSharedPreferences("webview_file_picker", Context.MODE_PRIVATE).edit().putString("last_uri", uri.toString()).apply()
                    try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) }
                    catch (e: SecurityException) { DebugLogger.logException("UserAvatarUriPermission", e) }
                }
                callback.onReceiveValue(results)''','file chooser URI persistence')
          if 'Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION' not in m:
              m=rgx(m,r'(Intent\(Intent\.ACTION_OPEN_DOCUMENT\)\.apply \{)',r'\1\n                                            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)','persistable picker permission')
          MAIN.write_text(m,encoding='utf-8')
          if len(m)<m0*.90:raise SystemExit('MainActivity.kt unexpectedly shortened')

          print('Repair transformations completed without shortening target files.')
          PY

      - name: Static verification and JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          u=Path('app/src/main/assets/screens/users.html').read_text(encoding='utf-8')
          s=Path('app/src/main/assets/screens/shifts.html').read_text(encoding='utf-8')
          m=Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt').read_text(encoding='utf-8')
          d=Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt').read_text(encoding='utf-8')
          checks={
            'branch/company from SQLite': 'getStationsForManagement' in m and 'managementRequired(c,"stations","branch_id")' in d and 'managementRequired(c,"stations","company_id")' in d,
            'full image URI path': 'getLastSelectedFileUri' in m and 'getImageDataUrl' in m and 'putString("last_uri"' in m,
            'role field hidden': '<input id="roleId" type="hidden"' in u and '<select id="roleId"' not in u,
            'job_title derived from employee': 'syncEmployeeDerivedFields' in u and 'employee?.job_title' in u,
            'language persisted from UI': "preferred_language:$(\'preferredLanguage\').value" in u or "preferred_language:$('preferredLanguage').value" in u,
            'cashier uses employee id': 'option.value = person.id ?? person.employee_id ?? "";' in s,
            'cashier does not require user account in UI': 'لا يملك حساب مستخدم مرتبطاً' not in s,
            'cashier SQLite validation uses employees': 'managementCashier' in d and 'cashierEmployeeId' in d,
            'typed shift insert is real SQLite': 'insertOrThrow("shifts"' in d and 'beginTransaction()' in d,
            'one open shift enforced in DB': 'توجد وردية مفتوحة بالفعل لهذه المحطة' in d,
            'open shift is queried from SQLite': 'getOpenShiftForManagement' in d and 'end_time IS NULL' in d,
            'close uses real UPDATE': 'closeOpenShiftForManagement' in d and 'db.update("shifts"' in d,
            'close modal and buttons': 'closeOpenShiftBtn' in s and 'openShiftOverlay' in s and 'confirmCloseOpenShift' in s,
            'users theme': "next==='dark'?'🌞':'🌙'" in u,
            'shifts theme': 'theme === "dark" ? "🌞" : "🌙"' in s,
            'no forbidden Math.random': not any('Math.random(' in x for x in (u,s,m,d)),
          }
          for k,v in checks.items():print(('PASS' if v else 'FAIL')+' — '+k)
          bad=[k for k,v in checks.items() if not v]
          if bad:raise SystemExit('Static contract failure: '+', '.join(bad))
          for path in ('app/src/main/assets/screens/users.html','app/src/main/assets/screens/shifts.html'):
              text=Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              for i,script in enumerate(scripts,1):
                  p=Path('/tmp')/(Path(path).stem+f'-{i}.js');p.write_text(script,encoding='utf-8');subprocess.run(['node','--check',str(p)],check=True)
              print('PASS — JS syntax: '+path)
          PY
          git diff --check
          git diff --stat

      - name: Run Kotlin unit and Robolectric tests
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/diesel-station-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Final Git review, commit and push
        run: |
          set -euo pipefail
          echo '--- git status ---'
          git status --short --branch
          echo '--- git diff --stat ---'
          git diff --stat
          echo '--- changed files ---'
          git diff --name-only
          git diff --check
          allowed='^(app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity\.kt|app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper\.kt|app/src/main/assets/screens/users\.html|app/src/main/assets/screens/shifts\.html|\.github/workflows/android\.yml|\.github/workflows/ai-targeted-repair\.yml)$'
          if git diff --name-only | grep -vE "$allowed"; then echo 'ERROR: unrelated files changed'; exit 1; fi
          # The targeted repair workflow used as a temporary execution aid is removed; android.yml remains the single build workflow.
          rm -f .github/workflows/ai-targeted-repair.yml
          git add app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt app/src/main/assets/screens/users.html app/src/main/assets/screens/shifts.html .github/workflows/android.yml .github/workflows/ai-targeted-repair.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: repair users and shifts SQLite WebView flows"
          git push origin HEAD:feature/ai-health-sqlite
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo 'Push completed to origin/feature/ai-health-sqlite.'
