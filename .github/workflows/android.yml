    // ============================================================
    // Users/Shifts management contracts — all data is SQLite-backed.
    // ============================================================
    private fun managementColumns(table: String): Set<String> {
        val result = linkedSetOf<String>()
        getReadableDatabase().rawQuery("PRAGMA table_info(`$table`)", null).use { cursor ->
            val index = cursor.getColumnIndex("name")
            require(index >= 0) { "تعذر قراءة مخطط جدول $table" }
            while (cursor.moveToNext()) result += cursor.getString(index)
        }
        require(result.isNotEmpty()) { "جدول SQLite غير موجود أو بلا أعمدة: $table" }
        return result
    }
    private fun managementRequired(c: Set<String>, t: String, col: String) { require(col in c) { "جدول $t لا يحتوي العمود المطلوب $col" } }
    private fun managementValue(cursor: android.database.Cursor, vararg names: String): String? { for(n in names){val i=cursor.getColumnIndex(n);if(i>=0&&!cursor.isNull(i))return cursor.getString(i)};return null }
    private fun managementLong(cursor: android.database.Cursor, vararg names: String): Long? { val v=managementValue(cursor,*names)?:return null;return v.toLongOrNull()?:v.toDoubleOrNull()?.toLong() }
    private fun managementInfo(table: String, column: String): Triple<String,Int,String?>? { getReadableDatabase().rawQuery("PRAGMA table_info(`$table`)",null).use{c->val ni=c.getColumnIndex("name");val ti=c.getColumnIndex("type");val nn=c.getColumnIndex("notnull");val di=c.getColumnIndex("dflt_value");while(c.moveToNext()){if(c.getString(ni)==column)return Triple(if(ti>=0&&!c.isNull(ti))c.getString(ti)else"",if(nn>=0)c.getInt(nn)else 0,if(di>=0&&!c.isNull(di))c.getString(di)else null)}};return null }
    private fun managementFk(table: String, column: String): Pair<String,String>? { getReadableDatabase().rawQuery("PRAGMA foreign_key_list(`$table`)",null).use{c->val fi=c.getColumnIndex("from");val ti=c.getColumnIndex("table");val to=c.getColumnIndex("to");while(c.moveToNext())if(fi>=0&&c.getString(fi)==column)return Pair(c.getString(ti),c.getString(to))};return null }
    private fun managementNow(table: String, column: String): Any { val type=managementInfo(table,column)?.first?.uppercase().orEmpty();return if(type.contains("INT")||type.contains("REAL")||type.contains("NUM"))System.currentTimeMillis() else java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ",java.util.Locale.US).format(java.util.Date()) }
    private fun managementPut(v: android.content.ContentValues,c:Set<String>,k:String,x:Any?){if(k !in c||x==null)return;when(x){is Long->v.put(k,x);is Int->v.put(k,x);is Double->v.put(k,x);is Float->v.put(k,x);is Boolean->v.put(k,if(x)1 else 0);else->v.put(k,x.toString())}}
    private fun managementEmployee(id: Long): android.database.Cursor = getReadableDatabase().query("employees",null,"id = ?",arrayOf(id.toString()),null,null,null,"1")
    private fun managementEmployeeActive(c: android.database.Cursor): Boolean { if(managementLong(c,"is_deleted")==1L)return false;if(managementLong(c,"is_active","active")==0L)return false;return managementValue(c,"status","employment_status","employee_status")?.trim()?.lowercase() !in setOf("inactive","terminated","deleted","suspended","resigned") }
    private fun managementCashier(c: android.database.Cursor): Boolean { val a=(managementValue(c,"job_title")?:"").trim().lowercase();val b=(managementValue(c,"job_title_ar")?:"").trim().lowercase();return a.contains("cashier")||b.contains("أمين صندوق") }
    private fun managementStation(c: android.database.Cursor,stationId:Long):Boolean{val s=managementLong(c,"station_id","stationId")?:return true;return s<=0L||s==stationId}
    private fun managementResolveEmployeeRef(employeeId:Long,table:String,column:String):Long{val fk=managementFk(table,column);if(fk?.first?.equals("users",true)==true){var uid=0L;managementEmployee(employeeId).use{if(it.moveToFirst())uid=managementLong(it,"user_id")?:0L};require(uid>0L){"$column في $table يشير إلى users.id لكن الموظف لا يملك user_id المطلوب وفق schema"};return uid};return employeeId}
    private fun managementNextShiftCode(db: android.database.sqlite.SQLiteDatabase):String{var max=0L;db.rawQuery("SELECT shift_code FROM shifts WHERE shift_code IS NOT NULL",null).use{c->while(c.moveToNext()){val m=Regex("(\\d+)$").find(c.getString(0)?:"");if(m!=null)max=maxOf(max,m.groupValues[1].toLongOrNull()?:0L)}};return "SH-"+String.format(java.util.Locale.US,"%06d",max+1)}

    fun getStationsForManagement(): org.json.JSONArray {
        val c=managementColumns("stations");managementRequired(c,"stations","id");managementRequired(c,"stations","branch_id");managementRequired(c,"stations","company_id")
        val out=org.json.JSONArray();val where=if("is_deleted" in c)" WHERE is_deleted=0 OR is_deleted IS NULL" else ""
