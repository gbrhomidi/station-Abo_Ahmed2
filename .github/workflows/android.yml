# ============================================================================
# Build Android APK — Production CI/CD Workflow
# ============================================================================
# Project: station-Abo_Ahmed2
#
# Branch policy
# ----------------------------------------------------------------------------
# main:
#   Validation + Signed Release APK
#
# feature/ai-health-sqlite:
#   Validation ONLY
#   No Release signing
#   No Release keystore
#
# Pull Request -> main:
#   Validation ONLY
#
# workflow_dispatch:
#   Validation is allowed from any ref.
#   Signed Release is allowed ONLY when the selected ref is main.
#
# Security
# ----------------------------------------------------------------------------
# - GITHUB_TOKEN is read-only.
# - Release secrets are available ONLY to the release job.
# - The Release keystore is stored outside the repository workspace.
# - The keystore is never uploaded as an artifact.
# - Keystore cleanup runs even when a previous step fails.
#
# Reliability
# ----------------------------------------------------------------------------
# - Release requires successful validation.
# - Release APK must exist.
# - Release APK must be cryptographically verified with apksigner.
# - SHA256 checksum is generated for the final APK.
#
# Efficiency
# ----------------------------------------------------------------------------
# - Gradle cache enabled.
# - Obsolete runs for the same ref are cancelled.
# - No Validation APK artifact is uploaded.
# - Only the final Release APK + SHA256 are retained.
#
# ============================================================================


name: Build Android APK


# ============================================================================
# WORKFLOW TRIGGERS
# ============================================================================

on:

  # --------------------------------------------------------------------------
  # Push validation
  #
  # main                      -> Validation + Release
  # feature/ai-health-sqlite  -> Validation ONLY
  # --------------------------------------------------------------------------

  push:
    branches:
      - main
      - feature/ai-health-sqlite


  # --------------------------------------------------------------------------
  # Pull Requests targeting main
  #
  # PRs never receive Release signing secrets.
  # --------------------------------------------------------------------------

  pull_request:
    branches:
      - main


  # --------------------------------------------------------------------------
  # Manual execution
  #
  # Validation can be started manually from any selected ref.
  #
  # Release remains protected by:
  #
  #   if: github.ref == 'refs/heads/main'
  #
  # Therefore a manual run from feature/ai-health-sqlite cannot produce
  # a signed production Release APK.
  # --------------------------------------------------------------------------

  workflow_dispatch:


# ============================================================================
# CONCURRENCY
# ============================================================================
#
# Rapid repair commits should not create a queue of obsolete builds.
#
# Example:
#
#   commit A -> running
#   commit B -> running
#   commit C -> newest
#
# Older runs for the same ref are cancelled when the newer run supersedes them.
#
# ============================================================================

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ============================================================================
# GITHUB TOKEN PERMISSIONS
# ============================================================================
#
# This workflow never:
#
#   - pushes commits
#   - creates branches
#   - creates tags
#   - creates releases
#   - modifies issues
#   - modifies pull requests
#
# Therefore repository read access is sufficient.
# ============================================================================

permissions:
  contents: read


# ============================================================================
# GLOBAL GRADLE OPTIONS
# ============================================================================

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true


# ============================================================================
# JOB 1 — VALIDATION
# ============================================================================
#
# No Release signing secrets are available to this job.
#
# Runs for:
#
#   - push -> main
#   - push -> feature/ai-health-sqlite
#   - pull_request -> main
#   - workflow_dispatch
#
# ============================================================================

jobs:

  validate:

    name: Validate Android Project

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------------------

      - name: Checkout Project
        uses: actions/checkout@v4


      # ----------------------------------------------------------------------
      # Java 17 + Gradle cache
      # ----------------------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ----------------------------------------------------------------------
      # Java diagnostic
      # ----------------------------------------------------------------------

      - name: Verify Java version
        run: |
          java -version


      # ----------------------------------------------------------------------
      # Verify Gradle wrapper
      # ----------------------------------------------------------------------

      - name: Verify Gradle wrapper
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew was not found in the repository root."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper configuration was not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper verified successfully."


      # ----------------------------------------------------------------------
      # Verify smoke-test script
      # ----------------------------------------------------------------------

      - name: Verify screen smoke test
        run: |
          set -e

          if [ ! -f "./screen-smoke-test.py" ]; then
            echo "::error::screen-smoke-test.py was not found."
            exit 1
          fi

          python3 --version

          echo "Smoke-test script verified successfully."


      # ----------------------------------------------------------------------
      # Smoke tests
      # ----------------------------------------------------------------------

      - name: Run notification and SMS screens smoke tests
        run: |
          python3 ./screen-smoke-test.py


      # ----------------------------------------------------------------------
      # Kotlin / Robolectric regression tests
      # ----------------------------------------------------------------------

      - name: Run Kotlin and Robolectric regression tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon


      # ----------------------------------------------------------------------
      # Debug compilation
      #
      # This validates Android compilation without accessing Release signing
      # secrets or the production keystore.
      # ----------------------------------------------------------------------

      - name: Compile Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon


# ============================================================================
# JOB 2 — SIGNED PRODUCTION RELEASE
# ============================================================================
#
# Release is intentionally restricted to main.
#
# The gate is:
#
#   if: github.ref == 'refs/heads/main'
#
# Do NOT replace it with:
#
#   github.event_name == 'workflow_dispatch'
#
# because that would allow manual Release signing from a feature branch.
#
# ============================================================================

  release:

    name: Build Signed Release APK

    needs:
      - validate

    # ------------------------------------------------------------------------
    # PRODUCTION RELEASE GATE
    # ------------------------------------------------------------------------

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ----------------------------------------------------------------------
      # Checkout exact revision being released
      # ----------------------------------------------------------------------

      - name: Checkout Project
        uses: actions/checkout@v4


      # ----------------------------------------------------------------------
      # Java 17 + Gradle cache
      # ----------------------------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ----------------------------------------------------------------------
      # Java diagnostic
      # ----------------------------------------------------------------------

      - name: Verify Java version
        run: |
          java -version


      # ----------------------------------------------------------------------
      # Gradle wrapper
      # ----------------------------------------------------------------------

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew


      # ======================================================================
      # RELEASE SIGNING SECRETS
      # ======================================================================
      #
      # These secrets are intentionally scoped only to this job.
      # ======================================================================

      - name: Verify signing secrets exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -e

          missing=0

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_BASE64"
            missing=1
          fi

          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_PASSWORD"
            missing=1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "::error::Missing secret: RELEASE_KEY_ALIAS"
            missing=1
          fi

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing secret: RELEASE_KEY_PASSWORD"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more Release signing secrets are missing."
            exit 1
          fi

          echo "All required Release signing secrets are present."


      # ======================================================================
      # DECODE RELEASE KEYSTORE
      # ======================================================================
      #
      # The keystore is placed under RUNNER_TEMP rather than inside the
      # repository workspace.
      # ======================================================================

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

        run: |
          set -e

          umask 077

          KEYSTORE="$RUNNER_TEMP/station-release.keystore"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          if [ ! -s "$KEYSTORE" ]; then
            echo "::error::Decoded Release keystore is empty."
            rm -f "$KEYSTORE"
            exit 1
          fi

          chmod 600 "$KEYSTORE"

          echo "Release keystore decoded successfully."


      # ======================================================================
      # SIGNED RELEASE BUILD
      # ======================================================================

      - name: Clean and Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/station-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          ./gradlew clean assembleRelease --no-daemon


      # ======================================================================
      # LOCATE FINAL RELEASE APK
      # ======================================================================

      - name: Locate Release APK
        id: apk

        run: |
          set -e

          mapfile -t APKS < <(
            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              ! -name "*-unsigned.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No signed Release APK was produced."
            exit 1
          fi

          if [ "${#APKS[@]}" -gt 1 ]; then
            echo "::error::More than one Release APK was produced."

            printf '%s\n' "${APKS[@]}"

            echo "::error::The workflow expects exactly one Release APK."
            exit 1
          fi

          APK="${APKS[0]}"

          echo "APK=$APK" >> "$GITHUB_OUTPUT"

          echo "Release APK:"
          echo "$APK"


      # ======================================================================
      # VERIFY APK SIGNATURE
      # ======================================================================

      - name: Verify APK Signature
        env:
          APK: ${{ steps.apk.outputs.APK }}

        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools"

          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          APKSIGNER="$(
            find "$BUILD_TOOLS_DIR" \
              -maxdepth 2 \
              -type f \
              -name "apksigner" \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          echo "Using apksigner:"
          echo "$APKSIGNER"

          echo
          echo "===== APK SIGNATURE VERIFICATION ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"


      # ======================================================================
      # GENERATE SHA256 CHECKSUM
      # ======================================================================

      - name: Generate SHA256 Checksum
        env:
          APK: ${{ steps.apk.outputs.APK }}

        run: |
          set -e

          mkdir -p release-metadata

          sha256sum "$APK" \
            | tee release-metadata/SHA256SUMS.txt

          echo
          echo "===== APK INFORMATION ====="

          ls -lh "$APK"

          echo
          echo "===== SHA256 ====="

          cat release-metadata/SHA256SUMS.txt


      # ======================================================================
      # PREPARE FINAL RELEASE ARTIFACT
      # ======================================================================

      - name: Prepare Release Artifact
        env:
          APK: ${{ steps.apk.outputs.APK }}

        run: |
          set -e

          mkdir -p release-artifact

          cp "$APK" \
            release-artifact/Station_Abo_Ahmed_Release.apk

          cp release-metadata/SHA256SUMS.txt \
            release-artifact/SHA256SUMS.txt

          echo "===== FINAL RELEASE ARTIFACT ====="

          ls -lah release-artifact


      # ======================================================================
      # CLEAN SIGNING MATERIAL
      # ======================================================================
      #
      # Always execute, including after build/signature failures.
      # ======================================================================

      - name: Clean Signing Material
        if: always()

        run: |
          KEYSTORE="$RUNNER_TEMP/station-release.keystore"

          if [ -f "$KEYSTORE" ]; then
            rm -f "$KEYSTORE"
            echo "Release keystore removed from runner temporary storage."
          else
            echo "Release keystore was already absent."
          fi


      # ======================================================================
      # UPLOAD ONLY FINAL RELEASE ARTIFACTS
      # ======================================================================
      #
      # Uploaded files:
      #
      #   Station_Abo_Ahmed_Release.apk
      #   SHA256SUMS.txt
      #
      # No debug APK.
      # No intermediate files.
      # No keystore.
      # ======================================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4

        with:
          name: Station_Abo_Ahmed_Release_APK
          path: release-artifact/*
          if-no-files-found: error
          retention-days: 14
