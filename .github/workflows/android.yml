        val result=searchUsers(query,status,roleId,stationId,page,pageSize);val rows=result.optJSONArray("data")?:result.optJSONArray("rows")
        if(rows!=null){for(i in 0 until rows.length()){val row=rows.optJSONObject(i)?:continue;val id=row.optLong("id",row.optLong("user_id",0L));if(id>0L){getUserById(id)?.let{p->val keys=p.keys();while(keys.hasNext()){val k=keys.next();if(!row.has(k)||row.isNull(k))row.put(k,p.opt(k))}}};val sid=row.optLong("station_id",0L);if(sid>0L){getReadableDatabase().query("stations",null,"id = ?",arrayOf(sid.toString()),null,null,null,"1").use{c->if(c.moveToFirst()){managementValue(c,"station_name_ar","name_ar")?.let{row.put("station_name_ar",it)};managementValue(c,"station_name","name")?.let{row.put("station_name",it)};row.put("branch_id",managementLong(c,"branch_id"));row.put("company_id",managementLong(c,"company_id"));managementValue(c,"branch_name_ar","branch_name")?.let{row.put("branch_name_ar",it)};managementValue(c,"branch_name","branch_name_ar")?.let{row.put("branch_name",it)};managementValue(c,"company_name_ar","company_name")?.let{row.put("company_name_ar",it)};managementValue(c,"company_name","company_name_ar")?.let{row.put("company_name",it)}}};};val eid=row.optLong("employee_id",0L);if(eid>0L){managementEmployee(eid).use{c->if(c.moveToFirst()){managementValue(c,"job_title")?.let{row.put("job_title",it)};managementValue(c,"job_title_ar")?.let{row.put("job_title_ar",it)};managementValue(c,"department","department_name")?.let{row.put("department",it)}}};};val title=row.optString("job_title").trim();if(title.isNotBlank())row.put("role",title)}}};return result
    }

    fun prepareUserManagementPayload(input:org.json.JSONObject):org.json.JSONObject {
        val data=org.json.JSONObject(input.toString());val employeeId=data.optLong("employee_id",0L);require(employeeId>0L){"يجب تحديد الموظف المرتبط بالمستخدم"};val uc=managementColumns("users");managementRequired(uc,"users","employee_id")
        managementEmployee(employeeId).use{c->require(c.moveToFirst()){ "الموظف المحدد غير موجود في SQLite" };require(managementEmployeeActive(c)){"الموظف المحدد غير نشط"};val title=managementValue(c,"job_title")?.trim().orEmpty();require(title.isNotBlank()){"الموظف المحدد لا يملك employees.job_title"};if("job_title" in uc)data.put("job_title",title);if("department" in uc)managementValue(c,"department","department_name")?.let{data.put("department",it)};if("role" in uc)data.put("role",title)else data.remove("role");}
        if("role_id" in uc){var matched=0L;if("roles" in managementTables()){getReadableDatabase().query("roles",null,null,null,null,null,"id").use{c->while(c.moveToNext()){val n=managementValue(c,"role_name_ar","role_name","role_code")?.trim().orEmpty();if(n.equals(data.optString("job_title").trim(),true)){matched=managementLong(c,"id")?:managementLong(c,"role_id")?:0L;if(matched>0)break}}}};val info=managementInfo("users","role_id");val requiredRole=info?.second==1&&info.third==null;if(matched>0)data.put("role_id",matched)else if(requiredRole)throw IllegalStateException("لا يوجد roles مطابق لـ employees.job_title: "+data.optString("job_title"))else data.remove("role_id")}
        val stationId=data.optLong("station_id",0L);if(stationId>0L){val sc=managementColumns("stations");managementRequired(sc,"stations","branch_id");managementRequired(sc,"stations","company_id");getReadableDatabase().query("stations",null,"id = ?",arrayOf(stationId.toString()),null,null,null,"1").use{c->require(c.moveToFirst()){ "المحطة المحددة غير موجودة في SQLite" };if("branch_id" in uc)managementLong(c,"branch_id")?.let{data.put("branch_id",it)};if("company_id" in uc)managementLong(c,"company_id")?.let{data.put("company_id",it)}}}
        return data
    }
    private fun managementTables():Set<String>{val out=linkedSetOf<String>();getReadableDatabase().rawQuery("SELECT name FROM sqlite_master WHERE type='table'",null).use{c->while(c.moveToNext())out+=c.getString(0)};return out}

    fun getShiftFormContextForManagement(userId:Long):org.json.JSONObject{val result=getShiftFormContext(userId);val station=result.optJSONObject("station")?.optLong("id",0L)?:result.optLong("station_id",0L);result.put("cashiers",getCashiersForManagement(station));return result}
    fun getCashiersForManagement(stationId:Long):org.json.JSONArray{val c=managementColumns("employees");managementRequired(c,"employees","id");managementRequired(c,"employees","job_title");val out=org.json.JSONArray();getReadableDatabase().query("employees",null,null,null,null,null,"id").use{cur->while(cur.moveToNext()){if(!managementEmployeeActive(cur)||!managementCashier(cur))continue;if(stationId>0&&!managementStation(cur,stationId))continue;val id=managementLong(cur,"id")?:continue;val o=org.json.JSONObject();o.put("id",id);o.put("employee_id",id);managementValue(cur,"full_name_ar","full_name","name","employee_name")?.let{o.put("full_name_ar",it)};managementValue(cur,"full_name","name","employee_name")?.let{o.put("full_name",it)};managementValue(cur,"job_title")?.let{o.put("job_title",it)};managementValue(cur,"job_title_ar")?.let{o.put("job_title_ar",it)};managementLong(cur,"user_id")?.let{o.put("user_id",it)};o.put("cashier_id",id);out.put(o)}}};return out}

    fun saveShiftRecordTypedForManagement(stationId:Int,branchIdFromUi:Int,shiftType:String,startTime:String,managerId:Long,cashierEmployeeId:Long,attendantIds:String,openingCash:Double,openingBank:Double,openingCredit:Double,remarks:String,currentUserId:Long):Long{
        val db=getWritableDatabase();val c=managementColumns("shifts");managementRequired(c,"shifts","id");managementRequired(c,"shifts","station_id");managementRequired(c,"shifts","shift_code");managementRequired(c,"shifts","cashier_id");managementRequired(c,"shifts","start_time");require(stationId>0){"معرف المحطة غير صالح"};require(cashierEmployeeId>0){"يجب تحديد أمين الصندوق"}
        managementEmployee(cashierEmployeeId).use{cur->require(cur.moveToFirst()){"أمين الصندوق المحدد غير موجود في employees"};require(managementEmployeeActive(cur)){"أمين الصندوق المحدد غير نشط"};require(managementCashier(cur)){"الموظف المحدد لا يملك employees.job_title كأمين صندوق/CASHIER"};require(managementStation(cur,stationId.toLong())){"أمين الصندوق لا يتبع المحطة الحالية"}}
        val storedCashier=managementResolveEmployeeRef(cashierEmployeeId,"shifts","cashier_id");val attendants=attendantIds.split(',').map{it.trim()}.filter{it.isNotBlank()}.map{it.toLongOrNull()?:throw IllegalArgumentException("attendant_ids يحتوي معرفاً غير صالح: $it")}.distinct()
        for(eid in attendants)managementEmployee(eid).use{cur->require(cur.moveToFirst()){"العامل $eid غير موجود في employees"};require(managementEmployeeActive(cur)){"العامل $eid غير نشط"};require(managementStation(cur,stationId.toLong())){"العامل $eid لا يتبع المحطة الحالية"}}
        db.beginTransaction();try{
            val openWhere=buildString{append("station_id = ? AND (end_time IS NULL OR TRIM(CAST(end_time AS TEXT)) = '' OR end_time = 0)");if("is_deleted" in c)append(" AND (is_deleted = 0 OR is_deleted IS NULL)")};db.query("shifts",arrayOf("id"),openWhere,arrayOf(stationId.toString()),null,null,"start_time ASC","1").use{cur->if(cur.moveToFirst())throw IllegalStateException("توجد وردية مفتوحة بالفعل لهذه المحطة؛ يجب إغلاقها قبل إنشاء وردية جديدة")}
            val v=android.content.ContentValues();managementPut(v,c,"shift_code",managementNextShiftCode(db));managementPut(v,c,"shift_date",startTime.take(10));managementPut(v,c,"station_id",stationId.toLong());if(branchIdFromUi>0)managementPut(v,c,"branch_id",branchIdFromUi.toLong());managementPut(v,c,"shift_type",shiftType);managementPut(v,c,"start_time",startTime);managementPut(v,c,"manager_id",managerId.takeIf{it>0});managementPut(v,c,"cashier_id",storedCashier);if("attendant_ids" in c)managementPut(v,c,"attendant_ids",attendantIds);managementPut(v,c,"opening_cash",openingCash);managementPut(v,c,"opening_bank",openingBank);managementPut(v,c,"opening_credit",openingCredit);if(remarks.isNotBlank()){managementPut(v,c,"remarks",remarks);managementPut(v,c,"variance_reason",remarks)};if("status" in c){val type=managementInfo("shifts","status")?.first?.uppercase().orEmpty();managementPut(v,c,"status",if(type.contains("INT"))1 else "open")};if("is_open" in c)managementPut(v,c,"is_open",1);if("created_by" in c)managementPut(v,c,"created_by",currentUserId.takeIf{it>0});if("created_at" in c)managementPut(v,c,"created_at",managementNow("shifts","created_at"));if("uuid" in c)managementPut(v,c,"uuid",java.util.UUID.randomUUID().toString())
            val id=db.insertOrThrow("shifts",null,v);if("attendant_ids" !in c&&attendants.isNotEmpty()){val rel=managementAttendantRelation()?:throw IllegalStateException("لا يوجد attendant_ids ولا جدول علاقة موثق للعاملين");val rc=managementColumns(rel.first);for(eid in attendants){val rid=if(rel.second.second.equals("user_id",true))managementResolveEmployeeRef(eid,rel.first,rel.second.second)else eid;val rv=android.content.ContentValues();managementPut(rv,rc,rel.second.first,id);managementPut(rv,rc,rel.second.second,rid);db.insertOrThrow(rel.first,null,rv)}};db.setTransactionSuccessful();return id
        }finally{db.endTransaction()}
    }
    private fun managementAttendantRelation():Pair<String,Pair<String,String>>?{val tables=managementTables();for(t in tables){val n=t.lowercase();if(!(n.contains("shift")&&(n.contains("attendant")||n.contains("employee")||n.contains("worker")||n.contains("staff"))))continue;val c=managementColumns(t);val sc=c.firstOrNull{it.equals("shift_id",true)||it.equals("shiftId",true)}?:continue;val pc=c.firstOrNull{it.equals("employee_id",true)||it.equals("attendant_id",true)||it.equals("worker_id",true)||it.equals("staff_id",true)||it.equals("user_id",true)}?:continue;return Pair(t,Pair(sc,pc))};return null}

