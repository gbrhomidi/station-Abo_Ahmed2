name: Build Android APK

on:
  push:
    branches:
      - feature/ai-health-sqlite

jobs:
  export-source:
    name: Export source for authorized repair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package source files
        run: |
          set -euo pipefail
          mkdir -p audit-source/app/src/main/java/com/aistudio/dieselstationsms/kxmpzq
          mkdir -p audit-source/app/src/main/assets/screens
          mkdir -p audit-source/.github/workflows
          cp app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt audit-source/app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          cp app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt audit-source/app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          cp app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/QueryUtils.kt audit-source/app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/QueryUtils.kt
          cp app/src/main/assets/screens/fuel-sales.html audit-source/app/src/main/assets/screens/fuel-sales.html
          cp app/src/main/assets/screens/deliveries.html audit-source/app/src/main/assets/screens/deliveries.html
          cp app/src/main/assets/screens/orders.html audit-source/app/src/main/assets/screens/orders.html
          cp app/src/main/assets/screens/sales-log.html audit-source/app/src/main/assets/screens/sales-log.html
          cp app/src/main/assets/main.html audit-source/app/src/main/assets/main.html
          cp .github/workflows/android.yml audit-source/.github/workflows/android.yml
          find audit-source -type f -print | sort

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase2-source-audit
          path: audit-source
          if-no-files-found: error
          retention-days: 1
