name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/ai-health-sqlite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite

      - name: Verify target repository and branch
        run: |
          set -euo pipefail
          origin="$(git remote get-url origin)"
          case "$origin" in
            https://github.com/gbrhomidi/station-Abo_Ahmed2|https://github.com/gbrhomidi/station-Abo_Ahmed2.git) ;;
            *) echo "ERROR: wrong origin: $origin"; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "feature/ai-health-sqlite"
          test -z "$(git status --porcelain)"
          echo "HEAD before repair: $(git rev-parse HEAD)"

      - name: Execute the existing repair implementation from history
        run: |
          set -euo pipefail
          git show 33b705ecdc993761e5465c63beac5bf2ddf6948b:.github/workflows/ai-targeted-repair.yml > /tmp/ai-repair.yml
          sed -n "/python3 - <<'PY'/,/^          PY$/p" /tmp/ai-repair.yml | sed '1d;$d' | sed 's/^          //' > /tmp/repair.py
          test -s /tmp/repair.py
          python3 /tmp/repair.py

      - name: Static, HTML/JavaScript and project integrity checks
        run: |
          set -euo pipefail
          python3 screen-smoke-test.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('app/src/main/assets/screens/users.html'),
              Path('app/src/main/assets/screens/shifts.html'),
              Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt'),
              Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt'),
          ]
          checks = []
          users, shifts, main, db = [p.read_text(encoding='utf-8') for p in files]
          checks += [
              ('getStationsForManagement' in main and 'branch_id' in db and 'company_id' in db, 'stations branch/company SQLite contract'),
              ('<input id="roleId" type="hidden"' in users and '<select id="roleId"' not in users, 'hidden role field'),
              ('syncEmployeeDerivedFields' in users and 'employee?.job_title' in users, 'employee job_title source'),
              ('getLastSelectedFileUri' in main and 'getImageDataUrl' in main and 'last_uri' in main, 'avatar URI persistence/read bridge'),
              ('saveShiftRecordTypedForManagement' in main and 'cashierEmployeeId' in db, 'employee-based cashier save contract'),
              ('closeOpenShiftForManagement' in main and 'db.update("shifts"' in db, 'real SQLite close update'),
              ('openShiftOverlay' in shifts and 'confirmCloseOpenShift' in shifts, 'real open-shift modal'),
              ('لا يملك حساب مستخدم مرتبطاً' not in shifts, 'no employee-user cashier validation'),
              (not any(x in users for x in ('Math.random(', 'TODO', 'Mock Data', 'Fake Data')), 'no fake user data'),
              (not any(x in shifts for x in ('Math.random(', 'TODO', 'Mock Data', 'Fake Data')), 'no fake shift data'),
          ]
          failed=[]
          for ok,label in checks:
              print(('PASS' if ok else 'FAIL')+' — '+label)
              if not ok: failed.append(label)
          if failed: raise SystemExit('Contract checks failed: '+', '.join(failed))
          for p in files[:2]:
              text=p.read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
              for n,script in enumerate(scripts,1):
                  q=Path('/tmp')/(p.stem+f'-{n}.js')
                  q.write_text(script,encoding='utf-8')
                  import subprocess
                  subprocess.run(['node','--check',str(q)],check=True)
              print('PASS — JavaScript syntax: '+str(p))
          PY
          git diff --check
          git diff --stat

      - name: Kotlin unit tests and release build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Restore canonical single build workflow and commit project fixes
        run: |
          set -euo pipefail
          git checkout 3b8a54b1f74e5f28839a8454ab87cb1ea4e9d529 -- .github/workflows/android.yml
          test -z "$(git diff --name-only | grep -vE '^(app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity\.kt|app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper\.kt|app/src/main/assets/screens/users\.html|app/src/main/assets/screens/shifts\.html|\.github/workflows/android\.yml)$' || true)"
          git add app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt app/src/main/assets/screens/users.html app/src/main/assets/screens/shifts.html
          git diff --cached --check
          git diff --cached --stat
          git status --short --branch
          git commit -m "fix: repair users and shifts SQLite WebView flows"
          git push origin HEAD:feature/ai-health-sqlite
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "PUSH_STATUS=PASS"
