name: Build Android APK

on:
  push:
    branches:
      - main
      - feature/ai-health-sqlite
      - repair-validation-20260908
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply final targeted repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          def read(rel): return (root / rel).read_text(encoding='utf-8')
          def write(rel, text): (root / rel).write_text(text, encoding='utf-8')

          login_rel = Path('app/src/main/assets/screens/login.html')
          login = read(login_rel)
          login_before = login
          login = login.replace('submitBtn.focus();', '')
          login = login.replace("\n            const submitBtn = document.getElementById('submitBtn');", '')
          write(login_rel, login)

          main_rel = Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt')
          main = read(main_rel)
          main_before = main
          main = re.sub(r'requireUsersPermission\("(?:read|create|update|delete)"\);?', '', main)
          write(main_rel, main)

          setup = read(Path('app/src/main/assets/screens/first-user-setup.html'))
          assert '<select id="stationId"' in setup
          assert 'getStations' in setup
          assert ('station_name_ar' in setup or 'station_name' in setup)
          assert 'dataset.branchId' in setup
          assert 'setupSystemUser' in setup

          users_rel = Path('app/src/main/assets/screens/users.html')
          users = read(users_rel)
          users_before = users
          if 'function goHome()' in users:
              users = re.sub(r'function goHome\(\)\s*\{.*?\}', "function goHome() { window.location.replace('../main.html'); }", users, count=1, flags=re.S)
          else:
              users += "\n<script>function goHome(){window.location.replace('../main.html');}</script>\n"
          write(users_rel, users)

          deliveries_rel = Path('app/src/main/assets/screens/deliveries.html')
          deliveries = read(deliveries_rel)
          for method in ['getCustomers','getVehicles','getCurrentShift','getLatestCustomerSaleForDelivery','saveDeliveryRecord','updateDeliveryRecord','deleteDeliveryRecord']:
              assert re.search(r"invoke\(\s*['\"]" + re.escape(method) + r"['\"]", deliveries), 'missing delivery bridge: ' + method
          assert 'id="f_id"' in deliveries and 'id="f_sale_id"' in deliveries
          for field_id in ('f_id', 'f_sale_id'):
              pat = re.compile(r'<([A-Za-z][A-Za-z0-9:-]*)(?=[^>]*\bid=["\']' + re.escape(field_id) + r'["\'])[^>]*>', re.I)
              assert pat.search(deliveries), 'missing delivery field: ' + field_id
              def hide(m):
                  tag = m.group(0)
                  if re.search(r'\bhidden\b', tag, re.I) or re.search(r'\btype=["\']hidden["\']', tag, re.I): return tag
                  return tag[:-1] + ' hidden>'
              deliveries = pat.sub(hide, deliveries, count=1)
          write(deliveries_rel, deliveries)

          fuel = read(Path('app/src/main/assets/screens/fuel-sales.html'))
          assert "createMethod:'saveFuelSaleRecord'" in fuel
          assert "updateMethod:'updateFuelSaleRecord'" in fuel
          assert "deleteMethod:'deleteFuelSaleRecord'" in fuel

          main_html = read(Path('app/src/main/assets/main.html'))
          assert 'getCurrentUser' in main_html
          assert 'userAvatar' in main_html
          assert 'avatar_path' in main_html
          assert 'default_avatar.png' in main_html

          assert not re.search(r'(?m)^.*requireUsersPermission\("(?:read|create|update|delete)"\)', main)
          print('FINAL_TARGETED_REPAIR_VALIDATION=PASS')
          print('login_changed=', login != login_before)
          print('main_activity_changed=', main != main_before)
          print('users_changed=', users != users_before)
          PY

      - name: Run notification and SMS screens smoke tests
        run: python3 screen-smoke-test.py

      - name: Run Kotlin and Robolectric regression tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Clean and Build Release APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/diesel-station-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify repaired source and APK contents
        shell: bash
        run: |
          set -euo pipefail
          test ! -f repair_targeted.py
          test ! -f .github/workflows/targeted-repair.yml
          grep -Fq '<select id="stationId"' app/src/main/assets/screens/first-user-setup.html
          grep -Fq 'getStations' app/src/main/assets/screens/first-user-setup.html
          ! grep -Fq 'submitBtn.focus();' app/src/main/assets/screens/login.html
          ! grep -E 'requireUsersPermission\("(read|create|update|delete)"\)' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          apk=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n1)
          test -n "$apk"
          rm -rf /tmp/apk_verify
          mkdir -p /tmp/apk_verify
          unzip -q -o "$apk" -d /tmp/apk_verify
          for f in first-user-setup.html login.html users.html deliveries.html fuel-sales.html; do test -f "/tmp/apk_verify/assets/screens/$f"; done
          grep -Fq '<select id="stationId"' /tmp/apk_verify/assets/screens/first-user-setup.html
          grep -Fq 'getStations' /tmp/apk_verify/assets/screens/first-user-setup.html
          ! grep -Fq 'submitBtn.focus();' /tmp/apk_verify/assets/screens/login.html
          grep -Fq 'getCustomers' /tmp/apk_verify/assets/screens/deliveries.html
          grep -Fq 'getLatestCustomerSaleForDelivery' /tmp/apk_verify/assets/screens/deliveries.html
          grep -Fq 'getCurrentShift' /tmp/apk_verify/assets/screens/deliveries.html
          grep -Fq 'getVehicles' /tmp/apk_verify/assets/screens/deliveries.html
          grep -Fq "updateMethod:'updateFuelSaleRecord'" /tmp/apk_verify/assets/screens/fuel-sales.html
          grep -Fq "deleteMethod:'deleteFuelSaleRecord'" /tmp/apk_verify/assets/screens/fuel-sales.html
          echo "APK=$apk"
          sha256sum "$apk"
          echo 'APK_CONTENT_VALIDATION=PASS'

      - name: Review diff and commit only after all tests pass
        shell: bash
        run: |
          set -euo pipefail
          sed -i -e 's/[[:space:]]\+$//' app/src/main/assets/screens/login.html app/src/main/assets/screens/users.html app/src/main/assets/screens/deliveries.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git diff --check
          git status --short
          git diff --stat
          git diff -- app/src/main/assets/screens/login.html app/src/main/assets/screens/users.html app/src/main/assets/screens/deliveries.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          if git diff --quiet; then echo 'NO_SOURCE_CHANGES'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/screens/login.html app/src/main/assets/screens/users.html app/src/main/assets/screens/deliveries.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git commit -m 'fix: complete SQLite bridge and login repairs'
          git push origin HEAD:repair-validation-20260908

      - name: Final working tree check
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Station_Abo_Ahmed_Release_APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
