name: Build Android APK

on:
  push:
    branches:
      - tmp/apply-gg-20260911
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gg-and-verify:
    name: Apply gg.txt and verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply gg.txt changes to target HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/ai-health-sqlite
          git checkout --detach origin/feature/ai-health-sqlite
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/screens/settings.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('                        <p>قيم فعلية من جدول system_settings</p>\n', ''),
              ('                        <p>الاستعلام الفعلي يستخدم AndroidInterface.getUsers() المرتبط بجدول users</p>\n', ''),
              ("                case 'getUsers':\n                    raw = bridge.getUsers();\n                    break;", "                case 'getAllSystemSettingsMap':\n                    raw = bridge.getAllSystemSettingsMap();\n                    break;\n                case 'setSystemSetting':\n                    raw = bridge.setSystemSetting(String(payload.key), String(payload.value));\n                    break;\n                case 'searchUsers':\n                    raw = bridge.searchUsers(JSON.stringify(payload || {}));\n                    break;\n                case 'getUsers':\n                    raw = bridge.getUsers();\n                    break;"),
              ("            const values = dataOf(await bridgeCall('getAllSettingsMap')) || {};", "            const values = dataOf(await bridgeCall('getAllSystemSettingsMap')) || {};"),
              ("                await bridgeCall('setSetting', {key, value});", "                await bridgeCall('setSystemSetting', {key, value});"),
              ("        const query = el('searchInput').value.trim().toLowerCase();\n\n        showLoading(true);\n        try {\n            const result = dataOf(await bridgeCall('getUsers'));\n            cachedUsers = Array.isArray(result) ? result : [];\n            renderUsers(cachedUsers, query);\n            el('statUsers').textContent = filterUsers(cachedUsers, query).length;\n            el('userSearchBadge').textContent = filterUsers(cachedUsers, query).length;", "        const query = el('searchInput').value.trim();\n\n        showLoading(true);\n        try {\n            const result = await bridgeCall('searchUsers', {query, page: 1, pageSize: 100});\n            cachedUsers = dataOf(result)?.data || [];\n            renderUsers(cachedUsers, '');\n            el('statUsers').textContent = cachedUsers.length;\n            el('userSearchBadge').textContent = cachedUsers.length;"),
          ]
          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'gg settings replacement expected 1 match, found {n}: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Applied gg.txt settings changes exactly once.')
          PY

      - name: Verify five-file integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              'app/src/main/assets/screens/settings.html',
              'app/src/main/assets/screens/users.html',
              'app/src/main/assets/screens/shifts.html',
              'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt',
              'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt',
          ]
          for f in files:
              if not Path(f).is_file(): raise SystemExit(f'Missing required file: {f}')
              print('PASS — file exists:', f)
          settings = Path(files[0]).read_text(encoding='utf-8')
          users = Path(files[1]).read_text(encoding='utf-8')
          shifts = Path(files[2]).read_text(encoding='utf-8')
          main = Path(files[3]).read_text(encoding='utf-8')
          db = Path(files[4]).read_text(encoding='utf-8')
          checks = {
              'settings': ('getAllSystemSettingsMap' in settings and 'setSystemSetting' in settings and "bridgeCall('searchUsers'" in settings),
              'users': ('avatar_file_name' in users and re.search(r'<input[^>]+id=["\']roleId["\'][^>]+type=["\']hidden["\']', users, re.I) is not None and '<select id="roleId"' not in users),
              'shifts': ('cashier_employee_id' in shifts and 'employees.id' in shifts and 'لا يملك حساب مستخدم مرتبطاً' not in shifts),
              'MainActivity': ('getAllSystemSettingsMap' in main and 'setSystemSetting' in main),
              'DatabaseHelper': ('const val VERSION = 36' in db and 'cashier_employee_id' in db and 'fun saveShiftRecordTypedForManagement' in db),
          }
          for k,v in checks.items():
              print(('PASS' if v else 'FAIL') + ' — ' + k)
              if not v: raise SystemExit(1)
          for path in ('app/src/main/assets/screens/users.html','app/src/main/assets/screens/shifts.html','app/src/main/assets/screens/settings.html'):
              text = Path(path).read_text(encoding='utf-8')
              for i, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I), 1):
                  q = Path('/tmp') / (Path(path).stem + f'-{i}.js')
                  q.write_text(script, encoding='utf-8')
                  import subprocess
                  subprocess.run(['node','--check',str(q)], check=True)
              print('PASS — JavaScript syntax:', path)
          PY
          python3 ./screen-smoke-test.py
          ./gradlew testDebugUnitTest --no-daemon
          ./gradlew assembleDebug --no-daemon
          git diff --check

      - name: Commit and push only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/screens/settings.html app/src/main/assets/screens/users.html app/src/main/assets/screens/shifts.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "fix: integrate gg SQLite and WebView repairs"
          git push origin HEAD:feature/ai-health-sqlite
          echo "Pushed verified commit: $(git rev-parse HEAD)"
