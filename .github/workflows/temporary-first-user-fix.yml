name: Temporary First User Setup Fix

on:
  push:
    branches:
      - feature/ai-health-sqlite
    paths:
      - .github/workflows/temporary-first-user-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: ${{ ! startsWith(github.event.head_commit.message, 'fix: first-user setup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-health-sqlite
          fetch-depth: 0
      - name: Apply targeted first-user setup fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/screens/first-user-setup.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('overflow: hidden;\n            border: 1px solid rgba(255, 255, 255, .7);', 'overflow: visible;\n            border: 1px solid rgba(255, 255, 255, .7);', 1)
          marker = '''        .field input:focus {\n            border-color: var(--blue);'''
          insert = '''        .field select {\n            width: 100%;\n            padding: 12px 42px 12px 14px;\n            border: 1.5px solid var(--border);\n            border-radius: var(--radius-input);\n            background: #fff;\n            color: var(--text-primary);\n            font: inherit;\n            font-size: .95rem;\n            font-weight: 600;\n            outline: none;\n            text-align: center;\n            text-align-last: center;\n            transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);\n            appearance: auto;\n        }\n        .field select:focus {\n            border-color: var(--blue);\n            box-shadow: 0 0 0 4px rgba(25, 118, 184, .15);\n        }\n        .field select:disabled {\n            background: #eef4f8;\n            color: var(--text-muted);\n            cursor: not-allowed;\n        }\n\n''' + marker
          if marker in s and '.field select:focus {' not in s:
              s = s.replace(marker, insert, 1)
          s = s.replace('type="number" required min="1" step="1" readonly placeholder="يُعبأ تلقائياً من المحطة"', 'type="number" required min="1" step="1" inputmode="numeric" autocomplete="off" placeholder="أدخل رقم الفرع أو راجعه"')
          s = s.replace("else if(field.id==='phone'&&!/^\\+?[0-9 ]{7,20}$/.test(v))m='رقم الهاتف يجب أن يحتوي على أرقام فقط.';", "else if(field.id==='phone'&&!/^\\d{7,20}$/.test(v))m='رقم الهاتف يجب أن يحتوي على أرقام فقط (7 إلى 20 رقماً).';")
          old_listener = '''field.addEventListener('input',function(){if(field.id==='stationId'||field.id==='branchId'||field.id==='phone'||field.id==='username')validateFieldLive(field);});field.addEventListener('change',function(){validateFieldLive(field);});'''
          new_listener = '''field.addEventListener('input',function(){\n                    if(field.id==='phone'){\n                        const digits=String(field.value||'').replace(/\\D/g,'').slice(0,20);\n                        if(field.value!==digits)field.value=digits;\n                        field.classList.remove('input-error');\n                    }\n                    if(field.id==='stationId'||field.id==='branchId'||field.id==='username'){\n                        field.classList.remove('input-error');\n                    }\n                });\n                field.addEventListener('change',function(){validateFieldLive(field);});\n                field.addEventListener('blur',function(){if(field.value.trim())validateFieldLive(field);});'''
          if old_listener in s:
              s = s.replace(old_listener, new_listener, 1)
          marker2 = '''                document.getElementById('setupForm').addEventListener('submit', saveFirstUser);'''
          enter = '''                document.getElementById('username').addEventListener('keydown', function(event){\n                    if(event.key==='Enter'){\n                        event.preventDefault();\n                        document.getElementById('password').focus();\n                    }\n                });\n                document.getElementById('setupForm').addEventListener('submit', saveFirstUser);'''
          if marker2 in s and "getElementById('username').addEventListener('keydown'" not in s:
              s = s.replace(marker2, enter, 1)
          old_func = '''function keepSaveButtonAboveKeyboard(){const a=document.querySelector('.actions');if(!a)return;const v=window.visualViewport;const k=v?Math.max(0,window.innerHeight-v.height-v.offsetTop):0;a.style.bottom=(12+k)+'px';}'''
          new_func = '''function keepSaveButtonAboveKeyboard(){const a=document.querySelector('.actions');if(!a)return;const v=window.visualViewport;const k=v?Math.max(0,window.innerHeight-(v.height+v.offsetTop)):0;const safe=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom'))||0;a.style.bottom=(Math.max(12,safe)+k)+'px';}'''
          s = s.replace(old_func, new_func)
          s = s.replace("document.getElementById('stationHint').textContent=rows.length?'اختر المحطة وسيتم تعبئة رقم الفرع تلقائياً.':'لا توجد محطات في قاعدة البيانات.'", "document.getElementById('stationHint').textContent=rows.length?'اختر المحطة وسيتم تعبئة رقم الفرع إن كان محفوظاً، ويمكنك إدخاله أو تعديله يدوياً.':'لا توجد محطات في قاعدة البيانات.'")
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "getElementById('username').addEventListener('keydown'" app/src/main/assets/screens/first-user-setup.html
          ! grep -q 'type="number" required min="1" step="1" readonly' app/src/main/assets/screens/first-user-setup.html
          grep -q '.field select:focus' app/src/main/assets/screens/first-user-setup.html
          grep -q "field.id==='phone'" app/src/main/assets/screens/first-user-setup.html
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/screens/first-user-setup.html
          git rm .github/workflows/temporary-first-user-fix.yml
          git commit -m 'fix: first-user setup input and keyboard behavior'
          git push origin HEAD:feature/ai-health-sqlite
