name: Temporary Build Repair
on:
  pull_request:
    branches:
      - feature/ai-health-sqlite
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Kotlin build repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          db = Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt')
          text = db.read_text(encoding='utf-8')

          employee_anchor = 'fun reverseEmployeePaymentRecord(id: Long, stationScopeId: Int, actorId: Long, reason: String): Int {'
          employee_start = text.find(employee_anchor)
          if employee_start < 0:
              raise SystemExit('Expected reverseEmployeePaymentRecord anchor not found')
          employee_window = text[employee_start:employee_start + 1800]
          employee_old = 'db.beginTransaction()\n        try{\n            val row='
          if employee_old not in employee_window:
              raise SystemExit('Expected reverseEmployeePaymentRecord transaction anchor not found')
          employee_window = employee_window.replace(employee_old, 'db.beginTransaction()\n        return try{\n            val row=', 1)
          text = text[:employee_start] + employee_window + text[employee_start + 1800:]

          finance_anchor = 'fun getFinanceIntegritySnapshot(stationScopeId: Int, fromDate: String?, toDate: String?): JSONObject {'
          finance_start = text.find(finance_anchor)
          if finance_start < 0:
              raise SystemExit('Expected getFinanceIntegritySnapshot anchor not found')
          finance_window = text[finance_start:finance_start + 7000]
          finance_old = 'dbLock.lock()\n        try {'
          if finance_old not in finance_window:
              raise SystemExit('Expected getFinanceIntegritySnapshot lock/try anchor not found')
          finance_window = finance_window.replace(finance_old, 'dbLock.lock()\n        return try {', 1)
          text = text[:finance_start] + finance_window + text[finance_start + 7000:]

          old = '    private fun resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): Any {'
          new = '    private fun resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): TraceOrigin {'
          if old not in text:
              raise SystemExit('Expected resolveTraceOrigin return-type anchor not found')
          text = text.replace(old, new, 1)
          db.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          if 'private fun currentDate(): String' not in text:
              anchor = 'class MainActivity : AppCompatActivity() {\n'
              if anchor not in text:
                  raise SystemExit('Expected MainActivity class anchor not found')
              text = text.replace(anchor, anchor + '\n    private fun currentDate(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())\n', 1)
          text = text.replace('getCurrentDate()', 'currentDate()')
          main.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'return try{' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -q 'dbLock.lock()' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -q 'resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): TraceOrigin' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -q 'private fun currentDate(): String' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
      - name: Commit source repairs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git diff --cached --quiet && { echo 'No source repair changes detected'; exit 1; }
          git commit -m 'fix(build): repair Kotlin compilation errors'
          git push origin HEAD:${{ github.head_ref }}
          git rm .github/workflows/build-repair.yml
          git commit -m 'chore(ci): remove temporary build repair workflow'
          git push origin HEAD:${{ github.head_ref }}
      - name: Run Kotlin unit-test compilation
        run: ./gradlew testDebugUnitTest --no-daemon
