name: Temporary Build Repair
on:
  pull_request:
    branches:
      - feature/ai-health-sqlite
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Kotlin build repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          db = Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt')
          text = db.read_text(encoding='utf-8')
          replacements = [
              ('db.beginTransaction()\n        try{\n            val row=', 'db.beginTransaction()\n        return try{\n            val row='),
              ('dbLock.lock(); try { val db=readableDatabase;', 'dbLock.lock(); return try { val db=readableDatabase;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected DatabaseHelper repair anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          old = '    private fun resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): Any {'
          new = '    private fun resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): TraceOrigin {'
          if old not in text:
              raise SystemExit('Expected resolveTraceOrigin return-type anchor not found')
          text = text.replace(old, new, 1)
          db.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          if 'private fun currentDate(): String' not in text:
              anchor = 'class MainActivity : AppCompatActivity() {\n'
              if anchor not in text:
                  raise SystemExit('Expected MainActivity class anchor not found')
              text = text.replace(anchor, anchor + '\n    private fun currentDate(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())\n', 1)
          text = text.replace('getCurrentDate()', 'currentDate()')
          main.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'return try{' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -q 'resolveTraceOrigin(sql: String, contract: SourceTraceContract.Contract, screen: String, type: String): TraceOrigin' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -q 'private fun currentDate(): String' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
      - name: Commit source repairs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git diff --cached --quiet && { echo 'No source repair changes detected'; exit 1; }
          git commit -m 'fix(build): repair Kotlin compilation errors'
          git push origin HEAD:${{ github.head_ref }}
          git rm .github/workflows/build-repair.yml
          git commit -m 'chore(ci): remove temporary build repair workflow'
          git push origin HEAD:${{ github.head_ref }}
      - name: Run Kotlin unit-test compilation
        run: ./gradlew testDebugUnitTest --no-daemon
