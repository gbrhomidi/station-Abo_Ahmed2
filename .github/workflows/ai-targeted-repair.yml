                      elif c == '/' and n == '*': in_block = True; i += 1
                      elif c == '"': in_str = True
                      elif c == "'": in_char = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return text[:brace] + new_body + text[i+1:]
                  i += 1
              raise SystemExit('Unbalanced braces while replacing ' + name)

