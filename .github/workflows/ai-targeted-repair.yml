name: AI Targeted Repair
on:
  push:
    branches: ["feature/ai-health-sqlite"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite

      - name: Verify repository, branch and clean checkout
        run: |
          set -euo pipefail
          test "$(git remote get-url origin)" = "https://github.com/gbrhomidi/station-Abo_Ahmed2.git" || {
            echo "ERROR: wrong origin"; git remote -v; exit 1;
          }
          test "$(git branch --show-current)" = "feature/ai-health-sqlite" || {
            echo "ERROR: wrong branch"; git branch --show-current; exit 1;
          }
          echo "HEAD before repair workflow commit: $(git rev-parse HEAD)"
          echo "HEAD parent: $(git rev-parse HEAD^)"
          test -z "$(git status --porcelain)"
          echo "Working tree is clean after checkout."
          git status --short --branch

      - name: Apply complete users and shifts repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          ROOT = Path('.')
          MAIN = ROOT / 'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt'
          DB = ROOT / 'app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt'
          USERS = ROOT / 'app/src/main/assets/screens/users.html'
          SHIFTS = ROOT / 'app/src/main/assets/screens/shifts.html'

          required = [MAIN, DB, USERS, SHIFTS,
                      ROOT / 'app/src/main/AndroidManifest.xml',
                      ROOT / 'app/build.gradle.kts', ROOT / 'build.gradle.kts',
                      ROOT / 'settings.gradle.kts', ROOT / 'gradle/libs.versions.toml']
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Required project files missing: ' + ', '.join(missing))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, replacement, label, flags=re.S):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return out

          # ---------- users.html ----------
          u = USERS.read_text(encoding='utf-8')
          u_original_len = len(u)

          u = replace_once(
              u,
              '<div class="header-actions"><button class="icon-btn" id="themeBtn" title="تبديل الوضع" aria-label="تبديل الوضع"><i id="themeIcon" class="fas fa-moon"></i></button><button class="icon-btn" onclick="goHome()" title="رجوع"><i class="fas fa-home"></i></button></div>',
              '<div class="header-actions"><button class="icon-btn" id="themeBtn" type="button" title="تبديل الوضع" aria-label="تبديل الوضع"><span id="themeIcon" aria-hidden="true">🌙</span></button><button class="icon-btn" type="button" onclick="goHome()" title="الصفحة الرئيسية" aria-label="الصفحة الرئيسية"><span aria-hidden="true">🏠</span></button></div>',
              'users top icons')

          u = replace_once(
              u,
              '<div class="field"><label>معرف الموظف المرتبط</label><select id="employeeId"><option value="">بدون موظف مرتبط</option></select></div><div class="field"><label>الدور *</label><select id="roleId" required><option value="">اختر الدور</option></select></div>',
              '<div class="field"><label>معرف الموظف المرتبط</label><select id="employeeId" onchange="syncEmployeeDerivedFields()"><option value="">بدون موظف مرتبط</option></select></div><input id="roleId" type="hidden" value="">',
              'users hidden role field')

          u = replace_once(
              u,
              "function fillDepartment(){ $('department').innerHTML='<option value=\"\">اختر القسم</option>'+departments.map(d=>`<option value=\"${esc(d)}\">${esc(d)}</option>`).join('') }function updateJobTitles(selected=''){const list=jobTitlesByDepartment[$('department').value]||[];$('jobTitle').innerHTML='<option value=\"\">اختر المسمى الوظيفي</option>'+list.map(x=>`<option value=\"${esc(x)}\">${esc(x)}</option>`).join('');if(selected)$('jobTitle').value=selected}",
              "function fillDepartment(){const values=[...new Set(state.employees.map(e=>e.department||e.department_name||'').filter(Boolean))];$('department').innerHTML='<option value=\"\">اختر القسم</option>'+values.map(d=>`<option value=\"${esc(d)}\">${esc(d)}</option>`).join('')}function updateJobTitles(selected=''){const employee=state.employees.find(e=>String(e.id)===String($('employeeId').value));const title=selected||employee?.job_title||employee?.jobTitle||'';$('jobTitle').innerHTML=title?`<option value=\"${esc(title)}\">${esc(title)}</option>`:'<option value=\"\">اختر المسمى الوظيفي</option>';if(title)$('jobTitle').value=title}function syncEmployeeDerivedFields(){const employee=state.employees.find(e=>String(e.id)===String($('employeeId').value));if(!employee){setVal('roleId','');return}const department=employee.department||employee.department_name||'';const title=employee.job_title||employee.jobTitle||'';setVal('department',department);updateJobTitles(title);setVal('roleId','')}",
              'users employee/job-title mapping')

          u = replace_once(
              u,
              "function populateModalSelects(){ $('roleId').innerHTML='<option value=\"\">اختر الدور</option>'+state.roles.map(r=>`<option value=\"${esc(r.id)}\">${esc(r.role_name_ar||r.role_name||r.role_code)}</option>`).join('');$('stationId').innerHTML='<option value=\"\">اختر المحطة</option>'+state.stations.map(s=>`<option value=\"${esc(s.id)}\">${esc(s.station_name_ar||s.station_name||s.station_code)}</option>`).join('');$('employeeId').innerHTML='<option value=\"\">بدون موظف مرتبط</option>'+state.employees.map(e=>`<option value=\"${esc(e.id)}\">${esc(e.full_name_ar||e.full_name||e.employee_code)} — ${esc(e.employee_code||e.id)}</option>`).join('') }",
              "function populateModalSelects(){$('stationId').innerHTML='<option value=\"\">اختر المحطة</option>'+state.stations.map(s=>`<option value=\"${esc(s.id)}\">${esc(s.station_name_ar||s.station_name||s.station_code)}</option>`).join('');$('employeeId').innerHTML='<option value=\"\">بدون موظف مرتبط</option>'+state.employees.map(e=>`<option value=\"${esc(e.id)}\">${esc(e.full_name_ar||e.full_name||e.employee_code)} — ${esc(e.employee_code||e.id)}</option>`).join('');fillDepartment()}",
              'users modal selects')

          u = replace_once(
              u,
              "function applyStationSelection(){const s=state.stations.find(x=>String(x.id)===String($('stationId').value));if(!s)return;setVal('branchId',s.branch_id||'');setVal('companyId',s.company_id||'');$('stationMeta').textContent=`المحطة: ${s.station_name_ar||s.station_name||'—'} | الفرع: ${s.branch_name||s.branch_name_ar||s.branch_id||'غير متاح من getStations'} | الشركة: ${s.company_name||s.company_name_ar||s.company_id||'غير متاح من getStations'}`}",
              "function applyStationSelection(){const s=state.stations.find(x=>String(x.id)===String($('stationId').value));if(!s){setVal('branchId','');setVal('companyId','');$('stationMeta').textContent='';return}setVal('branchId',s.branch_id??'');setVal('companyId',s.company_id??'');$('stationMeta').textContent=`المحطة: ${s.station_name_ar||s.station_name||s.station_code||'—'} | الفرع: ${s.branch_id??'غير متاح من SQLite'} | الشركة: ${s.company_id??'غير متاح من SQLite'}`}",
              'users station mapping')

          u = replace_regex(
              u,
              r"function editUser\(id\)\{.*?\}\nfunction autoCopyFields",
              """async function editUser(id){const u=state.users.find(x=>Number(x.id)===Number(id));if(!u)return;clearForm();state.editingId=Number(id);populateModalSelects();$('userModalTitle').innerHTML='<i class=\"fas fa-user-edit\"></i> تعديل مستخدم';$('editUserId').value=id;setVal('userId',id);setVal('username',u.username);$('username').readOnly=true;setVal('fullName',u.full_name);setVal('email',u.email);setVal('phone',u.phone);setVal('nationalId',u.national_id);setVal('passportNumber',u.passport_number);setVal('nationality',u.nationality||'يمني');setVal('gender',u.gender);setVal('birthDate',u.birth_date);setVal('hireDate',u.hire_date);setVal('employeeId',u.employee_id);syncEmployeeDerivedFields();setVal('stationId',u.station_id);setVal('branchId',u.branch_id);setVal('companyId',u.company_id);setVal('status',u.status||'active');setVal('statusReason',u.status_reason);setVal('preferredLanguage',u.preferred_language||'ar');setVal('theme',u.theme||'light');setVal('timezone',u.timezone||'UTC');setVal('dateFormat',u.date_format||'YYYY-MM-DD');setVal('passwordExpiryDays',u.password_expiry_days||90);setVal('passwordExpiryDate',u.password_expiry_date);setVal('sessionTimeout',u.session_timeout||30);setVal('deviceLimit',u.device_limit||3);setVal('twoFactorMethod',u.two_factor_method||'none');setVal('biometricType',u.biometric_type||'none');setVal('lockedUntil',u.locked_until);setVal('failedLoginAttempts',u.failed_login_attempts);setVal('lastPasswordChange',u.last_password_change);setVal('lastLoginAt',u.last_login_at);setVal('lastLoginIp',u.last_login_ip);setVal('lastLoginDevice',u.last_login_device);setVal('deviceId',u.device_id);setVal('emailVerified',u.email_verified?1:0);setVal('phoneVerified',u.phone_verified?1:0);setVal('avatarPath',u.avatar_path);setVal('remarks',u.remarks);setVal('extraData',u.extra_data);setVal('uuidField',u.uuid);setVal('createdAt',u.created_at);setVal('updatedAt',u.updated_at);setVal('deletedAt',u.deleted_at);setVal('createdBy',u.created_by);setVal('updatedBy',u.updated_by);setVal('deletedBy',u.deleted_by);setVal('isDeleted',u.is_deleted);setVal('syncStatus',u.sync_status);setVal('syncVersion',u.sync_version);setVal('syncAt',u.sync_at);setVal('fullNameAr',u.full_name);setVal('displayName',u.username);$('passwordHint').textContent='(اتركها فارغة للإبقاء على القديمة)';$('password').required=false;$('passwordConfirm').required=false;applyStationSelection();if(u.avatar_path){try{const r=await call('getImageDataUrl',[String(u.avatar_path)]);const src=dataOf(r);if(src)$('imagePreview').innerHTML=`<img src=\"${esc(src)}\" alt=\"صورة المستخدم\">`}catch(e){$('fileName').textContent='تعذر قراءة صورة المستخدم: '+e.message}}openModal('userModal');setTimeout(()=>{$('fullName').focus();$('fullName').scrollIntoView({behavior:'smooth',block:'center'})},150)}
function autoCopyFields""",
              'users editUser mapping')

          u = replace_once(
              u,
              "function handleImageFile(input){const f=input.files&&input.files[0];if(!f)return;setVal('avatarPath',f.name);$('fileName').textContent='الملف المحدد: '+f.name;const url=URL.createObjectURL(f);$('imagePreview').innerHTML=`<img src=\"${url}\" alt=\"الصورة المحددة\">`}",
              "function handleImageFile(input){const f=input.files&&input.files[0];if(!f)return;let nativeUri='';try{if(window.AndroidInterface&&typeof window.AndroidInterface.getLastSelectedFileUri==='function')nativeUri=String(window.AndroidInterface.getLastSelectedFileUri()||'').trim()}catch(e){toast('تعذر الحصول على URI للصورة المحددة من Android','error');return}if(!nativeUri){toast('لم يعرض Android مسار/URI للصورة المحددة','error');return}setVal('avatarPath',nativeUri);$('fileName').textContent='المسار الكامل: '+nativeUri;const url=URL.createObjectURL(f);$('imagePreview').innerHTML=`<img src=\"${url}\" alt=\"الصورة المحددة\">`}",
              'users image picker')

          u = replace_once(
              u,
              "preferred_language:'ar'",
              "preferred_language:$('preferredLanguage').value",
              'users preferred language mapping')

          u = replace_once(
              u,
              "must_change_password:1",
              "must_change_password:(state.editingId===0?1:Number(state.users.find(x=>Number(x.id)===Number(state.editingId))?.must_change_password??1))",
              'users must-change-password persistence')

          u = replace_once(
              u,
              "function saveUser(){autoCopyFields();const id=Number($('editUserId').value||0),p=$('password').value,c=$('passwordConfirm').value;if(!$('username').value.trim()||!$('fullName').value.trim()||!$('roleId').value){showFormAlert('اسم المستخدم والاسم الكامل والدور حقول مطلوبة');return}if(id===0&&!p){showFormAlert('كلمة المرور مطلوبة للمستخدم الجديد');return}if(p&&(p.length<6||p!==c)){showFormAlert('تحقق من كلمة المرور وتأكيدها؛ الحد الأدنى 6 أحرف');return}const data=collectUser();if(p)data.password=p;busy(true);try{const r=id?await call('updateUser',[id,JSON.stringify(data)]):await call('addUser',[JSON.stringify(data)]);toast(r.message||'تم حفظ المستخدم بنجاح');closeModal('userModal');await loadUsers()}catch(e){showFormAlert(e.message)}finally{busy(false)}}",
              "function saveUser(){autoCopyFields();const id=Number($('editUserId').value||0),p=$('password').value,c=$('passwordConfirm').value;if(!$('username').value.trim()||!$('fullName').value.trim()||!$('employeeId').value){showFormAlert('اسم المستخدم والاسم الكامل والموظف المرتبط حقول مطلوبة');return}if(id===0&&!p){showFormAlert('كلمة المرور مطلوبة للمستخدم الجديد');return}if(p&&(p.length<6||p!==c)){showFormAlert('تحقق من كلمة المرور وتأكيدها؛ الحد الأدنى 6 أحرف');return}syncEmployeeDerivedFields();const data=collectUser();if(p)data.password=p;busy(true);try{const r=id?await call('updateUser',[id,JSON.stringify(data)]):await call('addUser',[JSON.stringify(data)]);toast(r.message||'تم حفظ المستخدم بنجاح');closeModal('userModal');await loadUsers()}catch(e){showFormAlert(e.message)}finally{busy(false)}}",
              'users validation')

          u = replace_once(
              u,
              "esc(u.role_name_ar||u.role_name||u.role_id||'—')",
              "esc(u.role||u.job_title||u.role_name_ar||u.role_name||u.role_id||'—')",
              'users table role display')

          u = replace_once(
              u,
              "esc(u.role_name_ar||u.role_name||u.role_id)",
              "esc(u.role||u.job_title||u.role_name_ar||u.role_name||u.role_id)",
              'users details role display')

          u = replace_once(
              u,
              "function toggleTheme(){const root=document.documentElement,next=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',next);localStorage.setItem('users-theme',next);$('themeIcon').className=next==='dark'?'fas fa-sun':'fas fa-moon'}",
              "function toggleTheme(){const root=document.documentElement,next=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',next);localStorage.setItem('users-theme',next);$('themeIcon').textContent=next==='dark'?'🌞':'🌙'}",
              'users theme toggle')

          u = replace_once(
              u,
              "$('themeIcon').className=theme==='dark'?'fas fa-sun':'fas fa-moon';$('themeBtn').onclick=toggleTheme",
              "$('themeIcon').textContent=theme==='dark'?'🌞':'🌙';$('themeBtn').onclick=toggleTheme",
              'users theme init')

          USERS.write_text(u, encoding='utf-8')
          if len(u) < u_original_len * 0.90:
              raise SystemExit('users.html became unexpectedly shorter')

          # ---------- shifts.html ----------
          s = SHIFTS.read_text(encoding='utf-8')
          s_original_len = len(s)

          s = replace_once(s, '<span\n                        id="themeIcon"\n                        aria-hidden="true">🌞</span>', '<span\n                        id="themeIcon"\n                        aria-hidden="true">🌙</span>', 'shifts initial theme icon')
          s = replace_once(s, 'theme === "dark" ? "🌙" : "🌞"', 'theme === "dark" ? "🌞" : "🌙"', 'shifts theme mapping')

          # Make the cashier list employee-ID based. The actual SQLite target (employee/user)
          # is resolved in DatabaseHelper according to the real foreign-key schema.
          s = replace_once(
              s,
              'option.value = person.user_id ?? "";\n                        option.dataset.employeeId = person.employee_id ?? person.id ?? "";\n\n                        option.textContent =',
              'option.value = person.id ?? person.employee_id ?? "";\n                        option.dataset.employeeId = person.id ?? person.employee_id ?? "";\n                        option.dataset.persistedId = person.cashier_id ?? person.user_id ?? option.value;\n\n                        option.textContent =',
              'shifts cashier employee id')
          s = replace_regex(
              s,
              r'\n\s*if \(!option\.value\) \{\n\s*option\.disabled = true;\n\s*option\.textContent \+= " — لا يملك حساب مستخدم مرتبطاً";\n\s*\}\n',
              '\n',
              'remove cashier user-account validation UI')
          s = replace_once(
              s,
              'const cashierId = cashier.user_id || cashier.id || "";',
              'const cashierId = cashier.id ?? cashier.employee_id ?? "";',
              'shifts cashier auto selection')

          # Add the required "close open shift" action without disturbing existing controls.
          close_button = '''\n        <button class="btn success" type="button" id="closeOpenShiftBtn" title="إغلاق الوردية المفتوحة">\n            <span aria-hidden="true">🔒</span> إغلاق الوردية المفتوحة\n        </button>\n'''
          s = replace_once(
              s,
              '''        <button\n                class="icon-btn"\n                type="button"\n                onclick="reloadData()"\n                title="تحديث البيانات">\n\n            <i class="fas fa-sync"></i>\n\n        </button>\n''',
              '''        <button\n                class="icon-btn"\n                type="button"\n                onclick="reloadData()"\n                title="تحديث البيانات">\n\n            <i class="fas fa-sync"></i>\n\n        </button>\n''' + close_button,
              'shifts close-open button')

          close_modal = '''\n<div class="overlay" id="openShiftOverlay">\n    <div class="modal">\n        <div class="modal-head">\n            <div>\n                <div class="modal-title">الوردية المفتوحة حالياً</div>\n                <div class="modal-subtitle">بيانات مقروءة مباشرة من SQLite</div>\n            </div>\n            <button class="close" type="button" onclick="closeOpenShiftModal()" aria-label="إغلاق النافذة">×</button>\n        </div>\n        <div class="modal-body">\n            <div class="validation-box" id="openShiftValidation"></div>\n            <div id="openShiftBody" class="shift-grid"></div>\n        </div>\n        <div class="modal-footer">\n            <button class="btn" type="button" onclick="closeOpenShiftModal()">تراجع</button>\n            <button class="btn success" type="button" id="confirmCloseOpenShiftBtn" onclick="confirmCloseOpenShift()">إغلاق</button>\n        </div>\n    </div>\n</div>\n'''
          s = replace_once(s, '</body>', close_modal + '</body>', 'shifts close modal')

          close_js = '''\n<script>\n(function(){\n    function parseCloseResult(raw){\n        if(raw && typeof raw === 'object') return raw;\n        try { return JSON.parse(raw); } catch(e) { return {success:false,error:'استجابة Android غير صالحة'}; }\n    }\n    function closeOpenShiftModal(){\n        const overlay=document.getElementById('openShiftOverlay');\n        if(overlay) overlay.classList.remove('show');\n        document.body.style.overflow='';\n    }\n    async function openCloseOpenShiftModal(){\n        const overlay=document.getElementById('openShiftOverlay'), body=document.getElementById('openShiftBody'), confirm=document.getElementById('confirmCloseOpenShiftBtn');\n        if(!overlay||!body||!confirm) return;\n        body.innerHTML='<div class="empty">جارٍ البحث عن الوردية المفتوحة من SQLite...</div>';\n        confirm.disabled=true;\n        overlay.classList.add('show'); document.body.style.overflow='hidden';\n        try{\n            if(!window.AndroidInterface||typeof window.AndroidInterface.getOpenShiftForManagement!=='function') throw new Error('عقد Android لإغلاق الوردية المفتوحة غير متاح');\n            const result=parseCloseResult(window.AndroidInterface.getOpenShiftForManagement());\n            if(result.success!==true) throw new Error(result.error||result.message||'تعذر العثور على الوردية المفتوحة');\n            const row=result.data||result.shift||result;\n            window.__openShiftManagementId=Number(row.id||row.shift_id||result.shift_id||0);\n            if(!window.__openShiftManagementId) throw new Error('قاعدة البيانات أعادت وردية مفتوحة دون معرف صالح');\n            const labels={shift_code:'رمز الوردية',station_name_ar:'المحطة',station_name:'المحطة',branch_id:'الفرع',company_id:'الشركة',shift_date:'تاريخ الوردية',shift_type:'نوع الوردية',start_time:'وقت البداية',end_time:'وقت النهاية',manager_name_ar:'مدير الوردية',manager_name:'مدير الوردية',cashier_name_ar:'أمين الصندوق',cashier_name:'أمين الصندوق',attendant_names_ar:'العاملون',attendant_names:'العاملون',opening_cash:'النقدية الافتتاحية',opening_bank:'الرصيد البنكي الافتتاحي',opening_credit:'الائتمان الافتتاحي',closing_cash:'النقدية الختامية',closing_bank:'الرصيد البنكي الختامي',closing_credit:'الائتمان الختامي',total_sales:'إجمالي المبيعات',total_fuel_sales:'مبيعات الوقود',total_product_sales:'مبيعات المنتجات',cash_variance:'الانحراف النقدي',status:'الحالة'};\n            const skip=new Set(['id','shift_id','station_id','manager_id','cashier_id','attendant_ids','station_name','station_name_ar','manager_name','manager_name_ar','cashier_name','cashier_name_ar','attendant_names','attendant_names_ar']);\n            const entries=[];\n            Object.keys(row).forEach(k=>{if(skip.has(k)||row[k]===null||row[k]===undefined||row[k]==='')return;entries.push(`<div class="info"><label>${esc(labels[k]||k)}</label><strong>${esc(typeof row[k]==='object'?JSON.stringify(row[k]):row[k])}</strong></div>`)});\n            body.innerHTML=entries.length?entries.join(''):'<div class="empty">لا توجد بيانات تشغيلية متاحة لهذه الوردية.</div>';\n            confirm.disabled=false;\n        }catch(e){\n            body.innerHTML=`<div class="error-state">${esc(e.message||e)}</div>`;\n            window.__openShiftManagementId=0;\n        }\n    }\n    async function confirmCloseOpenShift(){\n        const confirm=document.getElementById('confirmCloseOpenShiftBtn');\n        const id=Number(window.__openShiftManagementId||0);\n        if(!id) return;\n        confirm.disabled=true;\n        try{\n            if(!window.AndroidInterface||typeof window.AndroidInterface.closeOpenShiftForManagement!=='function') throw new Error('عقد Android لإغلاق الوردية غير متاح');\n            const result=parseCloseResult(window.AndroidInterface.closeOpenShiftForManagement());\n            if(result.success!==true) throw new Error(result.error||result.message||'فشل إغلاق الوردية');\n            toast(result.message||'تم إغلاق الوردية فعلياً في SQLite','success');\n            closeOpenShiftModal();\n            if(typeof window.reloadData==='function') await window.reloadData();\n        }catch(e){\n            const box=document.getElementById('openShiftValidation'); if(box){box.textContent=e.message||String(e);box.classList.add('show')}\n            toast(e.message||'فشل إغلاق الوردية','error');\n            confirm.disabled=false;\n        }\n    }\n    window.openCloseOpenShiftModal=openCloseOpenShiftModal;\n    window.closeOpenShiftModal=closeOpenShiftModal;\n    window.confirmCloseOpenShift=confirmCloseOpenShift;\n    document.addEventListener('DOMContentLoaded',function(){\n        const btn=document.getElementById('closeOpenShiftBtn');\n        if(btn) btn.addEventListener('click',openCloseOpenShiftModal);\n    });\n})();\n</script>\n'''
