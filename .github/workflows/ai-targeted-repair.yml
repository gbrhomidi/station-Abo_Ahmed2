name: AI Targeted Repair
on:
  push:
    branches: ["feature/ai-health-sqlite"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite
      - name: Inspect exact persistence paths
        run: |
          set +e
          {
            echo '=== SHIFT HTML CONFIG ==='
            grep -n -B15 -A80 'cashier_id' app/src/main/assets/screens/shifts.html | head -420
            echo '=== SHIFT SAVE/VALIDATION JS ==='
            grep -n -B25 -A90 -E 'function validate|function save|saveShiftRecord|cashier_id' app/src/main/assets/screens/shifts.html | tail -650
            echo '=== MAIN ACTIVITY SHIFT BRIDGE ==='
            sed -n '8170,8305p' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
            echo '=== DATABASE SHIFT SAVE ==='
            sed -n '7570,7725p' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
            echo '=== DATABASE TYPED SHIFT SAVE ==='
            sed -n '8340,8505p' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
            echo '=== FUEL SALE BRIDGE ==='
            sed -n '8290,8370p' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
            echo '=== FUEL SALE DB UPDATE/DELETE ==='
            grep -n -B15 -A80 -E 'fun updateOperationalRecord|fun deleteOperationalRecord|fun updateFuelSale|fun deleteFuelSale' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt | head -700
          } > contract-diagnostics.txt
          cat contract-diagnostics.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ai-persistence-diagnostics
          path: contract-diagnostics.txt
