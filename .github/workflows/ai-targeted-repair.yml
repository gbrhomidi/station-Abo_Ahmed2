name: AI Targeted Repair
on:
  push:
    branches: ["feature/ai-health-sqlite"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite
      - name: Apply targeted repairs
        env:
          BASE: 9d44b850b80d1dfcdca05035030391680ccbe8b4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          BASE=os.environ['BASE']
          p=Path('app/src/main/assets/screens/first-user-setup.html')
          s=subprocess.check_output(['git','show',f'{BASE}:app/src/main/assets/screens/first-user-setup.html'],text=True)
          base_size=len(s.encode('utf-8'))
          s=re.sub(r'(<input[^>]*id=["\']branchId["\'][^>]*?)\s+readonly(?:\s*=\s*["\'][^"\']*["\'])?',r'\1',s,flags=re.I)
          s=re.sub(r'(<input[^>]*id=["\']branchId["\'][^>]*?)\s+disabled(?:\s*=\s*["\'][^"\']*["\'])?',r'\1',s,flags=re.I)
          ui=r'''
          <style id="first-user-setup-final-ui">
          .field:has(#department),.field:has(#jobTitle),.field:has(#stationId),.field:has(#branchId){padding:4px;border-radius:16px}
          #department,#jobTitle,#stationId,#branchId{min-height:50px!important;border-radius:14px!important;border:1.5px solid var(--border)!important;background:#fff!important;padding:10px 14px!important;font-size:.96rem!important;font-weight:700!important;text-align:center!important;outline:none!important;box-shadow:0 3px 10px rgba(0,0,0,.05)!important}
          #department:focus,#jobTitle:focus,#stationId:focus,#branchId:focus{border-color:var(--blue)!important;box-shadow:0 0 0 4px rgba(25,118,184,.14)!important}
          #branchId{cursor:text!important}
          .actions{position:fixed!important;left:50%!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;transform:translateX(-50%) translateZ(0)!important;width:min(560px,calc(100vw - 24px))!important;z-index:2147483647!important;pointer-events:none!important}
          .actions .primary-btn{pointer-events:auto!important;width:100%!important;min-height:52px!important}
          body{padding-bottom:120px!important}
          </style>
          <script id="first-user-setup-final-keyboard">
          (function(){
            function setup(){
              const username=document.getElementById('username'),password=document.getElementById('password');
              if(username&&password&&!username.dataset.enterHandled){username.dataset.enterHandled='1';username.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopPropagation();password.focus();}},true)}
              const phone=document.getElementById('phone');
              if(phone&&!phone.dataset.inputValidated){phone.dataset.inputValidated='1';phone.oninput=function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,20);this.classList.remove('input-error')}}
              const branch=document.getElementById('branchId');
              if(branch){branch.removeAttribute('readonly');branch.removeAttribute('disabled');branch.setAttribute('inputmode','numeric');branch.setAttribute('pattern','[0-9]+')}
              const actions=document.querySelector('.actions'),button=document.getElementById('saveUserBtn')||document.querySelector('.actions .primary-btn');
              if(!actions||!button||!window.visualViewport)return;
              const update=function(){const keyboard=Math.max(0,window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop);actions.style.bottom=(12+keyboard)+'px'};
              window.visualViewport.addEventListener('resize',update);window.visualViewport.addEventListener('scroll',update);window.addEventListener('resize',update);update();
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});else setup();
          })();
          </script>
          '''
          s=s.replace('</head>',ui+'\n</head>')
          if len(s.encode())<base_size*0.95: raise SystemExit('first-user-setup was shortened unexpectedly')
          p.write_text(s,encoding='utf-8')

          lp=Path('app/src/main/assets/screens/login.html')
          if lp.exists(): lp.write_text(lp.read_text(encoding='utf-8').replace('submitBtn.focus();',''),encoding='utf-8')

          up=Path('app/src/main/assets/screens/users.html')
          if up.exists():
              x=up.read_text(encoding='utf-8')
              pattern=r"function handleImageFile\(input\)\{.*?\}\nfunction collectUser"
              replacement="function handleImageFile(input){const f=input.files&&input.files[0];if(!f)return;let nativeUri='';try{if(window.AndroidInterface&&typeof window.AndroidInterface.getLastSelectedFileUri==='function')nativeUri=String(window.AndroidInterface.getLastSelectedFileUri()||'').trim()}catch(e){}setVal('avatarPath',nativeUri||f.name);$('fileName').textContent='الملف المحدد: '+f.name;const url=URL.createObjectURL(f);$('imagePreview').innerHTML=`<img src=\\\"${url}\\\" alt=\\\"الصورة المحددة\\\">`}\nfunction collectUser"
              x,n=re.subn(pattern,replacement,x,count=1)
              if n!=1: raise SystemExit('users.html image handler not found')
              x=x.replace("screens/main.html","../main.html")
              up.write_text(x,encoding='utf-8')

          mp=Path('app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt')
          m=mp.read_text(encoding='utf-8')
          marker='private var pendingFilePathCallback: ValueCallback<Array<Uri>>? = null'
          if 'private var lastSelectedFileUri: String? = null' not in m:
              if marker not in m: raise SystemExit('file chooser marker missing')
              m=m.replace(marker,marker+'\n        private var lastSelectedFileUri: String? = null',1)
          if 'fun getLastSelectedFileUri()' not in m:
              target='@JavascriptInterface\n        fun getStations(): String {'
              if target not in m: raise SystemExit('getStations insertion point missing')
              m=m.replace(target,'@JavascriptInterface\n        fun getLastSelectedFileUri(): String = lastSelectedFileUri.orEmpty()\n\n        @JavascriptInterface\n        fun getStations(): String {',1)
          if 'FLAG_GRANT_PERSISTABLE_URI_PERMISSION' not in m:
              m=m.replace('Intent.ACTION_OPEN_DOCUMENT).apply {','Intent.ACTION_OPEN_DOCUMENT).apply {\n                                            addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)',1)
          if 'lastSelectedFileUri = uri.toString()' not in m:
              m=m.replace('callback.onReceiveValue(results)','results?.firstOrNull()?.let { uri ->\n                    lastSelectedFileUri = uri.toString()\n                    try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: SecurityException) { }\n                }\n                callback.onReceiveValue(results)',1)
          mp.write_text(m,encoding='utf-8')
          print('Targeted repairs applied.')
          PY
      - name: Targeted static verification
        run: |
          set -euo pipefail
          test -s app/src/main/assets/screens/first-user-setup.html
          grep -Fq 'first-user-setup-final-keyboard' app/src/main/assets/screens/first-user-setup.html
          grep -Fq 'first-user-setup-final-ui' app/src/main/assets/screens/first-user-setup.html
          ! grep -Fq 'submitBtn.focus();' app/src/main/assets/screens/login.html
          grep -Fq 'getLastSelectedFileUri' app/src/main/assets/screens/users.html
          grep -Fq 'getLastSelectedFileUri' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'getStations' app/src/main/assets/screens/first-user-setup.html
          grep -Fq 'fun getStations' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun getCustomers' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun getVehicles' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun getLatestCustomerSaleForDelivery' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun saveDeliveryRecord' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun saveShiftRecordTyped' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun updateFuelSaleRecord' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'fun deleteFuelSaleRecord' app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq 'getCustomers' app/src/main/assets/screens/deliveries.html
          grep -Fq 'getLatestCustomerSaleForDelivery' app/src/main/assets/screens/deliveries.html
          grep -Fq 'getVehicles' app/src/main/assets/screens/deliveries.html
          grep -Fq 'getCurrentShift' app/src/main/assets/screens/deliveries.html
          grep -Fq 'saveDeliveryRecord' app/src/main/assets/screens/deliveries.html
          grep -Fq 'cashier_id' app/src/main/assets/screens/shifts.html
          grep -Fq 'getShiftFormContext' app/src/main/assets/screens/shifts.html
          grep -Fq 'saveFuelSaleRecord' app/src/main/assets/screens/fuel-sales.html
          grep -Fq 'updateFuelSaleRecord' app/src/main/assets/screens/fuel-sales.html
          grep -Fq 'deleteFuelSaleRecord' app/src/main/assets/screens/fuel-sales.html
          grep -Fq 'getLastSelectedFileUri' app/src/main/assets/screens/users.html
          echo 'Targeted static verification PASS.'
      - name: Regression tests
        run: |
          set -euo pipefail
          for t in employee-department-job-title-runtime-test.js employee-management-contract-test.js activity-bridge-contract-regression-test.js activity-log-database-bridge-regression-test.js ai-assistant-dom-lifecycle-regression-test.js; do
            [ ! -f "$t" ] || node "$t"
          done
      - name: Gradle tests and release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Station_Abo_Ahmed_Release_APK_verified
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
      - name: Review diff, commit and push
        run: |
          set -euo pipefail
          git diff --check
          echo '--- STATUS ---'
          git status --short
          echo '--- DIFF STAT ---'
          git diff --stat
          rm -f .github/workflows/ai-targeted-repair.yml
          git add app/src/main/assets/screens/first-user-setup.html app/src/main/assets/screens/login.html app/src/main/assets/screens/users.html app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "fix: complete requested WebView and SQLite flows"
          git push origin HEAD:feature/ai-health-sqlite
