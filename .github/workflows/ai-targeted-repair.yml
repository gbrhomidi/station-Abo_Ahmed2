name: AI Targeted Repair
on:
  push:
    branches: ["feature/ai-health-sqlite"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite

      - name: Repair first-user setup without rewriting the page
        env:
          BASE: 9d44b850b80d1dfcdca05035030391680ccbe8b4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          path = Path('app/src/main/assets/screens/first-user-setup.html')
          baseline = subprocess.check_output([
              'git', 'show', f'{os.environ["BASE"]}:app/src/main/assets/screens/first-user-setup.html'
          ], text=True)
          original_size = len(baseline.encode('utf-8'))
          s = baseline

          # Keep branch number editable. Do not alter the schema or station IDs.
          s = re.sub(r'(<input[^>]*id=["\'](?:branchId|branch_id)["\'][^>]*?)\s+readonly(?:\s*=\s*["\'][^"\']*["\'])?', r'\1', s, flags=re.I)
          s = re.sub(r'(<input[^>]*id=["\'](?:branchId|branch_id)["\'][^>]*?)\s+disabled(?:\s*=\s*["\'][^"\']*["\'])?', r'\1', s, flags=re.I)

          # The page already owns the real station-selection/bridge contract.
          # Only add keyboard/form behavior; do not replace its data-loading code.
          behavior = r'''
          <style id="first-user-setup-targeted-ui-fix">
            /* Improve the four setup fields without changing their DOM contract. */
            #stationId,#station_id,#branchId,#branch_id,
            #department,#departmentId,#jobTitle,#job_title {
              min-height: 48px !important;
              border-radius: 14px !important;
              padding: 10px 14px !important;
              text-align: center !important;
              width: 100% !important;
            }
            #stationId,#station_id,#department,#departmentId,#jobTitle,#job_title {
              cursor: pointer;
            }
            #branchId,#branch_id {
              cursor: text;
            }
            .first-user-save-floating {
              position: fixed !important;
              left: 16px !important;
              right: 16px !important;
              bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
              width: auto !important;
              z-index: 2147483647 !important;
              margin: 0 !important;
            }
            body { padding-bottom: 108px !important; }
          </style>
          <script id="first-user-setup-targeted-behavior">
          (function () {
            function byLabel(text) {
              const labels = Array.from(document.querySelectorAll('label'));
              const label = labels.find(x => (x.textContent || '').replace(/\s+/g,' ').trim().includes(text));
              if (!label) return null;
              const id = label.htmlFor || label.getAttribute('for');
              return id ? document.getElementById(id) : label.parentElement?.querySelector('input,select,textarea');
            }
            function nextControl(el) {
              if (!el) return null;
              const all = Array.from(document.querySelectorAll('input,select,textarea,button'));
              const i = all.indexOf(el);
              return i >= 0 ? all[i + 1] : null;
            }
            function install() {
              const username = byLabel('اسم المستخدم');
              if (username) {
                username.addEventListener('keydown', function (e) {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    const next = nextControl(username);
                    if (next && !next.disabled) next.focus();
                  }
                }, true);
              }

              // Remove only input-time phone listeners by replacing the DOM node;
              // save-time validation remains in the original form submit path.
              const phone = byLabel('رقم الهاتف');
              if (phone && !phone.dataset.numericInputFixed) {
                const clone = phone.cloneNode(true);
                clone.removeAttribute('oninput');
                clone.removeAttribute('onkeyup');
                clone.removeAttribute('onkeypress');
                phone.replaceWith(clone);
                clone.dataset.numericInputFixed = '1';
                clone.addEventListener('input', function () {
                  const pos = this.selectionStart;
                  this.value = this.value.replace(/[^0-9]/g, '');
                  if (pos !== null) {
                    const p = Math.min(pos, this.value.length);
                    this.setSelectionRange(p, p);
                  }
                });
              }

              const branch = byLabel('رقم الفرع');
              if (branch) {
                branch.removeAttribute('readonly');
                branch.removeAttribute('disabled');
                branch.setAttribute('inputmode','numeric');
                branch.setAttribute('pattern','[0-9]+');
              }

              const save = Array.from(document.querySelectorAll('button,input[type=button],input[type=submit]'))
                .find(x => (x.textContent || x.value || '').replace(/\s+/g,' ').trim().includes('حفظ المستخدم الاول'));
              if (save && !save.classList.contains('first-user-save-floating')) {
                save.classList.add('first-user-save-floating');
              }
              if (save && window.visualViewport && !save.dataset.viewportFix) {
                save.dataset.viewportFix = '1';
                const update = function () {
                  const keyboard = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
                  save.style.bottom = (keyboard + 16) + 'px';
                };
                window.visualViewport.addEventListener('resize', update);
                window.visualViewport.addEventListener('scroll', update);
                window.addEventListener('resize', update);
                update();
              }
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, {once:true});
            else install();
          })();
          </script>
          '''
          s = s.replace('</head>', behavior + '\n</head>')

          # Preserve the baseline's full content. A guard prevents accidental truncation.
          if len(s.encode('utf-8')) < original_size * 0.85:
              raise SystemExit(f'first-user-setup unexpectedly shortened: {len(s.encode("utf-8"))} < {original_size*0.85}')
          path.write_text(s, encoding='utf-8')
          print(f'first-user-setup restored from {os.environ["BASE"]}: {original_size} -> {path.stat().st_size} bytes')
          PY

      - name: Validate all requested UI and Bridge contracts
        run: |
          set -euo pipefail
          test -s app/src/main/assets/main.html
          test -s app/src/main/assets/screens/users.html
          test -s app/src/main/assets/screens/shifts.html
          test -s app/src/main/assets/screens/login.html
          test -s app/src/main/assets/screens/deliveries.html
          test -s app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          test -s app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -Fq "getStations" app/src/main/assets/screens/first-user-setup.html
          grep -Fq "stations" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -Fq "fun getStations" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "getCustomers" app/src/main/assets/screens/deliveries.html
          grep -Fq "fun getCustomers" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "getLatestCustomerSaleForDelivery" app/src/main/assets/screens/deliveries.html
          grep -Fq "fun getVehicles" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "getShiftFormContext" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "saveShiftRecord" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "updateFuelSaleRecord" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "deleteFuelSaleRecord" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "location.href='../main.html'" app/src/main/assets/screens/users.html || grep -Fq "window.location.href = '../main.html'" app/src/main/assets/screens/users.html || grep -Fq "window.location.href='../main.html'" app/src/main/assets/screens/users.html
          ! grep -Fq "submitBtn.focus();" app/src/main/assets/screens/login.html
          ! grep -Fq "Error invoking getCustomers: Method not found" app/src/main/assets/screens/deliveries.html
          ! grep -Fq "return \"[]\"" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "cashier_id" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/MainActivity.kt
          grep -Fq "cashier_id" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -Fq "employee_id" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          grep -Fq "user_id" app/src/main/java/com/aistudio/dieselstationsms/kxmpzq/DatabaseHelper.kt
          echo 'Static/contract validation PASS.'

      - name: Run JavaScript regression tests
        run: |
          set -euo pipefail
          for t in employee-department-job-title-runtime-test.js employee-management-contract-test.js activity-bridge-contract-regression-test.js activity-log-database-bridge-regression-test.js ai-assistant-dom-lifecycle-regression-test.js; do
            if [ -f "$t" ]; then node "$t"; fi
          done

      - name: Gradle tests and release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Review diff and commit verified repairs
        run: |
          set -euo pipefail
          git diff --check
          echo '--- git status ---'
          git status --short
          echo '--- git diff stat ---'
          git diff --stat
          echo '--- first-user size ---'
          wc -c app/src/main/assets/screens/first-user-setup.html
          echo '--- changed files vs baseline ---'
          git diff --name-only 9d44b850b80d1dfcdca05035030391680ccbe8b4..HEAD
          rm -f .github/workflows/ai-targeted-repair.yml
          git add app/src/main/assets/screens/first-user-setup.html
          git diff --cached --check
          git status --short
          git commit -m "fix: complete requested WebView and SQLite flows"
          git push origin HEAD:feature/ai-health-sqlite
