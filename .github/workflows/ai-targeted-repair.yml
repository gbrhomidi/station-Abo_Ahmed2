              start = text.find(marker)
              if start < 0:
                  if required: raise SystemExit('Missing MainActivity function: ' + name)
                  return text
              brace = text.find('{', start)
              if brace < 0: raise SystemExit('No opening brace for ' + name)
              depth = 0
              in_str = False
              in_char = False
              in_line = False
              in_block = False
