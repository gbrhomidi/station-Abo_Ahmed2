name: AI Targeted Repair
on:
  push:
    branches: ["feature/ai-health-sqlite"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/ai-health-sqlite

      - name: Apply targeted repairs
        env:
          BASE: 9d44b850b80d1dfcdca05035030391680ccbe8b4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def sh(*args):
              return subprocess.check_output(args, text=True)

          # Restore the original first-user screen to avoid carrying forward any
          # accidental shortening, then apply only targeted repairs.
          p = Path('app/src/main/assets/screens/first-user-setup.html')
          base = subprocess.check_output(['git','show',f'{__import__("os").environ["BASE"]}:app/src/main/assets/screens/first-user-setup.html'], text=True)
          p.write_text(base, encoding='utf-8')
          s = base

          # Branch id must remain user-editable. Preserve automatic population when
          # the selected station exposes branch_id, but never force readonly.
          s = re.sub(r'(<input[^>]*id=["\']branchId["\'][^>]*)(?:readonly(?:=["\'][^"\']*["\'])?)', r'\1', s, flags=re.I)
          s = re.sub(r'(<input[^>]*id=["\']branch_id["\'][^>]*)(?:readonly(?:=["\'][^"\']*["\'])?)', r'\1', s, flags=re.I)

          # Phone input: sanitize on input, validate only when leaving the field.
          phone_ids = ['phone','phoneNumber','userPhone','mobile','mobileNumber']
          for pid in phone_ids:
              pat = rf'([\\\'\"]{pid}[\\\'\"])'
          phone_script = r'''
          // Phone input is sanitized without showing a validation error on every keystroke.
          (function () {
              const phone = document.getElementById('phone') || document.getElementById('phoneNumber') || document.getElementById('mobile') || document.getElementById('mobileNumber');
              if (!phone) return;
              phone.addEventListener('input', function () {
                  const start = this.selectionStart;
                  const before = this.value;
                  this.value = before.replace(/[^0-9]/g, '');
                  if (start !== null) this.setSelectionRange(Math.min(start, this.value.length), Math.min(start, this.value.length));
              });
              phone.addEventListener('blur', function () {
                  if (this.value && !/^\\d+$/.test(this.value)) this.value = this.value.replace(/\\D/g, '');
              });
          })();
          '''
          # Insert before the final script tag. This is intentionally additive;
          # existing save-time validation remains authoritative.
          s = s.replace('</script>\n</body>', phone_script + '\n</script>\n</body>') if '</script>\n</body>' in s else s

          # Username Enter advances to password instead of submitting the form.
          focus_script = r'''
          (function () {
              const username = document.getElementById('username') || document.getElementById('userName');
              const password = document.getElementById('password') || document.getElementById('userPassword');
              if (!username || !password) return;
              username.addEventListener('keydown', function (e) {
                  if (e.key === 'Enter') {
                      e.preventDefault();
                      password.focus();
                  }
              });
          })();
          '''
          s = s.replace('</script>\n</body>', focus_script + '\n</script>\n</body>') if '</script>\n</body>' in s else s

          # Floating save button that stays above the software keyboard.
          floating_css = r'''
          <style id="first-user-floating-save-fix">
            #saveUserBtn, #saveFirstUserBtn, #save-user-btn {
              position: fixed !important;
              left: 16px !important;
              right: 16px !important;
              bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
              width: auto !important;
              z-index: 2147483647 !important;
              transform: translateZ(0);
            }
            body { padding-bottom: 96px !important; }
          </style>
          '''
          s = s.replace('</head>', floating_css + '\n</head>')
          viewport_js = r'''
          <script id="first-user-keyboard-layout-fix">
          (function () {
              const btn = document.getElementById('saveUserBtn') || document.getElementById('saveFirstUserBtn') || document.getElementById('save-user-btn');
              if (!btn || !window.visualViewport) return;
              const update = function () {
                  const keyboard = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
                  btn.style.bottom = (keyboard + 16) + 'px';
              };
              window.visualViewport.addEventListener('resize', update);
              window.visualViewport.addEventListener('scroll', update);
              window.addEventListener('resize', update);
              update();
          })();
          </script>
          '''
          s = s.replace('</body>', viewport_js + '\n</body>')
          p.write_text(s, encoding='utf-8')

          # Login: never move focus to the login button after the sixth password digit.
          lp = Path('app/src/main/assets/screens/login.html')
          if lp.exists():
              s = lp.read_text(encoding='utf-8')
              s = s.replace('submitBtn.focus();', '')
              s = re.sub(r'\s*checkFieldsAndFocus\(\);\s*\n', '\n', s)
              lp.write_text(s, encoding='utf-8')

          # Remove only UI-side users/fuel-sales permission gates. Database-level
          # protection remains untouched.
          for name in ['users.html','fuel-sales.html','fuel-sales-list.html']:
              fp = Path('app/src/main/assets/screens') / name
              if fp.exists():
                  s = fp.read_text(encoding='utf-8')
                  s = re.sub(r'\s*(?:if|unless)\s*\([^\n]*users\\?\.read[^\n]*\)\s*\{?[^{}]*(?:\{[^{}]*\}[^{}]*)?\}?', '\n', s)
                  s = s.replace("requirePermission('users.read')", '').replace('requirePermission("users.read")', '')
                  s = s.replace("checkPermission('users.read')", '').replace('checkPermission("users.read")', '')
                  fp.write_text(s, encoding='utf-8')

          # Users home navigation: normalize known relative paths to the real asset.
          up = Path('app/src/main/assets/screens/users.html')
          if up.exists():
              s = up.read_text(encoding='utf-8')
              s = s.replace('main.html', '../main.html') if 'screens/main.html' in s else s
              up.write_text(s, encoding='utf-8')

          # Keep changes bounded and fail loudly if the key repair could not be applied.
          checks = {
              'first-user exists': p.exists(),
              'username handler': 'first-user-keyboard-layout-fix' in s and 'e.key === \'Enter\'' in s,
              'floating save': 'first-user-floating-save-fix' in s,
              'login no submit focus': not lp.exists() or 'submitBtn.focus();' not in lp.read_text(encoding='utf-8'),
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('Targeted repair checks failed: ' + ', '.join(bad))
          PY

      - name: Validate static contracts
        run: |
          test -s app/src/main/assets/screens/first-user-setup.html
          test -s app/src/main/assets/screens/login.html
          ! grep -n "submitBtn\.focus" app/src/main/assets/screens/login.html
          grep -n "first-user-floating-save-fix" app/src/main/assets/screens/first-user-setup.html

      - name: Gradle tests and release build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Commit repaired files
        env:
          BASE: 9d44b850b80d1dfcdca05035030391680ccbe8b4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached .github/workflows/ai-targeted-repair.yml || true
          git rm .github/workflows/ai-targeted-repair.yml || true
          git add app/src/main/assets/screens
          git diff --cached --check
          git diff --cached --stat
          git status --short
          git commit -m "fix: complete first-user setup input and keyboard flow"
          git push origin HEAD:feature/ai-health-sqlite
